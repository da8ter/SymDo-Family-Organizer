const DISSOLVE_MS = 300;
function dissolveCard(card, done) {
  const finish = () => { if (done) done(); };
  if (!card) { finish(); return; }
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    card.style.display = 'none'; finish(); return;
  }
  // HÖHE einklappen, nicht Breite: die Artikel stehen als Zeilen untereinander
  // (früher Pillen in einem umbrechenden Raster, da war die Breite richtig).
  // margin-bottom mit auf 0, sonst bliebe der Zeilenabstand als Lücke stehen.
  const size = card.offsetHeight;
  card.style.height = size + 'px';
  card.style.overflow = 'hidden';
  void card.offsetHeight; // Reflow erzwingen, sonst faellt die Zeile ohne Uebergang zusammen
  card.style.transition = `height ${DISSOLVE_MS}ms cubic-bezier(.4,0,.2,1),`
    + ` margin-bottom ${DISSOLVE_MS}ms cubic-bezier(.4,0,.2,1),`
    + ` opacity ${Math.round(DISSOLVE_MS * 0.8)}ms ease,`
    + ` filter ${Math.round(DISSOLVE_MS * 0.8)}ms ease,`
    + ` transform ${Math.round(DISSOLVE_MS * 0.8)}ms ease`;
  card.style.opacity = '0';
  card.style.filter = 'blur(7px)';
  card.style.transform = 'scale(.96)';
  card.style.height = '0px';
  card.style.marginBottom = '0px';
  window.setTimeout(finish, DISSOLVE_MS);
}

function bindCardHandlers() {
  document.querySelectorAll('.item-card[data-id]').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target && e.target.closest('.item-edit-btn, .item-side')) return;
      if (card.dataset.swiped === '1') return; // swipe gesture, not a tap
      const id = card.getAttribute('data-id');
      if (!id || card.dataset.animating === '1') return;
      card.dataset.animating = '1';
      if (card.classList.contains('in-cart')) {
        card.classList.add('is-moving-to-list');
      } else {
        card.classList.add('is-moving-to-cart');
      }
      window.setTimeout(() => requestAction('ToggleCart', id), 300);
    });
    bindCardSwipe(card);
  });
  document.querySelectorAll('.item-edit-btn[data-edit-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = (state.items || []).find(i => i.id === btn.getAttribute('data-edit-id'));
      if (item) openEditOverlay(item);
    });
  });
  document.querySelectorAll('.item-card .item-fav-heart[data-fav-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = (state.items || []).find(i => i.id === btn.getAttribute('data-fav-id'));
      if (item) openEditOverlay(item, true);
    });
  });
  document.querySelectorAll('.item-card [data-amount-edit]').forEach(badge => {
    badge.addEventListener('click', (e) => {
      // Ohne stopPropagation legte der Klick den Artikel zugleich in den Wagen.
      e.stopPropagation();
      const item = (state.items || []).find(i => String(i.id) === badge.getAttribute('data-amount-edit'));
      if (!item) return;
      openEditOverlay(item, false);
      var field = document.getElementById('editAmount');
      if (field) { field.focus(); field.select(); }
    });
  });
  document.querySelectorAll('.item-card [data-step]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const card = btn.closest('.item-card');
      const id = card && card.getAttribute('data-id');
      const item = (state.items || []).find(i => i.id === id);
      if (!item) return;
      const next = Math.max(1, (parseInt(item.amount) || 1) + parseInt(btn.dataset.step, 10));
      requestAction('UpdateItem', JSON.stringify({ id: item.id, name: item.name, amount: String(next), notes: item.notes || '', category: item.category || '' }));
    });
  });
}

// Swipe-left-to-delete on an item card
function bindCardSwipe(card) {
  const content = card.querySelector('.item-card-content');
  if (!content) return;
  const id = card.getAttribute('data-id');

  let startX = 0, startY = 0, dx = 0;
  let active = false, decided = false, pointerId = null;
  const SLOP      = 8;   // px before a gesture direction is decided
  const THRESHOLD = 64;  // px pull-left required to trigger delete

  const onDown = (e) => {
    if (e.target.closest('.item-edit-btn')) return;        // leave edit button alone
    if (card.dataset.animating === '1') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    active = true; decided = false;
    startX = e.clientX; startY = e.clientY; dx = 0;
    pointerId = e.pointerId;
    content.classList.add('is-dragging');
  };

  const onMove = (e) => {
    if (!active || e.pointerId !== pointerId) return;
    const mx = e.clientX - startX;
    const my = e.clientY - startY;
    if (!decided) {
      if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return;
      if (Math.abs(my) >= Math.abs(mx)) { active = false; content.classList.remove('is-dragging'); return; }
      decided = true;
      try { content.setPointerCapture(pointerId); } catch (_) {}
    }
    dx = Math.max(-content.offsetWidth, Math.min(content.offsetWidth, mx)); // both directions
    content.style.transform = `translateX(${dx}px)`;
    card.classList.toggle('dragging-left', dx < 0);
    card.classList.toggle('dragging-right', dx > 0);
    card.classList.toggle('swipe-armed', dx <= -THRESHOLD);
    card.classList.toggle('edit-armed', dx >= THRESHOLD);
  };

  const onUp = (e) => {
    if (!active) return;
    const wasDecided = decided;
    active = false; decided = false;
    content.classList.remove('is-dragging');
    try { content.releasePointerCapture(pointerId); } catch (_) {}
    if (wasDecided && dx <= -THRESHOLD) {
      card.classList.remove('dragging-left', 'dragging-right', 'edit-armed');
      card.dataset.animating = '1';
      card.classList.add('is-deleting');
      content.style.transform = 'translateX(-110%)';
      dissolveCard(card, () => requestAction('DeleteItem', id));
    } else if (wasDecided && dx >= THRESHOLD) {
      content.style.transform = '';
      card.classList.remove('swipe-armed', 'edit-armed', 'dragging-left', 'dragging-right');
      const item = (state.items || []).find(i => i.id === id);
      if (item) openEditOverlay(item);
    } else {
      content.style.transform = '';
      card.classList.remove('swipe-armed', 'edit-armed', 'dragging-left', 'dragging-right');
    }
    if (wasDecided) { // suppress the click that follows a horizontal drag
      card.dataset.swiped = '1';
      window.setTimeout(() => { delete card.dataset.swiped; }, 60);
    }
  };

  content.addEventListener('pointerdown', onDown);
  content.addEventListener('pointermove', onMove);
  content.addEventListener('pointerup', onUp);
  content.addEventListener('pointercancel', onUp);
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const items         = Array.isArray(state.items) ? state.items : [];
  const categoryOrder = Array.isArray(state.categoryOrder) ? state.categoryOrder : [];

  const scannerBtn = document.getElementById('btnOpenScanner');
  if (scannerBtn) {
    scannerBtn.style.display = (state.scannerEnabled === false) ? 'none' : '';
  }

  const activeItems = items.filter(i => !i.inCart);
  const cartItems   = items.filter(i =>  i.inCart);

  document.getElementById('emptyState').style.display =
    (activeItems.length === 0 && cartItems.length === 0) ? 'flex' : 'none';

  // Active items grouped by category
  const grouped = {};
  for (const item of activeItems) {
    const cat = item.category || translate('Miscellaneous');
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(item);
  }
  const orderedCats = [];
  for (const cat of categoryOrder) {
    if (grouped[cat]?.length) orderedCats.push(cat);
  }
  for (const cat of Object.keys(grouped)) {
    if (!orderedCats.includes(cat)) orderedCats.push(cat);
  }

  let activeHtml = '';
  for (const cat of orderedCats) {
    const catItems = grouped[cat] || [];
    if (!catItems.length) continue;
    catItems.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'de', { sensitivity: 'base' }));
    activeHtml += `<div class="section-header">${escapeHtml(cat)}</div><div class="item-grid">`;
    for (const item of catItems) activeHtml += buildItemCard(item, false);
    activeHtml += '</div>';
  }
  document.getElementById('activeItems').innerHTML = activeHtml;
  document.getElementById('activeActions').style.display = activeItems.length ? '' : 'none';

  // Cart bulk-add button: visible only when ext-API cart is ready and at least one open market item exists
  const cartBtn = document.getElementById('btnCartBulk');
  if (cartBtn) {
    const hasMarketItem = activeItems.some(i => i.marketItem === true && i.listingId);
    cartBtn.style.display = (state.extApiCartReady === true && hasMarketItem) ? '' : 'none';
    if (!cartBtn.disabled) cartBtn.textContent = translate('Add to cart');
  }

  // Zuletzt benutzt (cart) section
  const cartSection = document.getElementById('cartSection');
  if (!cartItems.length) {
    cartSection.style.display = 'none';
  } else {
    cartSection.style.display = '';
    // Eingeklappt/ausgeklappt nur im Speicher und beim Start eingeklappt — genau wie
    // cartExpanded in der Web-App. Nichts Gespeichertes: der Wagen ist eine
    // Momentaufnahme, kein Zustand, den man ueber Sitzungen mitschleppen will.
    const toggle = document.getElementById('cartToggle');
    toggle.classList.toggle('open', cartExpanded);
    document.getElementById('cartHeader').textContent = translate('Recently used');
    document.getElementById('cartCount').textContent = cartItems.length;
    const grid = document.getElementById('cartItems');
    grid.style.display = cartExpanded ? '' : 'none';
    let cartHtml = '';
    if (cartExpanded) { for (const item of cartItems) cartHtml += buildItemCard(item, true); }
    grid.innerHTML = cartHtml;
  }

  bindCardHandlers();

  // Refresh fav dropdown in edit overlay if open
  if (document.getElementById('editOverlay').classList.contains('open')) {
    const favSection = document.getElementById('editFavSection');
    if (favSection.style.display !== 'none') populateEditFavList();
  }

  // Refresh fav overlay if open
  if (document.getElementById('favOverlay').classList.contains('open')) {
    if (editingFavItem) {
      // Don't clobber the edit form
    } else if (viewingListId) {
      const list = (state.favoriteLists || []).find(l => l.id === viewingListId);
      if (list) {
        renderFavDetailBody(list);
      } else {
        showFavListView(); // list was deleted
      }
    } else {
      renderFavListBody();
    }
  }
}

// ── Suggestions dropdown ───────────────────────────────────────────────────
/* Das Fenster erscheint erst ab dem ERSTEN Zeichen — bei leerem Feld gar nicht.
   Vorher zeigte der Fokus allein schon die haeufigsten Vorschlaege; das verdeckte die
   Liste, bevor der Nutzer etwas gesucht hat.
   Die Entscheidung faellt an EINER Stelle: renderSuggestions() baut die Chips und
   meldet, ob etwas uebrig blieb — leer heisst zu, auch wenn die Eingabe nur nicht
   passt. */
function openSuggestions() {
  const treffer = renderSuggestions();
  const feld = document.getElementById('searchInput');
  const hatEingabe = (feld.value || '').trim().length > 0;
  document.getElementById('suggestionsDropdown')
    .classList.toggle('open', hatEingabe && treffer > 0);
}

function closeSuggestions() {
  document.getElementById('suggestionsDropdown').classList.remove('open');
}

function renderSuggestions() {
  const query    = (document.getElementById('searchInput').value || '').trim();
  const q        = query.toLowerCase();
  const favNames = getFavNames();
  const suggestions = Array.isArray(state.suggestions) ? state.suggestions : [];

  const activeNames = new Set(
    (state.items || []).filter(i => !i.inCart).map(i => i.name.toLowerCase())
  );

  let filtered = suggestions.filter(s => !activeNames.has(s.name.toLowerCase()));
  if (q) filtered = filtered.filter(s => s.name.toLowerCase().includes(q));

  // Rangfolge der Treffer. Gefiltert wird weiter nach Teilzeichenfolge — sonst fielen
  // sinnvolle Treffer weg („Babymilch" bei „mi") —, aber die Reihenfolge stellt das
  // Passende nach vorn:
  //   0  der Name BEGINNT mit der Eingabe          „mi" -> Milch
  //   1  ein WORT im Namen beginnt damit           „käse" -> geriebener Käse
  //   2  die Eingabe steckt irgendwo drin          „app" -> Putzlappen
  // Gemessen an 540 Vorschlaegen: „a" trifft 257 per Teilzeichenfolge, aber nur 17
  // beginnen damit; „app" trifft ausschliesslich „Putzlappen". Ohne Rangfolge stand
  // genau das oben.
  const rang = (name) => {
    if (!q) return 0;
    const n = name.toLowerCase();
    if (n.startsWith(q)) return 0;
    if (n.replace(/[-/(),.]/g, ' ').split(' ').some(w => w.startsWith(q))) return 1;
    return 2;
  };
  filtered.sort((a, b) => {
    const ra = rang(a.name), rb = rang(b.name);
    if (ra !== rb) return ra - rb;
    // Favoriten vor dem Rest (Verhalten der Kachel)
    const fa = favNames.has(a.name.toLowerCase()) ? 0 : 1;
    const fb = favNames.has(b.name.toLowerCase()) ? 0 : 1;
    if (fa !== fb) return fa - fb;
    // Haeufigkeit wie in der Web-App: was oft gekauft wird, steht vorn
    const ha = a.frequency || 0, hb = b.frequency || 0;
    if (ha !== hb) return hb - ha;
    return String(a.name).localeCompare(String(b.name), 'de', { sensitivity: 'base' });
  });

  // Deckel wie in der Web-App. Ohne ihn baute die Kachel bei leerem Feld alle 540
  // Vorschlaege in den Baum, sichtbar sind rund 40.
  filtered = filtered.slice(0, SUGGESTION_LIMIT);

  // Kein „Hinzufügen: …"-Chip mehr. Er war der einzige Weg, den getippten Text auf die
  // Liste zu setzen — seit es den Plus-Knopf und die Eingabetaste gibt, ist er doppelt.
  // Die Web-App hat an dieser Stelle ebenfalls keinen.
  let html = '';

  for (const s of filtered) {
    const isFav = favNames.has(s.name.toLowerCase());
    const chipImgUrl = getProductImageUrl(s.name, s.imageUrl);
    const chipImg = chipImgUrl ? `<img class="chip-img" src="${escapeHtml(chipImgUrl)}" alt="" loading="lazy" />` : '';
    html += `<div class="chip-pill">`
      + `<button class="chip-label-btn" data-name="${escapeHtml(s.name)}" data-category="${escapeHtml(s.category)}" title="${escapeHtml(s.name)}">`
      + chipImg + `<span class="chip-label-text">` + escapeHtml(s.name) + `</span></button>`
      + `<button class="chip-heart-btn${isFav ? ' is-fav' : ''}" `
      + `data-heart-name="${escapeHtml(s.name)}" data-heart-cat="${escapeHtml(s.category)}">`
      + (isFav ? HEART_FILLED : HEART_EMPTY) + `</button>`
      + `</div>`;
  }

  const container = document.getElementById('suggestionChips');
  container.innerHTML = html;
  // Passt die Eingabe zu nichts, bleibt das Fenster zu (openSuggestions entscheidet
  // danach). Hinzufuegen geht dann ueber den Plus-Knopf oder die Eingabetaste.
  const treffer = container.querySelectorAll('.chip-pill').length;

  container.querySelectorAll('.chip-label-btn[data-name]').forEach(btn => {
    btn.addEventListener('click', () => {
      requestAction('AddItem', JSON.stringify({ name: btn.getAttribute('data-name'), category: btn.getAttribute('data-category'), amount: '' }));
      document.getElementById('searchInput').value = '';
      closeSuggestions();
    });
  });

  container.querySelectorAll('.chip-heart-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeSuggestions();
      openEditOverlay({ id: null, name: btn.getAttribute('data-heart-name'), category: btn.getAttribute('data-heart-cat'), amount: '', notes: '' }, true);
    });
  });

  return treffer;
}

// ── Favorite list overlay ──────────────────────────────────────────────────
function openFavOverlay() {
  closePrintOverlay();
  favOverlayMode = 'load-list';
  viewingListId  = null;
  editingFavItem = null;
  document.getElementById('favOverlayTitle').textContent = translate('Favorite lists');
  document.getElementById('newFavListForm').classList.remove('visible');
  document.getElementById('newFavListInput').value = '';
  document.getElementById('btnNewFavList').textContent = '+';
  document.getElementById('btnNewFavList').style.display = '';
  document.getElementById('btnFavRenameList').style.display = 'none';
  document.getElementById('favRenameForm').style.display = 'none';
  document.getElementById('favDetailFooter').style.display = 'none';
  document.getElementById('favEditFooter').style.display = 'none';
  document.getElementById('favBackFooter').style.display = '';
  renderFavListBody();
  document.getElementById('favOverlay').classList.add('open');
  setActiveTab('fav');
}

function closeFavOverlay() {
  document.getElementById('favOverlay').classList.remove('open');
  setActiveTab('list');
  favOverlayMode = null;
  viewingListId  = null;
  editingFavItem = null;
}

function showFavDetail(listId) {
  viewingListId  = listId;
  editingFavItem = null;
  const list = (state.favoriteLists || []).find(l => l.id === listId);
  if (!list) return;
  document.getElementById('favOverlayTitle').textContent = list.name;
  document.getElementById('btnNewFavList').style.display = 'none';
  document.getElementById('btnFavRenameList').style.display = '';
  document.getElementById('favRenameForm').style.display = 'none';
  document.getElementById('newFavListForm').classList.remove('visible');
  document.getElementById('favEditFooter').style.display = 'none';
  document.getElementById('favBackFooter').style.display = 'none';
  document.getElementById('favDetailFooter').style.display = '';
  renderFavDetailBody(list);
}

function showFavListView() {
  viewingListId = null;
  document.getElementById('favOverlayTitle').textContent = translate('Favorite lists');
  document.getElementById('btnNewFavList').textContent = '+';
  document.getElementById('btnNewFavList').style.display = '';
  document.getElementById('btnFavRenameList').style.display = 'none';
  document.getElementById('favRenameForm').style.display = 'none';
  document.getElementById('favDetailFooter').style.display = 'none';
  document.getElementById('favEditFooter').style.display = 'none';
  document.getElementById('favBackFooter').style.display = '';
  renderFavListBody();
}

function openFavItemEdit(listId, item) {
  editingFavItem = { listId, originalName: item.name, category: item.category || '' };
  document.getElementById('favOverlayTitle').textContent = item.name;
  document.getElementById('btnNewFavList').style.display = 'none';
  document.getElementById('btnFavRenameList').style.display = 'none';
  document.getElementById('favRenameForm').style.display = 'none';
  document.getElementById('newFavListForm').classList.remove('visible');
  document.getElementById('favDetailFooter').style.display = 'none';
  document.getElementById('favBackFooter').style.display = 'none';
  document.getElementById('favEditFooter').style.display = '';
  const body = document.getElementById('favListBody');
  body.innerHTML = '<div class="edit-form">'
    + `<input type="text" class="edit-input" id="favEditName" placeholder="${escapeHtml(translate('Name'))}" autocomplete="off" />`
    + `<input type="text" class="edit-input" id="favEditAmount" placeholder="${escapeHtml(translate('Quantity (e.g. 2x)'))}" autocomplete="off" />`
    + `<textarea class="edit-input" id="favEditNotes" placeholder="${escapeHtml(translate('Note'))}" rows="3"></textarea>`
    + '</div>';
  document.getElementById('favEditName').value   = item.name   || '';
  document.getElementById('favEditAmount').value = item.amount || '';
  document.getElementById('favEditNotes').value  = item.notes  || '';
  document.getElementById('favEditName').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveFavItemEdit(); });
  document.getElementById('favEditAmount').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveFavItemEdit(); });
  document.getElementById('favEditNotes').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveFavItemEdit(); }
  });
  document.getElementById('favEditName').focus({ preventScroll: true });
}

function closeFavItemEdit() {
  editingFavItem = null;
  if (viewingListId) {
    showFavDetail(viewingListId);
  } else {
    showFavListView();
  }
}

function saveFavItemEdit() {
  if (!editingFavItem) return;
  const newName = (document.getElementById('favEditName').value || '').trim();
  const amount  = (document.getElementById('favEditAmount').value || '').trim();
  const notes   = (document.getElementById('favEditNotes').value || '').trim();
  if (!newName) return;
  requestAction('UpdateFavoriteItem', JSON.stringify({
    listId:   editingFavItem.listId,
    oldName:  editingFavItem.originalName,
    newName:  newName,
    category: editingFavItem.category,
    amount:   amount,
    notes:    notes,
  }));
  closeFavItemEdit();
}

function renderFavListBody() {
  const lists = Array.isArray(state.favoriteLists) ? state.favoriteLists : [];
  const body  = document.getElementById('favListBody');

  if (!lists.length) {
    body.innerHTML = `<div class="fav-empty">${escapeHtml(translate('No lists available'))}</div>`;
    return;
  }

  let html = '';
  for (const list of lists) {
    const count = Array.isArray(list.items) ? list.items.length : 0;
    html += `<div class="fav-list-item" data-list-id="${escapeHtml(list.id)}">`
      + `<span class="fav-list-name">${escapeHtml(list.name)}</span>`
      + `<span class="fav-list-count">${count} ${escapeHtml(translate('Items'))}</span>`
      + `</div>`;
  }
  body.innerHTML = html;

  body.querySelectorAll('.fav-list-item[data-list-id]').forEach(el => {
    el.addEventListener('click', () => {
      const listId = el.getAttribute('data-list-id');
      showFavDetail(listId);
    });
  });
}

function openFavRename() {
  const list = (state.favoriteLists || []).find(l => l.id === viewingListId);
  if (!list) return;
  const form  = document.getElementById('favRenameForm');
  const input = document.getElementById('favRenameInput');
  input.value = list.name;
  form.style.display = 'flex';
  input.focus({ preventScroll: true });
  input.select();
}

function confirmFavRename() {
  const newName = (document.getElementById('favRenameInput').value || '').trim();
  if (!newName || !viewingListId) return;
  requestAction('RenameFavoriteList', JSON.stringify({ listId: viewingListId, newName }));
  document.getElementById('favRenameForm').style.display = 'none';
}

function renderFavDetailBody(list) {
  // Keep title in sync with current list name (e.g. after rename)
  document.getElementById('favOverlayTitle').textContent = list.name;
  const body  = document.getElementById('favListBody');
  const items = Array.isArray(list.items) ? list.items : [];

  let html = `<div class="search-bar fav-detail-search" id="favDetailSearchBar">`
    + `<div class="search-row">`
    + `<input type="search" class="search-input" id="favDetailSearchInput" `
    + `placeholder="${escapeHtml(translate('Add item…'))}" autocomplete="off" />`
    + `</div>`
    + `<div class="suggestions-dropdown" id="favDetailSuggestionsDropdown">`
    + `<div class="chip-row" id="favDetailSuggestionChips"></div>`
    + `</div>`
    + `</div>`;

  if (!items.length) {
    html += `<div class="fav-empty">${escapeHtml(translate('List is empty'))}</div>`;
  }

  for (const item of items) {
    const nameHtml = buildTitleHtml(item.name, item.amount || '');
    const notesHtml = (item.notes || '').trim() ? `<span class="fav-detail-notes">${escapeHtml(item.notes)}</span>` : '';
    const favImgUrl = getProductImageUrl(item.name, item.imageUrl);
    const favImg = favImgUrl ? `<img class="fav-detail-img" src="${escapeHtml(favImgUrl)}" alt="" loading="lazy" />` : '';
    html += `<div class="fav-detail-item">`
      + favImg
      + `<span class="fav-detail-name">${nameHtml}${notesHtml}</span>`
      // Einen EINZELNEN Artikel auf die Einkaufsliste setzen — bisher gab es hier
      // nur „alles in den Einkauf" für die ganze Liste. Der Stift bleibt: anders als
      // in der Web-App gibt es in dieser Kachel keine Wischgeste als zweiten Weg zum
      // Bearbeiten, ein Ersetzen würde die Funktion also verschlucken.
      + `<button class="fav-detail-cart" data-add-name="${escapeHtml(item.name)}" data-add-cat="${escapeHtml(item.category || '')}" data-add-amount="${escapeHtml(String(item.amount || '1'))}" aria-label="Auf die Einkaufsliste"><i class="fa-light fa-cart-plus"></i></button>`
      + `<button class="fav-detail-pencil" data-edit-list="${escapeHtml(list.id)}" data-edit-name="${escapeHtml(item.name)}" aria-label="Bearbeiten"><i class="fa-light fa-pencil"></i></button>`
      + `<button class="fav-detail-heart" data-list-id="${escapeHtml(list.id)}" data-item-name="${escapeHtml(item.name)}" aria-label="Entfernen">${HEART_FILLED}</button>`
      + `</div>`;
  }
  body.innerHTML = html;

  const searchBar = document.getElementById('favDetailSearchBar');
  const searchInput = document.getElementById('favDetailSearchInput');
  const dropdown = document.getElementById('favDetailSuggestionsDropdown');
  const chips = document.getElementById('favDetailSuggestionChips');

  const addToFavoriteList = (name, category) => {
    const cleanName = (name || '').trim();
    if (!cleanName) return;
    requestAction('AddItemToFavoriteList', JSON.stringify({
      listId: list.id,
      name: cleanName,
      category: (category || '').trim(),
      amount: '',
      notes: ''
    }));
    searchInput.value = '';
    dropdown.classList.remove('open');
    searchInput.focus({ preventScroll: true });
  };

  const renderFavDetailSuggestions = () => {
    const query = (searchInput.value || '').trim();
    const q = query.toLowerCase();
    const suggestions = Array.isArray(state.suggestions) ? state.suggestions : [];
    const existingNames = new Set((list.items || []).map(i => (i.name || '').toLowerCase()));

    let filtered = suggestions.filter(s => !existingNames.has((s.name || '').toLowerCase()));
    if (q) {
      filtered = filtered.filter(s => (s.name || '').toLowerCase().includes(q));
    }

    const exactMatch = filtered.some(s => (s.name || '').toLowerCase() === q);

    let htmlChips = '';
    if (q && !exactMatch) {
      htmlChips += `<button class="chip add-custom" data-custom="${escapeHtml(query)}">`
        + `${escapeHtml(translate('Add') + ': ' + query)}</button>`;
    }

    for (const s of filtered) {
      const chipImgUrl = getProductImageUrl(s.name, s.imageUrl);
      const chipImg = chipImgUrl ? `<img class="chip-img" src="${escapeHtml(chipImgUrl)}" alt="" loading="lazy" />` : '';
      htmlChips += `<button class="chip" data-name="${escapeHtml(s.name)}" data-category="${escapeHtml(s.category || '')}" title="${escapeHtml(s.name)}">`
        + `${chipImg}<span class="chip-label-text">${escapeHtml(s.name)}</span></button>`;
    }

    chips.innerHTML = htmlChips;

    chips.querySelectorAll('.chip[data-custom]').forEach(btn => {
      btn.addEventListener('click', () => addToFavoriteList(btn.getAttribute('data-custom') || '', ''));
    });

    chips.querySelectorAll('.chip[data-name]').forEach(btn => {
      btn.addEventListener('click', () => addToFavoriteList(
        btn.getAttribute('data-name') || '',
        btn.getAttribute('data-category') || ''
      ));
    });
  };

  searchInput.addEventListener('focus', () => {
    renderFavDetailSuggestions();
    dropdown.classList.add('open');
  });
  searchInput.addEventListener('input', () => {
    renderFavDetailSuggestions();
    dropdown.classList.add('open');
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addToFavoriteList(searchInput.value || '', '');
    }
  });

  if (favDetailDocClickHandler) {
    document.removeEventListener('click', favDetailDocClickHandler);
  }
  favDetailDocClickHandler = (e) => {
    if (!searchBar.contains(e.target)) {
      dropdown.classList.remove('open');
    }
  };
  document.addEventListener('click', favDetailDocClickHandler);

  body.querySelectorAll('.fav-detail-pencil').forEach(btn => {
    btn.addEventListener('click', () => {
      const listId   = btn.getAttribute('data-edit-list');
      const itemName = btn.getAttribute('data-edit-name');
      const listObj  = (state.favoriteLists || []).find(l => l.id === listId);
      if (!listObj) return;
      const itemObj  = (listObj.items || []).find(i => i.name === itemName);
      if (!itemObj) return;
      openFavItemEdit(listId, itemObj);
    });
  });

  body.querySelectorAll('.fav-detail-cart').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.getAttribute('data-add-name');
      requestAction('AddItem', JSON.stringify({
        name:     name,
        category: btn.getAttribute('data-add-cat') || '',
        amount:   btn.getAttribute('data-add-amount') || '1',
      }));
      // Zeilenbild suchen: es steht als Geschwister vor dem Knopf.
      flyToListTab(btn.closest('.fav-detail-item') ?
        btn.closest('.fav-detail-item').querySelector('.fav-detail-img') : null);
      // Steht der Artikel schon offen auf der Liste, führt der Server zusammen und
      // erhöht die Menge, statt eine Dublette anzulegen — die Meldung sagt das.
      const open = (state.items || [])
        .filter(i => !i.inCart)
        .map(i => String(i.name || '').trim().toLowerCase());
      showFavToast(open.indexOf(String(name).trim().toLowerCase()) >= 0
        ? `„${name}“: Menge erhöht`
        : `„${name}“ auf die Einkaufsliste gesetzt`);
    });
  });

  body.querySelectorAll('.fav-detail-heart').forEach(btn => {
    btn.addEventListener('click', () => {
      requestAction('RemoveItemFromFavoriteList', JSON.stringify({
        listId: btn.getAttribute('data-list-id'),
        name:   btn.getAttribute('data-item-name'),
      }));
    });
  });
}

/**
 * Laesst das Produktbild kurz aufhuepfen und dann zur Einkaufsliste in der unteren
 * Leiste fliegen. Rein visuell — der requestAction ist da schon raus.
 *
 * Anders als in der SymDo-Oberflaeche gibt es hier keinen Einkaufen-Tab: Ziel ist
 * #navTabList, hinter dem die Liste liegt, die gerade befuellt wird.
 *
 * Der Klon haengt an <body>, nicht an der Zeile: die Favoritenansicht wird beim
 * naechsten State-Push neu gebaut, ein Kind der Zeile waere mittendrin weg.
 */
function flyToListTab(imgEl) {
  if (!imgEl || typeof imgEl.animate !== 'function') return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var target = document.getElementById('navTabList');
  if (!target) return;

  var from = imgEl.getBoundingClientRect();
  if (from.width === 0 || from.height === 0) return;
  var to = target.getBoundingClientRect();

  var ghost = imgEl.cloneNode(true);
  ghost.className = 'fly-ghost';
  ghost.style.left = from.left + 'px';
  ghost.style.top = from.top + 'px';
  ghost.style.width = from.width + 'px';
  ghost.style.height = from.height + 'px';
  document.body.appendChild(ghost);

  var dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  var dy = (to.top + to.height / 2) - (from.top + from.height / 2);

  var anim = ghost.animate([
    { transform: 'translate(0px, 0px) scale(1)', opacity: 1, offset: 0 },
    { transform: 'translate(0px, -12px) scale(1.3)', opacity: 1, offset: 0.22 },
    { transform: 'translate(0px, 0px) scale(1.05)', opacity: 1, offset: 0.34 },
    { transform: 'translate(' + (dx * 0.55) + 'px, ' + (dy * 0.28) + 'px) scale(0.8)', opacity: 0.95, offset: 0.7 },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(0.22)', opacity: 0.15, offset: 1 }
  ], { duration: 700, easing: 'cubic-bezier(.4,.05,.3,1)' });

  // Netz gegen Karteileichen, falls die Animation abgebrochen wird.
  var cleanup = setTimeout(function () { ghost.remove(); }, 1400);
  anim.finished.then(function () {
    clearTimeout(cleanup);
    ghost.remove();
    if (typeof target.animate === 'function') {
      target.animate([
        { transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(1)' }
      ], { duration: 260, easing: 'ease-out' });
    }
  }).catch(function () { clearTimeout(cleanup); ghost.remove(); });
}

/**
 * Kurze Rückmeldung am unteren Rand. Ein einzelnes, wiederverwendetes Element mit
 * eigenem Zeitgeber — bei schnellem Nacheinander soll die neue Meldung die alte
 * ersetzen, statt dass sich Elemente stapeln.
 */
let favToastTimer = null;
function showFavToast(text) {
  let el = document.getElementById('favToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'favToast';
    el.className = 'fav-toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  // Neustart der Einblendung erzwingen, sonst bleibt .show bei Folgemeldungen stehen
  // und die Bewegung fällt aus.
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  if (favToastTimer) clearTimeout(favToastTimer);
  favToastTimer = setTimeout(() => { el.classList.remove('show'); }, 2200);
}

function confirmNewFavList() {
  const input = document.getElementById('newFavListInput');
  const name  = input.value.trim();
  if (!name) return;
  requestAction('CreateFavoriteList', JSON.stringify({ name }));
  input.value = '';
  document.getElementById('newFavListForm').classList.remove('visible');
}

// ── Barcode scanner ────────────────────────────────────────────────────────
function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  } catch (e) {}
}

function validateBarcode(code) {
  return /^\d{8,14}$/.test(String(code || '').trim());
}

function syncScannerAddedNames() {
  if (!scannerAddedNames.size) return;
  const activeNames = new Set(
    (state.items || [])
      .filter(i => !i.inCart && i.name)
      .map(i => String(i.name).toLowerCase())
  );
  for (const name of Array.from(scannerAddedNames)) {
    if (!activeNames.has(name)) {
      scannerAddedNames.delete(name);
    }
  }
}

function showScannerResult(title, type, meta) {
  const el = document.getElementById('scannerResult');
  if (!el) return;
  if (scannerResultHideTimer) {
    clearTimeout(scannerResultHideTimer);
    scannerResultHideTimer = 0;
  }
  const parts = [title || ''];
  if (meta) parts.push(meta);
  const text = parts.filter(Boolean).join(' · ');
  el.textContent = text;
  el.className = 'scanner-result';
  if (!text) {
    return;
  }
  if (type === 'error') {
    el.classList.add('error');
  }
  el.classList.add('show');
  scannerResultHideTimer = setTimeout(() => {
    const current = document.getElementById('scannerResult');
    if (!current) return;
    current.textContent = '';
    current.className = 'scanner-result';
    scannerResultHideTimer = 0;
  }, 3000);
}

function pauseScanning() {
  if (scannerAnimationFrame) {
    cancelAnimationFrame(scannerAnimationFrame);
    scannerAnimationFrame = 0;
  }
  if (scannerQuaggaTimer) {
    clearTimeout(scannerQuaggaTimer);
    scannerQuaggaTimer = 0;
  }
  scannerQuaggaActive = false;
}

function stopScanner() {
  if (scannerAnimationFrame) {
    cancelAnimationFrame(scannerAnimationFrame);
    scannerAnimationFrame = 0;
  }
  if (scannerQuaggaTimer) {
    clearTimeout(scannerQuaggaTimer);
    scannerQuaggaTimer = 0;
  }
  if (scannerResumeTimer) {
    clearTimeout(scannerResumeTimer);
    scannerResumeTimer = 0;
  }
  if (scannerResultHideTimer) {
    clearTimeout(scannerResultHideTimer);
    scannerResultHideTimer = 0;
  }
  scannerWarmupUntil = 0;
  scannerQuaggaActive = false;
  if (scannerStream) {
    scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
  }
  const video = document.getElementById('scannerVideo');
  if (video) video.srcObject = null;
}

function closeScannerOverlay() {
  scannerSessionId += 1;
  stopScanner();
  scannerAddedNames.clear();
  showScannerResult('', '', '');
  document.getElementById('scannerOverlay').classList.remove('open');
  setActiveTab('list');
}

function resumeScanning(delayMs) {
  const sessionId = scannerSessionId;
  if (scannerResumeTimer) {
    clearTimeout(scannerResumeTimer);
  }
  scannerResumeTimer = setTimeout(() => {
    if (sessionId !== scannerSessionId) return;
    scannerResumeTimer = 0;
    lastCode = '';
    pauseScanning();
    const status = document.getElementById('scannerStatus');
    const video = document.getElementById('scannerVideo');
    if (!scannerStream || !video) return;
    showScannerResult('', '', '');
    status.textContent = translate('Scanning…');
    status.className = 'scanner-status';
    if (scannerDetector) {
      startNativeScanning(video, status, sessionId);
    } else if (window.Quagga) {
      startQuaggaFrameScanning(video, status, sessionId);
    }
  }, delayMs);
}

function onBarcodeDetected(code, sessionId) {
  if (sessionId !== scannerSessionId) return;
  if (Date.now() < scannerWarmupUntil) return;
  if (!validateBarcode(code) || code === lastCode) return;
  lastCode = code;
  pauseScanning();
  playBeep();
  const status = document.getElementById('scannerStatus');
  status.textContent = translate('Found') + ': ' + code;
  status.className = 'scanner-status success';
  showScannerResult(code, '', '');
  lookupBarcode(code, sessionId);
}

function startNativeScanning(video, status, sessionId) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let detectErrorCount = 0;
  const loop = () => {
    if (sessionId !== scannerSessionId) return;
    if (!scannerStream || !scannerDetector) return;
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      scannerDetector.detect(canvas)
        .then(codes => {
          if (sessionId !== scannerSessionId) return;
          if (!scannerStream) return;
          detectErrorCount = 0;
          if (codes && codes.length) {
            const raw = String(codes[0].rawValue || '').trim();
            onBarcodeDetected(raw, sessionId);
          }
        })
        .catch((err) => {
          detectErrorCount += 1;
          console.warn('[scanner] BarcodeDetector.detect failed:', err);
          // Auf Android schlägt detect() teils permanent fehl → Fallback auf Quagga
          if (detectErrorCount >= 3 && sessionId === scannerSessionId) {
            scannerDetector = null;
            if (scannerAnimationFrame) {
              cancelAnimationFrame(scannerAnimationFrame);
              scannerAnimationFrame = 0;
            }
            status.textContent = translate('Loading decoder…');
            ensureQuaggaLoaded()
              .then(() => {
                if (sessionId !== scannerSessionId || !scannerStream) return;
                status.textContent = translate('Scanning…');
                status.className = 'scanner-status';
                startQuaggaFrameScanning(video, status, sessionId);
              })
              .catch(() => {
                status.textContent = translate('Decoder could not be loaded');
                status.className = 'scanner-status error';
              });
          }
        });
    }
    scannerAnimationFrame = requestAnimationFrame(loop);
  };
  loop();
}

function ensureQuaggaLoaded() {
  if (window.Quagga) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-quagga="1"]');
    if (existing) {
      existing.addEventListener('load', () => resolve());
      existing.addEventListener('error', () => reject(new Error('load failed')));
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js';
    script.async = true;
    script.setAttribute('data-quagga', '1');
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(script);
  });
}

function startQuaggaFrameScanning(video, status, sessionId) {
  if (sessionId !== scannerSessionId) return;
  if (!window.Quagga || !scannerStream) return;
  scannerQuaggaActive = true;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const scanOnce = () => {
    if (sessionId !== scannerSessionId) return;
    if (!scannerQuaggaActive || !scannerStream) return;
    if (video.readyState < 2) {
      scannerQuaggaTimer = setTimeout(scanOnce, 200);
      return;
    }
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    const SCAN_W = 800;
    const scale = SCAN_W / vw;
    canvas.width = SCAN_W;
    canvas.height = Math.round(vh * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    try {
      Quagga.decodeSingle({
        src: canvas.toDataURL('image/jpeg', 0.8),
        numOfWorkers: 0,
        locate: true,
        locator: { patchSize: 'medium', halfSample: true },
        decoder: {
          readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'code_128_reader'],
          multiple: false
        }
      }, (result) => {
        if (sessionId !== scannerSessionId) return;
        if (result && result.codeResult && result.codeResult.code) {
          onBarcodeDetected(result.codeResult.code, sessionId);
        }
        if (scannerQuaggaActive) {
          scannerQuaggaTimer = setTimeout(scanOnce, 400);
        }
      });
    } catch (err) {
      console.warn('[scanner] Quagga.decodeSingle threw:', err);
      if (scannerQuaggaActive) {
        scannerQuaggaTimer = setTimeout(scanOnce, 500);
      }
    }
  };

  status.textContent = translate('Scanning…');
  status.className = 'scanner-status';
  scanOnce();
}

function openScannerOverlay() {
  closeSuggestions();
  closeFavOverlay();
  closePrintOverlay();
  scannerSessionId += 1;
  const sessionId = scannerSessionId;
  const overlay = document.getElementById('scannerOverlay');
  const status = document.getElementById('scannerStatus');
  const result = document.getElementById('scannerResult');
  const videoWrap = document.getElementById('scannerVideoWrap');
  const video = document.getElementById('scannerVideo');
  overlay.classList.add('open');
  setActiveTab('list');
  lastCode = '';
  scannerWarmupUntil = 0;
  scannerAddedNames.clear();
  result.textContent = '';
  result.className = 'scanner-result';
  videoWrap.style.display = '';

  status.textContent = translate('Scanning…');
  status.className = 'scanner-status';

  const canUseCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const canUseNative = !!window.BarcodeDetector;
  const isSecure = !!window.isSecureContext;
  const inIframe = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  if (!canUseCamera) {
    videoWrap.style.display = 'none';
    if (!isSecure) {
      status.textContent = translate('Camera requires HTTPS');
    } else {
      status.textContent = translate('Camera not available');
    }
    status.className = 'scanner-status error';
    return;
  }

  const waitForVideoReady = (videoEl) => new Promise((resolve) => {
    if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
      resolve();
      return;
    }
    const onReady = () => {
      videoEl.removeEventListener('loadedmetadata', onReady);
      videoEl.removeEventListener('canplay', onReady);
      resolve();
    };
    videoEl.addEventListener('loadedmetadata', onReady);
    videoEl.addEventListener('canplay', onReady);
  });

  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  })
    .then((stream) => {
      scannerStream = stream;
      video.srcObject = stream;
      const playPromise = video.play();
      return (playPromise && playPromise.catch) ? playPromise.catch(() => {}) : playPromise;
    })
    .then(() => waitForVideoReady(video))
    .then(async () => {
      scannerWarmupUntil = Date.now() + 900;
      scannerDetector = null;
      if (canUseNative) {
        try {
          let supported = [];
          if (typeof BarcodeDetector.getSupportedFormats === 'function') {
            supported = await BarcodeDetector.getSupportedFormats();
          }
          const wanted = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
          const formats = supported.length ? wanted.filter(f => supported.includes(f)) : wanted;
          if (formats.length) {
            scannerDetector = new BarcodeDetector({ formats });
          } else {
            console.warn('[scanner] BarcodeDetector reports no supported formats – falling back to Quagga');
          }
        } catch (e) {
          console.warn('[scanner] BarcodeDetector init failed:', e);
          scannerDetector = null;
        }
      }

      if (scannerDetector) {
        startNativeScanning(video, status, sessionId);
      } else {
        status.textContent = translate('Loading decoder…');
        ensureQuaggaLoaded()
          .then(() => {
            if (sessionId !== scannerSessionId) return;
            if (!scannerStream) return;
            status.textContent = translate('Scanning…');
            status.className = 'scanner-status';
            startQuaggaFrameScanning(video, status, sessionId);
          })
          .catch((err) => {
            console.warn('[scanner] Quagga load failed:', err);
            if (sessionId !== scannerSessionId) return;
            status.textContent = translate('Decoder could not be loaded');
            status.className = 'scanner-status error';
          });
      }
    })
    .catch((err) => {
      console.warn('[scanner] camera init failed:', err);
      videoWrap.style.display = 'none';
      const name = (err && err.name) ? err.name : '';
      let msg;
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        msg = inIframe
          ? translate('Camera blocked by iframe policy')
          : translate('Camera permission denied');
      } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        msg = translate('No camera found');
      } else if (name === 'NotReadableError') {
        msg = translate('Camera is used by another app');
      } else {
        msg = translate('Camera not available') + (name ? ' (' + name + ')' : '');
      }
      status.textContent = msg;
      status.className = 'scanner-status error';
    });
}

function applyBarcodeLookupResult(code, name, bestCat, sessionId, price, listingId, imageUrl) {
  if (sessionId !== scannerSessionId) return;
  const status = document.getElementById('scannerStatus');
  const trimName = (name || code).trim();
  const nameKey = trimName.toLowerCase();
  const existing = (state.items || []).find(i => !i.inCart && i.name.toLowerCase() === nameKey);
  const alreadyScanned = scannerAddedNames.has(nameKey);
  // Still treat as duplicate unless we can enrich the existing item (backfill category/price/listingId/imageUrl)
  const canEnrich = existing && ((!existing.category && bestCat) || (!existing.price && price) || (!existing.listingId && listingId) || (!existing.imageUrl && imageUrl));
  if ((existing || alreadyScanned) && !canEnrich) {
    status.textContent = '\u2713 ' + trimName + ' (' + translate('already in list') + ')';
    status.className = 'scanner-status success';
    showScannerResult('\u2713 ' + trimName, 'duplicate', translate('already in list'));
    resumeScanning(1500);
    return;
  }
  const label = price ? (price + '  ' + trimName) : trimName;
  status.textContent = '\u2713 ' + label;
  status.className = 'scanner-status success';
  showScannerResult('\u2713 ' + label, '', bestCat);
  addScannedProduct(trimName, bestCat, price || '', listingId || '', imageUrl || '');
}

function matchLocalCategory(offCats) {
  const local = new Set();
  for (const cat of (state.categoryOrder || [])) local.add(cat);
  for (const item of (state.items || [])) {
    if (item.category) local.add(item.category);
  }
  if (!local.size || !offCats.length) return offCats[0] || '';
  for (const oc of offCats) {
    const ocL = oc.toLowerCase();
    for (const lc of local) {
      if (lc.toLowerCase() === ocL) return lc;
    }
  }
  for (const oc of offCats) {
    const ocL = oc.toLowerCase();
    for (const lc of local) {
      const lcL = lc.toLowerCase();
      if (ocL.includes(lcL) || lcL.includes(ocL)) return lc;
    }
  }
  return '';
}

function lookupBarcodeOpenFoodFacts(code) {
  return fetch('https://de.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?lc=de')
    .then(r => r.json())
    .then(data => {
      if (!data || data.status !== 1 || !data.product) return null;
      const p = data.product;
      const name = p.product_name_de || p.product_name || p.brands || code;
      const offCats = (p.categories || '').split(',').map(c => c.trim()).filter(Boolean);
      return { name, bestCat: matchLocalCategory(offCats) };
    });
}

function parseOpenGtinDbResponse(text) {
  if (!text) return null;
  const flat = text.replace(/\r?\n/g, ' ').replace(/---/g, ' ').trim();
  const data = {};
  const re = /([a-z_]+)=([\s\S]*?)(?=\s+[a-z_]+=|$)/gi;
  let m;
  while ((m = re.exec(flat)) !== null) {
    data[m[1].toLowerCase()] = m[2].trim();
  }
  if (!Object.keys(data).length || data.error !== '0') return null;
  return data;
}

function lookupBarcodeOpenGtinDb(code) {
  const url = 'https://opengtindb.org/api.php?ean=' + encodeURIComponent(code) + '&cmd=query&queryid=400000000';
  return fetch(url)
    .then(r => r.text())
    .then(text => {
      const data = parseOpenGtinDbResponse(text);
      if (!data) return null;
      const name = data.detailname || data.name || code;
      const cats = [data.maincat || '', data.subcat || ''].map(c => c.trim()).filter(Boolean);
      return { name, bestCat: matchLocalCategory(cats) };
    });
}

function lookupBarcodeExtApi(code) {
  if (!state.extApiEnabled || !window.__extApiHookUrl) return Promise.resolve(null);
  return fetch(window.__extApiHookUrl + encodeURIComponent(code))
    .then(r => r.json())
    .then(data => {
      if (!data || data.error) return null;
      const name = data.name || '';
      if (!name) return null;
      const cats = (data.category || '').split('/').map(c => c.trim()).filter(Boolean);
      return {
        name,
        bestCat: matchLocalCategory(cats),
        price: data.price || '',
        listingId: data.listingId || '',
        imageUrl: data.imageUrl || ''
      };
    })
    .catch(() => null);
}

function lookupBarcode(code, sessionId) {
  if (sessionId !== scannerSessionId) return;
  const status = document.getElementById('scannerStatus');
  status.textContent = translate('Looking up product…');
  status.className = 'scanner-status';

  lookupBarcodeExtApi(code)
    .then(product => product || lookupBarcodeOpenFoodFacts(code).catch(() => null))
    .then(product => product || lookupBarcodeOpenGtinDb(code).catch(() => null))
    .then(product => {
      if (sessionId !== scannerSessionId) return;
      if (product) {
        applyBarcodeLookupResult(code, product.name, product.bestCat, sessionId, product.price || '', product.listingId || '', product.imageUrl || '');
      } else {
        status.textContent = translate('Product not found') + ' (' + code + ')';
        status.className = 'scanner-status error';
        showScannerResult(translate('Product not found'), 'error', code);
        resumeScanning(2000);
      }
    })
    .catch(() => {
      if (sessionId !== scannerSessionId) return;
      status.textContent = translate('Lookup failed') + ' (' + code + ')';
      status.className = 'scanner-status error';
      showScannerResult(translate('Lookup failed'), 'error', code);
      resumeScanning(2000);
    });
}

function getActiveItemsGrouped() {
  const items = (state.items || []).filter(i => !i.inCart);
  const categoryOrder = Array.isArray(state.categoryOrder) ? state.categoryOrder : [];
  const grouped = {};
  for (const item of items) {
    const cat = item.category || translate('Miscellaneous');
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(item);
  }
  const ordered = [];
  for (const cat of categoryOrder) {
    if (grouped[cat]?.length) ordered.push({ cat, items: grouped[cat] });
  }
  for (const cat of Object.keys(grouped)) {
    if (!ordered.some(o => o.cat === cat)) ordered.push({ cat, items: grouped[cat] });
  }
  return ordered;
}

function buildPrintHtml(mode) {
  const groups = getActiveItemsGrouped();
  const total = groups.reduce((n, g) => n + g.items.length, 0);
  const date = new Date().toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const baseUrl = window.location.origin || '';

  let body = '';
  if (mode === 'ultra') {
    const allItems = groups.flatMap(g => g.items);
    body += '<ul class="ultra">';
    for (const item of allItems) {
      const amt = item.amount || '1';
      const amtStr = /^\d+$/.test(amt) ? amt + 'x' : amt;
      body += `<li><span class="cb">&#x2610;</span> <strong>${esc(amtStr)}</strong> ${esc(item.name)}</li>`;
    }
    body += '</ul>';
  } else {
    for (const g of groups) {
      body += `<h2>${esc(g.cat)}</h2>`;
      if (mode === 'compact') {
        body += '<ul class="compact">';
        for (const item of g.items) {
          const amt = item.amount || '1';
          const amtStr = /^\d+$/.test(amt) ? amt + 'x' : amt;
          const notes = item.notes ? ` <span class="notes">${esc(item.notes)}</span>` : '';
          body += `<li><span class="cb">&#x2610;</span> <strong>${esc(amtStr)}</strong> ${esc(item.name)}${notes}</li>`;
        }
        body += '</ul>';
      } else {
        body += '<div class="detailed">';
        for (const item of g.items) {
          const amt = item.amount || '1';
          const amtStr = /^\d+$/.test(amt) ? amt + 'x' : amt;
          const imgUrl = getProductImageUrl(item.name, item.imageUrl);
          const imgTag = imgUrl ? `<img class="d-img" src="${esc(baseUrl + imgUrl)}" />` : '';
          const notes = item.notes ? `<div class="notes">${esc(item.notes)}</div>` : '';
          body += `<div class="d-item"><span class="cb">&#x2610;</span>${imgTag}<div><strong>${esc(amtStr)}</strong> ${esc(item.name)}${notes}</div></div>`;
        }
        body += '</div>';
      }
    }
  }

  return `<!doctype html><html><head><meta charset="utf-8"><title>${esc(translate('Shopping List'))} – ${date}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#222;padding:20px;max-width:800px;margin:0 auto}
h1{font-size:20px;margin-bottom:2px}
.meta{font-size:12px;color:#888;margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:#666;border-bottom:1px solid #ccc;padding:6px 0 3px;margin-top:14px}
ul.compact{list-style:none;columns:2;column-gap:24px;padding:4px 0}
ul.compact li{break-inside:avoid;padding:3px 0;font-size:14px;line-height:1.5}
ul.ultra{list-style:none;columns:3;column-gap:16px;padding:2px 0}
ul.ultra li{break-inside:avoid;padding:1px 0;font-size:12px;line-height:1.3}
.cb{font-size:16px;margin-right:2px}
.notes{font-size:11px;color:#888;font-style:italic}
.detailed{columns:2;column-gap:20px;padding:4px 0}
.d-item{break-inside:avoid;display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #eee;font-size:14px}
.d-img{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0}
.footer{margin-top:16px;font-size:11px;color:#aaa;text-align:center}
@media print{body{padding:10px}h1{font-size:18px}ul.compact{columns:2}}
@media (max-width:500px){ul.compact{columns:1}}
</style></head><body>
<h1>${esc(translate('Shopping List'))}</h1>
<div class="meta">${date} &middot; ${total} ${esc(translate('Items'))}</div>
${body}
<div class="footer">${esc(translate('Shopping List'))} &middot; ${date}</div>
</body></html>`;
}

function doPrint(mode) {
  closePrintOverlay();
  const html = buildPrintHtml(mode);
  let frame = document.getElementById('printFrame');
  if (frame) frame.remove();
  frame = document.createElement('iframe');
  frame.id = 'printFrame';
  frame.style.cssText = 'position:fixed;width:0;height:0;border:none;left:-9999px';
  document.body.appendChild(frame);
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  frame.onload = () => {
    frame.contentWindow.focus();
    frame.contentWindow.print();
  };
}

function handleMessage(data) {
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { return; }
  }
  if (data && typeof data === 'object' && data.type === 'state') {
    if (data.availableImages) {
      productImages = data.availableImages;
      productBrands = data.availableBrands || {};
      _rebuildPiKeys();
    }
    state = data;
    syncScannerAddedNames();
    render();
  }
}

window.updateState   = handleMessage;

function populateEditFavList(selectId) {
  const favSelect   = document.getElementById('editFavList');
  const previousId  = selectId || favSelect.value;
  favSelect.innerHTML = '';
  const lists = Array.isArray(state.favoriteLists) ? state.favoriteLists : [];
  if (lists.length === 0) {
    const none = document.createElement('option');
    none.value = '';
    none.textContent = translate('No lists available');
    none.selected = true;
    favSelect.appendChild(none);
    return;
  }
  const effectiveId = previousId || (lists[0] && lists[0].id) || '';
  for (const list of lists) {
    const opt = document.createElement('option');
    opt.value = list.id; opt.textContent = list.name;
    if (list.id === effectiveId) opt.selected = true;
    favSelect.appendChild(opt);
  }
}

function openEditOverlay(item, showFavPicker) {
  editingItemId = item.id || null;
  document.getElementById('editName').value   = item.name   || '';
  document.getElementById('editAmount').value = item.amount || '';
  document.getElementById('editNotes').value  = item.notes  || '';

  // Populate category dropdown
  const select  = document.getElementById('editCategory');
  const cats    = Array.isArray(state.categoryOrder) ? state.categoryOrder : [];
  // Default empty/unknown → Miscellaneous (matches list grouping fallback)
  const curCat  = item.category || translate('Miscellaneous');
  select.innerHTML = '';
  if (curCat && !cats.includes(curCat)) {
    const opt = document.createElement('option');
    opt.value = curCat; opt.textContent = curCat; opt.selected = true;
    select.appendChild(opt);
  }
  for (const cat of cats) {
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    if (cat === curCat) opt.selected = true;
    select.appendChild(opt);
  }

  // Favorite list picker (only for heart-triggered adds)
  const favSection  = document.getElementById('editFavSection');
  const catWrap     = document.getElementById('editCategory').closest('.edit-select-wrap');
  if (showFavPicker) {
    populateEditFavList();
    favSection.style.display = '';
    catWrap.style.display    = 'none';
  } else {
    favSection.style.display = 'none';
    catWrap.style.display    = '';
  }

  document.getElementById('editOverlayTitle').textContent =
    editingItemId ? translate('Edit item') : translate('Add');
  // Trash button only when editing an existing item (not when adding)
  document.getElementById('btnEditDelete').style.display = editingItemId ? '' : 'none';
  document.getElementById('editOverlay').classList.add('open');
  document.getElementById('editName').focus({ preventScroll: true });
}

function closeEditOverlay() {
  document.getElementById('editOverlay').classList.remove('open');
  editingItemId = null;
}

function saveEdit() {
  const name     = document.getElementById('editName').value.trim();
  const amount   = document.getElementById('editAmount').value.trim();
  const notes    = document.getElementById('editNotes').value.trim();
  const category = document.getElementById('editCategory').value;
  if (!name) return;

  if (editingItemId) {
    requestAction('UpdateItem', JSON.stringify({ id: editingItemId, name, amount, notes, category }));
  } else {
    requestAction('AddItem', JSON.stringify({ name, category, amount }));
    const favSection = document.getElementById('editFavSection');
    if (favSection.style.display !== 'none') {
      const listId = document.getElementById('editFavList').value;
      if (listId) {
        requestAction('AddItemToFavoriteList', JSON.stringify({ listId, name, category, amount, notes }));
      }
    }
  }
  closeEditOverlay();
}

    menuAnchor = null;
  }
  function openMenu(anchor, entries) {
    // Zweiter Tipp auf denselben Knopf schliesst wieder.
    if (menuAnchor === anchor && menuPop) { closeMenu(); return; }
    closeMenu();
    const pop = document.createElement('div');
    pop.className = 'menu-pop open';
    for (const entry of entries) {
      if (entry.sep) {
        const sep = document.createElement('div');
        sep.className = 'menu-sep';
        pop.appendChild(sep);
        continue;
      }
      const btn = document.createElement('button');
      if (entry.destructive) btn.classList.add('destructive');
      btn.textContent = entry.label;
      btn.addEventListener('click', () => {
        if (entry.confirm && btn.getAttribute('data-armed') !== 'true') {
          btn.setAttribute('data-armed', 'true');
          btn.textContent = translate('Sure?');
          return;                       // Menue bleibt offen, zweiter Tipp fuehrt aus
        }
        closeMenu();
        entry.onClick();
      });
      pop.appendChild(btn);
    }
    document.body.appendChild(pop);
    const r = anchor.getBoundingClientRect();
    pop.style.maxWidth = Math.min(280, window.innerWidth - 16) + 'px';
    // Ueber dem Knopf oeffnen: er sitzt am unteren Rand der Kachel.
    pop.style.top  = Math.max(8, r.top - pop.offsetHeight - 6) + 'px';
    pop.style.left = Math.max(8, Math.min(r.right - pop.offsetWidth, window.innerWidth - pop.offsetWidth - 8)) + 'px';
    menuPop = pop;
    menuAnchor = anchor;
    menuCloser = (e) => {
      if (pop.contains(e.target) || anchor.contains(e.target)) return;
      closeMenu();
    };
    document.addEventListener('mousedown', menuCloser, true);
  }

  document.getElementById('btnListMenu').addEventListener('click', (e) => {
    e.stopPropagation();
    closeSuggestions();
    const eintraege = [
      { label: translate('Everything done'), confirm: true,
        onClick: () => requestAction('MarkAllDone', '') },
      { label: translate('Clear cart'), confirm: true, destructive: true,
        onClick: () => requestAction('ClearCart', '') },
    ];
    const listen = (state.favoriteLists || []).slice().sort((a, b) =>
      String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base', numeric: true }));
    if (listen.length) {
      eintraege.push({ sep: true });
      for (const l of listen) {
        eintraege.push({
          label: translate('Add "%1"').replace('%1', l.name),
          onClick: () => requestAction('AddFavoriteListToCart', l.id),
        });
      }
    }
    openMenu(e.currentTarget, eintraege);
  });

  document.getElementById('cartToggle').addEventListener('click', () => {
    cartExpanded = !cartExpanded;
    render();
  });

  document.getElementById('btnCartBulk').addEventListener('click', bulkAddToCart);
});

function bulkAddToCart() {
  if (!window.__extApiHookUrl) return;
  const btn = document.getElementById('btnCartBulk');
  if (btn.disabled) return;
  btn.disabled = true;
  const original = translate('Add to cart');
  btn.textContent = translate('Sending…');

  // Reuse the same hook URL prefix as the lookup, swap the action.
  const url = window.__extApiHookUrl.replace(/&a=extapi&ean=$/, '&a=cart_bulk');
  fetch(url, { method: 'POST' })
    .then(r => r.json().catch(() => ({})))
    .then(data => {
      let msg;
      if (data && typeof data.added === 'number') {
        msg = data.added > 0
          ? translate('%d items added to cart').replace('%d', String(data.added))
          : translate('No items added');
      } else if (data && data.error) {
        const map = {
          'login required':       translate('Login required'),
          'cart not configured':  translate('Cart not configured'),
          'certificates missing': translate('Certificates missing'),
          'basket creation failed': translate('Basket creation failed'),
        };
        msg = map[data.error] || (translate('Cart error') + ': ' + data.error);
        console.warn('[ShoppingList] cart_bulk error:', data);
      } else {
        msg = translate('Cart error') + ': unknown';
        console.warn('[ShoppingList] cart_bulk unexpected response:', data);
      }
      btn.textContent = msg;
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = original;
      }, 4000);
    })
    .catch(() => {
      btn.textContent = translate('Cart not configured');
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = original;
      }, 2500);
    });
}
}());
  </script>
