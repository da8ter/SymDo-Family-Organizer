<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <script src="/icons.js"></script>
  <style>
:root {
  --bg:     var(--card-color);
  --card:   var(--card-color);
  --text:   var(--content-color);
  --muted:  color-mix(in srgb, var(--content-color) 30%, transparent);
  --border: color-mix(in srgb, var(--accent-color) 30%, transparent);
  --accent: var(--accent-color);
  /* Flächen der Web-App (SymDoWebApp), damit Zeilen, Miniaturen und Mengen-Abzeichen
     dort und hier dieselben Töne haben. --row ist die Zeilenfläche, --surface2 das
     eingesenkte Feld darin (Miniatur, Abzeichen). */
  --surface:  color-mix(in srgb, var(--content-color) 7%, transparent);
  --surface2: color-mix(in srgb, var(--content-color) 12%, transparent);
  --row:      color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --radius: 14px;
  --gap:    12px;
  /* 68px wie in der Web-App: Zeichen 25px, darunter die Beschriftung mit 10px.
     Vorher 56px ohne Beschriftung. */
  --nav-h:  68px;
  /* ── Schwebende, runde Tab-Leiste — Optik der Web-App (SymDoWebApp) ──────
     Dort ist es der Nachbau der iOS-26-Glasleiste; hier dieselben Werte, damit
     Kachel und Web-App gleich aussehen. Die Leiste verlässt dafür den Flex-Fluss
     und schwebt über dem Inhalt, der Platz wird über --tab-clear freigehalten
     (Scroll-Polster der .list-area und Unterkante der Überlagerungen).
     Anders als in der Web-App genügt hier ein Prozentwert für die Einrückung: die
     Leiste liegt absolut in .wrap, deren Kanten schon die Kachelränder tragen —
     die Web-App muss dieselbe Breite aus Fensterkoordinaten nachrechnen, weil ihre
     Leiste fixiert ist. Auf einen Deckel wie --bar-max wird bewusst verzichtet: die
     Kachel hat keine gedeckelte Inhaltsbreite, eine auf 648px begrenzte Leiste
     stünde in einer breiten Kachel verloren. */
  --tab-gap:    10px;
  /* Luft zwischen Eingabezeile und Tab-Leiste, zusätzlich zum Schwebe-Abstand der
     Leiste — sonst wirkt das Feld an die Kapsel geklebt (Wert der Web-App). */
  --input-gap:  12px;
  /* Höhe der Eingabezeile (die runden Knöpfe geben sie vor). Sie steckt im Freiraum,
     den der Scrollbereich unten frei hält. */
  --input-h:    42px;
  /* Freiraum am Fuß des SCROLLBEREICHS: Tab-Leiste plus Eingabezeile plus deren Luft.
     Nur Polster, keine Begrenzung — der Inhalt läuft bis zur Kachelkante und unter
     dem Glas hindurch, die letzte Zeile bleibt trotzdem erreichbar. */
  --content-clear: calc(var(--tab-clear) + var(--input-gap) + var(--input-h));
  /* Vorschlagsfenster: Unterkante FEST, Höhe nach Inhalt.
       --sug-gap    Abstand der Unterkante zur Eingabezeile
       --sug-bottom daraus der Abstand zur Kachelunterkante (die Oberkante der
                    Eingabezeile liegt bei --tab-clear minus --tab-gap plus
                    --input-gap plus --input-h)
       --sug-top    MINDESTabstand zum oberen Kachelrand; er begrenzt die Höhe, ist
                    aber keine Verankerung mehr — bei wenigen Vorschlägen bleibt das
                    Fenster flach und wächst nur nach oben, wenn es mehr werden. */
  --sug-gap:    50px;
  --sug-top:    80px;
  --sug-bottom: calc(var(--tab-clear) - var(--tab-gap) + var(--input-gap) + var(--input-h) + var(--sug-gap));
  --tab-inset:  5%;
  /* Deckel für die schwebenden Elemente, Wert der Web-App: 0,9 × 720 = 648px. Er
     waechst dort absichtlich NICHT mit der Inhaltsbreite — Leiste und Eingabezeile
     sollen auf breiten Flaechen schmal und mittig bleiben. Die 5 % Einrueckung greift
     weiter auf schmalen Kacheln, der Deckel erst darueber. */
  --bar-max:    calc(720px * 0.9);
  --tab-clear:  calc(var(--nav-h) + var(--tab-gap) * 2 + var(--sym-mb));
  --glass-bg:   color-mix(in srgb, var(--card-color) 35%, transparent);
  /* Rahmen der Glasflaechen NEUTRAL, Wert der Web-App. Das allgemeine --border der
     Kachel ist akzentgetoent (accent 30 %) — auf der runden Kapsel und dem Eingabefeld
     ergab das einen gruenen Saum (gemessen #17554d), waehrend die Flaechen selbst
     neutral sind (#212125). In der Web-App ist --border durchgehend
     content-color 14 %; hier bleibt es beim akzentgetoenten Ton, damit nicht die ganze
     Kachel umfaerbt, und nur Leiste und Feld bekommen den neutralen. */
  --glass-border: color-mix(in srgb, var(--content-color) 14%, transparent);
  --glass-blur: blur(14.4px) saturate(180%);
  /* System-Kachelränder (per JS aus den URL-Parametern gesetzt) + Scrollbalken-
     Breite, um den Listen-Scrollbalken mittig ins rechte Body-Padding zu legen. */
  --sym-mt:  0px;
  --sym-ms:  0px;
  --sym-mb:  0px;
  --sbw:     6px;
  --sb-pad:  max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  color: var(--text);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: transparent;
  /* Body-Padding der Visu neutralisieren und die Ränder selbst auf .wrap
     anwenden — so kann der Listen-Scrollbalken kontrolliert ins rechte
     Body-Padding wandern (siehe .list-area). */
  padding: 0 !important;
  margin: 0 !important;
}

.wrap {
  position: relative;
  height: 100%;
  min-height: 0;
  /* Ränder wie zuvor das Body-Padding; unten 0 (Nav sitzt an der Kante) */
  /* Unten KEIN Polster: der scrollbare Inhalt soll bis zur Kachelkante laufen und
     hinter Eingabezeile und Tab-Leiste hindurch — nur so haben deren Glasflächen
     etwas zu weichzeichnen. Den Freiraum hält allein das Scroll-Polster der Liste
     (--content-clear). */
  padding: var(--sym-mt) var(--sym-ms) 0 var(--sym-ms);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  overflow: clip;
}

/* ── Search bar ────────────────────────────────────────────────────────── */
/* ── Eingabe unten: Komponist im Aufbau der Web-App (SymDoWebApp) ───────────
   Vorher eine Suchleiste am oberen Rand mit einer absolut darunter aufklappenden
   Vorschlagsliste. Jetzt steht die Eingabe unter der Liste, die Vorschläge liegen
   darüber im Fluss, und Feld wie Knöpfe tragen dieselbe Glasoptik wie die
   Tab-Leiste — eine Glasschicht, dieselben Marken (--glass-bg/--glass-blur).
   Der Abstand zur Kapsel ist --input-gap, wie dort. */
/* Traegerkasten mit Eingabe und Vorschlaegen. Wird an ZWEI Stellen benutzt: hier
   fuer den Komponisten unten, und von der Favoriten-Detailansicht
   (.fav-detail-search) fuer ihr Feld am oberen Rand. Deshalb bleibt die Regel
   allgemein, und alles Komponisten-Eigene steht unter .composer. */
.search-bar {
  position: relative;
  flex-shrink: 0;
  padding: 8px var(--gap) 0;
  z-index: 100;
}
/* Schwebt wie die Tab-Leiste über dem Inhalt, mit DERSELBEN Einrückung — Feld und
   Knöpfe stehen damit genau so breit wie die Kapsel darunter. Der Abstand zur Kapsel
   ist --input-gap. */
.composer {
  position: absolute;
  left: var(--tab-inset);
  right: var(--tab-inset);
  max-width: var(--bar-max);
  margin-left: auto;
  margin-right: auto;
  bottom: calc(var(--tab-clear) - var(--tab-gap) + var(--input-gap));
  z-index: 100;
}
.inputbar {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.search-input {
  flex: 1;
  min-width: 0;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  color: var(--text);
  font-size: 15px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
}

.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--accent); }

.btn-fav-lists {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s;
}

.btn-fav-lists:active { border-color: var(--accent); }

/* Runde Knöpfe der Eingabezeile, Maße und Farben der Web-App. Sie brauchen dieselbe
   Weichzeichnung wie Feld und Leiste — ohne Trägerfläche scheint der Listeninhalt
   sonst ungefiltert durch den abgeblendeten Knopf. */
.inputbar .round-btn {
  flex: none;
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 17px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.inputbar .round-btn:disabled {
  opacity: .4;
  cursor: default;
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.inputbar .round-btn:active { opacity: .8; }


/* ── Suggestions dropdown ──────────────────────────────────────────────── */
.suggestions-dropdown {
  /* Aufklappendes Panel unter dem Feld — so braucht es die Favoriten-Detailansicht,
     deren Feld am oberen Rand sitzt. Der Komponist unten dreht das um, siehe unten. */
  position: absolute;
  top: 100%;
  left: var(--gap);
  right: var(--gap);
  margin-top: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: none;
  max-height: 260px;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  padding: 8px;
  box-shadow: 0 4px 20px color-mix(in srgb, var(--accent) 12%, transparent);
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
}
/* Vorschlagsfenster in der Kachel: eigenes, verankertes Fenster statt eines Blocks,
   der mit der Zahl der Vorschlaege waechst.
     oben     --sug-top vom Kachelrand
     unten    --sug-gap ueber der Eingabezeile — deren Oberkante liegt bei
              --tab-clear minus --tab-gap plus --input-gap plus --input-h
     Breite   dieselbe Einrueckung wie die Tab-Leiste (--tab-inset)
   Glas wie Leiste und Feld, runde Ecken, KEIN Rand. Die Ecken brauchen eine Flaeche,
   sonst waere die Rundung unsichtbar — das ist die Glasschicht, nicht die deckende
   Kartenflaeche, die vorher hier stand. Weil das Fenster die Weichzeichnung mitbringt,
   brauchen die Chips sie nicht mehr einzeln (das waren bei langen Listen hunderte
   Blur-Ebenen). */
.wrap > .suggestions-dropdown {
  position: absolute;
  left: var(--tab-inset);
  right: var(--tab-inset);
  max-width: var(--bar-max);
  /* KEIN top: nur so richtet sich die Höhe nach dem Inhalt. Mit top UND bottom wäre
     sie festgenagelt, und ein einzelner Vorschlag stünde in einem hohen leeren
     Fenster. Der Deckel lässt oben mindestens --sug-top frei; die Prozentangabe
     bezieht sich auf den Polsterkasten von .wrap, also auf die Kachelhöhe. */
  top: auto;
  bottom: var(--sug-bottom);
  margin: 0 auto;
  height: auto;
  max-height: calc(100% - var(--sug-bottom) - var(--sug-top));
  padding: 12px;
  /* 1px in der VOLLEN Akzentfarbe — ausdruecklich so gewuenscht. Nicht --border
     (Akzent mit 30 %), das ist der gedaempfte Ton der uebrigen Kachel. */
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: none;
  z-index: 150;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.wrap > .suggestions-dropdown::-webkit-scrollbar { display: none; }

.suggestions-dropdown.open { display: block; }
/* KEINE deckende Fläche hinter den Vorschlägen. Die Web-App legt dort den
   Komponisten deckend, weil er bei ihr am unteren Rand des Inhaltsbereichs klemmt und
   die Fläche mit dem Seitenfuß verschmilzt. Hier schwebt er 5 % eingerückt über der
   Liste — ein deckendes Rechteck mit eckigen Ecken stünde mitten im Bild.
   Damit die Chips über scrollendem Inhalt lesbar bleiben, bringen sie ihre
   Weichzeichnung selbst mit (Regel bei .chip/.chip-pill) — das ist eine Filterung,
   keine Fläche. */

/* Der Balken ist an der Fenster-Regel ausgeblendet; die Favoriten-Detailansicht
   behält ihren, dort ist er die einzige Anzeige, dass die Liste weitergeht. */

.suggestions-dropdown::-webkit-scrollbar { width: 6px; }
.suggestions-dropdown::-webkit-scrollbar-track {
  background: transparent;
  margin: 10px 0;
}
.suggestions-dropdown::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}

/* ── Chip row (suggestions) ────────────────────────────────────────────── */
.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 2px 0 4px;
}

/* Custom "Hinzufügen:" chip — standalone button */
.chip {
  display: inline-flex;
  align-items: center;
  /* Maße und Fläche der Web-App: gefüllt auf --surface2 statt umrandet auf --card.
     Der akzentgetönte Rand der Kachel ließ die Vorschläge grün gesäumt wirken. */
  padding: 6px 12px;
  border-radius: 999px;
  border: none;
  background: var(--surface2);
  color: var(--text);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  user-select: none;
  touch-action: manipulation;
  transition: opacity .1s ease;
  -webkit-tap-highlight-color: transparent;
  max-width: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.chip:active { opacity: .7; }

/* Nur noch in der Favoriten-Detailansicht: die Einkaufs-Vorschlaege haben keinen
   „Hinzufügen: …"-Chip mehr, dort erledigen das Plus-Knopf und Eingabetaste. */
.chip.add-custom {
  /* Breite MUSS mitgesetzt werden: .chip steht auf `border: none`, das ist
     border-style: none PLUS border-width: medium. Nur den Stil auf dashed zu setzen
     weckt die 3px wieder auf (gemessen). */
  border: 1px dashed var(--accent);
  font-weight: 600;
  color: var(--accent);
}

/* Pill: chip label + heart button grouped together */
.chip-pill {
  display: inline-flex;
  align-items: stretch;
  border-radius: 999px;
  border: none;
  background: var(--surface2);
  overflow: hidden;
  max-width: 100%;
  min-width: 0;
}

.chip-img {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  object-fit: cover;
  vertical-align: middle;
  margin-right: 4px;
}
.chip-label-btn {
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  padding: 6px 6px 6px 12px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .1s ease;
  display: inline-flex;
  align-items: center;
  min-width: 0;
  overflow: hidden;
}

.chip-label-text {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  min-width: 0;
}

.chip-label-btn:active { opacity: .7; }

.chip-heart-btn {
  border: none;
  /* Neutrale Trennlinie: --border ist in der Kachel akzentgetönt und zog einen
     grünen Strich mitten durch die Pille. */
  border-left: 1px solid var(--glass-border);
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  padding: 6px 10px 6px 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: color .1s ease;
  line-height: 1;
}

.chip-heart-btn.is-fav { color: var(--accent); }
.chip-heart-btn:active { opacity: .7; }

/* ── List area ─────────────────────────────────────────────────────────── */
.list-area {
  flex: 1;
  min-height: 0;
  /* Damit die letzte Zeile über Eingabezeile und Leiste hinausgescrollt werden kann,
     obwohl der Inhalt darunter hindurchläuft. */
  padding-bottom: var(--content-clear);
  /* In den rechten Rand hineinziehen, damit der Scrollbalken mittig im
     Body-Padding sitzt; padding-right hält den Inhalt bündig bei marginside.
     overflow-y: scroll reserviert den Balken immer → konstanter Abstand. */
  margin-right: calc(-1 * (var(--sym-ms) - var(--sb-pad)));
  overflow-x: hidden;
  overflow-y: scroll;
  padding-right: var(--sb-pad);
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
}

.list-area::-webkit-scrollbar { width: 6px; }
.list-area::-webkit-scrollbar-track { background: transparent; }
.list-area::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}

.section-header {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  padding: 10px 4px 4px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

/* Einklappbarer Abschnitt „Zuletzt benutzt" — Aufbau und Maße der Web-App. Ersetzt
   Trennlinie plus feste Überschrift. Kein width: 100%: als Flex-Kasten auf
   Blockebene füllt er die Breite ohnehin, mit den Seitenrändern ergäbe es 100% + 4px
   und der Bereich ließe sich waagerecht scrollen. */
.section-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 2px 6px;
  padding: 0;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.section-toggle .count { margin-left: auto; font-weight: 600; }
.section-toggle i.chev { transition: transform .18s ease; }
.section-toggle.open i.chev { transform: rotate(90deg); }

/* Zweitrangiger runder Knopf (Menü): gedeckte Fläche statt Akzent, wie in der
   Web-App. Die Weichzeichnung braucht er selbst, weil unter ihm der Listeninhalt
   durchläuft. */
/* Zweitrangiger runder Knopf (Menü) in der Eingabezeile. */
.inputbar .round-btn.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--glass-border);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  font-size: 19px;
  line-height: 1;
}

/* Menü als Popover am Knopf — Maße und Farben der Web-App. */
.menu-pop {
  position: fixed;
  z-index: 2000;
  min-width: 200px;
  padding: 6px;
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  background: var(--bg);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
  display: none;
}
.menu-pop.open { display: block; }
.menu-pop button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  border: none;
  border-radius: 10px;
  background: none;
  color: var(--text);
  font: inherit;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}
.menu-pop button:active { background: var(--surface); }
.menu-pop button.destructive { color: #e04434; }
.menu-pop .menu-sep { height: 1px; margin: 4px 6px; background: var(--glass-border); }

/* ── Artikelliste ──────────────────────────────────────────────────────────
   Zeilen über die volle Breite, gestapelt — wie die Einkaufsliste der Web-App
   (SymDoWebApp). Vorher waren es Pillen in einem umbrechenden Fließraster
   (`width: fit-content`, `min-width: 130px`, `flex-wrap`). Daran hing mehr als die
   Optik: das Auflösen beim Löschen klappte die BREITE ein und schluckte den
   Raster-Abstand nach rechts. Mit Zeilen klappt es die Höhe ein — siehe
   dissolveCard. Die Abhaken-Bewegungen sind reine Verschiebungen und bleiben. */
.item-grid {
  padding: 4px 0 8px;
}

/* ── Mehrspaltig auf breiten Kacheln — Haltepunkt und Rasterwerte der Web-App ──
   Media Query und nicht Container Query, weil eine Visu-Kachel ein eigenes Dokument
   mit eigenem Viewport ist: eine SCHMALE Kachel in einem breiten Fenster bleibt damit
   richtig einspaltig.

   Die Spaltenzahl regelt auto-fill nach der verfügbaren Breite, ein Haltepunkt genügt
   also für 2, 3 oder 4 Spalten. Das Raster sitzt hier auf dem KATEGORIE-Behälter und
   nicht auf der ganzen Liste: die Kachel gruppiert schon je Kategorie in ein eigenes
   .item-grid, die Überschriften stehen als Geschwister daneben und spannen von sich
   aus über die volle Breite.

   row-gap MUSS 0 bleiben: die Abstände kommen aus margin-bottom der Zeilen. Mit einem
   row-gap bliebe beim Löschen eine Lücke stehen, weil dissolveCard() Höhe und
   margin-bottom zusammenfährt, den gap aber nicht. */
@media (min-width: 820px) {
  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    column-gap: var(--gap);
    row-gap: 0;
    align-items: start;
  }
  /* Einzelner Artikel in einer Kategorie: volle Breite statt einer halb leeren Reihe. */
  .item-grid > .item-card:only-child { grid-column: 1 / -1; }
}

.item-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  /* Abstand zur nächsten Zeile am Element, nicht als gap am Behälter: das
     Einklappen beim Löschen muss ihn mitnehmen können. */
  margin-bottom: 6px;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .1s ease, transform .05s ease;
}

/* Foreground layer – slides left on swipe. Opaque background so the
   delete layer behind it stays hidden until swiped. */
.item-card-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  cursor: pointer;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  /* Deckende Zeilenfläche der Web-App. Sie MUSS deckend bleiben, sonst scheint die
     rote Löschfläche dahinter durch. */
  background: var(--row);
  transition: transform .28s cubic-bezier(.22,.61,.36,1), opacity .12s ease;
}
.item-card-content.is-dragging { transition: none; }

.item-card:hover .item-card-content {
  background: color-mix(in srgb, var(--row) 92%, var(--content-color) 8%);
}

/* Delete layer revealed by swiping the card to the left */
.item-card-delete {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 16px;
  background: #c0392b;
  color: #fff;
  font-size: 20px;
  /* Standardmäßig unsichtbar: so scheint die rote Fläche NICHT durch transparente
     bzw. animierte Inhalte (Tap, Move-in-den-Wagen-Animation) und auch nicht an
     den gerundeten Ecken (Subpixel bei grober Auflösung) durch. Nur beim Wischen
     oder Löschen wird sie eingeblendet — dort clippt sie die Kachel-Rundung sauber. */
  opacity: 0;
  transition: opacity .12s ease;
}
.item-card.dragging-left .item-card-delete,
.item-card.swipe-armed .item-card-delete,
.item-card.is-deleting .item-card-delete { opacity: 1; }
.item-card.swipe-armed .item-card-delete { background: #e04434; }
.item-card.is-deleting { pointer-events: none; }
.item-card.is-deleting .item-card-content { opacity: .4; }

/* Blauer Bearbeiten-Layer: wird beim Wischen nach rechts sichtbar (Stift links). */
.item-card-edit {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: 16px;
  background: #2f6fd4;
  color: #fff;
  font-size: 20px;
  opacity: 0;
  transition: opacity .12s ease;
}
.item-card.dragging-right .item-card-edit,
.item-card.edit-armed .item-card-edit { opacity: 1; }
.item-card.edit-armed .item-card-edit { background: #3f83ee; }

.item-card.is-moving-to-cart {
  pointer-events: none;
  animation: moveToRecentlyUsed .34s cubic-bezier(.22,.61,.36,1) forwards;
}

.item-card.in-cart.is-moving-to-list {
  pointer-events: none;
  animation: moveBackToList .34s cubic-bezier(.22,.61,.36,1) forwards;
}

@keyframes moveToRecentlyUsed {
  from { transform: translateX(0) scale(1); opacity: 1; }
  to   { transform: translateX(22px) scale(.97); opacity: 0; }
}

@keyframes moveBackToList {
  from { transform: translateX(0) scale(1); opacity: 1; }
  to   { transform: translateX(-22px) scale(.97); opacity: 0; }
}

.item-card.in-cart { opacity: .45; }
.item-card.in-cart .item-title { text-decoration: line-through; }

.item-thumb {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
/* Echte Artikelbilder ohne farbigen Hintergrund (nur der Buchstaben-Platzhalter behält den Farbkreis) */
.item-thumb:has(.item-thumb-img) { background: none; }

.item-thumb-letter {
  font-size: 22px;
  font-weight: 700;
  color: color-mix(in srgb, var(--content-color) 70%, transparent);
  line-height: 1;
  user-select: none;
  text-transform: uppercase;
}
.item-thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.item-info {
  flex: 1;
  min-width: 0;
  text-align: left;
}

.item-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-amount-prefix { color: var(--accent); }
/* Mengen-Stepper wie in der WebApp-Kachel */
.item-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
/* Favoriten-Herz links neben der Menge (wie in der WebApp) */
.item-fav-heart {
  flex-shrink: 0;
  border: none;
  background: none;
  cursor: pointer;
  color: var(--muted);
  font-size: 15px;
  padding: 2px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
}
.item-fav-heart.is-fav { color: var(--accent); }
.item-fav-heart:active { opacity: .6; }
.amount-badge {
  min-width: 30px; text-align: center; padding: 3px 8px; border-radius: 999px;
  background: var(--surface2);
  font-size: 12.5px; font-weight: 700; color: var(--text);
}
.stepper { display: flex; flex-direction: column; }
.stepper button { padding: 0 6px; font-size: 12px; color: var(--accent); line-height: 1.2; background: none; border: none; cursor: pointer; }
.stepper .amount-badge { padding: 1px 8px; }
/* Abzeichen ohne Pfeile: antippbar. Der Akzentrand ist der einzige Hinweis darauf
   — ohne ihn wirkt es wie reine Anzeige. */
.amount-badge[data-amount-edit] {
  cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
.amount-badge[data-amount-edit]:active { opacity: .6; }

.item-price {
  color: var(--accent);
  font-weight: 600;
  margin-right: 6px;
}

.item-notes {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-edit-btn {
  position: relative;
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 15px;
  cursor: pointer;
  width: 40px;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  border-radius: 10px;
  line-height: 1;
  transition: opacity .1s ease;
  opacity: 0.5;
}

/* Unsichtbarer, vergrößerter Hit-Bereich, damit knapp danebenliegende
   Taps nicht versehentlich die Card (ToggleCart) auslösen. */
.item-edit-btn::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 14px;
}

.item-edit-btn > i {
  pointer-events: none;
}

.item-edit-btn:active { opacity: 1; }

.item-edit-btn:hover,
.item-edit-btn:focus-visible {
  opacity: 1;
}

/* ── Cart actions ──────────────────────────────────────────────────────── */
.cart-actions {
  padding: 4px 0 8px;
}

.active-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 2px 0 10px;
}

.btn-complete-all,
.btn-cart-bulk {
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .15s ease;
}

.btn-cart-bulk {
  background: var(--accent);
  color: var(--bg);
}

.btn-complete-all:active,
.btn-cart-bulk:active {
  opacity: .75;
}

.btn-cart-bulk:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.market-icon {
  display: inline-block;
  margin-left: 4px;
  font-size: 12px;
  opacity: .7;
  vertical-align: middle;
}

.btn-clear-cart {
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  touch-action: manipulation;
  transition: background .15s, color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
}

.btn-clear-cart[data-armed="true"] {
  background: #c0392b;
  color: var(--content-color);
  border-color: #c0392b;
}

/* ── Empty state ───────────────────────────────────────────────────────── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 48px 16px;
  color: var(--muted);
}

.empty-icon { font-size: 36px; }
.empty-text { font-size: 15px; }

/* ── Overlays (edit + favorites) ───────────────────────────────────────── */
.overlay {
  position: absolute;
  inset: 0 0 -3px 0;
  box-sizing: border-box;
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 1000;
  background: var(--bg);
  /* abspos positioniert an der Padding-Box-Kante (= Kachel-Oberkante) und ignoriert
     das --sym-mt-Padding von .wrap → sonst rutscht der Overlay-Header unter die vom
     System überlagerten Kachel-Steuerelemente. Daher hier selbst oben abstand halten. */
  padding-top: var(--sym-mt);
}

.overlay.open { display: flex; }
#favOverlay, #editOverlay { bottom: var(--tab-clear); }
#btnFavLists { display: none !important; }

.overlay-card {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.overlay-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px var(--gap) 10px;
  flex-shrink: 0;
}

.overlay-title {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.btn-close-overlay {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  touch-action: manipulation;
  padding: 4px 8px;
  border-radius: 8px;
  -webkit-tap-highlight-color: transparent;
}

/* + button in favorites overlay header */
.btn-new-fav-list {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s, color .15s;
}

.btn-new-fav-list:active {
  background: var(--accent);
  color: var(--content-color);
}

/* Rename pencil button in fav overlay header */
.btn-fav-rename {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border-radius: 8px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .1s ease;
  line-height: 1;
  opacity: 0.5;
}

.btn-fav-rename:active { opacity: 1; }

.btn-fav-rename:hover,
.btn-fav-rename:focus-visible {
  opacity: 1;
}

/* Rename inline form */
.fav-rename-form {
  align-items: center;
  gap: 8px;
  padding: 0 var(--gap) 10px;
  flex-shrink: 0;
}

/* Back button inside detail footer row */
.btn-fav-detail-back {
  flex-shrink: 0;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--content-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
  white-space: nowrap;
}

.btn-fav-detail-back:active { opacity: .85; }

/* Back footer */
.fav-back-footer {
  flex-shrink: 0;
  padding: var(--gap);
  border-top: 1px solid var(--border);
}

.btn-fav-back {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--content-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}

.btn-fav-back:active { opacity: .85; }

/* New list inline form */
.new-list-form {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 0 var(--gap) 10px;
  flex-shrink: 0;
}

.new-list-form.visible { display: flex; }

.new-list-input {
  flex: 1;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 15px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
}

.new-list-input::placeholder { color: var(--muted); }
.new-list-input:focus { border-color: var(--accent); }

.btn-confirm-new-list {
  flex-shrink: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: var(--content-color);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Favorite list items */
.fav-list-body {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  padding: 4px var(--gap) var(--gap);
  display: flex;
  flex-direction: column;
  gap: 8px;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
}

.fav-list-item {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .1s ease;
  gap: 12px;
}

.fav-list-item:active { opacity: .7; }

.fav-list-name {
  flex: 1;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

.fav-list-count {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.fav-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}

/* Favorite detail view — items with heart remove button */
.fav-detail-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  gap: 12px;
}

.fav-detail-search {
  padding: 0 0 2px;
}

.fav-detail-search .search-input {
  border-radius: 12px;
}

.fav-detail-search .suggestions-dropdown {
  left: 0;
  right: 0;
}

.fav-detail-name {
  flex: 1;
  font-size: 14px;
  color: var(--text);
}
.fav-detail-img {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  object-fit: cover;
  flex-shrink: 0;
}
.fav-detail-notes {
  margin-left: 6px;
  font-size: 12px;
  font-style: italic;
}

.fav-detail-heart {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 16px;
  cursor: pointer;
  padding: 4px 6px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  border-radius: 6px;
  line-height: 1;
  transition: opacity .1s ease;
}

.fav-detail-heart:active { opacity: .5; }

/* Warenkorb neben dem Stift: gleicher Aufbau wie das Herz, damit die drei Knöpfe
   der Zeile eine Reihe bilden. */
.fav-detail-cart {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 16px;
  cursor: pointer;
  padding: 4px 6px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  border-radius: 6px;
  line-height: 1;
  transition: opacity .1s ease;
}
.fav-detail-cart:active { opacity: .5; }

/* Flieger der Hinzufuegen-Animation: Klon des Produktbildes. Muss ueber der
   Favoriten-Ueberlagerung UND der unteren Leiste liegen (beide 1100), deshalb 1200.
   Ohne Klickflaeche, damit er nichts abfaengt. */
.fly-ghost {
  position: fixed;
  z-index: 1200;
  pointer-events: none;
  border-radius: 8px;
  overflow: hidden;
  will-change: transform, opacity;
}
.fly-ghost img { width: 100%; height: 100%; object-fit: contain; }

/* Kurze Rückmeldung. Diese Kachel hatte bisher gar keine — ohne sie bliebe ein
   Druck auf den Warenkorb folgenlos sichtbar, weil die Einkaufsliste in einer
   anderen Ansicht liegt. */
.fav-toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%) translateY(8px);
  max-width: 86%;
  padding: 9px 14px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--card-color) 92%, transparent);
  border: 1px solid var(--border);
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .22);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 60;
}
.fav-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Footer with "Artikel zur Einkaufsliste hinzufügen" button */
.fav-detail-footer {
  flex-shrink: 0;
  padding: var(--gap);
  border-top: 1px solid var(--border);
}

.fav-detail-footer-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn-delete-fav-list {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, #c0392b 50%, transparent);
  background: transparent;
  color: #c0392b;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s, color .15s;
}

.btn-delete-fav-list:active {
  background: #c0392b;
  color: var(--content-color);
}

.btn-add-fav-to-cart {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: var(--content-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}

/* Edit item footer */
.fav-edit-footer {
  flex-shrink: 0;
  padding: var(--gap);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}

.btn-delete-fav-item {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, #c0392b 50%, transparent);
  background: transparent;
  color: #c0392b;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s, color .15s;
}
.btn-delete-fav-item:active {
  background: #c0392b;
  color: var(--content-color);
}

.btn-fav-edit-back {
  flex-shrink: 0;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--content-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
  white-space: nowrap;
}
.btn-fav-edit-back:active { opacity: .85; }

.btn-save-fav-edit {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: var(--content-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}

/* Pencil button in fav detail items */
.fav-detail-pencil {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  border-radius: 8px;
  line-height: 1;
  transition: opacity .1s ease;
  opacity: 0.5;
}

.fav-detail-pencil:active { opacity: 1; }

.fav-detail-pencil:hover,
.fav-detail-pencil:focus-visible {
  opacity: 1;
}

/* Fav section inside edit overlay */
.edit-fav-section {
  border-top: 1px solid var(--border);
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.edit-fav-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.edit-fav-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.btn-edit-fav-new {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: color .1s ease;
}

.btn-edit-fav-new:active { color: var(--accent); }

/* Dropdown row in edit overlay fav section */
.edit-fav-select-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
}

.edit-fav-select {
  width: 100%;
  padding: 10px 40px 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 15px;
  outline: none;
  -webkit-appearance: none;

.edit-fav-item-heart {

  font-size: 18px;

  padding: 4px 6px;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  border-radius: 6px;
  line-height: 1;
  transition: color .1s ease;
}

.edit-fav-item-heart.is-fav { color: var(--accent); }
.edit-fav-item-heart:active { opacity: .6; }

.edit-fav-empty {
  font-size: 13px;
  color: var(--muted);
  padding: 4px 0;
}

/* Edit form */
.edit-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: var(--gap);
  overflow-y: auto;
  flex: 1;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
}

.edit-form::-webkit-scrollbar { width: 6px; }
.edit-form::-webkit-scrollbar-track { background: transparent; }
.edit-form::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}

.edit-input {
  width: 100%;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 15px;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  font-family: inherit;
  resize: none;
}

.edit-input::placeholder { color: var(--muted); }
.edit-input:focus { border-color: var(--accent); }
textarea.edit-input { overflow: hidden; }

/* Fav row: select + "+" button side by side */
.edit-fav-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.edit-fav-row .edit-select-wrap { flex: 1; }

/* Category select inside edit form */
.edit-select-wrap {
  position: relative;
}
.edit-select-wrap select.edit-input {
  padding-right: 40px;
  appearance: none;
  cursor: pointer;
}
.edit-select-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: var(--muted);
  font-size: 14px;
}

/* Edit overlay footer */

  flex-shrink: 0;
  display: flex;
  gap: 8px;
  padding: var(--gap);
  border-top: 1px solid var(--border);
}

.btn-edit-back {
  flex-shrink: 0;
  padding: 12px 20px;
  border-radius: 12px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--content-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}

.btn-edit-back:active { opacity: .85; }

.btn-edit-delete {
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, #c0392b 50%, transparent);
  background: transparent;
  color: #c0392b;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s, color .15s;
}
.btn-edit-delete:active {
  background: #c0392b;
  color: var(--content-color);
}

.btn-save-edit {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  color: var(--content-color);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
/* ── Bottom navigation bar ────────────────────────────────────────────── */
/* Schwebende Kapsel statt Band an der Unterkante — siehe :root. Absolut in .wrap,
   die dadurch ihre Positionierung behält (position: relative steht dort schon). */
#bottomNav {
  position: absolute;
  left: var(--tab-inset);
  right: var(--tab-inset);
  max-width: var(--bar-max);
  margin-left: auto;
  margin-right: auto;
  bottom: calc(var(--tab-gap) + var(--sym-mb));
  height: var(--nav-h);
  display: flex;
  padding: 8px 16px;
  box-sizing: border-box;
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .18), 0 1px 2px rgba(0, 0, 0, .10);
  z-index: 1100;
}
.nav-tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding-top: 4px;
  background: transparent;
  border: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 10px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: color .15s;
}
/* 25px wie in der Web-App. Die Kachel liefert eigene <svg> mit, deshalb reicht hier
   width/height — anders als dort, wo /icons.js die <i> ersetzt und die Größe über
   font-size auf das <svg> treffen muss. */
.nav-tab svg { width: 25px; height: 25px; fill: currentColor; flex: none; }
.nav-tab.active { color: var(--accent); }
.nav-tab:active { opacity: .7; }

/* ── Print overlay ────────────────────────────────────────────────────── */
#printOverlay { bottom: var(--tab-clear); }
.scanner-overlay {
  bottom: var(--tab-clear);
}

.scanner-body {
  flex: 1;
  min-height: 0;
  padding: var(--gap);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: auto;
}

.scanner-video-wrap {
  position: relative;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #000;
  overflow: hidden;
  aspect-ratio: 4 / 3;
}

.scanner-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.scanner-scanline {
  position: absolute;
  left: 8%;
  right: 8%;
  top: 24%;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(0, 255, 195, 0) 0%, rgba(0, 255, 195, 1) 50%, rgba(0, 255, 195, 0) 100%);
  box-shadow: 0 0 10px rgba(0, 255, 195, .65);
  animation: scanner-line-move 2.1s ease-in-out infinite;
  pointer-events: none;
}

.scanner-result {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 2;
  width: min(92%, 560px);
  padding: 14px 16px;
  border-radius: 14px;
  background: rgba(0, 0, 0, .68);
  color: #fff;
  font-size: clamp(16px, 4.2vw, 21px);
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  min-height: 0;
  opacity: 0;
  transform: translate(-50%, -46%);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}

.scanner-result.show {
  opacity: 1;
  transform: translate(-50%, -50%);
}

.scanner-result.error {
  background: rgba(192, 57, 43, .78);
}

@keyframes scanner-line-move {
  0% { top: 24%; opacity: .95; }
  50% { top: 76%; opacity: 1; }
  100% { top: 24%; opacity: .95; }
}

.scanner-status {
  display: block;
  font-size: 13px;
  color: var(--muted);
  min-height: 20px;
  text-align: center;
  padding: 6px 8px 0;
  word-break: break-word;
}

.scanner-status:empty { display: none; }
.scanner-status.success { color: #2e7d32; }
.scanner-status.error { color: #c0392b; }

.print-mode-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: var(--gap);
  overflow: auto;
}
.print-mode-btn {
  display: flex;

  gap: 14px;

  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: color-mix(in srgb, var(--content-color) 6%, transparent);
  color: var(--text);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, background .15s;
}
.print-mode-btn:active { border-color: var(--accent); opacity: .85; }
.print-mode-icon { font-size: 28px; flex-shrink: 0; }
.print-mode-label { font-size: 15px; font-weight: 600; display: block; }
.print-mode-note {
  margin-top: 4px;
  margin-left: 8px;
  font-size: 11px;
  color: var(--muted);
}
.print-back-footer {
  flex-shrink: 0;
  padding: var(--gap);
  border-top: 1px solid var(--border);
}

const _piCache = new Map();
function _rebuildPiKeys() {

// The canonical query plus umlaut-folded/-unfolded forms and every
// single-suffix plural stem ("melonen" needs -n although -en matches first)

  for (const suffix of ['nen', 'en', 'er', 'es', 'se', 'n', 'e', 's']) {

    const after = idx + word.length >= text.length || !_piIsLetter(text[idx + word.length]);

    idx = text.indexOf(word, idx + 1);

  for (const k of _piBrandKeys) {

// ── Visu-Theme-Reporter ─────────────────────────────────────────────────────
// Die Visu injiziert --accent-color/--content-color/--card-color als CSS-
// Variablen; serverseitig gibt es dafür keine API. Die Kachel liest sie zur
// Laufzeit aus und meldet sie still ans Modul (ReportVisuTheme) — die
// AppBridge liefert sie der SymDo-App über die Discovery weiter.
function _themeToHex(value) {
  const v = String(value || '').trim();
  if (!v) return null;
  if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
  if (/^#[0-9a-f]{3}$/i.test(v)) {
    return '#' + v.slice(1).split('').map(c => c + c).join('').toLowerCase();
  }
  let probe = v;
  const m1 = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(probe);
  if (!m1) {
    // Moderne Formate (oklch, color-mix, …) über den Browser normalisieren
    const el = document.createElement('span');
    el.style.color = v;
    document.body.appendChild(el);
    probe = getComputedStyle(el).color;
    el.remove();

  const m = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(probe);
  if (!m) return null;
  return '#' + [m[1], m[2], m[3]]
    .map(n => Math.max(0, Math.min(255, parseInt(n, 10))).toString(16).padStart(2, '0'))

// ── Scroll containment ─────────────────────────────────────────────────────
// Scroll-Containment (wheel + touch, mit stopPropagation), damit beim Scrollen
// nicht die ganze Kachel/Visu mitscrollt — an den Rändern wird die Geste
// abgefangen und die Weiterleitung unterbunden.
function bindScrollContainment(scrollEl) {
  if (!scrollEl) return;
  let lastTouchY = null;

  scrollEl.addEventListener('wheel', (e) => {
    const maxScrollTop = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    if (maxScrollTop <= 0) { e.preventDefault(); e.stopPropagation(); return; }
    const deltaY = e.deltaY || 0;
    if (deltaY === 0) { e.stopPropagation(); return; }
    const atTop = scrollEl.scrollTop <= 0;
    const atBottom = scrollEl.scrollTop >= maxScrollTop - 1;
    if ((deltaY < 0 && atTop) || (deltaY > 0 && atBottom)) e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  scrollEl.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) { lastTouchY = null; return; }
    lastTouchY = e.touches[0].clientY;
    e.stopPropagation();
  }, { passive: true });

  scrollEl.addEventListener('touchmove', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    const maxScrollTop = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    if (maxScrollTop <= 0) { e.preventDefault(); e.stopPropagation(); return; }
    const currentY = e.touches[0].clientY;
    if (lastTouchY === null) { lastTouchY = currentY; e.stopPropagation(); return; }
    const deltaY = lastTouchY - currentY;
    const atTop = scrollEl.scrollTop <= 0;
    const atBottom = scrollEl.scrollTop >= maxScrollTop - 1;
    if ((deltaY < 0 && atTop) || (deltaY > 0 && atBottom)) e.preventDefault();
    e.stopPropagation();
    lastTouchY = currentY;
  }, { passive: false });

  scrollEl.addEventListener('touchend', () => { lastTouchY = null; }, { passive: true });
  scrollEl.addEventListener('touchcancel', () => { lastTouchY = null; }, { passive: true });
}

// Dokument-weit jede Scroll-Geste außerhalb erlaubter Bereiche unterbinden.
const SL_SCROLL_AREA_SELECTOR = '.list-area, .suggestions-dropdown, .fav-list-body, .edit-form, .scanner-body, .print-mode-body';
function setupScrollContainment() {
  document.querySelectorAll(SL_SCROLL_AREA_SELECTOR).forEach(bindScrollContainment);
  const outside = (t) => !(t instanceof Element) || t.closest(SL_SCROLL_AREA_SELECTOR) === null;
  document.addEventListener('wheel', (e) => { if (outside(e.target)) e.preventDefault(); }, { passive: false, capture: true });
  document.addEventListener('touchmove', (e) => { if (outside(e.target)) e.preventDefault(); }, { passive: false, capture: true });
}

function buildItemCard(item, inCart) {
  const cls    = inCart ? 'item-card in-cart' : 'item-card';

    : `<span class="item-thumb-letter">${letter}</span>`;

  // Mengen-Badge. Runter-Pfeil bei Menge 1 unsichtbar (Platz bleibt reserviert).
  const amountRaw = String(item.amount || '').trim();
  const numeric   = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
  const amount    = amountRaw === '' ? '1' : amountRaw;
  let sideHtml;
  if (!inCart && numeric) {
    const canDec = parseInt(amount) > 1;
    sideHtml = `<span class="stepper"><button data-step="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>`
      + `<span class="amount-badge">${escapeHtml(amount)}</span>`
      + `<button data-step="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button></span>`;
  } else {
    // Ohne Pfeile (nicht-numerische Menge wie „500 g", oder Artikel im Wagen) ist

    sideHtml = `<span class="amount-badge" data-amount-edit="${escapeHtml(item.id)}" role="button" tabindex="0" title="Menge ändern">${escapeHtml(amount)}</span>`;
  }
  const showPrice = !!state.extApiShowPrice;
  const priceHtml = (showPrice && item.price) ? `<span class="item-price">${escapeHtml(item.price)}</span>` : '';
  const hasExtra = priceHtml || item.notes;
  const notesHtml = item.notes ? escapeHtml(item.notes) : '';
  const notes  = hasExtra ? `<div class="item-notes">${priceHtml}${notesHtml}</div>` : '';
  const marketIcon = (!inCart && item.marketItem === true && state.extApiCartReady === true)
    ? `<i class="fa-light fa-cart-shopping market-icon" aria-hidden="true"></i>`
    : '';
  const isFav = getFavNames().has(String(item.name || '').trim().toLowerCase());
  const heartHtml = `<button class="item-fav-heart${isFav ? ' is-fav' : ''}" data-fav-id="${escapeHtml(item.id)}" aria-label="Favorit">${isFav ? HEART_FILLED : HEART_EMPTY}</button>`;
  return `<div class="${cls}" data-id="${escapeHtml(item.id)}">`
    + `<div class="item-card-delete" aria-hidden="true">${TRASH_ICON}</div>`
    + `<div class="item-card-edit" aria-hidden="true">${PENCIL_ICON}</div>`
    + `<div class="item-card-content">`
    +   `<div class="item-thumb">${thumb}</div>`
    +   `<div class="item-info"><div class="item-title">${title}${marketIcon}</div>${notes}</div>`
    +   `<span class="item-side">${sideHtml}${heartHtml}</span>` // Menge links, Herz rechts
    // Abschaltbar über „Layout → Bearbeiten-Knopf anzeigen". Die Zeile ist ein
    // Flexkasten mit gap, der Rest rückt also einfach nach — kein reservierter Platz,
    // kein Verrutschen. Bearbeiten bleibt über Wischen nach rechts erreichbar.
    +   (state.showEditButton === false ? ''
        : `<button class="item-edit-btn" data-edit-id="${escapeHtml(item.id)}" aria-label="Bearbeiten"><i class="fa-light fa-pencil"></i></button>`)
    + `</div>`
    + `</div>`;
}

// Aufloesen beim Loeschen: die Zeile verblasst, wird weichgezeichnet und faellt
