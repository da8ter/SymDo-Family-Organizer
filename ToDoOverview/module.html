<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: var(--card-color);
      --card: var(--card-color);
      --text: var(--content-color);
      --muted: color-mix(in srgb, var(--content-color) 30%, transparent);
      --border: color-mix(in srgb, var(--accent-color) 30%, transparent);
      --accent: var(--accent-color);
      --radius: 14px;
      --gap: 12px;
    }

    body {
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: transparent;
    }

    .wrap {
      position: relative;
      height: 100%;
      min-height: 0;
      padding: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .wrap.clickable { cursor: pointer; }

    .stats {
      display: flex;
      gap: var(--gap);
    }
    .stat-box {
      flex: 1;
      padding: 12px 8px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      text-align: center;
    }
    .stat-box .label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .stat-box .value {
      font-size: 28px;
      font-weight: 700;
    }
    /* Pro Feld konfigurierbare Text-/Zahlenfarbe (Backend); transparent -> Systemfarbe.
       Fallbacks entsprechen den Standardfarben, falls noch kein Payload gesetzt ist. */
    .stat-open .label, .stat-open .value { color: var(--open-color, var(--accent)); }
    .stat-overdue .label, .stat-overdue .value { color: var(--overdue-color, #ff5a5a); }
    .stat-today .label, .stat-today .value { color: var(--today-color, #ffa500); }

    /* Rahmenfarbe wie Text (Backend-Schalter): Rand je Feld in der jeweiligen Textfarbe.
       Vor den overdue-bg-Regeln deklariert, damit der rote Hintergrund-Modus seinen
       Kontrast-Rand behaelt. */
    .wrap.frame-as-text .stat-open    { border-color: var(--open-color, var(--accent)); }
    .wrap.frame-as-text .stat-overdue { border-color: var(--overdue-color, #ff5a5a); }
    .wrap.frame-as-text .stat-today   { border-color: var(--today-color, #ffa500); }

    /* Fill-/Kompaktdarstellung: Felder fuellen die Kachel, grosse zentrierte Zahlen */
    .wrap.compact { justify-content: center; }
    .wrap.compact .stats { flex: 1; margin: 0; gap: 8px; }
    .wrap.compact .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
    }
    /* Eine einheitliche Schriftgroesse fuer ALLE Felder (per JS aus dem kleinsten Feld berechnet) */
    .wrap.compact .stat-box .label {
      font-size: var(--label-fs, 12px);
      white-space: nowrap;
      overflow: hidden;
      line-height: 1.1;
      margin-bottom: 1px;
    }
    .wrap.compact .stat-box .value { font-size: var(--value-fs, 40px); line-height: 1; }

    /* Hochformat: alle Felder untereinander (gleich gross) */
    .wrap.compact.stacked .stats { flex-direction: column; }

    /* Quadratisch: 2 oben nebeneinander, 1 volle Breite darunter */
    .wrap.compact.two .stats { flex-wrap: wrap; align-content: stretch; }
    .wrap.compact.two .stat-open,
    .wrap.compact.two .stat-overdue { flex: 1 1 0; }
    .wrap.compact.two .stat-today { flex: 1 1 100%; }

    /* Roter Kachel-Hintergrund bei Ueberfaelligen (Level >= 2), per Schalter aktivierbar */
    body.overdue-bg { background: var(--overdue-bg-color, #ff5a5a); }
    .wrap.overdue-bg { background: var(--overdue-bg-color, #ff5a5a); }
    .wrap.overdue-bg .stat-box { background: transparent; border-color: color-mix(in srgb, var(--overdue-text-color, #fff) 45%, transparent); }
    .wrap.overdue-bg .stat-box .label,
    .wrap.overdue-bg .stat-box .value { color: var(--overdue-text-color, #fff); }

    /* Rahmen deaktivierbar (Backend-Schalter): ohne Rahmen kein Hintergrund/Rand je Feld.
       Border bleibt transparent (statt entfernt), damit das Layout nicht springt.
       Nach den overdue-bg-Regeln deklariert, damit es auch dort greift. */
    .wrap.no-frames .stat-box { background: transparent; border-color: transparent; }
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="stats">
      <div class="stat-box stat-open">
        <div class="label" id="statOpenLabel"></div>
        <div class="value" id="statOpenValue">0</div>
      </div>
      <div class="stat-box stat-overdue">
        <div class="label" id="statOverdueLabel"></div>
        <div class="value" id="statOverdueValue">0</div>
      </div>
      <div class="stat-box stat-today">
        <div class="label" id="statTodayLabel"></div>
        <div class="value" id="statTodayValue">0</div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      let state = { open: 0, overdue: 0, today: 0, openObjectId: 0, overdueRedBackground: false };
      let lastStats = { open: 0, overdue: 0, today: 0 };
      let currentTileWidth = 0;
      let currentTileHeight = 0;

      const translate = (typeof window.translate === 'function')
        ? window.translate
        : (key) => String(key ?? '');

      function updateStats() {
        const open    = parseInt(state.open)    || 0;
        const overdue = parseInt(state.overdue) || 0;
        const today   = parseInt(state.today)   || 0;
        document.getElementById('statOpenValue').textContent    = open;
        document.getElementById('statOverdueValue').textContent = overdue;
        document.getElementById('statTodayValue').textContent   = today;
        lastStats = { open, overdue, today };
      }

      // Bei < 150px nur ein Feld: das wichtigste aus der aktivierten Menge.
      function pickSingleBox(eOpen, eOverdue, eToday, overdueCount) {
        if (eOverdue && overdueCount > 0) return 'overdue';
        if (eOpen) return 'open';
        if (eOverdue) return 'overdue';
        if (eToday) return 'today';
        return null;
      }

      // Groesste Label-Schriftgroesse (px), bei der `text` (Grossschreibung) einzeilig in innerW passt
      let _lblCtx = null;
      function maxLabelFont(text, innerW) {
        const t = String(text || '').toUpperCase();
        if (!t || innerW <= 0) return Infinity;
        if (!_lblCtx) _lblCtx = document.createElement('canvas').getContext('2d');
        _lblCtx.font = '600 100px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
        const glyph100 = _lblCtx.measureText(t).width;   // Breite bei 100px (ohne letter-spacing)
        if (glyph100 <= 0) return Infinity;
        const ls = t.length * 0.5;                       // letter-spacing 0.5px je Zeichen
        return Math.max(6, (innerW - ls) * 100 / glyph100);
      }

      // Feld-Textfarbe (Integer aus Backend) -> CSS-Farbe; -1/transparent -> Systemfarbe (--accent-color)
      function frameColorCss(colorInt) {
        let n = parseInt(colorInt);
        if (!Number.isFinite(n) || n < 0) return 'var(--accent-color)';
        n = n & 0xffffff;
        return '#' + n.toString(16).padStart(6, '0');
      }

      // Setzt die pro-Feld Text-/Zahlenfarben aus dem aktuellen State
      function applyColors() {
        const root = document.documentElement;
        root.style.setProperty('--open-color',    frameColorCss(state.openColor));
        root.style.setProperty('--overdue-color', frameColorCss(state.overdueColor));
        root.style.setProperty('--today-color',   frameColorCss(state.todayColor));
      }

      // Hintergrundfarbe (Integer aus Backend) -> CSS-Farbe + kontrastreiche Textfarbe
      function overdueColors(rgbInt) {
        let n = parseInt(rgbInt);
        if (!Number.isFinite(n) || n < 0) n = 0xff5a5a;
        n = n & 0xffffff;
        const rr = (n >> 16) & 0xff, gg = (n >> 8) & 0xff, bb = n & 0xff;
        const hex = '#' + n.toString(16).padStart(6, '0');
        const lum = (0.299 * rr + 0.587 * gg + 0.114 * bb) / 255; // 0..1
        return { bg: hex, text: lum > 0.6 ? '#000' : '#fff' };
      }

      function applyLayout() {
        const wrap = document.getElementById('wrap');
        if (!wrap) return;

        const W = currentTileWidth;
        const H = currentTileHeight;

        const boxOpen    = document.querySelector('.stat-open');
        const boxOverdue = document.querySelector('.stat-overdue');
        const boxToday   = document.querySelector('.stat-today');

        // Backend-Schalter: welche Werte sollen ueberhaupt angezeigt werden (Standard: an)
        const eOpen    = state.showOpen    !== false;
        const eOverdue = state.showOverdue !== false;
        const eToday   = state.showToday   !== false;
        const enabledCount = (eOpen ? 1 : 0) + (eOverdue ? 1 : 0) + (eToday ? 1 : 0);

        // Layout-Modus nach Seitenverhaeltnis:
        //   Querformat  -> Reihe nebeneinander
        //   quadratisch -> 2 oben + 1 darunter (nur bei 3 Feldern)
        //   Hochformat  -> alle untereinander
        const r = H > 0 ? W / H : 1;
        let mode; // 'row' | 'stack' | 'two'
        if (enabledCount >= 3) {
          if (r <= 0.8)      mode = 'stack';
          else if (r >= 1.3) mode = 'row';
          else               mode = 'two';
        } else if (enabledCount === 2) {
          mode = (r <= 1.0) ? 'stack' : 'row';
        } else {
          mode = 'row';
        }

        let vOpen = eOpen, vOverdue = eOverdue, vToday = eToday;

        // Kleinste sichtbare Feld-Dimension fuer den Modus bestimmen (fuer einheitliche Schrift)
        const GAP = 8;
        const boxDims = (m, n) => {
          if (m === 'stack') return [W, (H - GAP * (n - 1)) / n];
          if (m === 'two')   return [(W - GAP) / 2, (H - GAP) / 2]; // obere Felder sind am kleinsten
          return [(W - GAP * (n - 1)) / n, H];                      // row
        };
        let [bw, bh] = boxDims(mode, enabledCount);

        // Zu klein fuer ein Mehrfach-Layout -> nur ein Feld (fuellt die Kachel)
        const MIN_BOX = 50;
        if (enabledCount >= 2 && Math.min(bw, bh) < MIN_BOX) {
          const single = pickSingleBox(eOpen, eOverdue, eToday, lastStats.overdue);
          vOpen = single === 'open'; vOverdue = single === 'overdue'; vToday = single === 'today';
          mode = 'row';
          bw = W; bh = H;
        }

        // EINE Schriftgroesse fuer ALLE Felder (identisch), aus der kleinsten Feld-Dimension + Prozent-Regler
        const base = Math.max(0, Math.min(bw, bh));
        const vScale = (parseInt(state.valueFontScale) || 100) / 100;
        const lScale = (parseInt(state.labelFontScale) || 100) / 100;
        const valuePx = Math.round(Math.min(240, Math.max(18, base * 0.45)) * vScale);

        // Label darf NICHT umbrechen: Schriftgroesse so begrenzen, dass der laengste
        // sichtbare Text einzeilig in sein Feld passt.
        const nvis = (vOpen ? 1 : 0) + (vOverdue ? 1 : 0) + (vToday ? 1 : 0);
        const PAD_X = 18; // stat-box Innenabstand (2*8) + Reserve
        let colW;
        if (mode === 'stack')    colW = W;
        else if (mode === 'two') colW = (W - GAP) / 2;                          // schmalste Felder (oben)
        else                     colW = (W - GAP * Math.max(0, nvis - 1)) / Math.max(1, nvis);
        let labelCap = Infinity;
        const capFor = (vis, id, w) => {
          if (!vis) return;
          const el = document.getElementById(id);
          if (el) labelCap = Math.min(labelCap, maxLabelFont(el.textContent, w - PAD_X));
        };
        capFor(vOpen,    'statOpenLabel',    colW);
        capFor(vOverdue, 'statOverdueLabel', colW);
        capFor(vToday,   'statTodayLabel',   mode === 'two' ? W : colW);        // HEUTE im 2+1 volle Breite

        const labelPx = Math.round(Math.min(Math.min(46, Math.max(8, base * 0.15)) * lScale, labelCap));
        wrap.style.setProperty('--value-fs', valuePx + 'px');
        wrap.style.setProperty('--label-fs', labelPx + 'px');

        // Roter Hintergrund bei Ueberfaelligen in ALLEN Kachelgroessen (kein Level-Limit mehr)
        const overdueBg = eOverdue && lastStats.overdue > 0 && state.overdueRedBackground === true;

        // Eigenstaendige Kachel: immer Fill-Darstellung
        wrap.classList.add('compact');
        wrap.classList.toggle('stacked', mode === 'stack');
        wrap.classList.toggle('two', mode === 'two');
        const oc = overdueColors(state.overdueBackgroundColor);
        document.documentElement.style.setProperty('--overdue-bg-color', oc.bg);
        document.documentElement.style.setProperty('--overdue-text-color', oc.text);
        wrap.classList.toggle('overdue-bg', overdueBg);
        document.body.classList.toggle('overdue-bg', overdueBg);
        wrap.classList.toggle('no-frames', state.showFrames === false);
        wrap.classList.toggle('frame-as-text', state.showFrames !== false && state.frameColorLikeText === true);

        if (boxOpen)    boxOpen.style.display    = vOpen ? '' : 'none';
        if (boxOverdue) boxOverdue.style.display = vOverdue ? '' : 'none';
        if (boxToday)   boxToday.style.display   = vToday ? '' : 'none';
      }

      function applyClickTarget() {
        const wrap = document.getElementById('wrap');
        if (!wrap) return;
        const id = parseInt(state.openObjectId) || 0;
        wrap.classList.toggle('clickable', id > 0);
      }

      function handleMessage(data) {
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch (e) { return; }
        }
        if (data && typeof data === 'object' && data.type === 'state') {
          state = data;
          updateStats();
          applyColors();
          applyLayout();
          applyClickTarget();
        }
      }

      window.handleMessage = handleMessage;
      window.updateState = handleMessage;

      window.addEventListener('message', (event) => {
        if (!event) return;
        handleMessage(event.data);
      });

      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('statOpenLabel').textContent    = translate('Open Tasks');
        document.getElementById('statOverdueLabel').textContent = translate('Overdue');
        document.getElementById('statTodayLabel').textContent   = translate('Due Today');

        const wrap = document.getElementById('wrap');
        if (wrap) {
          wrap.addEventListener('click', () => {
            const id = parseInt(state.openObjectId) || 0;
            if (id > 0 && typeof openObject === 'function') {
              openObject(id);
            }
          });

          currentTileWidth = Math.round(wrap.clientWidth);
          currentTileHeight = Math.round(wrap.clientHeight);

          if (typeof ResizeObserver !== 'undefined') {
            let rafPending = false;
            const ro = new ResizeObserver(() => {
              if (rafPending) return;
              rafPending = true;
              requestAnimationFrame(() => {
                rafPending = false;
                const w = Math.round(wrap.clientWidth);
                const h = Math.round(wrap.clientHeight);
                if (w === currentTileWidth && h === currentTileHeight) return; // nur bei echter Aenderung
                currentTileWidth = w;
                currentTileHeight = h;
                applyLayout();
              });
            });
            ro.observe(wrap);
          }
        }

        updateStats();
        applyLayout();
        applyClickTarget();
      });
    })();
  </script>
</body>
</html>
