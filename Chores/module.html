<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Der Icon-Satz von Symcon. OHNE ihn bleiben alle <i> leere Kästen — die
     Ämtchen hätten kein Symbol, der Pokal keins und das Haus im Kopf auch
     nicht.

     Und es MUSS ein vollständiges Dokument sein, kein Fragment: wo ein Fragment
     eingehängt wird, entscheidet der Wirt, und ein über innerHTML eingesetzter
     script-Verweis läuft gar nicht. Genau daran hing es hier — die Kachel war
     ein Fragment und blieb deshalb ohne jedes Symbol (17.09.2026, gemeldet vom
     Nutzer). Dieselbe Falle wie zuvor in der VRR-Kachel; die übrigen Kacheln
     sind seit jeher ganze Dokumente mit dem Verweis im Kopf. -->
<script src="/icons.js"></script>
<style>
/* Symcon injiziert --card-color, --content-color und --accent-color je nach
   Visu-Design. Alles hier leitet sich daraus ab — keine Fremd-Assets.
   Gerüst, Scrollrezept und Randmechanik sind wörtlich aus der Routinen-Kachel
   übernommen: dieselben Fallen, dieselbe Lösung.

   Aufbau seit dem 17.09.2026 (Vorlage des Nutzers): eine TABELLE aus Ämtchen
   (Zeilen) und Wochentagen (Spalten), darüber eine Karte je Familienmitglied,
   daneben Gesamtfortschritt und die nächsten Ämtchen. Vorher war es nach
   Person gruppiert — wer diese Woche was hat, sah man gut, aber „an welchem
   Tag steht was an" musste man sich zusammensuchen. */
:root {
  --bg: var(--card-color, #2b2c30);
  --text: var(--content-color, #ffffff);
  --akzent: var(--accent-color, #00cdab);
  --zeile: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --karte: color-mix(in srgb, var(--card-color) 94%, var(--content-color) 6%);
  --zeile-fertig: color-mix(in srgb, var(--card-color) 96%, var(--content-color) 4%);
  --dezent: color-mix(in srgb, var(--content-color) 55%, transparent);
  --rand: color-mix(in srgb, var(--content-color) 12%, transparent);
  --spur: color-mix(in srgb, var(--content-color) 14%, transparent);
  --sym-mt: 0px;
  --sym-ms: 0px;
  --sym-mb: 0px;
  --sbw: 6px;
  /* Breite einer Tagesspalte: ein Avatar von 26 px plus Luft. */
  --tagbreite: 38px;
  --sb-pad: max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}
html[data-symdo-theme="light"] {
  --zeile: color-mix(in srgb, var(--card-color) 95%, var(--content-color) 5%);
  --karte: color-mix(in srgb, var(--card-color) 97%, var(--content-color) 3%);
  --zeile-fertig: color-mix(in srgb, var(--card-color) 98%, var(--content-color) 2%);
}
html { height: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; }
body {
  margin: 0 !important; padding: 0 !important;
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  background: transparent;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
#wrap {
  display: flex; flex-direction: column; flex: 1; min-height: 0; box-sizing: border-box;
  padding: max(var(--sym-mt), env(safe-area-inset-top, 0px)) var(--sb-pad)
           calc(var(--sym-mb) + 4px) var(--sym-ms);
}
/* Alles, was NICHT scrollt, traegt den Rest des rechten Randes selbst. */
.randrest { margin-right: calc(var(--sb-pad) + var(--sbw)); }

/* Kopfzeile: keine. Titel und Haus sind am 17.09.2026 entfallen — die Visu
   schreibt den Namen der Instanz ohnehin ueber die Kachel, und zwei
   Ueberschriften uebereinander sind eine zu viel. Mit dem Titel ging der
   Untertitel: allein stehend war er ein Satz ohne Bezug. */

/* ── Karten der Familienmitglieder ───────────────────────────────────────── */
/* Ein Raster statt einer Flex-Reihe: die Karten teilen sich die Breite immer
   VOLLSTAENDIG auf — vier nebeneinander in einer breiten Kachel, untereinander
   in einer schmalen, und dort dann ueber die ganze Breite. Als Flex-Reihe mit
   `max-width` endeten sie im Hochformat mitten im Bild (gemeldet 17.09.2026). */
#leute {
  display: grid;
  /* 220 px ist die Untergrenze einer Karte: darunter bricht der Name um oder
     wird gekuerzt. Im Hochformat passt damit genau EINE je Reihe — und die
     nimmt die volle Breite. */
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  /* KEIN seitliches Polster: die Karten stehen sonst schmaler als die Tabelle
     darunter (gemeldet 17.09.2026 mit Bild). Rechts traegt `randrest` genau
     den Streifen, den der Scrollbereich fuer seinen Balken reserviert — damit
     enden beide auf derselben Linie. */
  gap: 8px; padding: 0 0 10px;
}
#leute:empty { display: none; }
.person {
  min-width: 0;
  display: flex; align-items: center; gap: 9px;
  background: var(--karte); border: 1px solid var(--rand); border-radius: 16px;
  padding: 8px 10px; box-sizing: border-box;
}
.person.pausiert { opacity: .55; }
/* Die Fotos stehen ohne Ring (auf Wunsch, 17.09.2026) — die Farbe eines
   Mitglieds zeigt der Fortschrittsring daneben, nicht ein Rand ums Gesicht. */
.person .bild {
  width: 38px; height: 38px; border-radius: 50%; flex: 0 0 auto; overflow: hidden;
  background: color-mix(in srgb, var(--akzent) 18%, var(--bg));
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; box-sizing: border-box;
}
.person .bild img { width: 100%; height: 100%; object-fit: cover; }
.person .text { flex: 1 1 auto; min-width: 0; }
.person .name {
  font-size: 14px; font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.person .stand {
  font-size: 11px; color: var(--dezent); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
/* Der kleine Ring je Person: Fortschritt als Kreisausschnitt. */
.ring {
  flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
  background: conic-gradient(var(--mfarbe, var(--akzent)) calc(var(--p, 0) * 1%), var(--spur) 0);
  display: flex; align-items: center; justify-content: center;
}
.ring::after {
  content: ''; width: 18px; height: 18px; border-radius: 50%; background: var(--karte);
}

/* ── Scrollbereich: Tabelle, Seitenspalte, Banner ────────────────────────── */
/* Unten KEIN Polster: ein padding-bottom am Scrollbereich zaehlt zu
   scrollHeight und laesst den Griff erscheinen, obwohl optisch nichts fehlt. */
#liste {
  flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px;
  padding: 0 var(--sb-pad) 0 0;
  overflow-y: auto;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
}
/* ── Scrollleisten: Hausrezept der grossen Kacheln ────────────────────────
   overflow-y: scroll statt auto — der 6px-Streifen ist IMMER reserviert, der
   rechte Abstand bleibt also gleich, ob der Balken gerade sichtbar ist oder
   nicht (die Spur ist transparent, der Griff erscheint nur bei Bedarf).
   scrollbar-color/-width und ::-webkit-scrollbar schliessen sich gegenseitig
   aus: ist der Standard gesetzt, ignoriert WebKit die Pseudoelemente (gemessen
   11px statt 6px, und die Spur wird in Safari hell gemalt). Deshalb bekommt
   WebKit die Pseudoelemente, der Standard gilt nur, wo es sie nicht gibt.
   Jeder Selektor braucht sein EIGENES Pseudoelement — in einer Liste haengt es
   sonst nur am letzten. */
#liste::-webkit-scrollbar { width: 6px; height: 6px; }
#liste::-webkit-scrollbar-track { background: transparent; }
#liste::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--akzent) 70%, transparent);
  border-radius: 999px;
}
@supports not selector(::-webkit-scrollbar) {
  #liste {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--akzent) 70%, transparent) transparent;
  }
}
/* Tabelle und Seitenspalte nebeneinander — aber erst, wenn die Kachel breit
   genug ist. Darunter stapeln sie sich, die Tabelle zuerst: sie ist der
   Grund, warum jemand hinsieht. */
/* Untereinander gestapelt richtet sich jeder Kasten nach seinem Inhalt.
   NEBENEINANDER nicht: dort reichen beide Spalten gleich tief (`stretch`, die
   Vorgabe des Rasters). Die Tabelle ist die Hauptsache — sie darf nicht kuerzer
   enden als Gesamtfortschritt und „Naechste Aemtchen" daneben, sonst steht die
   Kachel schief (auf Wunsch, 17.09.2026). Der Platz, der der Tabelle dabei
   zuwaechst, bleibt unter der letzten Zeile leer. */
#inhalt { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-items: start; }
@media (min-width: 820px) {
  #inhalt { grid-template-columns: minmax(0, 1fr) 270px; align-items: stretch; }
  /* Sind BEIDE Kaesten der Seitenspalte abgeschaltet, gibt es keine zweite
     Spalte — sonst bliebe rechts ein leerer Streifen von 270 px. */
  #inhalt.ohne-seite { grid-template-columns: minmax(0, 1fr); }
}
#hinweis { padding: 0 2px 2px; font-size: 12px; color: var(--dezent); }
#hinweis:empty { display: none; }

/* ── Die Tabelle ─────────────────────────────────────────────────────────── */
.tafel {
  background: var(--karte); border: 1px solid var(--rand); border-radius: 18px;
  padding: 4px 2px 6px; min-width: 0; overflow: hidden;
}
/* Ein gemeinsames Raster fuer Kopf und Zeilen: nur so stehen die Tage wirklich
   untereinander. Feste Spaltenbreiten, KEIN `auto` — sonst richtet sich jede
   Zeile nach ihrem eigenen Inhalt. */
.kopfzeile, .zeile {
  display: grid;
  grid-template-columns: minmax(90px, 1fr) repeat(7, var(--tagbreite));
  align-items: center; gap: 0;
}
.kopfzeile {
  padding: 8px 8px 8px 10px; font-size: 10px; font-weight: 700; color: var(--dezent);
  border-bottom: 1px solid var(--rand);
}
.kopfzeile .tag { text-align: center; line-height: 1.25; }
.kopfzeile .tag b { display: block; font-size: 11px; font-weight: 800; color: var(--text); }
.kopfzeile .tag.heute b, .kopfzeile .tag.heute { color: var(--akzent); }
.zeile { padding: 5px 8px 5px 10px; border-bottom: 1px solid var(--rand); }
.zeile:last-child { border-bottom: 0; }
.zeile.fertig .titel { color: var(--dezent); }
/* Der heutige Tag zieht sich als schwacher Streifen durch alle Zeilen. */
.zeile .zelle.heute, .kopfzeile .tag.heute {
  background: color-mix(in srgb, var(--akzent) 12%, transparent);
}
.kopfzeile .tag.heute { border-radius: 9px 9px 0 0; }
.aufgabe { display: flex; align-items: center; gap: 9px; min-width: 0; padding-right: 8px; }
.sym {
  flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  background: var(--afarbe, var(--akzent));
  /* Die Symbole der Visu sind Umrisse: auf der farbigen Flaeche gehoeren sie
     in Weiss, sonst verschwinden sie darin. Beide Formen bemessen — /icons.js
     ersetzt das <i> nachtraeglich durch ein <svg>. */
  color: #fff;
}
.sym i, .sym svg { width: 16px; height: 16px; }
#banner .pokal i, #banner .pokal svg { width: 24px; height: 24px; }
.titel {
  min-width: 0; font-size: clamp(12px, 3.6vmin, 14px); font-weight: 700; line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.zelle {
  display: flex; align-items: center; justify-content: center; gap: 3px;
  align-self: stretch; min-height: 44px; padding: 3px 0; box-sizing: border-box;
  /* Die duenne Linie zwischen den Tagen. Sie sitzt LINKS an jeder Spalte —
     auch an der ersten, die damit die Tage von der Aufgabe trennt. */
  border-left: 1px solid var(--rand);
  flex-wrap: wrap;
}
.zelle .nix { color: var(--dezent); font-size: 12px; }
/* Ein Platz: der Avatar dessen, der dran ist. Erledigt heisst voll und mit
   Haekchen, offen heisst blass — so sieht man den Stand der Woche im Raster,
   ohne eine Zahl zu lesen. */
.platz {
  position: relative; border: 0; padding: 0; background: transparent; cursor: pointer;
  width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
}
.platz .bild {
  width: 26px; height: 26px; border-radius: 50%; overflow: hidden; box-sizing: border-box;
  background: color-mix(in srgb, var(--akzent) 18%, var(--bg));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--text);
}
.platz .bild img { width: 100%; height: 100%; object-fit: cover; }
/* Ein offener Platz wird NICHT abgedunkelt (auf Wunsch, 17.09.2026): das
   Gesicht soll erkennbar bleiben. Erledigt erkennt man am gruenen Haken, nicht
   an der Helligkeit. Blass bleibt allein, was noch nicht dran war — das ist
   kein Angebot, sondern ein Platzhalter. */
.platz.uebertrag .bild {
  border: 2px dashed color-mix(in srgb, var(--content-color) 45%, transparent);
}
/* Gesperrt heisst hier zweierlei: eine fremde Woche (nur ansehen) und ein Tag,
   der noch nicht dran war. Der kuenftige Tag bleibt sichtbar, aber blass — er
   ist ein Platzhalter, kein Angebot. */
.platz:disabled { cursor: default; }
.platz.spaeter .bild { opacity: .5; }
.platz .haken {
  position: absolute; right: -3px; bottom: -3px;
  width: 13px; height: 13px; border-radius: 50%;
  background: var(--akzent); color: var(--bg);
  font-size: 9px; font-weight: 900; line-height: 13px; text-align: center;
  transform: scale(0); transition: transform .22s cubic-bezier(.22,1.6,.36,1);
}
.platz.fertig .haken { transform: scale(1); }

/* ── Seitenspalte ────────────────────────────────────────────────────────── */
.seite { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.seitenkarte {
  background: var(--karte); border: 1px solid var(--rand); border-radius: 18px;
  padding: 12px 14px;
}
.seitenkarte h3 { margin: 0 0 10px; font-size: 14px; font-weight: 800; }
.gesamt { display: flex; align-items: center; gap: 14px; }
.donut {
  flex: 0 0 auto; width: 84px; height: 84px; border-radius: 50%;
  background: conic-gradient(var(--akzent) calc(var(--p, 0) * 1%), var(--spur) 0);
  display: flex; align-items: center; justify-content: center;
}
.donut .loch {
  width: 64px; height: 64px; border-radius: 50%; background: var(--karte);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800;
}
.gesamt .zahlen { min-width: 0; }
.gesamt .gross { font-size: 15px; font-weight: 800; line-height: 1.25; }
.gesamt .lob { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--akzent); }
.naechste { display: flex; flex-direction: column; gap: 8px; }
.naechste .eintrag { display: flex; align-items: center; gap: 9px; min-width: 0; }
.naechste .text { flex: 1 1 auto; min-width: 0; }
.naechste .was {
  font-size: 13px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.naechste .wann { font-size: 11px; color: var(--dezent); }
.naechste .wann.faellig { color: #f87171; font-weight: 700; }
.naechste .bild {
  width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto; overflow: hidden;
  box-sizing: border-box;
  background: color-mix(in srgb, var(--akzent) 18%, var(--bg));
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800;
}
.naechste .bild img { width: 100%; height: 100%; object-fit: cover; }
.leerzeile { font-size: 12px; color: var(--dezent); }

/* ── Banner ──────────────────────────────────────────────────────────────── */
#banner {
  display: flex; align-items: center; gap: 12px;
  background: var(--karte); border: 1px solid var(--rand); border-radius: 18px;
  padding: 12px 14px; margin-right: 0;
}
#banner:empty { display: none; }
#banner .pokal { font-size: 22px; flex: 0 0 auto; color: var(--akzent); }
#banner .btitel { font-size: 14px; font-weight: 800; }
#banner .btext { font-size: 12px; color: var(--dezent); margin-top: 2px; }

#leer { padding: 18px 8px; text-align: center; color: var(--dezent); font-size: 13px; }
#leer:empty { display: none; }

/* Schmale Kacheln: die Tagesspalten schrumpfen, damit sieben davon neben dem
   Namen bleiben. Sie zu verstecken waere falsch — sie sind der Inhalt. */
@media (max-width: 460px) {
  :root { --tagbreite: 30px; }
  .platz, .platz .bild { width: 22px; height: 22px; }
  .sym { width: 26px; height: 26px; font-size: 13px; }
  .kopfzeile, .zeile { grid-template-columns: minmax(64px, 1fr) repeat(7, var(--tagbreite)); }
}
</style>
</head>
<body>

<div id="wrap">
  <div id="leute" class="randrest"></div>
  <div id="liste">
    <div id="hinweis"></div>
    <div id="inhalt">
      <div id="tafel" class="tafel"></div>
      <div id="seite" class="seite"></div>
    </div>
    <div id="banner"></div>
    <div id="leer"></div>
  </div>
</div>
<script>
/* In einer IIFE gekapselt: die Tile-Visu injiziert selbst globale Bindungen
   (const translate, const requestAction, openObject) — gleichnamige Top-Level-
   Deklarationen braechen das ganze Script mit „Identifier already declared". */

/* ── Scrollen in der Kachel halten ────────────────────────────────────────────
   html-sdk.js von Symcon haengt an window ein `onwheel`, das JEDES deltaY an die
   Visualisierung meldet (postScroll), und meldet touchstart/touchmove als
   Position weiter. Die Visu scrollt daraufhin mit — unabhaengig davon, ob die
   Kachel die Geste selbst verbraucht hat. Dagegen hilft kein CSS: weder
   overscroll-behavior noch overflow greifen, weil es kein Ketten ist, sondern
   eine ausdrueckliche Weitergabe.

   Deshalb werden die Ereignisse in der ABFANG-Phase an document gestoppt. Das
   liegt vor der Blasen-Phase an window, wo html-sdk.js zuhoert — die Meldung
   unterbleibt also. Das Standardverhalten bleibt unberuehrt, die Kachel scrollt
   normal weiter; nur an den Raendern wird zusaetzlich preventDefault gerufen,
   damit dort nichts durchrutscht.

   Wortgleich aus der Stundenplan-Kachel uebernommen, nur die Bereichsliste ist
   eine andere. Ueber document und nicht ueber die Bereiche selbst, weil deren
   Inhalt bei jedem Zeichnen neu entsteht. */
(function scrollInDerKachelHalten() {
  const SCROLL_BEREICHE = '#liste';

  /* Der naechste Vorfahr, der in DIESER Richtung noch Weg hat. Ohne die
     Richtungsfrage gaelte ein Bereich, der schon am Anschlag steht, als
     zustaendig — und die Geste verpuffte. */
  function zustaendigerScroller(ziel, dx, dy) {
    let el = (ziel instanceof Element) ? ziel : null;
    while (el && el !== document.body) {
      if (el.matches && el.matches(SCROLL_BEREICHE)) {
        const maxY = el.scrollHeight - el.clientHeight;
        const maxX = el.scrollWidth - el.clientWidth;
        const gehtY = maxY > 1 && ((dy < 0 && el.scrollTop > 0)
                                || (dy > 0 && el.scrollTop < maxY - 1));
        const gehtX = maxX > 1 && ((dx < 0 && el.scrollLeft > 0)
                                || (dx > 0 && el.scrollLeft < maxX - 1));
        if (gehtY || gehtX) { return el; }
      }
      el = el.parentElement;
    }
    return null;
  }

  document.addEventListener('wheel', function (e) {
    if (!zustaendigerScroller(e.target, e.deltaX || 0, e.deltaY || 0)) {
      // Nichts kann die Geste verbrauchen — dann soll sie auch nirgends wirken,
      // statt als Ersatzhandlung die ganze Visu zu bewegen.
      e.preventDefault();
    }
    e.stopPropagation();
  }, { passive: false, capture: true });

  let letzteY = null, letzteX = null;
  document.addEventListener('touchstart', function (e) {
    if (e.touches && e.touches.length === 1) {
      letzteX = e.touches[0].clientX;
      letzteY = e.touches[0].clientY;
    } else {
      letzteX = letzteY = null;
    }
    e.stopPropagation();
  }, { passive: true, capture: true });

  document.addEventListener('touchmove', function (e) {
    if (!e.touches || e.touches.length !== 1 || letzteY === null) {
      e.stopPropagation();
      return;
    }
    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    // Umgekehrtes Vorzeichen: nach oben wischen heisst nach unten scrollen.
    const dy = letzteY - y, dx = letzteX - x;
    letzteX = x; letzteY = y;
    if (!zustaendigerScroller(e.target, dx, dy)) { e.preventDefault(); }
    e.stopPropagation();
  }, { passive: false, capture: true });

  document.addEventListener('touchend', function () {
    letzteX = letzteY = null;
  }, { passive: true, capture: true });
})();

(function () {
'use strict';

/* Systemraender aus der Adresse uebernehmen, so frueh wie moeglich — die
   Variablen muessen vor dem ersten Zeichnen stehen. Dieselbe Mechanik wie in
   der Stundenplan-Kachel: Der Rahmen traegt die Raender, damit der Scrollbalken
   MITTIG im rechten Randstreifen sitzt statt daneben. */
(function systemRaender() {
  try {
    const p = new URLSearchParams(window.location.search);
    const px = (name) => {
      const v = parseInt(p.get(name), 10);
      return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    const wurzel = document.documentElement.style;
    const mt = px('margintop');    if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
    const ms = px('marginside');   if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
    const mb = px('marginbottom'); if (mb !== null) { wurzel.setProperty('--sym-mb', mb); }
  } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
})();

/* Hell/Dunkel aus der Luminanz der Kartenfarbe — wörtlich das Muster der
   übrigen Kacheln (symdoLightTiles). */
(function () {
  function anwenden() { try {
    var p = document.createElement('span');
    p.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(--card-color)';
    (document.body || document.documentElement).appendChild(p);
    var c = getComputedStyle(p).color; p.remove();
    var m = /(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(c); if (!m) return;
    var l = 0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3];
    document.documentElement.setAttribute('data-symdo-theme', l < 128 ? 'dark' : 'light');
  } catch (e) {} }
  anwenden();
  try { if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', anwenden); } catch (e) {}
})();

let zustand = null;          // letzter Payload vom Modul
let unterwegs = {};          // "chore:slot" => true, solange die Aktion laeuft

/* Eine feste Farbleiter fuer Personen und Aemtchen.

   Sonst leitet diese Kachel jede Farbe aus dem Visu-Design ab. Hier nicht: die
   Vorlage lebt davon, dass jede Aufgabe ihr eigenes farbiges Symbol hat und
   jedes Familienmitglied seinen Ring wiedererkennt. Die Zuordnung haengt an der
   Kennung, nicht an der Reihenfolge — eine neue Aufgabe faerbt also keine
   andere um. */
const FARBEN = ['#ef4444', '#f97316', '#f6b73c', '#22c55e', '#14b8a6',
                '#38bdf8', '#6366f1', '#a855f7', '#ec4899', '#84cc16'];
function farbeVon(kennung) {
  const s = String(kennung || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return FARBEN[h % FARBEN.length];
}
/**
 * Die Farbe eines Aemtchens: die im Formular gewaehlte, sonst die aus der
 * Leiter. So sehen zwei Aemtchen nie gleich aus, auch wenn niemand eine Farbe
 * vergeben hat.
 */
function aemtchenFarbe(a) {
  const roh = (a && typeof a.color === 'string') ? a.color : '';
  return /^#[0-9a-f]{6}$/i.test(roh) ? roh : farbeVon(a ? a.id : '');
}
/**
 * Die Farbe eines Mitglieds: die im Gateway gewaehlte, sonst die aus der
 * Leiter. So bleibt jedes Gesicht unterscheidbar, auch wenn niemand im
 * Formular eine Farbe vergeben hat.
 */
function mitgliedFarbe(id) {
  const p = mitglied(id);
  const roh = (p && typeof p.color === 'string') ? p.color : '';
  return /^#[0-9a-f]{6}$/i.test(roh) ? roh : farbeVon(id);
}

/**
 * Das Symbol eines Aemtchens.
 *
 * Es kommt als Font-Awesome-Name OHNE Praefix aus dem Formular (`SelectIcon`);
 * die Visu liefert die Symbolschrift nach. Fehlt die Wahl, nimmt die Kachel
 * den Besen — irgendein Bild ist besser als ein Loch in der Zeile.
 */
function symbolHtml(a) {
  const roh = String((a && a.icon) || '').trim().replace(/^fa-/, '');
  const name = /^[a-z0-9-]+$/i.test(roh) ? roh : 'broom';
  return '<i class="fa-light fa-' + name + '"></i>';
}

function el(id) { return document.getElementById(id); }
function txt(schluessel, vorgabe) {
  const t = (zustand && zustand.texts) || {};
  return t[schluessel] || vorgabe || schluessel;
}
function fuellen(vorlage, a, b) {
  return String(vorlage).replace('%1$d', String(a)).replace('%2$d', String(b));
}
function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** Der Anfangsbuchstabe als Ersatz, wenn kein Foto hinterlegt ist. */
function bildHtml(person) {
  if (person && person.avatar) {
    return '<img src="' + escHtml(person.avatar) + '" alt="">';
  }
  const name = (person && person.name) || '';
  return name ? escHtml(name.slice(0, 1).toUpperCase()) : '?';
}

/* Die Kachel zeigt KEIN Datum.

   Der Plan ist eine Woche, die sich wiederholt — „Müll rausbringen am
   Dienstag" gilt jede Woche. Ein Datum daneben behauptet mehr, als der Plan
   weiß, und die drei Ansichten heißen deshalb schlicht „Letzte Woche",
   „Diese Woche" und „Nächste Woche" (Entscheidung des Nutzers, 17.09.2026).
   Die Wochenkennung reist weiter mit — sie hängt an jedem Häkchen —, sie wird
   nur nicht mehr angezeigt. */

/** Die Spalte, in der heute steht. */
function heuteSpalte() {
  return typeof zustand.todayCol === 'number' ? zustand.todayCol : -1;
}

/**
 * Wer ist fuer dieses Aemtchen zustaendig?
 *
 * Am PLATZ steht es genauer als am Aemtchen: ein abgehaktes behaelt den, der
 * es wirklich getan hat, auch wenn der Kreis inzwischen weitergerueckt ist.
 */
function halterVon(a, platz) {
  return (platz && platz.memberId) || a.memberId || '';
}

function mitglied(id) {
  return ((zustand.members || {})[id]) || null;
}

/**
 * Die Kachel zeigt die Woche als TABELLE: Aemtchen in den Zeilen, Wochentage
 * in den Spalten, in jeder Zelle das Gesicht dessen, der dran ist. Damit
 * beantwortet ein Blick beide Fragen — wer macht was, und an welchem Tag.
 */
function zeichnen() {
  if (!zustand) { return; }

  const aemtchen = Array.isArray(zustand.chores) ? zustand.chores : [];
  el('hinweis').textContent = aemtchenMitUebertrag() ? txt('carriedHint', '') : '';

  if (aemtchen.length === 0) {
    el('leute').innerHTML = '';
    el('tafel').innerHTML = '';
    el('seite').innerHTML = '';
    el('banner').innerHTML = '';
    el('leer').textContent = txt('empty', '');
    return;
  }
  el('leer').textContent = '';

  /* Was gezeigt wird, entscheidet das Formular. Fehlt die Angabe (aeltere
     Nutzlast), bleibt alles an — so war es vorher. */
  const zeige = (zustand.show && typeof zustand.show === 'object') ? zustand.show : {};
  const an = (schluessel) => zeige[schluessel] !== false;

  el('leute').innerHTML = an('members') ? leuteHtml(aemtchen) : '';
  el('tafel').innerHTML = tafelHtml(aemtchen);
  el('seite').innerHTML = seiteHtml(aemtchen, an);
  el('banner').innerHTML = an('banner') ? bannerHtml() : '';
  el('inhalt').classList.toggle('ohne-seite', !an('progress') && !an('upNext'));
  binden();
}

/** Gibt es in dieser Woche einen Uebertrag aus der Vorwoche? */
function aemtchenMitUebertrag() {
  return (Array.isArray(zustand.chores) ? zustand.chores : [])
    .some((a) => (Array.isArray(a.slots) ? a.slots : []).some((s) => s.carried === true));
}

/**
 * Die Karten der Familienmitglieder.
 *
 * Gezaehlt wird ueber die PLAETZE, nicht ueber die Aemtchen: ein Aemtchen kann
 * mehrmals in der Woche anstehen, und abgehakt wird jeder Tag einzeln.
 */
function leuteHtml(aemtchen) {
  const stand = {};
  const zaehle = (id, fertig) => {
    if (!id) { return; }
    if (!stand[id]) { stand[id] = { done: 0, total: 0 }; }
    stand[id].total++;
    if (fertig) { stand[id].done++; }
  };
  aemtchen.forEach((a) => {
    (Array.isArray(a.slots) ? a.slots : []).forEach((s) => {
      zaehle(halterVon(a, s), s.done === true);
    });
  });

  return (zustand.order || []).map((id) => {
    const p = mitglied(id) || { name: id };
    const s = stand[id] || { done: 0, total: 0 };
    /* Wer diese Woche nichts hat, faellt weg — AUSSER er setzt aus: dass jemand
       Pause hat, erklaert, warum ein anderer zwei Aemtchen traegt. Das zu
       verstecken liesse die Verteilung willkuerlich aussehen. */
    if (s.total === 0 && !p.paused) { return ''; }
    const anteil = s.total > 0 ? Math.round(s.done * 100 / s.total) : 0;
    return '<div class="person' + (p.paused ? ' pausiert' : '') + '" style="--mfarbe:' + mitgliedFarbe(id) + '">' +
      '<div class="bild">' + bildHtml(p) + '</div>' +
      '<div class="text">' +
        '<div class="name">' + escHtml(p.name || id) + '</div>' +
        '<div class="stand">' + (p.paused && s.total === 0
          ? escHtml(txt('paused', 'Pause'))
          : s.done + '/' + s.total + ' ' + escHtml(txt('done', 'done'))) + '</div>' +
      '</div>' +
      (s.total > 0 ? '<div class="ring" style="--p:' + anteil + '"></div>' : '') +
      '</div>';
  }).join('');
}

/** Kopfzeile und eine Zeile je Aemtchen. */
function tafelHtml(aemtchen) {
  const namen = Array.isArray(zustand.dayNames) ? zustand.dayNames : [];
  const heute = heuteSpalte();
  const kopf = '<div class="kopfzeile"><div>' + escHtml(txt('task', 'Chore')) + '</div>' +
    namen.map((n, i) => '<div class="tag' + (i === heute ? ' heute' : '') + '">' +
      '<b>' + escHtml(n) + '</b></div>').join('') +
    '</div>';
  return kopf + aemtchen.map((a) => zeileHtml(a, heute)).join('');
}

function zeileHtml(a, heute) {
  const alle = a.total > 0 && a.doneCount >= a.total;
  /* Ein Platz je Tag — die uebrigen Tage bleiben LEER. Genau dafuer sind die
     Spalten da: man sieht auf einen Blick, an welchen Tagen ein Aemtchen dran
     ist und an welchen nicht. */
  const zellen = [];
  for (let i = 0; i < 7; i++) { zellen[i] = ''; }
  (Array.isArray(a.slots) ? a.slots : []).forEach((s) => {
    const spalte = Math.max(0, Math.min(6, Number(s.col) || 0));
    zellen[spalte] += platzHtml(a, s);
  });
  return '<div class="zeile' + (alle ? ' fertig' : '') + '">' +
    '<div class="aufgabe">' +
      '<div class="sym" style="--afarbe:' + aemtchenFarbe(a) + '">' + symbolHtml(a) + '</div>' +
      '<div class="titel">' + escHtml(a.name) + '</div>' +
    '</div>' +
    zellen.map((z, i) => '<div class="zelle' + (i === heute ? ' heute' : '') + '">' +
      (z || '<span class="nix">–</span>') + '</div>').join('') +
    '</div>';
}

/**
 * Ein Platz in der Tabelle: das Gesicht dessen, der dran ist.
 *
 * Ein Tag, der noch nicht dran war, bleibt sichtbar, aber blass und nicht
 * tippbar — er ist ein Platzhalter, kein Angebot. Was das Modul als `locked`
 * meldet, entscheidet es selbst: Wechselzeit und erster Wochentag sind
 * Einstellungen, und die kennt die Kachel nicht.
 */
function platzHtml(a, s) {
  const id = halterVon(a, s);
  const p = mitglied(id);
  const spaeter = s.locked === true;
  const marke = a.id + ':' + s.key;
  const titel = s.carried ? txt('carried', '') : (spaeter ? txt('later', '') : (p ? (p.name || '') : ''));
  return '<button type="button" class="platz ' + (s.done ? 'fertig' : 'offen') +
    (s.carried ? ' uebertrag' : '') + (spaeter ? ' spaeter' : '') + '"' +
    ' style="--mfarbe:' + mitgliedFarbe(id) + '"' +
    ' data-marke="' + escHtml(marke) + '" data-chore="' + escHtml(a.id) + '"' +
    ' data-slot="' + escHtml(s.key) + '" data-ziel="' + (s.done ? '0' : '1') + '"' +
    (spaeter ? ' disabled' : '') +
    ' title="' + escHtml(titel) + '">' +
    '<span class="bild">' + (p ? bildHtml(p) : '?') + '</span>' +
    '<span class="haken">✓</span></button>';
}

/** Gesamtfortschritt und die naechsten offenen Aemtchen — je nach Schalter. */
function seiteHtml(aemtchen, an) {
  const anteil = zustand.progress || 0;
  const lob = anteil >= 100 ? txt('praiseAll', '') : (anteil >= 70 ? txt('praiseHigh', '')
    : (anteil >= 40 ? txt('praiseMid', '') : txt('praiseLow', '')));
  const gesamt = '<div class="seitenkarte"><h3>' + escHtml(txt('overall', 'Overall progress')) + '</h3>' +
    '<div class="gesamt">' +
      '<div class="donut" style="--p:' + anteil + '"><div class="loch">' + anteil + '%</div></div>' +
      '<div class="zahlen"><div class="gross">' +
        escHtml(fuellen(txt('doneOf', '%1$d of %2$d'), zustand.doneCount || 0, zustand.totalCount || 0)) +
      '</div><div class="lob">' + escHtml(lob) + '</div></div>' +
    '</div></div>';

  const naechste = '<div class="seitenkarte"><h3>' + escHtml(txt('upNext', 'Up next')) + '</h3>' +
    '<div class="naechste">' + naechsteHtml(aemtchen) + '</div></div>';
  return (an('progress') ? gesamt : '') + (an('upNext') ? naechste : '');
}

/**
 * Die naechsten offenen Plaetze, nach Tag sortiert.
 *
 * Uhrzeiten gibt es im Modell nicht — ein Aemtchen gehoert zu einem TAG.
 * Deshalb steht dort „heute", „morgen" oder der Wochentag mit Datum. Was schon
 * vorbei und offen ist, steht oben und traegt den Vermerk „ueberfaellig": es
 * wartet ja weiter.
 */
function naechsteHtml(aemtchen) {
  const heute = heuteSpalte();
  const namen = Array.isArray(zustand.dayNames) ? zustand.dayNames : [];
  const offen = [];
  aemtchen.forEach((a) => {
    (Array.isArray(a.slots) ? a.slots : []).forEach((s) => {
      if (s.done === true) { return; }
      offen.push({ a: a, s: s, col: Math.max(0, Math.min(6, Number(s.col) || 0)) });
    });
  });
  if (offen.length === 0) {
    return '<div class="leerzeile">' + escHtml(txt('nothingOpen', '')) + '</div>';
  }
  offen.sort((x, y) => x.col - y.col);
  return offen.slice(0, 5).map((o) => {
    const p = mitglied(halterVon(o.a, o.s));
    let wann = namen[o.col] || '';
    let klasse = 'wann';
    if (heute >= 0) {
      if (o.col === heute) { wann = txt('today', 'Today'); }
      else if (o.col === heute + 1) { wann = txt('tomorrow', 'Tomorrow'); }
      else if (o.col < heute) { wann = wann + ' · ' + txt('overdue', ''); klasse += ' faellig'; }
    }
    return '<div class="eintrag">' +
      '<div class="sym" style="--afarbe:' + aemtchenFarbe(o.a) + '">' + symbolHtml(o.a) + '</div>' +
      '<div class="text"><div class="was">' + escHtml(o.a.name) + '</div>' +
      '<div class="' + klasse + '">' + escHtml(wann) + '</div></div>' +
      (p ? '<div class="bild">' + bildHtml(p) + '</div>' : '') +
      '</div>';
  }).join('');
}

function bannerHtml() {
  return '<div class="pokal"><i class="fa-light fa-trophy"></i></div><div><div class="btitel">' +
    escHtml(txt('teamTitle', '')) + '</div><div class="btext">' +
    escHtml(txt('teamText', '')) + '</div></div>';
}

function binden() {
  el('tafel').querySelectorAll('.platz:not([disabled])').forEach((b) => {
    b.addEventListener('click', () => tippen(b));
  });
}

/**
 * Ein Haken. Optimistisch zeichnen, dann melden — mit ZIELZUSTAND und einer
 * Sperre gegen den Doppeltipp: eine zweite Zustellung darf das Haekchen nicht
 * zuruecknehmen.
 */
function tippen(knopf) {
  const marke = knopf.dataset.marke;
  if (unterwegs[marke]) { return; }
  unterwegs[marke] = true;
  setTimeout(() => { delete unterwegs[marke]; }, 1500);
  const ziel = knopf.dataset.ziel === '1';
  knopf.classList.toggle('fertig', ziel);
  knopf.classList.toggle('offen', !ziel);
  knopf.dataset.ziel = ziel ? '0' : '1';
  if (typeof requestAction === 'function') {
    requestAction('Check', JSON.stringify({
      week: zustand ? zustand.week : '',
      chore: knopf.dataset.chore,
      slot: knopf.dataset.slot,
      done: ziel
    }));
  }
}

// ── Anbindung an die Visu ───────────────────────────────────────────────────
function handleMessage(daten) {
  if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
  if (!daten || typeof daten !== 'object' || daten.type !== 'state') { return; }
  zustand = daten;
  zeichnen();
}
window.handleMessage = handleMessage;
window.updateState = handleMessage;
window.addEventListener('message', (event) => { if (event) { handleMessage(event.data); } });

/* Minuten-Tick: die Wochengrenze ohne Serverhilfe nachziehen. Der Server
   liefert beim naechsten Push die neue Woche; bis dahin bleibt die Anzeige
   stehen, statt eine falsche Woche zu behaupten. */
setInterval(() => { if (zustand) { zeichnen(); } }, 60000);
})();
</script>
</body>
</html>
