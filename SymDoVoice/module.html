<!-- SymDo Voice — Etappe 0: Machbarkeitsprobe.

     Diese Fassung der Kachel spricht noch nicht. Sie prüft in der ECHTEN
     Umgebung (Visu-iframe, Symcon-App), ob der geplante Weg trägt:
       1. Umgebung  — sicherer Kontext, WebRTC, Mikrofon, Spracherkennung
       2. ICE       — kommt UDP nach draußen (srflx-Kandidat über STUN)?
       3. OpenAI    — ist /v1/realtime/calls per fetch erreichbar (CSP!),
                      und ist der Location-Kopf lesbar (call_id → Not-Aus)?
     Das Ergebnis steht in der Kachel UND wird per requestAction ans Modul
     gemeldet — ablesbar im Konfigurationsformular, auch vom Handy aus. -->
<style>
:root {
  --bg: var(--card-color, #2b2c30);
  --text: var(--content-color, #ffffff);
  --akzent: var(--accent-color, #00cdab);
  --zeile: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --dezent: color-mix(in srgb, var(--content-color) 55%, transparent);
  --rand: color-mix(in srgb, var(--content-color) 12%, transparent);
  --gruen: #34c759;
  --rot: #ff4d4d;
  --orange: #ff9500;
  --sym-mt: 0px; --sym-ms: 0px; --sym-mb: 0px;
  --sbw: 6px;
  --sb-pad: max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}
html[data-symdo-theme="light"] {
  --zeile: color-mix(in srgb, var(--card-color) 94%, var(--content-color) 6%);
}
/* Das Systempadding wird neutralisiert; die Raender traegt #wrap selbst. */
html { height: 100%; display: flex; flex-direction: column; }
body {
  margin: 0 !important; padding: 0 !important;
  background: transparent; overflow: hidden;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex; flex-direction: column; flex: 1; min-height: 0;
}
#wrap {
  display: flex; flex-direction: column; flex: 1; min-height: 0; box-sizing: border-box;
  padding: max(var(--sym-mt), env(safe-area-inset-top, 0px)) var(--sb-pad)
           calc(var(--sym-mb) + 4px) var(--sym-ms);
}
h2 { margin: 4px 0 10px; font-size: 17px; }
h2 .unter { display: block; font-size: 12px; font-weight: 400; color: var(--dezent); margin-top: 2px; }
#fazit {
  border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px;
  background: var(--zeile); margin-bottom: 10px;
}
#fazit.gut { color: var(--gruen); }
#fazit.schlecht { color: var(--rot); }
#fazit.teils { color: var(--orange); }
/* Unten KEIN Polster am Scrollbereich (zaehlt zu scrollHeight → Griff fuer nichts). */
#liste {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto;
  scrollbar-gutter: stable;
  overscroll-behavior: contain;
  padding: 0 var(--sb-pad) 0 0;
}
#liste::-webkit-scrollbar { width: 6px; height: 6px; }
#liste::-webkit-scrollbar-track { background: transparent; }
#liste::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--akzent) 70%, transparent);
  border-radius: 999px;
}
@supports not selector(::-webkit-scrollbar) {
  #liste { scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--akzent) 70%, transparent) transparent; }
}
.punkt {
  display: flex; align-items: baseline; gap: 8px;
  background: var(--zeile); border-radius: 10px;
  padding: 8px 10px; margin-bottom: 6px; font-size: 13px;
}
.punkt .zeichen { flex: none; font-weight: 700; }
.punkt .zeichen.ok { color: var(--gruen); }
.punkt .zeichen.nein { color: var(--rot); }
.punkt .zeichen.info { color: var(--dezent); }
.punkt .wert { color: var(--dezent); margin-left: auto; text-align: right; word-break: break-all; }
#knopfzeile { padding-top: 8px; }
#nochmal {
  width: 100%; border: 0; border-radius: 12px; padding: 12px;
  background: color-mix(in srgb, var(--text) 7%, transparent);
  color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer;
}
</style>
<div id="wrap">
  <h2>Sprachassistent
    <span class="unter">Machbarkeitsprobe — läuft von selbst und meldet ans Modul</span>
  </h2>
  <div id="fazit">Probe läuft …</div>
  <div id="liste"></div>
  <div id="knopfzeile"><button type="button" id="nochmal">Erneut prüfen</button></div>
</div>
<script>
/* IIFE: die Tile-Visu injiziert eigene globale Bindungen (const translate,
   const requestAction, openObject) — gleichnamige Top-Level-Deklarationen
   braechen das ganze Script. */
(function () {
'use strict';

/* Systemraender aus der Adresse — vor dem ersten Zeichnen. */
(function systemRaender() {
  try {
    var p = new URLSearchParams(window.location.search);
    var px = function (name) {
      var v = parseInt(p.get(name), 10);
      return (isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    var wurzel = document.documentElement.style;
    var mt = px('margintop');    if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
    var ms = px('marginside');   if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
    var mb = px('marginbottom'); if (mb !== null) { wurzel.setProperty('--sym-mb', mb); }
  } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
})();

/* Hell/Dunkel aus der Luminanz der Kartenfarbe — Hausmuster. */
(function () {
  function anwenden() { try {
    var p = document.createElement('span');
    p.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(--card-color)';
    (document.body || document.documentElement).appendChild(p);
    var c = getComputedStyle(p).color; p.remove();
    var m = /(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(c); if (!m) return;
    var l = 0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3];
    document.documentElement.setAttribute('data-symdo-theme', l < 128 ? 'dark' : 'light');
  } catch (e) {} }
  anwenden();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', anwenden); } catch (e) {}
})();

/* Scroll-Eindaemmung gegen html-sdk.js: es meldet JEDES deltaY an die Visu
   (postScroll), die dann mitscrollt. Ereignisse in der Abfangphase an document
   stoppen — vor der Blasenphase an window, wo html-sdk.js zuhoert. */
var SCROLL_BEREICHE = '#liste';
function zustaendigerScroller(ziel, dx, dy) {
  var el = (ziel instanceof Element) ? ziel : null;
  while (el && el !== document.body) {
    if (el.matches && el.matches(SCROLL_BEREICHE)) {
      var maxY = el.scrollHeight - el.clientHeight;
      var maxX = el.scrollWidth - el.clientWidth;
      var gehtY = maxY > 1 && ((dy < 0 && el.scrollTop > 0) || (dy > 0 && el.scrollTop < maxY - 1));
      var gehtX = maxX > 1 && ((dx < 0 && el.scrollLeft > 0) || (dx > 0 && el.scrollLeft < maxX - 1));
      if (gehtY || gehtX) { return el; }
    }
    el = el.parentElement;
  }
  return null;
}
document.addEventListener('wheel', function (e) {
  if (!zustaendigerScroller(e.target, e.deltaX || 0, e.deltaY || 0)) { e.preventDefault(); }
  e.stopPropagation();
}, { passive: false, capture: true });
var letzteY = null, letzteX = null;
document.addEventListener('touchstart', function (e) {
  if (e.touches && e.touches.length === 1) { letzteX = e.touches[0].clientX; letzteY = e.touches[0].clientY; }
  else { letzteX = letzteY = null; }
  e.stopPropagation();
}, { passive: true, capture: true });
document.addEventListener('touchmove', function (e) {
  if (!e.touches || e.touches.length !== 1 || letzteY === null) { e.stopPropagation(); return; }
  var x = e.touches[0].clientX, y = e.touches[0].clientY;
  var dy = letzteY - y, dx = letzteX - x;
  letzteX = x; letzteY = y;
  if (!zustaendigerScroller(e.target, dx, dy)) { e.preventDefault(); }
  e.stopPropagation();
}, { passive: false, capture: true });
document.addEventListener('touchend', function () { letzteX = letzteY = null; }, { passive: true, capture: true });

/* ── Die drei Messungen ──────────────────────────────────────────────────── */

function probeUmgebung() {
  var inIframe = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  return {
    protokoll: location.protocol,
    sicher: window.isSecureContext === true,
    iframe: inIframe,
    webrtc: typeof RTCPeerConnection === 'function',
    mikro: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    recorder: typeof MediaRecorder === 'function',
    erkennung: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
    agent: (navigator.userAgent || '').slice(0, 120)
  };
}

/* ICE ohne Gegenstelle: ein Offer mit STUN. Erscheint ein srflx-Kandidat,
   kommt UDP nach draussen — ohne STUN gaebe es prinzipbedingt nur host. */
function probeIce() {
  var out = { kandidaten: {}, fehler: '' };
  return new Promise(function (fertigMachen) {
    var pc = null;
    try {
      pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    } catch (e) { out.fehler = String((e && e.name) || e); fertigMachen(out); return; }
    var zu = setTimeout(abschluss, 5000);
    function abschluss() {
      clearTimeout(zu);
      try {
        var sdp = (pc.localDescription && pc.localDescription.sdp) || '';
        (sdp.match(/^a=candidate:.*$/gm) || []).forEach(function (z) {
          var m = / typ (\w+)/.exec(z);
          if (m) { out.kandidaten[m[1]] = (out.kandidaten[m[1]] || 0) + 1; }
        });
      } catch (e) { out.fehler = String((e && e.name) || e); }
      try { pc.close(); } catch (e) {}
      fertigMachen(out);
    }
    pc.addEventListener('icegatheringstatechange', function () {
      if (pc.iceGatheringState === 'complete') { abschluss(); }
    });
    try {
      pc.createDataChannel('oai-events');
      pc.createOffer().then(function (offer) { return pc.setLocalDescription(offer); })
        .catch(function (e) { out.fehler = String((e && e.name) || e); abschluss(); });
    } catch (e) { out.fehler = String((e && e.name) || e); abschluss(); }
  });
}

/* Erreichbarkeit und Location-Kopf: Attrappen-Marke, kaputtes SDP. Erwartet
   ist 400 invalid_offer MIT lesbarem Location — kostet nichts, beweist alles.
   Ein TypeError hiesse: die iframe-CSP blockt connect-src → unified-Weg. */
function probeApi() {
  var out = { status: 0, code: '', location: '', fehler: '' };
  return fetch('https://api.openai.com/v1/realtime/calls', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ek_probe', 'Content-Type': 'application/sdp' },
    body: 'v=0'
  }).then(function (r) {
    out.status = r.status;
    out.location = r.headers.get('Location') || '';
    return r.json().then(function (j) {
      out.code = (j && j.error && (j.error.code || j.error.type)) || '';
      return out;
    }).catch(function () { return out; });
  }).catch(function (e) {
    out.fehler = String((e && (e.name + ': ' + e.message)) || e);
    return out;
  });
}

/* ── Auswertung und Anzeige ──────────────────────────────────────────────── */

function fazitBilden(u, ice, api) {
  if (!u.sicher) { return ['schlecht', 'Kein sicherer Kontext (http) — Mikrofon und WebRTC sind hier gesperrt.']; }
  if (!u.webrtc) { return ['schlecht', 'Kein WebRTC in dieser Umgebung.']; }
  if (api.fehler !== '') { return ['schlecht', 'OpenAI per fetch blockiert (' + api.fehler + ') — der unified-Weg über das Gateway wäre nötig.']; }
  if (api.status !== 400 && api.status !== 401) { return ['teils', 'Unerwartete Antwort von OpenAI (HTTP ' + api.status + ').']; }
  var srflx = (ice.kandidaten && ice.kandidaten.srflx) || 0;
  if (api.location === '') {
    return ['teils', 'OpenAI erreichbar, aber der Location-Kopf ist nicht lesbar — Not-Aus nur über den unified-Weg.'];
  }
  if (!srflx) { return ['teils', 'OpenAI erreichbar, aber kein UDP nach draußen erkennbar (nur ' + Object.keys(ice.kandidaten || {}).join('/') + ') — WebRTC könnte scheitern.']; }
  if (!u.mikro) { return ['teils', 'Alles erreichbar, aber kein Mikrofonzugriff in dieser Umgebung.']; }
  return ['gut', 'Grünes Licht: WebRTC zu OpenAI trägt in dieser Umgebung.'];
}

function punkt(liste, ok, text, wert) {
  var el = document.createElement('div');
  el.className = 'punkt';
  var z = document.createElement('span');
  z.className = 'zeichen ' + (ok === true ? 'ok' : ok === false ? 'nein' : 'info');
  z.textContent = ok === true ? '✓' : ok === false ? '✗' : '·';
  var t = document.createElement('span');
  t.textContent = text;
  var w = document.createElement('span');
  w.className = 'wert';
  w.textContent = wert || '';
  el.appendChild(z); el.appendChild(t); el.appendChild(w);
  liste.appendChild(el);
}

function probeLaufen() {
  var fazitEl = document.getElementById('fazit');
  var liste = document.getElementById('liste');
  fazitEl.className = '';
  fazitEl.textContent = 'Probe läuft …';
  liste.innerHTML = '';

  var u = probeUmgebung();
  Promise.all([probeIce(), probeApi()]).then(function (ergebnisse) {
    var ice = ergebnisse[0], api = ergebnisse[1];
    var fazit = fazitBilden(u, ice, api);
    fazitEl.className = fazit[0];
    fazitEl.textContent = fazit[1];

    punkt(liste, u.sicher, 'Sicherer Kontext', u.protokoll);
    punkt(liste, u.webrtc, 'WebRTC (RTCPeerConnection)');
    punkt(liste, u.mikro, 'Mikrofonzugriff möglich');
    punkt(liste, u.recorder, 'MediaRecorder (Diktat-Baustein)');
    punkt(liste, u.erkennung, 'Spracherkennung (fürs Weckwort)', u.erkennung ? '' : 'nicht auf diesem Gerät');
    punkt(liste, null, 'Im Visu-Rahmen (iframe)', u.iframe ? 'ja' : 'nein');
    var typen = Object.keys(ice.kandidaten || {}).map(function (k) { return k + '×' + ice.kandidaten[k]; }).join('  ');
    punkt(liste, !!(ice.kandidaten && ice.kandidaten.srflx), 'UDP nach draußen (srflx über STUN)', typen || ice.fehler || 'keine Kandidaten');
    punkt(liste, api.fehler === '' && (api.status === 400 || api.status === 401),
      'OpenAI Realtime erreichbar', api.fehler !== '' ? api.fehler : ('HTTP ' + api.status + ' ' + api.code));
    punkt(liste, api.location !== '', 'call_id lesbar (Not-Aus möglich)', api.location ? api.location.split('/').pop().slice(0, 18) + '…' : 'Location fehlt');
    punkt(liste, null, 'Browser', u.agent.slice(0, 48));

    // Selbstbericht ans Modul — ablesbar im Formular, auch vom Handy aus.
    var bericht = { umgebung: u, ice: ice, api: api, fazit: fazit[1] };
    try {
      if (typeof requestAction === 'function') {
        requestAction('ProbeReport', JSON.stringify(bericht));
      }
    } catch (e) { /* Standalone-Vorschau ohne Visu: nur Anzeige */ }
  });
}

document.getElementById('nochmal').addEventListener('click', probeLaufen);

/* Zustand vom Modul — die Probe braucht ihn (noch) nicht, aber der Vertrag
   handleMessage/updateState muss von Anfang an stehen. */
function handleMessage(daten) {
  if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
  if (!daten || typeof daten !== 'object') { return; }
}
window.handleMessage = handleMessage;
window.updateState = handleMessage;
window.addEventListener('message', function (event) { if (event) { handleMessage(event.data); } });

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', probeLaufen);
} else {
  probeLaufen();
}
})();
</script>
