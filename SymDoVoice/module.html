<!-- SymDo Voice — die Gesprächs-Kachel.

     Der Ton läuft per WebRTC direkt vom Browser zu OpenAI (voice-core.js wird
     vom Modul vor dieses Dokument gehängt). Über das Modul reisen nur die
     Marke, der Herzschlag und die Werkzeugaufrufe:
       Kachel → requestAction('VoiceCall', {payload, txn})
       Modul  → Gateway (AiTileRequest, Pfad /voice) → Push {type:'voiceResult'} -->
<style>
:root {
  --bg: var(--card-color, #2b2c30);
  --text: var(--content-color, #ffffff);
  --akzent: var(--accent-color, #00cdab);
  --zeile: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --dezent: color-mix(in srgb, var(--content-color) 55%, transparent);
  --rot: #ff4d4d;
  /* Bernstein fuer das Lauschen: nicht der Akzent (der gehoert dem laufenden
     Gespraech) und nicht Rot (das heisst Aufnahme). */
  --lausch: #ffb020;
  --sym-mt: 0px; --sym-ms: 0px; --sym-mb: 0px;
  --sbw: 6px;
  --sb-pad: max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}
html[data-symdo-theme="light"] {
  --zeile: color-mix(in srgb, var(--card-color) 94%, var(--content-color) 6%);
}
html { height: 100%; display: flex; flex-direction: column; }
body {
  margin: 0 !important; padding: 0 !important;
  background: transparent; overflow: hidden;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex; flex-direction: column; flex: 1; min-height: 0;
}
#wrap {
  display: flex; flex-direction: column; flex: 1; min-height: 0; box-sizing: border-box;
  padding: max(var(--sym-mt), env(safe-area-inset-top, 0px)) var(--sb-pad)
           calc(var(--sym-mb) + 4px) var(--sym-ms);
}
#kopf { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
#kopf h2 { margin: 0; font-size: 17px; flex: 1; }
#status {
  font-size: 12px; color: var(--dezent); border-radius: 999px; padding: 4px 10px;
  background: var(--zeile); white-space: nowrap;
}
#status.an { color: var(--akzent); }
/* Unübersehbar, solange das Mikrofon offen ist. */
#mikPunkt { display: none; width: 9px; height: 9px; border-radius: 999px; background: var(--rot);
  animation: mikBlink 1.6s ease-in-out infinite; }
#mikPunkt.an { display: inline-block; }
@keyframes mikBlink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

/* ── Blase ────────────────────────────────────────────────────────────────
   Aussehen und Bewegung stehen in SymDoGateway/libs/voice-blob.js — eine
   Quelle für Kachel und Web-App. Hier steht nur, wo sie sitzt. */
#buehne { flex: 1 1 auto; min-height: 0; }
#buehne[hidden] { display: none; }
#verlauf {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; scrollbar-gutter: stable; overscroll-behavior: contain;
  padding: 0 var(--sb-pad) 0 0;
}
#verlauf::-webkit-scrollbar { width: 6px; height: 6px; }
#verlauf::-webkit-scrollbar-track { background: transparent; }
#verlauf::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--akzent) 70%, transparent); border-radius: 999px;
}
@supports not selector(::-webkit-scrollbar) {
  #verlauf { scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--akzent) 70%, transparent) transparent; }
}
.blase { max-width: 86%; border-radius: 14px; padding: 8px 11px; margin: 0 0 6px;
  font-size: 14px; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
.blase.du { margin-left: auto; background: color-mix(in srgb, var(--akzent) 22%, var(--zeile)); }
.blase.symdo { margin-right: auto; background: var(--zeile); }
.aktion { display: flex; align-items: baseline; gap: 6px; font-size: 12px;
  color: var(--dezent); margin: 0 0 6px; }
.aktion .z { font-weight: 700; }
.aktion .z.ok { color: var(--akzent); } .aktion .z.nein { color: var(--rot); }
#leer { color: var(--dezent); font-size: 13px; text-align: center; margin-top: 18px; }

#fuss { padding-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#hinweis { font-size: 12px; color: var(--dezent); min-height: 15px; text-align: center; }
#hinweis.fehler { color: var(--rot); }
#knopf {
  width: 74px; height: 74px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--akzent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--akzent) 45%, transparent);
  transition: transform .12s ease, background .2s ease;
}
#knopf:active { transform: scale(.94); }
#knopf.laeuft { background: var(--rot);
  box-shadow: 0 4px 16px color-mix(in srgb, var(--rot) 45%, transparent); }
#knopf.hoert { animation: pulsieren 2.2s ease-in-out infinite; }
@keyframes pulsieren {
  0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--akzent) 45%, transparent); }
  50% { box-shadow: 0 0 0 14px color-mix(in srgb, var(--akzent) 0%, transparent); }
}
#knopf svg { width: 30px; height: 30px; fill: #fff; }
#nebenzeile { display: flex; gap: 8px; }
#nebenzeile button {
  border: 0; border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text);
  cursor: pointer; display: none;
}
#nebenzeile button.zeigen { display: inline-block; }
#nebenzeile button#freihand:not([hidden]),
#nebenzeile button#wortLaden:not([hidden]) { display: inline-block; }
#nebenzeile button#freihand.an { background: color-mix(in srgb, var(--lausch) 26%, transparent); }
#lauschAn { display: none; align-items: center; gap: 5px; font-size: 11px; color: var(--lausch);
  white-space: nowrap; }
#lauschAn:not([hidden]) { display: inline-flex; }
#lauschAn .welle { width: 8px; height: 8px; border-radius: 999px; background: var(--lausch);
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--lausch) 70%, transparent);
  animation: lauschen 1.9s ease-out infinite; }
@keyframes lauschen {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lausch) 70%, transparent); }
  70%  { box-shadow: 0 0 0 9px color-mix(in srgb, var(--lausch) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lausch) 0%, transparent); }
}
@media (prefers-reduced-motion: reduce) { #lauschAn .welle { animation: none; } }
</style>
<div id="wrap">
  <div id="kopf">
    <h2>Sprachassistent</h2>
    <span id="mikPunkt" title="Mikrofon offen"></span>
    <span id="status">bereit</span>
    <!-- Unuebersehbar, solange das Mikrofon fuer das Weckwort offen steht. Der
         Plan verlangt das ausdruecklich: Dauerlauschen darf man nie uebersehen. -->
    <span id="lauschAn" hidden><span class="welle"></span>hört auf „Hey SymDo"</span>
  </div>
  <div id="verlauf"><div id="leer">Tippe auf den Knopf und sprich — zum Beispiel:
„Was steht morgen an?" oder „Was ist noch auf der Einkaufsliste?"</div></div>
  <!-- Alternative Darstellung: die tonreagierende Blase (voice-blob.js füllt sie). -->
  <div id="buehne" hidden></div>
  <div id="fuss">
    <div id="hinweis"></div>
    <button type="button" id="knopf" aria-label="Gespräch starten">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3zm5.3-3a.9.9 0 0 1 1.8.1 7.1 7.1 0 0 1-6.2 6.9V20h2.2a.9.9 0 1 1 0 1.8H8.9a.9.9 0 1 1 0-1.8h2.2v-2a7.1 7.1 0 0 1-6.2-6.9.9.9 0 0 1 1.8-.1 5.3 5.3 0 0 0 10.6 0z"/></svg>
    </button>
    <div id="nebenzeile">
      <button type="button" id="ruhe">Ruhe</button>
      <button type="button" id="freihand" hidden>Freisprechen</button>
      <button type="button" id="wortLaden" hidden>Spracherkennung laden</button>
    </div>
  </div>
  <audio id="ton" autoplay playsinline></audio>
</div>
<script>
/* IIFE: die Tile-Visu injiziert eigene globale Bindungen. */
(function () {
'use strict';

/* Systemraender aus der Adresse — vor dem ersten Zeichnen. */
(function () {
  try {
    var p = new URLSearchParams(window.location.search);
    var px = function (n) { var v = parseInt(p.get(n), 10); return (isFinite(v) && v >= 0) ? v + 'px' : null; };
    var w = document.documentElement.style;
    var mt = px('margintop');    if (mt !== null) { w.setProperty('--sym-mt', mt); }
    var ms = px('marginside');   if (ms !== null) { w.setProperty('--sym-ms', ms); }
    var mb = px('marginbottom'); if (mb !== null) { w.setProperty('--sym-mb', mb); }
  } catch (e) {}
})();

/* Hell/Dunkel aus der Luminanz der Kartenfarbe — Hausmuster. */
(function () {
  function anwenden() { try {
    var p = document.createElement('span');
    p.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(--card-color)';
    (document.body || document.documentElement).appendChild(p);
    var c = getComputedStyle(p).color; p.remove();
    var m = /(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(c); if (!m) return;
    var l = 0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3];
    document.documentElement.setAttribute('data-symdo-theme', l < 128 ? 'dark' : 'light');
  } catch (e) {} }
  anwenden();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', anwenden); } catch (e) {}
})();

/* Scroll-Eindaemmung gegen html-sdk.js (postScroll) — Hausmuster. */
var SCROLL_BEREICHE = '#verlauf';
function zustaendigerScroller(ziel, dx, dy) {
  var el = (ziel instanceof Element) ? ziel : null;
  while (el && el !== document.body) {
    if (el.matches && el.matches(SCROLL_BEREICHE)) {
      var maxY = el.scrollHeight - el.clientHeight;
      var gehtY = maxY > 1 && ((dy < 0 && el.scrollTop > 0) || (dy > 0 && el.scrollTop < maxY - 1));
      if (gehtY) { return el; }
    }
    el = el.parentElement;
  }
  return null;
}
document.addEventListener('wheel', function (e) {
  if (!zustaendigerScroller(e.target, e.deltaX || 0, e.deltaY || 0)) { e.preventDefault(); }
  e.stopPropagation();
}, { passive: false, capture: true });
var lY = null;
document.addEventListener('touchstart', function (e) {
  lY = (e.touches && e.touches.length === 1) ? e.touches[0].clientY : null;
  e.stopPropagation();
}, { passive: true, capture: true });
document.addEventListener('touchmove', function (e) {
  if (!e.touches || e.touches.length !== 1 || lY === null) { e.stopPropagation(); return; }
  var dy = lY - e.touches[0].clientY; lY = e.touches[0].clientY;
  if (!zustaendigerScroller(e.target, 0, dy)) { e.preventDefault(); }
  e.stopPropagation();
}, { passive: false, capture: true });
document.addEventListener('touchend', function () { lY = null; }, { passive: true, capture: true });

/* ── Transport: requestAction hin, voiceResult per Push zurueck ───────────── */

var __txn = 0;
var __wartend = {};
function post(payload) {
  return new Promise(function (aufloesen) {
    var txn = 'v' + (++__txn) + '-' + Date.now().toString(36);
    __wartend[txn] = aufloesen;
    try {
      if (typeof requestAction === 'function') {
        requestAction('VoiceCall', JSON.stringify({ payload: payload, txn: txn }));
      } else {
        delete __wartend[txn];
        aufloesen({ ok: false, sag: 'Kein Verbindungsweg (Vorschau ohne Visu).' });
        return;
      }
    } catch (e) {
      delete __wartend[txn];
      aufloesen({ ok: false, sag: 'Aufruf fehlgeschlagen.' });
      return;
    }
    /* Transportdeckel knapp ueber dem Werkzeugdeckel des Kerns (8 s). */
    setTimeout(function () {
      if (__wartend[txn]) { delete __wartend[txn]; aufloesen({ ok: false, error: { code: 'timeout' }, sag: 'Der Server hat nicht geantwortet.' }); }
    }, 10000);
  });
}

/* ── Oberflaeche ─────────────────────────────────────────────────────────── */

var el = function (id) { return document.getElementById(id); };
var verlauf = el('verlauf');
var statusEl = el('status');
var hinweis = el('hinweis');
var knopf = el('knopf');
var ruheKnopf = el('ruhe');
var mikPunkt = el('mikPunkt');

var duBlasen = {};      // item_id → Element (Live-Mitschrift des Gesagten)
var symdoBlasen = {};   // response_id → Element

function leerWeg() { var l = el('leer'); if (l) { l.remove(); } }
function runter() { verlauf.scrollTop = verlauf.scrollHeight; }

function blase(klasse, schluessel, ablage) {
  if (schluessel && ablage[schluessel]) { return ablage[schluessel]; }
  leerWeg();
  var b = document.createElement('div');
  b.className = 'blase ' + klasse;
  verlauf.appendChild(b);
  if (schluessel) { ablage[schluessel] = b; }
  return b;
}

function aktion(ok, text) {
  leerWeg();
  var z = document.createElement('div');
  z.className = 'aktion';
  z.innerHTML = '<span class="z ' + (ok ? 'ok' : 'nein') + '">' + (ok ? '✓' : '✗') + '</span><span></span>';
  z.lastChild.textContent = text;
  verlauf.appendChild(z);
  runter();
}

function statusZeigen(text, an) {
  statusEl.textContent = text;
  statusEl.classList.toggle('an', an === true);
}

/* ── Blase ───────────────────────────────────────────────────────────────
   Aussehen und Bewegung kommen aus voice-blob.js (dieselbe Quelle wie in der
   Web-App); hier wird nur zwischen Verlauf und Blase umgeschaltet. */
var Blase = (function () {
  var buehne = el('buehne'), verlauf = el('verlauf'), bild = null, letzterZustand = 'bereit';
  return {
    modus: function (welche) {
      var an = (welche === 'blob');
      buehne.hidden = !an;
      verlauf.hidden = an;
      if (an && !bild && window.SymDoVoiceBlase) {
        bild = SymDoVoiceBlase.erzeuge(buehne, kern);
      }
      if (bild) { bild.an(an); bild.zustand(letzterZustand); }
    },
    zustand: function (z) {
      letzterZustand = z;
      if (bild) { bild.zustand(z); }
    }
  };
})();

var kern = SymDoVoiceKern.erzeuge({
  post: post,
  audioEl: el('ton'),
  onState: function (z, detail) {
    Blase.zustand(z);
    mikPunkt.classList.toggle('an', kern.istOffen());
    knopf.classList.toggle('laeuft', kern.istOffen());
    knopf.classList.toggle('hoert', z === 'hoert' || z === 'duSprichst');
    ruheKnopf.classList.toggle('zeigen', z === 'spricht');
    hinweis.classList.remove('fehler');
    switch (z) {
      case 'verbinde':   statusZeigen('verbinde …', true); hinweis.textContent = ''; break;
      case 'hoert':      statusZeigen('ich höre zu', true); break;
      case 'duSprichst': statusZeigen('du sprichst …', true); break;
      case 'denkt':      statusZeigen('einen Moment …', true); break;
      case 'spricht':    statusZeigen('SymDo antwortet', true); break;
      case 'werkzeug':   statusZeigen('schaue nach …', true); break;
      case 'ende':
        statusZeigen('bereit', false);
        hinweis.textContent = detail ? ('Gespräch beendet — ' + detail) : '';
        Freihand.nachGespraech();
        break;
      case 'fehler':
        statusZeigen('bereit', false);
        hinweis.textContent = detail || 'Fehler';
        hinweis.classList.add('fehler');
        Freihand.nachGespraech();
        break;
    }
  },
  onEvent: function (e) {
    switch (e.art) {
      case 'duDelta': {
        var b = blase('du', 'i' + e.item, duBlasen);
        b.textContent += e.text; runter(); break;
      }
      case 'duFertig': {
        var b2 = blase('du', 'i' + e.item, duBlasen);
        if (e.text) { b2.textContent = e.text; }
        runter(); break;
      }
      case 'symdoDelta': {
        var s = blase('symdo', 'r' + e.antwort, symdoBlasen);
        s.textContent += e.text; runter(); break;
      }
      case 'symdoFertig': {
        var s2 = blase('symdo', 'r' + e.antwort, symdoBlasen);
        if (e.text) { s2.textContent = e.text; }
        runter(); break;
      }
      case 'werkzeugFertig':
        aktion(e.ok === true, e.sag || e.name);
        break;
      case 'rest':
        if (e.sekunden <= 30) { hinweis.textContent = 'noch ' + e.sekunden + ' s Gesprächszeit'; }
        break;
      case 'fehler':
        hinweis.textContent = e.text || 'Fehler';
        hinweis.classList.add('fehler');
        break;
    }
  }
});

/* ── Freisprechen ─────────────────────────────────────────────────────────
   Der Lauscher (voice-wake.js) hoert das Weckwort AUF DEM GERAET; erst danach
   geht ueberhaupt Ton nach draussen. Drei Riegel liegen davor: der Schalter am
   Gateway (sonst wird die Datei gar nicht erst mitgeliefert), die dritte
   Einwilligung (serverseitig geprueft, weil sie in einem Attribut liegt) und
   die Faehigkeit des Geraets — kann es nicht lokal erkennen, wird das GESAGT
   statt stumm nicht zu lauschen. */
var Freihand = (function () {
  var knopfF = el('freihand'), ladeKnopf = el('wortLaden'), anzeige = el('lauschAn');
  var lauscher = null, gewuenscht = false, erlaubtHier = false;

  /* Der Knopf richtet sich nach dem WILLEN, die Anzeige nach dem Zustand: nach
     dem Weckwort ist der Lauscher aus (das Mikrofon gehoert dann dem Gespraech),
     Freisprechen aber weiter eingeschaltet. Ohne diese Trennung schaltete der
     naechste Druck wieder AN statt aus — im Pruefstand aufgefallen. */
  function anzeigen() {
    var lauscht = !!(lauscher && lauscher.istAn());
    anzeige.hidden = !lauscht;
    knopfF.classList.toggle('an', gewuenscht);
    knopfF.textContent = gewuenscht ? 'Freisprechen aus' : 'Freisprechen';
  }
  function sagen(text, schlimm) {
    hinweis.textContent = text || '';
    hinweis.classList.toggle('fehler', schlimm === true);
  }

  function anschalten() {
    if (!window.SymDoVoiceWeckwort) { sagen('Freisprechen ist hier nicht eingebaut.', true); return; }
    // Erst der Server: die Einwilligung liegt in einem Attribut und ist im
    // Browser weder lesbar noch faelschbar.
    post({ action: 'handsfree' }).then(function (r) {
      if (!r || r.erlaubt !== true) {
        sagen((r && r.grund) || 'Freisprechen ist nicht freigegeben.', true);
        return;
      }
      return SymDoVoiceWeckwort.verfuegbar().then(function (v) {
        ladeKnopf.hidden = (v.stand !== 'ladbar');
        if (!v.moeglich) { sagen(v.grund, v.stand === 'unmoeglich'); return; }
        if (!lauscher) {
          lauscher = SymDoVoiceWeckwort.erzeuge({
            onWake: function () {
              sagen('');
              anzeigen();
              if (!kern.istOffen()) { kern.start(); }
            },
            onZustand: function (z, grund) {
              if (z === 'fehler' && grund) { sagen(grund, true); }
              anzeigen();
            }
          });
        }
        return lauscher.an(true).then(function (ok) {
          gewuenscht = ok === true;
          if (ok) { sagen('Ich höre auf „Hey SymDo".'); }
          anzeigen();
        });
      });
    });
  }

  function ausschalten() {
    gewuenscht = false;
    if (lauscher) { lauscher.aus(); }
    anzeigen();
    sagen('');
  }

  knopfF.addEventListener('click', function () {
    if (gewuenscht) { ausschalten(); } else { anschalten(); }
  });
  ladeKnopf.addEventListener('click', function () {
    sagen('Die Spracherkennung wird geladen — das dauert einen Moment.');
    ladeKnopf.disabled = true;
    SymDoVoiceWeckwort.laden().then(function (ok) {
      ladeKnopf.disabled = false;
      ladeKnopf.hidden = ok === true;
      sagen(ok ? 'Geladen. Freisprechen kann losgehen.' : 'Das Laden hat nicht geklappt.', !ok);
    });
  });

  return {
    /* Der Schalter am Gateway entscheidet, ob der Knopf ueberhaupt erscheint. */
    erlauben: function (ja) {
      erlaubtHier = ja === true;
      knopfF.hidden = !erlaubtHier;
      if (!erlaubtHier) { ausschalten(); }
    },
    /* Nach dem Gespraech zurueck ins Lauschen — waehrend des Gespraechs NICHT,
       sonst spraenge der Erkenner auf die Stimme aus dem Lautsprecher an. */
    nachGespraech: function () {
      if (gewuenscht && lauscher && !lauscher.istAn() && !kern.istOffen()) {
        lauscher.an(true).then(anzeigen);
      }
    },
    laeuft: function () { return !!(lauscher && lauscher.istAn()); }
  };
})();

/* Debug-Haken fuer Pruefstaende und die Browser-Konsole. */
window.__voiceKern = kern;
window.__freihand = Freihand;

/* Lagesensor beim ersten Druck mitfragen: iOS verlangt dafuer eine
   Nutzergeste. In der Visu steckt die Kachel in einem fremden iframe — ohne
   allow="gyroscope" bleibt es dort still, und das ist in Ordnung: die Wirkung
   ist Zierde, kein Bedienelement. */
var kreiselGefragt = false;
function kreiselFragen() {
  if (kreiselGefragt || !window.SymDoVoiceBlase || !SymDoVoiceBlase.kreiselMoeglich()) { return; }
  kreiselGefragt = true;
  try { SymDoVoiceBlase.kreisel(true); } catch (e) { /* still bleiben */ }
}

knopf.addEventListener('click', function () {
  kreiselFragen();
  if (kern.istOffen()) { kern.stop('vom Nutzer beendet'); return; }
  kern.start();
});
ruheKnopf.addEventListener('click', function () { kern.ruhe(); });

/* ── Anbindung ans Modul ─────────────────────────────────────────────────── */

function handleMessage(daten) {
  if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
  if (!daten || typeof daten !== 'object') { return; }
  if (daten.type === 'voiceResult') {
    var cb = __wartend[daten.txn];
    if (cb) { delete __wartend[daten.txn]; cb(daten.json || { ok: false }); }
    return;
  }
  /* type 'state': bislang trägt er nur die gewählte Darstellung. */
  if (daten.darstellung) { Blase.modus(daten.darstellung); }
  if (Object.prototype.hasOwnProperty.call(daten, 'freisprechen')) {
    Freihand.erlauben(daten.freisprechen === true);
  }
}
window.handleMessage = handleMessage;
window.updateState = handleMessage;
window.addEventListener('message', function (event) { if (event) { handleMessage(event.data); } });
})();
</script>
