<style>
  /* Symcon stellt --card-color, --content-color und --accent-color je nach
     Thema bereit. Alles Weitere leitet sich davon ab, damit die Kachel in Hell
     und Dunkel ohne eigenen Umschalter stimmt. */
  :root {
    --bg:      var(--card-color);
    --text:    var(--content-color);
    --muted:   color-mix(in srgb, var(--content-color) 45%, transparent);
    --line:    color-mix(in srgb, var(--content-color) 14%, transparent);
    --frei:    color-mix(in srgb, var(--content-color) 8%, transparent);
    --spalte:  color-mix(in srgb, var(--content-color) 5%, transparent);
    --kopf:    color-mix(in srgb, var(--content-color) 10%, transparent);
    --accent:  var(--accent-color);
    --viertel: 18px;   /* Pixel je Viertelstunde — der Massstab der Vorlage */
    /* Vom System vorgegebene Kachelraender (margintop/marginside/marginbottom
       aus der Abfragezeichenfolge, per JS gesetzt). Vorgabe 0, damit eine
       Kachel ohne diese Angaben randlos bleibt statt auf geratene Werte zu
       fallen. Dieselbe Mechanik wie in der ToDoList-Kachel. */
    --sym-mt:  0px;
    --sym-ms:  0px;
    --sym-mb:  0px;
    --sbw:     6px;   /* Balkenbreite; muss zu ::-webkit-scrollbar passen */
    /* Rechter Innenabstand, der den Balken MITTIG in den marginside-Streifen
       legt: der Scrollbereich endet um (marginside - Balken)/2 vor der Kante. */
    --sb-pad:  max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    /* Ein vom System gesetztes Body-Padding wird NEUTRALISIERT: die Raender
       werden unten selbst aus --sym-* aufgetragen. Vorher standen hier feste
       12px — die kamen zu dem des Systems HINZU, und der Inhalt rutschte je
       nach Kacheleinstellung unterschiedlich weit ein. */
    margin: 0 !important; padding: 0 !important;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg);
  }

  /* Der Rahmen traegt die Systemraender, #inhalt scrollt darin. Zwei Ebenen,
     damit der Balken im rechten Randstreifen sitzt und nicht daneben:
     links --sym-ms, rechts --sb-pad + --sb-pad + Balken = --sym-ms. */
  #rahmen {
    height: 100%; display: flex; flex-direction: column;
    padding: max(var(--sym-mt), env(safe-area-inset-top, 0px)) var(--sb-pad)
             var(--sym-mb) var(--sym-ms);
  }
  .scrollbereich {
    flex: 1; min-height: 0;
    /* Spalte, damit das Wochenraster die Resthoehe unter Kopf und Kinderleiste
       bekommt — und die beiden ueber dem Raster stehen bleiben. */
    display: flex; flex-direction: column;
    /* overflow-y: scroll statt auto: der Streifen ist IMMER reserviert, damit
       der rechte Abstand mit und ohne sichtbaren Balken derselbe ist. Die Spur
       ist durchsichtig, der Griff erscheint nur bei Bedarf. */
    overflow-y: scroll;
    overscroll-behavior: contain;
    padding: 12px var(--sb-pad) 12px 0;
  }
  .scrollbereich::-webkit-scrollbar,
  .spalten::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbereich::-webkit-scrollbar-track,
  .spalten::-webkit-scrollbar-track { background: transparent; }
  .scrollbereich::-webkit-scrollbar-thumb,
  .spalten::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--accent) 70%, transparent);
    border-radius: 999px;
  }
  /* scrollbar-color/-width und ::-webkit-scrollbar schliessen sich gegenseitig
     aus: ist der Standard gesetzt, uebergeht WebKit die Pseudoelemente. Deshalb
     bekommt WebKit die Pseudoelemente, und der Standard gilt nur dort, wo es
     sie nicht gibt. */
  @supports not selector(::-webkit-scrollbar) {
    .scrollbereich, .spalten {
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
    }
  }
  .leer { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ── Kopf ──────────────────────────────────────────────────────────────── */
  .kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

  /* Wochentag-Umschalter: fester Kasten, damit die Pfeile beim Blaettern nicht
     wandern. Die Breite kommt NICHT aus einer geratenen Zahl, sondern aus dem
     laengsten Wochentag selbst: alle Namen liegen uebereinander in derselben
     Rasterzelle, nur der aktuelle ist sichtbar. Damit stimmt sie auch, wenn
     jemand die Namen aendert. */
  .tagwahl {
    margin-left: auto; display: inline-flex; align-items: center; gap: 2px;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px;
    background: color-mix(in srgb, var(--content-color) 4%, transparent);
  }
  .tagwahl button {
    border: 0; background: transparent; color: var(--text); cursor: pointer;
    font: inherit; line-height: 1; padding: 4px 7px; border-radius: 999px;
  }
  .tagwahl button:hover { background: color-mix(in srgb, var(--content-color) 10%, transparent); }
  .tagname { display: inline-grid; place-items: center; padding: 0 2px; }
  .tagname span {
    grid-area: 1 / 1; font-size: 12px; font-weight: 700; white-space: nowrap;
    visibility: hidden;
  }
  .tagname span.an { visibility: visible; }
  .tagname span.ist-heute { color: var(--accent); }
  .kopf h1 { font-size: 15px; font-weight: 700; margin: 0; }
  .naechste { margin-left: auto; font-size: 12px; font-weight: 600; }
  .ferien {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; margin-bottom: 10px; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    font-size: 13px; font-weight: 600;
  }

  /* Kinder-Auswahl: nur bei mehr als einem Kind. */
  .kinder { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .chip.an { color: #fff; border-color: transparent; }

  /* ── Wochenraster ──────────────────────────────────────────────────────── */
  /* Das Raster ist eine BEGRENZTE Flaeche, kein mitwachsender Block. Vorher war
     .spalten so hoch wie das ganze Raster — sein waagerechter Balken sass damit
     ganz unten am Inhalt, und man musste erst hinunterscrollen, um ihn ueberhaupt
     zu sehen. Jetzt fuellt das Raster die Resthoehe, und beide Balken liegen an
     den Kanten der sichtbaren Flaeche. */
  .raster { flex: 1 1 auto; min-height: 0; display: flex; }
  /* Die Zeitachse steht MIT IM Scrollbereich: nur so tragen Achse und Spalten
     denselben senkrechten Weg. Waagerecht bleibt sie durch sticky stehen,
     waehrend die Spalten darunter durchwandern. */
  .achse { position: sticky; left: 0; z-index: 2; flex: 0 0 46px; background: var(--bg); }
  .achse .innen { position: relative; }
  .marke {
    position: absolute; right: 0; display: flex; align-items: center; gap: 4px;
    font-size: 10px; font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .marke.stark { color: var(--text); font-weight: 700; }
  .marke i { display: block; width: 6px; height: 1px; background: currentColor; opacity: .6; }
  /* Ein Bereich fuer BEIDE Richtungen; scroll statt auto, damit die Streifen
     immer reserviert sind und der Inhalt nicht springt, sobald ein Balken
     auftaucht — dieselbe Ueberlegung wie beim senkrechten Bereich. */
  .spalten {
    /* align-items bleibt auf stretch: so sind alle Tagesspalten gleich hoch,
       auch wenn ihre Stunden zusammen ein Viertel mehr oder weniger ergeben.
       Die Zeitachse nimmt sich davon aus, sonst zoege sie die Zeile hoch. */
    flex: 1; min-width: 0; display: flex; gap: 8px;
    overflow: scroll; position: relative;
  }
  .achse { align-self: flex-start; }
  /* Alle Tage GLEICH breit und so schmal wie moeglich: sie teilen sich die
     Restbreite neben der Zeitachse (flex-basis 0, gleicher Wachstumsanteil).
     Die Untergrenze greift erst, wenn selbst ein gekuerztes Fach keinen Platz
     mehr haette; dann scrollt das Raster wieder waagerecht, statt unleserlich
     zu werden. Bei ueblichen Kachelbreiten passen alle Tage nebeneinander und
     es gibt gar nichts mehr zu schieben. */
  .spalte {
    flex: 1 1 0; min-width: 44px;
    border-radius: 16px; background: var(--spalte); overflow: hidden;
    /* Behaeltnis fuer die Abfrage unten: die Stunde soll sich nach der Breite
       IHRER Spalte richten, nicht nach der des Fensters. */
    container-type: inline-size;
  }
  .spaltenkopf {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; background: var(--kopf); min-height: 36px;
  }
  .spaltenkopf .tag { font-size: 13px; font-weight: 700; }
  .spaltenkopf .kw { font-size: 9px; font-weight: 600; color: var(--muted); }
  .heute {
    margin-left: auto; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .frei {
    display: flex; align-items: center; justify-content: center;
    background: var(--frei); color: var(--muted); font-size: 10px;
  }
  .stunde { padding: 8px 10px; color: #fff; display: flex; gap: 8px; align-items: flex-start; }
  /* min-width: 0 ist die Bedingung fuers Kuerzen: ein Flex-Kind ist von Haus
     aus mindestens so breit wie sein Inhalt, und text-overflow bekaeme nie
     Gelegenheit zu greifen — die Spalte waere statt dessen aufgegangen. */
  .stunde > div { min-width: 0; }
  .stunde .sym {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .stunde .fach, .stunde .zeit {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stunde .fach { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .stunde .zeit { font-size: 10px; font-weight: 500; opacity: .82; margin-top: 2px; }
  /* In engen Spalten weicht der Symbolkreis. Er ist 22px breit und nimmt mit
     seinem Abstand 30 der knapp 40 Pixel Inhaltsbreite — gemessen blieben dem
     Fachnamen 9px, also nichts als drei Puenktchen. Lieber der Name allein als
     ein Symbol und ein Rest. Im Kopf der Spalte steht der Tag ohnehin, und die
     Legende nennt Farbe und Symbol.

     Steht NACH .stunde .sym: eine Behaelter-Abfrage erhoeht die Spezifitaet
     nicht, und die spaetere Regel haette gewonnen — der Kreis blieb stehen. */
  @container (max-width: 104px) {
    .stunde .sym { display: none; }
    .stunde { padding: 6px 8px; }
  }
  .stunde.jetzt { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
  .stunde.betreuung { color: #fff; }

  /* ── Timeline ──────────────────────────────────────────────────────────── */
  .zeile { padding: 10px; border-radius: 14px; background: var(--spalte); margin-bottom: 8px; }
  .zeile:last-child { margin-bottom: 0; }
  /* Mitte statt Grundlinie: mit einem Bild im Kopf laege der Text sonst neben
     der Bildunterkante. */
  .zeilenkopf { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .gesicht {
    width: 24px; height: 24px; border-radius: 999px; object-fit: cover; flex: 0 0 24px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700;
  }
  .chip .gesicht { width: 18px; height: 18px; flex: 0 0 18px; font-size: 9px; margin-right: 5px; }
  .chip { display: inline-flex; align-items: center; }
  .zeilenkopf .wer { font-size: 13px; font-weight: 700; }
  .zeilenkopf .was { font-size: 12px; font-weight: 600; color: var(--muted); }
  .zeilenkopf .spanne { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
  .balken { position: relative; height: 22px; border-radius: 11px; background: var(--frei); }
  .stueck {
    position: absolute; top: 0; height: 22px; display: flex; align-items: center;
    color: #fff; font-size: 10px; overflow: hidden;
  }
  /* BEIDE Formen: /icons.js tauscht das <i> gegen ein <svg>, und eine Regel
     nur auf `i` greift danach nicht mehr — genau daran klebte das Symbol am
     linken Rand und wurde von der runden Kappe angeschnitten. */
  .stueck > * { margin-left: 6px; flex: 0 0 auto; }
  .stueck.erst > * { margin-left: 9px; }
  .ticks { position: relative; height: 8px; margin-top: 3px; }
  .ticks .linie { position: absolute; top: 4px; left: 0; right: 0; height: 1px; background: var(--line); }
  .ticks span { position: absolute; top: 2px; width: 1px; height: 5px; background: var(--muted); opacity: .5; }
  .ticks span.stark { width: 2px; opacity: .8; }
  /* Jetzt-Strich: laeuft ueber den Balken UND die Tick-Zeile darunter, damit
     ablesbar bleibt, an welcher Viertelstunde er steht. Der Ring aus der
     Kachelfarbe haelt ihn sichtbar, wenn er gerade auf einem Fach steht —
     die Akzentfarbe allein kann auf einem farbigen Block untergehen. */
  .jetztstrich {
    position: absolute; top: -4px; height: 37px; width: 2px; z-index: 3;
    background: var(--accent); border-radius: 1px; pointer-events: none;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--card-color) 75%, transparent);
    transform: translateX(-1px);
  }
  .jetztstrich::before {
    content: ''; position: absolute; left: -3px; top: -3px;
    width: 8px; height: 8px; border-radius: 999px; background: var(--accent);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--card-color) 75%, transparent);
  }
  .fuss { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }
  .keinTag { font-size: 12px; color: var(--muted); padding: 4px 0; }

  /* ── Legende ───────────────────────────────────────────────────────────── */
  /* Im Balken steht nur ein Symbol; welches Fach dahinter liegt, verraet
     bisher nur der Mauszeiger — und auf einem Tablet gibt es keinen. */
  .legende { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 9px; }
  .legendenkopf {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .legendenkopf .zu {
    margin-left: auto; border: 0; background: transparent; color: var(--muted);
    font: inherit; cursor: pointer; padding: 2px 4px;
  }
  .faecher { display: flex; flex-wrap: wrap; gap: 6px; }
  /* AN .faecher GEBUNDEN. Die Klasse `fach` traegt im Wochenraster auch den
     Fachtitel einer Stunde. Ungebunden vererbte diese Regel ihm Anzeigeart,
     Polsterung, Rundung und Hintergrund der Pille mit — sichtbar als blasse
     Kapsel hinter jedem Fachnamen, und `inline-flex` machte den Titel zu einer
     schrumpffreien Box, die sich nicht kuerzen liess. */
  .faecher .fach {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px 4px 6px; border-radius: 999px;
    background: color-mix(in srgb, var(--content-color) 7%, transparent);
    font-size: 11px; font-weight: 600;
  }
  .faecher .fach .tupfen {
    width: 16px; height: 16px; border-radius: 50%; flex: 0 0 16px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 9px;
  }
  .faecher .fach .wessen { color: var(--muted); font-weight: 500; }
  /* Der Hinweis verschwindet, sobald die Legende offen ist. */
  .legendenhinweis {
    margin-top: 8px; font-size: 11px; color: var(--muted); text-align: center;
  }
</style>

<div id="rahmen"><div id="inhalt" class="scrollbereich"><div class="leer">…</div></div></div>

<script>
  /* Der Zustand kommt fertig gerechnet aus PHP: Hoehen, Luecken und Spannen
     sind dort geprueft, damit Raster, Timeline und die Karte in der App
     dieselben Zahlen zeigen. Hier wird nur gezeichnet. */
  /* ── Systemraender aus der Abfragezeichenfolge uebernehmen ────────────────
     Die Kachel-Visualisierung uebergibt margintop/marginside/marginbottom in
     der Adresse. Aufgetragen werden sie selbst (siehe #rahmen), damit der
     Inhalt nicht unter die eingeblendeten Bedienelemente rutscht. So frueh wie
     moeglich, damit die Variablen vor dem ersten Zeichnen stehen. */
  (function systemRaender() {
    try {
      const p = new URLSearchParams(window.location.search);
      const px = (name) => {
        const v = parseInt(p.get(name), 10);
        return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
      };
      const wurzel = document.documentElement.style;
      const mt = px('margintop');    if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
      const ms = px('marginside');   if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
      const mb = px('marginbottom'); if (mb !== null) { wurzel.setProperty('--sym-mb', mb); }
    } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
  })();

  /* ── Die tatsaechliche Balkenbreite messen ────────────────────────────────
     Sie schwankt je nach Umgebung (Webkit auf dem Schreibtisch 6–15 px). Ohne
     Messung stimmte die Zentrierung des Balkens im Randstreifen nur zufaellig.
     Gemessen wird an einer Probe mit derselben Klasse wie der Scrollbereich. */
  (function balkenBreite() {
    try {
      const probe = document.createElement('div');
      probe.className = 'scrollbereich';
      probe.style.cssText = 'position:absolute;top:-9999px;left:-9999px;'
        + 'display:block;width:100px;height:100px;padding:0;';
      probe.innerHTML = '<div style="height:200px"></div>';
      document.body.appendChild(probe);
      const b = probe.offsetWidth - probe.clientWidth;
      probe.remove();
      if (Number.isFinite(b) && b >= 0) {
        document.documentElement.style.setProperty('--sbw', b + 'px');
      }
    } catch (e) { /* Vorgabe --sbw (6px) greift */ }
  })();

  /* ── Scrollen in der Kachel halten ────────────────────────────────────────
     html-sdk.js von Symcon haengt an window ein `onwheel`, das JEDES deltaY an
     die Visualisierung meldet (postScroll), und meldet touchstart/touchmove als
     Position weiter. Die Visu scrollt daraufhin mit — unabhaengig davon, ob die
     Kachel die Geste selbst verbraucht hat. Dagegen hilft kein CSS: weder
     overscroll-behavior noch overflow greifen, weil es kein Ketten ist, sondern
     eine ausdrueckliche Weitergabe.

     Deshalb werden die Ereignisse in der ABFANG-Phase an document gestoppt. Das
     liegt vor der Blasen-Phase an window, wo html-sdk.js zuhoert — die Meldung
     unterbleibt also. Das Standardverhalten bleibt unberuehrt, die Kachel
     scrollt normal weiter; nur an den Raendern wird zusaetzlich preventDefault
     gerufen, damit dort nichts durchrutscht.

     Ueber document und nicht ueber die Bereiche selbst, weil .spalten bei jedem
     Zeichnen neu entsteht — ein einmal gebundener Handler haenge sonst an einem
     Element, das es nicht mehr gibt. */
  const SCROLL_BEREICHE = '#inhalt, .spalten';

  /* Der naechste Vorfahr, der in DIESER Richtung noch Weg hat. Ohne die
     Richtungsfrage gaelte ein Bereich, der schon am Anschlag steht, als
     zustaendig — und die Geste verpuffte. */
  function zustaendigerScroller(ziel, dx, dy) {
    let el = (ziel instanceof Element) ? ziel : null;
    while (el && el !== document.body) {
      if (el.matches && el.matches(SCROLL_BEREICHE)) {
        const maxY = el.scrollHeight - el.clientHeight;
        const maxX = el.scrollWidth - el.clientWidth;
        const gehtY = maxY > 1 && ((dy < 0 && el.scrollTop > 0)
                                || (dy > 0 && el.scrollTop < maxY - 1));
        const gehtX = maxX > 1 && ((dx < 0 && el.scrollLeft > 0)
                                || (dx > 0 && el.scrollLeft < maxX - 1));
        if (gehtY || gehtX) { return el; }
      }
      el = el.parentElement;
    }
    return null;
  }

  (function scrollEindaemmen() {
    document.addEventListener('wheel', function (e) {
      if (!zustaendigerScroller(e.target, e.deltaX || 0, e.deltaY || 0)) {
        // Nichts kann die Geste verbrauchen — dann soll sie auch nirgends
        // wirken, statt als Ersatzhandlung die ganze Visu zu bewegen.
        e.preventDefault();
      }
      e.stopPropagation();
    }, { passive: false, capture: true });

    let letzteY = null, letzteX = null;
    document.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches.length === 1) {
        letzteX = e.touches[0].clientX;
        letzteY = e.touches[0].clientY;
      } else {
        letzteX = letzteY = null;
      }
      e.stopPropagation();
    }, { passive: true, capture: true });

    document.addEventListener('touchmove', function (e) {
      if (!e.touches || e.touches.length !== 1 || letzteY === null) {
        e.stopPropagation();
        return;
      }
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      // Umgekehrtes Vorzeichen: nach oben wischen heisst nach unten scrollen.
      const dy = letzteY - y, dx = letzteX - x;
      letzteX = x; letzteY = y;
      if (!zustaendigerScroller(e.target, dx, dy)) { e.preventDefault(); }
      e.stopPropagation();
    }, { passive: false, capture: true });

    document.addEventListener('touchend', function () {
      letzteX = letzteY = null;
    }, { passive: true, capture: true });
  })();

  let zustand = null;
  let kindNr  = 0;
  let legende = false;   // Legende der sichtbaren Faecher
  let tagNr   = 0;       // gewaehlter Wochentag in der Timeline, 0 = noch keiner
  /* Wann der Plan mit seiner Minutenangabe eintraf. Der Strich laeuft zwischen
     zwei Sendungen weiter, sonst spraenge er alle fuenf Minuten. Gezaehlt wird
     die VERGANGENE Zeit seit dem Eintreffen, nicht die Uhr des Betrachters:
     dessen Zeitzone muss nicht die des Servers sein. */
  let planAn  = 0;
  let ticker  = null;

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (z) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z];
    });
  }

  /* Ein <i> OHNE Klasse waere ein leerer Kasten — deshalb gar keins. */
  function symbol(klasse) {
    return klasse ? '<i class="fa-light ' + esc(klasse) + '"></i>' : '';
  }

  /* Foto als Data-URI, ersatzweise der Anfangsbuchstabe auf farbigem Grund —
     dieselbe Darstellung wie in der Mitgliederleiste der App. */
  function gesicht(kind, klasse) {
    if (kind.avatar) {
      return '<img class="' + klasse + '" src="' + esc(kind.avatar) + '" alt="">';
    }
    const buchstabe = esc(String(kind.name || '?').charAt(0).toUpperCase());
    return '<span class="' + klasse + '" style="background:' + esc(kind.color) + '">'
      + buchstabe + '</span>';
  }

  function uhr(minuten) {
    const s = Math.floor(minuten / 60), m = minuten % 60;
    return (s < 10 ? '0' : '') + s + ':' + (m < 10 ? '0' : '') + m;
  }

  function stundenText(minuten) {
    const h = minuten / 60;
    if (Math.abs(Math.round(h) - h) < 0.05) {
      const g = Math.round(h);
      return g === 1 ? '1 Stunde' : g + ' Stunden';
    }
    return h.toFixed(1).replace('.', ',') + ' Stunden';
  }

  /* Die aktuelle Minute des SERVERS, fortgeschrieben um die Zeit seit dem
     Eintreffen des Plans. null heisst „gilt nicht fuer heute" — dann gibt es
     auch keinen Strich. */
  function jetztMinute() {
    if (!zustand || zustand.now == null) { return null; }
    const her = planAn ? Math.max(0, (Date.now() - planAn) / 60000) : 0;
    return zustand.now + her;
  }

  /* Der Strich fuer eine Balkenzeile — leer, wenn der gewaehlte Tag nicht heute
     ist oder die Uhr ausserhalb der Wochenspanne steht. Kein Klemmen an den
     Rand: ein Strich, der um 6 Uhr auf dem Schulbeginn klebte, behauptete, der
     Unterricht laufe. */
  function jetztStrichHtml(istHeute, von, spanne) {
    const jetzt = jetztMinute();
    if (!istHeute || jetzt === null || jetzt < von || jetzt > von + spanne) { return ''; }
    return '<div class="jetztstrich" title="jetzt ' + esc(uhr(Math.floor(jetzt)))
      + '" style="left:' + ((jetzt - von) / spanne * 100) + '%"></div>';
  }

  /* Zwischen zwei Sendungen weiterlaufen. Nur die Position wird gesetzt, nicht
     neu gezeichnet — ein Neuzeichnen schloesse die Legende und risse einen
     gerade gedrueckten Pfeil unter dem Finger weg. */
  function tickerStellen() {
    if (ticker) { clearInterval(ticker); ticker = null; }
    if (!zustand || zustand.mode !== 'timeline' || zustand.now == null) { return; }
    ticker = setInterval(function () {
      const striche = document.querySelectorAll('.jetztstrich');
      const jetzt = jetztMinute();
      if (jetzt === null) { return; }
      const von = zustand.span[0], spanne = Math.max(zustand.span[1] - von, 60);
      if (jetzt < von || jetzt > von + spanne) {
        // Aus der Spanne gelaufen (Nachmittag): wegnehmen statt am Rand kleben.
        striche.forEach(function (n) { n.remove(); });
        return;
      }
      if (striche.length === 0) { zeichne(); return; }
      striche.forEach(function (n) {
        n.style.left = ((jetzt - von) / spanne * 100) + '%';
        n.title = 'jetzt ' + uhr(Math.floor(jetzt));
      });
    }, 30000);
  }

  function handleMessage(daten) {
    if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
    if (!daten || !Array.isArray(daten.children)) { return; }
    zustand = daten;
    planAn = Date.now();
    if (kindNr >= daten.children.length) { kindNr = 0; }
    zeichne();
    tickerStellen();
  }

  function zeichne() {
    const ziel = document.getElementById('inhalt');
    if (!zustand) { return; }
    if (zustand.empty || zustand.children.length === 0) {
      ziel.innerHTML = '<div class="leer">Noch kein Stundenplan — im Backend Kinder und Stunden anlegen.</div>';
      return;
    }
    let html = '';
    if (zustand.holiday) {
      html += '<div class="ferien">' + symbol('fa-umbrella-beach')
        + '<span>' + esc(zustand.holiday.name) + ' — bis '
        + esc(datumKurz(zustand.holiday.until)) + '</span></div>';
    }
    html += zustand.mode === 'timeline' ? timeline() : woche();
    ziel.innerHTML = html;

    document.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        kindNr = parseInt(b.dataset.nr, 10) || 0;
        zeichne();
      });
    });
    /* Klick auf die Kachel klappt die Legende auf und zu. Nur in der Timeline:
       im Wochenraster sind die Kinder-Knoepfe anklickbar, und ein Klick daneben
       darf dort nichts anderes tun. Das ✕ schliesst gezielt. */
    if (zustand.mode === 'timeline') {
      ziel.onclick = function (e) {
        // Die Pfeile blaettern und lassen die Legende, wie sie ist — sonst
        // klappte sie bei jedem Tageswechsel zu.
        const pfeil = e.target.closest('[data-tag]');
        if (pfeil) {
          tagBlaettern(pfeil.dataset.tag === 'vor' ? 1 : -1);
          zeichne();
          return;
        }
        legende = e.target.closest('[data-legende="zu"]') ? false : !legende;
        zeichne();
      };
    } else {
      ziel.onclick = null;
    }
    // Beim Oeffnen zum heutigen Tag: die Woche faengt sonst am Montag an, und
    // am Donnerstag sieht man zuerst, was vorbei ist.
    const heute = document.querySelector('.spalte.istHeute');
    if (heute && heute.parentElement) {
      // Die Breite der Zeitachse MUSS abgezogen werden: sie steht seit dem
      // Umbau mit im Scrollbereich, Montag beginnt also nicht mehr bei 0.
      // Ohne den Abzug oeffnete das Raster um genau diese Breite verschoben —
      // gemessen 46px, und Montag verschwand halb unter der Achse.
      const achse = heute.parentElement.querySelector('.achse');
      const breit = achse ? achse.getBoundingClientRect().width : 0;
      heute.parentElement.scrollLeft = Math.max(0, heute.offsetLeft - breit - 8);
    }
  }

  function datumKurz(iso) {
    const t = String(iso || '').split('-');
    return t.length === 3 ? t[2] + '.' + t[1] + '.' : iso;
  }

  function kinderLeiste() {
    if (zustand.children.length < 2) { return ''; }
    return '<div class="kinder">' + zustand.children.map(function (k, i) {
      const an = i === kindNr;
      return '<button class="chip' + (an ? ' an' : '') + '" data-nr="' + i + '"'
        + (an ? ' style="background:' + esc(k.color) + '"' : '') + '>'
        + gesicht(k, 'gesicht') + esc(k.name) + '</button>';
    }).join('') + '</div>';
  }

  /* ── Wochenraster ─────────────────────────────────────────────────────── */
  function woche() {
    const kind = zustand.children[kindNr];
    const von = zustand.span[0], bis = zustand.span[1];
    const proViertel = 18;
    const hoehe = Math.max(Math.ceil((bis - von) / 15), 1) * proViertel;

    let html = '<div class="kopf"><h1>Woche</h1>';
    if (kind.next) {
      html += '<span class="naechste" style="color:' + esc(kind.color) + '">Als nächstes: '
        + esc(kind.next) + '</span>';
    }
    html += '</div>' + kinderLeiste();

    // Zeitachse: volle Stunden mit Beschriftung, dazu die tatsaechliche
    // Anfangszeit — krumme Startzeiten wie 07:45 sieht man sonst nirgends.
    let achse = '';
    const ersteStunde = Math.ceil(von / 60);
    for (let s = ersteStunde; s * 60 <= bis; s++) {
      const y = (s * 60 - von) / 15 * proViertel;
      achse += '<div class="marke" style="top:' + (y - 6) + 'px">' + s + ':00<i></i></div>';
    }
    if (von % 60 !== 0) {
      achse += '<div class="marke stark" style="top:-6px">' + uhr(von) + '<i></i></div>';
    }

    let spalten = '';
    kind.days.forEach(function (tag) {
      spalten += '<div class="spalte' + (tag.today ? ' istHeute' : '') + '">'
        + '<div class="spaltenkopf"><div><div class="tag">' + esc(tag.label) + '</div>'
        + (tag.parity ? '<div class="kw">' + esc(tag.parity) + '</div>' : '')
        + '</div>'
        + (tag.today ? '<span class="heute" style="background:' + esc(kind.color) + '">Heute</span>' : '')
        + '</div>';
      if (tag.slots.length === 0) {
        spalten += '<div class="frei" style="height:' + hoehe + 'px">frei</div>';
      } else {
        tag.slots.forEach(function (s) {
          if (s.gap > 0) {
            spalten += '<div class="frei" style="height:' + s.gap + 'px">frei</div>';
          }
          spalten += '<div class="stunde' + (s.next ? ' jetzt' : '')
            + (s.care ? ' betreuung' : '') + '" style="background:' + esc(s.color)
            + ';height:' + s.height + 'px">'
            + (s.icon ? '<span class="sym">' + symbol(s.icon) + '</span>' : '')
            + '<div><div class="fach">' + esc(s.name) + '</div>'
            + '<div class="zeit">' + esc(s.start) + ' – ' + esc(s.end) + '</div></div></div>';
        });
        // Schwanz bis zum Wochenende: sonst endet der Dienstag um 10:00 und der
        // Montag um 16:00, und die Spalten stehen ausgefranst nebeneinander.
        const letzte = tag.slots[tag.slots.length - 1];
        const rest = Math.max(Math.ceil((bis - letzte.to) / 15), 0) * proViertel;
        if (rest > 0) {
          spalten += '<div class="frei" style="height:' + rest + 'px">frei</div>';
        }
      }
      spalten += '</div>';
    });

    html += '<div class="raster"><div class="spalten">'
      + '<div class="achse"><div class="innen" style="height:'
      + hoehe + 'px;margin-top:40px">' + achse + '</div></div>'
      + spalten + '</div></div>';
    return html;
  }

  const TAGNAMEN = ['', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

  /* Die Tage, die die Timeline anbietet: die Vereinigung ueber alle Kinder.
     Hat EIN Kind Samstag, gibt es den Samstag — dann steht beim anderen dort
     „keine Schule", was richtig ist und nicht fehlt. */
  function timelineTage() {
    const gesehen = new Set();
    (zustand.children || []).forEach(function (k) {
      (k.days || []).forEach(function (t) { gesehen.add(t.weekday); });
    });
    return Array.from(gesehen).sort(function (a, b) { return a - b; });
  }

  /* Beim ersten Zeichnen auf HEUTE stellen — und wenn heute kein Schultag ist
     (Sonntag, Ferien, abgeschalteter Samstag), auf den ersten angebotenen Tag.
     Danach bleibt die Wahl des Nutzers stehen. */
  function tagWaehlen() {
    const tage = timelineTage();
    if (tage.indexOf(tagNr) >= 0) { return tagNr; }
    let heute = 0;
    (zustand.children || []).forEach(function (k) {
      (k.days || []).forEach(function (t) { if (t.today) { heute = t.weekday; } });
    });
    tagNr = tage.indexOf(heute) >= 0 ? heute : (tage[0] || 1);
    return tagNr;
  }

  function tagwahlHtml() {
    const tage = timelineTage();
    if (tage.length < 2) { return ''; }
    const jetzt = tagWaehlen();
    const heute = (zustand.children || []).some(function (k) {
      return (k.days || []).some(function (t) { return t.today && t.weekday === jetzt; });
    });
    // ALLE Namen stehen im Markup, damit der Kasten so breit ist wie der
    // laengste; sichtbar ist nur einer.
    const namen = tage.map(function (t) {
      return '<span class="' + (t === jetzt ? 'an' : '')
        + (t === jetzt && heute ? ' ist-heute' : '') + '">' + esc(TAGNAMEN[t]) + '</span>';
    }).join('');
    return '<span class="tagwahl">'
      + '<button data-tag="zurueck" aria-label="Vorheriger Tag">‹</button>'
      + '<span class="tagname">' + namen + '</span>'
      + '<button data-tag="vor" aria-label="Nächster Tag">›</button></span>';
  }

  function tagBlaettern(richtung) {
    const tage = timelineTage();
    const i = tage.indexOf(tagWaehlen());
    // Rundlauf: von Freitag weiter landet man wieder bei Montag.
    tagNr = tage[(i + richtung + tage.length) % tage.length];
  }

  /* Die im Balken sichtbaren Faecher, in der Reihenfolge des Tages und
     ohne Wiederholung. Zusammengefasst wird nach NAME: dasselbe Fach bei zwei
     Kindern ist ein Eintrag, und die Gesamtdauer summiert beide. */
  function sichtbareFaecher() {
    const karte = new Map();
    const gewaehlt = tagWaehlen();
    zustand.children.forEach(function (kind) {
      const tag = kind.days.filter(function (t) { return t.weekday === gewaehlt; })[0];
      (tag ? tag.slots : []).forEach(function (s) {
        const da = karte.get(s.name);
        if (da) {
          da.minuten += Math.max(s.to - s.from, 0);
          if (da.wer.indexOf(kind.name) < 0) { da.wer.push(kind.name); }
          return;
        }
        karte.set(s.name, {
          name: s.name, icon: s.icon, color: s.color,
          minuten: Math.max(s.to - s.from, 0), wer: [kind.name], care: !!s.care,
        });
      });
    });
    return Array.from(karte.values());
  }

  function legendeHtml() {
    const faecher = sichtbareFaecher();
    if (faecher.length === 0) { return ''; }
    if (!legende) {
      return '<div class="legendenhinweis" data-legende="auf">Fächer anzeigen</div>';
    }
    const mehrereKinder = zustand.children.length > 1;
    const eintraege = faecher.map(function (f) {
      /* KEINE Dauer. Sie stand hier zuerst, war aber die Summe ueber alle
         Kinder: „Deutsch 90 min", obwohl beide je 45 Minuten haben — eine Zahl,
         die man zwangslaeufig falsch liest. Statt dessen der Name des Kindes,
         wenn das Fach nur bei einem vorkommt; das beantwortet die Frage, die
         der Balken offen laesst. */
      const nur = (mehrereKinder && f.wer.length === 1)
        ? ' <span class="wessen">' + esc(f.wer[0]) + '</span>' : '';
      return '<span class="fach"><span class="tupfen" style="background:' + esc(f.color) + '">'
        + symbol(f.icon) + '</span>' + esc(f.name) + nur + '</span>';
    }).join('');
    const jetzt = tagWaehlen();
    const istHeute = (zustand.children || []).some(function (k) {
      return (k.days || []).some(function (t) { return t.today && t.weekday === jetzt; });
    });
    const ueberschrift = istHeute ? 'Fächer heute' : 'Fächer am ' + TAGNAMEN[jetzt];
    return '<div class="legende"><div class="legendenkopf"><span>' + esc(ueberschrift) + '</span>'
      + '<button class="zu" data-legende="zu" aria-label="Legende schließen">✕</button></div>'
      + '<div class="faecher">' + eintraege + '</div></div>';
  }

  /* ── Timeline ─────────────────────────────────────────────────────────── */
  function timeline() {
    const von = zustand.span[0], bis = zustand.span[1];
    const spanne = Math.max(bis - von, 60);
    const gewaehlt = tagWaehlen();
    // Kopfzeile nur wegen des Umschalters — er gehoert nach oben rechts.
    let html = '<div class="kopf">' + tagwahlHtml() + '</div>';

    zustand.children.forEach(function (kind) {
      const tag = kind.days.filter(function (t) { return t.weekday === gewaehlt; })[0];
      const slots = tag ? tag.slots : [];
      html += '<div class="zeile">';
      html += '<div class="zeilenkopf">' + gesicht(kind, 'gesicht')
        + '<span class="wer" style="color:' + esc(kind.color) + '">'
        + esc(kind.name) + '</span>';
      if (!tag || slots.length === 0) {
        html += '<span class="was">' + (zustand.holiday ? 'Ferien' : 'keine Schule') + '</span></div>';
        html += '<div class="keinTag">—</div></div>';
        return;
      }
      const beginn = slots[0].start, ende = slots[slots.length - 1].end;
      // Der Tag steht im Umschalter; hier nur noch die Dauer, und „Heute" nur
      // dann, wenn der gewaehlte Tag auch heute ist.
      html += '<span class="was">' + (tag.today ? 'Heute · ' : '')
        + esc(stundenText(tag.minutes || 0)) + '</span>'
        + '<span class="spanne">' + esc(beginn) + '–' + esc(ende) + '</span></div>';

      let stuecke = '';
      slots.forEach(function (s, i) {
        const a = Math.min(Math.max((s.from - von) / spanne, 0), 1);
        const b = Math.min(Math.max((s.to - von) / spanne, 0), 1);
        // Mindestbreite, sonst verschwindet eine kurze Stunde ganz.
        const breite = Math.max((b - a) * 100, 4);
        const erster = i === 0, letzter = i === slots.length - 1;
        const r = '11px';
        stuecke += '<div class="stueck' + (erster ? ' erst' : '') + '" title="'
          + esc(s.name + ' ' + s.start + '–' + s.end) + '"'
          + ' style="left:' + (a * 100) + '%;width:' + breite + '%;background:' + esc(s.color)
          + ';border-top-left-radius:' + (erster ? r : '0')
          + ';border-bottom-left-radius:' + (erster ? r : '0')
          + ';border-top-right-radius:' + (letzter ? r : '0')
          + ';border-bottom-right-radius:' + (letzter ? r : '0') + '">'
          + symbol(s.icon) + '</div>';
      });

      // 15-Minuten-Raster: erster, letzter und volle Stunden staerker, damit
      // die Tagesgrenzen lesbar bleiben.
      let ticks = '<div class="linie"></div>';
      const ersterTick = Math.ceil(von / 15) * 15;
      for (let m = ersterTick; m <= bis; m += 15) {
        const stark = m === ersterTick || m + 15 > bis || m % 60 === 0;
        ticks += '<span class="' + (stark ? 'stark' : '') + '" style="left:'
          + ((m - von) / spanne * 100) + '%"></span>';
      }

      // Der Strich kommt ZULETZT in den Balken: er soll ueber den Faechern
      // liegen, nicht darunter.
      html += '<div class="balken">' + stuecke + jetztStrichHtml(!!tag.today, von, spanne) + '</div>'
        + '<div class="ticks">' + ticks + '</div>'
        + '<div class="fuss"><span>Beginn: ' + esc(beginn) + '</span>'
        + '<span>Ende: ' + esc(ende) + '</span></div></div>';
    });
    return html + legendeHtml();
  }
</script>
