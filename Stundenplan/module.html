    }).join('');
    return '<span class="tagwahl">'
      + '<button data-woche="zurueck" aria-label="Vorherige Woche">‹</button>'
      + '<span class="tagname">' + namen + '</span>'
      + '<button data-woche="vor" aria-label="Nächste Woche">›</button></span>';
  }

  function kinderZeile() {
    const gesichter = kinderLeiste();
    const frei = zustand.holiday
      ? '<div class="ferien">' + symbol('fa-umbrella-beach')
        + '<span>' + esc(zustand.holiday.name) + ' — bis '
        + esc(datumKurz(zustand.holiday.until)) + '</span></div>'
      : '';
    /* Der Wochenwechsler nur im Raster: die Timeline hat oben rechts schon die
       Tageswahl, zwei Kaesten nebeneinander waeren eine Wahl zu viel. */
    const wochen = zustand.mode === 'timeline' ? '' : wochenwahlHtml();
    if (!gesichter && !frei && !wochen) { return ''; }
    return '<div class="kinderzeile">' + gesichter + frei + wochen + '</div>';
  }

  function kinderLeiste() {
    if (zustand.children.length < 2) { return ''; }
    return '<div class="kinder">' + zustand.children.map(function (k, i) {
      const an = i === kindNr;
      // Die Farbe des ausgewaehlten Chips kommt aus der AKZENTFARBE der Visu,
      // nicht mehr aus der Farbe des Kindes: sie bezeichnet die Auswahl, und
      // Auswahl sieht in dieser Kachel ueberall gleich aus. Das Kind erkennt
      // man am Gesicht und am Namen daneben, dafuer braucht es keine zweite
      // Farbsprache.
      return '<button class="chip' + (an ? ' an' : '') + '" data-nr="' + i + '">'
        + gesicht(k, 'gesicht') + esc(k.name) + '</button>';
    }).join('') + '</div>';
  }

  /* ── Wochenraster ─────────────────────────────────────────────────────── */
  function woche() {
    const kind = zustand.children[kindNr];
    /* Die Skala reicht nur so weit wie der laengste Unterrichtstag DIESES
       Kindes. zustand.span umspannt die ganze Woche einschliesslich der
       Termine — seit die Timeline Termin-Marker zeigt, zog ein Abendessen um
       21:00 das Raster bis 22:15 auf. Der Nachmittag stand dann leer im Bild
       und drueckte die Stunden zusammen; Termine zeigt das Raster ohnehin
       nicht. */
    // Die Tage der gewaehlten Woche — die laufende oder die kommende.
    const tage = wocheTage(kind);
    let von = Infinity, bis = -Infinity;
    tage.forEach(function (tag) {
      (tag.slots || []).forEach(function (s) {
        von = Math.min(von, s.from);
        bis = Math.max(bis, s.to);
      });
    });
    if (!isFinite(von) || bis <= von) { von = zustand.span[0]; bis = zustand.span[1]; }
    const proViertel = 18;
    const hoehe = Math.max(Math.ceil((bis - von) / 15), 1) * proViertel;

    /* Ohne Kopfzeile. Die Ueberschrift „Woche" sagte nichts, was das Raster
       nicht selbst zeigt, und „Als nächstes …" stand doppelt da: die laufende
       oder naechste Stunde ist im Raster ohnehin mit hellem Rand markiert.
       Beides nahm nur Hoehe weg, die dem Plan fehlte. */
    let html = kinderZeile();

    // Zeitachse: volle Stunden mit Beschriftung, dazu die tatsaechliche
    // Anfangszeit — krumme Startzeiten wie 07:45 sieht man sonst nirgends.
    let achse = '';
    const ersteStunde = Math.ceil(von / 60);
    for (let s = ersteStunde; s * 60 <= bis; s++) {
      const y = (s * 60 - von) / 15 * proViertel;
      achse += '<div class="marke" style="top:' + (y - 6) + 'px">' + s + ':00<i></i></div>';
    }
    if (von % 60 !== 0) {
      achse += '<div class="marke stark" style="top:-6px">' + uhr(von) + '<i></i></div>';
    }

    let spalten = '';
    tage.forEach(function (tag) {
      /* Das Datum nur mit Import: ohne ihn ist der Plan eine Vorlage, die fuer
         jede Woche gilt — ein Datum daran waere eine Behauptung. */
      const datum = (zustand.dated && tag.date) ? datumKurz(tag.date) : '';
      spalten += '<div class="spalte' + (tag.today ? ' istHeute' : '')
        + (tagOhneUnterricht(tag) ? ' ohne' : '') + '">'
        + '<div class="spaltenkopf"><div><div class="tag">' + esc(tag.label)
        + (datum ? ' <span class="datum">' + esc(datum) + '</span>' : '') + '</div>'
        + (tag.parity ? '<div class="kw">' + esc(tag.parity) + '</div>' : '')
        + '</div>'
        + (tag.today ? '<span class="heute">Heute</span>' : '')
        + '</div>';
      /* Der Koerper bekommt GENAU die Hoehe der Wochenspanne — dieselbe wie die
         Zeitachse. Vorher ergab sich die Spaltenhoehe aus der Summe der
         einzelnen Stunden, und weil jede fuer sich aufgerundet wird, war der
         Montag ein Viertel hoeher als der Rest. */
      /* Jeder Block sitzt an SEINER Uhrzeit, statt auf dem vorigen zu stehen.
         Gestapelt summierten sich die Aufrundungen der einzelnen Stunden: der
         Montag war 36px hoeher als der Koerper, und weil die Spalte abschneidet,
         verschwand die Betreuung am Tagesende. Nebenbei stehen die Stunden damit
         genau auf ihrer Marke in der Zeitachse. */
      const y = function (m) { return (m - von) / 15 * proViertel; };
      spalten += '<div class="koerper" style="height:' + hoehe + 'px">';
      if (tag.slots.length === 0) {
        spalten += '<div class="frei grund" style="top:0;height:' + hoehe + 'px">'
          + '<span>' + esc(freiGrund(tag)) + '</span></div>';
      } else {
        const luecke = function (a, b) {
          if (b - a < 1) { return ''; }
          return '<div class="frei" style="top:' + y(a) + 'px;height:'
            + (y(b) - y(a)) + 'px">frei</div>';
        };
        let vorher = von;
        tag.slots.forEach(function (s) {
          spalten += luecke(vorher, s.from);
          /* Untergrenze 45 Minuten: eine sehr kurze Stunde waere sonst ein
             Streifen, in dem weder Fach noch Zeit lesbar sind. Der ANFANG stimmt
             trotzdem immer, nur das Ende darf bei Kurzstunden ueberstehen.
             NICHT s.height nehmen — das ist die aufgerundete Hoehe vom Server
             und als Untergrenze holt sie genau die Aufrundung zurueck, die hier
             verschwinden soll (gemessen: 12px zu viel bei der Betreuung). */
          const h = Math.max(y(s.to) - y(s.from), proViertel * 3);
          /* Raum und Lehrer stehen mit Mittelpunkt getrennt und nur, wenn
             gepflegt — eine Zeile „ · " waere schlimmer als keine. Derselbe
             Text steht im title, denn in schmalen Spalten wird gekuerzt. */
          const wo = [s.room, s.teacher].filter(function (t) { return t; }).join(' · ');
          /* Entfall und Vertretung aus dem Import (WebUntis). Von Hand
             gepflegte Stunden tragen das Feld nicht — dann bleibt alles wie
             bisher. */
          const lage = ['entfall', 'vertretung', 'termin'].indexOf(s.status) >= 0 ? s.status : '';
          const marke = lage === 'entfall' ? 'entfällt'
            : (lage === 'vertretung'
                ? 'Vertretung' + (s.insteadOf ? ' statt ' + s.insteadOf : '')
                : (lage === 'termin' ? 'Termin' : ''));
          spalten += '<div class="stunde' + (s.next ? ' jetzt' : '')
            + (s.care ? ' betreuung' : '') + (lage ? ' ' + lage : '') + '" title="'
            + esc(s.name + ', ' + s.start + ' – ' + s.end + (wo ? ', ' + wo : '')
                  + (marke ? ' — ' + marke : ''))
            + '" style="background:' + esc(s.color)
            + ';top:' + y(s.from) + 'px;height:' + h + 'px">'
            + (s.icon ? '<span class="sym">' + symbol(s.icon) + '</span>' : '')
            + '<div><div class="fach">' + esc(s.name) + '</div>'
            + '<div class="zeit">' + esc(s.start) + ' – ' + esc(s.end) + '</div>'
            + (marke ? '<div class="wo zustand">' + esc(marke) + '</div>' : '')
            + (wo ? '<div class="wo">' + esc(wo) + '</div>' : '')
            + '</div>'
            /* Offene Hausaufgaben zu dieser Stunde. Die Zahl kommt vom Modul
               (nur im Kachelpfad angehaengt), die Zuordnung liegt bei der
               ERSTEN Stunde des Fachs an diesem Tag. */
            + (s.hw ? '<span class="hw" title="' + esc(s.hwText || '') + '">'
                      + '<span>\u270e</span>' + s.hw + '</span>' : '')
            + '</div>';
          vorher = Math.max(vorher, s.to);
        });
        spalten += luecke(vorher, bis);
      }
      spalten += '</div>'
        /* Hausaufgaben, die zu keiner Stunde dieses Tages passen (Fach fällt
           aus oder hat an dem Tag keine Stunde): als Fußzeile unter der Spalte
           statt gar nicht. */
        + (tag.hwFrei ? '<div class="hwfrei" title="' + esc('Hausaufgaben ohne Stunde') + '">\u270e '
                        + tag.hwFrei + '</div>' : '')
        + '</div>';
    });

    html += '<div class="raster"><div class="spalten">'
      + '<div class="achse"><div class="innen" style="height:'
      + hoehe + 'px;margin-top:var(--kopfhoehe)">' + achse + '</div></div>'
      + spalten + '</div></div>';
    return html;
  }

  const TAGNAMEN = ['', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];

  /** Die Tage EINER Woche eines Kindes — die laufende oder die kommende. */
  function tageDerWoche(kind, woche) {
    return (woche === 1 && Array.isArray(kind.nextDays)) ? kind.nextDays : ((kind && kind.days) || []);
  }

  /** Der Datensatz des gewaehlten Tages bei diesem Kind, oder undefined. */
  function tagVonKind(kind, weekday, woche) {
    return tageDerWoche(kind, woche).filter(function (t) { return t.weekday === weekday; })[0];
  }

  /* Die Tage, die die Timeline anbietet: die Vereinigung ueber alle Kinder,
     erst die laufende Woche, dann — mit Import — die kommende. Hat EIN Kind
     Samstag, gibt es den Samstag; beim anderen steht dort „Wochenende", was
     richtig ist und nicht fehlt.

     Die zweite Woche kommt nur mit Import (nextDays): ohne ihn wiederholt sich
     die Vorlage, und man blaetterte durch dieselben Tage zweimal. */
  function timelineTage() {
    const eintraege = [];
    [0, 1].forEach(function (woche) {
      const gesehen = new Set();
      (zustand.children || []).forEach(function (k) {
        if (woche === 1 && !Array.isArray(k.nextDays)) { return; }
        tageDerWoche(k, woche).forEach(function (t) { gesehen.add(t.weekday); });
      });
      Array.from(gesehen).sort(function (a, b) { return a - b; }).forEach(function (d) {
        eintraege.push({ woche: woche, weekday: d });
      });
    });
    return eintraege;
  }

  /** „1:3" — Woche und Wochentag als ein Wert, zum Vergleichen und Suchen. */
  function tagSchluessel(eintrag) {
    return eintrag.woche + ':' + eintrag.weekday;
  }

  function tagIndex(tage, woche, weekday) {
    for (let i = 0; i < tage.length; i++) {
      if (tage[i].woche === woche && tage[i].weekday === weekday) { return i; }
    }
    return -1;
  }

  /* Beim ersten Zeichnen auf HEUTE stellen. Ist heute kein Schultag, haengt es
     davon ab, WARUM:

       Wochenende  → der erste Tag der KOMMENDEN Woche. Sonst zeigte die
                     Timeline sonntags den Montag der Woche, die vorbei ist —
                     dieselbe Meldung, die schon das Wochenraster betraf.
       sonst       → der erste angebotene Tag (Ferien, abgeschalteter Samstag).

     Ob die Woche durch ist, sagt der Server je Kind (weekOver): das haengt am
     Datum des letzten Unterrichtstages, nicht an der Uhr des Betrachters.
     Danach bleibt die Wahl des Nutzers stehen. */
  function tagWaehlen() {
    const tage = timelineTage();
    if (tagGewaehlt && tagIndex(tage, tagWoche, tagNr) >= 0) { return tagNr; }
    let heute = 0;
    (zustand.children || []).forEach(function (k) {
      (k.days || []).forEach(function (t) { if (t.today) { heute = t.weekday; } });
    });
    if (heute && tagIndex(tage, 0, heute) >= 0) {
      tagWoche = 0; tagNr = heute;
      return tagNr;
    }
    const wocheDurch = (zustand.children || []).some(function (k) {
      return k.weekOver === true && Array.isArray(k.nextDays) && k.nextDays.length;
    });
    const erster = tage.filter(function (t) { return t.woche === (wocheDurch ? 1 : 0); })[0]
      || tage[0] || { woche: 0, weekday: 1 };
    tagWoche = erster.woche; tagNr = erster.weekday;
    return tagNr;
  }

  function tagwahlHtml() {
    const tage = timelineTage();
    if (tage.length < 2) { return ''; }
    const jetzt = tagWaehlen();
    /* „Heute" gilt nur in der LAUFENDEN Woche: blaettert man auf den Montag
       der kommenden, ist der gleiche Wochentag noch lange nicht heute. */
    const heute = tagWoche === 0 && (zustand.children || []).some(function (k) {
      return (k.days || []).some(function (t) { return t.today && t.weekday === jetzt; });
    });
    // ALLE Namen stehen im Markup, damit der Kasten so breit ist wie der
    // laengste; sichtbar ist nur einer.
    const namen = tage.map(function (t) {
      const an = t.woche === tagWoche && t.weekday === jetzt;
      /* Mit Import steht das DATUM dabei: seit die Wahl durch beide Wochen
         laeuft, gaebe es sonst zweimal „Montag" und kein Merkmal, welcher
         gemeint ist. Ohne Import ist der Plan eine Vorlage — ein Datum daran
         waere eine Behauptung, und die zweite Woche gibt es dann ohnehin nicht. */
      const datum = zustand.dated ? tagDatum(t) : '';
      return '<span class="' + (an ? 'an' : '') + (an && heute ? ' ist-heute' : '') + '">'
        + esc(TAGNAMEN[t.weekday]) + (datum ? ' <span class="datum">' + esc(datum) + '</span>' : '')
        + '</span>';
    }).join('');
    return '<span class="tagwahl">'
      + '<button data-tag="zurueck" aria-label="Vorheriger Tag">‹</button>'
      + '<span class="tagname">' + namen + '</span>'
      + '<button data-tag="vor" aria-label="Nächster Tag">›</button></span>';
  }

  /** Das Kurzdatum eines Eintrags — aus dem Tag irgendeines Kindes. */
  function tagDatum(eintrag) {
    for (const k of (zustand.children || [])) {
      const t = tagVonKind(k, eintrag.weekday, eintrag.woche);
      if (t && t.date) { return datumKurz(t.date); }
    }
    return '';
  }

  function tagBlaettern(richtung) {
    const tage = timelineTage();
    tagWaehlen();                       // stellt sicher, dass die Wahl in der Liste steht
    const i = tagIndex(tage, tagWoche, tagNr);
    /* Rundlauf ueber BEIDE Wochen: von Sonntag weiter geht es in die kommende
       Woche, und von deren Ende wieder auf den Anfang der laufenden. */
    const ziel = tage[(i + richtung + tage.length) % tage.length];
    tagWoche = ziel.woche;
    tagNr = ziel.weekday;
    tagGewaehlt = true;
  }

  /* Die im Balken sichtbaren Faecher, in der Reihenfolge des Tages und
     ohne Wiederholung. Zusammengefasst wird nach NAME: dasselbe Fach bei zwei
     Kindern ist ein Eintrag, und die Gesamtdauer summiert beide. */
  function sichtbareFaecher() {
    const karte = new Map();
    const gewaehlt = tagWaehlen();
    zustand.children.forEach(function (kind) {
      const tag = tagVonKind(kind, gewaehlt, tagWoche);
      (tag ? tag.slots : []).forEach(function (s) {
        const da = karte.get(s.name);
        if (da) {
          da.minuten += Math.max(s.to - s.from, 0);
          if (da.wer.indexOf(kind.name) < 0) { da.wer.push(kind.name); }
          return;
        }
        karte.set(s.name, {
          name: s.name, icon: s.icon, color: s.color,
          minuten: Math.max(s.to - s.from, 0), wer: [kind.name], care: !!s.care,
        });
      });
    });
    return Array.from(karte.values());
  }

  function legendeHtml() {
    const faecher = sichtbareFaecher();
    if (faecher.length === 0 || !legende) { return ''; }
    /* Kein Hinweis „Fächer anzeigen" mehr am Fuss: er stand dauerhaft da, um
       eine Geste zu erklaeren, die man ohnehin probiert — und nahm dem Plan
       eine Zeile. Geoeffnet wird sie ueber den Knopf oben links. */
    const mehrereKinder = zustand.children.length > 1;
    const eintraege = faecher.map(function (f) {
      /* KEINE Dauer. Sie stand hier zuerst, war aber die Summe ueber alle
         Kinder: „Deutsch 90 min", obwohl beide je 45 Minuten haben — eine Zahl,
         die man zwangslaeufig falsch liest. Statt dessen, WESSEN Fach es ist.

         Auch wenn es alle haben: bis hierher stand der Name nur bei einem Fach,
         das genau einem Kind gehoert. Fehlte er, musste man raten, ob das Fach
         beiden gehoert oder ob der Name bloss vergessen wurde. Jetzt steht er
         immer, mehrere durch Schraegstrich getrennt („Jonas / Lena"). */
      const nur = mehrereKinder
        ? ' <span class="wessen">' + esc(f.wer.join(' / ')) + '</span>' : '';
      return '<span class="fach"><span class="tupfen" style="background:' + esc(f.color) + '">'
        + symbol(f.icon) + '</span>' + esc(f.name) + nur + '</span>';
    }).join('');
    const jetzt = tagWaehlen();
    const istHeute = tagWoche === 0 && (zustand.children || []).some(function (k) {
      return (k.days || []).some(function (t) { return t.today && t.weekday === jetzt; });
    });
    /* Beim Blaettern in die kommende Woche gehoert das Datum dazu: „Fächer am
       Montag" waere sonst zweideutig, seit die Wahl durch beide Wochen laeuft. */
    const wann = TAGNAMEN[jetzt]
      + (tagWoche === 1 ? ' ' + tagDatum({ woche: 1, weekday: jetzt }) : '');
    const ueberschrift = istHeute ? 'Fächer heute' : 'Fächer am ' + wann;
    /* Ueber dem Plan statt darunter: unten angehaengt schob die Legende die
       Balken nach oben aus der Kachel, und bei vielen Faechern sah man beides
       nur halb. Als Blatt verdeckt sie den Plan, solange man sie liest, und
       gibt ihn unveraendert wieder frei. */
    return '<div class="legendenblatt" data-legende="zu">'
      + '<div class="legende">'
      + '<div class="legendenkopf"><span>' + esc(ueberschrift) + '</span>'
      + '<button class="zu" data-legende="zu" aria-label="Legende schließen">✕</button></div>'
      + '<div class="faecher">' + eintraege + '</div></div></div>';
  }

  /* ── Timeline ─────────────────────────────────────────────────────────── */
  function timeline() {
    const gewaehlt = tagWaehlen();
    const tagSpan = tagesSpanne(gewaehlt);
    const von = tagSpan[0], bis = tagSpan[1];
    const spanne = Math.max(bis - von, 60);
    /* Kopfzeile: links der Knopf fuer die Legende, rechts der Umschalter.
       Der Knopf erscheint nur, wenn es ueberhaupt Faecher zu erklaeren gibt. */
    const legendeKnopf = sichtbareFaecher().length
      ? '<button class="legendeauf" data-legende="auf" aria-label="Fächer anzeigen">'
        + symbol('fa-list') + '</button>'
      : '';
    let html = '<div class="kopf">' + legendeKnopf + tagwahlHtml() + '</div>';

    zustand.children.forEach(function (kind) {
      const tag = tagVonKind(kind, gewaehlt, tagWoche);
      const slots = tag ? tag.slots : [];
      html += '<div class="zeile">';
      html += '<div class="zeilenkopf">' + gesicht(kind, 'gesicht')
        + '<span class="wer" style="color:' + esc(kind.color) + '">'
        + esc(kind.name) + '</span>';
      /* Ferien oder Feiertag AN DIESEM Tag — nicht „heute": die Timeline
         blaettert durch die Woche, und die Auskunft haengt am Datum. */
      const frei = tag ? tag.holiday : null;
      if (frei) {
        html += '</div><div class="balken ferienbalken">'
          + '<span class="ferientext">' + symbol('fa-umbrella-beach')
          + esc(ferienText(frei)) + '</span></div></div>';
        return;
      }
      if (!tag || slots.length === 0) {
        html += '<span class="was">' + esc(freiGrund(tag)) + '</span></div>';
        html += '<div class="keinTag">—</div></div>';
        return;
      }
      /* Die Spanne zaehlt nur, was stattfindet: „08:00–14:05" waere falsch,
         wenn die letzten beiden Stunden ausfallen. Die Dauer kommt schon ohne
         Entfall vom Server (TimetableCalc::TagesDauer). */
      const echte = slots.filter(function (s) { return s.status !== 'entfall'; });
      const beginn = (echte[0] || slots[0]).start;
      const ende = (echte[echte.length - 1] || slots[slots.length - 1]).end;
      // Der Tag steht im Umschalter; hier nur noch die Dauer, und „Heute" nur
      // dann, wenn der gewaehlte Tag auch heute ist.
      html += '<span class="was">' + (tag.today ? 'Heute · ' : '')
        + esc(echte.length ? stundenText(tag.minutes || 0) : 'Unterricht entfällt') + '</span>'
        + '<span class="spanne">' + esc(beginn) + '–' + esc(ende) + '</span></div>';

      /* Gerundet wird nach der LAGE, nicht nach der Stelle im Feld: seit der
         Plan datierte Tage kennt, kann ein Ganztagsblock („Projekttag" 8–13
         Uhr) bis ans Ende der Bahn reichen und trotzdem als ERSTES Stueck
         kommen. Nach der alten Regel („das letzte Stueck rundet rechts")
         blieb dort eine scharfe Kante, und der Balken sah abgeschnitten aus —
         in der App vom Nutzer gemeldet. */
      const fruehesteZeit = Math.min.apply(null, slots.map(function (x) { return x.from; }));
      const spaetesteZeit = Math.max.apply(null, slots.map(function (x) { return x.to; }));
      let stuecke = '';
      slots.forEach(function (s, i) {
        const a = Math.min(Math.max((s.from - von) / spanne, 0), 1);
        const b = Math.min(Math.max((s.to - von) / spanne, 0), 1);
        /* Kein Prozent-Boden mehr: die Mindestbreite steht in PIXELN und wird
           ueber die Breite des ganzen Balkens hergestellt (balkenBreite).
           Ein Boden in Prozent log: er machte die kurze Stunde breiter, als
           sie ist, und verschob damit alles Folgende. */
        const breite = Math.max((b - a) * 100, 0.2);
        const erster = s.from <= fruehesteZeit;   // beginnt der Balken hier?
        const letzter = s.to >= spaetesteZeit;    // endet er hier?
        const r = '13px';
        /* Die entfallene Stunde rundet an BEIDEN Enden voll, unabhaengig
           davon, wo sie im Tag liegt: sie ist ein eigener Kasten mitten im
           Balken. Die stattfindenden Stunden bilden dagegen einen Strang und
           runden nur aussen. */
        const rundum = s.status === 'entfall';
        /* Im Balken ist nur Platz fuer das Symbol; Raum und Lehrer gehoeren
           deshalb in den Tipp, wo schon Fach und Zeit stehen. */
        const wo = [s.room, s.teacher].filter(function (t) { return t; }).join(' · ');
        const lage = ['entfall', 'vertretung', 'termin'].indexOf(s.status) >= 0 ? s.status : '';
        const marke = lage === 'entfall' ? 'entfällt'
          : (lage === 'vertretung' ? 'Vertretung' : (lage === 'termin' ? 'Termin' : ''));
        /* Bei einer Vertretung nennt WebUntis die weggefallene Lehrkraft mit —
           „statt Kais" sagt mehr als „Vertretung" allein. */
        const statt = (s.status === 'vertretung' && s.insteadOf) ? ' statt ' + s.insteadOf : '';
        /* Entfallen heisst: gestrichelte Kontur und eine Fuellung derselben
           Fachfarbe zu 50 %. Die stattfindende Stunde bleibt kraeftig — der
           Unterschied ist damit auf einen Blick zu sehen, und was unter der
           entfallenen liegt (an einem Projekttag der Ganztagsblock) scheint
           weiter durch. */
        const fuellung = s.status === 'entfall'
          ? 'color-mix(in srgb, ' + s.color + ' 50%, transparent)'
          : s.color;
        /* Der Titel der Vertretung darf nur den FREIEN Teil des Blocks
           benutzen. An einem Projekttag liegen die entfallenen Stunden mitten
           auf dem Ganztagsblock — der Text lief darunter weiter und wurde von
           ihnen ueberdeckt. Also bis zur naechsten Stunde, die auf ihm liegt,
           und 26 px ab fuer Zeichen und Abstaende. */
        let titelBreite = '';
        if (s.status === 'vertretung' || s.status === 'termin') {
          let naechst = s.to;
          slots.forEach(function (x) {
            if (x !== s && x.from > s.from && x.from < naechst) { naechst = x.from; }
          });
          const anteil = Math.max(0, naechst - s.from) / Math.max(1, s.to - s.from);
          titelBreite = ' style="max-width:calc(' + (anteil * 100).toFixed(1) + '% - 26px)"';
        }
        stuecke += '<div class="stueck' + (erster ? ' erst' : '') + (lage ? ' ' + lage : '')
          + (s.hw ? ' hat-hw' : '') + '" title="'
          + esc(s.name + ' ' + s.start + '–' + s.end + (wo ? ', ' + wo : '')
                + (marke ? ' — ' + marke + statt : '')
                + (s.hw ? ' — ' + s.hw + ' Hausaufgabe(n)' + (s.hwText ? ': ' + s.hwText : '') : '')) + '"'
          + ' style="left:' + (a * 100) + '%;width:' + breite + '%;background:' + esc(fuellung)
          + ';border-top-left-radius:' + (rundum ? '999px' : (erster ? r : '0'))
          + ';border-bottom-left-radius:' + (rundum ? '999px' : (erster ? r : '0'))
          + ';border-top-right-radius:' + (rundum ? '999px' : (letzter ? r : '0'))
          + ';border-bottom-right-radius:' + (rundum ? '999px' : (letzter ? r : '0')) + '">'
          /* Bei einer VERTRETUNG steht der Titel IM Balken: „Projekttag" oder
             „1. Methodentag" sagt mehr als jedes Symbol, und ein Ganztagsblock
             hat den Platz dafuer. Davor ein Tausch-Zeichen statt des
             Fachsymbols — die Stunde findet ja gerade NICHT wie geplant statt. */
          /* Vertretung und Termin tragen ihren Titel IM Balken, davor ein
             eigenes Zeichen: der Tausch bei der Vertretung, der Kalender beim
             Termin. Ein Ausflug heisst „Waldschule" und nicht „Biologie". */
          + (s.status === 'vertretung' || s.status === 'termin'
              ? symbol(s.status === 'termin' ? 'fa-calendar-star' : 'fa-right-left')
                + '<span class="titel"' + titelBreite + '>' + esc(s.name || '') + '</span>'
              : symbol(s.icon))
          + '</div>';
      });

      // 15-Minuten-Raster: erster, letzter und volle Stunden staerker, damit
      // die Tagesgrenzen lesbar bleiben.
      let ticks = '<div class="linie"></div>';
      const ersterTick = Math.ceil(von / 15) * 15;
      for (let m = ersterTick; m <= bis; m += 15) {
        const stark = m === ersterTick || m + 15 > bis || m % 60 === 0;
        ticks += '<span class="' + (stark ? 'stark' : '') + '" style="left:'
          + ((m - von) / spanne * 100) + '%"></span>';
      }

      /* Termin-Marker: Punkt an der Startzeit, daneben das Label. Das Label
         wird NACH dem Einfuegen gemessen (termineBeschriften) - erst dann steht
         fest, wie viel Pixel bis zum naechsten Marker bleiben. */
      let marker = '';
      (tag.events || []).forEach(function (e) {
        const p  = Math.min(Math.max((e.at - von) / spanne, 0), 1);
        const p2 = Math.min(Math.max(((e.bis || e.at) - von) / spanne, 0), 1);
        // Die Breite setzt termineBeschriften in Pixeln — hier steht die
        // Balkenbreite noch nicht fest (balkenBreite laeuft davor).
        marker += '<div class="termin" data-at="' + (e.at || 0) + '" data-p="' + (p * 100) + '"'
          + ' data-p2="' + (p2 * 100) + '"' + (e.open ? ' data-open="1"' : '') + ' title="'
          + esc((e.time || '') + ' ' + (e.title || '')) + '" style="left:' + (p * 100) + '%">'
          + '<span class="termin-bar"></span>'
          + '<span class="termin-titel"><span class="termin-lauf">'
          + esc(e.title || '') + '</span></span></div>';
      });

      // Der Strich kommt ZULETZT in den Balken: er soll ueber den Faechern
      // liegen, nicht darunter.
      /* Uhrzeiten UNTER der Achse, an ihrer Stelle: Beginn der ersten Stunde,
         Ende der letzten und die Startzeit jedes Termins. Sie ersetzen die
         alte Fusszeile, die „Beginn"/„Ende" an die Zeilenraender schrieb —
         dort standen sie neben der Zeit, zu der sie gehoeren, statt darunter.
         Die Zeile liegt IN der Scrollbahn: sie muss mit dem Balken rollen. */
      let zeiten = '';
      const zeitMarke = function (min, text, fest) {
        const p = Math.min(Math.max((min - von) / spanne, 0), 1);
        zeiten += '<span class="zeit' + (fest ? ' fest' : '') + '" style="left:'
          + (p * 100) + '%">' + esc(text) + '</span>';
      };
      zeitMarke(slots[0].from, beginn, true);
      zeitMarke(slots[slots.length - 1].to, ende, true);
      (tag.events || []).forEach(function (e) { zeitMarke(e.at, e.time || '', false); });

      html += '<div class="scrollbahn" data-von="' + von + '" data-bis="' + bis
        + '"><div class="balken">' + stuecke + marker
        + jetztStrichHtml(!!tag.today, von, spanne) + '</div>'
        + '<div class="ticks">' + ticks + '</div>'
        + '<div class="zeiten">' + zeiten + '</div></div></div>';
    });
    return html + legendeHtml();
  }
</script>
</body>
</html>
