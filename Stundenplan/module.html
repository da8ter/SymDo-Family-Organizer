<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Der Icon-Satz von Symcon. OHNE ihn bleiben alle <i> leere Kaesten: die
     Faecher haetten kein Symbol, die Betreuung keins und die Legende auch
     nicht. Die ToDo-Kachel bindet ihn genauso ein.

     VOLLSTAENDIGES Dokument und nicht wie zuvor ein Fragment: wo ein Fragment
     eingehaengt wird, entscheidet der Wirt — und ueber innerHTML eingesetzte
     script-Verweise laufen gar nicht. Im Prueflauf blieben so zwei von drei
     Laeufen ohne Symbole, obwohl der Satz geladen war. Die ToDo-Kachel ist
     seit jeher ein ganzes Dokument mit dem Verweis im Kopf. -->
<script src="/icons.js"></script>
<style>
  /* Symcon stellt --card-color, --content-color und --accent-color je nach
     Thema bereit. Alles Weitere leitet sich davon ab, damit die Kachel in Hell
     und Dunkel ohne eigenen Umschalter stimmt. */
  :root {
    --bg:      var(--card-color);
    --text:    var(--content-color);
    --muted:   color-mix(in srgb, var(--content-color) 45%, transparent);
    --line:    color-mix(in srgb, var(--content-color) 14%, transparent);
    --frei:    color-mix(in srgb, var(--content-color) 8%, transparent);
    --spalte:  color-mix(in srgb, var(--content-color) 5%, transparent);
    --kopf:    color-mix(in srgb, var(--content-color) 10%, transparent);
    --accent:  var(--accent-color);
    --viertel: 18px;   /* Pixel je Viertelstunde — der Massstab der Vorlage */
    --kopfhoehe: 40px; /* Spaltenkopf UND Versatz der Zeitachse — eine Zahl */
    /* Vom System vorgegebene Kachelraender (margintop/marginside/marginbottom
       aus der Abfragezeichenfolge, per JS gesetzt). Vorgabe 0, damit eine
       Kachel ohne diese Angaben randlos bleibt statt auf geratene Werte zu
       fallen. Dieselbe Mechanik wie in der ToDoList-Kachel. */
    --sym-mt:  0px;
    --sym-ms:  0px;
    --sym-mb:  0px;
    --sbw:     6px;   /* Balkenbreite; muss zu ::-webkit-scrollbar passen */
    /* Rechter Innenabstand, der den Balken MITTIG in den marginside-Streifen
       legt: der Scrollbereich endet um (marginside - Balken)/2 vor der Kante. */
    --sb-pad:  max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* Keine selbsttaetige Schriftvergroesserung: WebKit auf iOS blaeht Text auf,
     wenn sich die Layoutbreite aendert (Drehen ins Querformat), und nimmt es beim
     Zurueckdrehen nicht zurueck. 100% und nicht `none` — none naehme dem Nutzer
     auch seine eigene Schriftgroessen-Einstellung. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    /* Ein vom System gesetztes Body-Padding wird NEUTRALISIERT: die Raender
       werden unten selbst aus --sym-* aufgetragen. Vorher standen hier feste
       12px — die kamen zu dem des Systems HINZU, und der Inhalt rutschte je
       nach Kacheleinstellung unterschiedlich weit ein. */
    margin: 0 !important; padding: 0 !important;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text); background: var(--bg);
  }

  /* Der Rahmen traegt die Systemraender, #inhalt scrollt darin. Zwei Ebenen,
     damit der Balken im rechten Randstreifen sitzt und nicht daneben:
     links --sym-ms, rechts --sb-pad + --sb-pad + Balken = --sym-ms. */
  #rahmen {
    height: 100%; display: flex; flex-direction: column;
    padding: max(var(--sym-mt), env(safe-area-inset-top, 0px)) var(--sb-pad)
             var(--sym-mb) var(--sym-ms);
  }
  .scrollbereich {
    flex: 1; min-height: 0;
    /* Spalte, damit das Wochenraster die Resthoehe unter Kopf und Kinderleiste
       bekommt — und die beiden ueber dem Raster stehen bleiben. */
    display: flex; flex-direction: column;
    /* overflow-y: scroll statt auto: der Streifen ist IMMER reserviert, damit
       der rechte Abstand mit und ohne sichtbaren Balken derselbe ist. Die Spur
       ist durchsichtig, der Griff erscheint nur bei Bedarf. */
    overflow-y: scroll;
    overscroll-behavior: contain;
    padding: 12px var(--sb-pad) 12px 0;
  }
  /* Im Wochenraster rollt das Raster selbst, und sein Balken soll dort liegen,
     wo er in der Timeline liegt: mittig im marginside-Streifen. Dafuer muss
     dieser Bereich zweierlei hergeben — seinen rechten Innenabstand UND den
     Streifen, den er sich fuer den eigenen Balken reserviert. Zusammen sind das
     genau die 11 px, um die der Balken des Rasters zu weit innen lag (bei
     16 px marginside gemessen: 16 statt 5 px von der Kante).
     Ohne `overflow-y: hidden` blieben die 6 px reserviert; ein negativer
     Aussenabstand am Raster haette statt dessen eine waagerechte Rolle in
     diesem Bereich ausgeloest. */
  #inhalt.istWoche { overflow-y: hidden; padding-right: 0; }

  .scrollbereich::-webkit-scrollbar,
  .spalten::-webkit-scrollbar { width: 6px; height: 6px; }
  .scrollbereich::-webkit-scrollbar-track,
  .spalten::-webkit-scrollbar-track { background: transparent; }
  /* Wo senkrechter und waagerechter Streifen zusammentreffen, malt WebKit eine
     eigene ECKE. Ohne diese Regel bleibt sie undurchsichtig hell — im
     Wochenraster ein weisses Quadrat unten rechts, das nach einem Fehler aussah.
     Sie entsteht nur dort: der senkrechte Bereich scrollt nur in einer Richtung
     und hat keine Ecke. */
  .scrollbereich::-webkit-scrollbar-corner,
  .spalten::-webkit-scrollbar-corner { background: transparent; }
  .scrollbereich::-webkit-scrollbar-thumb,
  .spalten::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--accent) 70%, transparent);
    border-radius: 999px;
  }
  /* scrollbar-color/-width und ::-webkit-scrollbar schliessen sich gegenseitig
     aus: ist der Standard gesetzt, uebergeht WebKit die Pseudoelemente. Deshalb
     bekommt WebKit die Pseudoelemente, und der Standard gilt nur dort, wo es
     sie nicht gibt. */
  @supports not selector(::-webkit-scrollbar) {
    .scrollbereich, .spalten {
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
    }
  }
  .leer { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ── Kopf ──────────────────────────────────────────────────────────────── */
  .kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

  /* Legende NUR ueber diesen Knopf. Vorher oeffnete ein Klick auf die ganze
     Kachel — das nahm der Maus das waagerechte Ziehen an der Zeitleiste weg:
     jeder Zieh-Versuch endete als Klick und klappte die Legende auf. */
  .legendeauf {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; flex: none; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; color: var(--text);
    background: color-mix(in srgb, var(--content-color) 4%, transparent);
  }
  .legendeauf:hover { background: color-mix(in srgb, var(--content-color) 10%, transparent); }
  /* BEIDE Formen: /icons.js tauscht das <i> gegen ein <svg>. */
  .legendeauf > * { width: 12px; height: 12px; }

  /* Wochentag-Umschalter: fester Kasten, damit die Pfeile beim Blaettern nicht
     wandern. Die Breite kommt NICHT aus einer geratenen Zahl, sondern aus dem
     laengsten Wochentag selbst: alle Namen liegen uebereinander in derselben
     Rasterzelle, nur der aktuelle ist sichtbar. Damit stimmt sie auch, wenn
     jemand die Namen aendert. */
  .tagwahl {
    margin-left: auto; display: inline-flex; align-items: center; gap: 2px;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px;
    background: color-mix(in srgb, var(--content-color) 4%, transparent);
  }
  .tagwahl button {
    border: 0; background: transparent; color: var(--text); cursor: pointer;
    font: inherit; line-height: 1; padding: 4px 7px; border-radius: 999px;
  }
  .tagwahl button:hover { background: color-mix(in srgb, var(--content-color) 10%, transparent); }
  .tagname { display: inline-grid; place-items: center; padding: 0 2px; }
  .tagname span {
    grid-area: 1 / 1; font-size: 12px; font-weight: 700; white-space: nowrap;
    visibility: hidden;
  }
  .tagname span.an { visibility: visible; }
  .tagname span.ist-heute { color: var(--accent); }
  /* Eine Zeile: Gesichter, daneben das Ferienband ueber den Rest der Breite. */
  .kinderzeile { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ferien {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 12px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    font-size: 13px; font-weight: 600;
    /* Nimmt, was die Gesichter uebrig lassen. min-width: 0 ist Pflicht — ohne
       das waechst ein Flex-Kind bis zu seinem Inhalt und schoebe die Gesichter
       aus der Kachel, statt selbst zu kuerzen. */
    flex: 1 1 auto; min-width: 0;
  }
  .ferien span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ferien > *:first-child { flex: none; }

  /* Kinder-Auswahl: nur bei mehr als einem Kind. */
  .kinder { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .chip.an { color: #fff; border-color: transparent; background: var(--accent); }

  /* ── Wochenraster ──────────────────────────────────────────────────────── */
  /* Das Raster ist eine BEGRENZTE Flaeche, kein mitwachsender Block. Vorher war
     .spalten so hoch wie das ganze Raster — sein waagerechter Balken sass damit
     ganz unten am Inhalt, und man musste erst hinunterscrollen, um ihn ueberhaupt
     zu sehen. Jetzt fuellt das Raster die Resthoehe, und beide Balken liegen an
     den Kanten der sichtbaren Flaeche. */
  .raster { flex: 1 1 auto; min-height: 0; display: flex; }
  /* Die Zeitachse steht MIT IM Scrollbereich: nur so tragen Achse und Spalten
     denselben senkrechten Weg. Waagerecht bleibt sie durch sticky stehen,
     waehrend die Spalten darunter durchwandern. */
  .achse { position: sticky; left: 0; z-index: 2; flex: 0 0 46px; background: var(--bg); }
  .achse .innen { position: relative; }
  .marke {
    position: absolute; right: 0; display: flex; align-items: center; gap: 4px;
    font-size: 10px; font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .marke.stark { color: var(--text); font-weight: 700; }
  .marke i { display: block; width: 6px; height: 1px; background: currentColor; opacity: .6; }
  /* Ein Bereich fuer BEIDE Richtungen; scroll statt auto, damit die Streifen
     immer reserviert sind und der Inhalt nicht springt, sobald ein Balken
     auftaucht — dieselbe Ueberlegung wie beim senkrechten Bereich. */
  .spalten {
    /* align-items: flex-start, NICHT stretch. Der Bereich hat eine feste Hoehe
       (er ist das Scrollfenster), und stretch dehnte die Spalten auf genau
       diese Hoehe — bei 402px Fenster und 660px Inhalt schnitt `overflow:
       hidden` der Spalte alles darunter ab. Betroffen war zuerst die
       Betreuung, weil sie am Tagesende steht: im Markup vorhanden, aber nicht
       zu sehen und auch nicht zu erscrollen.
       Gleich hoch sind die Spalten trotzdem — der Koerper unten bekommt eine
       feste Hoehe, nicht die Ausrichtung sorgt dafuer. */
    flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 8px;
    overflow: scroll; position: relative;
  }
  /* Genau die Hoehe der Wochenspanne, dieselbe wie die Zeitachse. Damit sind
     alle Tage gleich hoch, ohne dass sich Aufrundungen der einzelnen Stunden
     aufsummieren duerfen. */
  .koerper { position: relative; }
  /* Alle Tage GLEICH breit und so schmal wie moeglich: sie teilen sich die
     Restbreite neben der Zeitachse (flex-basis 0, gleicher Wachstumsanteil).
     Die Untergrenze ist keine geratene Zahl, sondern gemessen: das Wort
     „Mathematik" muss neben dem Symbolkreis vollstaendig hineinpassen. Darunter
     scrollt das Raster waagerecht, statt die Namen unleserlich zu machen. Der
     Wert kommt aus --spalte-min und wird beim Start an der ECHTEN Schrift
     genommen — eine feste Zahl staende auf einer anderen Plattform daneben. */
  .spalte {
    flex: 1 1 0; min-width: var(--spalte-min, 140px);
    border-radius: 16px; background: var(--spalte); overflow: hidden;
  }
  .spaltenkopf {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; background: var(--kopf);
    /* FESTE Hoehe, nicht min-height: der Samstag traegt eine zweite Zeile fuer
       die Kalenderwoche und war damit hoeher als die anderen Tage. Der Wert ist
       zugleich der Versatz, mit dem die Zeitachse beginnt — beide muessen
       gleich sein, sonst stehen Achse und Stunden gegeneinander versetzt. */
    height: var(--kopfhoehe); overflow: hidden;
  }
  .spaltenkopf .tag { font-size: 13px; font-weight: 700; }
  .spaltenkopf .kw { font-size: 9px; font-weight: 600; color: var(--muted); }
  .heute {
    margin-left: auto; padding: 2px 7px; border-radius: 999px;
    font-size: 10px; font-weight: 700; color: #fff;
    background: var(--accent);
  }
  .frei {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--frei); color: var(--muted); font-size: 10px;
  }
  .stunde {
    position: absolute; left: 0; right: 0; overflow: hidden;
    padding: 8px 10px; color: #fff; display: flex; gap: 8px; align-items: flex-start;
  }
  /* min-width: 0 ist die Bedingung fuers Kuerzen: ein Flex-Kind ist von Haus
     aus mindestens so breit wie sein Inhalt, und text-overflow bekaeme nie
     Gelegenheit zu greifen — die Spalte waere statt dessen aufgegangen. */
  .stunde > div { min-width: 0; }
  .stunde .sym {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,.22);
    display: flex; align-items: center; justify-content: center; font-size: 11px;
  }
  .stunde .fach, .stunde .zeit {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stunde .fach { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .stunde .zeit { font-size: 10px; font-weight: 500; opacity: .82; margin-top: 2px; }
  .stunde.jetzt { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
  .stunde.betreuung { color: #fff; }

  /* ── Timeline ──────────────────────────────────────────────────────────── */
  .zeile { padding: 10px; border-radius: 14px; background: var(--spalte); margin-bottom: 8px; }
  .zeile:last-child { margin-bottom: 0; }
  /* Mitte statt Grundlinie: mit einem Bild im Kopf laege der Text sonst neben
     der Bildunterkante. */
  .zeilenkopf { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .gesicht {
    width: 24px; height: 24px; border-radius: 999px; object-fit: cover; flex: 0 0 24px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700;
  }
  .chip .gesicht { width: 18px; height: 18px; flex: 0 0 18px; font-size: 9px; margin-right: 5px; }
  .chip { display: inline-flex; align-items: center; }
  .zeilenkopf .wer { font-size: 13px; font-weight: 700; }
  .zeilenkopf .was { font-size: 12px; font-weight: 600; color: var(--muted); }
  .zeilenkopf .spanne { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); }
  .balken { position: relative; height: 26px; border-radius: 13px; background: var(--frei); }
  .stueck {
    position: absolute; top: 0; height: 26px; display: flex; align-items: center;
    color: #fff; font-size: 10px; overflow: hidden;
  }
  /* BEIDE Formen: /icons.js tauscht das <i> gegen ein <svg>, und eine Regel
     nur auf `i` greift danach nicht mehr — genau daran klebte das Symbol am
     linken Rand und wurde von der runden Kappe angeschnitten. */
  .stueck > * { margin-left: 6px; flex: 0 0 auto; }
  .stueck.erst > * { margin-left: 9px; }
  /* Ferienbalken: derselbe Balken wie sonst, nur ganz grau und mit dem Hinweis
     in der Mitte statt der Faecher. Kein Tickraster darunter — es gliederte
     eine Zeit, die an diesem Tag niemand hat. */
  .ferienbalken {
    background: var(--frei);
    display: flex; align-items: center; justify-content: center;
  }
  .ferientext {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; color: var(--muted);
    max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* Balken und Tick-Zeile in EINER Bahn: sie muessen zusammen rollen, sonst
     stuenden die Viertelstunden-Striche unter den falschen Faechern. */
  .scrollbahn {
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
    /* Platz fuer den Kopf des Jetzt-Strichs. Die Bahn muss waagerecht rollen,
       und sobald eine Achse nicht mehr `visible` ist, schneidet auch die
       andere ab — der Kreis ragt 7 px ueber den Balken hinaus (Strich bei
       top:-4, Kreis 3 px darueber) und wurde oben gekappt. Das Polster schiebt die Schnittkante nach oben, der negative
       Aussenabstand haelt die Bahn dort, wo sie vorher lag. */
    padding-top: 8px; margin-top: -8px;
  }
  .scrollbahn::-webkit-scrollbar { display: none; }
  .ticks { position: relative; height: 8px; margin-top: 3px; }
  .ticks .linie { position: absolute; top: 4px; left: 0; right: 0; height: 1px; background: var(--line); }
  .ticks span { position: absolute; top: 2px; width: 1px; height: 5px; background: var(--muted); opacity: .5; }
  .ticks span.stark { width: 2px; opacity: .8; }
  /* Jetzt-Strich: laeuft ueber den Balken UND die Tick-Zeile darunter, damit
     ablesbar bleibt, an welcher Viertelstunde er steht. Der Ring aus der
     Kachelfarbe haelt ihn sichtbar, wenn er gerade auf einem Fach steht —
     die Akzentfarbe allein kann auf einem farbigen Block untergehen. */
  /* Termin-Marker: Punkt MITTIG im Balken, Label daneben. Unter dem
   Jetzt-Strich (z-index 2 < 3): der Strich ist die wichtigere Auskunft. */
  .termin {
    position: absolute; top: 0; height: 100%; z-index: 2;
    display: flex; align-items: center; gap: 3px;
    /* Der Rahmen faengt KEINE Zeiger. Er ist volle Balkenhoehe, und die
       Reihenversetzung sitzt an Balken und Titel — nicht an ihm. Sein Kasten
       lag damit ueber dem Nachbarn, und wer auf den Balken von „Schwimmen"
       zeigte, bekam den Tooltip von „Test" zu sehen, weil dessen Rahmen
       spaeter im Baum steht und darueber liegt. Der Tooltip kommt trotzdem von
       hier: der Browser sucht den title am naechsten Vorfahren des getroffenen
       Elements. */
    pointer-events: none;
  }
  .termin-bar, .termin-titel { pointer-events: auto; }
  /* Der Titel bei BERUEHRUNG. Das title-Attribut kennt nur der Mauszeiger — am
     Wandtablet bliebe ein Termin ohne Platz fuers Etikett sonst stumm.
     Haengt an <body> und liegt fest im Fenster, weil die Rollbahn senkrecht
     abschneidet: eine Blase ueber dem Balken waere dort gekappt. */
  .terminblase {
    position: fixed; z-index: 20; pointer-events: none;
    padding: 5px 9px; border-radius: 9px; font-size: 11px; line-height: 1.25;
    color: var(--card-color); background: var(--text);
    box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    max-width: 70vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .12s ease;
  }
  .terminblase.an { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .terminblase { transition: none; } }
  /* Der Termin als Balken: so lang wie er dauert. Ohne Endzeit laeuft er
     nach rechts aus (data-open) — die Kachel behauptet dann keine Endzeit,
     die niemand gesetzt hat. */
  .termin-bar {
    height: 7.5px; border-radius: 999px; flex: none;
    background: var(--accent);
  }
  .termin[data-open] .termin-bar {
    border-radius: 999px 0 0 999px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  /* Ueberschneidet ein Termin einen frueheren, wird SEIN Balken halb
     durchsichtig und etwas dunkler. Die beiden stehen zwar in versetzten
     Reihen, beruehren sich dort aber — ohne Unterschied sah das aus wie ein
     einziger langer Balken.
     Dunkler ZUERST: die halbe Deckkraft hellt ihn ueber dem hellen Grund
     ohnehin wieder auf, ohne brightness bliebe er blasser als das Original
     statt kraeftiger. */
  .termin.ueberlappt .termin-bar { filter: brightness(.72); opacity: .5; }
  /* Ohne Grund und ohne Saum (Wunsch vom 27.08.2026): der Titel steht blank
     im Balken. Er liegt damit moeglicherweise ueber einem farbigen Fach —
     in der Praxis selten, weil Termine nach dem Unterricht liegen und dort
     der Balken leer ist. */
  .termin-titel {
    font-size: 9px; line-height: 1; color: var(--text);
    white-space: nowrap; overflow: hidden;
  }
  /* Zu lange Titel laufen hin und her, statt abgeschnitten dazustehen — wie die
     Artikelnamen im Einkaufs-Streifen der Uebersicht, und mit denselben Zeiten.

     Der Lauf sitzt INNEN: .termin-titel traegt bei zwei Reihen bereits ein
     translateY, und ein zweites transform am selben Element wuerde es
     ueberschreiben — der Titel spraenge beim Laufen in die andere Reihe.

     Kein text-overflow mehr am Titel: sobald der Text in einem eigenen Kasten
     steckt, greift die Ellipse dort nicht mehr. Sie steht jetzt am inneren
     Element, fuer den Fall ohne Bewegung (siehe unten). */
  .termin-lauf { display: inline-block; }
  .termin-titel.laeuft .termin-lauf { animation: termin-pingpong 6s ease-in-out infinite; }
  @keyframes termin-pingpong {
    0%, 15%   { transform: translateX(0); }
    45%, 55%  { transform: translateX(var(--lauf-weg, -30px)); }
    85%, 100% { transform: translateX(0); }
  }
  /* Wer Bewegung abgestellt hat, bekommt die Ellipse zurueck: mit max-width hat
     das innere Element einen eigenen Deckel, an dem sie greift. */
  @media (prefers-reduced-motion: reduce) {
    .termin-titel.laeuft .termin-lauf { animation: none; }
    .termin-lauf { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  }
  /* Zwei Reihen bei Ueberschneidung — nur dann, sonst bleibt es mittig. */
  .termin.oben  .termin-bar, .termin.oben  .termin-titel { transform: translateY(-6px); }
  .termin.unten .termin-bar, .termin.unten .termin-titel { transform: translateY(6px); }
  /* Label links vom Punkt. Verankert wird ueber `right` (gesetzt in
     termineBeschriften), NICHT ueber transform: ein absolut positioniertes
     Element bei `left: 94%` bekommt als Hoechstbreite nur die restlichen 6 %
     des Balkens — transform verschiebt es zwar, gibt ihm aber keine Breite.
     Genau daran wurde „Abendessen" zu „Abendess…". */
  .termin.flip { flex-direction: row-reverse; }
  /* Ohne Ring (Wunsch vom 28.08.2026). Er hob den Strich von einem farbigen
     Fach ab; auf Wunsch steht die Akzentfarbe jetzt fuer sich allein. */
  .jetztstrich {
    position: absolute; top: -4px; height: 41px; width: 2px; z-index: 3;
    background: var(--accent); border-radius: 1px; pointer-events: none;
    transform: translateX(-1px);
  }
  .jetztstrich::before {
    content: ''; position: absolute; left: -3px; top: -3px;
    width: 8px; height: 8px; border-radius: 999px; background: var(--accent);
  }
  /* Uhrzeiten unter der Achse. Die Stundenzeiten (fest) etwas kraeftiger als
     die Terminzeiten — sie umreissen den Schultag, die Termine haengen daran. */
  .zeiten { position: relative; height: 12px; margin-top: 2px; }
  .zeiten .zeit {
    position: absolute; top: 0; font-size: 9px; line-height: 1.3;
    color: var(--muted); white-space: nowrap; transform: translateX(-50%);
  }
  .zeiten .zeit.fest { color: var(--text); }
  .keinTag { font-size: 12px; color: var(--muted); padding: 4px 0; }

  /* ── Legende ───────────────────────────────────────────────────────────── */
  /* Im Balken steht nur ein Symbol; welches Fach dahinter liegt, verraet
     bisher nur der Mauszeiger — und auf einem Tablet gibt es keinen. */
  /* Das Blatt deckt die ganze Kachel ab; der Plan bleibt darunter stehen und
     ist unveraendert da, sobald es zugeht. */
  /* FEST, nicht absolut: es gibt keinen positionierten Vorfahren, und der
     Scrollbereich duerfte das Blatt ohnehin nicht mitscrollen. Fest heisst hier
     die Kachel selbst — sie ist ihr eigenes Dokument. */
  .legendenblatt {
    position: fixed; inset: 0; z-index: 5;
    display: flex; align-items: flex-end;
    background: color-mix(in srgb, var(--card-color) 55%, transparent);
    backdrop-filter: blur(3px);
  }
  .legende {
    width: 100%; max-height: 100%; overflow-y: auto;
    padding: 10px 12px 12px;
    background: var(--bg);
    border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -6px 18px rgba(0, 0, 0, .18);
  }
  .legendenkopf {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .legendenkopf .zu {
    margin-left: auto; border: 0; background: transparent; color: var(--muted);
    font: inherit; cursor: pointer; padding: 2px 4px;
  }
  .faecher { display: flex; flex-wrap: wrap; gap: 6px; }
  /* AN .faecher GEBUNDEN. Die Klasse `fach` traegt im Wochenraster auch den
     Fachtitel einer Stunde. Ungebunden vererbte diese Regel ihm Anzeigeart,
     Polsterung, Rundung und Hintergrund der Pille mit — sichtbar als blasse
     Kapsel hinter jedem Fachnamen, und `inline-flex` machte den Titel zu einer
     schrumpffreien Box, die sich nicht kuerzen liess. */
  .faecher .fach {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 9px 4px 6px; border-radius: 999px;
    background: color-mix(in srgb, var(--content-color) 7%, transparent);
    font-size: 11px; font-weight: 600;
  }
  .faecher .fach .tupfen {
    width: 16px; height: 16px; border-radius: 50%; flex: 0 0 16px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 9px;
  }
  .faecher .fach .wessen { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>

<div id="rahmen"><div id="inhalt" class="scrollbereich"><div class="leer">…</div></div></div>

<script>
  /* Der Zustand kommt fertig gerechnet aus PHP: Hoehen, Luecken und Spannen
     sind dort geprueft, damit Raster, Timeline und die Karte in der App
     dieselben Zahlen zeigen. Hier wird nur gezeichnet. */
  /* ── Systemraender aus der Abfragezeichenfolge uebernehmen ────────────────
     Die Kachel-Visualisierung uebergibt margintop/marginside/marginbottom in
     der Adresse. Aufgetragen werden sie selbst (siehe #rahmen), damit der
     Inhalt nicht unter die eingeblendeten Bedienelemente rutscht. So frueh wie
     moeglich, damit die Variablen vor dem ersten Zeichnen stehen. */
  (function systemRaender() {
    try {
      const p = new URLSearchParams(window.location.search);
      const px = (name) => {
        const v = parseInt(p.get(name), 10);
        return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
      };
      const wurzel = document.documentElement.style;
      const mt = px('margintop');    if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
      const ms = px('marginside');   if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
      const mb = px('marginbottom'); if (mb !== null) { wurzel.setProperty('--sym-mb', mb); }
    } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
  })();

  /* ── Mindestbreite einer Tagesspalte messen ───────────────────────────────
     Sie ist als „das Wort Mathematik muss hineinpassen" festgelegt. Statt einer
     festen Zahl wird das Wort in der echten Schrift der Stundenkarte gemessen:
     Schriftart und -groesse unterscheiden sich je nach System, und eine feste
     Zahl waere anderswo entweder zu eng oder verschenkte Platz.

     Dazu die Breite, die neben dem Text noch draufgeht: Polsterung der Karte
     links und rechts, der Symbolkreis und sein Abstand. Alles aus dem
     Stylesheet gelesen, damit die Rechnung nicht auseinanderlaeuft, wenn dort
     jemand eine Zahl aendert. */
  function spaltenMindestbreite() {
    try {
      const karte = document.createElement('div');
      karte.className = 'stunde';
      karte.style.cssText = 'position:absolute;top:-9999px;left:-9999px;visibility:hidden';
      karte.innerHTML = '<span class="sym"></span><div><div class="fach">Mathematik</div></div>';
      document.body.appendChild(karte);
      const stil = getComputedStyle(karte);
      const wort = karte.querySelector('.fach');
      // scrollWidth statt Rechteck: der Text ist auf Kuerzen gestellt und waere
      // im Rechteck schon auf die Elternbreite beschnitten.
      const textBreit = wort.scrollWidth;
      const symbol = karte.querySelector('.sym');
      const symStil = getComputedStyle(symbol);
      const daneben = parseFloat(stil.paddingLeft) + parseFloat(stil.paddingRight)
        + parseFloat(symStil.width) + parseFloat(stil.columnGap || stil.gap || 0);
      karte.remove();
      const min = Math.ceil(textBreit + daneben);
      if (Number.isFinite(min) && min > 0) {
        document.documentElement.style.setProperty('--spalte-min', min + 'px');
      }
    } catch (e) { /* Vorgabe 140px greift */ }
  }
  spaltenMindestbreite();
  /* Noch einmal, sobald die Schriften stehen: der Kachel-SDK von Symcon zieht
     Poppins nach. Vor dem Laden misst man die Ersatzschrift, und die Spalte
     waere danach entweder zu eng fuer das Wort oder unnoetig breit. */
  try {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(spaltenMindestbreite);
    }
  } catch (e) {}

  /* ── Die tatsaechliche Balkenbreite messen ────────────────────────────────
     Sie schwankt je nach Umgebung (Webkit auf dem Schreibtisch 6–15 px). Ohne
     Messung stimmte die Zentrierung des Balkens im Randstreifen nur zufaellig.
     Gemessen wird an einer Probe mit derselben Klasse wie der Scrollbereich. */
  (function balkenBreite() {
    try {
      const probe = document.createElement('div');
      probe.className = 'scrollbereich';
      probe.style.cssText = 'position:absolute;top:-9999px;left:-9999px;'
        + 'display:block;width:100px;height:100px;padding:0;';
      probe.innerHTML = '<div style="height:200px"></div>';
      document.body.appendChild(probe);
      const b = probe.offsetWidth - probe.clientWidth;
      probe.remove();
      if (Number.isFinite(b) && b >= 0) {
        document.documentElement.style.setProperty('--sbw', b + 'px');
      }
    } catch (e) { /* Vorgabe --sbw (6px) greift */ }
  })();

  /* ── Scrollen in der Kachel halten ────────────────────────────────────────
     html-sdk.js von Symcon haengt an window ein `onwheel`, das JEDES deltaY an
     die Visualisierung meldet (postScroll), und meldet touchstart/touchmove als
     Position weiter. Die Visu scrollt daraufhin mit — unabhaengig davon, ob die
     Kachel die Geste selbst verbraucht hat. Dagegen hilft kein CSS: weder
     overscroll-behavior noch overflow greifen, weil es kein Ketten ist, sondern
     eine ausdrueckliche Weitergabe.

     Deshalb werden die Ereignisse in der ABFANG-Phase an document gestoppt. Das
     liegt vor der Blasen-Phase an window, wo html-sdk.js zuhoert — die Meldung
     unterbleibt also. Das Standardverhalten bleibt unberuehrt, die Kachel
     scrollt normal weiter; nur an den Raendern wird zusaetzlich preventDefault
     gerufen, damit dort nichts durchrutscht.

     Ueber document und nicht ueber die Bereiche selbst, weil .spalten bei jedem
     Zeichnen neu entsteht — ein einmal gebundener Handler haenge sonst an einem
     Element, das es nicht mehr gibt. */
  const SCROLL_BEREICHE = '#inhalt, .spalten';

  /* Der naechste Vorfahr, der in DIESER Richtung noch Weg hat. Ohne die
     Richtungsfrage gaelte ein Bereich, der schon am Anschlag steht, als
     zustaendig — und die Geste verpuffte. */
  function zustaendigerScroller(ziel, dx, dy) {
    let el = (ziel instanceof Element) ? ziel : null;
    while (el && el !== document.body) {
      if (el.matches && el.matches(SCROLL_BEREICHE)) {
        const maxY = el.scrollHeight - el.clientHeight;
        const maxX = el.scrollWidth - el.clientWidth;
        const gehtY = maxY > 1 && ((dy < 0 && el.scrollTop > 0)
                                || (dy > 0 && el.scrollTop < maxY - 1));
        const gehtX = maxX > 1 && ((dx < 0 && el.scrollLeft > 0)
                                || (dx > 0 && el.scrollLeft < maxX - 1));
        if (gehtY || gehtX) { return el; }
      }
      el = el.parentElement;
    }
    return null;
  }

  (function scrollEindaemmen() {
    document.addEventListener('wheel', function (e) {
      if (!zustaendigerScroller(e.target, e.deltaX || 0, e.deltaY || 0)) {
        // Nichts kann die Geste verbrauchen — dann soll sie auch nirgends
        // wirken, statt als Ersatzhandlung die ganze Visu zu bewegen.
        e.preventDefault();
      }
      e.stopPropagation();
    }, { passive: false, capture: true });

    let letzteY = null, letzteX = null;
    document.addEventListener('touchstart', function (e) {
      if (e.touches && e.touches.length === 1) {
        letzteX = e.touches[0].clientX;
        letzteY = e.touches[0].clientY;
      } else {
        letzteX = letzteY = null;
      }
      e.stopPropagation();
    }, { passive: true, capture: true });

    document.addEventListener('touchmove', function (e) {
      if (!e.touches || e.touches.length !== 1 || letzteY === null) {
        e.stopPropagation();
        return;
      }
      const x = e.touches[0].clientX, y = e.touches[0].clientY;
      // Umgekehrtes Vorzeichen: nach oben wischen heisst nach unten scrollen.
      const dy = letzteY - y, dx = letzteX - x;
      letzteX = x; letzteY = y;
      if (!zustaendigerScroller(e.target, dx, dy)) { e.preventDefault(); }
      e.stopPropagation();
    }, { passive: false, capture: true });

    document.addEventListener('touchend', function () {
      letzteX = letzteY = null;
    }, { passive: true, capture: true });
  })();

  let zustand = null;
  let kindNr  = 0;
  let legende = false;   // Legende der sichtbaren Faecher
  let tagNr   = 0;       // gewaehlter Wochentag in der Timeline, 0 = noch keiner
  /* Wann der Plan mit seiner Minutenangabe eintraf. Der Strich laeuft zwischen
     zwei Sendungen weiter, sonst spraenge er alle fuenf Minuten. Gezaehlt wird
     die VERGANGENE Zeit seit dem Eintreffen, nicht die Uhr des Betrachters:
     dessen Zeitzone muss nicht die des Servers sein. */
  let planAn  = 0;
  let ticker  = null;

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (z) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[z];
    });
  }

  /* Der Icon-Satz ersetzt <i> durch <svg> von selbst — aber nur, was beim
     Laden schon dasteht oder was sein Beobachter mitbekommt. Die Kachel zeichnet
     ihren Inhalt nach dem Laden neu, und gemessen fiel sie einmal genau in die
     Luecke zwischen erstem Durchgang und Beobachter: der Satz war geladen, und
     trotzdem standen 22 leere Kaesten da. Deshalb nach JEDEM Zeichnen selbst
     anstossen — laeuft der Satz noch nicht, passiert nichts, und sein Beobachter
     holt es nach. */
  function symboleErsetzen() {
    // Ueber document.body und nicht ueber den Inhalt: mit einem engeren Knoten
    // blieb die Ersetzung im Prueflauf zwei von drei Laeufen aus.
    try {
      if (window.FontAwesome && window.FontAwesome.dom) {
        window.FontAwesome.dom.i2svg({ node: document.body });
      }
    } catch (e) {}
  }

  /* Ein <i> OHNE Klasse waere ein leerer Kasten — deshalb gar keins. */
  function symbol(klasse) {
    return klasse ? '<i class="fa-light ' + esc(klasse) + '"></i>' : '';
  }

  /* Foto als Data-URI, ersatzweise der Anfangsbuchstabe auf farbigem Grund —
     dieselbe Darstellung wie in der Mitgliederleiste der App. */
  function gesicht(kind, klasse) {
    if (kind.avatar) {
      return '<img class="' + klasse + '" src="' + esc(kind.avatar) + '" alt="">';
    }
    const buchstabe = esc(String(kind.name || '?').charAt(0).toUpperCase());
    return '<span class="' + klasse + '" style="background:' + esc(kind.color) + '">'
      + buchstabe + '</span>';
  }

  function uhr(minuten) {
    const s = Math.floor(minuten / 60), m = minuten % 60;
    return (s < 10 ? '0' : '') + s + ':' + (m < 10 ? '0' : '') + m;
  }

  function stundenText(minuten) {
    const h = minuten / 60;
    if (Math.abs(Math.round(h) - h) < 0.05) {
      const g = Math.round(h);
      return g === 1 ? '1 Stunde' : g + ' Stunden';
    }
    return h.toFixed(1).replace('.', ',') + ' Stunden';
  }

  /* Die aktuelle Minute des SERVERS, fortgeschrieben um die Zeit seit dem
     Eintreffen des Plans. null heisst „gilt nicht fuer heute" — dann gibt es
     auch keinen Strich. */
  function jetztMinute() {
    if (!zustand || zustand.now == null) { return null; }
    const her = planAn ? Math.max(0, (Date.now() - planAn) / 60000) : 0;
    return zustand.now + her;
  }

  /* Der Strich fuer eine Balkenzeile — leer, wenn der gewaehlte Tag nicht heute
     ist oder die Uhr ausserhalb der Wochenspanne steht. Kein Klemmen an den
     Rand: ein Strich, der um 6 Uhr auf dem Schulbeginn klebte, behauptete, der
     Unterricht laufe. */
  /* Labels der Termin-Marker an den Platz anpassen. Muss NACH dem Einfuegen
     laufen: die Breite des Balkens steht erst im Layout fest. Regel
     (Nutzerentscheid): Titel zeigen, wenn Platz ist; kuerzen, wenn es eng wird
     (Ellipsis); unter 32 px ganz weg - der Punkt und das title-Attribut bleiben. */
  /* Mindestbreite einer Schulstunde in Pixeln — Platz fuer das Symbol plus
     etwas Luft. Unterschreitet die kuerzeste Stunde sie, waechst der ganze
     Balken und die Bahn rollt. */
  const MIN_STUECK = 24;

  /* HIER STAND EINE ZWEITE UNTERGRENZE — der Schultag sollte immer sieben
     Zehntel der sichtbaren Breite behalten. Sie ist raus, und zwar an echten
     Daten gemessen: freitags endet die Schule um 10:35, die Achse laeuft
     wegen eines Termins am Donnerstag aber bis 22:15. Um 170 Minuten Schule
     auf 70 Prozent von 394 Pixeln zu bringen, braucht die ganze Achse 1412
     Pixel — das 3,6-Fache der Kachel, und der Freitag war nur noch mit
     mehreren Wischern zu ueberblicken.

     Was bleibt, reicht: MIN_STUECK haelt jede einzelne Stunde lesbar, und
     genau daran haengt jetzt allein, ob die Bahn rollt. Derselbe Freitag
     kommt so auf 464 Pixel. Ein kurzer Schultag nimmt dann eben nur ein
     Fuenftel der Achse ein — das ist keine schlechte Darstellung, sondern
     die Wahrheit ueber den Tag. */

  /**
   * Breite der Balken bestimmen. Rechnet mit der KUERZESTEN Stunde des
   * gewaehlten Tages ueber ALLE Kinder: alle Zeilen brauchen denselben
   * Massstab, sonst laegen dieselben Uhrzeiten in zwei Zeilen an
   * verschiedenen Stellen und der Vergleich waere hin.
   */
  /* Zusatzminuten am rechten Ende der Achse: Platz fuer den Titel des LETZTEN
     Termins. Steht rechts von ihm kein weiterer Termin und keine Stunde, wird
     die Achse so weit verlaengert, dass der Titel vollstaendig daneben passt —
     statt ihn zu kuerzen oder nach links zu klappen. Gemessen statt geraten:
     wie breit ein Titel wirklich ist, weiss erst der gezeichnete Text.

     Gilt immer nur fuer EINEN Tag; wer weiterblaettert, faengt bei null an.
     Die Rundenzaehlung ist die Bremse: jede Verlaengerung zieht ein neues
     Zeichnen nach sich, und ohne Deckel koennte sich das aufschaukeln. In der
     Praxis reicht eine Runde, drei sind grosszuegig. */
  let zusatzMinuten = 0;
  let zusatzTag = null;
  let zusatzRunden = 0;
  const ZUSATZ_RUNDEN = 3;

  /* Die Achse des GEWAEHLTEN Tages, nicht die der Woche.
     zustand.span umspannt die ganze Woche: ein Abendessen am Donnerstag zog
     sie bis 22:15, und am Freitag — Schule bis 10:35, ein Termin bis 15:45 —
     lief die Zeitleiste danach noch sechs Stunden ins Leere. Gebraucht wird
     genau das, was an diesem Tag stattfindet.

     Ueber ALLE Kinder vereinigt: die Zeilen stehen untereinander, dieselbe
     Uhrzeit muss in jeder an derselben Stelle liegen.

     Die Viertelstunde Zugabe an den Raendern ist dieselbe, mit der schon das
     Gateway die Wochenspanne aufzieht — ein Marker genau am Rand haette sonst
     keinen Platz fuer seinen Balken. */
  function tagesSpanne(gewaehlt) {
    let von = Infinity, bis = -Infinity;
    (zustand.children || []).forEach(function (k) {
      const tag = (k.days || []).filter(function (t) { return t.weekday === gewaehlt; })[0];
      ((tag && tag.slots) || []).forEach(function (s) {
        von = Math.min(von, s.from); bis = Math.max(bis, s.to);
      });
      ((tag && tag.events) || []).forEach(function (e) {
        const a = Number(e.at) || 0;
        const b = Number(e.bis) > a ? Number(e.bis) : a + 60;
        von = Math.min(von, a - 15); bis = Math.max(bis, b + 15);
      });
    });
    // Ein Tag ohne alles bekommt gar keinen Balken; die Wochenspanne ist dann
    // nur noch ein Rueckfall, damit nirgends durch null geteilt wird.
    if (!isFinite(von) || bis <= von) { return [zustand.span[0], zustand.span[1]]; }
    if (zusatzTag === gewaehlt) { bis += zusatzMinuten; }
    return [Math.max(0, von), Math.min(1440, bis)];
  }

  function balkenBreite() {
    const bahnen = Array.prototype.slice.call(document.querySelectorAll('.scrollbahn'));
    if (!bahnen.length || !zustand || !zustand.span) { return; }
    const gewaehlt = tagWaehlen();
    const tagSpan = tagesSpanne(gewaehlt);
    const spanne = Math.max(tagSpan[1] - tagSpan[0], 60);
    let kuerzeste = Infinity;
    (zustand.children || []).forEach(function (k) {
      const tag = (k.days || []).filter(function (t) { return t.weekday === gewaehlt; })[0];
      ((tag && tag.slots) || []).forEach(function (s) {
        kuerzeste = Math.min(kuerzeste, Math.max(1, s.to - s.from));
      });
    });
    // Der Massstab haengt allein an der kuerzesten Stunde des Tages und damit
    // NICHT an der Kachelbreite — nur die Frage, ob gerollt wird, tut das.
    const proMinute = isFinite(kuerzeste) ? MIN_STUECK / kuerzeste : 0;
    const noetig = Math.ceil(spanne * proMinute);
    bahnen.forEach(function (bahn) {
      const platz = bahn.clientWidth;
      const breite = noetig > platz ? noetig : 0;
      bahn.querySelectorAll('.balken, .ticks, .zeiten').forEach(function (el) {
        el.style.width = breite ? breite + 'px' : '';
      });
      bahn.classList.toggle('rollt', !!breite);
    });
  }

  /* Alle Zeilen rollen gemeinsam. Getrennt gerollt zeigte Mias Zeile den
     Vormittag und Tims den Nachmittag — nebeneinander gestellte Zeilen, die
     verschiedene Zeiten meinen, sind schlimmer als gar kein Rollen. */
  function scrollGleichziehen() {
    const bahnen = Array.prototype.slice.call(document.querySelectorAll('.scrollbahn'));
    let laeuft = false;
    bahnen.forEach(function (b) {
      // Beim Rollen wandert der Balken unter der Blase weg.
      b.addEventListener('scroll', blaseWeg);
      b.addEventListener('scroll', function () {
        if (laeuft) { return; }
        laeuft = true;
        bahnen.forEach(function (a) { if (a !== b) { a.scrollLeft = b.scrollLeft; } });
        laeuft = false;
      });
    });
  }

  /**
   * Die Uhrzeiten unter der Achse setzen.
   *
   * Zwei Dinge, die erst nach dem Einfuegen zu haben sind: an den Raendern
   * darf die Beschriftung nicht ueber den Balken hinausragen, und zwei
   * Zeiten duerfen nicht uebereinanderliegen. Vorrang haben die STUNDENZEITEN
   * — sie umreissen den Schultag; eine Terminzeit, die sich mit ihnen
   * ueberschneidet, entfaellt (die Zeit steht ohnehin am Marker).
   */
  function zeitenSetzen() {
    document.querySelectorAll('.zeiten').forEach(function (zeile) {
      const alle = Array.prototype.slice.call(zeile.querySelectorAll('.zeit'));
      const breite = zeile.clientWidth;
      if (!alle.length || !breite) { return; }
      const platziert = [];
      const stelle = function (z) {
        z.style.display = '';
        const p = parseFloat(z.style.left) / 100;
        z.style.transform = p < 0.06 ? 'none'
          : (p > 0.94 ? 'translateX(-100%)' : 'translateX(-50%)');
        const w = z.offsetWidth;
        const mitte = p * breite;
        const links = p < 0.06 ? mitte : (p > 0.94 ? mitte - w : mitte - w / 2);
        return [links, links + w];
      };
      // Erst die festen, dann die Termine — die weichen bei Enge.
      alle.filter(function (z) { return z.classList.contains('fest'); })
          .forEach(function (z) { platziert.push(stelle(z)); });
      alle.filter(function (z) { return !z.classList.contains('fest'); })
          .forEach(function (z) {
            const [a, b] = stelle(z);
            const stoert = platziert.some(function (p) { return a < p[1] + 3 && b + 3 > p[0]; });
            if (stoert) { z.style.display = 'none'; } else { platziert.push([a, b]); }
          });
    });
  }

  /* Der freie Weg von x aus, bis das naechste Hindernis kommt. Ueberdeckt ein
     Hindernis die Stelle x selbst, ist der Weg null.
     Hindernisse sind die Schulstunden: ein Termintitel darf sie NIE
     ueberlappen. Vorher galt der ganze Platz links bzw. rechts vom Balken als
     frei, und ein langer Titel legte sich quer ueber den Vormittag — lesbar
     war dann weder das eine noch das andere. */
  function wegRechts(hindernisse, x, ende) {
    let grenze = ende;
    hindernisse.forEach(function (h) {
      if (h.b <= x) { return; }                       // liegt ganz links davon
      grenze = Math.min(grenze, Math.max(h.a, x));    // deckt es x, wird der Weg 0
    });
    return Math.max(grenze - x, 0);
  }
  function wegLinks(hindernisse, x) {
    let grenze = 0;
    hindernisse.forEach(function (h) {
      if (h.a >= x) { return; }
      grenze = Math.max(grenze, Math.min(h.b, x));
    });
    return Math.max(x - grenze, 0);
  }

  /* ── Termintitel bei Beruehrung ──────────────────────────────────────────
     Ein Tipp auf den Balken (oder sein Etikett) zeigt Uhrzeit und Titel. Der
     Text steht schon im title-Attribut des Rahmens — genau den nimmt auch der
     Mauszeiger, es gibt also keine zweite Wahrheit.

     Die Blase verschwindet nach zweieinhalb Sekunden von selbst, ausserdem beim
     naechsten Tipp, beim Rollen und beim Neuzeichnen: eine stehengebliebene
     Blase ueber einem Plan, der sich inzwischen geaendert hat, waere schlimmer
     als gar keine. */
  let blase = null;
  let blaseFrist = null;
  function blaseWeg() {
    clearTimeout(blaseFrist);
    if (blase) { blase.classList.remove('an'); }
  }
  function blaseZeigen(el, text) {
    if (!text) { return; }
    if (!blase) {
      blase = document.createElement('div');
      blase.className = 'terminblase';
      document.body.appendChild(blase);
    }
    blase.textContent = text;
    blase.classList.add('an');
    // Erst nach dem Setzen messen: vorher ist die Breite die des alten Textes.
    const k = el.getBoundingClientRect();
    const b = blase.getBoundingClientRect();
    // Ueber dem Balken, mittig — und innerhalb der Kachel gehalten.
    const links = Math.min(Math.max(4, k.left + k.width / 2 - b.width / 2),
                           document.documentElement.clientWidth - b.width - 4);
    const oben = k.top - b.height - 6;
    blase.style.left = links + 'px';
    blase.style.top = (oben < 4 ? k.bottom + 6 : oben) + 'px';
    clearTimeout(blaseFrist);
    blaseFrist = setTimeout(blaseWeg, 2500);
  }

  function termineBeschriften() {
    // Groesster Fehlbetrag ueber alle Zeilen, als ANTEIL der Balkenbreite —
    // in Minuten umgerechnet wird erst zum Schluss, wenn die Spanne feststeht.
    let fehltAnteil = 0;
    document.querySelectorAll('.balken').forEach(function (balken) {
      const alle = Array.prototype.slice.call(balken.querySelectorAll('.termin'));
      const breite = balken.clientWidth;
      if (!alle.length || !breite) { return; }

      // Aus dem Baum gemessen, nicht aus den Daten gerechnet: die Stunden haben
      // eine Mindestbreite in Pixeln (balkenBreite), ihre Lage steht also nicht
      // im Verhaeltnis zur Zeitspanne allein.
      const stunden = Array.prototype.map.call(
        balken.querySelectorAll('.stueck'),
        function (s) { return { a: s.offsetLeft, b: s.offsetLeft + s.offsetWidth }; });

      /* Erst die Geometrie jedes Termins, dann die Verteilung auf zwei Reihen.
         Getrennt, weil die Reihe vom BALKEN abhaengt und nicht vom Label:
         zwei Termine, die sich zeitlich ueberschneiden, muessen auseinander,
         auch wenn fuer die Titel gar kein Platz mehr ist. */
      const posten = [];
      alle.forEach(function (m) {
        const label = m.querySelector('.termin-titel');
        const lauf  = m.querySelector('.termin-lauf');
        const bar   = m.querySelector('.termin-bar');
        if (!label || !lauf || !bar) { return; }
        m.classList.remove('flip', 'oben', 'unten', 'ueberlappt');
        // Vor dem Messen zuruecksetzen: ein noch laufender Titel wuerde sonst
        // seine alte Weglaenge behalten, wenn die Kachel schmaler geworden ist.
        label.classList.remove('laeuft');
        label.style.removeProperty('--lauf-weg');
        m.style.right = 'auto';
        const anteil  = (parseFloat(m.dataset.p) || 0) / 100;
        const anteil2 = (parseFloat(m.dataset.p2) || 0) / 100;
        m.style.left = (anteil * 100) + '%';
        label.style.display = '';
        label.style.maxWidth = 'none';
        // Der Balken so lang wie der Termin dauert, mindestens 6 px.
        const barBreit = Math.max(Math.round((anteil2 - anteil) * breite), 6);
        bar.style.width = barBreit + 'px';
        const barA = anteil * breite;
        const barB = barA + barBreit;
        /* +1: scrollWidth rundet ab. Bei 85,4 px Text meldet sie 85, und ein
           Deckel von 85 px setzt die Ellipse. */
        const natur = lauf.scrollWidth ? lauf.scrollWidth + 1 : 0;
        posten.push({
          m: m, label: label, anteil: anteil, anteil2: anteil2,
          barA: barA, barB: barB, natur: natur,
        });
      });

      /* Erst wenn ALLE Balken vermessen sind, steht fest, wo ein Titel hin
         darf. Hindernisse sind die Schulstunden UND die uebrigen Terminbalken.

         Die Balken der Nachbarn muessen mitzaehlen, sonst greift sich der
         erste Termin den ganzen Platz bis zum naechsten Balken — und der
         naechste steht dann ohne Beschriftung da, obwohl links von ihm eine
         freie Stunde liegt. Genau so war es am Freitag zu sehen: der
         Klavierunterricht schrieb nach rechts bis an das Schwimmen heran,
         „Test 2" bekam gar nichts mehr. Mit den Nachbarn als Grenze waehlt
         jeder Titel die Seite, auf der er niemandem im Weg steht. */
      const balkenAlle = posten.map(function (p) { return { a: p.barA, b: p.barB }; });
      posten.forEach(function (pos) {
        /* Die SEITE waehlen die Nachbarn mit: sonst greift sich der erste
           Termin den Platz bis zum naechsten Balken, und der naechste steht
           ohne Beschriftung da, obwohl links von ihm eine freie Stunde liegt.
           Genau so war es am Freitag — der Klavierunterricht schrieb nach
           rechts bis ans Schwimmen heran, „Test 2" bekam gar nichts mehr.

           Aber nur die Nachbarn, die sich zeitlich NICHT mit uns ueberschneiden:
           nur die koennen in derselben Reihe landen. Wer sich mit uns
           ueberschneidet, wird von der Reihenvergabe ohnehin nach oben oder
           unten geschoben und liegt dann 12 px entfernt. Zaehlte er hier mit,
           verloere „Abendessen" seine Seite an den Schwimmunterricht, in dem
           es steckt. Der eigene Balken faellt ueber dieselbe Regel heraus. */
        const fremd = stunden.concat(balkenAlle.filter(function (h) {
          return h.b <= pos.barA || h.a >= pos.barB;
        }));
        pos.nachLinks = wegLinks(fremd, pos.barA) > wegRechts(fremd, pos.barB, breite);
        /* Die BREITE dagegen begrenzen nur die Schulstunden. Ein Etikett darf
           ueber den Balken der ANDEREN Reihe hinweglaufen — die liegen 12 px
           auseinander, da stoesst nichts zusammen. Zaehlten die Nachbarn auch
           hier mit, verloere ein Termin, der ganz innerhalb eines anderen
           liegt, seinen Titel: „Hausaufgaben" steckt mitten im
           Schwimmunterricht und haette links wie rechts null Platz. Was in
           DERSELBEN Reihe kollidiert, faengt die Reihenvergabe ab. */
        pos.platzR = Math.floor(wegRechts(stunden, pos.barB, breite) - 4);
        pos.platzL = Math.floor(wegLinks(stunden, pos.barA) - 4);
        const platz = pos.nachLinks ? pos.platzL : pos.platzR;
        pos.w = Math.min(pos.natur, Math.max(platz, 0));
        // Genug Platz? Gemessen am Titel, nicht an einer festen Zahl: ein
        // kurzer Titel braucht kein 32 px breites Fenster.
        pos.passt = platz >= Math.min(pos.natur, 32);
      });

      /* Der letzte Termin des Tages — der mit dem spaetesten Ende. Wurde die
         Achse fuer ihn verlaengert, gehoert sein Titel nach RECHTS: dafuer ist
         der Platz ja entstanden. Ohne diese Zeile klappte er weiter nach links
         (dort ist seit der Verlaengerung immer noch mehr Raum) und der
         gewonnene Platz blieb leer. */
      const letzter = posten.reduce(function (a, b) {
        return (!a || b.barB > a.barB) ? b : a;
      }, null);
      if (letzter && zusatzTag === tagWaehlen() && zusatzMinuten > 0) {
        letzter.nachLinks = false;
        letzter.w = Math.min(letzter.natur, Math.max(letzter.platzR, 0));
        letzter.passt = letzter.platzR >= Math.min(letzter.natur, 32);
      }

      /* ── Reihe und Etikettbreite vergeben ──────────────────────────────
         Zwei Enden je Reihe, und das ist der Kern: `endeBalken` zaehlt nur die
         BALKEN, `ende` auch die Etiketten. Ein Balken ist der Termin selbst,
         ein Etikett nur seine Beschriftung — bei Platznot gewinnt der Balken.
         Mit nur einem Ende landete „Abendessen" in derselben Reihe wie der
         Schwimmunterricht und verschwand unter dessen Balken, weil das lange
         Etikett der anderen Reihe sie rechnerisch belegt hielt. */
      const MIN_TITEL = 32;   // schmaler ist kein Titel mehr, sondern ein Streifen
      const LEER = { ende: -1e9, endeBalken: -1e9, letzter: null };
      const reihen = [Object.assign({}, LEER), Object.assign({}, LEER)];
      // Wie weit ragt ein Posten nach RECHTS? Nur ein Etikett rechts vom
      // Balken verlaengert ihn; eines links liegt vor dem Balken.
      const ragtBis = function (pos) {
        return (pos.mitTitel && !pos.nachLinks) ? pos.barB + 4 + pos.w : pos.barB;
      };

      posten.forEach(function (pos) {
        let r = -1;
        /* a) Eine Reihe, in der Balken UND Etikett Platz haben. Das Fenster
              darf dabei SCHMALER werden als der Titel: seit zu lange Titel
              laufen, ist ein enges Fenster kein Grund mehr, den Titel ganz
              wegzulassen — nur zu eng darf es nicht werden. Genau daran fehlte
              „Abendessen" um 21:00 die Beschriftung: sein Etikett verfehlte
              das von „Hausaufgaben" um fuenf Pixel. */
        if (pos.passt) {
          for (let k = 0; k < 2; k++) {
            if (pos.barA < reihen[k].endeBalken + 4) { continue; }
            const w = pos.nachLinks
              ? Math.min(pos.w, Math.floor(pos.barA - 8 - reihen[k].ende))
              : pos.w;
            if (w < Math.min(pos.natur, MIN_TITEL)) { continue; }
            // Nach rechts beschriftet: unser BALKEN darf nicht unter dem
            // Etikett liegen, das in dieser Reihe schon steht.
            if (!pos.nachLinks && pos.barA < reihen[k].ende + 4) { continue; }
            r = k; pos.mitTitel = true; pos.w = w;
            break;
          }
        }
        // b) Ohne Titel: nur der BALKEN muss frei stehen.
        if (r === -1) {
          for (let k = 0; k < 2; k++) {
            if (pos.barA >= reihen[k].endeBalken + 4) { r = k; pos.mitTitel = false; break; }
          }
        }
        // c) Beide Reihen belegt: die mit dem frueheren Balkenende.
        if (r === -1) {
          r = reihen[0].endeBalken <= reihen[1].endeBalken ? 0 : 1;
          pos.mitTitel = false;
          /* Erst JETZT liegt wirklich Balken auf Balken — es gibt keine Reihe
             mehr, in die dieser Termin ausweichen koennte. Nur dann wird er
             gekennzeichnet: solange das Versetzen reicht, sind die beiden
             ohnehin getrennt zu sehen. */
          pos.ueberlappt = pos.barA < reihen[r].endeBalken - 0.5;
        }

        /* Steht in der gewaehlten Reihe noch ein Etikett im Weg, muss es
           weichen — erst schmaler, dann ganz. Ein verdeckter Balken waere der
           groessere Verlust.

           NICHT aber, wenn dieser Termin ohnehin auf einem anderen liegt: dann
           ist nichts zu retten, sein Balken ueberlappt so oder so (dafuer wird
           er halb durchsichtig gezeichnet), und das Etikett des Nachbarn waere
           umsonst geopfert. Genau daran verlor „Schwimmen" seinen Titel, weil
           ein drittes „Test 2" zur selben Zeit dazukam. */
        const reihe = reihen[r];
        const vor = reihe.letzter;
        if (!pos.ueberlappt && vor && vor.mitTitel && !vor.nachLinks
            && pos.barA < ragtBis(vor) + 4) {
          const rest = Math.floor(pos.barA - 8 - vor.barB);
          if (rest >= Math.min(vor.natur, MIN_TITEL)) { vor.w = rest; }
          else { vor.mitTitel = false; }
        }
        pos.ende = ragtBis(pos);
        reihen[r] = {
          ende: Math.max(reihe.endeBalken, vor ? ragtBis(vor) : -1e9, pos.ende),
          endeBalken: Math.max(reihe.endeBalken, pos.barB),
          letzter: pos
        };
        pos.r = r;
      });

      posten.forEach(function (pos) {
        if (pos.ueberlappt) { pos.m.classList.add('ueberlappt'); }
        if (pos.mitTitel) {
          pos.label.style.maxWidth = pos.w + 'px';
          /* Passt der Titel nicht, laeuft er hin und her statt abgeschnitten
             zu bleiben. Erst ab vier Pixeln Ueberhang — wie im Artikelstreifen:
             fuer zwei Pixel lohnt keine Bewegung. */
          const ueber = pos.natur - pos.w;
          if (ueber > 4) {
            pos.label.style.setProperty('--lauf-weg', '-' + Math.round(ueber) + 'px');
            pos.label.classList.add('laeuft');
          }
        } else {
          pos.label.style.display = 'none';
        }
        /* Geklappt ueber `right` am ENDE des Termins: ein absolut
           positioniertes Element bei left:94 % bekaeme sonst nur die
           restlichen 6 % als Hoechstbreite. Ohne Titel bleibt es bei `left`
           — es gibt nichts, was nach links ragen muesste. */
        if (pos.mitTitel && pos.nachLinks) {
          pos.m.classList.add('flip');
          pos.m.style.left = 'auto';
          pos.m.style.right = (100 - pos.anteil2 * 100) + '%';
        } else {
          pos.m.style.right = 'auto';
          pos.m.style.left = (pos.anteil * 100) + '%';
        }
      });
      /* Versetzt wird erst jetzt und nur, wenn die zweite Reihe gebraucht
         wird — dann aber durchgehend. Ein mittig stehender Termin ragte sonst
         in die untere Zeile hinein. */
      /* Reicht der Platz rechts vom LETZTEN Termin nicht fuer seinen Titel,
         wird die Achse spaeter verlaengert. Nur wenn dort wirklich nichts mehr
         steht — weder ein weiterer Termin noch eine Schulstunde. */
      if (letzter && letzter.natur > 0
          && (!letzter.mitTitel || letzter.natur > letzter.w + 1)) {
        const rechts = breite - letzter.barB;
        const frei = wegRechts(stunden, letzter.barB, breite);
        if (frei >= rechts - 0.5) {                 // keine Stunde im Weg
          const fehlt = letzter.natur + 8 - rechts;
          if (fehlt > 0) { fehltAnteil = Math.max(fehltAnteil, fehlt / breite); }
        }
      }

      if (posten.some(function (p) { return p.r === 1; })) {
        posten.forEach(function (p) { p.m.classList.add(p.r === 1 ? 'unten' : 'oben'); });
      }
    });

    if (fehltAnteil <= 0) { return; }
    const gewaehlt = tagWaehlen();
    if (zusatzTag !== gewaehlt) { zusatzTag = gewaehlt; zusatzMinuten = 0; zusatzRunden = 0; }
    if (zusatzRunden >= ZUSATZ_RUNDEN) { return; }
    const sp = tagesSpanne(gewaehlt);
    const dazu = Math.ceil(fehltAnteil * Math.max(sp[1] - sp[0], 60));
    if (dazu <= 0) { return; }
    zusatzMinuten += dazu;
    zusatzRunden += 1;
    zeichne();   // mit der laengeren Achse; der Titel steht dann rechts
  }

  function jetztStrichHtml(istHeute, von, spanne) {
    const jetzt = jetztMinute();
    if (!istHeute || jetzt === null || jetzt < von || jetzt > von + spanne) { return ''; }
    return '<div class="jetztstrich" title="jetzt ' + esc(uhr(Math.floor(jetzt)))
      + '" style="left:' + ((jetzt - von) / spanne * 100) + '%"></div>';
  }

  /* ── Nach einer Drehung neu messen ───────────────────────────────────────
     balkenBreite() schreibt eine PIXELbreite. Wird die Kachel schmaler —
     Querformat und zurueck ins Hochformat —, stammt die Breite noch vom
     Querformat, und der Balken ragt hinaus. Also neu messen. NICHT neu
     zeichnen: die Prozentlagen stimmen weiter, und ein Neuaufbau verloere die
     Rollposition, den gewaehlten Tag und eine offene Legende.

     Ueber einen ResizeObserver und nicht ueber window.resize: die Kachel liegt
     in einem Rahmen, dessen Groesse die Visualisierung setzt. Im Pruefstand
     kam bei einem von aussen verbreiterten Rahmen kein einziges resize an,
     obwohl innerWidth sich aenderte — window.resize ist hier also kein
     verlaesslicher Melder. Der Beobachter am Inhalt sieht jede Aenderung, egal
     woher sie kommt.

     Nur bei tatsaechlich anderer Breite arbeiten: der Beobachter meldet auch
     Hoehenaenderungen (aufgeklappte Legende), und ohne die Schranke koennte
     sich das Messen selbst wieder anstossen. */
  let messTimer = null;
  let letzteBreite = -1;
  function neuMessen(sofort) {
    clearTimeout(messTimer);
    messTimer = setTimeout(function () {
      const inhalt = document.getElementById('inhalt');
      const breite = inhalt ? inhalt.clientWidth : 0;
      if (!zustand || (!sofort && breite === letzteBreite)) { return; }
      letzteBreite = breite;
      balkenBreite();
      termineBeschriften();
      zeitenSetzen();
    }, 120);
  }
  if (window.ResizeObserver) {
    const beobachter = new ResizeObserver(function () { neuMessen(false); });
    const inhalt = document.getElementById('inhalt');
    if (inhalt) { beobachter.observe(inhalt); }
  }
  // Guerteltier und Hosentraeger: wo der Beobachter fehlt, tut es die Drehung.
  window.addEventListener('orientationchange', function () { neuMessen(true); });

  /* Zwischen zwei Sendungen weiterlaufen. Nur die Position wird gesetzt, nicht
     neu gezeichnet — ein Neuzeichnen schloesse die Legende und risse einen
     gerade gedrueckten Pfeil unter dem Finger weg. */
  function tickerStellen() {
    if (ticker) { clearInterval(ticker); ticker = null; }
    if (!zustand || zustand.mode !== 'timeline' || zustand.now == null) { return; }
    ticker = setInterval(function () {
      const striche = document.querySelectorAll('.jetztstrich');
      const jetzt = jetztMinute();
      if (jetzt === null) { return; }
      const tagSpan = tagesSpanne(tagWaehlen());
      const von = tagSpan[0], spanne = Math.max(tagSpan[1] - von, 60);
      if (jetzt < von || jetzt > von + spanne) {
        // Aus der Spanne gelaufen (Nachmittag): wegnehmen statt am Rand kleben.
        striche.forEach(function (n) { n.remove(); });
        return;
      }
      if (striche.length === 0) { zeichne(); return; }
      striche.forEach(function (n) {
        n.style.left = ((jetzt - von) / spanne * 100) + '%';
        n.title = 'jetzt ' + uhr(Math.floor(jetzt));
      });
    }, 30000);
  }

  function handleMessage(daten) {
    if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
    if (!daten || !Array.isArray(daten.children)) { return; }
    zustand = daten;
    planAn = Date.now();
    if (kindNr >= daten.children.length) { kindNr = 0; }
    zeichne();
    tickerStellen();
  }

  function zeichne() {
    const ziel = document.getElementById('inhalt');
    if (!zustand) { return; }
    if (zustand.empty || zustand.children.length === 0) {
      ziel.innerHTML = '<div class="leer">Noch kein Stundenplan — im Backend Kinder und Stunden anlegen.</div>';
      return;
    }
    /* Im Wochenraster scrollt das RASTER selbst, nicht dieser Bereich — die
       Kennzeichnung steuert, wo der Balken sitzt (siehe #inhalt.istWoche). */
    blaseWeg();
    ziel.classList.toggle('istWoche', zustand.mode !== 'timeline');
    let html = zustand.mode === 'timeline' ? timeline() : woche();
    ziel.innerHTML = html;
    symboleErsetzen();
    // Nach dem Einfuegen: erst jetzt hat der Balken eine Breite. Reihenfolge
    // zaehlt — die Labels werden gegen die ENDGUELTIGE Balkenbreite gemessen.
    balkenBreite();
    termineBeschriften();
    zeitenSetzen();
    scrollGleichziehen();

    document.querySelectorAll('.chip').forEach(function (b) {
      b.addEventListener('click', function () {
        kindNr = parseInt(b.dataset.nr, 10) || 0;
        zeichne();
      });
    });
    /* Die Legende geht ueber IHREN Knopf auf und ueber das Blatt wieder zu.
       Vorher oeffnete jeder Klick auf die Kachel sie — dadurch liess sich die
       Zeitleiste mit der Maus nicht mehr waagerecht ziehen: jeder Zieh-Versuch
       endete als Klick und klappte die Legende auf.

       Nur in der Timeline: im Wochenraster sind die Kinder-Knoepfe anklickbar,
       und ein Klick daneben darf dort nichts anderes tun. */
    if (zustand.mode === 'timeline') {
      ziel.onclick = function (e) {
        // Die Pfeile blaettern und lassen die Legende, wie sie ist — sonst
        // klappte sie bei jedem Tageswechsel zu.
        const pfeil = e.target.closest('[data-tag]');
        if (pfeil) {
          tagBlaettern(pfeil.dataset.tag === 'vor' ? 1 : -1);
          zeichne();
          return;
        }
        /* JEDER Tipp aufs Blatt schliesst — auch auf ein Fach. Die Chips sind
           Beschriftungen, nicht bedienbar; eine Sperre dafuer zwang den Nutzer
           nur aufs ✕. */
        // Ein Tipp auf einen Terminbalken zeigt seinen Titel.
        const termin = e.target.closest('.termin');
        if (termin) {
          blaseZeigen(e.target.closest('.termin-bar, .termin-titel') || termin,
                      termin.getAttribute('title') || '');
          return;
        }
        blaseWeg();
        const zu  = e.target.closest('[data-legende="zu"]');
        const auf = e.target.closest('[data-legende="auf"]');
        if (!zu && !auf) { return; }        // sonst: Finger weg, die Bahn rollt
        legende = !zu;
        zeichne();
      };
    } else {
      ziel.onclick = null;
    }
    // Beim Oeffnen zum heutigen Tag: die Woche faengt sonst am Montag an, und
    // am Donnerstag sieht man zuerst, was vorbei ist.
    const heute = document.querySelector('.spalte.istHeute');
    if (heute && heute.parentElement) {
      // Die Breite der Zeitachse MUSS abgezogen werden: sie steht seit dem
      // Umbau mit im Scrollbereich, Montag beginnt also nicht mehr bei 0.
      // Ohne den Abzug oeffnete das Raster um genau diese Breite verschoben —
      // gemessen 46px, und Montag verschwand halb unter der Achse.
      const achse = heute.parentElement.querySelector('.achse');
      const breit = achse ? achse.getBoundingClientRect().width : 0;
      heute.parentElement.scrollLeft = Math.max(0, heute.offsetLeft - breit - 8);
    }
  }

  /* „Sommerferien bis 05.09." — der NAME, wenn die Quelle einen liefert, sonst
     das allgemeine Wort. Ein Feiertag dauert einen Tag, dort waere ein „bis"
     eine falsche Auskunft. */
  function ferienText(f) {
    const name = String((f && f.name) || '').trim();
    if (f && f.public) {
      return name !== '' ? name : 'Feiertag';
    }
    const wort = name !== '' ? name : 'Schulferien';
    const bis = f && f.until ? datumKurz(f.until) : '';
    return bis !== '' ? wort + ' bis ' + bis : wort;
  }

  function datumKurz(iso) {
    const t = String(iso || '').split('-');
    return t.length === 3 ? t[2] + '.' + t[1] + '.' : iso;
  }

  /* Gesichter links, das Ferienband daneben. Es stand vorher als eigene Zeile
     darueber und nahm dem Plan eine ganze Zeile Hoehe — neben den Gesichtern
     ist der Platz ohnehin frei. Es nimmt die restliche Breite; gibt es nur ein
     Kind (keine Gesichter), die ganze.

     NUR ueber dem Wochenraster: in der Timeline sagt es der Balken selbst — er
     wird grau und traegt den Hinweis in der Mitte. */
  function kinderZeile() {
    const gesichter = kinderLeiste();
    const frei = zustand.holiday
      ? '<div class="ferien">' + symbol('fa-umbrella-beach')
        + '<span>' + esc(zustand.holiday.name) + ' — bis '
        + esc(datumKurz(zustand.holiday.until)) + '</span></div>'
      : '';
    if (!gesichter && !frei) { return ''; }
    return '<div class="kinderzeile">' + gesichter + frei + '</div>';
  }

  function kinderLeiste() {
    if (zustand.children.length < 2) { return ''; }
    return '<div class="kinder">' + zustand.children.map(function (k, i) {
      const an = i === kindNr;
      // Die Farbe des ausgewaehlten Chips kommt aus der AKZENTFARBE der Visu,
      // nicht mehr aus der Farbe des Kindes: sie bezeichnet die Auswahl, und
      // Auswahl sieht in dieser Kachel ueberall gleich aus. Das Kind erkennt
      // man am Gesicht und am Namen daneben, dafuer braucht es keine zweite
      // Farbsprache.
      return '<button class="chip' + (an ? ' an' : '') + '" data-nr="' + i + '">'
        + gesicht(k, 'gesicht') + esc(k.name) + '</button>';
    }).join('') + '</div>';
  }

  /* ── Wochenraster ─────────────────────────────────────────────────────── */
  function woche() {
    const kind = zustand.children[kindNr];
    /* Die Skala reicht nur so weit wie der laengste Unterrichtstag DIESES
       Kindes. zustand.span umspannt die ganze Woche einschliesslich der
       Termine — seit die Timeline Termin-Marker zeigt, zog ein Abendessen um
       21:00 das Raster bis 22:15 auf. Der Nachmittag stand dann leer im Bild
       und drueckte die Stunden zusammen; Termine zeigt das Raster ohnehin
       nicht. */
    let von = Infinity, bis = -Infinity;
    (kind.days || []).forEach(function (tag) {
      (tag.slots || []).forEach(function (s) {
        von = Math.min(von, s.from);
        bis = Math.max(bis, s.to);
      });
    });
    if (!isFinite(von) || bis <= von) { von = zustand.span[0]; bis = zustand.span[1]; }
    const proViertel = 18;
    const hoehe = Math.max(Math.ceil((bis - von) / 15), 1) * proViertel;

    /* Ohne Kopfzeile. Die Ueberschrift „Woche" sagte nichts, was das Raster
       nicht selbst zeigt, und „Als nächstes …" stand doppelt da: die laufende
       oder naechste Stunde ist im Raster ohnehin mit hellem Rand markiert.
       Beides nahm nur Hoehe weg, die dem Plan fehlte. */
    let html = kinderZeile();

    // Zeitachse: volle Stunden mit Beschriftung, dazu die tatsaechliche
    // Anfangszeit — krumme Startzeiten wie 07:45 sieht man sonst nirgends.
    let achse = '';
    const ersteStunde = Math.ceil(von / 60);
    for (let s = ersteStunde; s * 60 <= bis; s++) {
      const y = (s * 60 - von) / 15 * proViertel;
      achse += '<div class="marke" style="top:' + (y - 6) + 'px">' + s + ':00<i></i></div>';
    }
    if (von % 60 !== 0) {
      achse += '<div class="marke stark" style="top:-6px">' + uhr(von) + '<i></i></div>';
    }

    let spalten = '';
    kind.days.forEach(function (tag) {
      spalten += '<div class="spalte' + (tag.today ? ' istHeute' : '') + '">'
        + '<div class="spaltenkopf"><div><div class="tag">' + esc(tag.label) + '</div>'
        + (tag.parity ? '<div class="kw">' + esc(tag.parity) + '</div>' : '')
        + '</div>'
        + (tag.today ? '<span class="heute">Heute</span>' : '')
        + '</div>';
      /* Der Koerper bekommt GENAU die Hoehe der Wochenspanne — dieselbe wie die
         Zeitachse. Vorher ergab sich die Spaltenhoehe aus der Summe der
         einzelnen Stunden, und weil jede fuer sich aufgerundet wird, war der
         Montag ein Viertel hoeher als der Rest. */
      /* Jeder Block sitzt an SEINER Uhrzeit, statt auf dem vorigen zu stehen.
         Gestapelt summierten sich die Aufrundungen der einzelnen Stunden: der
         Montag war 36px hoeher als der Koerper, und weil die Spalte abschneidet,
         verschwand die Betreuung am Tagesende. Nebenbei stehen die Stunden damit
         genau auf ihrer Marke in der Zeitachse. */
      const y = function (m) { return (m - von) / 15 * proViertel; };
      spalten += '<div class="koerper" style="height:' + hoehe + 'px">';
      if (tag.slots.length === 0) {
        spalten += '<div class="frei" style="top:0;height:' + hoehe + 'px">frei</div>';
      } else {
        const luecke = function (a, b) {
          if (b - a < 1) { return ''; }
          return '<div class="frei" style="top:' + y(a) + 'px;height:'
            + (y(b) - y(a)) + 'px">frei</div>';
        };
        let vorher = von;
        tag.slots.forEach(function (s) {
          spalten += luecke(vorher, s.from);
          /* Untergrenze 45 Minuten: eine sehr kurze Stunde waere sonst ein
             Streifen, in dem weder Fach noch Zeit lesbar sind. Der ANFANG stimmt
             trotzdem immer, nur das Ende darf bei Kurzstunden ueberstehen.
             NICHT s.height nehmen — das ist die aufgerundete Hoehe vom Server
             und als Untergrenze holt sie genau die Aufrundung zurueck, die hier
             verschwinden soll (gemessen: 12px zu viel bei der Betreuung). */
          const h = Math.max(y(s.to) - y(s.from), proViertel * 3);
          spalten += '<div class="stunde' + (s.next ? ' jetzt' : '')
            + (s.care ? ' betreuung' : '') + '" style="background:' + esc(s.color)
            + ';top:' + y(s.from) + 'px;height:' + h + 'px">'
            + (s.icon ? '<span class="sym">' + symbol(s.icon) + '</span>' : '')
            + '<div><div class="fach">' + esc(s.name) + '</div>'
            + '<div class="zeit">' + esc(s.start) + ' – ' + esc(s.end) + '</div></div></div>';
          vorher = Math.max(vorher, s.to);
        });
        spalten += luecke(vorher, bis);
      }
      spalten += '</div></div>';
    });

    html += '<div class="raster"><div class="spalten">'
      + '<div class="achse"><div class="innen" style="height:'
      + hoehe + 'px;margin-top:var(--kopfhoehe)">' + achse + '</div></div>'
      + spalten + '</div></div>';
    return html;
  }

  const TAGNAMEN = ['', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

  /* Die Tage, die die Timeline anbietet: die Vereinigung ueber alle Kinder.
     Hat EIN Kind Samstag, gibt es den Samstag — dann steht beim anderen dort
     „keine Schule", was richtig ist und nicht fehlt. */
  function timelineTage() {
    const gesehen = new Set();
    (zustand.children || []).forEach(function (k) {
      (k.days || []).forEach(function (t) { gesehen.add(t.weekday); });
    });
    return Array.from(gesehen).sort(function (a, b) { return a - b; });
  }

  /* Beim ersten Zeichnen auf HEUTE stellen — und wenn heute kein Schultag ist
     (Sonntag, Ferien, abgeschalteter Samstag), auf den ersten angebotenen Tag.
     Danach bleibt die Wahl des Nutzers stehen. */
  function tagWaehlen() {
    const tage = timelineTage();
    if (tage.indexOf(tagNr) >= 0) { return tagNr; }
    let heute = 0;
    (zustand.children || []).forEach(function (k) {
      (k.days || []).forEach(function (t) { if (t.today) { heute = t.weekday; } });
    });
    tagNr = tage.indexOf(heute) >= 0 ? heute : (tage[0] || 1);
    return tagNr;
  }

  function tagwahlHtml() {
    const tage = timelineTage();
    if (tage.length < 2) { return ''; }
    const jetzt = tagWaehlen();
    const heute = (zustand.children || []).some(function (k) {
      return (k.days || []).some(function (t) { return t.today && t.weekday === jetzt; });
    });
    // ALLE Namen stehen im Markup, damit der Kasten so breit ist wie der
    // laengste; sichtbar ist nur einer.
    const namen = tage.map(function (t) {
      return '<span class="' + (t === jetzt ? 'an' : '')
        + (t === jetzt && heute ? ' ist-heute' : '') + '">' + esc(TAGNAMEN[t]) + '</span>';
    }).join('');
    return '<span class="tagwahl">'
      + '<button data-tag="zurueck" aria-label="Vorheriger Tag">‹</button>'
      + '<span class="tagname">' + namen + '</span>'
      + '<button data-tag="vor" aria-label="Nächster Tag">›</button></span>';
  }

  function tagBlaettern(richtung) {
    const tage = timelineTage();
    const i = tage.indexOf(tagWaehlen());
    // Rundlauf: von Freitag weiter landet man wieder bei Montag.
    tagNr = tage[(i + richtung + tage.length) % tage.length];
  }

  /* Die im Balken sichtbaren Faecher, in der Reihenfolge des Tages und
     ohne Wiederholung. Zusammengefasst wird nach NAME: dasselbe Fach bei zwei
     Kindern ist ein Eintrag, und die Gesamtdauer summiert beide. */
  function sichtbareFaecher() {
    const karte = new Map();
    const gewaehlt = tagWaehlen();
    zustand.children.forEach(function (kind) {
      const tag = kind.days.filter(function (t) { return t.weekday === gewaehlt; })[0];
      (tag ? tag.slots : []).forEach(function (s) {
        const da = karte.get(s.name);
        if (da) {
          da.minuten += Math.max(s.to - s.from, 0);
          if (da.wer.indexOf(kind.name) < 0) { da.wer.push(kind.name); }
          return;
        }
        karte.set(s.name, {
          name: s.name, icon: s.icon, color: s.color,
          minuten: Math.max(s.to - s.from, 0), wer: [kind.name], care: !!s.care,
        });
      });
    });
    return Array.from(karte.values());
  }

  function legendeHtml() {
    const faecher = sichtbareFaecher();
    if (faecher.length === 0 || !legende) { return ''; }
    /* Kein Hinweis „Fächer anzeigen" mehr am Fuss: er stand dauerhaft da, um
       eine Geste zu erklaeren, die man ohnehin probiert — und nahm dem Plan
       eine Zeile. Geoeffnet wird sie ueber den Knopf oben links. */
    const mehrereKinder = zustand.children.length > 1;
    const eintraege = faecher.map(function (f) {
      /* KEINE Dauer. Sie stand hier zuerst, war aber die Summe ueber alle
         Kinder: „Deutsch 90 min", obwohl beide je 45 Minuten haben — eine Zahl,
         die man zwangslaeufig falsch liest. Statt dessen, WESSEN Fach es ist.

         Auch wenn es alle haben: bis hierher stand der Name nur bei einem Fach,
         das genau einem Kind gehoert. Fehlte er, musste man raten, ob das Fach
         beiden gehoert oder ob der Name bloss vergessen wurde. Jetzt steht er
         immer, mehrere durch Schraegstrich getrennt („Mia / Tim"). */
      const nur = mehrereKinder
        ? ' <span class="wessen">' + esc(f.wer.join(' / ')) + '</span>' : '';
      return '<span class="fach"><span class="tupfen" style="background:' + esc(f.color) + '">'
        + symbol(f.icon) + '</span>' + esc(f.name) + nur + '</span>';
    }).join('');
    const jetzt = tagWaehlen();
    const istHeute = (zustand.children || []).some(function (k) {
      return (k.days || []).some(function (t) { return t.today && t.weekday === jetzt; });
    });
    const ueberschrift = istHeute ? 'Fächer heute' : 'Fächer am ' + TAGNAMEN[jetzt];
    /* Ueber dem Plan statt darunter: unten angehaengt schob die Legende die
       Balken nach oben aus der Kachel, und bei vielen Faechern sah man beides
       nur halb. Als Blatt verdeckt sie den Plan, solange man sie liest, und
