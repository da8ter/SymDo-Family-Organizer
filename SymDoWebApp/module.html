// ── Aggregationen (Port der Dashboard-Logik aus DashboardScreen.swift) ─────
function allTodoTasks() {
  const tasks = [];
  for (const inst of visibleInstances('todo')) {
    const st = instState(inst.id);
    if (!st) continue;
    for (const item of (Array.isArray(st.items) ? st.items : [])) {
      tasks.push({ item, instanceID: inst.id, listName: inst.name, key: inst.id + '-' + item.id });
    }
  }
  return tasks;
}
function memberFiltered(tasks) {
  if (dashMemberIds.size === 0) return tasks;
  // Aufgaben, die einem der gewählten Mitglieder zugewiesen sind (Vereinigung)
  return tasks.filter(t => Array.isArray(t.item.assignedTo) && t.item.assignedTo.some(id => dashMemberIds.has(id)));
}
function mondayOf(d) {
  const y = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  y.setDate(y.getDate() - ((y.getDay() + 6) % 7));
  return y.getTime();
}
function isThisWeek(ts) {
  if (!ts) return false;
  return mondayOf(new Date(ts * 1000)) === mondayOf(new Date());
}
function openShoppingCount() {
  let n = 0;
  for (const inst of visibleInstances('shopping')) {
    const st = instState(inst.id);
    if (st && Array.isArray(st.items)) n += st.items.filter(i => !i.inCart).length;
  }
  return n;
}
// Offene Artikel der Liste in Kategorie-Reihenfolge, alphabetisch je Kategorie
function openSections(st) {
  const items = (Array.isArray(st.items) ? st.items : []).filter(i => !i.inCart);
  const misc = translate('Miscellaneous');
  const byCat = new Map();
  for (const it of items) {
    const cat = it.category || misc;
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(it);
  }
  const order = Array.isArray(st.categoryOrder) ? st.categoryOrder.slice() : [];
  for (const cat of byCat.keys()) {
    if (!order.includes(cat)) order.push(cat);
  }
  const sections = [];
  for (const cat of order) {
    const list = byCat.get(cat);
    if (!list) continue;
    list.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base' }));
    sections.push({ category: cat, items: list });
  }
  return sections;
}

// Schreibt Markup nur, wenn es sich wirklich geändert hat, und meldet das
// zurück. So überspringt der periodische Refresh / Revisions-Poll das teure
// innerHTML-Neuzeichnen bei unverändertem Inhalt → kein Flackern, kein
// Scroll-Abbruch. Die aufrufende Render-Funktion kehrt bei false früh zurück,
// damit auch keine doppelten Event-Handler gebunden werden.
function renderInto(el, html) {
  if (!el) return false;
  if (el._lastHtml === html) return false;
  el._lastHtml = html;
  el.innerHTML = html;
  return true;
}

// ── Render-Einstieg ────────────────────────────────────────────────────────
function renderAll() {
  if (activeTab === 'dashboard') renderDashboard();
  if (activeTab === 'shopping') renderShopping();
  if (activeTab === 'todos') renderTodos();
  if (activeTab === 'favorites') renderFavorites();
  const active = document.querySelector('.screen.active');
  if (active) applyMemberCollapse(active);
}

// Member-Leiste einklappen, sobald der Screen nicht mehr oben steht: die Avatare
// überlappen (hintere ~1/3 sichtbar). Ein Tipp klappt sie aus (memberUserExpanded),
// das nächste Scroll-Event klappt sie wieder ein. Oben immer ausgeklappt.
let memberUserExpanded = false;
function applyMemberCollapse(scrollEl) {
  if (!scrollEl) return;
  const atTop = scrollEl.scrollTop <= 4;
  if (atTop) memberUserExpanded = false;
  const collapsed = !atTop && !memberUserExpanded;
  scrollEl.querySelectorAll('.member-bar').forEach(mb => mb.classList.toggle('collapsed', collapsed));
}
function setupMemberCollapse() {
  document.querySelectorAll('.screen').forEach(sc => {
    sc.addEventListener('scroll', () => { memberUserExpanded = false; applyMemberCollapse(sc); }, { passive: true });
  });
  // Erster Tipp auf die eingeklappte Leiste klappt sie aus (statt Member zu wählen).
  // Auf Maus-Geräten ist sie beim Klick schon per :hover offen → Klick wählt direkt.
  const canHover = !!(window.matchMedia && window.matchMedia('(hover: hover)').matches);
  document.addEventListener('click', (e) => {
    const bar = (e.target && e.target.closest) ? e.target.closest('.member-bar.collapsed') : null;
    if (!bar) return;
    memberUserExpanded = true;
    bar.classList.remove('collapsed');
    if (canHover && bar.matches(':hover')) return; // Maus: durchlassen → Member wird gewählt
    e.stopPropagation();
    e.preventDefault();
  }, true);
}

// ── Übersicht (Dashboard) ──────────────────────────────────────────────────
function renderDashboard() {
  const el = document.getElementById('dashboardContent');
  const open = allTodoTasks().filter(t => !t.item.done);
  const memberTasks = memberFiltered(open);
  const prio = dashPriority;
  const filteredOpen = prio
    ? memberTasks.filter(t => String(t.item.priority || 'normal') === prio)
    : memberTasks;
  const overdue = [];
  const today = [];
  for (const t of filteredOpen) {
    const cls = classifyDue(t.item);
    if (cls === 'overdue') overdue.push(t);
    else if (cls === 'today') today.push(t);
  }
  const dueSort = (a, b) => ((parseInt(a.item.due) || Infinity) - (parseInt(b.item.due) || Infinity));
  overdue.sort(dueSort);
  today.sort(dueSort);
  const dueNow = overdue.concat(today);
  const todayRows = dueNow.slice(0, 6);
  const todayKeys = new Set(todayRows.map(t => t.key));
  const myUpcoming = filteredOpen.filter(t => !todayKeys.has(t.key)).sort(dueSort);
  const overdueCount = memberFiltered(open).filter(t => classifyDue(t.item) === 'overdue').length;
  const todayCount = memberFiltered(open).filter(t => classifyDue(t.item) === 'today').length;

  const doneTasks = allTodoTasks().filter(t => t.item.done && isThisWeek(parseInt(t.item.updatedAt) || 0));
  const completedThisWeek = memberFiltered(doneTasks).length;

  const multiTodo = visibleInstances('todo').length > 1;
  const byId = usersById();
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

  let html = '';
  // Avatar-Menü zuerst: nur dieses ist sticky (oben rechts). Das Datum folgt
  // und scrollt normal (wird per CSS auf dieselbe Zeile gezogen).
  if (store.users.length > 0) {
    html += `<div class="member-bar${dashMemberIds.size ? ' has-selection' : ''}">`;
    for (const u of store.users) {
      html += `<button class="avatar-btn${dashMemberIds.has(u.id) ? ' selected' : ''}" data-member="${escapeHtml(u.id)}">` +
        avatarHtml(u, '') + '</button>';
    }
    html += '</div>';
  }
  html += `<div class="dash-date">${escapeHtml(dateStr)}</div>`;

  // KPI-Kacheln
  const kpiTint = (c) => `background: linear-gradient(135deg, ${c}, color-mix(in srgb, ${c} 72%, #000));`;
  const zeroOverdue = overdueCount === 0;
  html += '<div class="kpi-grid">';
  html += `<button class="kpi" data-goto="todos" style="${kpiTint('var(--accent)')}">` +
    `<span class="kpi-label">${translate('Open tasks')}</span><span class="kpi-value">${memberTasks.length}</span>` +
    `<i class="fa-light fa-list-check kpi-glyph"></i></button>`;
  html += `<button class="kpi" data-goto="todos" style="${kpiTint('#ff9500')}">` +
    `<span class="kpi-label">${translate('Due today')}</span><span class="kpi-value">${todayCount}</span>` +
    `<i class="fa-light fa-calendar kpi-glyph"></i></button>`;
  html += `<button class="kpi" data-goto="todos" style="${kpiTint(zeroOverdue ? '#8e8e93' : '#ff4d4d')}">` +
    `<span class="kpi-label">${translate('Overdue')}</span><span class="kpi-value">${overdueCount}</span>` +
    `<i class="fa-light ${zeroOverdue ? 'fa-check' : 'fa-triangle-exclamation'} kpi-glyph"></i></button>`;
  html += `<button class="kpi" data-goto="shopping" style="${kpiTint('#34c759')}">` +
    `<span class="kpi-label">${translate('Items on the list')}</span><span class="kpi-value">${openShoppingCount()}</span>` +
    `<i class="fa-light fa-basket-shopping kpi-glyph"></i></button>`;
  html += '</div>';

  // Wochenring
  const total = completedThisWeek + memberTasks.length;
  const frac = total > 0 ? completedThisWeek / total : 0;
  const C = 2 * Math.PI * 30;
  html += '<div class="card week-card">' +
    `<div class="week-ring"><svg width="76" height="76" viewBox="0 0 76 76">` +
    `<circle class="ring-track" cx="38" cy="38" r="30" fill="none" stroke-width="7"/>` +
    `<circle class="ring-value" cx="38" cy="38" r="30" fill="none" stroke-width="7" stroke-linecap="round" ` +
    `stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - frac)).toFixed(1)}" transform="rotate(-90 38 38)"/>` +
    `<text x="38" y="45" text-anchor="middle">${completedThisWeek}</text></svg></div>` +
    `<div class="week-info"><h3>${translate('Done this week')}</h3>` +
    `<p>${translate('%1 of %2 tasks done').replace('%1', String(completedThisWeek)).replace('%2', String(total))}</p></div></div>`;

  // Prioritäts-Filter
  const prios = [['', translate('All')], ['high', translate('High')], ['normal', translate('Normal')], ['low', translate('Low')]];
  html += '<div class="segmented" id="dashPrio">';
  for (const [val, label] of prios) {
    html += `<button data-prio="${val}" class="${val === prio ? 'active' : ''}">${label}</button>`;
  }
  html += '</div>';

  // Heute-Karte
  html += `<div class="card"><div class="card-head"><h3>${translate('Today')}</h3>` +
    `<button class="link" data-goto="todos">${translate('Show all')}</button></div>`;
  if (todayRows.length === 0) {
    const msg = (overdueCount + todayCount === 0)
      ? translate('Nothing due — all under control.')
      : translate('No matches for this filter.');
    html += `<div class="empty-row"><i class="fa-light fa-badge-check"></i>${escapeHtml(msg)}</div>`;
  } else {
    for (const t of todayRows) html += taskRowHtml(t, multiTodo);
  }
  html += '</div>';

  // Meine Aufgaben / Aufgaben von X
  if (myUpcoming.length > 0) {
    let title = translate('Tasks');
    // Wie mySectionTitle in der App: nur bei GENAU EINEM gewählten Mitglied ein
    // personalisierter Titel; bei 0 oder mehreren das generische „Aufgaben".
    if (dashMemberIds.size === 1) {
      const only = [...dashMemberIds][0];
      if (only === currentUserID()) title = translate('My tasks');
      else title = translate('Tasks of %1').replace('%1', byId[only] ? byId[only].name : '…');
    }
    html += `<div class="card"><div class="card-head"><h3>${escapeHtml(title)}</h3></div>`;
    for (const t of myUpcoming.slice(0, 5)) html += taskRowHtml(t, multiTodo);
    const remaining = myUpcoming.length - 5;
    if (remaining > 0) {
      const moreLabel = remaining === 1
        ? translate('1 more task')
        : translate('%1 more tasks').replace('%1', String(remaining));
      html += `<button class="more-row" data-goto="todos"><span>${escapeHtml(moreLabel)}</span><i class="fa-light fa-chevron-right"></i></button>`;
    }
    html += '</div>';
  }

  // Einkaufsvorschau — wie in der App nur, wenn es eine sichtbare Einkaufsliste
  // gibt (kein Platzhalter-Card, wenn keine existiert/alle ausgeblendet sind)
  const shopId = selectedShoppingID();
  const shopState = shopId ? instState(shopId) : null;
  if (shopState) {
    html += `<div class="card"><div class="card-head"><h3>${translate('Shopping list')}</h3>` +
      `<button class="link" data-goto="shopping">${translate('Open')}</button></div>`;
    const openItems = openSections(shopState).flatMap(s => s.items);
    if (openItems.length === 0) {
      html += `<div class="empty-row"><i class="fa-light fa-basket-shopping"></i>${translate('The list is empty.')}</div>`;
    } else {
      html += '<div class="shop-strip">';
      for (const it of openItems) {
        const img = resolveItemImage(it);
        const tint = categoryStyle(it.category).tint;
        html += `<div class="strip-item"><button class="strip-thumb" data-check="${escapeHtml(String(it.id))}" ` +
          `style="background:${img ? 'var(--surface2)' : tint}">` +
          (img ? `<img src="${img}" alt="" loading="lazy" />`
               : escapeHtml(String(it.name || '?').charAt(0).toUpperCase())) +
          `</button><div class="strip-name"><span class="marquee-inner">${escapeHtml(it.name)}</span></div></div>`;
      }
      html += '</div>';
    }
    let actions = `<button data-preview-add="1"><i class="fa-light fa-plus"></i> ${translate('Add item')}</button>`;
    if (shopState.scannerEnabled !== false) {
      actions += `<button data-preview-scan="1"><i class="fa-light fa-barcode"></i> ${translate('Scan barcode')}</button>`;
    }
    html += `<div class="preview-actions">${actions}</div>`;
    html += '</div>';
  }

  if (!renderInto(el, html)) return;

  // Interaktionen
  el.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.goto)));
  el.querySelectorAll('[data-member]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = b.dataset.member;
    if (dashMemberIds.has(id)) dashMemberIds.delete(id);
    else dashMemberIds.add(id);
    renderDashboard();
  }));
  el.querySelectorAll('#dashPrio [data-prio]').forEach(b => b.addEventListener('click', () => {
    dashPriority = b.dataset.prio;
    localStorage.setItem('symdo.dashboardPriority', dashPriority);
    renderDashboard();
  }));
  el.querySelectorAll('[data-check]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    sdCall(shopId, 'ToggleCart', { id: b.dataset.check, inCart: true });
  }));
  const previewAdd = el.querySelector('[data-preview-add]');
  if (previewAdd) previewAdd.addEventListener('click', () => {
    setTab('shopping');
    setTimeout(() => document.getElementById('shoppingInput').focus(), 50);
  });
  const previewScan = el.querySelector('[data-preview-scan]');
  if (previewScan) previewScan.addEventListener('click', () => {
    setTab('shopping');
    setTimeout(() => { if (typeof openScannerOverlay === 'function') openScannerOverlay(); }, 60);
  });
  el.querySelectorAll('.task-row').forEach(row => {
    const instanceID = parseInt(row.dataset.inst);
    const itemID = parseInt(row.dataset.item);
    const chk = row.querySelector('.chk');
    chk.addEventListener('click', (e) => e.stopPropagation());
    chk.addEventListener('change', () => sdCall(instanceID, 'ToggleDone', { id: itemID, done: chk.checked }));
    row.addEventListener('click', () => {
      const st = instState(instanceID);
      const item = st && st.items.find(i => i.id === itemID);
      if (item) openTodoEditor(instanceID, item);
    });
  });
  applyMarquees(el);
}

function taskRowHtml(t, showListName) {
  const segs = dueSubtitleSegments(t.item, t.listName, showListName)
    .map(s => `<span class="${s.cls}">${escapeHtml(s.text)}</span>`).join('');
  return `<div class="task-row" data-inst="${t.instanceID}" data-item="${t.item.id}">` +
    `<input type="checkbox" class="chk" aria-label="${translate('Done')}" />` +
    `<div class="task-main"><div class="task-title">${escapeHtml(t.item.title)}</div>` +
    (segs ? `<div class="task-sub">${segs}</div>` : '') +
    '</div>' + renderAvatarStack(t.item.assignedTo) + '</div>';
}

// ── Einkaufen ──────────────────────────────────────────────────────────────
function renderShopping() {
  syncCompat();
  const vis = visibleInstances('shopping');
  const id = selectedShoppingID();
  const st = id ? instState(id) : null;
  updateSwitcher('shoppingSwitcher', 'shoppingTitle', vis, id, 'symdo.selectedShoppingID');

  const area = document.getElementById('shoppingListArea');
  const scannerBtn = document.getElementById('btnOpenScanner');
  scannerBtn.style.display = (st && st.scannerEnabled !== false) ? '' : 'none';

  if (!st) {
    renderInto(area, `<div class="empty-state"><i class="fa-light fa-basket-shopping"></i>${translate('No shopping list found')}</div>`);
    return;
  }
  const sections = openSections(st);
  const cart = (Array.isArray(st.items) ? st.items : []).filter(i => i.inCart);
  const favLists = Array.isArray(st.favoriteLists) ? st.favoriteLists : [];
  const favNames = new Set();
  for (const fl of favLists) {
    for (const fi of (fl.items || [])) favNames.add(String(fi.name || '').trim().toLowerCase());
  }

  let html = '';
  if (sections.length === 0 && cart.length === 0) {
    html += `<div class="empty-state"><i class="fa-light fa-basket-shopping"></i>${translate('The list is empty.')}</div>`;
  }
  for (const sec of sections) {
    const style = categoryStyle(sec.category);
    html += `<div class="cat-header" style="color:${style.tint}"><i class="fa-light ${style.icon}"></i>${escapeHtml(sec.category)}</div>`;
    for (const it of sec.items) html += shoppingRowHtml(it, favNames, st, false);
  }
  // Wie cartExpanded (@State) in der App: nur In-Memory, startet eingeklappt
  const collapsed = !cartExpanded;
  if (cart.length > 0) {
    html += `<button class="section-toggle${collapsed ? '' : ' open'}" id="cartToggle">` +
      `<i class="fa-light fa-cart-shopping"></i>${translate('Recently used')}` +
      `<span class="count">${cart.length}</span><i class="fa-light fa-chevron-right chev"></i></button>`;
    if (!collapsed) {
      for (const it of cart) html += shoppingRowHtml(it, favNames, st, true);
    }
  }
  if (!renderInto(area, html)) return;

  const cartToggle = document.getElementById('cartToggle');
  if (cartToggle) cartToggle.addEventListener('click', () => {
    cartExpanded = !cartExpanded;
    renderShopping();
  });

  area.querySelectorAll('.item-card').forEach(card => {
    const itemId = card.dataset.id;
    const inCart = card.classList.contains('in-cart');
    bindCardSwipe(card, '.item-card-content', () => sdCall(id, 'DeleteItem', itemId), () => {
      const item = (st.items || []).find(i => String(i.id) === itemId);
      if (item) openItemEditor(id, item);
    });
    card.querySelector('.item-card-content').addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button')) return;
      sdCall(id, 'ToggleCart', { id: itemId, inCart: !inCart });
    });
    const editBtn = card.querySelector('[data-edit]');
    if (editBtn) editBtn.addEventListener('click', () => {
      const item = (st.items || []).find(i => String(i.id) === itemId);
      if (item) openItemEditor(id, item);
    });
    const heartBtn = card.querySelector('[data-heart]');
    if (heartBtn) heartBtn.addEventListener('click', () => {
      const item = (st.items || []).find(i => String(i.id) === itemId);
      if (item) openFavPicker(id, item);
    });
    card.querySelectorAll('[data-step]').forEach(btn => btn.addEventListener('click', () => {
      const item = (st.items || []).find(i => String(i.id) === itemId);
      if (!item) return;
      const next = Math.max(1, (parseInt(item.amount) || 1) + parseInt(btn.dataset.step));
      sdCall(id, 'UpdateItem', { id: item.id, name: item.name, amount: String(next), notes: item.notes || '', category: item.category || '' });
    }));
  });

  renderSuggestions();
}

// Ausgefülltes Herz als Inline-SVG (das fa-solid-Icon ist im Icon-Kit nicht
// enthalten und rendert sonst als leerer Kasten). Füllt sich über currentColor.
const HEART_SOLID_SVG = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
function shoppingRowHtml(it, favNames, st, inCart) {
  const img = resolveItemImage(it);
  const tint = categoryStyle(it.category).tint;
  // Wie ItemRow.numericAmount in der App: leer = 1 (Stepper), führende Nullen
  // sind KEINE Zahl (Badge). '' → Stepper mit '1'
  const amountRaw = String(it.amount || '').trim();
  const numeric = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
  const amount = amountRaw === '' ? '1' : amountRaw;
  const faved = favNames.has(String(it.name || '').trim().toLowerCase());
  let side = '';
  side += `<button class="heart-btn${faved ? ' faved' : ''}" data-heart="1" aria-label="Favorit">${faved ? HEART_SOLID_SVG : '<i class="fa-light fa-heart"></i>'}</button>`;
  if (it.price && st.extApiShowPrice !== false) {
    side += `<span class="item-price">${escapeHtml(it.price)}</span>`;
  }
  if (!inCart && numeric) {
    // Runter-Pfeil bei Menge=1 nur unsichtbar (Platz bleibt reserviert), damit
    // das Badge seine vertikale Position behält und nicht springt.
    const canDec = parseInt(amount) > 1;
    side += `<span class="stepper"><button data-step="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>` +
      `<span class="amount-badge">${escapeHtml(amount)}</span>` +
      `<button data-step="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button>` +
      '</span>';
  } else {
    side += `<span class="amount-badge">${escapeHtml(amount || '1')}</span>`;
  }
  side += `<button class="heart-btn" data-edit="1" aria-label="${translate('Edit')}"><i class="fa-light fa-pen"></i></button>`;
  return `<div class="item-card${inCart ? ' in-cart' : ''}" data-id="${escapeHtml(String(it.id))}">` +
    `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
    `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` +
    `<div class="item-card-content">` +
    `<span class="item-thumb" style="background:${img ? 'transparent' : tint}">` +
    (img ? `<img src="${img}" alt="" loading="lazy" />` : escapeHtml(String(it.name || '?').charAt(0).toUpperCase())) +
    `</span><span class="item-main"><span class="item-name">${escapeHtml(it.name)}</span>` +
    (it.notes ? `<span class="item-notes">${escapeHtml(it.notes)}</span>` : '') +
    `</span><span class="item-side">${side}</span></div></div>`;
}

function renderSuggestions() {
  const id = selectedShoppingID();
  const st = id ? instState(id) : null;
  const input = document.getElementById('shoppingInput');
  const panel = document.getElementById('suggestions');
  const chips = document.getElementById('suggestionChips');
  if (!st || document.activeElement !== input) {
    panel.classList.remove('open');
    return;
  }
  const query = input.value.trim().toLowerCase();
  const openNames = new Set((st.items || []).filter(i => !i.inCart).map(i => String(i.name).toLowerCase()));
  const list = (Array.isArray(st.suggestions) ? st.suggestions : [])
    .filter(s => !openNames.has(String(s.name).toLowerCase()))
    .filter(s => !query || String(s.name).toLowerCase().includes(query))
    .sort((a, b) => (b.frequency || 0) - (a.frequency || 0) || String(a.name).localeCompare(String(b.name)))
    .slice(0, 30);
  if (list.length === 0) {
    panel.classList.remove('open');
    return;
  }
  chips.innerHTML = list.map(s =>
    `<button class="chip" data-name="${escapeHtml(s.name)}" data-cat="${escapeHtml(s.category || '')}">${escapeHtml(s.name)}</button>`
  ).join('');
  chips.querySelectorAll('.chip').forEach(chip => {
    // pointerdown vor dem blur des Inputs, sonst schließt das Panel vor dem Klick
    chip.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sdCall(id, 'AddItem', { name: chip.dataset.name, category: chip.dataset.cat, amount: '1' });
      input.value = '';
    });
  });
  panel.classList.add('open');
}

// Listen-Umschalter (gemeinsam für Einkaufen/ToDos)
function updateSwitcher(selectId, titleId, vis, currentId, storageKey) {
  const select = document.getElementById(selectId);
  const title = document.getElementById(titleId);
  if (vis.length > 1) {
    select.style.display = '';
    title.style.display = 'none';
    select.innerHTML = vis.map(i =>
      `<option value="${i.id}"${i.id === currentId ? ' selected' : ''}>${escapeHtml(i.name)}</option>`
    ).join('');
    select.onchange = () => {
      localStorage.setItem(storageKey, select.value);
      syncCompat();
      renderAll();
    };
  } else {
    select.style.display = 'none';
    title.style.display = '';
    title.textContent = vis.length ? vis[0].name : '';
  }
}

// ── ToDos ──────────────────────────────────────────────────────────────────
// Sortierung 1:1 aus dem ToDoList-Modul übernommen (inkl. title/desc-Quirk)
function sortTodoItems(items, sortMode, sortDir) {
  const list = Array.isArray(items) ? items.slice() : [];
  if (sortMode === 'manual') return list;
  const compareDue = (a, b) => {
    const da = parseInt(a.due) || 0;
    const db = parseInt(b.due) || 0;
    if (da <= 0 && db <= 0) return 0;
    if (da <= 0) return 1;
    if (db <= 0) return -1;
    return sortDir === 'asc' ? (da - db) : (db - da);
  };
  const prioRankLowFirst = (p) => {
    const v = String(p ?? 'normal');
    if (v === 'low') return 0;
    if (v === 'normal') return 1;
    return 2;
  };
  list.sort((a, b) => {
    if (sortMode === 'due') {
      const c = compareDue(a, b);
      if (c !== 0) return c;
      return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
    }
    if (sortMode === 'priority') {
      const pa = prioRankLowFirst(a.priority);
      const pb = prioRankLowFirst(b.priority);
      if (pa !== pb) return sortDir === 'asc' ? (pa - pb) : (pb - pa);
      const c = compareDue(a, b);
      if (c !== 0) return c;
      return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
    }
    if (sortMode === 'title') {
      const c = String(a.title ?? '').localeCompare(String(b.title ?? ''), undefined, { sensitivity: 'base' });
      if (c !== 0) return c;
      return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
    }
    const ca = parseInt(a.createdAt) || 0;
    const cb = parseInt(b.createdAt) || 0;
    if (ca !== cb) return sortDir === 'asc' ? (ca - cb) : (cb - ca);
    return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
  });
  if (sortMode === 'title' && sortDir === 'desc') list.reverse();
  return list;
}

// Füllt die eigenständige sticky Avatar-Pille des ToDo-Tabs (#todoMembers).
function renderTodoMembers() {
  const el = document.getElementById('todoMembers');
  if (!el) return;
  if (store.users.length === 0) { el.style.display = 'none'; renderInto(el, ''); return; }
  el.style.display = '';
  el.classList.toggle('has-selection', todoMemberIds.size > 0);
  const membersHtml = store.users.map(u =>
    `<button class="avatar-btn${todoMemberIds.has(u.id) ? ' selected' : ''}" data-member="${escapeHtml(u.id)}">` +
    avatarHtml(u, '') + '</button>'
  ).join('');
  if (!renderInto(el, membersHtml)) return;
  el.querySelectorAll('[data-member]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const mid = b.dataset.member;
    if (todoMemberIds.has(mid)) todoMemberIds.delete(mid);
    else todoMemberIds.add(mid);
    renderTodos();
  }));
}

function renderTodos() {
  const vis = visibleInstances('todo');
  const id = selectedTodoID();
  const st = id ? instState(id) : null;
  updateSwitcher('todoSwitcher', 'todoTitle', vis, id, 'symdo.selectedTodoID');

  const area = document.getElementById('todoListArea');
  if (!st) {
    renderInto(area, `<div class="empty-state"><i class="fa-light fa-list-check"></i>${translate('No ToDo list found')}</div>`);
    return;
  }
  const sortMode = String(st.sortMode || 'created');
  const sortDir = String(st.sortDir || 'asc');
  // Prio-Chip nur, wenn die Liste Info-Badges zeigt (wie in der ToDoList-Kachel)
  const showBadges = st.showInfoBadges === true;
  // Member-Filter (Vereinigung): nur Aufgaben mit mindestens einem gewählten Mitglied
  let items = st.items || [];
  if (todoMemberIds.size > 0) {
    items = items.filter(it => Array.isArray(it.assignedTo) && it.assignedTo.some(mid => todoMemberIds.has(mid)));
  }
  const sorted = sortTodoItems(items, sortMode, sortDir);
  const open = sorted.filter(i => !i.done);
  const done = sorted.filter(i => i.done);
  // Bei aktivem Filter kein Drag-Reorder — sonst würde ein Reorder der
  // gefilterten Teilmenge die Gesamtreihenfolge verfälschen.
  const canReorder = sortMode === 'manual' && todoMemberIds.size === 0;

  // Member-Menü: eigenständige sticky Pille ganz oben (vor dem Header), wie im
  // Dashboard. Wird in den statischen #todoMembers-Container gerendert, damit
  // sein sticky-Bezug .content (die volle Höhe) ist und es dauerhaft pinnt.
  renderTodoMembers();

  let html = '';
  if (open.length === 0 && done.length === 0) {
    const msg = todoMemberIds.size > 0 ? translate('No matches for this filter.') : translate('No tasks');
    html += `<div class="empty-state"><i class="fa-light fa-list-check"></i>${msg}</div>`;
  }
  for (const it of open) html += todoRowHtml(it, canReorder, showBadges);
  if (done.length > 0 && st.hideCompletedTasks !== true) {
    html += `<button class="section-toggle${completedExpanded ? ' open' : ''}" id="doneToggle">` +
      `<i class="fa-light fa-circle-check"></i>${translate('Completed')}` +
      `<span class="count">${done.length}</span><i class="fa-light fa-chevron-right chev"></i></button>`;
    if (completedExpanded) {
      for (const it of done) html += todoRowHtml(it, false, showBadges);
    }
  }
  if (!renderInto(area, html)) return;

  const doneToggle = document.getElementById('doneToggle');
  if (doneToggle) doneToggle.addEventListener('click', () => {
    completedExpanded = !completedExpanded;
    localStorage.setItem('symdo.completedExpanded', completedExpanded ? '1' : '0');
    renderTodos();
  });

  area.querySelectorAll('.todo-card').forEach(card => {
    const itemId = parseInt(card.dataset.id);
    const item = (st.items || []).find(i => i.id === itemId);
    if (!item) return;
    bindTodoGesture(card, id, area, open, done, canReorder,
      () => sdCall(id, 'DeleteItem', { id: itemId }),
      () => openTodoEditor(id, item));
    const chk = card.querySelector('.chk');
    chk.addEventListener('click', (e) => e.stopPropagation());
    chk.addEventListener('change', () => sdCall(id, 'ToggleDone', { id: itemId, done: chk.checked }));
    card.querySelector('.todo-content').addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button, .chk')) return;
      openTodoEditor(id, item);
    });
  });

  ensureTodoMetaObserver();
  requestAnimationFrame(layoutTodoMeta);
}

// Chip-/Button-Zeile einer Aufgabe: belegt sie mehr als die Hälfte der
// Task-Breite, rutscht sie als eigene Zeile unter den restlichen Inhalt.
let todoMetaRO = null;
let todoMetaLastW = -1;
function layoutTodoMeta() {
  const area = document.getElementById('todoListArea');
  if (!area) return;
  todoMetaLastW = area.clientWidth;
  const cards = area.querySelectorAll('.todo-card');
  // Erst überall zurücksetzen, damit die natürliche (nicht gestapelte)
  // Chip-Breite gemessen wird, dann pro Zeile entscheiden.
  cards.forEach(card => { const c = card.querySelector('.todo-content'); if (c) c.classList.remove('stacked'); });
  cards.forEach(card => {
    const c = card.querySelector('.todo-content');
    const m = card.querySelector('.todo-side') || card.querySelector('.todo-meta');
    if (!c || !m) return;
    if (m.offsetWidth > c.clientWidth / 2) c.classList.add('stacked');
  });
}
function ensureTodoMetaObserver() {
  if (todoMetaRO || typeof ResizeObserver === 'undefined') return;
  const area = document.getElementById('todoListArea');
  if (!area) return;
  // Auf Breitenänderung reagieren (Kachel-Resize, Sichtbarwerden beim Tab-
  // Wechsel). Höhenänderungen durchs Stapeln selbst ignorieren → keine Schleife.
  todoMetaRO = new ResizeObserver(() => {
    const a = document.getElementById('todoListArea');
    if (!a || a.clientWidth === todoMetaLastW) return;
    layoutTodoMeta();
  });
  todoMetaRO.observe(area);
}

function todoRowHtml(it, draggable, showBadges) {
  const chip = formatDueChip(it);
  const qty = parseInt(it.quantity) || 0;
  const recurs = it.recurrence && it.recurrence !== 'none';
  // Fälligkeits-Zustand wie in der ToDoList-Kachel: überfällig rot, heute orange,
  // sonst neutral. Erledigte Aufgaben bleiben neutral (nicht rot/orange).
  const dueState = it.done ? '' : classifyDue(it);
  const dueBadgeClass = dueState === 'overdue' ? 'due-overdue' : (dueState === 'today' ? 'due-today' : '');
  return `<div class="todo-card${it.done ? ' done-row' : ''}" data-id="${it.id}">` +
    `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
    `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` +
    `<div class="todo-content">` +
    `<input type="checkbox" class="chk"${it.done ? ' checked' : ''} aria-label="${translate('Done')}" />` +
    `<span class="todo-main"><span class="todo-title">${escapeHtml(it.title)}</span>` +
    (it.info ? `<span class="todo-info">${escapeHtml(it.info)}</span>` : '') +
    `</span><span class="todo-side"><span class="todo-meta">` +
    renderAvatarStack(it.assignedTo) +
    (qty > 1 ? `<span class="badge quantity">${qty}×</span>` : '') +
    (recurs ? `<span class="badge attr" title="${escapeHtml(recurrenceLabel(it.recurrence, it.recurrenceCustomUnit, it.recurrenceCustomValue))}"><i class="fa-light fa-repeat"></i></span>` : '') +
    (it.notification === true ? `<span class="badge attr" title="${escapeHtml(translate('Notification'))}"><i class="fa-light fa-bell"></i></span>` : '') +
    (chip ? `<span class="badge due-badge ${dueBadgeClass}" title="${escapeHtml(chip)}"><i class="fa-light fa-calendar due-icon"></i><span class="due-text">${escapeHtml(chip)}</span></span>` : '') +
    (showBadges ? `<span class="badge ${priorityKey(it.priority)}">${escapeHtml(priorityLabel(it.priority))}</span>` : '') +
    `</span>` +
    (draggable ? `<span class="todo-handle" aria-label="${translate('Reorder')}" title="${translate('Reorder')}"><i class="fa-light fa-grip-dots-vertical"></i></span>` : '') +
    `</span></div></div>`;
}

// Drag-Reorder nur im manuellen Modus: offene zuerst (neue Reihenfolge),
// erledigte hinten angehängt — wie in App und ToDoList-Kachel
let dndDragId = null;
function bindTodoDnd(area, instanceID, open, done, enabled) {
  if (!enabled) return;
  area.querySelectorAll('.todo-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      dndDragId = parseInt(card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const targetId = parseInt(card.dataset.id);
      if (dndDragId === null || dndDragId === targetId) return;
      const ids = open.map(i => i.id);
      const from = ids.indexOf(dndDragId);
      const to = ids.indexOf(targetId);
      if (from === -1 || to === -1) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      sdCall(instanceID, 'Reorder', { order: ids.concat(done.map(i => i.id)) });
      dndDragId = null;
    });
  });
}

    `<h2>${escapeHtml(detail.name)}</h2>` +

  }

    const img = getProductImageUrl(it.name) || getProductImageUrl(it.notes || '');

    // Mengen-Stepper wie in der Einkaufsliste (nur bei numerischer Menge); der
    // Runter-Pfeil bei Menge=1 bleibt unsichtbar, damit das Badge nicht springt.
    const amountRaw = String(it.amount || '').trim();
    const numeric = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
    const amount = amountRaw === '' ? '1' : amountRaw;
    let side = '';
    if (numeric) {
      const canDec = parseInt(amount) > 1;
      side += `<span class="stepper"><button data-step="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>` +
        `<span class="amount-badge">${escapeHtml(amount)}</span>` +
        `<button data-step="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button>` +
        '</span>';
    } else {
      side += `<span class="amount-badge">${escapeHtml(amount)}</span>`;
    }
    side += `<button class="heart-btn" data-editfav="1" aria-label="${translate('Edit')}"><i class="fa-light fa-pen"></i></button>`;
    html += `<div class="item-card" data-name="${escapeHtml(it.name)}">` +
      `<div class="swipe-under"><i class="fa-light fa-heart-crack"></i></div>` +
      `<div class="item-card-content">` +
      `<span class="item-thumb" style="background:${img ? 'transparent' : tint}">` +
      (img ? `<img src="${img}" alt="" loading="lazy" />` : escapeHtml(String(it.name || '?').charAt(0).toUpperCase())) +
      `</span><span class="item-main"><span class="item-name">${escapeHtml(it.name)}</span>` +
      (it.notes ? `<span class="item-notes">${escapeHtml(it.notes)}</span>` : '') +
      `</span><span class="item-side">${side}</span></div></div>`;
  }
  html += `<div class="fav-actions">` +
    `<button id="btnFavAddAll"><i class="fa-light fa-cart-plus"></i> ${translate('Everything to the shopping list')}</button>` +
    `<button id="btnFavAddItem"><i class="fa-light fa-plus"></i> ${translate('Add item')}</button>` +
    `</div>`;
  if (!renderInto(el, html)) return;

  document.getElementById('btnFavBack').addEventListener('click', () => { favDetailListId = null; renderFavorites(); });
  document.getElementById('btnFavMenu').addEventListener('click', (e) => {
    // Nur „Löschen" — die App bietet für Favoritenlisten kein Umbenennen (1:1)
    openMenu(e.currentTarget, [
      { label: translate('Delete list'), icon: 'fa-trash', destructive: true, onClick: () => {
          showConfirm(translate('Delete this favorite list?'), translate('Delete'), () => {
            favDetailListId = null;

  document.getElementById('btnFavAddItem').addEventListener('click', () => openFavItemEditor(id, detail.id, null));

    const name = card.dataset.name;
    const item = items.find(i => i.name === name);
    bindCardSwipe(card, '.item-card-content', () => sdCall(id, 'RemoveItemFromFavoriteList', { listId: detail.id, name }));
    const editBtn = card.querySelector('[data-editfav]');
    if (editBtn) editBtn.addEventListener('click', () => openFavItemEditor(id, detail.id, item));
    card.querySelectorAll('[data-step]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!item) return;
      const next = Math.max(1, (parseInt(item.amount) || 1) + parseInt(btn.dataset.step));
      sdCall(id, 'UpdateFavoriteItem', { listId: detail.id, oldName: item.name, newName: item.name, category: item.category || '', amount: String(next), notes: item.notes || '' });
    }));
  });
}

function addFavListToCart(instanceID, list) {
  if (!list) return;

    // Wie addAll() in der App: leere Liste bekommt eine eigene Meldung
    showToast(translate('"%1" contains no items').replace('%1', list.name));

  }
  sdCall(instanceID, 'AddFavoriteListToCart', list.id);
  showToast(translate('"%1": %2 items added').replace('%1', list.name).replace('%2', String(n)));

function fillCategorySelect(select, current) {
  const st = instState(selectedShoppingID()) || {};
  const cats = Array.isArray(st.categoryOrder) ? st.categoryOrder : [];
  const cur = current || translate('Miscellaneous');
  select.innerHTML = '';
  if (cur && !cats.includes(cur)) {
    const opt = document.createElement('option');
    opt.value = cur; opt.textContent = cur; opt.selected = true;
    select.appendChild(opt);
  }
  for (const cat of cats) {
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    if (cat === cur) opt.selected = true;
    select.appendChild(opt);
  }
}

  const allDay = !!(item && item.dueAllDay === true);
  document.getElementById('tdAllDay').checked = allDay;
  const dueDate = item ? dueDateOf(item) : null;
  const base = dueDate || new Date(Date.now() + 3600000);
  if (!allDay && item && (parseInt(item.due) || 0) > 0) {
    base.setTime((parseInt(item.due) || 0) * 1000);
  }
  updateTodoDueInput(allDay, base);

  const rec = document.getElementById('tdRecurrence');
  rec.innerHTML = ['none', 'w1', 'w2', 'w3', 'm1', 'q1', 'y1', 'custom'].map(r =>
    `<option value="${r}">${escapeHtml(recurrenceLabel(r === 'custom' ? 'custom-label' : r).replace('custom-label', ''))}</option>`
  ).join('');
  // Eigene Beschriftung für custom (recurrenceLabel braucht unit/value)
  rec.querySelector('option[value="custom"]').textContent = translate('Custom interval');
  rec.querySelector('option[value="none"]').textContent = translate('No repeat');
  rec.value = item && item.recurrence ? String(item.recurrence) : 'none';

  const unitSel = document.getElementById('tdCustomUnit');
  unitSel.innerHTML = [['h', translate('Hours')], ['d', translate('Days')], ['w', translate('Weeks')], ['m', translate('Months')], ['y', translate('Years')]]
    .map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  unitSel.value = item && item.recurrenceCustomUnit ? String(item.recurrenceCustomUnit) : 'w';
  document.getElementById('tdCustomValue').value = item && item.recurrenceCustomValue ? String(item.recurrenceCustomValue) : '1';

  document.getElementById('tdNotification').checked = !!(item && item.notification === true);
  const leadSel = document.getElementById('tdLeadTime');
  leadSel.innerHTML = LEAD_TIMES.map(s => `<option value="${s}">${leadTimeLabel(s)}</option>`).join('');
  const lead = item && item.notificationLeadTime !== undefined ? parseInt(item.notificationLeadTime) : 0;
  leadSel.value = String(LEAD_TIMES.includes(lead) ? lead : 0);

  tdAssigned = item && Array.isArray(item.assignedTo) ? item.assignedTo.slice() : (currentUserID() ? [currentUserID()] : []);
  renderAssignList();
  tdPriority = item && item.priority ? String(item.priority) : 'normal';
  renderPrioritySeg();
  tdQuantity = item ? (parseInt(item.quantity) || 0) : 0;
  document.getElementById('tdQtyValue').textContent = tdQuantity > 0 ? String(tdQuantity) : '–';

  syncTodoEditorVisibility();
  openOverlay('todoOverlay');

  // Notizfeld an die Textmenge anpassen (einmalig binden, dann initial messen)
  const info = document.getElementById('tdInfo');
  if (!info.__autogrow) {
    info.__autogrow = () => { info.style.height = 'auto'; info.style.height = info.scrollHeight + 'px'; };
    info.addEventListener('input', info.__autogrow);
  }
  // Nach Layout/Öffnungsanimation messen (rAF greift zu früh, solange das
  // Overlay noch einblendet), damit die Höhe schon beim Öffnen zum Text passt.
  window.setTimeout(info.__autogrow, 80);
}
function updateTodoDueInput(allDay, date) {
  const input = document.getElementById('tdDueDate');
  input.type = allDay ? 'date' : 'datetime-local';
  input.value = toLocalInputValue(date, allDay);
}
function syncTodoEditorVisibility() {
  const hasDue = document.getElementById('tdHasDue').checked;
  document.getElementById('tdDueSection').style.display = hasDue ? 'flex' : 'none';
  document.getElementById('tdCustomSection').style.display =
    (hasDue && document.getElementById('tdRecurrence').value === 'custom') ? 'flex' : 'none';
  document.getElementById('tdLeadSection').style.display =
    (hasDue && document.getElementById('tdNotification').checked) ? 'flex' : 'none';
}
function renderAssignList() {
  const el = document.getElementById('tdAssignList');
  if (store.users.length === 0) {
    el.innerHTML = '';
    el.parentElement.style.display = 'none';
    return;
  }
  el.parentElement.style.display = '';
  el.innerHTML = store.users.map(u =>
    `<div class="assign-row${tdAssigned.includes(u.id) ? ' selected' : ''}" data-user="${escapeHtml(u.id)}">` +
    avatarHtml(u, 'avatar') + `<span>${escapeHtml(u.name)}</span><i class="fa-light fa-check check"></i></div>`
  ).join('');
  el.querySelectorAll('.assign-row').forEach(row => row.addEventListener('click', () => {
    const uid = row.dataset.user;
    const idx = tdAssigned.indexOf(uid);
    if (idx === -1) tdAssigned.push(uid); else tdAssigned.splice(idx, 1);
    row.classList.toggle('selected');
  }));
}
function renderPrioritySeg() {
  const seg = document.getElementById('tdPrioritySeg');
  seg.innerHTML = [['low', translate('Low')], ['normal', translate('Normal')], ['high', translate('High')]]
    .map(([v, l]) => `<button data-prio="${v}" class="${v === tdPriority ? 'active' : ''}">${l}</button>`).join('');
  seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    tdPriority = b.dataset.prio;
    renderPrioritySeg();
  }));
}
// Payload exakt wie TodoDraft.fields() in der App (+ actorUserId)
function saveTodoEditor() {
  if (!todoCtx) return;
  const title = document.getElementById('tdTitle').value.trim();
  if (!title) return;
  const fields = {
    title,
    info: document.getElementById('tdInfo').value.trim(),
    priority: tdPriority,
    quantity: tdQuantity,
    assignedTo: tdAssigned.slice()
  };
  if (document.getElementById('tdHasDue').checked) {
    const allDay = document.getElementById('tdAllDay').checked;
    const raw = document.getElementById('tdDueDate').value;
    let due = 0;
    let dueDay = '';
    if (allDay) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
      if (m) {
        dueDay = `${m[1]}-${m[2]}-${m[3]}`;
        due = Math.floor(new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])).getTime() / 1000);
      }
    } else {
      const d = new Date(raw);
      if (!isNaN(d.getTime())) due = Math.floor(d.getTime() / 1000);
    }
    fields.due = due;
    fields.dueAllDay = allDay;
    if (allDay && dueDay) fields.dueDay = dueDay;
    fields.recurrence = document.getElementById('tdRecurrence').value;
    if (fields.recurrence === 'custom') {
      fields.recurrenceCustomUnit = document.getElementById('tdCustomUnit').value;
      fields.recurrenceCustomValue = Math.max(1, Math.min(99, parseInt(document.getElementById('tdCustomValue').value) || 1));
    }
    fields.notification = document.getElementById('tdNotification').checked;
    fields.notificationLeadTime = parseInt(document.getElementById('tdLeadTime').value) || 0;
  } else {
    fields.due = 0;
    fields.dueAllDay = false;
    fields.recurrence = 'none';
    fields.notification = false;
  }
  if (currentUserID()) fields.actorUserId = currentUserID();
  if (todoCtx.itemId !== null) {
    sdCall(todoCtx.instanceID, 'UpdateItem', Object.assign({ id: todoCtx.itemId }, fields));
  } else {
    sdCall(todoCtx.instanceID, 'AddItem', fields);
  }
  closeOverlay('todoOverlay');
  todoCtx = null;
}

// ── Barcode-Scanner (aus dem ShoppingList-Modul uebernommen; angepasst:
//    AddScannedItem laeuft ueber sdCall auf die gewaehlte Einkaufsliste,
//    __extApiHookUrl/state kommen aus der Kompat-Schicht in syncCompat) ─────
let scannerStream = null;
let scannerDetector = null;
let scannerAnimationFrame = 0;
let scannerQuaggaTimer = 0;
let scannerResumeTimer = 0;
let scannerResultHideTimer = 0;
let scannerQuaggaActive = false;
let scannerSessionId = 0;
let scannerWarmupUntil = 0;
let lastCode = '';
const scannerAddedNames = new Set();

function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  } catch (e) {}
}

function validateBarcode(code) {
  return /^\d{8,14}$/.test(String(code || '').trim());
}

function syncScannerAddedNames() {
  if (!scannerAddedNames.size) return;
  const activeNames = new Set(
    (state.items || [])
      .filter(i => !i.inCart && i.name)
      .map(i => String(i.name).toLowerCase())
  );
  for (const name of Array.from(scannerAddedNames)) {
    if (!activeNames.has(name)) {
      scannerAddedNames.delete(name);
    }
  }
}

function showScannerResult(title, type, meta) {
  const el = document.getElementById('scannerResult');
  if (!el) return;
  if (scannerResultHideTimer) {
    clearTimeout(scannerResultHideTimer);
    scannerResultHideTimer = 0;
  }
  const parts = [title || ''];
  if (meta) parts.push(meta);
  const text = parts.filter(Boolean).join(' · ');
  el.textContent = text;
  el.className = 'scanner-result';
  if (!text) {
    return;
  }
  if (type === 'error') {
    el.classList.add('error');
  }
  el.classList.add('show');
  scannerResultHideTimer = setTimeout(() => {
    const current = document.getElementById('scannerResult');
    if (!current) return;
    current.textContent = '';
    current.className = 'scanner-result';
    scannerResultHideTimer = 0;
  }, 3000);
}

function pauseScanning() {
  if (scannerAnimationFrame) {
    cancelAnimationFrame(scannerAnimationFrame);
    scannerAnimationFrame = 0;
  }
  if (scannerQuaggaTimer) {
    clearTimeout(scannerQuaggaTimer);
    scannerQuaggaTimer = 0;
  }
  scannerQuaggaActive = false;
}

function stopScanner() {
  if (scannerAnimationFrame) {
    cancelAnimationFrame(scannerAnimationFrame);
    scannerAnimationFrame = 0;
  }
  if (scannerQuaggaTimer) {
    clearTimeout(scannerQuaggaTimer);
    scannerQuaggaTimer = 0;
  }
  if (scannerResumeTimer) {
    clearTimeout(scannerResumeTimer);
    scannerResumeTimer = 0;
  }
  if (scannerResultHideTimer) {
    clearTimeout(scannerResultHideTimer);
    scannerResultHideTimer = 0;
  }
  scannerWarmupUntil = 0;
  scannerQuaggaActive = false;
  if (scannerStream) {
    scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
  }
  const video = document.getElementById('scannerVideo');
  if (video) video.srcObject = null;
}

function closeScannerOverlay() {
  scannerSessionId += 1;
  stopScanner();
  scannerAddedNames.clear();
  showScannerResult('', '', '');
  document.getElementById('scannerOverlay').classList.remove('open');
}

function resumeScanning(delayMs) {
  const sessionId = scannerSessionId;
  if (scannerResumeTimer) {
    clearTimeout(scannerResumeTimer);
  }
  scannerResumeTimer = setTimeout(() => {
    if (sessionId !== scannerSessionId) return;
    scannerResumeTimer = 0;
    lastCode = '';
    pauseScanning();
    const status = document.getElementById('scannerStatus');
    const video = document.getElementById('scannerVideo');
    if (!scannerStream || !video) return;
    showScannerResult('', '', '');
    status.textContent = translate('Scanning…');
    status.className = 'scanner-status';
    if (scannerDetector) {
      startNativeScanning(video, status, sessionId);
    } else if (window.Quagga) {
      startQuaggaFrameScanning(video, status, sessionId);
    }
  }, delayMs);
}

function onBarcodeDetected(code, sessionId) {
  if (sessionId !== scannerSessionId) return;
  if (Date.now() < scannerWarmupUntil) return;
  if (!validateBarcode(code) || code === lastCode) return;
  lastCode = code;
  pauseScanning();
  playBeep();
  const status = document.getElementById('scannerStatus');
  status.textContent = translate('Found') + ': ' + code;
  status.className = 'scanner-status success';
  showScannerResult(code, '', '');
  lookupBarcode(code, sessionId);
}

function startNativeScanning(video, status, sessionId) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let detectErrorCount = 0;
  const loop = () => {
    if (sessionId !== scannerSessionId) return;
    if (!scannerStream || !scannerDetector) return;
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      scannerDetector.detect(canvas)
        .then(codes => {
          if (sessionId !== scannerSessionId) return;
          if (!scannerStream) return;
          detectErrorCount = 0;
          if (codes && codes.length) {
            const raw = String(codes[0].rawValue || '').trim();
            onBarcodeDetected(raw, sessionId);
          }
        })
        .catch((err) => {
          detectErrorCount += 1;
          console.warn('[scanner] BarcodeDetector.detect failed:', err);
          // Auf Android schlägt detect() teils permanent fehl → Fallback auf Quagga
          if (detectErrorCount >= 3 && sessionId === scannerSessionId) {
            scannerDetector = null;
            if (scannerAnimationFrame) {
              cancelAnimationFrame(scannerAnimationFrame);
              scannerAnimationFrame = 0;
            }
            status.textContent = translate('Loading decoder…');
            ensureQuaggaLoaded()
              .then(() => {
                if (sessionId !== scannerSessionId || !scannerStream) return;
                status.textContent = translate('Scanning…');
                status.className = 'scanner-status';
                startQuaggaFrameScanning(video, status, sessionId);
              })
              .catch(() => {
                status.textContent = translate('Decoder could not be loaded');
                status.className = 'scanner-status error';
              });
          }
        });
    }
    scannerAnimationFrame = requestAnimationFrame(loop);
  };
  loop();
}

function ensureQuaggaLoaded() {
  if (window.Quagga) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-quagga="1"]');
    if (existing) {
      existing.addEventListener('load', () => resolve());
      existing.addEventListener('error', () => reject(new Error('load failed')));
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js';
    script.async = true;
    script.setAttribute('data-quagga', '1');
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(script);
  });
}

function startQuaggaFrameScanning(video, status, sessionId) {
  if (sessionId !== scannerSessionId) return;
  if (!window.Quagga || !scannerStream) return;
  scannerQuaggaActive = true;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const scanOnce = () => {
    if (sessionId !== scannerSessionId) return;
    if (!scannerQuaggaActive || !scannerStream) return;
    if (video.readyState < 2) {
      scannerQuaggaTimer = setTimeout(scanOnce, 200);
      return;
    }
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    const SCAN_W = 800;
    const scale = SCAN_W / vw;
    canvas.width = SCAN_W;
    canvas.height = Math.round(vh * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    try {
      Quagga.decodeSingle({
        src: canvas.toDataURL('image/jpeg', 0.8),
        numOfWorkers: 0,
        locate: true,
        locator: { patchSize: 'medium', halfSample: true },
        decoder: {
          readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'code_128_reader'],
          multiple: false
        }
      }, (result) => {
        if (sessionId !== scannerSessionId) return;
        if (result && result.codeResult && result.codeResult.code) {
          onBarcodeDetected(result.codeResult.code, sessionId);
        }
        if (scannerQuaggaActive) {
          scannerQuaggaTimer = setTimeout(scanOnce, 400);
        }
      });
    } catch (err) {
      console.warn('[scanner] Quagga.decodeSingle threw:', err);
      if (scannerQuaggaActive) {
        scannerQuaggaTimer = setTimeout(scanOnce, 500);
      }
    }
  };

  status.textContent = translate('Scanning…');
  status.className = 'scanner-status';
  scanOnce();
}

function openScannerOverlay() {
  document.getElementById('suggestions').classList.remove('open');
  scannerSessionId += 1;
  const sessionId = scannerSessionId;
  const overlay = document.getElementById('scannerOverlay');
  const status = document.getElementById('scannerStatus');
  const result = document.getElementById('scannerResult');
  const videoWrap = document.getElementById('scannerVideoWrap');
  const video = document.getElementById('scannerVideo');
  overlay.classList.add('open');
  lastCode = '';
  scannerWarmupUntil = 0;
  scannerAddedNames.clear();
  result.textContent = '';
  result.className = 'scanner-result';
  videoWrap.style.display = '';

  status.textContent = translate('Scanning…');
  status.className = 'scanner-status';

  const canUseCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const canUseNative = !!window.BarcodeDetector;
  const isSecure = !!window.isSecureContext;
  const inIframe = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  if (!canUseCamera) {
    videoWrap.style.display = 'none';
    if (!isSecure) {
      status.textContent = translate('Camera requires HTTPS');
    } else {
      status.textContent = translate('Camera not available');
    }
    status.className = 'scanner-status error';
    return;
  }

  const waitForVideoReady = (videoEl) => new Promise((resolve) => {
    if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
      resolve();
      return;
    }
    const onReady = () => {
      videoEl.removeEventListener('loadedmetadata', onReady);
      videoEl.removeEventListener('canplay', onReady);
      resolve();
    };
    videoEl.addEventListener('loadedmetadata', onReady);
    videoEl.addEventListener('canplay', onReady);
  });

  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  })
    .then((stream) => {
      scannerStream = stream;
      video.srcObject = stream;
      const playPromise = video.play();
      return (playPromise && playPromise.catch) ? playPromise.catch(() => {}) : playPromise;
    })
    .then(() => waitForVideoReady(video))
    .then(async () => {
      scannerWarmupUntil = Date.now() + 900;
      scannerDetector = null;
      if (canUseNative) {
        try {
          let supported = [];
          if (typeof BarcodeDetector.getSupportedFormats === 'function') {
            supported = await BarcodeDetector.getSupportedFormats();
          }
          const wanted = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
          const formats = supported.length ? wanted.filter(f => supported.includes(f)) : wanted;
          if (formats.length) {
            scannerDetector = new BarcodeDetector({ formats });
          } else {
            console.warn('[scanner] BarcodeDetector reports no supported formats – falling back to Quagga');
          }
        } catch (e) {
          console.warn('[scanner] BarcodeDetector init failed:', e);
          scannerDetector = null;
        }
      }

      if (scannerDetector) {
        startNativeScanning(video, status, sessionId);
      } else {
        status.textContent = translate('Loading decoder…');
        ensureQuaggaLoaded()
          .then(() => {
            if (sessionId !== scannerSessionId) return;
            if (!scannerStream) return;
            status.textContent = translate('Scanning…');
            status.className = 'scanner-status';
            startQuaggaFrameScanning(video, status, sessionId);
          })
          .catch((err) => {
            console.warn('[scanner] Quagga load failed:', err);
            if (sessionId !== scannerSessionId) return;
            status.textContent = translate('Decoder could not be loaded');
            status.className = 'scanner-status error';
          });
      }
    })
    .catch((err) => {
      console.warn('[scanner] camera init failed:', err);
      videoWrap.style.display = 'none';
      const name = (err && err.name) ? err.name : '';
      let msg;
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        msg = inIframe
          ? translate('Camera blocked by iframe policy')
          : translate('Camera permission denied');
      } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        msg = translate('No camera found');
      } else if (name === 'NotReadableError') {
        msg = translate('Camera is used by another app');
      } else {
        msg = translate('Camera not available') + (name ? ' (' + name + ')' : '');
      }
      status.textContent = msg;
      status.className = 'scanner-status error';
    });
}

function applyBarcodeLookupResult(code, name, bestCat, sessionId, price, listingId, imageUrl) {
  if (sessionId !== scannerSessionId) return;
  const status = document.getElementById('scannerStatus');
  const trimName = (name || code).trim();
  const nameKey = trimName.toLowerCase();
  const existing = (state.items || []).find(i => !i.inCart && i.name.toLowerCase() === nameKey);
  const alreadyScanned = scannerAddedNames.has(nameKey);
  // Still treat as duplicate unless we can enrich the existing item (backfill category/price/listingId/imageUrl)
  const canEnrich = existing && ((!existing.category && bestCat) || (!existing.price && price) || (!existing.listingId && listingId) || (!existing.imageUrl && imageUrl));
  if ((existing || alreadyScanned) && !canEnrich) {
    status.textContent = '\u2713 ' + trimName + ' (' + translate('already in list') + ')';
    status.className = 'scanner-status success';
    showScannerResult('\u2713 ' + trimName, 'duplicate', translate('already in list'));
    resumeScanning(1500);
    return;
  }
  const label = price ? (price + '  ' + trimName) : trimName;
  status.textContent = '\u2713 ' + label;
  status.className = 'scanner-status success';
  showScannerResult('\u2713 ' + label, '', bestCat);
  addScannedProduct(trimName, bestCat, price || '', listingId || '', imageUrl || '');
}

function matchLocalCategory(offCats) {
  const local = new Set();
  for (const cat of (state.categoryOrder || [])) local.add(cat);
  for (const item of (state.items || [])) {
    if (item.category) local.add(item.category);
  }
  if (!local.size || !offCats.length) return offCats[0] || '';
  for (const oc of offCats) {
    const ocL = oc.toLowerCase();
    for (const lc of local) {
      if (lc.toLowerCase() === ocL) return lc;
    }
  }
  for (const oc of offCats) {
    const ocL = oc.toLowerCase();
    for (const lc of local) {
      const lcL = lc.toLowerCase();
      if (ocL.includes(lcL) || lcL.includes(ocL)) return lc;
    }
  }
  return '';
}

function lookupBarcodeOpenFoodFacts(code) {
  return fetch('https://de.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?lc=de')
    .then(r => r.json())
    .then(data => {
      if (!data || data.status !== 1 || !data.product) return null;
      const p = data.product;
      const name = p.product_name_de || p.product_name || p.brands || code;
      const offCats = (p.categories || '').split(',').map(c => c.trim()).filter(Boolean);
      return { name, bestCat: matchLocalCategory(offCats) };
    });
}

function parseOpenGtinDbResponse(text) {
  if (!text) return null;
  const flat = text.replace(/\r?\n/g, ' ').replace(/---/g, ' ').trim();
  const data = {};
  const re = /([a-z_]+)=([\s\S]*?)(?=\s+[a-z_]+=|$)/gi;
  let m;
  while ((m = re.exec(flat)) !== null) {
    data[m[1].toLowerCase()] = m[2].trim();
  }
  if (!Object.keys(data).length || data.error !== '0') return null;
  return data;
}

function lookupBarcodeOpenGtinDb(code) {
  const url = 'https://opengtindb.org/api.php?ean=' + encodeURIComponent(code) + '&cmd=query&queryid=400000000';
  return fetch(url)
    .then(r => r.text())
    .then(text => {
      const data = parseOpenGtinDbResponse(text);
      if (!data) return null;
      const name = data.detailname || data.name || code;
      const cats = [data.maincat || '', data.subcat || ''].map(c => c.trim()).filter(Boolean);
      return { name, bestCat: matchLocalCategory(cats) };
    });
}

function lookupBarcodeExtApi(code) {
  if (!state.extApiEnabled || !window.__extApiHookUrl) return Promise.resolve(null);
  return fetch(window.__extApiHookUrl + encodeURIComponent(code))
    .then(r => r.json())
    .then(data => {
      if (!data || data.error) return null;
      const name = data.name || '';
      if (!name) return null;
      const cats = (data.category || '').split('/').map(c => c.trim()).filter(Boolean);
      return {
        name,
        bestCat: matchLocalCategory(cats),
        price: data.price || '',
        listingId: data.listingId || '',
        imageUrl: data.imageUrl || ''
      };
    })
    .catch(() => null);
}

function lookupBarcode(code, sessionId) {
  if (sessionId !== scannerSessionId) return;
  const status = document.getElementById('scannerStatus');
  status.textContent = translate('Looking up product…');
  status.className = 'scanner-status';

  lookupBarcodeExtApi(code)
    .then(product => product || lookupBarcodeOpenFoodFacts(code).catch(() => null))
    .then(product => product || lookupBarcodeOpenGtinDb(code).catch(() => null))
    .then(product => {
      if (sessionId !== scannerSessionId) return;
      if (product) {
        applyBarcodeLookupResult(code, product.name, product.bestCat, sessionId, product.price || '', product.listingId || '', product.imageUrl || '');
      } else {
        status.textContent = translate('Product not found') + ' (' + code + ')';
        status.className = 'scanner-status error';
        showScannerResult(translate('Product not found'), 'error', code);
        resumeScanning(2000);
      }
    })
    .catch(() => {
      if (sessionId !== scannerSessionId) return;
      status.textContent = translate('Lookup failed') + ' (' + code + ')';
      status.className = 'scanner-status error';
      showScannerResult(translate('Lookup failed'), 'error', code);
      resumeScanning(2000);
    });
}

// ── Scroll-Containment (wie im ToDoList-Modul) ─────────────────────────────
// Verhindert, dass beim Scrollen die ganze Kachel/Visu mitscrollt: pro
// Scrollbereich werden wheel/touch-Gesten an den Rändern abgefangen und die
// Weiterleitung (stopPropagation) unterbunden; zusätzlich blockt ein
// dokument-weiter Handler jede Scroll-Geste außerhalb erlaubter Bereiche.
const SCROLL_AREA_SELECTOR = '.screen, .suggestions, .overlay-body, .scanner-body, .shop-strip, .menu-pop';

function bindScrollContainment(scrollEl) {
  if (!scrollEl) return;
  let lastTouchY = null;
  let startX = 0, startY = 0;
  let axis = null; // 'x' = horizontale Geste (z. B. Einkaufsvorschau) → durchlassen

  scrollEl.addEventListener('wheel', (e) => {
    // Horizontales Wheel/Trackpad (z. B. auf der Artikelleiste) NICHT abfangen
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const maxScrollTop = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    if (maxScrollTop <= 0) { e.preventDefault(); e.stopPropagation(); return; }
    const deltaY = e.deltaY || 0;
    if (deltaY === 0) { e.stopPropagation(); return; }
    const atTop = scrollEl.scrollTop <= 0;
    const atBottom = scrollEl.scrollTop >= maxScrollTop - 1;
    if ((deltaY < 0 && atTop) || (deltaY > 0 && atBottom)) e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  scrollEl.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) { lastTouchY = null; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    lastTouchY = startY;
    axis = null;
    e.stopPropagation();
  }, { passive: true });

  scrollEl.addEventListener('touchmove', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    const currentX = e.touches[0].clientX;
    const currentY = e.touches[0].clientY;
    // Achse einmalig festlegen, sobald die Bewegung eindeutig ist
    if (axis === null) {
      const dx = Math.abs(currentX - startX);
      const dy = Math.abs(currentY - startY);
      if (dx > 8 || dy > 8) axis = dx > dy ? 'x' : 'y';
    }
    // Horizontale Geste (Einkaufsvorschau u. Ä.) unangetastet lassen — sonst
    // würde die vertikale Eindämmung das horizontale Scrollen blockieren
    if (axis === 'x') { lastTouchY = currentY; return; }

    const maxScrollTop = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    if (maxScrollTop <= 0) { e.preventDefault(); e.stopPropagation(); return; }
    if (lastTouchY === null) { lastTouchY = currentY; e.stopPropagation(); return; }
    const deltaY = lastTouchY - currentY;
    const atTop = scrollEl.scrollTop <= 0;
    const atBottom = scrollEl.scrollTop >= maxScrollTop - 1;
    if ((deltaY < 0 && atTop) || (deltaY > 0 && atBottom)) e.preventDefault();
    e.stopPropagation();
    lastTouchY = currentY;
  }, { passive: false });

  scrollEl.addEventListener('touchend', () => { lastTouchY = null; axis = null; }, { passive: true });
  scrollEl.addEventListener('touchcancel', () => { lastTouchY = null; axis = null; }, { passive: true });
}

function setupScrollContainment() {
  // Vertikale Scrollbereiche einzeln absichern (die Container sind statisch;
  // ihr Inhalt wird per innerHTML erneuert, die Elemente bleiben bestehen)
  document.querySelectorAll('.screen, .suggestions, .overlay-body, .scanner-body')
    .forEach(bindScrollContainment);

  // Dokument-weit: jede Scroll-Geste außerhalb eines erlaubten Bereichs
  // unterbinden, damit die Kachel als Ganzes nicht mitscrollt. Über closest()
  // funktioniert das auch für später neu gerenderte Bereiche (z. B. .shop-strip).
  const outside = (target) =>
    !(target instanceof Element) || target.closest(SCROLL_AREA_SELECTOR) === null;
  document.addEventListener('wheel', (e) => {
    if (outside(e.target)) e.preventDefault();
  }, { passive: false, capture: true });
  document.addEventListener('touchmove', (e) => {
    if (outside(e.target)) e.preventDefault();
  }, { passive: false, capture: true });
}

  });

  function aiDownscale(file, maxEdge, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }

  function aiStatus(html) { aiBody.innerHTML = '<div class="ai-status">' + html + '</div>'; }

  function runAiExtract(dataUrl) {
    aiAdd.disabled = true;
    aiStatus('<div class="ai-spinner"></div>' + translate('Analyzing photo…'));
    openOverlay('aiReviewOverlay');
    const done = (res) => {
      const j = res && res.json;
      if (!res || res.status !== 200 || !j || j.ok !== true) {
        const msg = (j && j.error && j.error.message) || translate('AI request failed.');
        aiStatus(escapeHtml(msg));
        return;
      }
      renderAiReview(Array.isArray(j.todos) ? j.todos : []);
    };
    const fail = () => aiStatus(translate('Could not reach the AI service.'));
    // Über die Adapter-Transportfunktion → dieselbe lokal-zuerst-Basis wie alle
    // anderen Aufrufe (daheim lokal, unterwegs Connect, mit Fallback).
    if (typeof window.__symdoApiPost === 'function') {
      window.__symdoApiPost('/ai/extract', { image: dataUrl }).then(done).catch(fail);
    } else {
      // Fallback (falls kein Adapter, z. B. außerhalb der Standalone-App)
      const base = (window.__SYMDO__ && window.__SYMDO__.apiBase) || '/hook/lists/app/v1';
      let token = '';
      try { token = localStorage.getItem('symdo.token') || ''; } catch (e) {}
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;
      fetch(base + '/ai/extract', { method: 'POST', headers: headers, credentials: 'omit', body: JSON.stringify({ image: dataUrl }) })
        .then(r => r.json().then(j => ({ status: r.status, json: j })).catch(() => ({ status: r.status, json: null })))
        .then(done).catch(fail);
    }
  }

  function runAiIngredients(payload) {
    aiAdd.disabled = true;
    if (aiFav) { aiFav.style.display = 'none'; aiFav.disabled = true; }

      renderAiShopping({ title: j.title, servings: j.servings, items: Array.isArray(j.items) ? j.items : [], url: srcUrl });
    };
    const fail = () => aiStatus(translate('Could not reach the AI service.'));
    if (typeof window.__symdoApiPost === 'function') {
      window.__symdoApiPost('/ai/ingredients', payload).then(done).catch(fail);
    } else {
      const base = (window.__SYMDO__ && window.__SYMDO__.apiBase) || '/hook/lists/app/v1';
      let token = '';
      try { token = localStorage.getItem('symdo.token') || ''; } catch (e) {}
      const headers = { 'Content-Type': 'application/json' };
