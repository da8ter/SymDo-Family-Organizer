<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <script src="/icons.js"></script>
  <style>
:root {
  --bg:      var(--card-color);
  --card:    var(--card-color);
  --text:    var(--content-color);
  --muted:   color-mix(in srgb, var(--content-color) 45%, transparent);
  --faint:   color-mix(in srgb, var(--content-color) 30%, transparent);
  --surface: color-mix(in srgb, var(--content-color) 7%, transparent);
  --surface2:color-mix(in srgb, var(--content-color) 12%, transparent);
  /* Deckende Zeilenfläche: liegt über dem roten Wisch-Hintergrund, darf NICHT
     durchscheinen (color-mix zweier deckender Farben bleibt deckend) */
  --row:     color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --border:  color-mix(in srgb, var(--content-color) 14%, transparent);
  --accent:  var(--accent-color);
  --red:     #ff4d4d;
  --orange:  #ff9500;
  --green:   #34c759;
  --radius:  14px;
  --gap:     12px;
  --nav-h:   68px;
  /* Vom System vorgegebene Kachel-Ränder (aus den URL-Parametern margintop/
     marginside/marginbottom, per JS gesetzt). Default 0, damit Vollbild ohne
     Ränder korrekt bleibt. */
  --sym-mt:  0px;
  --sym-ms:  0px;
  --sym-mb:  0px;
  --sbw:     6px;   /* Scrollbalken-Breite (muss ::-webkit-scrollbar width entsprechen) */
  /* Rechter Innenabstand, der den Scrollbalken mittig ins rechte Body-Padding
     legt: Scrollbereich endet um (marginside - Balken)/2 vor der Kante, der
     Balken (Breite --sbw) sitzt dann zentriert im marginside-Streifen. */
  --sb-pad:  max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: transparent;
  overflow: hidden;
  /* Eventuelles vom System gesetztes Body-Padding neutralisieren — die Ränder
     werden deterministisch selbst über --sym-* angewandt (kein doppelter Rand) */
  padding: 0 !important;
  margin: 0 !important;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea {
  font: inherit; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  outline: none;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
select option { color: #111; background: #fff; }
/* Notizen im Todo-Editor wachsen automatisch mit dem Text (kein Scrollbalken/Griff) */
#tdInfo { resize: none; overflow: hidden; min-height: 54px; }

/* height:100% + eigenes System-Rand-Padding oben/seitlich, damit der Inhalt
   nicht unter die vom System überlagerten Kachel-Steuerelemente rutscht.
   Unten kein Rand: die Tab-Leiste sitzt an der Kachel-Unterkante. */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  /* Rechts nur --sb-pad statt marginside, damit der Scrollbereich in den
     rechten Rand hineinreicht und der Scrollbalken mittig darin liegt. Der
     fehlende Rest des Inhaltsabstands sitzt als padding-right auf .screen. */
  padding: var(--sym-mt) var(--sb-pad) 0 var(--sym-ms);
}

.screen {
  flex: 1;
  min-height: 0;
  /* overflow-y: scroll (statt auto): der 6px-Scrollstreifen ist IMMER
     reserviert — so ist der rechte Abstand mit und ohne sichtbaren Balken
     gleich (leerer Track ist transparent, der Thumb erscheint nur bei Bedarf).
     KEIN scrollbar-gutter zusätzlich — das würde doppelt reservieren. */
  overflow-y: scroll;
  overscroll-behavior: contain;  /* Scrollleiste wie im ToDoList-Modul: dünn, Akzentfarbe, transparente Spur */
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
  display: none;
  /* Vertikaler Gutter; rechts --sb-pad, damit der Inhalt trotz des nach rechts
     verschobenen Scrollbereichs bündig bei marginside endet (linker Abstand
     kommt aus .app padding-left = marginside). */
  padding: 12px var(--sb-pad) 12px 0;
}
.screen::-webkit-scrollbar { width: 6px; height: 6px; }
.screen::-webkit-scrollbar-track { background: transparent; }
.screen::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}
.screen.active { display: block; }
.content { max-width: 720px; margin: 0 auto; }

/* ── Bottom-Tab-Bar (im Flex-Fluss, damit scrollbarer Inhalt nicht dahinter
      verschwindet — sie ist immer die unterste Zeile unter dem Scrollbereich).
      Full-Bleed: 100% der KACHELBREITE. margin-left hebt exakt das linke
      .app-Padding (marginside) auf → linke Kante bei 0; width:100vw erreicht die
      rechte Kante. (Kein 50%-50vw-Trick, weil .app-Padding asymmetrisch ist –
      links marginside, rechts nur der schmale Scrollbalken-Rand.) ── */
.tabbar {
  flex: none;
  height: var(--nav-h);
  width: 100vw;
  margin-left: calc(-1 * var(--sym-ms));
  display: flex;
  padding: 8px 16px;
  background: color-mix(in srgb, var(--card-color) 88%, var(--content-color) 4%);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(10px);
  z-index: 40;
}
.tabbar button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 10px;
  color: var(--muted);
  padding-top: 4px;
}
/* /icons.js (Font Awesome SVG+JS) ersetzt <i> durch <svg class="svg-inline--fa">
   mit height:1em → deshalb MUSS die Icon-Größe auch das <svg> treffen, sonst
   erbt es nur die Button-Schriftgröße (Label) und wächst nicht mit. */
.tabbar button i,
.tabbar button svg { font-size: 25px; }
.tabbar button.active { color: var(--accent); }

/* ── Screen-Header ─────────────────────────────────────────────────────────── */
.screen-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.screen-head h2 { font-size: 22px; font-weight: 800; flex: 1; min-width: 0; }
.screen-head select.list-switcher {
  width: auto;
  max-width: 70%;
  font-weight: 700;
  font-size: 16px;
  background: transparent;
  border: none;
  padding: 4px 2px;
  /* Inhaltsbreit (nicht flex:1) → der native Dropdown-Pfeil sitzt direkt
     hinter dem Namen statt weit rechts. */
  flex: 0 1 auto;
}
/* Letzter Icon-Button der Kopfzeile (z. B. das „…"-Menü) ganz nach rechts. */
.screen-head .icon-btn:last-child { margin-left: auto; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 16px;
  flex: none;
}
.icon-btn:active { border-color: var(--accent); }

/* ── Karten ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: var(--gap);
}
.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}
.card-head h3 { font-size: 16px; font-weight: 700; }
.card-head .link { color: var(--accent); font-size: 14px; font-weight: 600; }

/* ── Dashboard ─────────────────────────────────────────────────────────────── */
.dash-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .4px;
  min-height: 44px;
  display: flex;
  align-items: center;
  /* Abstand der Kopf-/Avatar-Zeile zum ersten Seiteninhalt (KPI-Grid) beim
     initialen Laden */
  margin-bottom: 16px;
}
/* Avatar-Menü: nur DIESES ist sticky (oben rechts), mit halbtransparentem
   Pillen-Hintergrund. Das Datum scrollt normal weiter. Rechtsbündig via
   margin-left:auto + fit-content; negatives margin-bottom zieht das folgende
   Datum auf dieselbe Zeile. */
.member-bar {
  display: flex;
  gap: 6px;
  position: sticky;
  top: 0px;
  z-index: 20;
  width: fit-content;
  margin-left: auto;
  margin-bottom: -44px;
  padding: 4px 6px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--card-color) 50%, transparent);
}
/* Im Hellmodus ist die halbtransparente Kartenfarbe auf weißem Grund kaum
   sichtbar → dezent grau tönen (Transparenz bleibt erhalten), damit die
   Member-Pille abgesetzt ist. */
html[data-symdo-theme="light"] .member-bar {
  background: color-mix(in srgb, color-mix(in srgb, var(--content-color) 14%, var(--card-color)) 55%, transparent);
}
/* Im Dunkelmodus etwas dunkler als die reine Kartenfarbe (Transparenz bleibt). */
html[data-symdo-theme="dark"] .member-bar {
  background: color-mix(in srgb, color-mix(in srgb, #000 22%, var(--card-color)) 55%, transparent);
}
/* Im ToDo-Tab gibt es kein Datum, das hochgezogen werden muss → normaler
   Abstand nach unten statt des negativen Zugs. */
.member-bar.todo-members { margin-bottom: 10px; }
.member-bar .avatar-btn {
  width: 36px; height: 36px;
  border-radius: 999px;
  padding: 0;
  position: relative;
  opacity: 1;
  transition: opacity .15s ease, margin-left .2s ease, box-shadow .2s ease;
  flex: none;
}
/* Eingeklappt (beim Scrollen, wenn nicht oben): Avatare schieben sich
   übereinander, von den hinteren bleibt ~1/3 sichtbar (36px → 12px). Ein Tipp
   auf die Leiste klappt sie wieder aus (siehe setupMemberCollapse). */
.member-bar { transition: gap .2s ease; }
.member-bar.collapsed { gap: 0; cursor: pointer; }
.member-bar.collapsed .avatar-btn:not(:first-child) { margin-left: -24px; }
.member-bar.collapsed .avatar-btn { box-shadow: 0 0 0 2px var(--card-color); }
/* Maus-Hover klappt die eingeklappte Leiste (optisch) wieder auf */
.member-bar.collapsed:hover { gap: 6px; }
.member-bar.collapsed:hover .avatar-btn:not(:first-child) { margin-left: 0; }
.member-bar.collapsed:hover .avatar-btn { box-shadow: none; }
.member-bar.has-selection .avatar-btn { opacity: .4; }
.member-bar.has-selection .avatar-btn.selected { opacity: 1; }
.member-bar .avatar-btn.selected::after {
  content: '';
  position: absolute;
  inset: -3px;
  border: 2px solid var(--accent);
  border-radius: 999px;
}
.member-bar .avatar-btn img,
.member-bar .avatar-btn span {
  width: 100%; height: 100%;
  border-radius: 999px;
  object-fit: cover;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 15px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
  margin-bottom: var(--gap);
}
.kpi {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  color: #fff;
  padding: 14px;
  min-height: 96px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
}
.kpi .kpi-label { font-size: 13px; font-weight: 600; opacity: .92; position: relative; z-index: 1; }
.kpi .kpi-value { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.kpi .kpi-glyph {
  position: absolute;
  right: -8px; bottom: -14px;
  font-size: 74px;
  opacity: .18;
  z-index: 0;
}
.kpi:active { filter: brightness(1.08); }

.week-card { display: flex; align-items: center; gap: 16px; }
.week-ring { flex: none; }
.week-ring svg { display: block; }
.week-ring .ring-track { stroke: var(--surface2); }
.week-ring .ring-value { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
.week-ring text { fill: var(--text); font-weight: 800; font-size: 20px; }
.week-info h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.week-info p { font-size: 13px; color: var(--muted); }

.segmented {
  display: flex;
  background: var(--surface);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: var(--gap);
}
.segmented button {
  flex: 1;
  padding: 7px 0;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}
.segmented button.active {
  background: var(--surface2);
  color: var(--text);
}

/* Dashboard-Aufgabenzeilen */
.task-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.task-row:last-child { border-bottom: none; }
/* Aufgaben-Checkbox: identisch zur ToDoList-Kachel (native, gestylte Checkbox).
   Klassen-gescopt auf .chk, damit die iOS-Switch-Toggles im Editor
   (.switch > input[type=checkbox]) unberührt bleiben. Unchecked-Fläche =
   Task-Hintergrund (var(--row)). */
.chk {
  appearance: none;
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  margin: 1px 0 0;
  padding: 0;
  flex: 0 0 auto;
  box-sizing: border-box;
  border: 1px solid var(--accent);
  border-radius: 5px;
  background-color: var(--row);
  background-position: center;
  background-repeat: no-repeat;
  background-size: 13px 13px;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--row) 45%, transparent);
  cursor: pointer;
  vertical-align: middle;
  accent-color: var(--accent);
  transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .04s ease;
}
.chk:checked {
  border-color: var(--accent);
  background-color: var(--accent);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.4 8.2 6.6 11.4 12.8 4.8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 16%, transparent);
}
.chk:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: 2px;
}
.chk:active { transform: scale(.94); }
.chk:disabled { cursor: not-allowed; opacity: .45; }
.task-row .task-main { flex: 1; min-width: 0; }
.task-row .task-title {
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task-row .task-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.task-row .task-sub .seg-overdue { color: var(--red); }
.task-row .task-sub .seg-today { color: var(--orange); }
.empty-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  color: var(--muted);
  font-size: 14px;
}
.empty-row i { color: var(--green); font-size: 18px; }
.more-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0 2px;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
}

/* Einkaufsvorschau */
.shop-strip {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 2px 8px;  /* Horizontal wischbar, aber ohne sichtbare Scrollleiste (wie in der App) */
  scrollbar-width: none;
}
.shop-strip::-webkit-scrollbar { display: none; }
.shop-strip .strip-item {
  flex: none;
  width: 58px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
.strip-thumb {
  width: 44px; height: 44px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
}
.strip-thumb img { width: 100%; height: 100%; object-fit: cover; }
.strip-name {
  width: 100%;
  font-size: 10.5px;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
}
.strip-name .marquee-inner { display: inline-block; }
.strip-name.marquee .marquee-inner { animation: marquee-pingpong 6s ease-in-out infinite; }
@keyframes marquee-pingpong {
  0%, 15%  { transform: translateX(0); }
  45%, 55% { transform: translateX(var(--marquee-shift, -30px)); }
  85%, 100%{ transform: translateX(0); }
}
.preview-actions { display: flex; gap: 10px; margin-top: 8px; }
.preview-actions button {
  flex: 1;
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--surface2);
  font-size: 14px;
  font-weight: 600;
}

/* ── Listen-Zeilen (Einkaufen / Favoriten) ────────────────────────────────── */
.cat-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 2px 6px;
  font-size: 13px;
  font-weight: 700;
}
.item-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 6px;
}
.item-card .swipe-under {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 18px;
  background: var(--red);
  color: #fff;
  font-size: 17px;
  opacity: 0;
  transition: opacity .12s ease;
}
.item-card .swipe-under-edit {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: 18px;
  background: #2f6fd4;
  color: #fff;
  font-size: 17px;
  opacity: 0;
  transition: opacity .12s ease;
}
.item-card.dragging-left .swipe-under,
.item-card.is-deleting .swipe-under { opacity: 1; }
.item-card.dragging-right .swipe-under-edit { opacity: 1; }
.item-card-content {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--row);
  transition: transform .18s ease;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: pointer;
}
.item-card-content.is-dragging { transition: none; }
.item-card.is-deleting .item-card-content { transition: transform .22s ease; }
.item-thumb {
  width: 38px; height: 38px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface2);
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 15px;
}
.item-thumb img { width: 100%; height: 100%; object-fit: contain; }
.item-main { flex: 1; min-width: 0; }
.item-name {
  display: block;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-notes {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-side { display: flex; align-items: center; gap: 8px; flex: none; }
.item-price { font-size: 12.5px; color: var(--muted); }
.heart-btn { font-size: 16px; color: var(--muted); padding: 4px; }
.heart-btn.faved { color: var(--accent); }
.amount-badge {
  min-width: 30px;
  text-align: center;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface2);
  font-size: 12.5px;
  font-weight: 700;
}
.stepper { display: flex; flex-direction: column; }
.stepper button { padding: 0 6px; font-size: 12px; color: var(--accent); line-height: 1.2; }
.stepper .amount-badge { padding: 1px 8px; }
.item-card.in-cart .item-name { text-decoration: line-through; color: var(--muted); }
.item-card.in-cart .item-card-content { opacity: .75; }

.section-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 2px 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.section-toggle .count { margin-left: auto; font-weight: 600; }
.section-toggle i.chev { transition: transform .18s ease; }
.section-toggle.open i.chev { transform: rotate(90deg); }

/* ── Eingabeleisten ────────────────────────────────────────────────────────── */
.inputbar {
  position: sticky;
  bottom: 0;
  display: flex;
  gap: 8px;
  padding: 24px 0 2px;
  background: linear-gradient(to top, var(--card-color) 72%, transparent);
}
/* Der Inputbar-Hintergrund soll bis an die Oberkante der Tab-Leiste reichen:
   dieses ::after füllt das 12px-Bottom-Padding der .screen unter dem Inputbar,
   damit scrollender Inhalt dort nicht durchblitzt. */
.inputbar::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  height: 12px;
  background: var(--card-color);
}
.inputbar input { flex: 1; border-radius: 999px; }
.inputbar .round-btn {
  width: 42px; height: 42px;
  flex: none;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.inputbar .round-btn.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}
.inputbar .round-btn:disabled { opacity: .4; }

.suggestions {
  max-height: calc(3 * 34px + 16px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
  display: none;
  padding: 6px 0;
}
.suggestions::-webkit-scrollbar { width: 6px; height: 6px; }
.suggestions::-webkit-scrollbar-track { background: transparent; }
.suggestions::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}
.suggestions.open { display: block; }
.suggestions .chip-flow { display: flex; flex-wrap: wrap; gap: 8px; }
/* Vorschläge + Eingabe als EIN sticky Block: so klebt das Vorschlags-Fenster
   beim Tippen direkt über der Eingabe, statt in der langen Liste zu verschwinden.
   (Die Eingabe selbst wird dann vom Composer sticky gehalten, nicht mehr selbst.) */
.composer { position: sticky; bottom: 0; z-index: 5; }
.composer .inputbar { position: static; }
/* Bei offenen Vorschlägen deckend hinterlegen, sonst scheint die Liste durch. */
.composer:has(.suggestions.open) { background: var(--card-color); }
.chip {
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface2);
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
}

/* ── ToDo-Zeilen ───────────────────────────────────────────────────────────── */
.todo-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 6px;
}
.todo-card .swipe-under {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 18px;
  background: var(--red); color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.todo-card .swipe-under-edit {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-start;
  padding-left: 18px;
  background: #2f6fd4; color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.todo-card.dragging-left .swipe-under,
.todo-card.is-deleting .swipe-under { opacity: 1; }
.todo-card.dragging-right .swipe-under-edit { opacity: 1; }
/* Angehobene Karte während des Long-Press-Reorderns: in Accent-Farbe getönt */
.todo-card.todo-dragging .todo-content {
  box-shadow: 0 6px 16px rgba(0,0,0,.32);
  background: color-mix(in srgb, var(--accent) 22%, var(--row));
  outline: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
}
.todo-content {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--row);
  transition: transform .18s ease;
  /* pan-y → natives vertikales Scrollen (mit Schwung) bleibt erhalten; der
     horizontale Swipe wird per JS behandelt. Reorder läuft über den Griff
     (touch-action:none nur dort). */
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: pointer;
}
.todo-content.is-dragging { transition: none; }
.todo-handle {
  flex: none;
  align-self: stretch;
  display: flex;
  align-items: center;
  padding: 0 2px 0 6px;
  margin-left: 2px;
  color: var(--muted);
  cursor: grab;
  touch-action: none;              /* dragging the handle never scrolls */
  -webkit-touch-callout: none;
}
.todo-handle:active { cursor: grabbing; }
.todo-main { flex: 1; min-width: 0; }
.todo-title {
  display: block;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.todo-card.done-row .todo-title { text-decoration: line-through; color: var(--muted); }
.todo-info {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 1px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* Alle Chips (und künftige Buttons) einer Aufgabe in EINER Zeile nebeneinander,
   wie in der ToDoList: Avatare, Menge, Fälligkeit, Priorität, dann Buttons.
   Inline (nicht gestapelt) vertikal zentriert; im gestapelten Zustand siehe unten. */
.todo-meta {
  display: flex;
  flex-direction: row;
  align-items: center;
  align-self: center;
  gap: 6px;
  flex: none;
}
/* Belegt die Chip-/Button-Zeile mehr als die Hälfte der Task-Breite (per JS
   gemessen, Klasse .stacked), rutscht sie als eigene Zeile unter den restlichen
   Inhalt und richtet sich rechtsbündig aus. */
/* Chips + Drag-Griff bilden eine gemeinsame Zeile (.todo-side) — der Griff darf
   nie aus Platzmangel umbrechen, er steht immer neben den Chips. */
.todo-side {
  display: flex;
  flex-direction: row;
  align-items: center;
  align-self: center;
  gap: 6px;
  flex: none;
}
.todo-content.stacked { flex-wrap: wrap; }
.todo-content.stacked .todo-side {
  flex-basis: 100%;
  justify-content: flex-end;
  align-self: flex-start;
  margin-top: 6px;
}
/* Prioritäts-Chip — identisch zur ToDoList-Kachel (.badge.high/normal/low) */
.badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  background-color: var(--surface2);
  color: var(--muted);
  white-space: nowrap;
}
/* Inhaltsbreit statt min-width:60px (ToDoList) — in der Kachel-Zeile teilen sich
   Avatare, Menge, Fälligkeit und Priorität den Platz, breite Chips würden die
   Zeile sprengen. */
.badge.high, .badge.normal, .badge.low {
  display: inline-flex;
  justify-content: center;
}
.badge.high   { color: var(--text); background-color: rgba(255, 0, 0, 0.2); }
.badge.low    { color: var(--text); background-color: rgba(200, 200, 200, 0.2); }
.badge.normal { color: var(--text); background-color: color-mix(in srgb, var(--accent) 30%, transparent); }
/* Menge sowie Wiederholung/Benachrichtigung: gleicher Chip-Stil (neutraler
   Hintergrund, Akzentfarbe). */
/* Chips für Anzahl/Wiederholung/Erinnerung wie den Prioritäts-Chip "Normal"
   darstellen (accent-getönter Pill + Textfarbe) — in beiden Themes identisch. */
.badge.quantity, .badge.attr {
  font-weight: 700;
  color: var(--text);
  background-color: color-mix(in srgb, var(--accent) 30%, transparent);
}
.badge.attr { display: inline-flex; align-items: center; }
/* Fälligkeits-Badge — Optik identisch zur ToDoList-Kachel (neutral umrandet,
   überfällig rot, heute orange). Immer mit Text — nie nur das Kalender-Icon. */
.badge.due-badge { display: inline-flex; align-items: center; gap: 6px; }
.badge.due-badge .due-icon { display: none; }
.badge.due-badge.due-overdue { color: var(--text); background-color: rgba(255, 0, 0, 0.2); }
.badge.due-badge.due-today   { color: var(--text); background-color: rgba(255, 165, 0, 0.2); }
.todo-card.drag-over { outline: 2px dashed var(--accent); }

/* Avatare */
.avatar-stack { display: flex; }
.avatar-stack .avatar {
  width: 24px; height: 24px;
  border-radius: 999px;
  object-fit: cover;
  border: 1.5px solid var(--card-color);
  margin-left: -7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.avatar-stack .avatar:first-child { margin-left: 0; }
.avatar-stack .avatar-more { background: var(--surface2); color: var(--text); }

/* ── Favoriten ─────────────────────────────────────────────────────────────── */
.fav-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: 12px;
  background: var(--surface);
  margin-bottom: 6px;
  cursor: pointer;
}
.fav-badge {
  width: 38px; height: 38px;
  flex: none;
  border-radius: 10px;
  background: color-mix(in srgb, #ff2d55 18%, transparent);
  color: #ff2d55;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.fav-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fav-name { font-size: 15px; font-weight: 600; }
.fav-count { font-size: 12.5px; color: var(--muted); }
.fav-cart-btn { font-size: 17px; color: var(--accent); padding: 6px; }
.fav-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.fav-actions button {
  padding: 11px;
  border-radius: 12px;
  background: var(--surface);
  font-weight: 600;
  color: var(--accent);
}
.fav-actions button.destructive { color: var(--red); }

/* ── Overlays / Sheets ─────────────────────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: none;
  flex-direction: column;
  justify-content: flex-end;
  background: rgba(0, 0, 0, .45);
}
.overlay.open { display: flex; }
.overlay-card {
  background: var(--card-color);
  border-radius: 18px 18px 0 0;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}
.overlay-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
}
.overlay-title { font-size: 17px; font-weight: 700; }
.btn-close-overlay { font-size: 18px; color: var(--muted); padding: 4px 8px; }
.overlay-body {
  padding: 8px 16px 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.overlay-body::-webkit-scrollbar { width: 6px; height: 6px; }
.overlay-body::-webkit-scrollbar-track { background: transparent; }
.overlay-body::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}
.form-row label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 4px;
}
.form-row.inline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.form-row.inline label { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--text); }
.form-row.inline input[type="date"],
.form-row.inline input[type="datetime-local"],
.form-row.inline select { width: auto; max-width: 60%; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .knob {
  position: absolute; inset: 0;
  border-radius: 999px;
  background: var(--surface2);
  transition: background .15s ease;
  pointer-events: none;
}
.switch .knob::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 999px;
  background: #fff;
  transition: transform .15s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .knob { background: var(--accent); }
.switch input:checked + .knob::after { transform: translateX(18px); }
.assign-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  cursor: pointer;
}
.assign-row .avatar {
  width: 30px; height: 30px;
  border-radius: 999px;
  object-fit: cover;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
}
.assign-row .check { margin-left: auto; color: var(--accent); opacity: 0; font-size: 15px; }
.assign-row.selected .check { opacity: 1; }
/* KI-Review: erkannte Aufgaben mit Häkchen */
.ai-status { padding: 24px 4px; text-align: center; color: var(--muted); font-size: 14px; }
.ai-spinner {
  width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 999px;
  border: 3px solid color-mix(in srgb, var(--content-color) 18%, transparent);
  border-top-color: var(--accent); animation: ai-spin .8s linear infinite;
}
@keyframes ai-spin { to { transform: rotate(360deg); } }
.ai-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; cursor: pointer;
  border-bottom: 1px solid color-mix(in srgb, var(--content-color) 8%, transparent);
}
.ai-row .ai-box {
  flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px;
  border: 2px solid color-mix(in srgb, var(--content-color) 30%, transparent);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px;
}
.ai-row.selected .ai-box { background: var(--accent); border-color: var(--accent); }
.ai-row .ai-box i { opacity: 0; }
.ai-row.selected .ai-box i { opacity: 1; }
.ai-main { flex: 1; min-width: 0; }
.ai-title { font-size: 15px; font-weight: 600; }
.ai-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
/* KI-Rezeptkopf: Titel + Portionen mit Mengen-Stepper */
.ai-recipe-head { padding: 2px 0 12px; margin-bottom: 6px; border-bottom: 1px solid color-mix(in srgb, var(--content-color) 12%, transparent); }
.ai-recipe-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.ai-portions { display: flex; align-items: center; gap: 12px; }
.ai-portions-label { font-size: 14px; color: var(--muted); }
.ai-step { flex: none; width: 30px; height: 30px; border-radius: 999px; font-size: 18px; line-height: 1; cursor: pointer; color: var(--content-color); border: 1px solid color-mix(in srgb, var(--content-color) 22%, transparent); background: color-mix(in srgb, var(--content-color) 6%, transparent); }
.ai-step:disabled { opacity: .35; cursor: default; }
/* KI: in Favoritenliste speichern */
.ai-fav-section { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.ai-fav-section:first-child { margin-top: 2px; }
.ai-fav-new { display: flex; gap: 8px; align-items: center; }
.ai-fav-new input { flex: 1; }
/* KI-Quelle wählen (Foto / URL) */
.ai-source-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px 14px; border-radius: 12px; cursor: pointer;
  font-size: 15px; font-weight: 600;
  border: 1px solid color-mix(in srgb, var(--content-color) 16%, transparent);
  background: color-mix(in srgb, var(--content-color) 6%, transparent);
  color: var(--content-color);
}
.ai-source-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ai-or { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: var(--muted); font-size: 13px; }
.ai-or::before, .ai-or::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--content-color) 12%, transparent); }
#aiUrlInput { width: 100%; margin-bottom: 10px; }
.overlay-footer {
  display: flex;
  gap: 10px;
  padding: 0 16px 16px;
}
.overlay-footer button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-weight: 700;
  background: var(--surface);
}
.overlay-footer button.primary { background: var(--accent); color: #fff; }
.overlay-footer button.destructive { color: var(--red); }
.overlay-footer button:disabled { opacity: .4; }

/* Menü-Popover */
.menu-pop {
  position: fixed;
  z-index: 70;
  min-width: 230px;
  background: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 5%);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35);
  overflow: hidden;
  display: none;
}
.menu-pop.open { display: block; }
.menu-pop button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  font-size: 14.5px;
  white-space: normal;
  word-break: break-word;
}
.menu-pop button:active { background: var(--surface); }
.menu-pop button.destructive { color: var(--red); }
.menu-pop .menu-sep { height: 1px; background: var(--border); }
.menu-pop .menu-label { padding: 8px 14px 2px; font-size: 12px; color: var(--muted); font-weight: 700; }
.menu-pop button .check { margin-left: auto; color: var(--accent); }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 14px);
  transform: translateX(-50%) translateY(8px);
  background: rgba(0,0,0,.78);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  opacity: 0;
  transition: opacity .2s ease, transform .2s ease;
  pointer-events: none;
  z-index: 80;
  max-width: 90%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty-state {
  text-align: center;
  color: var(--muted);
  padding: 44px 16px;
}
.empty-state i { font-size: 34px; margin-bottom: 10px; display: block; }

/* ── Scanner (aus dem ShoppingList-Modul übernommen) ──────────────────────── */
.scanner-body {
  flex: 1;
  min-height: 0;
  padding: var(--gap);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: auto;
}
.scanner-video-wrap {
  position: relative;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #000;
  overflow: hidden;
  aspect-ratio: 4 / 3;
}
.scanner-video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner-scanline {
  position: absolute;
  left: 8%; right: 8%; top: 24%;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(0,255,195,0) 0%, rgba(0,255,195,1) 50%, rgba(0,255,195,0) 100%);
  box-shadow: 0 0 10px rgba(0,255,195,.65);
  animation: scanner-line-move 2.1s ease-in-out infinite;
  pointer-events: none;
}
.scanner-result {
  position: absolute;
  left: 50%; top: 50%;
  z-index: 2;
  width: min(92%, 560px);
  padding: 14px 16px;
  border-radius: 14px;
  background: rgba(0,0,0,.68);
  color: #fff;
  font-size: clamp(16px, 4.2vw, 21px);
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  min-height: 0;
  opacity: 0;
  transform: translate(-50%, -46%);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}
.scanner-result.show { opacity: 1; transform: translate(-50%, -50%); }
.scanner-result.error { background: rgba(192,57,43,.78); }
@keyframes scanner-line-move {
  0% { top: 24%; opacity: .95; }
  50% { top: 76%; opacity: 1; }
  100% { top: 24%; opacity: .95; }
}
.scanner-status {
  display: block;
  font-size: 13px;
  color: var(--muted);
  min-height: 20px;
  text-align: center;
  padding: 6px 8px 0;
  word-break: break-word;
}
.scanner-status:empty { display: none; }
.scanner-status.success { color: #2e7d32; }
.scanner-status.error { color: #c0392b; }
  </style>

<body>
<div class="app">
  <main style="display:flex; flex-direction:column; flex:1; min-height:0;">

    <section id="screen-dashboard" class="screen active">
      <div class="content" id="dashboardContent"></div>
    </section>

    <section id="screen-shopping" class="screen">
      <div class="content">
        <div class="screen-head">
          <select id="shoppingSwitcher" class="list-switcher" style="display:none;"></select>
          <h2 id="shoppingTitle"></h2>
          <button id="btnShoppingMenu" class="icon-btn" aria-label="Menü"><i class="fa-light fa-ellipsis"></i></button>
        </div>
        <div id="shoppingListArea"></div>
        <div class="composer">
          <div id="suggestions" class="suggestions"><div class="chip-flow" id="suggestionChips"></div></div>
          <div class="inputbar">
            <input id="shoppingInput" type="text" autocomplete="off" />
            <button id="btnShopScan" class="round-btn secondary" aria-label="Foto/URL analysieren"><i class="fa-light fa-wand-magic-sparkles"></i></button>
            <button id="btnOpenScanner" class="round-btn secondary" aria-label="Barcode scannen"><i class="fa-light fa-barcode"></i></button>
            <button id="btnShoppingAdd" class="round-btn" aria-label="Hinzufügen" disabled><i class="fa-light fa-plus"></i></button>
          </div>
          <input id="shopScanInput" type="file" accept="image/*" capture="environment" style="display:none" />
        </div>
      </div>
    </section>

    <section id="screen-todos" class="screen">
      <div class="content">
        <div id="todoMembers" class="member-bar todo-members" style="display:none;"></div>
        <div class="screen-head">
          <select id="todoSwitcher" class="list-switcher" style="display:none;"></select>
          <h2 id="todoTitle"></h2>
          <button id="btnTodoMenu" class="icon-btn" aria-label="Menü"><i class="fa-light fa-ellipsis"></i></button>
        </div>
        <div id="todoListArea"></div>
        <div class="inputbar">
          <input id="todoInput" type="text" autocomplete="off" />
          <button id="btnTodoScan" class="round-btn secondary" aria-label="Foto scannen"><i class="fa-light fa-camera"></i></button>
          <button id="btnTodoAdd" class="round-btn" aria-label="Hinzufügen" disabled><i class="fa-light fa-plus"></i></button>
        </div>
        <input id="todoScanInput" type="file" accept="image/*" capture="environment" style="display:none" />
      </div>
    </section>

    <section id="screen-favorites" class="screen">
      <div class="content" id="favoritesContent"></div>
    </section>

  </main>

  <nav class="tabbar">
    <button id="tab-dashboard" class="active"><i class="fa-light fa-grid-2"></i><span></span></button>
    <button id="tab-shopping"><i class="fa-light fa-basket-shopping"></i><span></span></button>
    <button id="tab-todos"><i class="fa-light fa-list-check"></i><span></span></button>
    <button id="tab-favorites"><i class="fa-light fa-heart"></i><span></span></button>
  </nav>
</div>

<!-- Artikel bearbeiten / anlegen -->
<div class="overlay" id="editOverlay">
  <div class="overlay-card">

<script>
// In einer IIFE gekapselt: die Symcon-Tile-Visu injiziert selbst globale
// Bindungen (const translate, const requestAction …). Ohne Kapselung würden
// unsere gleichnamigen Top-Level-Deklarationen mit „Identifier already
// declared“ kollidieren und das gesamte Script abbrechen (handleMessage
// wäre nie definiert). Genau wie das ShoppingList-Modul.
(function () {
'use strict';

// Hell-Theme: Kachelfläche aufhellen wie in der Web-App. Hell/Dunkel aus der
// Luminanz der Kartenfarbe (in der Visu injiziert; im Browser vom Web-Adapter
// gesetzt). Der Web-Adapter setzt --row zusätzlich inline — konsistenter Wert.
(function symdoLightTiles(){
  try { var st = document.createElement('style');
    st.textContent = 'html[data-symdo-theme="light"]{--row:color-mix(in srgb, var(--card-color) 95%, var(--content-color) 5%)}';
    (document.head || document.documentElement).appendChild(st); } catch (e) {}
  function apply(){ try {
    var p = document.createElement('span');
    p.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(--card-color)';
    (document.body || document.documentElement).appendChild(p);
    var c = getComputedStyle(p).color; p.remove();
    var m = /(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(c); if (!m) return;
    var l = 0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3];
    document.documentElement.setAttribute('data-symdo-theme', l < 128 ? 'dark' : 'light');
  } catch (e) {} }
  apply();
  try { if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply); } catch (e) {}
})();

// ── System-Kachelränder aus den URL-Parametern übernehmen ──────────────────
// Die Tile-Visu übergibt margintop/marginside/marginbottom in der Query. Wir
// wenden sie selbst als Padding an (siehe .app), damit der Inhalt nicht unter
// die vom System überlagerten Steuerelemente oben rutscht. So früh wie möglich
// setzen, damit die Variablen vor dem ersten Paint greifen.
(function applySystemMargins() {
  try {
    const p = new URLSearchParams(window.location.search);
    const px = (name) => {
      const v = parseInt(p.get(name), 10);
      return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    const root = document.documentElement.style;
    const mt = px('margintop');   if (mt !== null) root.setProperty('--sym-mt', mt);
    const ms = px('marginside');  if (ms !== null) root.setProperty('--sym-ms', ms);
    const mb = px('marginbottom'); if (mb !== null) root.setProperty('--sym-mb', mb);
  } catch (e) { /* ohne Query: Defaults (0) greifen */ }
})();

// ── Echte Scrollbalken-Breite messen und --sbw setzen ──────────────────────
// Die reservierte Breite variiert je Plattform (Desktop-Webkit ~6–15px). Wir
// messen sie an einem .screen-Probe (bekommt dieselbe ::-webkit-scrollbar-
// Regel), damit Inhaltsabstand und Balken-Zentrierung exakt stimmen.
(function measureScrollbar() {
  try {
    const probe = document.createElement('div');
    probe.className = 'screen';
    probe.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:block;width:100px;height:100px;padding:0;';
    probe.innerHTML = '<div style="height:200px"></div>';
    document.body.appendChild(probe);
    const w = probe.offsetWidth - probe.clientWidth;
    probe.remove();
    if (Number.isFinite(w) && w >= 0) {
      document.documentElement.style.setProperty('--sbw', w + 'px');
    }
  } catch (e) { /* Default --sbw (6px) greift */ }
})();

// ── Shims (Symcon injiziert translate/requestAction; Fallback postMessage) ──
const translate = (typeof window.translate === 'function')
  ? window.translate
  : (key) => String(key ?? '');

const requestAction = (typeof window.requestAction === 'function')
  ? window.requestAction
  : (ident, value) => {
      try { window.parent.postMessage(JSON.stringify({ type: 'requestAction', ident: String(ident), value }), '*'); } catch (e) {}
      try { window.parent.postMessage({ type: 'requestAction', ident: String(ident), value }, '*'); } catch (e) {}
    };

function escapeHtml(s) {
  return String(s)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

// ── Store: Aggregat aller Listen (Schema siehe module.php BuildFullPayload) ─
const store = {
  users: [],
  defaultUserID: '',
  bridgeAvailable: false,
  hiddenIDs: [],
  instances: [],
  states: {},        // "<id>" → {kind, revision, state}
  images: {},
  brands: {},
  shoppingExtras: {} // "<id>" → {imageBase, extApiBase}
};

// Kompat-Schicht für die aus dem ShoppingList-Modul übernommenen Blöcke
// (Scanner, Bild-Resolver): globales `state` = State der GEWÄHLTEN Einkaufsliste.
let state = {};

let activeTab = localStorage.getItem('symdo.tab') || 'dashboard';
let favDetailListId = null; // Favoriten: geöffnete Listen-Detailansicht
let dashPriority = localStorage.getItem('symdo.dashboardPriority') || '';
let dashMemberIds = new Set(); // Mehrfachauswahl im Dashboard-Member-Menü
let todoMemberIds = new Set(); // Mehrfachauswahl im ToDo-Tab-Member-Menü
let completedExpanded = localStorage.getItem('symdo.completedExpanded') === '1';
// „Zuletzt benutzt" startet wie in der App eingeklappt (nur In-Memory)
let cartExpanded = false;

function visibleInstances(kind) {
  return store.instances.filter(i => i.kind === kind && !i.hidden);
}
function instState(id) {
  const entry = store.states[String(id)];
  return entry && entry.state ? entry.state : null;
}
function selectedShoppingID() {
  const vis = visibleInstances('shopping');
  const saved = parseInt(localStorage.getItem('symdo.selectedShoppingID')) || 0;
  if (vis.some(i => i.id === saved)) return saved;
  return vis.length ? vis[0].id : 0;
}
function selectedTodoID() {
  const vis = visibleInstances('todo');
  const saved = parseInt(localStorage.getItem('symdo.selectedTodoID')) || 0;
  if (vis.some(i => i.id === saved)) return saved;
  return vis.length ? vis[0].id : 0;
}
function currentUserID() { return String(store.defaultUserID || ''); }

// `state`, Hook-URLs und Bild-Maps auf die gewählte Einkaufsliste ausrichten
function syncCompat() {
  const id = selectedShoppingID();
  state = instState(id) || {};
  const extras = store.shoppingExtras[String(id)] || {};
  // Bilder nur, wenn DIESE Liste ShowProductImages aktiv hat (imagesEnabled) —
  // sonst kein Hook → getProductImageUrl liefert null → Initialen
  window.__imageHookUrl = extras.imagesEnabled ? (extras.imageBase || '') : '';
  window.__extApiHookUrl = extras.extApiBase || '';
  if (productImages !== store.images) {
    productImages = store.images || {};
    productBrands = store.brands || {};
    _rebuildPiKeys();
  }
  // Duplikat-Erkennung des Scanners mit dem frischen State abgleichen
  if (typeof syncScannerAddedNames === 'function') syncScannerAddedNames();
}

// ── Produktbilder (aus dem ShoppingList-Modul übernommen; Lookup gespiegelt
//    in App + Kacheln — alle Stellen synchron halten) ────────────────────────
let productImages = {};
let productBrands = {};
let _piKeys = [];
let _piBrandKeys = [];
const _piCache = new Map();
function _rebuildPiKeys() {
  const byLength = (a, b) => b.length - a.length || (a < b ? -1 : a > b ? 1 : 0);
  _piKeys = Object.keys(productImages).filter(k => k.length > 1).sort(byLength);
  _piBrandKeys = Object.keys(productBrands).filter(k => k.length > 1).sort(byLength);
  _piCache.clear();
}
const _piIsLetter = (ch) => /\p{L}/u.test(ch);
const _piFold = (s) => s.replaceAll('ä', 'ae').replaceAll('ö', 'oe').replaceAll('ü', 'ue').replaceAll('ß', 'ss');
const _piUnfold = (s) => s.replaceAll('ae', 'ä').replaceAll('oe', 'ö').replaceAll('ue', 'ü').replaceAll('ss', 'ß');
function _piCandidates(key) {
  const out = [];
  const push = (v) => { if (v && !out.includes(v)) out.push(v); };
  push(key); push(_piFold(key)); push(_piUnfold(key));
  for (const suffix of ['nen', 'en', 'er', 'es', 'se', 'n', 'e', 's']) {
    if (key.length > suffix.length + 2 && key.endsWith(suffix)) {
      const stem = key.slice(0, -suffix.length);
      push(stem); push(_piFold(stem)); push(_piUnfold(stem));
    }
  }
  return out;
}
function _piWholeWord(text, word) {
  let idx = text.indexOf(word);
  while (idx !== -1) {
    const before = idx === 0 || !_piIsLetter(text[idx - 1]);
    const after = idx + word.length >= text.length || !_piIsLetter(text[idx + word.length]);
    if (before && after) return true;
    idx = text.indexOf(word, idx + 1);
  }
  return false;
}
function _piResolve(key) {
  const candidates = _piCandidates(key);
  for (const c of candidates) {
    if (productImages[c]) return productImages[c];
  }
  for (const k of _piBrandKeys) {
    for (const c of candidates) {
      if (_piWholeWord(c, k)) return productBrands[k];
    }
  }
  for (const k of _piKeys) {
    for (const c of candidates) {
      if (c.length > k.length && c.endsWith(k)) return productImages[k];
    }
  }
  for (const k of _piKeys) {
    for (const c of candidates) {
      if (c.length > k.length && _piWholeWord(c, k)) return productImages[k];
    }
  }
  return null;
}
function getProductImageUrl(name, apiImageUrl) {
  if (apiImageUrl) {
    return window.__imageHookUrl + encodeURIComponent(apiImageUrl);
  }
  if (!window.__imageHookUrl) return null;
  const key = (name || '').normalize().toLowerCase();
  if (!key) return null;
  let file = _piCache.get(key);
  if (file === undefined) {
    file = _piResolve(key);
    _piCache.set(key, file);
  }
  return file ? window.__imageHookUrl + encodeURIComponent(file) : null;
}
// Bildauflösung wie in der App: Scan-Bild → Name → Notiz → Initial-Fallback
function resolveItemImage(item) {
  if (item.imageUrl) return getProductImageUrl('', item.imageUrl);
  return getProductImageUrl(item.name) || getProductImageUrl(item.notes || '');
}

// ── Kategorie-Stile (Port von ListsDesign/CategoryStyle.swift) ─────────────
const CATEGORY_STYLES = {
  'obst & gemüse':        { icon: 'fa-carrot',          tint: '#34c759' },
  'milch & käse':         { icon: 'fa-cheese',          tint: '#5ac8fa' },
  'backwaren':            { icon: 'fa-croissant',       tint: '#a2845e' },
  'fleisch & wurst':      { icon: 'fa-utensils',        tint: '#ff4d4d' },
  'tiefkühl':             { icon: 'fa-snowflake',       tint: '#40c8e0' },
  'getränke':             { icon: 'fa-glass-water',     tint: '#3498fa' },
  'snacks & süßes':       { icon: 'fa-popcorn',         tint: '#ff2d55' },
  'konserven & trocken':  { icon: 'fa-box',             tint: '#ff9500' },
  'hygiene & pflege':     { icon: 'fa-shower',          tint: '#00c7be' },
  'haushalt & reinigung': { icon: 'fa-soap',            tint: '#5856d6' },
  'baby & tier':          { icon: 'fa-paw',             tint: '#af52de' },
  'sonstiges':            { icon: 'fa-grid-2',          tint: '#8e8e93' }
};
const HASH_PALETTE = ['#3498fa', '#34c759', '#ff9500', '#af52de', '#ff2d55', '#40c8e0', '#5856d6', '#00c7be'];
function hashedTint(name) {
  let h = 5381;
  for (const ch of String(name || '')) h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
  return HASH_PALETTE[Math.abs(h) % HASH_PALETTE.length];
}
function categoryStyle(category) {
  const key = String(category || '').toLowerCase();
  return CATEGORY_STYLES[key] || { icon: 'fa-basket-shopping', tint: hashedTint(key) };
}

// ── Avatare (aus dem ToDoList-Modul übernommen, Quelle = store.users) ──────
function avatarTint(name) {
  return hashedTint(name);
}
function usersById() {
  const map = {};
  (Array.isArray(store.users) ? store.users : []).forEach(u => { map[u.id] = u; });
  return map;
}
function avatarHtml(u, cls) {
  if (u.avatar) {
    return `<img class="${cls}" src="${escapeHtml(u.avatar)}" alt="" title="${escapeHtml(u.name)}" />`;
  }
  const initial = escapeHtml(String(u.name || '?').charAt(0).toUpperCase());
  return `<span class="${cls}" title="${escapeHtml(u.name)}" style="background:${avatarTint(u.name)}">${initial}</span>`;
}
function renderAvatarStack(ids) {
  const byId = usersById();
  const resolved = (Array.isArray(ids) ? ids : []).map(id => byId[id]).filter(Boolean);
  if (resolved.length === 0) return '';
  const max = 3;
  let html = '<div class="avatar-stack">';
  resolved.slice(0, max).forEach(u => { html += avatarHtml(u, 'avatar'); });
  if (resolved.length > max) {
    html += `<span class="avatar avatar-more">+${resolved.length - max}</span>`;
  }
  html += '</div>';
  return html;
}

// ── Fälligkeit (Ports: DueClassifier aus der App, formatDue aus ToDoList) ──
function localDayStr(d) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function todayStr() { return localDayStr(new Date()); }
// dueDay ('Y-m-d', TZ-neutral) gewinnt über den due-Timestamp — exakt wie
// DueClassifier in der App
function classifyDue(item) {
  const dueDay = String(item.dueDay || '');
  if (/^\d{4}-\d{2}-\d{2}$/.test(dueDay)) {
    const t = todayStr();
    if (dueDay < t) return 'overdue';
    if (dueDay === t) return 'today';
    return 'upcoming';
  }
  const due = parseInt(item.due) || 0;
  if (due <= 0) return 'none';
  if (due < Math.floor(Date.now() / 1000)) return 'overdue';
  if (localDayStr(new Date(due * 1000)) === todayStr()) return 'today';
  return 'upcoming';
}
function dueDateOf(item) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(item.dueDay || ''));
  if (m) return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3]));
  const due = parseInt(item.due) || 0;
  return due > 0 ? new Date(due * 1000) : null;
}
function dayDiff(from, to) {
  const a = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const b = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  return Math.round((b - a) / 86400000);
}
// Farbige Untertitel-Segmente wie auf dem App-Dashboard: nur der Zeit-Teil
// ist rot/orange, der Listenname bleibt sekundär
function dueSubtitleSegments(item, listName, showListName) {
  const segs = [];
  const cls = classifyDue(item);
  const d = dueDateOf(item);
  if (cls === 'overdue' && d) {
    const days = dayDiff(d, new Date());
    let text;
    if (days <= 0) text = translate('Was due today');
    else if (days === 1) text = translate('Due yesterday');
    else text = translate('Overdue for %1 days').replace('%1', String(days));
    segs.push({ text, cls: 'seg-overdue' });
  } else if (cls === 'today') {
    const due = parseInt(item.due) || 0;
    if (due > 0 && item.dueAllDay !== true) {
      const t = new Date(due * 1000);
      const hh = String(t.getHours()).padStart(2, '0');
      const mm = String(t.getMinutes()).padStart(2, '0');
      segs.push({ text: `${translate('Today')}, ${hh}:${mm}`, cls: 'seg-today' });
    } else {
      segs.push({ text: translate('Today'), cls: 'seg-today' });
    }
  } else if (cls === 'upcoming' && d) {
    const days = dayDiff(new Date(), d);
    const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
    segs.push({ text: rtf.format(days, 'day'), cls: '' });
  }
  if (showListName && listName) {
    segs.push({ text: (segs.length ? ' · ' : '') + listName, cls: '' });
  }
  return segs;
}
// Due-Chip der ToDo-Zeile (Semantik aus dem ToDoList-Modul: ganztägig über
// dueDay, sonst relative Kurzform)
function formatDueChip(item) {
  const due = parseInt(item.due) || 0;
  if (due <= 0) return null;
  if (item.dueAllDay) {
    const d = dueDateOf(item);
    if (!d) return null;
    if (localDayStr(d) === todayStr()) return translate('Today');
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  const diffSec = due - Math.floor(Date.now() / 1000);
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto', style: 'short' });
  const abs = Math.abs(diffSec);
  if (abs < 3600) return rtf.format(Math.round(diffSec / 60), 'minute');
  if (abs < 86400) return rtf.format(Math.round(diffSec / 3600), 'hour');
  return rtf.format(Math.round(diffSec / 86400), 'day');
}

// ── Prioritäten / Wiederholungen (Codes wie im ToDoList-Modul) ─────────────
function priorityKey(p) {
  const s = String(p || 'normal');
  return s === 'high' ? 'high' : (s === 'low' ? 'low' : 'normal');
}
function priorityLabel(p) {
  const k = priorityKey(p);
  return translate(k === 'high' ? 'High' : (k === 'low' ? 'Low' : 'Normal'));
}
function recurrenceLabel(r, unit, val) {
  if (String(r) === 'custom') {
    const v = parseInt(val) || 1;
    const unitLabel = { h: translate('Hours'), d: translate('Days'), m: translate('Months'), y: translate('Years') }[String(unit || 'w')] || translate('Weeks');
    return `${translate('Custom')}: ${v} ${unitLabel}`;
  }
  switch (String(r)) {
    case 'w1': return translate('Every week');
    case 'w2': return translate('Every 2 weeks');
    case 'w3': return translate('Every 3 weeks');
    case 'm1': return translate('Monthly');

// ── Protokoll: Call/GetState/CheckRevisions ────────────────────────────────
let txnCounter = 0;
function sdCall(instanceID, action, payload) {
  const txn = 'tx' + (++txnCounter);
  requestAction('Call', JSON.stringify({ instanceID, action, payload, txn }));
}
function requestState() { requestAction('GetState', 0); }
function checkRevisions() {
  const revisions = {};
  for (const inst of store.instances) {
    if (inst.hidden) continue;
    const entry = store.states[String(inst.id)];
    revisions[String(inst.id)] = entry ? entry.revision : -1;
  }
  if (Object.keys(revisions).length > 0) {
    requestAction('CheckRevisions', JSON.stringify({ revisions }));
  } else {
    requestState();
  }
}

// ── Nachrichten vom Modul ──────────────────────────────────────────────────
function handleMessage(data) {
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { return; }
  }
  if (!data || typeof data !== 'object') return;
  if (data.type === 'state') {
    store.users = data.users || [];
    store.defaultUserID = data.defaultUserID || '';
    store.bridgeAvailable = !!data.bridgeAvailable;
    store.hiddenIDs = data.hiddenIDs || [];
    store.instances = data.instances || [];
    store.states = data.states || {};
    store.images = data.images || {};
    store.brands = data.brands || {};
    store.shoppingExtras = data.shoppingExtras || {};
    productImages = {}; // Kennung: Maps im nächsten syncCompat neu übernehmen
    syncCompat();
    renderAll();
  } else if (data.type === 'instanceState') {
    if (data.ok === false) {
      showToast(translate('Action failed'));
    }
    if (data.state && data.instanceID) {
      store.states[String(data.instanceID)] = {
        kind: data.kind,
        revision: data.revision,
        state: data.state
      };
      syncCompat();
      renderAll();
      // Offene Overlays, die nicht Teil eines Tab-Containers sind, aus dem
      // frischen State neu zeichnen (korrigiert auch verworfene Aktionen)
      if (document.getElementById('favPickOverlay').classList.contains('open')) renderFavPicker();
    }
  } else if (data.type === 'meta') {
    store.instances = data.instances || [];
    store.hiddenIDs = data.hiddenIDs || [];
    store.bridgeAvailable = !!data.bridgeAvailable;
    for (const key of Object.keys(store.states)) {
      const inst = store.instances.find(i => String(i.id) === key);
      if (!inst || inst.hidden) delete store.states[key];
    }
    syncCompat();
    renderAll();
    checkRevisions(); // fehlende States neu eingeblendeter Listen nachladen
  }
}
window.handleMessage = handleMessage;
window.updateState = handleMessage;
window.addEventListener('message', (event) => { if (event) handleMessage(event.data); });

// Wisch-Geste (aus dem ShoppingList-Modul übernommen, Callback statt Action)
// Swipe on a card: left = delete, right = edit (when onEdit is given).
// Mouse + touch events (no Pointer Events): the Symcon desktop webview delivers
// no pointer events, so a pointer-only swipe is dead there.
function bindCardSwipe(card, contentSel, onDelete, onEdit) {
  const content = card.querySelector(contentSel);
  if (!content) return;
  let startX = 0, startY = 0, dx = 0;
  let active = false, decided = false, usingTouch = false;
  const SLOP = 8, THRESHOLD = 64;
  const clearDir = () => card.classList.remove('dragging-left', 'dragging-right');
  const cleanup = () => {
    active = false; decided = false;
    content.classList.remove('is-dragging');
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    document.removeEventListener('touchmove', onTouchMove, true);
    document.removeEventListener('touchend', onTouchEnd, true);
    document.removeEventListener('touchcancel', onTouchEnd, true);
  };
  const begin = (target, x, y) => {
    if (target.closest('button')) return false;
    if (card.dataset.animating === '1') return false;
    active = true; decided = false;
    startX = x; startY = y; dx = 0;
    return true;
  };
  const move = (x, y) => {
    if (!active) return false;
    const mx = x - startX, my = y - startY;
    if (!decided) {
      if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return false;
      if (Math.abs(my) >= Math.abs(mx)) { cleanup(); return false; } // vertical → scroll
      decided = true;
      content.classList.add('is-dragging');
    }
    const maxRight = onEdit ? content.offsetWidth : 0; // right swipe only when an edit handler exists
    dx = Math.max(-content.offsetWidth, Math.min(maxRight, mx));
    content.style.transform = `translateX(${dx}px)`;
    card.classList.toggle('dragging-left', dx < 0);
    card.classList.toggle('dragging-right', dx > 0);
    return true;
  };
  const end = () => {
    if (!active) return;
    const wasDecided = decided;
    cleanup();
    if (wasDecided && dx <= -THRESHOLD) {
      clearDir();
      card.dataset.animating = '1';
      card.classList.add('is-deleting');
      content.style.transform = 'translateX(-110%)';
      window.setTimeout(onDelete, 240);
    } else if (wasDecided && onEdit && dx >= THRESHOLD) {
      content.style.transform = ''; clearDir(); onEdit();
    } else {
      content.style.transform = ''; clearDir();
    }
    if (wasDecided) {
      card.dataset.swiped = '1';
      window.setTimeout(() => { delete card.dataset.swiped; }, 60);
    }
  };
  const onMouseMove = (e) => { if (move(e.clientX, e.clientY)) e.preventDefault(); };
  const onMouseUp = () => end();
  content.addEventListener('mousedown', (e) => {
    if (usingTouch) return;
    if (e.button !== 0) return;
    if (!begin(e.target, e.clientX, e.clientY)) return;
    document.addEventListener('mousemove', onMouseMove, { passive: false });
    document.addEventListener('mouseup', onMouseUp);
  });
  const onTouchMove = (e) => {
    const t = e.touches && e.touches[0]; if (!t) return;
    if (move(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
  };
  const onTouchEnd = () => { end(); window.setTimeout(() => { usingTouch = false; }, 400); };
  content.addEventListener('touchstart', (e) => {
    const t = e.touches && e.touches[0]; if (!t) return;
    usingTouch = true;
    if (!begin(e.target, t.clientX, t.clientY)) { usingTouch = false; return; }
    document.addEventListener('touchmove', onTouchMove, { passive: false, capture: true });
    document.addEventListener('touchend', onTouchEnd, true);
    document.addEventListener('touchcancel', onTouchEnd, true);
  }, { passive: true });
}
