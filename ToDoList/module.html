/* ── Ladeschirm ─────────────────────────────────────────────────────────────
   Er steht ab dem ersten Aufbau der Seite (Markup gleich hinter <body>) und
   geht, sobald die erste Antwort des Gateways gezeichnet ist. */
let ladeschirmFrist = null;
function ladeschirmWeg() {
  const el = document.getElementById('ladeschirm');
  if (!el || el.classList.contains('geht')) return;
  clearTimeout(ladeschirmFrist);
  el.classList.add('geht');
  // Erst nach dem Ausblenden aus dem Baum nehmen — 350 ms, wie die Ueberblendung
  // im Stil. Entfernen statt verstecken: der Schirm liegt ueber allem, ein
  // durchsichtig gebliebener faenge jede Beruehrung ab.
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 350);
}
// Der Adapter blendet ihn damit weg, wenn statt der App der Kopplungsschirm
// kommt: der liegt zwar darueber, aber ein Schirm, der nie geht, bliebe hinter
// ihm stehen und deckte die App nach dem Koppeln weiter zu.
window.__symdoLadeschirmWeg = ladeschirmWeg;

/* Der Schirm geht erst, wenn die Uebersicht STEHT. Mit dem ersten Zustand sind
   Aufgaben und Einkaeufe da, aber drei Karten fehlen noch und kosten je einen
   eigenen Umlauf: das Briefing, die Zahl der heutigen Termine (die haengt sogar
   an einem zweiten Umlauf hinter der Kalenderliste) und der Stundenplan. Ging
   der Schirm schon mit dem ersten Zustand, sah man genau den Aufbau, den er
   verdecken soll — die Karten rasteten nacheinander ein.

   Mit Deckel: gemessen kostet jeder dieser Abrufe im Haus wenige Millisekunden,
   ueber Connect ein paar hundert. Haengt aber einer, darf er den Start nicht
   aufhalten — nach drei Sekunden geht der Schirm auf jeden Fall, und die
   fehlende Karte kommt dann eben sichtbar nach. */
const LADESCHIRM_DECKEL = 3000;
function ladeschirmWartenAuf(nachlaeufer) {
  const el = document.getElementById('ladeschirm');
  if (!el) { return; }
  // Die Geduldsfrist hat sich erledigt: das Gateway HAT geantwortet.
  clearTimeout(ladeschirmFrist);
  el.classList.remove('dauert');
  const fertig = Promise.allSettled(
    nachlaeufer.filter(v => v && typeof v.then === 'function'));
  const deckel = new Promise(f => setTimeout(f, LADESCHIRM_DECKEL));
  Promise.race([fertig, deckel]).then(ladeschirmWeg);
}

/* Kein Schirm ohne Ausweg. Antwortet das Gateway nicht — kein Netz, Instanz
   aus, Connect gestoert —, gaebe es sonst nichts als den Kreisel: die Anfrage
   wird nicht wiederholt, und die App bliebe fuer immer im Ladezustand. Nach
   zwoelf Sekunden sagt der Schirm deshalb, was los ist, und bietet einen
   zweiten Versuch an. */
function ladeschirmFristStellen() {
  clearTimeout(ladeschirmFrist);
  ladeschirmFrist = setTimeout(() => {
    const el = document.getElementById('ladeschirm');
    if (el) el.classList.add('dauert');
  }, 12000);
}
function ladeschirmGeduld() {
  const el = document.getElementById('ladeschirm');
  if (!el || !window.__SYMDO__) return;
  const hinweis = document.getElementById('ladeHinweis');
  const knopf = document.getElementById('ladeNochmal');
  if (hinweis) hinweis.textContent = translate('The gateway has not answered yet.');
  if (knopf) {
    knopf.textContent = translate('Try again');
    knopf.addEventListener('click', () => {
      el.classList.remove('dauert');
      ladeschirmFristStellen();
      requestState();
    });
  }
  ladeschirmFristStellen();
}

// ── Nachrichten vom Modul ──────────────────────────────────────────────────
// Verwirft die Markup-Caches von renderInto() und setzt hängende Swipe-/Lösch-
// Animationen zurück, damit ein Re-Render nach einer abgelehnten Aktion wirklich
// neu zeichnet.
function invalidateRenderCache() {
  // favMaster/favDetail, nicht favoritesContent: renderFavorites() zeichnet in die
  // beiden Spalten, dort liegen also die _lastHtml-Marken. Der Elternknoten hat nie
  // eine — ihn zu leeren liess eine abgelehnte Favoriten-Aktion ungezeichnet, die
  // weggewischte Zeile blieb bei translateX(-110%) stehen.
  ['dashboardContent', 'shoppingListArea', 'todoListArea', 'favMaster', 'favDetail', 'notesMaster', 'notesDetail', 'todoMembers', 'calMembers', 'calArea', 'kiFinds'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el._lastHtml = null;
  });
  document.querySelectorAll('.item-card, .todo-card, .fav-card, .cal-card, .mail-item').forEach(card => {
    card.classList.remove('is-deleting', 'dragging-left', 'dragging-right');
    delete card.dataset.animating;
    const content = card.querySelector('.item-card-content, .todo-content, .fav-row, .cal-event, .mail-row');
    if (content) content.style.transform = '';
  });
}

function handleMessage(data) {
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { return; }
  }
  if (!data || typeof data !== 'object') return;
  // Die Kachel bekommt den Zustand ihrer Liste flach (items, sortMode, …), die
  // Web-App erwartet ihn in store-Form. Erkennungsmerkmal ist items: das Gateway
  // schickt an dieser Stelle instances/states.
  if (data.type === 'state' && Array.isArray(data.items)) {
    data = kachelZustand(data);
  }
  if (data.type === 'briefingPlay') {
    briefingFernstart();
    return;
  }
  if (data.type === 'aiResult') {
    const cb = __aiPending[data.txn];
    if (cb) { delete __aiPending[data.txn]; cb({ status: data.status || 200, json: data.json || null }); }
    return;
  }
  if (data.type === 'state') {
    store.users = data.users || [];
    store.defaultUserID = data.defaultUserID || '';
    store.gatewayAvailable = !!data.gatewayAvailable;
    store.aiEnabled = !!data.aiEnabled;
    store.tabs = normalizeTabs(data.tabs);
    store.hiddenIDs = data.hiddenIDs || [];
    store.instances = data.instances || [];
    store.states = data.states || {};
    store.images = data.images || {};
    store.brands = data.brands || {};
    store.shoppingExtras = data.shoppingExtras || {};
    productImages = {}; // Kennung: Maps im nächsten syncCompat neu übernehmen
    syncCompat();
    applyTabVisibility();
    renderAll();
    applyAiEnabled();
    // Erst hier, nicht beim Start: vorher sind weder gatewayAvailable noch die
    // Nutzer bekannt — die Mitglieder-Zuordnung haette kein Gesicht.
    loadMailProposals();
    /* Die drei Karten, die der Uebersicht nach dem ersten Zustand noch fehlen.
       Der Ladeschirm bleibt so lange stehen (ladeschirmWartenAuf) — sonst sieht
       man sie einzeln einrasten.
       loadTimetable() MUSS auch hier stehen, nicht nur in gatewayNachladen:
       dieser Weg ist der ERSTE Aufbau, gatewayNachladen laeuft erst beim
       Zurueckkehren oder nach einer Minute. Nur dort eingehaengt, blieb die
       Karte beim Oeffnen leer und erschien erst eine Minute spaeter — im
       Prueflauf als „fehlt" sichtbar. */
    ladeschirmWartenAuf([loadCalendars(), loadBriefing(), loadTimetable()]);
    /* Notizen VORAB holen, nicht erst beim Betreten des Bereichs.
       Bisher stiess renderNotizen() den Abruf beim ersten Zeichnen an — der
       Bereich stand also einen Moment leer da, jedes Mal beim ersten Oeffnen.
       Ein Kostengrund dafuer gab es nicht: die Liste ist gemessen 3,7 KB und
       braucht auf dem Server 1,5 ms. (Beim Kalender ist das anders und dort auch
       so begruendet — der arbeitet sich seitenweise durch OpenCalendar.)
       Nur wenn der Bereich ueberhaupt sichtbar ist: wer die Notizen abgeschaltet
       hat, soll dafuer keine Anfrage schicken. */
    if (visibleTabs().includes('notes') && !notizenGeladen && !notizenLaden) {
      ladeNotizen();
    }
    // Erst hier: Vorher steht nicht fest, ob es ein Gateway gibt, und die
    // Mitgliederliste fuer die Zuordnung ist noch leer.
    pushInit();
  } else if (data.type === 'instanceState') {
    if (data.ok === false) {
      showToast(translate('Action failed'));
      // Abgelehnte Aktion: die optimistische Darstellung MUSS zurückgenommen
      // werden. renderInto() bricht bei unverändertem Markup ab, deshalb erst die
      // Markup-Caches verwerfen — sonst bliebe z.B. eine weggewischte Zeile
      // dauerhaft bei translateX(-110%) unsichtbar und tot stehen.
      invalidateRenderCache();
    }
    if (data.state && data.instanceID) {
      store.states[String(data.instanceID)] = {
        kind: data.kind,
        revision: data.revision,
        state: data.state
      };
      syncCompat();
      renderAll();
      // Offene Overlays, die nicht Teil eines Tab-Containers sind, aus dem
      // frischen State neu zeichnen (korrigiert auch verworfene Aktionen)
      if (document.getElementById('favPickOverlay').classList.contains('open')) renderFavPicker();
    }
  } else if (data.type === 'gatewayDirty') {
    /* „Irgendetwas im Gateway hat sich geaendert." Der WebSocket-Kanal traegt
       keine Daten, nur dieses Signal; der Adapter reicht es hier herein.

       Vorher endete es blind: der Empfaenger im Adapter glich ausschliesslich
       LISTEN-Revisionen ab, und Briefing wie Mailanalyse klingelten mit der
       Begruendung, die Oberflaechen holten den Text „beim naechsten irgendetwas
       hat sich geaendert" — was so nicht stimmte. Sie kamen tatsaechlich erst mit
       dem Minutentakt. */
    gatewayNachladen();
  } else if (data.type === 'meta') {
    store.instances = data.instances || [];
    store.hiddenIDs = data.hiddenIDs || [];
    store.gatewayAvailable = !!data.gatewayAvailable;
    store.tabs = normalizeTabs(data.tabs);
    /* Mitglieder NUR wenn welche mitkommen. Sie fehlten hier ganz: ein neu
       angelegtes Familienmitglied erreichte eine offene Oberflaeche nie. Der
       Riegel ist noetig, weil ein Meta-Push ohne users sonst die vorhandenen
       loeschte — und den gibt es (die Kachel schickte lange keine). */
    if (Array.isArray(data.users)) { store.users = data.users; }
    applyTabVisibility();
    for (const key of Object.keys(store.states)) {
      const inst = store.instances.find(i => String(i.id) === key);
      if (!inst || inst.hidden) delete store.states[key];
    }
    syncCompat();
    renderAll();
    checkRevisions(); // fehlende States neu eingeblendeter Listen nachladen
  }
}
window.handleMessage = handleMessage;
window.updateState = handleMessage;
// Nur Nachrichten vom eigenen Fenster oder dem einbettenden Parent annehmen:

window.addEventListener('message', (event) => {

// ── Tabs ───────────────────────────────────────────────────────────────────
const TABS = ['dashboard', 'ki', 'shopping', 'todos', 'calendar', 'notes'];
function setTab(tab) {
  // Gegen die sichtbaren Tabs prüfen, nicht gegen TABS: der gespeicherte symdo.tab
  // kann auf einen inzwischen abgeschalteten Bereich zeigen.
  const vis = visibleTabs();
  const gewuenscht = tab;
  if (!vis.includes(tab)) tab = vis[0];
  activeTab = tab;
  // Einen RÜCKFALL nicht als Wunsch merken: Beim Start ist der Kalender noch ohne
  // Kalenderliste und die Kachel noch ohne tabs-Angabe — der gewünschte Bereich kann
  // es also gleich noch werden (applyTabVisibility holt ihn dann zurück). Ein
  // ABGESCHAFFTER Bereich steht nicht mehr in TABS; dessen Rückfall MUSS geschrieben
  // werden, sonst hinge ein alter symdo.tab für immer.
  if (tab === gewuenscht || !TABS.includes(gewuenscht)) ls.set('symdo.tab', tab);
  /* Der Stundenplan faengt beim BETRETEN des Dashboards wieder bei heute an.
     Die Tageswahl blieb sonst stehen, wo man sie zuletzt gelassen hatte: wer
     abends bis Freitag geblaettert hatte, sah am naechsten Morgen den Freitag.
     Das Blaettern selbst zeichnet nur neu und laeuft hier nicht durch — die
     Wahl bleibt also erhalten, solange man auf dem Dashboard ist.
     Die Legende geht dabei zu: sie ist ein Blatt ueber der Karte, und ein
     offenes Blatt beim Zurueckkommen sieht aus wie ein haengengebliebener
     Dialog. */
  if (tab === 'dashboard') {
    stundenplanTag = 0;
    stundenplanLegende = false;
  }
  /* Beim BETRETEN des Kalenders frisch holen. renderAll holt nur bei leerer
     Liste; ohne das hier saehe man beim Wiederbetreten den Stand von vorhin,
     auch wenn ein anderes Geraet inzwischen einen Termin angelegt hat.
     loadCalendarEvents hat seinen eigenen Riegel (calLoading), ein doppelter
     Aufruf kostet also nichts. */
  if (tab === 'calendar') { loadCalendarEvents(); }
  for (const t of TABS) {
    document.getElementById('screen-' + t).classList.toggle('active', t === tab);
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  }
  renderAll();
}

// ── UI-Helfer: Toast, Bestätigung, Eingabe, Menü, Overlays ────────────────
let toastTimer = 0;
/**
 * Laesst das Produktbild einer Zeile kurz aufhuepfen und dann zum Einkaufen-Tab
 * fliegen. Rein visuell — der Server-Aufruf ist zu diesem Zeitpunkt schon raus, die
 * Animation darf also jederzeit ausfallen, ohne dass etwas verloren geht.
 *
 * Der Flieger ist ein Klon des Bildes an fixer Position ueber allem (die Tab-Leiste
 * liegt auf 40). Er haengt an <body>, nicht an der Zeile: die Liste wird beim
 * naechsten State-Push neu aufgebaut, ein Kind der Zeile waere dann mittendrin weg.
 */
function flyToShoppingTab(thumbEl) {
  if (!thumbEl || typeof thumbEl.animate !== 'function') return;
  // Bewegungsreduziert: keine Flugbahn. Dieselbe Ruecksicht wie bei der Mitgliederleiste.
  if (mbReduceMotion()) return;
  const target = document.getElementById('tab-shopping');
  // Ohne sichtbaren Einkaufen-Tab gibt es kein Ziel (der Bereich laesst sich
  // abschalten) — dann unterbleibt die Animation ganz.
  if (!target || getComputedStyle(target).display === 'none') return;

  const from = thumbEl.getBoundingClientRect();
  if (from.width === 0 || from.height === 0) return;
  const icon = target.querySelector('svg, i') || target;
  const to = icon.getBoundingClientRect();
  // Die Leiste kann als GANZE ausgeblendet sein (html.no-tabs bei nur einem Bereich).
  // Der Knopf selbst steht dann nicht auf display:none — das erbt sich nicht —, hat
  // aber keine Ausdehnung. Ohne diese Probe fliegt das Bild in die linke obere Ecke.
  if (to.width === 0 && to.height === 0) return;

  const ghost = thumbEl.cloneNode(true);
  ghost.classList.add('fly-ghost');
  ghost.style.left = from.left + 'px';
  ghost.style.top = from.top + 'px';
  ghost.style.width = from.width + 'px';
  ghost.style.height = from.height + 'px';
  document.body.appendChild(ghost);

  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);

  const anim = ghost.animate([
    { transform: 'translate(0px, 0px) scale(1)', opacity: 1, offset: 0 },
    // Huepfer: kurz gross und nach oben, bevor es losgeht
    { transform: 'translate(0px, -14px) scale(1.28)', opacity: 1, offset: 0.22 },
    { transform: 'translate(0px, 0px) scale(1.06)', opacity: 1, offset: 0.34 },
    // Flug in einem Bogen: erst seitlich, dann nach unten ins Ziel
    { transform: 'translate(' + (dx * 0.55) + 'px, ' + (dy * 0.28) + 'px) scale(0.8)', opacity: 0.95, offset: 0.7 },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(0.22)', opacity: 0.15, offset: 1 }
  ], { duration: 720, easing: 'cubic-bezier(.4,.05,.3,1)' });

  // Netz gegen Karteileichen: loest anim.finished nicht aus (abgebrochene Animation,
  // Umgebung ohne laufende Animationsuhr), bliebe der Klon sonst dauerhaft im DOM.
  const cleanup = setTimeout(function () { ghost.remove(); }, 1400);
  anim.finished.then(function () {
    clearTimeout(cleanup);
    ghost.remove();
    // Kurzer Stups am Ziel, damit die Ankunft sichtbar wird
    if (typeof icon.animate === 'function') {
      icon.animate([
        { transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }
      ], { duration: 260, easing: 'ease-out' });
    }
  }).catch(function () { clearTimeout(cleanup); ghost.remove(); });
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
// Overlays sind Blaetter am unteren Rand (.overlay: justify-content: flex-end). Sie
// gleiten jetzt von unten herein und wieder hinaus, statt zu erscheinen.
//
// Beim Schliessen darf die Klasse ERST nach der Animation weg: .overlay ohne .open
// steht auf display: none, das Blatt waere sonst sofort verschwunden. Deshalb haelt
// der Knoten seine laufende Schliess-Animation in _closeAnim — ein erneutes Oeffnen
// bricht sie ab, sonst raeumte ihr onfinish das gerade geoeffnete Blatt wieder weg.
//
// Verdunkelung ueber background-color statt opacity: opacity auf .overlay wuerde das
// Blatt mit verblassen lassen, es soll aber deckend hereinfahren.
const OVERLAY_MS = 260;
const OVERLAY_DIM = 'rgba(0, 0, 0, .45)';
function openOverlay(id) {
  const ov = document.getElementById(id);
  if (!ov) return;
  if (ov._closeAnim) {
    ov._closeAnim.onfinish = null;
    ov._closeAnim.oncancel = null;
    ov._closeAnim.cancel();
    ov._closeAnim = null;
  }
  ov.classList.add('open');
  if (mbReduceMotion()) return;
  const card = ov.querySelector('.overlay-card');
  ov.animate([{ backgroundColor: 'rgba(0, 0, 0, 0)' }, { backgroundColor: OVERLAY_DIM }],
             { duration: OVERLAY_MS, easing: 'ease-out' });
  if (card) {
    card.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }],
                 { duration: OVERLAY_MS, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}
function closeOverlay(id) {
  const ov = document.getElementById(id);
  if (!ov) return;
  // Uebernahme-Kette des KI-Scans: das Schliessen des erwarteten Dialogs —
  // durch Speichern WIE durch Abbrechen — ruft den naechsten Fund auf.
  if (aiUebernahmeWartet === id && ov.classList.contains('open')) {
    aiUebernahmeWartet = '';
    window.setTimeout(aiUebernahmeWeiter, 350);
  }
  if (mbReduceMotion() || !ov.classList.contains('open')) {
    ov.classList.remove('open');
    return;
  }
  const card = ov.querySelector('.overlay-card');
  ov.animate([{ backgroundColor: OVERLAY_DIM }, { backgroundColor: 'rgba(0, 0, 0, 0)' }],
             { duration: OVERLAY_MS, easing: 'ease-in' });
  const fertig = () => { ov.classList.remove('open'); ov._closeAnim = null; };
  if (!card) { window.setTimeout(fertig, OVERLAY_MS); return; }
  ov._closeAnim = card.animate(
    [{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }],
    { duration: OVERLAY_MS, easing: 'cubic-bezier(.4, 0, 1, 1)' }
  );
  ov._closeAnim.onfinish = fertig;
  ov._closeAnim.oncancel = fertig;
}

let menuCloser = null;
let menuAnchor = null;
function closeMenu() {
  const pop = document.getElementById('menuPop');
  if (pop) pop.remove();
  menuAnchor = null;
  if (menuCloser) {
    document.removeEventListener('mousedown', menuCloser, true);
    document.removeEventListener('touchstart', menuCloser, true);
    menuCloser = null;
  }
}
function openMenu(anchor, entries) {
  // Zweiter Klick auf denselben Knopf schließt das Menü wieder. Damit das geht,
  // behandelt der Außenklick-Wächter weiter unten den Knopf selbst NICHT als
  // „außerhalb": sonst hätte mousedown das Menü längst entfernt, bevor click
  // hier ankommt — und es ginge sofort wieder auf, sähe also aus, als reagiere
  // der Knopf nicht.
  if (menuAnchor === anchor && document.getElementById('menuPop')) {
    closeMenu();
    return;
  }
  closeMenu();
  const pop = document.createElement('div');
  pop.id = 'menuPop';
  pop.className = 'menu-pop open';
  for (const entry of entries) {
    if (entry.sep) {
      const sep = document.createElement('div');
      sep.className = 'menu-sep';
      pop.appendChild(sep);
      continue;
    }
    if (entry.header) {
      const label = document.createElement('div');
      label.className = 'menu-label';
      label.textContent = entry.label;
      pop.appendChild(label);
      continue;
    }
    const btn = document.createElement('button');
    if (entry.destructive) btn.classList.add('destructive');
    btn.innerHTML = (entry.icon ? `<i class="fa-light ${entry.icon}"></i>` : '') +
      escapeHtml(entry.label) +
      (entry.checked ? '<i class="fa-light fa-check check"></i>' : '');
    btn.addEventListener('click', () => { closeMenu(); entry.onClick(); });
    pop.appendChild(btn);
  }
  document.body.appendChild(pop);
  const rect = anchor.getBoundingClientRect();
  // Breite auf den Viewport begrenzen, sonst schieben lange Einträge
  // (z. B. „<langer Favoritenname> hinzufügen“) das Popover aus dem Bild
  pop.style.maxWidth = Math.min(280, window.innerWidth - 16) + 'px';
  pop.style.top = Math.min(rect.bottom + 6, window.innerHeight - pop.offsetHeight - 10) + 'px';
  pop.style.left = Math.max(8, Math.min(rect.right - pop.offsetWidth, window.innerWidth - pop.offsetWidth - 8)) + 'px';
  menuAnchor = anchor;
  menuCloser = (e) => {
    if (pop.contains(e.target)) return;
    if (anchor && anchor.contains(e.target)) return;  // Umschalten macht der Klick
    closeMenu();
  };
  setTimeout(() => {
    document.addEventListener('mousedown', menuCloser, true);
    document.addEventListener('touchstart', menuCloser, true);
  }, 0);
}

// Marquee für abgeschnittene Namen (Ping-Pong wie in der App)
function applyMarquees(container) {
  container.querySelectorAll('.strip-name').forEach(el => {
    const inner = el.querySelector('.marquee-inner');
    if (!inner) return;
    const overflow = inner.scrollWidth - el.clientWidth;
    if (overflow > 4) {
      el.style.setProperty('--marquee-shift', `-${overflow}px`);
      el.classList.add('marquee');
    } else {
      el.classList.remove('marquee');
    }
  });
}

// Aufloesen beim Loeschen: die Karte verblasst, wird weichgezeichnet und ihre
// Hoehe faehrt auf null, damit die Zeilen darunter weich nachruecken statt zu
// springen. Der Loesch-Aufruf geht erst danach raus — der naechste Render
// entfernt den Knoten dann unsichtbar. Bleibt der Knoten stehen (Aufruf schlug
// fehl), heilt renderRows ihn beim naechsten Push, weil die Inline-Stile das
// outerHTML veraendern und der Knoten dadurch ersetzt wird.
const DISSOLVE_MS = 300;
/**
 * Zeile verschwinden lassen und die Luecke schliessen. Zwei Ausdruecke derselben
 * Mechanik, damit sich Loeschen und Abhaken nicht verwechseln lassen:
 *   dissolveCard  — loest sich auf (weichzeichnen, leicht schrumpfen)
 *   checkOffCard  — schiebt zur Seite (rechts = abgehakt, links = zurueck)
 * Beides faehrt Hoehe und unteren Rand auf null, damit die Nachbarn weich nachruecken.
 */
function collapseCard(card, done, opts) {
  const finish = () => { if (done) done(); };
  if (!card) { finish(); return; }
  if (mbReduceMotion()) { card.style.display = 'none'; finish(); return; }
  const o = opts || {};
  const ms = o.ms || DISSOLVE_MS;
  const h = card.offsetHeight;
  card.style.height = h + 'px';
  card.style.marginBottom = window.getComputedStyle(card).marginBottom;
  card.style.overflow = 'hidden';
  void card.offsetHeight; // Reflow erzwingen, sonst springt die Hoehe ohne Uebergang
  card.style.transition = `height ${ms}ms cubic-bezier(.4,0,.2,1),`
    + ` margin-bottom ${ms}ms cubic-bezier(.4,0,.2,1),`
    + ` opacity ${Math.round(ms * 0.8)}ms ease,`
    + ` filter ${Math.round(ms * 0.8)}ms ease,`
    + ` transform ${Math.round(ms * 0.8)}ms ease`;
  card.style.opacity = '0';
  if (o.blur) card.style.filter = 'blur(' + o.blur + 'px)';
  card.style.transform = 'translateX(' + (o.dx || 0) + 'px) scale(' + (o.scale || 1) + ')';
  card.style.height = '0px';
  card.style.marginBottom = '0px';
  window.setTimeout(finish, ms);
}
function dissolveCard(card, done) {
  collapseCard(card, done, { blur: 7, scale: 0.96 });
}
/**
 * Abhaken: die Zeile schiebt sich zur Seite und verblasst, dann folgt der Aufruf.
 * Richtung als Bedeutung — nach rechts heisst „erledigt/in den Wagen", nach links
 * „zurueck in die Liste". Genauso macht es die ShoppingList-Kachel
 * (@keyframes moveToRecentlyUsed / moveBackToList), 22px bei 340ms.
 */
const CHECKOFF_MS = 340;
// Streifen-Kachel abhaken: derselbe Ausdruck, aber die Breite faellt zusammen —
// der Streifen ist waagerecht, eine schrumpfende Hoehe wuerde dort nichts schliessen.
function stripCheckOff(el, done) {
  const finish = () => { if (done) done(); };
  if (!el) { finish(); return; }
  if (mbReduceMotion()) { el.style.display = 'none'; finish(); return; }
  const w = el.offsetWidth;
  el.style.flex = '0 0 auto';
  el.style.width = w + 'px';
  el.style.overflow = 'hidden';
  void el.offsetWidth;
  el.style.transition = `width ${CHECKOFF_MS}ms cubic-bezier(.4,0,.2,1),`
    + ` margin-right ${CHECKOFF_MS}ms cubic-bezier(.4,0,.2,1),`
    + ` opacity ${Math.round(CHECKOFF_MS * 0.8)}ms ease,`
    + ` transform ${Math.round(CHECKOFF_MS * 0.8)}ms ease`;
  el.style.opacity = '0';
  el.style.transform = 'translateY(-10px) scale(.94)';
  el.style.width = '0px';
  el.style.marginRight = '-14px';   // gap des Streifens schlucken
  window.setTimeout(finish, CHECKOFF_MS);
}
function checkOffCard(card, zurueck, done) {
  collapseCard(card, done, { dx: zurueck ? -22 : 22, scale: 0.97, ms: CHECKOFF_MS });
}
// Umsortieren sichtbar machen (FLIP): Positionen VOR dem Umhaengen merken, danach
// die Differenz als transform setzen und weganimieren. Die Nachbarn gleiten damit an
// ihren neuen Platz statt zu springen — in einer Spalte wie im mehrspaltigen Raster,
// weil x UND y animiert werden.
//
// WAAPI statt CSS-Transition: eine Animation hinterlaesst keine Inline-Stile, die
// spaeter mit dissolveCard() kollidieren koennten (das setzt height/transform selbst).
// 340 ms, nicht 180: bei 180 war die Bewegung kaum zu sehen — auf einer Strecke von
// wenigen Zeilenhoehen ist sie nach drei Bildern vorbei. Laenger darf es nicht werden,
// sonst haengt sie beim schnellen Ziehen hinter dem Finger her (mehrere Zuege in Folge
// brechen einander ab, siehe cancel() unten).
const REORDER_MS = 340;
function flipReorder(area, dragged, mutate) {
  if (mbReduceMotion()) { mutate(); return; }
  const nodes = Array.from(area.querySelectorAll('.todo-card'));
  // Laufende Animationen zuerst abbrechen: getBoundingClientRect() liefert sonst die
  // MOMENTANE, noch verschobene Position, und die Differenz waere um den offenen Rest
  // daneben. cancel() setzt den Knoten sofort auf seinen Layout-Platz.
  for (const n of nodes) { if (n._flip) { n._flip.cancel(); n._flip = null; } }
  const vorher = new Map();
  for (const n of nodes) { const r = n.getBoundingClientRect(); vorher.set(n, { x: r.left, y: r.top }); }

  mutate();

  for (const n of nodes) {
    // Die gezogene Karte springt bewusst sofort: sie sitzt unter dem Finger.
    if (n === dragged) continue;
    const v = vorher.get(n);
    if (!v) continue;
    const r = n.getBoundingClientRect();
    const dx = v.x - r.left, dy = v.y - r.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    n._flip = n.animate(
      [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
      // Symmetrische Kurve, KEIN starkes ease-out: mit cubic-bezier(.2,.8,.2,1) lagen
      // nach 80 ms schon 70 % der Strecke hinter uns und der Rest kroch — die Dauer
      // stand auf 340 ms, sichtbar war die Bewegung trotzdem kaum. So liegt die halbe
      // Strecke in der halben Zeit, das Gleiten ist erkennbar.
      { duration: REORDER_MS, easing: 'cubic-bezier(.45,.05,.55,.95)' }
    );
    n._flip.onfinish = () => { n._flip = null; };
  }
}

// Gegenstueck fuer Wege, die nach dem Wischen noch nachfragen und abbrechen koennen.
function restoreCard(card) {
  if (!card) return;
  card.style.transition = '';
  ['height', 'marginBottom', 'overflow', 'opacity', 'filter', 'transform', 'display']
    .forEach(p => { card.style[p] = ''; });
}

// Wisch-Geste (aus dem ShoppingList-Modul übernommen, Callback statt Action)
// Swipe on a card: left = delete, right = edit (when onEdit is given).
// Mouse + touch events (no Pointer Events): the Symcon desktop webview delivers
// no pointer events, so a pointer-only swipe is dead there.
function bindCardSwipe(card, contentSel, onDelete, onEdit, opts) {
  const content = card.querySelector(contentSel);
  if (!content) return;
  let startX = 0, startY = 0, dx = 0;
  let active = false, decided = false, usingTouch = false;
  const SLOP = 8, THRESHOLD = 64;
  const clearDir = () => card.classList.remove('dragging-left', 'dragging-right');
  const cleanup = () => {
    active = false; decided = false;
    content.classList.remove('is-dragging');
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup', onMouseUp);
    document.removeEventListener('touchmove', onTouchMove, true);
    document.removeEventListener('touchend', onTouchEnd, true);
    document.removeEventListener('touchcancel', onTouchEnd, true);
  };
  const begin = (target, x, y) => {
    if (target.closest('button')) return false;
    if (card.dataset.animating === '1') return false;
    active = true; decided = false;
    startX = x; startY = y; dx = 0;
    return true;
  };
  const move = (x, y) => {
    if (!active) return false;
    const mx = x - startX, my = y - startY;
    if (!decided) {
      if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return false;
      if (Math.abs(my) >= Math.abs(mx)) { cleanup(); return false; } // vertical → scroll
      decided = true;
      content.classList.add('is-dragging');
    }
    const maxRight = onEdit ? content.offsetWidth : 0; // right swipe only when an edit handler exists
    dx = Math.max(-content.offsetWidth, Math.min(maxRight, mx));
    content.style.transform = `translateX(${dx}px)`;
    card.classList.toggle('dragging-left', dx < 0);
    card.classList.toggle('dragging-right', dx > 0);
    return true;
  };
  const end = () => {
    if (!active) return;
    const wasDecided = decided;
    cleanup();
    if (wasDecided && dx <= -THRESHOLD) {
      clearDir();
      card.dataset.animating = '1';
      card.classList.add('is-deleting');
      content.style.transform = 'translateX(-110%)';
      // Ohne Aufloesen dort, wo noch eine Rueckfrage folgt: eine bereits

}

// Todo card gestures: the row body swipes (left = delete, right = edit) via
// mouse + touch while vertical touch stays native scroll (touch-action:pan-y);
// reorder is a drag from the grip handle only (touch-action:none on the handle),
// so dragging the handle reorders while the rest of the list scrolls natively.
function bindTodoGesture(card, instanceID, area, open, done, canReorder, onDelete, onEdit) {
  const content = card.querySelector('.todo-content');
  if (!content) return;

  // ── Horizontal swipe on the row body (vertical is left to native scroll) ──
  (function bindSwipe() {
    let startX = 0, startY = 0, dx = 0;
    let active = false, decided = false, usingTouch = false;
    const SLOP = 8, THRESHOLD = 64;
    const clearDir = () => card.classList.remove('dragging-left', 'dragging-right');
    const cleanup = () => {
      active = false; decided = false;
      content.classList.remove('is-dragging');
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('touchmove', onTouchMove, true);
      document.removeEventListener('touchend', onTouchEnd, true);
      document.removeEventListener('touchcancel', onTouchEnd, true);
    };
    const begin = (target, x, y) => {
      if (target.closest('.todo-handle, button, .chk')) return false;
      if (card.dataset.animating === '1') return false;
      active = true; decided = false; startX = x; startY = y; dx = 0;
      return true;
    };
    const move = (x, y) => {
      if (!active) return false;
      const mx = x - startX, my = y - startY;
      if (!decided) {
        if (Math.abs(mx) < SLOP && Math.abs(my) < SLOP) return false;
        if (Math.abs(my) >= Math.abs(mx)) { cleanup(); return false; } // vertical → native scroll
        decided = true; content.classList.add('is-dragging');
      }

      dx = Math.max(-content.offsetWidth, Math.min(maxRight, mx));
      content.style.transform = `translateX(${dx}px)`;

      card.classList.toggle('dragging-right', dx > 0);

    };

    const end = () => {
      if (!active) return;

      document.addEventListener('mousemove', onMouseMove, { passive: false });
      document.addEventListener('mouseup', onMouseUp);
    });
    const onTouchMove = (e) => {
      const t = e.touches && e.touches[0]; if (!t) return;
      if (move(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
    };
    const onTouchEnd = () => { end(); window.setTimeout(() => { usingTouch = false; }, 400); };
    content.addEventListener('touchstart', (e) => {
      const t = e.touches && e.touches[0]; if (!t) return;
      usingTouch = true;
      if (!begin(e.target, t.clientX, t.clientY)) { usingTouch = false; return; }
      document.addEventListener('touchmove', onTouchMove, { passive: false, capture: true });
      document.addEventListener('touchend', onTouchEnd, true);
      document.addEventListener('touchcancel', onTouchEnd, true);
    }, { passive: true });
  })();

  const handle = card.querySelector('.todo-handle');

    let dragging = false, dragMoved = false, usingTouch = false;
    const cleanup = () => {
      dragging = false;

      document.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('touchmove', onTouchMove, true);
      document.removeEventListener('touchend', onTouchEnd, true);
      document.removeEventListener('touchcancel', onTouchEnd, true);
    };
    const start = () => {
      if (card.dataset.animating === '1') return false;
      dragging = true; dragMoved = false;
      card.classList.add('todo-dragging');
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (_) {}
      return true;
    };
    const reorderTo = (x, y) => {
      const prev = card.style.pointerEvents;
      card.style.pointerEvents = 'none';            // look past the dragged card
      const el = document.elementFromPoint(x, y);
      card.style.pointerEvents = prev;
      const over = (el && el.closest) ? el.closest('.todo-card') : null;
      if (!over || over === card || over.dataset.animating === '1') return;
      if (over.classList.contains('done-row')) return; // reorder among open items only
      const r = over.getBoundingClientRect();
      // Auf breiten Schirmen ist die Liste mehrspaltig, Nachbarn liegen dann
      // NEBENEINANDER — dort entscheidet die senkrechte Mitte nichts Sinnvolles.
      // Liegt die Zielkarte in derselben Reihe, zählt die waagerechte Mitte;
      // sonst wie bisher die senkrechte. Die endgültige Reihenfolge liest `end()`
      // ohnehin aus der DOM-Ordnung, die im Raster zeilenweise läuft.
      const eigen = card.getBoundingClientRect();
      const gleicheReihe = Math.abs(r.top - eigen.top) < r.height / 2;
      const davor = gleicheReihe ? (x < r.left + r.width / 2) : (y < r.top + r.height / 2);
      flipReorder(area, card, () => {
        if (davor) area.insertBefore(card, over);

    };
    const markSwiped = () => { card.dataset.swiped = '1'; window.setTimeout(() => { delete card.dataset.swiped; }, 60); };
    const end = () => {

        // Zustände, eine beim Binden festgehaltene Liste wäre veraltet.
        const openNow = (typeof open === 'function') ? open() : open;
        const doneNow = (typeof done === 'function') ? done() : done;
        const openSet = new Set(openNow.map(i => i.id));
        const ids = Array.from(area.querySelectorAll('.todo-card'))
          .map(c => parseInt(c.dataset.id))
          .filter(n => openSet.has(n));
        sdCall(instanceID, 'Reorder', { order: ids.concat(doneNow.map(i => i.id)) });
      }

    };

      document.addEventListener('mousemove', onMouseMove, { passive: false });
      document.addEventListener('mouseup', onMouseUp);
    });
    const onTouchMove = (e) => {
      const t = e.touches && e.touches[0]; if (!t) return;
      if (dragging) { reorderTo(t.clientX, t.clientY); if (e.cancelable) e.preventDefault(); }
    };
    const onTouchEnd = () => { end(); window.setTimeout(() => { usingTouch = false; }, 400); };
    handle.addEventListener('touchstart', (e) => {
      const t = e.touches && e.touches[0]; if (!t) return;
      usingTouch = true; e.stopPropagation();
      if (!start()) { usingTouch = false; return; }
      document.addEventListener('touchmove', onTouchMove, { passive: false, capture: true });
      document.addEventListener('touchend', onTouchEnd, true);
      document.addEventListener('touchcancel', onTouchEnd, true);
    }, { passive: false });
  })();
}

// ── Aggregationen (Port der Dashboard-Logik aus DashboardScreen.swift) ─────
function allTodoTasks() {
  const tasks = [];
  for (const inst of visibleInstances('todo')) {
    const st = instState(inst.id);
    if (!st) continue;
    for (const item of (Array.isArray(st.items) ? st.items : [])) {
      tasks.push({ item, instanceID: inst.id, listName: inst.name, key: inst.id + '-' + item.id });
    }
  }
  return tasks;
}
function memberFiltered(tasks) {
  // Ohne sichtbare Leiste filtert die Uebersicht nicht — die Auswahl bleibt aber
  // bestehen, denn sie ist bereichsuebergreifend und gehoert auch den anderen Tabs.
  if (!mitgliederLeisteSichtbar() || memberFilterIds.size === 0) return tasks;
  // Aufgaben, die einem der gewählten Mitglieder zugewiesen sind (Vereinigung)
  return tasks.filter(t => Array.isArray(t.item.assignedTo) && t.item.assignedTo.some(id => memberFilterIds.has(id)));
}
function mondayOf(d) {
  const y = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  y.setDate(y.getDate() - ((y.getDay() + 6) % 7));
  return y.getTime();
}
function isThisWeek(ts) {
  if (!ts) return false;
  return mondayOf(new Date(ts * 1000)) === mondayOf(new Date());
}
function openShoppingCount() {
  let n = 0;
  for (const inst of visibleInstances('shopping')) {
    const st = instState(inst.id);
    if (st && Array.isArray(st.items)) n += st.items.filter(i => !i.inCart).length;
  }
  return n;
}
// Offene Artikel der Liste in Kategorie-Reihenfolge, alphabetisch je Kategorie
function openSections(st) {
  const items = (Array.isArray(st.items) ? st.items : []).filter(i => !i.inCart);
  const misc = translate('Miscellaneous');
  const byCat = new Map();
  for (const it of items) {
    const cat = it.category || misc;
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(it);
  }
  const order = Array.isArray(st.categoryOrder) ? st.categoryOrder.slice() : [];
  for (const cat of byCat.keys()) {
    if (!order.includes(cat)) order.push(cat);
  }
  const sections = [];
  for (const cat of order) {
    const list = byCat.get(cat);
    if (!list) continue;
    list.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base' }));
    sections.push({ category: cat, items: list });
  }
  return sections;
}

// Schreibt Markup nur, wenn es sich wirklich geändert hat, und meldet das
// zurück. So überspringt der periodische Refresh / Revisions-Poll das teure
// innerHTML-Neuzeichnen bei unverändertem Inhalt → kein Flackern, kein
// Scroll-Abbruch. Die aufrufende Render-Funktion kehrt bei false früh zurück,
// damit auch keine doppelten Event-Handler gebunden werden.
// Bis zu diesem Zeitpunkt (performance.now) ausgelöste Scroll-Events stammen von
// einem Re-Render (Layout-Clamp/Reflow) und dürfen die per Tipp ausgeklappte
// Member-Leiste NICHT einklappen — nur echtes Nutzer-Scrollen klappt wieder ein.
let mbRenderScrollGuard = 0;
function renderInto(el, html) {
  if (!el) return false;
  if (el._lastHtml === html) return false;
  el._lastHtml = html;
  el.innerHTML = html;
  // Ein Re-Render kann scrollTop clampen (kürzerer Inhalt) → Scroll-Event. Kurz
  // markieren, damit dieses NICHT die ausgeklappte Member-Leiste einklappt.
  mbRenderScrollGuard = performance.now() + 200;
  return true;
}

/**
 * Wie renderInto, aber zeilenweise: ersetzt nur die Kinder, deren Markup sich
 * geändert hat, und lässt alle übrigen DOM-Knoten unangetastet stehen.
 *
 * Warum das nötig ist: `innerHTML = html` verwirft die GESAMTE Liste. Bei einer
 * Mengenänderung an einem einzigen Artikel werden dadurch auch alle anderen
 * Karten samt ihrer <img>-Elemente neu erzeugt. Die Bilddaten kommen zwar aus
 * dem Cache, jedes Bild muss aber erneut dekodiert und gemalt werden — sichtbar
 * als Flackern der ganzen Liste.
 *
 * Zuordnung alt→neu über einen Schlüssel: `data-id` (Artikel-/Aufgabenkarten),
 * sonst `data-key` (Überschriften, Umschalter), sonst das Markup selbst. Knoten
 * ohne Schlüssel und mit geändertem Markup werden schlicht ersetzt — der
 * Abgleich ist damit nie „falscher" als das bisherige Komplett-Ersetzen.
 *
 * Rückgabe: `false`, wenn sich nichts geändert hat (wie renderInto), sonst die
 * Liste der NEU eingefügten Elemente. Ereignisse dürfen nur an diese gebunden
 * werden — wiederverwendete Knoten tragen ihre Handler ja noch.
 */
function renderRows(el, html) {
  if (!el) return false;
  if (el._lastHtml === html) return false;
  el._lastHtml = html;

  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const incoming = Array.from(tpl.content.children);

  // Bestand nach Schlüssel indizieren. Mehrfach vorkommende Schlüssel (gleiches
  // Markup, z.B. zwei identische Überschriften) landen in einer Queue.
  const keyOf = (node) => node.dataset && node.dataset.id !== undefined
    ? 'id:' + node.dataset.id
    : (node.dataset && node.dataset.key !== undefined ? 'key:' + node.dataset.key : 'html:' + node.outerHTML);
  const pool = new Map();
  for (const node of Array.from(el.children)) {
    const k = keyOf(node);
    if (!pool.has(k)) pool.set(k, []);
    pool.get(k).push(node);
  }

  const fresh = [];
  const result = [];
  for (const next of incoming) {
    const bucket = pool.get(keyOf(next));
    const old = bucket && bucket.length ? bucket.shift() : null;
    if (old && old.outerHTML === next.outerHTML) {
      result.push(old);            // unverändert → DOM-Knoten behalten
    } else if (old && old.dataset && old.dataset.nest === '1' && next.dataset.nest === '1') {
      // Verschachtelter Behälter (data-nest="1"): NICHT ersetzen, sondern eine
      // Ebene tiefer denselben Vergleich fahren. Ohne das verlöre ein Kasten, der
      // seine Zeilen umschließt, bei jeder Änderung alle Kindknoten — samt der
      // Wischgeste unter dem Finger. Genau deshalb waren solche Gruppen bisher
      // verboten und die Listen flach.
      //
      // Die eigenen Attribute wandern mit, sonst bliebe eine geänderte Klasse
      // (z.B. eine Zählung im Kopf) am alten Knoten stehen.
      for (const a of Array.from(old.attributes)) {
        if (!next.hasAttribute(a.name)) old.removeAttribute(a.name);
      }
      for (const a of Array.from(next.attributes)) {
        if (old.getAttribute(a.name) !== a.value) old.setAttribute(a.name, a.value);
      }
      const innen = renderRows(old, next.innerHTML);
      if (innen !== false) { for (const k of innen) fresh.push(k); }
      result.push(old);
    } else {
      if (old && old.parentNode === el) el.removeChild(old);
      result.push(next);
      fresh.push(next);
    }
  }

  // Übrig gebliebene Altknoten entfernen, dann die Zielreihenfolge herstellen.
  for (const bucket of pool.values()) {
    for (const node of bucket) { if (node.parentNode === el) el.removeChild(node); }
  }
  let ref = el.firstChild;
  for (const node of result) {
    if (ref === node) { ref = node.nextSibling; continue; }
    el.insertBefore(node, ref);
  }
  while (ref) { const nx = ref.nextSibling; el.removeChild(ref); ref = nx; }

  mbRenderScrollGuard = performance.now() + 200;
  return fresh;
}

// ── Render-Einstieg ────────────────────────────────────────────────────────
function renderAll() {
  if (activeTab === 'dashboard') renderDashboard();
  if (activeTab === 'shopping') renderShopping();
  if (activeTab === 'todos') renderTodos();
  // Favoriten sind ein Blatt, kein Bereich: nur mitzeichnen, solange es offen ist.
  // Das deckt alle Wege ab, auf denen ein Zustand hereinkommt (state, instanceState,
  // meta, Minutentakt) — ein Sonderweg wie bei favPickOverlay ist nicht nötig.
  if (document.getElementById('favOverlay').classList.contains('open')) renderFavorites();
  if (activeTab === 'calendar') {
    // Termine erst beim Betreten holen: der Bereich ist selten offen, und jeder
    // Abruf laeuft ueber mehrere Seiten durch OpenCalendar.
    //
    // Beim ERSTEN Betreten. Das Nachziehen danach macht setTab (Wiederbetreten)

     // dieser Bedingung allein wurde nach dem ersten Laden nie wieder geholt,

// Member-Leiste: scroll-gekoppelter, stufenloser Kollaps via --mc (0..1).
// Oben immer ausgeklappt (--mc 0). Beim Scrollen gleiten die Avatare über die
// ersten ~72px stufenlos zusammen (--mc → 1, smoothstep, frame-genau am Finger).
// SOBALD --mc einen Endpunkt ERREICHT (voll eingeklappt 1 ODER voll ausgeklappt
// 0), federt EINE gedämpfte Sinuswelle dezent über den Endpunkt hinaus und setzt
// sich exakt zurück (Bounce) — direkt beim Erreichen, NICHT erst wenn das
// Scrollen stoppt. Scharfgestellt durchs Überqueren der Mitte (0.5): echte
// Bewegung löst aus, Endpunkt-Jitter nicht. Wird weiter über den Endpunkt
// gescrollt, läuft der Bounce ungestört zu Ende.
let memberUserExpanded = false;
const MC_RANGE = 72;   // px Scroll bis voll eingeklappt (--mc 1)
const MC_SNAP  = 4;    // ab hier gilt die Leiste als eingeklappt (Klasse/Tap/Cursor)

// Bounce-Parameter.
const MC_BOUNCE_A   = 0.18; // Overshoot-Amplitude (Peak ~0.11 → --mc ~1.11 / ~-0.11)
const MC_BOUNCE_K   = 2;    // Halbwellen: 1 Overshoot + kleiner Gegenschwinger
const MC_BOUNCE_DUR = 500;  // ms

function mbReduceMotion() {
  return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}
function mbClamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function mbSetVar(bar, v) { bar.style.setProperty('--mc', v.toFixed(4)); }

// Zielwert 0..1 aus scrollTop; smoothstep für ein lebendigeres Zusammengleiten.
// Bei prefers-reduced-motion binär (0/1) statt stufenlos.
function mbProgress(scrollEl) {
  if (memberUserExpanded) return 0;
  const top = scrollEl.scrollTop;
  if (top <= MC_SNAP) return 0;
  if (mbReduceMotion()) return 1;
  const raw = mbClamp01(top / MC_RANGE);
  return raw * raw * (3 - 2 * raw); // smoothstep
}

// Scroll-gekoppelt: schreibt --mc frame-genau aus scrollTop. In der Zwischenzone
// (0<--mc<1) folgt --mc 1:1 dem Finger (kein Tween). ERREICHT --mc einen Endpunkt
// (0/1) nach echter Bewegung (Mitte 0.5 überquert → _mcArmed), startet EINMALIG
// der Bounce; solange weiter über denselben Endpunkt gescrollt wird, läuft er
// ungestört (kein Cancel/Überschreiben). Scrollen zurück in die Zwischenzone
// bricht den Bounce ab und koppelt wieder an den Finger. Wird auch von
// renderAll() aufgerufen → frische Leisten (--mc 0, _mcLast/_mcArmed undefined)
// halten 0 und bouncen NICHT.
function applyMemberCollapse(scrollEl) {
  if (!scrollEl) return;
  const atTop = scrollEl.scrollTop <= MC_SNAP;
  if (atTop) memberUserExpanded = false;
  const collapsed = !atTop && !memberUserExpanded;
  const target = mbClamp01(mbProgress(scrollEl));
  const endpoint = target <= 0.0001 ? 0 : target >= 0.9999 ? 1 : null;
  const reduce = mbReduceMotion();
  scrollEl.querySelectorAll('.member-bar').forEach(bar => {
    bar.classList.toggle('collapsed', collapsed);
    // Bounce scharfstellen, sobald --mc die Mitte überquert (echte Bewegung in
    // beide Richtungen). Robust bei schnellem Flick (ein 0→1-Frame überquert 0.5
    // ebenfalls) und immun gegen Endpunkt-Jitter, der 0.5 nie erreicht.
    const prev = (bar._mcLast === undefined) ? target : bar._mcLast;
    if ((prev - 0.5) * (target - 0.5) < 0) bar._mcArmed = true;
    bar._mcLast = target;

    if (endpoint === null) {
      // Zwischenzone: an den Finger koppeln, laufenden Bounce abbrechen.
      if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
      mbSetVar(bar, target);
    } else if (bar._mcArmed) {
      // Endpunkt gerade nach echter Bewegung erreicht → Bounce auslösen.
      bar._mcArmed = false;
      if (reduce) {
        if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
        mbSetVar(bar, endpoint);
      } else {
        mbBounce(bar, endpoint);
      }
    } else if (!bar._mcTween) {
      // schon am Endpunkt (oder frisch gerendert) → exakt halten.
      mbSetVar(bar, endpoint);
    }
    // sonst: Bounce läuft am Endpunkt, während weiter gescrollt wird → zu Ende laufen lassen.
  });
}

// Touch: federndes Aufklappen (--mc → 0). easeOutBack schwingt kurz über 1,
// dadurch geht --mc minimal unter 0 → gap/Abstand federn leicht auseinander
// und setzen sich (Pop). box-shadow ist per max(0px, ...) gegen negativen
// Spread abgesichert, daher flackert der Ring beim Overshoot nicht.
function mbExpandBar(bar) {
  bar.classList.remove('collapsed');
  if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
  const from = parseFloat(bar.style.getPropertyValue('--mc')) || 0;
  if (mbReduceMotion() || from <= 0.001) { mbSetVar(bar, 0); return; }
  const t0 = performance.now();
  const dur = 320;
  const c1 = 1.70158, c3 = c1 + 1;
  const ease = p => 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); // easeOutBack
  const run = now => {
    const p = (now - t0) / dur;
    if (p >= 1) { mbSetVar(bar, 0); bar._mcTween = 0; return; }
    mbSetVar(bar, from * (1 - ease(p)));
    bar._mcTween = requestAnimationFrame(run);
  };
  bar._mcTween = requestAnimationFrame(run);
}

// Gedämpfte Sinus-Feder am Endpunkt. offset = A*sin(p*PI*k)*(1-p)^2 ist bei p=0
// UND p=1 exakt 0 → startet und landet EXAKT auf dem Endpunkt (kein Drift, kein
// Clamp nötig). Richtungsabhängig: eingeklappt (1) schwingt ÜBER 1 (Squeeze),
// ausgeklappt (0) UNTER 0 (Fan-out). Nutzt bar._mcTween → ein erneutes
// Scroll-Frame (applyMemberCollapse) bricht den Bounce ab und koppelt zurück.
// --mc darf hier [0,1] verlassen (das IST der Overshoot); CSS ist abgesichert:
// box-shadow max(0px,..) → kein negativer Spread; gap clamped auf >=0.
function mbBounce(bar, endpoint) {
  if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
  const sign = endpoint === 1 ? 1 : -1;
  const t0 = performance.now();
  const run = now => {
    const p = (now - t0) / MC_BOUNCE_DUR;
    if (p >= 1) { mbSetVar(bar, endpoint); bar._mcTween = 0; return; } // exakt landen
    const decay  = (1 - p) * (1 - p);
    const offset = MC_BOUNCE_A * Math.sin(p * Math.PI * MC_BOUNCE_K) * decay;
    mbSetVar(bar, endpoint + sign * offset); // 1 Write pro Frame
    bar._mcTween = requestAnimationFrame(run);
  };
  bar._mcTween = requestAnimationFrame(run);
}

function setupMemberCollapse() {
  document.querySelectorAll('.screen').forEach(sc => {
    let ticking = false;
    sc.addEventListener('scroll', () => {
      // Nur echtes Nutzer-Scrollen hebt den Tipp-Ausklapp-Zustand auf; von einem
      // Re-Render ausgelöste Scroll-Events (Layout-Clamp) werden übersprungen.
      if (performance.now() >= mbRenderScrollGuard) memberUserExpanded = false;
      if (ticking) return;                 // rAF-gedrosselt: max. 1 --mc-Write pro Frame
      ticking = true;
      requestAnimationFrame(() => { ticking = false; applyMemberCollapse(sc); });
    }, { passive: true });
  });
  // Erster Tipp auf die eingeklappte Leiste klappt sie aus (statt Member zu wählen).
  // Auf Maus-Geräten ist sie beim Klick schon per :hover offen → Klick wählt direkt.
  const canHover = !!(window.matchMedia && window.matchMedia('(hover: hover)').matches);
  document.addEventListener('click', (e) => {
    const bar = (e.target && e.target.closest) ? e.target.closest('.member-bar.collapsed') : null;
    if (!bar) return;
    memberUserExpanded = true;
    if (canHover && bar.matches(':hover')) {
      // Maus: bereits per :hover offen → --mc nahtlos auf 0 übernehmen (kein
      // Flackern) und Klick DURCHLASSEN → data-member-Handler wählt Member.
      if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
      bar.classList.remove('collapsed');
      mbSetVar(bar, 0);
      return;
    }
    mbExpandBar(bar);                    // Touch: federndes Aufklappen, KEINE Auswahl
    e.stopPropagation();
    e.preventDefault();
  }, true);
}

// Ring-Grafik der Fortschrittskarte. Geometrie unveraendert aus dem frueheren
// Wochenring: r=30 in einem 76er Feld, Anteil ueber stroke-dashoffset, um -90 Grad
// gedreht, damit der Bogen oben beginnt. Farben kommen aus .ring-track/.ring-value;
// warn faerbt den Bogen rot (liegengebliebene ueberfaellige Aufgaben).
function ringSvg(text, frac, warn) {
  const C = 2 * Math.PI * 30;
  const f = Math.max(0, Math.min(1, Number(frac) || 0));
  return `<svg width="76" height="76" viewBox="0 0 76 76">` +
    `<circle class="ring-track" cx="38" cy="38" r="30" fill="none" stroke-width="7"/>` +
    `<circle class="ring-value${warn ? ' warn' : ''}" cx="38" cy="38" r="30" fill="none" stroke-width="7" stroke-linecap="round" ` +
    `stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - f)).toFixed(1)}" transform="rotate(-90 38 38)"/>` +
    `<text x="38" y="45" text-anchor="middle">${escapeHtml(String(text))}</text></svg>`;
}

// Eine Ring-Kachel: Grafik, Beschriftung, Unterzeile.
function ringTile(text, frac, label, sub, warn) {
  return `<div class="stat-ring">${ringSvg(text, frac, warn)}` +
    `<div class="ring-label">${escapeHtml(label)}</div>` +
    `<div class="ring-sub">${escapeHtml(sub)}</div></div>`;
}

// Artikelstreifen mit der Maus ziehen. Mit dem Finger scrollt der Streifen schon
// nativ (overflow-x), am Zeigergeraet gab es nur Rad und Scrollbalken — und die ist
// hier ausgeblendet. Maus-Events, keine Pointer-Events: die Symcon-Desktop-Webview
// liefert keine (dieselbe Begruendung wie bei bindCardSwipe).
function bindDragScroll(el) {
  if (!el || el._dragScroll) return;
  el._dragScroll = true;
  const SLOP = 6;                        // erst ab hier ist es ein Ziehen, kein Klick
  let startX = 0, startLeft = 0, active = false, decided = false;
  const cleanup = () => {
    active = false; decided = false;
    el.classList.remove('is-dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  const onMove = (e) => {
    if (!active) return;
    const dx = e.clientX - startX;
    if (!decided) {
      if (Math.abs(dx) < SLOP) return;
      decided = true;
      el.classList.add('is-dragging');
    }
    el.scrollLeft = startLeft - dx;
    e.preventDefault();                  // sonst startet die Textauswahl
  };
  const onUp = () => {
    const gezogen = decided;
    cleanup();
    if (!gezogen) return;
    // Nach dem Ziehen folgt ein Klick auf die getroffene Kachel — der darf den
    // Artikel nicht abhaken (gleiche Sperre wie dataset.swiped bei den Wischgesten).
    el.dataset.dragged = '1';
    window.setTimeout(() => { delete el.dataset.dragged; }, 60);
  };
  el.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    active = true; decided = false;
    startX = e.clientX; startLeft = el.scrollLeft;
    document.addEventListener('mousemove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
  });
}

// ── Tagesbriefing ──────────────────────────────────────────────────────────
// Der Text entsteht einmal taeglich im Gateway und wird dort abgelegt; hier wird
// er nur geholt. Deshalb wartet das Dashboard nie auf die KI.
let briefingText = '';
let briefingClips = [];        // vom Gateway vorab erzeugte Tonschnipsel
let briefingVorschau = false;  // true = der Text gilt für MORGEN
let briefingTon = false;       // darf es einen Vorlese-Knopf geben?
let briefingLoading = false;

/** Nur mit Gateway: dort liegt der Text. In der Visu-Kachel scheitert aiPost
    still — die Karte bleibt dort also von selbst aus. */
function briefingAvailable() {
  if (window.__SYMDO__) return true;
  return !!store.gatewayAvailable;
}

/**
 * Bestaende nachladen, die NICHT an einer Listeninstanz haengen.
 *
 * Briefing und Mail-Vorschlaege liegen im Gateway. Sie wurden bisher nur beim
 * vollen Zustands-Push geholt, also einmal beim Start — danach nie wieder:
 * checkRevisions vergleicht ausschliesslich Listen-Instanzen, und die Tuerklingel
 * des Standalone-Adapters liefert nur `instanceState`, niemals einen `state`.
 * Ein neues Briefing und ein neuer Vorschlag erschienen deshalb erst nach einem
 * Neuladen der Seite.
 *
 * Beide Abrufe sind billig (ein Attribut lesen) und laufen im Takt mit — der
 * Bereich zeigt damit hoechstens eine Minute lang einen alten Stand. Ohne Gateway
 * steigen beide Funktionen von selbst aus.
 */
function gatewayNachladen() {
  loadBriefing();
  loadMailProposals();
  loadTimetable();
  /* Notizen und Termine ziehen jetzt auch nach. Sie standen bisher in KEINEM
     Takt: wer sie auf einem anderen Geraet aenderte, sah es hier erst nach dem
     Neuladen der App. Der Notiz-Abruf ist billig (gemessen 3,7 KB, 1,5 ms) und
     durch die Revision gegen ueberfluessiges Zeichnen gesichert.

     Die Termine dagegen NUR im offenen Kalender: dieser Abruf arbeitet sich
     seitenweise durch OpenCalendar, und ihn im Minutentakt fuer einen Bereich zu
     fahren, den niemand ansieht, waere Verschwendung. Wer ihn ansieht, bekommt
     ihn frisch. */
  if (visibleTabs().includes('notes')) { ladeNotizen(); }
  if (activeTab === 'calendar') { loadCalendarEvents(); }
}

/* Stundenplan der Kinder. Wie beim Briefing: still nichts, wenn es kein
   Gateway, keine Instanz oder keinen eingeschalteten Plan gibt — eine leere
   Karte waere schlechter als gar keine. */
let stundenplan = null;
let stundenplanLaeuft = false;
let stundenplanLegende = false;
let stundenplanTag = 0;   // gewaehlter Wochentag, 0 = noch keiner
/* Wann der Plan mit seiner Minutenangabe eintraf, und der Plan OHNE diese
   Minute. Beides gehoert zusammen: die Karte darf sich nicht jede Minute neu
   zeichnen, nur weil die Uhr weitergelaufen ist — ein renderAll() schloesse
   die Legende und risse einen gerade gedrueckten Pfeil unter dem Finger weg. */
let stundenplanAn = 0;
let stundenplanSignatur = '';
let stundenplanTicker = null;

/* Die aktuelle Minute des SERVERS, fortgeschrieben um die Zeit seit dem
   Eintreffen. null heisst „gilt nicht fuer heute" — dann gibt es keinen Strich.
   Nicht die Uhr des Geraets: es kann in einer anderen Zeitzone stehen. */
function stundenplanJetzt() {
  if (!stundenplan || stundenplan.now == null) { return null; }
  const her = stundenplanAn ? Math.max(0, (Date.now() - stundenplanAn) / 60000) : 0;
  return stundenplan.now + her;
}

/* Der Strich fuer eine Balkenzeile. Kein Klemmen an den Rand: ein Strich, der
   abends auf der letzten Stunde klebte, behauptete, der Unterricht laufe. */
/* Labels der Termin-Marker an den Platz anpassen — Zwilling von
   termineBeschriften() in der Stundenplan-Kachel (beide Stellen synchron
   halten). Titel zeigen, wenn Platz ist; kuerzen per Ellipsis; unter 32 px ganz
   weg — Punkt und title-Attribut bleiben. */
/* Mindestbreite einer Schulstunde in Pixeln — Zwilling von MIN_STUECK in der
   Stundenplan-Kachel (beide Stellen synchron halten). */
const PLAN_MIN_STUECK = 24;

/* HIER STAND EINE ZWEITE UNTERGRENZE — der Schultag sollte immer sieben
   Zehntel der sichtbaren Breite behalten. Sie ist raus, an echten Daten
   gemessen: freitags endet die Schule um 10:35, die Achse laeuft wegen eines
   Termins am Donnerstag aber bis 22:15. Um 170 Minuten Schule auf 70 Prozent
   der Karte zu bringen, braucht die ganze Achse das 3,6-Fache ihrer Breite.
   MIN_STUECK haelt jede Stunde lesbar, mehr braucht es nicht. */

/**
 * Breite der Balken bestimmen. Massstab ist die KUERZESTE Stunde des
 * gewaehlten Tages ueber alle Kinder — alle Zeilen brauchen denselben, sonst
 * laegen dieselben Uhrzeiten in zwei Zeilen an verschiedenen Stellen.
 */
/* Zusatzminuten am rechten Ende der Achse: Platz fuer den Titel des LETZTEN
   Termins. Steht rechts von ihm kein weiterer Termin und keine Stunde, wird die
   Achse so weit verlaengert, dass der Titel vollstaendig daneben passt — statt
   ihn zu kuerzen oder nach links zu klappen. Gemessen statt geraten: wie breit
   ein Titel wirklich ist, weiss erst der gezeichnete Text.

   Gilt immer nur fuer EINEN Tag. Die Rundenzaehlung ist die Bremse: jede
   Verlaengerung zieht ein neues Zeichnen nach sich. */
let planZusatzMinuten = 0;
let planZusatzTag = null;
let planZusatzRunden = 0;
const PLAN_ZUSATZ_RUNDEN = 3;

/* Die Achse des GEWAEHLTEN Tages, nicht die der Woche. stundenplan.span
   umspannt die ganze Woche: ein Abendessen am Donnerstag zog sie bis 22:15,
   und am Freitag — Schule bis 10:35, ein Termin bis 15:45 — lief die
   Zeitleiste danach noch sechs Stunden ins Leere.

   Ueber ALLE Kinder vereinigt: die Zeilen stehen untereinander, dieselbe
   Uhrzeit muss in jeder an derselben Stelle liegen. Die Viertelstunde Zugabe
   an den Raendern ist dieselbe, mit der schon das Gateway die Wochenspanne
   aufzieht. */
function planTagesSpanne(gewaehlt) {
  let von = Infinity, bis = -Infinity;
  (stundenplan.children || []).forEach(k => {
    const tag = (k.days || []).filter(t => t.weekday === gewaehlt)[0];
    ((tag && tag.slots) || []).forEach(s => {
      von = Math.min(von, s.from); bis = Math.max(bis, s.to);
    });
    ((tag && tag.events) || []).forEach(e => {
      const a = Number(e.at) || 0;
      const b = Number(e.bis) > a ? Number(e.bis) : a + 60;
      von = Math.min(von, a - 15); bis = Math.max(bis, b + 15);
    });
  });
  // Ein Tag ohne alles bekommt gar keinen Balken; die Wochenspanne ist dann
  // nur noch ein Rueckfall, damit nirgends durch null geteilt wird.
  if (!isFinite(von) || bis <= von) return [stundenplan.span[0], stundenplan.span[1]];
  if (planZusatzTag === gewaehlt) bis += planZusatzMinuten;
  return [Math.max(0, von), Math.min(1440, bis)];
}

function planBalkenBreite() {
  const bahnen = [...document.querySelectorAll('.plan-bahn')];
  if (!bahnen.length || !stundenplan || !stundenplan.span) return;
  const gewaehlt = stundenplanGewaehlt();
  const tagSpan = planTagesSpanne(gewaehlt);
  const spanne = Math.max(tagSpan[1] - tagSpan[0], 60);
  let kuerzeste = Infinity;
  (stundenplan.children || []).forEach(k => {
    const tag = (k.days || []).filter(t => t.weekday === gewaehlt)[0];
    ((tag && tag.slots) || []).forEach(s => {
      kuerzeste = Math.min(kuerzeste, Math.max(1, s.to - s.from));
    });
  });
  // Der Massstab haengt allein an der kuerzesten Stunde des Tages und damit
  // NICHT an der Kartenbreite — nur die Frage, ob gerollt wird, tut das.
  const proMinute = isFinite(kuerzeste) ? PLAN_MIN_STUECK / kuerzeste : 0;
  const noetig = Math.ceil(spanne * proMinute);
  bahnen.forEach(bahn => {
    const platz = bahn.clientWidth;
    const breite = noetig > platz ? noetig : 0;
    bahn.querySelectorAll('.plan-balken, .plan-ticks, .plan-zeiten').forEach(el => {
      el.style.width = breite ? breite + 'px' : '';
    });
    bahn.classList.toggle('rollt', !!breite);
  });
}

/* Alle Zeilen rollen gemeinsam — nebeneinander gestellte Zeilen, die
   verschiedene Zeiten meinen, sind schlimmer als gar kein Rollen. */
function planScrollGleichziehen() {
  const bahnen = [...document.querySelectorAll('.plan-bahn')];
  let laeuft = false;
  bahnen.forEach(b => {
    // Beim Rollen wandert der Balken unter der Blase weg.
    b.addEventListener('scroll', planBlaseWeg);
    b.addEventListener('scroll', () => {
      if (laeuft) return;
      laeuft = true;
      bahnen.forEach(a => { if (a !== b) a.scrollLeft = b.scrollLeft; });
      laeuft = false;
    });
  });
}

/**
 * Die Uhrzeiten unter der Achse setzen — Zwilling von zeitenSetzen() in der
 * Stundenplan-Kachel. An den Raendern nicht ueberstehen, und bei Enge weicht
 * die Terminzeit: die Stundenzeiten umreissen den Schultag.
 */
function planZeitenSetzen() {
  document.querySelectorAll('.plan-zeiten').forEach(zeile => {
    const alle = [...zeile.querySelectorAll('.plan-zeit')];
    const breite = zeile.clientWidth;
    if (!alle.length || !breite) return;
    const platziert = [];
    const stelle = (z) => {
      z.style.display = '';
      const p = parseFloat(z.style.left) / 100;
      z.style.transform = p < 0.06 ? 'none' : (p > 0.94 ? 'translateX(-100%)' : 'translateX(-50%)');
      const w = z.offsetWidth;
      const mitte = p * breite;
      const links = p < 0.06 ? mitte : (p > 0.94 ? mitte - w : mitte - w / 2);
      return [links, links + w];
    };
    alle.filter(z => z.classList.contains('fest')).forEach(z => platziert.push(stelle(z)));
    alle.filter(z => !z.classList.contains('fest')).forEach(z => {
      const [a, b] = stelle(z);
      if (platziert.some(p => a < p[1] + 3 && b + 3 > p[0])) { z.style.display = 'none'; }
      else { platziert.push([a, b]); }
    });
  });
}

/* Der freie Weg von x aus, bis das naechste Hindernis kommt. Ueberdeckt ein
   Hindernis die Stelle x selbst, ist der Weg null.
   Hindernisse sind die Schulstunden: ein Termintitel darf sie NIE ueberlappen.
   Vorher galt der ganze Platz links bzw. rechts vom Balken als frei, und ein
   langer Titel legte sich quer ueber den Vormittag. */
function planWegRechts(hindernisse, x, ende) {
  let grenze = ende;
  hindernisse.forEach(h => {
    if (h.b <= x) return;                          // liegt ganz links davon
    grenze = Math.min(grenze, Math.max(h.a, x));   // deckt es x, wird der Weg 0
  });
  return Math.max(grenze - x, 0);
}
function planWegLinks(hindernisse, x) {
  let grenze = 0;
  hindernisse.forEach(h => {
    if (h.a >= x) return;
    grenze = Math.max(grenze, Math.min(h.b, x));
  });
  return Math.max(x - grenze, 0);
}

/* ── Termintitel bei Beruehrung ────────────────────────────────────────────
   Ein Tipp auf den Balken (oder sein Etikett) zeigt Uhrzeit und Titel — derselbe
   Text, den der Mauszeiger als title bekommt. Die Blase geht nach zweieinhalb
   Sekunden von selbst, ausserdem beim naechsten Tipp, beim Rollen und beim
   Neuzeichnen. */
let planBlase = null;
let planBlaseFrist = null;
function planBlaseWeg() {
  clearTimeout(planBlaseFrist);
  if (planBlase) planBlase.classList.remove('an');
}
function planBlaseZeigen(el, text) {
  if (!text) return;
  if (!planBlase) {
    planBlase = document.createElement('div');
    planBlase.className = 'plan-terminblase';
    document.body.appendChild(planBlase);
  }
  planBlase.textContent = text;
  planBlase.classList.add('an');
  // Erst nach dem Setzen messen: vorher ist die Breite die des alten Textes.
  const k = el.getBoundingClientRect();
  const b = planBlase.getBoundingClientRect();
  const links = Math.min(Math.max(4, k.left + k.width / 2 - b.width / 2),
                         document.documentElement.clientWidth - b.width - 4);
  const oben = k.top - b.height - 6;
  planBlase.style.left = links + 'px';
  planBlase.style.top = (oben < 4 ? k.bottom + 6 : oben) + 'px';
  clearTimeout(planBlaseFrist);
  planBlaseFrist = setTimeout(planBlaseWeg, 2500);
}

function planTermineBeschriften() {
  planBlaseWeg();
  // Groesster Fehlbetrag ueber alle Zeilen, als ANTEIL der Balkenbreite.
  let fehltAnteil = 0;
  document.querySelectorAll('.plan-balken').forEach(balken => {
    const alle = [...balken.querySelectorAll('.plan-termin')];
    const breite = balken.clientWidth;
    if (!alle.length || !breite) return;

    /* Zwilling von termineBeschriften() in der Stundenplan-Kachel (beide
       Stellen synchron halten). Erst die Geometrie, dann die Verteilung: die
       Reihe haengt am BALKEN, nicht am Label — zwei zeitlich ueberlappende
       Termine muessen auseinander, auch wenn fuer die Titel kein Platz ist. */
    /* Aus dem Baum gemessen, nicht aus den Daten gerechnet: die Stunden haben
       eine Mindestbreite in Pixeln (planBalkenBreite), ihre Lage steht also
       nicht im Verhaeltnis zur Zeitspanne allein. */
    const stunden = [...balken.querySelectorAll('.plan-stueck')]
      .map(s => ({ a: s.offsetLeft, b: s.offsetLeft + s.offsetWidth }));

    const posten = [];
    alle.forEach(m => {
      const label = m.querySelector('.plan-termin-titel');
      const lauf  = m.querySelector('.plan-termin-lauf');
      const bar   = m.querySelector('.plan-termin-bar');
      if (!label || !lauf || !bar) return;
      m.classList.remove('flip', 'oben', 'unten', 'ueberlappt');
      // Vor dem Messen zuruecksetzen: ein noch laufender Titel behielte sonst
      // seine alte Weglaenge, wenn die Karte schmaler geworden ist.
      label.classList.remove('laeuft');
      label.style.removeProperty('--marquee-shift');
      m.style.right = 'auto';
      const anteil  = (parseFloat(m.dataset.p) || 0) / 100;
      const anteil2 = (parseFloat(m.dataset.p2) || 0) / 100;
      m.style.left = (anteil * 100) + '%';
      label.style.display = '';
      label.style.maxWidth = 'none';
      const barBreit = Math.max(Math.round((anteil2 - anteil) * breite), 6);
      bar.style.width = barBreit + 'px';
      const barA = anteil * breite;
      const barB = barA + barBreit;
      // +1: scrollWidth rundet ab, und ein Pixel zu wenig laesst den Titel laufen.
      const natur = lauf.scrollWidth ? lauf.scrollWidth + 1 : 0;
      posten.push({ m, label, anteil, anteil2, barA, barB, natur });
    });

    /* Erst wenn ALLE Balken vermessen sind, steht fest, wo ein Titel hin darf.
       Hindernisse sind die Schulstunden UND die uebrigen Terminbalken: ohne die
       Nachbarn greift sich der erste Termin den Platz bis zum naechsten Balken,
       und der naechste steht ohne Beschriftung da, obwohl links von ihm eine
       freie Stunde liegt. */
    const balkenAlle = posten.map(p => ({ a: p.barA, b: p.barB }));
    posten.forEach(pos => {
      /* Die SEITE waehlen die Nachbarn mit: sonst greift sich der erste Termin
         den Platz bis zum naechsten Balken, und der naechste steht ohne
         Beschriftung da, obwohl neben ihm eine freie Stunde liegt.

         Aber nur die Nachbarn, die sich zeitlich NICHT mit uns ueberschneiden:
         nur die koennen in derselben Reihe landen. Wer sich mit uns
         ueberschneidet, wird ohnehin nach oben oder unten geschoben. Der eigene
         Balken faellt ueber dieselbe Regel heraus. */
      const fremd = stunden.concat(balkenAlle.filter(h => h.b <= pos.barA || h.a >= pos.barB));
      pos.nachLinks = planWegLinks(fremd, pos.barA) > planWegRechts(fremd, pos.barB, breite);
      /* Die BREITE dagegen begrenzen nur die Schulstunden. Ein Etikett darf
         ueber den Balken der ANDEREN Reihe hinweglaufen — die liegen 12 px
         auseinander. Zaehlten die Nachbarn auch hier mit, verloere ein Termin,
         der ganz innerhalb eines anderen liegt, seinen Titel. Was in DERSELBEN
         Reihe kollidiert, faengt die Reihenvergabe ab. */
      pos.platzR = Math.floor(planWegRechts(stunden, pos.barB, breite) - 4);
      pos.platzL = Math.floor(planWegLinks(stunden, pos.barA) - 4);
      const platz = pos.nachLinks ? pos.platzL : pos.platzR;
      pos.w = Math.min(pos.natur, Math.max(platz, 0));
      // Genug Platz? Gemessen am Titel, nicht an einer festen Zahl.
      pos.passt = platz >= Math.min(pos.natur, 32);
    });

    /* Der letzte Termin des Tages — der mit dem spaetesten Ende. Wurde die
       Achse fuer ihn verlaengert, gehoert sein Titel nach RECHTS: dafuer ist
       der Platz ja entstanden. Ohne diese Zeile klappte er weiter nach links
       und der gewonnene Raum blieb leer. */
    const letzter = posten.reduce((a, b) => (!a || b.barB > a.barB) ? b : a, null);
    if (letzter && planZusatzTag === stundenplanGewaehlt() && planZusatzMinuten > 0) {
      letzter.nachLinks = false;
      letzter.w = Math.min(letzter.natur, Math.max(letzter.platzR, 0));
      letzter.passt = letzter.platzR >= Math.min(letzter.natur, 32);
    }

    /* ── Reihe und Etikettbreite vergeben ────────────────────────────────
       Zwei Enden je Reihe: `endeBalken` zaehlt nur die BALKEN, `ende` auch die
       Etiketten. Ein Balken ist der Termin selbst, ein Etikett nur seine
       Beschriftung — bei Platznot gewinnt der Balken. Mit nur einem Ende
       landete „Abendessen" in derselben Reihe wie der Schwimmunterricht und
       verschwand unter dessen Balken, weil das lange Etikett der anderen
       Reihe sie rechnerisch belegt hielt. */
    const MIN_TITEL = 32;   // schmaler ist kein Titel mehr, sondern ein Streifen
    const reihen = [{ ende: -1e9, endeBalken: -1e9, letzter: null },
                    { ende: -1e9, endeBalken: -1e9, letzter: null }];
    // Wie weit ragt ein Posten nach RECHTS? Nur ein Etikett rechts vom Balken
    // verlaengert ihn; eines links liegt vor dem Balken.
    const ragtBis = pos => (pos.mitTitel && !pos.nachLinks) ? pos.barB + 4 + pos.w : pos.barB;

    posten.forEach(pos => {
      let r = -1;
      /* a) Eine Reihe, in der Balken UND Etikett Platz haben. Das Fenster darf
            dabei SCHMALER werden als der Titel: seit zu lange Titel laufen,
            ist ein enges Fenster kein Grund mehr, den Titel wegzulassen. */
      if (pos.passt) {
        for (let k = 0; k < 2; k++) {
          if (pos.barA < reihen[k].endeBalken + 4) continue;
          const w = pos.nachLinks
            ? Math.min(pos.w, Math.floor(pos.barA - 8 - reihen[k].ende))
            : pos.w;
          if (w < Math.min(pos.natur, MIN_TITEL)) continue;
          // Nach rechts beschriftet: unser BALKEN darf nicht unter dem Etikett
          // liegen, das in dieser Reihe schon steht.
          if (!pos.nachLinks && pos.barA < reihen[k].ende + 4) continue;
          r = k; pos.mitTitel = true; pos.w = w;
          break;
        }
      }
      // b) Ohne Titel: nur der BALKEN muss frei stehen.
      if (r === -1) {
        for (let k = 0; k < 2; k++) {
          if (pos.barA >= reihen[k].endeBalken + 4) { r = k; pos.mitTitel = false; break; }
        }
      }
      // c) Beide Reihen belegt: die mit dem frueheren Balkenende.
      if (r === -1) {
        r = reihen[0].endeBalken <= reihen[1].endeBalken ? 0 : 1;
        pos.mitTitel = false;
        /* Erst JETZT liegt wirklich Balken auf Balken — es gibt keine Reihe
           mehr, in die dieser Termin ausweichen koennte. Nur dann wird er
           gekennzeichnet. */
        pos.ueberlappt = pos.barA < reihen[r].endeBalken - 0.5;
      }

      /* Steht in der gewaehlten Reihe noch ein Etikett im Weg, muss es weichen
         — erst schmaler, dann ganz. Ein verdeckter Balken waere der groessere
         Verlust.

         NICHT aber, wenn dieser Termin ohnehin auf einem anderen liegt: dann
         ueberlappt sein Balken so oder so (dafuer wird er halb durchsichtig
         gezeichnet), und das Etikett des Nachbarn waere umsonst geopfert. */
      const reihe = reihen[r];
      const vor = reihe.letzter;
      if (!pos.ueberlappt && vor && vor.mitTitel && !vor.nachLinks
          && pos.barA < ragtBis(vor) + 4) {
        const rest = Math.floor(pos.barA - 8 - vor.barB);
        if (rest >= Math.min(vor.natur, MIN_TITEL)) { vor.w = rest; }
        else { vor.mitTitel = false; }
      }
      pos.ende = ragtBis(pos);
      reihen[r] = {
        ende: Math.max(reihe.endeBalken, vor ? ragtBis(vor) : -1e9, pos.ende),
        endeBalken: Math.max(reihe.endeBalken, pos.barB),
        letzter: pos
      };
      pos.r = r;
    });

    posten.forEach(pos => {
      if (pos.ueberlappt) pos.m.classList.add('ueberlappt');
      if (pos.mitTitel) {
        pos.label.style.maxWidth = pos.w + 'px';
        /* Passt der Titel nicht, laeuft er hin und her statt abgeschnitten zu
           bleiben. Erst ab vier Pixeln Ueberhang — dieselbe Schwelle wie im
           Artikelstreifen, fuer zwei Pixel lohnt keine Bewegung. */
        const ueber = pos.natur - pos.w;
        if (ueber > 4) {
          pos.label.style.setProperty('--marquee-shift', `-${Math.round(ueber)}px`);
          pos.label.classList.add('laeuft');
        }
      } else { pos.label.style.display = 'none'; }
      if (pos.mitTitel && pos.nachLinks) {
        pos.m.classList.add('flip');
        pos.m.style.left = 'auto';
        pos.m.style.right = (100 - pos.anteil2 * 100) + '%';
      } else {
        pos.m.style.right = 'auto';
        pos.m.style.left = (pos.anteil * 100) + '%';
      }
    });
    /* Reicht der Platz rechts vom LETZTEN Termin nicht fuer seinen Titel, wird
       die Achse spaeter verlaengert — aber nur, wenn dort wirklich nichts mehr
       steht, weder ein weiterer Termin noch eine Schulstunde. */
    if (letzter && letzter.natur > 0
        && (!letzter.mitTitel || letzter.natur > letzter.w + 1)) {
      const rechts = breite - letzter.barB;
      if (planWegRechts(stunden, letzter.barB, breite) >= rechts - 0.5) {
        const fehlt = letzter.natur + 8 - rechts;
        if (fehlt > 0) fehltAnteil = Math.max(fehltAnteil, fehlt / breite);
      }
    }

    if (posten.some(p => p.r === 1)) {
      posten.forEach(p => p.m.classList.add(p.r === 1 ? 'unten' : 'oben'));
    }
  });

  if (fehltAnteil <= 0) return;
  const gewaehlt = stundenplanGewaehlt();
  if (planZusatzTag !== gewaehlt) { planZusatzTag = gewaehlt; planZusatzMinuten = 0; planZusatzRunden = 0; }
  if (planZusatzRunden >= PLAN_ZUSATZ_RUNDEN) return;
  const sp = planTagesSpanne(gewaehlt);
  const dazu = Math.ceil(fehltAnteil * Math.max(sp[1] - sp[0], 60));
  if (dazu <= 0) return;
  planZusatzMinuten += dazu;
  planZusatzRunden += 1;
  renderDashboard();   // mit der laengeren Achse; der Titel steht dann rechts
}

function stundenplanStrichHtml(istHeute, von, spanne) {
  const jetzt = stundenplanJetzt();
  if (!istHeute || jetzt === null || jetzt < von || jetzt > von + spanne) { return ''; }
  const s = Math.floor(jetzt / 60), m = Math.floor(jetzt) % 60;
  const uhr = (s < 10 ? '0' : '') + s + ':' + (m < 10 ? '0' : '') + m;
  return `<div class="plan-jetzt" title="${escapeHtml(uhr)}" ` +
    `style="left:${(jetzt - von) / spanne * 100}%"></div>`;
}

/* Nur die Position setzen, nicht neu zeichnen. Laeuft der Strich aus der
   Spanne, wird er weggenommen statt am Rand zu kleben. */
function stundenplanStrichStellen() {
  const striche = document.querySelectorAll('.plan-jetzt');
  const jetzt = stundenplanJetzt();
  if (!stundenplan || !stundenplan.span) { return; }
  const tagSpan = planTagesSpanne(stundenplanGewaehlt());
  const von = tagSpan[0], spanne = Math.max(tagSpan[1] - von, 60);
  if (jetzt === null || jetzt < von || jetzt > von + spanne) {
    striche.forEach(n => n.remove());
    return;
  }
  // Erst jetzt in der Spanne (morgens) — dann muss die Karte einmal neu.
  if (!striche.length) { renderAll(); return; }
  const s = Math.floor(jetzt / 60), m = Math.floor(jetzt) % 60;
  striche.forEach(n => {
    n.style.left = ((jetzt - von) / spanne * 100) + '%';
    n.title = (s < 10 ? '0' : '') + s + ':' + (m < 10 ? '0' : '') + m;
  });
}

function stundenplanTickerStellen() {
  if (stundenplanTicker) { return; }
  stundenplanTicker = setInterval(stundenplanStrichStellen, 30000);
}

/* ── Nach einer Drehung neu messen ─────────────────────────────────────────
   planBalkenBreite() schreibt eine PIXELbreite. Wird die Seite schmaler —
   Querformat und zurueck ins Hochformat —, stammt die Breite noch vom
   Querformat, und der Balken ragt hinaus. Also neu messen. NICHT neu zeichnen:
   die Prozentlagen stimmen weiter, und ein Neuaufbau verloere die Rollposition
   und den gewaehlten Tag.

   Nur bei tatsaechlich anderer Breite arbeiten: waehrend der Drehung feuert
   `resize` mehrfach, und die Tastatur auf dem Telefon feuert ihn auch. */
let stundenplanMessTimer = null;
let stundenplanLetzteBreite = -1;
function stundenplanNeuMessen(sofort) {
  clearTimeout(stundenplanMessTimer);
  stundenplanMessTimer = setTimeout(() => {
    const breite = document.documentElement.clientWidth;
