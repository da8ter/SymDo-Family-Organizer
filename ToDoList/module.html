      const kannBearbeiten = schreibbar[String(e.calendarID)] === true && (!serie || e.canUpdateOccurrence === true);
      const kannLoeschen   = schreibbar[String(e.calendarID)] === true && (!serie || e.canDeleteOccurrence === true);
      const darf = kannBearbeiten || kannLoeschen;
      // Die Wisch-Untergruende nur dort, wo auch gewischt werden kann — sonst
      // blitzte beim Ziehen ein rotes Feld auf, das nichts tut.
      const unter = darf
        ? (kannLoeschen ? `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` : '') +
          (kannBearbeiten ? `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` : '')
        : '';
      const knoepfe = !darf ? '' :
        (zeigeBearbeiten && kannBearbeiten ? `<button class="row-btn" data-cal-edit="1" aria-label="${translate('Edit')}" title="${translate('Edit')}"><i class="fa-light fa-pencil"></i></button>` : '') +
        (zeigeLoeschen && kannLoeschen ? `<button class="row-btn destructive" data-cal-del="1" aria-label="${translate('Delete')}" title="${translate('Delete')}"><i class="fa-light fa-trash"></i></button>` : '');
      return `<div class="cal-card${darf ? '' : ' cal-readonly'}" data-cal="${escapeHtml(String(e.calendarID))}" data-id="${escapeHtml(String(e.id || ''))}">` +
        unter +
        `<div class="cal-event">` +
          `<span class="cal-bar"${farbe ? ` style="background:${escapeHtml(farbe)}"` : ''}></span>` +
          // Uhrzeit ueber dem Titel, nicht in einer eigenen Spalte davor: „ganztaegig"
          // sprengte die 44px-Spalte, und die Zeile liest sich von oben nach unten
          // wie eine Aufgabe — wann, was, wo.
          `<span class="cal-body">` +
            `<div class="cal-when">${escapeHtml(wann)}</div>` +
            `<div class="cal-title">${escapeHtml(e.title || translate('Appointment'))}</div>` +
            (unten ? `<div class="cal-sub">${escapeHtml(unten)}</div>` : '') +
          `</span>` +
          // Merkmale, Zustaendigkeit und Knoepfe in EINER Spalte — wie in der
          // Aufgaben- und der Vorschlagszeile. layoutRowMeta() schiebt sie bei
          // Platznot als eigene Zeile unter den Inhalt.
          `<span class="cal-side"><span class="cal-chips">${abzeichen}${wer}</span>${knoepfe}</span>` +
        `</div>` +
      `</div>`;
    }).join('');
    // Ueberschrift und Zeilen als GESCHWISTER, mit Schluessel je Tag — so behaelt
    // renderRows() die unveraenderten Knoten (siehe CSS-Kommentar bei .cal-day-head).
    return `<div class="cal-day-head${k === heuteKey ? ' is-today' : ''}" data-key="tag:${escapeHtml(k)}">` +
      `<span class="cal-weekday">${escapeHtml(calDayLabel(ts))}</span>` +
      `<span>${escapeHtml(calDateLabel(ts))}</span></div>` +
      zeilen;
  }).join(''));

  // renderRows liefert NUR die neu erzeugten Knoten. Genau die brauchen eine
  // Bindung — die uebrigen behalten ihre, samt laufender Wischgeste.
  if (frische !== false) bindCalRows(frische);

  // Messen wie am Ende von renderTodos und renderMailAi.
  ensureTodoMetaObserver();
  requestAnimationFrame(layoutTodoMeta);
}

/**
 * Wischgesten, Zeilenknoepfe und Tipp der Agenda — dieselben wie bei den Aufgaben:
 * links loeschen, rechts bearbeiten (bindCardSwipe), Tipp auf die Zeile oeffnet den
 * Editor. Der Stift-Knopf ist damit ein zusaetzlicher Weg, kein Ersatz.
 *
 * Ein Unterschied bleibt: geloescht wird erst nach Rueckfrage. Ein Termin liegt
 * beim Anbieter und ist fuer alle sichtbar, die den Kalender teilen — ein
 * Fehlwischer ist dort nicht zurueckzuholen. Deshalb `dissolve: false` und der
 * Weg ueber showConfirm, wie beim Loeschen einer Favoritenliste.
 */
function bindCalRows(knoten) {
  knoten.forEach(card => {
    if (!card.classList || !card.classList.contains('cal-card')) return;   // Tagesueberschrift
    if (card.classList.contains('cal-readonly')) return;
    const zeile = card.querySelector('.cal-event');
    const finde = () => calEvents.find(e => String(e.id) === String(card.dataset.id));

    // Serien-Vorkommen nur, wenn DIESES Vorkommen es erlaubt (Flags am Termin,
    // canUpdateOccurrence/canDeleteOccurrence) — sonst mit demselben Hinweis
    // ablehnen, den auch das Gateway gaebe. Die Wache steht an der AKTION und
    // nicht nur am Markup, weil eine Zeile mit nur einer erlaubten Richtung
    // trotzdem beide Wischwege hat.
    const serieErlaubt = (e, art) => {
      if (e.recurring !== true) return true;
      if (art === 'del' ? e.canDeleteOccurrence === true : e.canUpdateOccurrence === true) return true;
      showToast(translate(art === 'del'
        ? 'This appointment is part of a series. This calendar does not allow deleting a single occurrence — please delete it in your calendar app.'
        : 'This appointment is part of a series. This calendar does not allow editing a single occurrence — please edit it in your calendar app.'));
      return false;
    };

    const loeschen = () => {
      // Slide-out zuruecknehmen, damit die Zeile bei Abbruch stehen bleibt.
      card.classList.remove('is-deleting'); delete card.dataset.animating;
      if (zeile) zeile.style.transform = '';
      restoreCard(card);
      const e = finde();
      if (!e || !serieErlaubt(e, 'del')) return;
      showConfirm(translate('Delete this appointment?'), translate('Delete'), () => calDelete(e));
    };
    const bearbeiten = () => { const e = finde(); if (e && serieErlaubt(e, 'edit')) openCalEditor(e, null, e); };

    bindCardSwipe(card, '.cal-event', loeschen, bearbeiten, { dissolve: false });

    // Tipp auf die Zeile — wie bei einer Aufgabe. Nach einer Wischgeste NICHT:
    // bindCardSwipe setzt dafuer 60 ms lang dataset.swiped, sonst oeffnete jedes
    // Wischen zum Bearbeiten den Dialog zweimal.
    if (zeile) zeile.addEventListener('click', (ev) => {
      if (card.dataset.swiped === '1') return;
      if (ev.target.closest('button')) return;
      bearbeiten();
    });

    const bBtn = card.querySelector('[data-cal-edit]');
    if (bBtn) bBtn.addEventListener('click', (ev) => { ev.stopPropagation(); bearbeiten(); });
    const lBtn = card.querySelector('[data-cal-del]');
    if (lBtn) lBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const e = finde();
      if (e && serieErlaubt(e, 'del')) showConfirm(translate('Delete this appointment?'), translate('Delete'), () => calDelete(e));
    });
  });
}

/** Termin beim Anbieter loeschen. Die Rueckfrage ist an dieser Stelle bereits gefallen. */
function calDelete(e) {
  aiPost('/calendar', {
    action: 'delete',
    calendarID: e.calendarID,
    event: { id: e.id, uid: e.uid, startTimestamp: e.start }
  }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true) {
      showToast((j && j.error && j.error.message) || translate('The calendar rejected the deletion.'));
      return;
    }
    showToast(translate('Appointment deleted'));
    // Der Anbieter ist die Wahrheit: neu holen statt lokal zu raten.
    calEvents = [];
    loadCalendarEvents();
  }).catch(() => showToast(translate('The calendar rejected the deletion.')));
}

// ── Termin anlegen ───────────────────────────────────────────────────────────
// Geschrieben wird ueber OpenCalendar, also beim Anbieter (Google, iCloud, CalDAV).
// Der Eintrag ist danach fuer alle sichtbar, die den Kalender teilen — deshalb
// nichts automatisch, und der Dialog zeigt vorher genau, was gespeichert wird.
let calCtx = null;      // {proposal:{id,i}|null}
let ceAssigned = [];    // Mitglieder des Termins, wie tdAssigned bei Aufgaben

/** Nur Kalender, in die geschrieben werden darf. */
function calWritable() {
  return calCalendars.filter(c => c.canWrite === true);
}

function calLocalInput(datum, zeit, ganztags) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(datum || ''));
  if (!m) return '';
  if (ganztags) return m[0];
  const t = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(zeit || ''));
  return m[0] + 'T' + (t ? t[0] : '09:00');
}

/**
 * „Fwd: WG: Halbjahresplaner" → „Halbjahresplaner".
 *
 * Gegenstueck zu MailStripReplyPrefix im Gateway, hier fuer den AEUSSEREN Betreff:
 * er wird gebraucht, wenn der zitierte Kopf keinen Betreff hergab oder der Vorschlag
 * noch aus der Zeit vor `origin` stammt.
 */
function mailPlainSubject(betreff) {
  let text = String(betreff || '').trim();
  let vorher = '';
  while (vorher !== text) {
    vorher = text;
    text = text.replace(/^\s*(?:fwd?|wg|aw|re|antw)\s*:\s*/i, '').trim();
  }
  return text;
}

/**
 * Wiederholung eines Vorschlags in Worte fassen: „wöchentlich · 15 Termine" bzw.
 * „wöchentlich · bis 03.12.2026". Gibt '' zurueck, wenn keine gueltige Reihe
 * vorliegt — dieselben drei Takte, die das Gateway kennt (CalSeriesRule).
 */
function calSeriesText(r) {
  if (!r || typeof r !== 'object') return '';
  const takt = { weekly: 'weekly', biweekly: 'biweekly', monthly: 'monthly' }[String(r.freq || '')];
  if (!takt) return '';
  const teile = [translate(takt)];
  const anzahl = parseInt(r.count) || 0;
  if (anzahl > 1) {
    teile.push(translate('%1 appointments').replace('%1', String(anzahl)));
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(String(r.until || ''))) {
    const m = String(r.until).split('-');
    teile.push(translate('until %1').replace('%1', `${m[2]}.${m[1]}.${m[0]}`));
  }
  return teile.join(' · ');
}

/**
 * Titel des Glocken-Abzeichens. Die Vorlaufzeit steht in der Ablage des Gateways,
 * also kann hier stehen WANN erinnert wird und nicht bloss DASS erinnert wird.
 */
function calReminderTitle(sekunden) {
  const n = Number(sekunden);
  if (!LEAD_TIMES.includes(n)) return translate('Reminder');
  // Vorlauf 0 heisst bei einer Aufgabe „zur Faelligkeit" — ein Termin hat keine
  // Frist, sondern findet statt. Deshalb hier eigene Worte statt leadTimeLabel().
  const wann = n === 0 ? translate('At the appointment') : leadTimeLabel(n);
  return translate('Reminder') + ': ' + wann;
}

/** Unix-Zeit in den Wert eines date- bzw. datetime-local-Feldes (Ortszeit). */
function calInputFromTs(ts, ganztags) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  const tag = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  return ganztags ? tag : `${tag}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

/**
 * @param entwurf {title,info,due,time,end,allDay} — auch von Hand aufrufbar (entwurf=null)
 * @param vorschlag {id,i}|null — Mail-Vorschlag, der nach dem Speichern erledigt ist
 * @param bestand   Termin aus calEvents; gesetzt heisst AENDERN statt Anlegen
 */
function openCalEditor(entwurf, vorschlag, bestand) {
  const schreibbar = calWritable();
  if (schreibbar.length === 0) {
    showToast(translate('No writable calendar available.'));
    return;
  }
  calCtx = {
    proposal: vorschlag || null,
    // Reihe nur beim Anlegen aus einem Vorschlag: ein bestehender Termin ist immer
    // ein einzelnes Vorkommen (gemessen — Aendern trifft nie die ganze Serie).
    recurrence: (!bestand && entwurf && entwurf.recurrence) ? entwurf.recurrence : null,
    // Erkennungsfelder festhalten: die Liste kann sich waehrend des Dialogs neu
    // laden, der Termin unter der Zeile bleibt aber derselbe.
    edit: bestand ? {
      calendarID: bestand.calendarID,
      id: String(bestand.id || ''),
      uid: String(bestand.uid || ''),
      startTimestamp: bestand.start || 0
    } : null
  };
  const e = bestand || entwurf || {};
  const ganztags = e.allDay === true;

  document.getElementById('calEditTitle').textContent =
    translate(bestand ? 'Edit appointment' : 'New appointment');
  document.getElementById('ceTitle').value = String(e.title || '');
  document.getElementById('ceInfo').value = String(e.info || '');
  document.getElementById('ceLocation').value = String(e.location || '');
  document.getElementById('ceAllDay').checked = ganztags;

  const auswahl = document.getElementById('ceCalendar');
  auswahl.innerHTML = schreibbar.map(c =>
    `<option value="${escapeHtml(String(c.id))}">${escapeHtml(c.name)}</option>`).join('');
  if (bestand) {
    // Beim Aendern steht der Kalender fest: OpenCalendar aendert innerhalb SEINER
    // Instanz, ein Umhaengen waere loeschen und neu anlegen — das ist ein anderer
    // Vorgang und soll nicht als Nebenwirkung eines Speichern passieren.
    auswahl.value = String(bestand.calendarID);
    auswahl.disabled = true;
  } else {
    auswahl.disabled = false;
    // Zuletzt benutzter Kalender, falls er noch beschreibbar ist.
    const gemerkt = String(ls.get('symdo.calWrite') || '');
    if (schreibbar.some(c => String(c.id) === gemerkt)) auswahl.value = gemerkt;
  }

  // Mitglieder: aus dem Vorschlag das Mitglied der Empfaengeradresse, sonst der
  // Standardnutzer — genau wie bei einer Aufgabe. Beim Aendern gilt, was am Termin
  // steht, auch wenn das niemand ist.
  ceAssigned = Array.isArray(e.members) && e.members.length ? e.members.slice()
    : (bestand ? [] : (e.userId ? [e.userId] : (currentUserID() ? [currentUserID()] : [])));
  renderAssignList('ceAssignList', ceAssigned);

  // Erinnerung: bei einem Termin mit Uhrzeit sinnvoll voreingestellt, ganztaegig
  // ausgeschaltet — eine Erinnerung „30 Minuten vor 00:00" hilft niemandem. Beim
  // Aendern kommt die eingestellte Vorlaufzeit aus der Ablage des Gateways mit.
  const lead = document.getElementById('ceLeadTime');
  lead.innerHTML = LEAD_TIMES.map(x => `<option value="${x}">${leadTimeLabel(x)}</option>`).join('');
  const vorlauf = bestand ? Number(bestand.reminder) : -1;
  const hatVorlauf = Number.isFinite(vorlauf) && vorlauf >= 0;
  lead.value = String(hatVorlauf && LEAD_TIMES.includes(vorlauf) ? vorlauf : 1800);
  document.getElementById('ceNotify').checked = hatVorlauf;
  calSyncNotify();

  calSyncEditor(ganztags);
  if (bestand) {
    document.getElementById('ceStart').value = calInputFromTs(bestand.start, ganztags);
    // Ganztaegig ist das Ende beim Anbieter EXKLUSIV (siehe CalCreateEvent) — im
    // Feld muss der letzte Tag stehen, sonst waechst der Termin bei jedem
    // Speichern um einen Tag.
    const ende = ganztags ? bestand.end - 86400 : bestand.end;
    document.getElementById('ceEnd').value =
      ende > bestand.start ? calInputFromTs(ende, ganztags) : calInputFromTs(bestand.start, ganztags);
  } else {
    document.getElementById('ceStart').value = calLocalInput(e.due, e.time, ganztags);
    // Ende nur, wenn der Vorschlag eines nennt — sonst leer lassen und OpenCalendar
    // die Vorgabe waehlen (eine Stunde bzw. ein Tag).
    document.getElementById('ceEnd').value = e.end ? calLocalInput(e.end, null, ganztags) : '';
  }

  // Reihe sichtbar machen, damit vor dem Speichern klar ist, dass daraus mehrere
  // Termine werden — und wie viele.
  const reiheText = calSeriesText(calCtx.recurrence);
  const reiheZeile = document.getElementById('ceSeriesRow');
  if (reiheZeile) {
    reiheZeile.style.display = reiheText ? '' : 'none';
    const feld = document.getElementById('ceSeries');
    if (feld) feld.textContent = reiheText;
  }
  // Bei einer Reihe ist das Ende-Feld ohne Bedeutung: jeder Termin der Reihe
  // bekommt die Dauer des Anbieters, ein Ende in drei Monaten waere der alte Klotz.
  const endeZeile = document.getElementById('ceEnd');
  if (endeZeile && endeZeile.parentElement) {
    endeZeile.parentElement.style.display = reiheText ? 'none' : '';
    if (reiheText) endeZeile.value = '';
  }
  openOverlay('calEditOverlay');
}

/** Vorlaufzeit nur zeigen, wenn eine Erinnerung gewuenscht ist. */
function calSyncNotify() {
  const an = document.getElementById('ceNotify').checked;
  document.getElementById('ceLeadSection').style.display = an ? '' : 'none';
}

/** Ganztaegig schaltet die Eingaben zwischen Datum und Datum-mit-Zeit um. */
function calSyncEditor(ganztags) {
  ['ceStart', 'ceEnd'].forEach(id => {
    const el = document.getElementById(id);
    const alt = el.value;
    el.type = ganztags ? 'date' : 'datetime-local';
    // Beim Wechsel den Tagesanteil retten, damit die Eingabe nicht leer wird.
    const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(alt || ''));
    if (m) el.value = ganztags ? m[1] : m[1] + 'T09:00';
  });
}

function saveCalEditor() {
  if (!calCtx) return;
  const titel = document.getElementById('ceTitle').value.trim();
  if (!titel) { showToast(translate('The appointment needs a title.')); return; }
  const kalenderID = parseInt(document.getElementById('ceCalendar').value) || 0;
  const ganztags = document.getElementById('ceAllDay').checked;
  const start = document.getElementById('ceStart').value;
  const ende = document.getElementById('ceEnd').value;
  if (!start) { showToast(translate('The appointment start is invalid.')); return; }

  // Aendern oder anlegen: derselbe Dialog, dieselben Pruefungen, nur die Aktion und
  // die Erkennungsfelder unterscheiden sich.
  const bestand = calCtx.edit;
  const ereignis = {
    title: titel, allDay: ganztags, start: start, end: ende,
    location: document.getElementById('ceLocation').value.trim(),
    info: document.getElementById('ceInfo').value.trim(),
    members: ceAssigned.slice(),
    // -1 = keine Erinnerung. 0 ist eine gueltige Vorlaufzeit („zum Termin").
    reminder: document.getElementById('ceNotify').checked
      ? (parseInt(document.getElementById('ceLeadTime').value) || 0) : -1
  };
  if (bestand) {
    ereignis.id = bestand.id;
    ereignis.uid = bestand.uid;
    ereignis.startTimestamp = bestand.startTimestamp;
  } else if (calCtx.recurrence) {
    // Das Gateway rechnet daraus die Einzeltermine (CalExpandSeries) und legt sie
    // der Reihe nach an. Ein Ende geht bei einer Reihe NICHT mit.
    ereignis.recurrence = calCtx.recurrence;
    delete ereignis.end;
  }

  const knopf = document.getElementById('btnCalEditSave');
  knopf.disabled = true;
  aiPost('/calendar', {
    action: bestand ? 'update' : 'create',
    calendarID: bestand ? bestand.calendarID : kalenderID,
    event: ereignis
  }).then(r => {
    knopf.disabled = false;
    const j = r && r.json;
    if (!j || j.ok !== true) {
      // Der Anbieter kann ablehnen (Rechte, ungueltiger Zeitraum). Der Dialog bleibt
      // offen, damit die Eingabe nicht verloren ist.
      showToast((j && j.error && j.error.message) || translate('The calendar rejected the appointment.'));
      return;
    }
    if (!bestand) {
      ls.set('symdo.calWrite', String(kalenderID));
      if (calCtx && calCtx.proposal) {
        aiPost('/mail/proposals', { action: 'taken', id: calCtx.proposal.id, i: Number(calCtx.proposal.i) });
        mailForget(calCtx.proposal.id, calCtx.proposal.i);
      }
    }
    closeOverlay('calEditOverlay');
    calCtx = null;
    // Bei einer Reihe zaehlt die Rueckmeldung: 15 Termine sind ein anderes Ergebnis
    // als einer. Blieb es bei einem Teil, sagt der Hinweis das ausdruecklich — sonst
    // haette niemand Anlass, im Kalender nachzuzaehlen.
    const angelegt = parseInt(j.created) || 0;
    if (j.partial) {
      showToast(translate('Only %1 of %2 appointments were created.')
        .replace('%1', String(angelegt)).replace('%2', String(parseInt(j.planned) || angelegt)));
    } else if (j.capped) {
      // Nur-bis-Reihe am 60er-Deckel gekappt: alles Geplante ist da, aber das
      // Bis-Datum haette mehr ergeben — das gehoert gesagt.
      showToast(translate('The series was capped at %1 appointments.').replace('%1', String(parseInt(j.capped) || 0)));
    } else if (angelegt > 1) {
      showToast(translate('%1 appointments added').replace('%1', String(angelegt)));
    } else {
      showToast(translate(bestand ? 'Appointment updated' : 'Appointment added'));
    }
    // Der neue Stand kommt erst nach dem naechsten Abruf aus OpenCalendar.
    calEvents = [];
    loadCalendarEvents();
  }).catch(() => { knopf.disabled = false; });
}

function initCalEditor() {
  const alle = document.getElementById('ceAllDay');
  if (alle) alle.addEventListener('change', () => calSyncEditor(alle.checked));
  const melden = document.getElementById('ceNotify');
  if (melden) melden.addEventListener('change', calSyncNotify);
  const speichern = document.getElementById('btnCalEditSave');
  if (speichern) speichern.addEventListener('click', saveCalEditor);
  // Beschriftungen einmalig setzen
  const t = (id, key) => { const el = document.getElementById(id); if (el) el.textContent = translate(key); };
  t('calEditTitleLabel', 'Title');
  t('calEditCalendarLabel', 'Calendar');
  t('calEditAllDayLabel', 'All day');
  t('calEditStartLabel', 'Start');
  t('calEditEndLabel', 'End');
  t('calEditLocationLabel', 'Location');
  t('calEditInfoLabel', 'Note');
  t('calEditAssignLabel', 'Assigned to');
  t('calEditNotifyLabel', 'Reminder');
  t('calEditLeadLabel', 'Remind');
  t('calEditSeriesLabel', 'Recurrence');
  // Beschriftet wie im ToDo-Editor („Abbrechen"/„Speichern") statt nur ✕ und ✓ —
  // dieselben Schluessel, damit beide Dialoge nicht auseinanderlaufen.
  t('btnCalEditCancel', 'Cancel');
  t('btnCalEditSave', 'Save');
}

function initCalendar() {
  const schalter = document.getElementById('calSwitcher');
  if (schalter) schalter.addEventListener('change', () => {
    ls.set('symdo.calID', schalter.value);
    loadCalendarEvents();
  });
  const spanne = document.getElementById('calRange');
  if (spanne) spanne.addEventListener('change', () => {
    ls.set('symdo.calRange', spanne.value);
    loadCalendarEvents();
  });
}

function renderTodos() {
  const vis = visibleInstances('todo');
  const id = selectedTodoID();
  const st = id ? instState(id) : null;
  updateSwitcher('todoSwitcher', 'todoTitle', vis, id, 'symdo.selectedTodoID');

  const area = document.getElementById('todoListArea');
  if (!st) {
    renderInto(area, `<div class="empty-state"><i class="fa-light fa-list-check"></i>${translate('No ToDo list found')}${noInstanceHint('todo')}</div>`);
    return;
  }
  const sortMode = String(st.sortMode || 'created');
  const sortDir = String(st.sortDir || 'asc');
  // Abzeichen der Aufgabenzeile: fuenf gleichrangige Schalter, kein Hauptschalter
  // mehr. Opt-out — fehlt ein Schluessel, ist das Abzeichen an.
  const badges = {
    quantity:     st.showQuantityBadge !== false,
    recurrence:   st.showRecurrenceBadge !== false,
    due:          st.showDueBadge !== false,
    notification: st.showNotificationBadge !== false,
    priority:     st.showPriorityBadge !== false,
  };
  // Anlegen und Sortieren sind je Liste abschaltbar (opt-out). Die Eingabezeile ist
  // der eine Weg zum Anlegen, der Menueeintrag "mit Details" der andere — beide
  // haengen am selben Schalter, sonst waere "Erstellen aus" nur halb wirksam.
  const showCreate = st.showCreateButton !== false;
  const showSorting = st.showSorting !== false;
  const inputbar = document.getElementById('todoInputbar');
  if (inputbar) inputbar.style.display = showCreate ? '' : 'none';
  // Der "..."-Knopf ist der Sortier-Knopf: ohne Sortierung verschwindet er, auch
  // wenn Anlegen an ist. Angelegt wird dann ueber die Eingabezeile; der Weg
  // "Neue Aufgabe mit Details" ueber das Menue entfaellt damit bewusst.
  const menuBtn = document.getElementById('btnTodoMenu');
  if (menuBtn) menuBtn.style.display = showSorting ? '' : 'none';
  // Member-Filter (Vereinigung): nur Aufgaben mit mindestens einem gewählten Mitglied.
  // Ist die Leiste dieser Liste aus, filtert der Tab nicht — die Auswahl waere
  // unsichtbar. Geloescht wird sie aber nicht mehr: sie ist bereichsuebergreifend
  // und gehoert auch der Uebersicht und dem Kalender.
  let items = st.items || [];
  const todoFilter = st.showMemberBar === false ? new Set() : memberFilterIds;
  if (todoFilter.size > 0) {
    items = items.filter(it => Array.isArray(it.assignedTo) && it.assignedTo.some(mid => todoFilter.has(mid)));
  }
  // Uebersicht: Zahlen aus denselben Aufgaben, die die Liste zeigt. classifyDue
  // ist dieselbe Einstufung wie bei den Faelligkeits-Marken der Zeilen.
  const stats = document.getElementById('todoStats');
  if (stats) {
    if (st.showOverview !== false) {
      const offen = items.filter(i => !i.done);
      document.getElementById('statOpenLabel').textContent = translate('Open Tasks');
      document.getElementById('statOverdueLabel').textContent = translate('Overdue');
      document.getElementById('statTodayLabel').textContent = translate('Due today');
      document.getElementById('statOpenValue').textContent = String(offen.length);
      document.getElementById('statOverdueValue').textContent =
        String(offen.filter(i => classifyDue(i) === 'overdue').length);
      document.getElementById('statTodayValue').textContent =
        String(offen.filter(i => classifyDue(i) === 'today').length);
      stats.style.display = '';
    } else {
      stats.style.display = 'none';
    }
  }
  const sorted = sortTodoItems(items, sortMode, sortDir);
  const open = sorted.filter(i => !i.done);
  const done = sorted.filter(i => i.done);
  // Bei aktivem Filter kein Drag-Reorder — sonst würde ein Reorder der
  // gefilterten Teilmenge die Gesamtreihenfolge verfälschen.
  // Der Griff ist zudem je Liste abschaltbar; mit ihm faellt auch das Ziehen weg,
  // denn er IST die Anfassstelle der Geste.
  const canReorder = sortMode === 'manual' && todoFilter.size === 0
    && st.showReorderHandle !== false;
  const showEdit = st.showEditButton === true;
  const showDelete = st.showDeleteButton === true;

  // Member-Menü: eigenständige sticky Pille ganz oben (vor dem Header), wie im
  // Dashboard. Wird in den statischen #todoMembers-Container gerendert, damit
  // sein sticky-Bezug .content (die volle Höhe) ist und es dauerhaft pinnt.
  renderTodoMembers();

  // data-key auf allen Knoten ohne data-id (siehe renderRows)
  let html = '';
  if (open.length === 0 && done.length === 0) {
    const msg = todoFilter.size > 0 ? translate('No matches for this filter.') : translate('No tasks');
    html += `<div class="empty-state" data-key="empty"><i class="fa-light fa-list-check"></i>${msg}</div>`;
  }
  for (const it of open) html += todoRowHtml(it, canReorder, badges, showEdit, showDelete);
  if (done.length > 0 && st.hideCompletedTasks !== true) {
    html += `<button class="section-toggle${completedExpanded ? ' open' : ''}" data-key="doneToggle" id="doneToggle">` +
      `<i class="fa-light fa-circle-check"></i>${translate('Completed')}` +
      `<span class="count">${done.length}</span><i class="fa-light fa-chevron-right chev"></i></button>`;
    if (completedExpanded) {
      for (const it of done) html += todoRowHtml(it, false, badges, showEdit, showDelete);
    }
  }
  const freshNodes = renderRows(area, html);
  if (freshNodes === false) return;

  const doneToggle = freshNodes.find(n => n.id === 'doneToggle');
  if (doneToggle) doneToggle.addEventListener('click', () => {
    completedExpanded = !completedExpanded;
    ls.set('symdo.completedExpanded', completedExpanded ? '1' : '0');
    renderTodos();
  });

  // Wie bei der Einkaufsliste: nur neue Karten binden, und die Handler holen
  // ihre Daten beim Ereignis statt sie beim Rendern festzuhalten.
  const curId = () => selectedTodoID();
  const curItem = (iid) => ((instState(curId()) || {}).items || []).find(i => i.id === iid);
  const openNow = () => {
    const s = instState(curId()) || {};
    let list = s.items || [];
    if (todoFilter.size > 0) {
      list = list.filter(it => Array.isArray(it.assignedTo) && it.assignedTo.some(mid => todoFilter.has(mid)));
    }
    return sortTodoItems(list, String(s.sortMode || 'created'), String(s.sortDir || 'asc')).filter(i => !i.done);
  };
  const doneNow = () => {
    const s = instState(curId()) || {};
    let list = s.items || [];
    if (todoFilter.size > 0) {
      list = list.filter(it => Array.isArray(it.assignedTo) && it.assignedTo.some(mid => todoFilter.has(mid)));
    }
    return sortTodoItems(list, String(s.sortMode || 'created'), String(s.sortDir || 'asc')).filter(i => i.done);
  };
  freshNodes.filter(n => n.classList && n.classList.contains('todo-card')).forEach(card => {
    const itemId = parseInt(card.dataset.id);
    if (!curItem(itemId)) return;
    bindTodoGesture(card, id, area, openNow, doneNow, canReorder,
      () => sdCall(curId(), 'DeleteItem', { id: itemId }),
      () => { const it = curItem(itemId); if (it) openTodoEditor(curId(), it); });
    const chk = card.querySelector('.chk');
    chk.addEventListener('click', (e) => e.stopPropagation());
    chk.addEventListener('change', () => {
      if (card.dataset.animating === '1') return;
      card.dataset.animating = '1';
      const done = chk.checked;
      // Abgehakt schiebt nach rechts, wieder geoeffnet nach links — wie bei den Artikeln.
      checkOffCard(card, !done, () => sdCall(curId(), 'ToggleDone', { id: itemId, done: done }));
    });
    // Tipp auf die Karte öffnet den Editor — unabhaengig davon, ob der Stift-Knopf
    // eingeblendet ist. Der Knopf ist ein zusaetzlicher Weg, kein Ersatz.
    card.querySelector('.todo-content').addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button, .chk')) return;
      const it = curItem(itemId);
      if (it) openTodoEditor(curId(), it);
    });
    const editBtn = card.querySelector('[data-edit]');
    if (editBtn) editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const it = curItem(itemId);
      if (it) openTodoEditor(curId(), it);
    });
    const delBtn = card.querySelector('[data-del]');
    if (delBtn) delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sdCall(curId(), 'DeleteItem', { id: itemId });
    });
  });

  ensureTodoMetaObserver();
  requestAnimationFrame(layoutTodoMeta);
}

// Chip-/Button-Zeile einer Aufgabe: belegt sie mehr als die Hälfte der
// Task-Breite, rutscht sie als eigene Zeile unter den restlichen Inhalt.
let todoMetaRO = null;
let todoMetaLastW = -1;
let todoMetaMO = null;
let todoMetaLateTimer = 0;

/**
 * Nachmessen, wenn die Chips erst später ihre endgültige Breite bekommen.
 * Zwei Quellen dafür:
 *  - /icons.js (Font Awesome SVG+JS) ersetzt jedes <i> NACHTRÄGLICH durch ein
 *    <svg>. Vorher sind die Icon-Chips fast leer; die Messung im
 *    requestAnimationFrame direkt nach dem Rendern sieht also eine zu schmale
 *    Zeile — die Verdichtung greift dann nie, und die Zeile bricht später um.
 *  - Webfont-Metrik (document.fonts.ready).
 * Klassenwechsel aus layoutTodoMeta lösen das NICHT erneut aus: das sind
 * Attribut-, keine childList-Änderungen — also keine Rückkopplung.
 */
function ensureTodoMetaLateObserver() {
  const bereiche = META_BEREICHE
    .map(cfg => document.getElementById(cfg.area))
    .filter(Boolean);
  if (bereiche.length === 0) return;
  if (!todoMetaMO && typeof MutationObserver !== 'undefined') {
    // /icons.js liefert die <svg> NACHTRAEGLICH — vorher sind die Icon-Chips fast
    // leer und die Messung sieht eine zu schmale Zeile. Das gilt in der
    // Vorschlagsliste genauso wie in der Aufgabenliste.
    todoMetaMO = new MutationObserver(() => {
      clearTimeout(todoMetaLateTimer);
      todoMetaLateTimer = setTimeout(layoutTodoMeta, 60);
    });
    bereiche.forEach(a => todoMetaMO.observe(a, { childList: true, subtree: true }));
  }
  if (document.fonts && document.fonts.ready && !ensureTodoMetaLateObserver.fontsHooked) {
    ensureTodoMetaLateObserver.fontsHooked = true;
    document.fonts.ready.then(() => layoutTodoMeta()).catch(() => {});
  }
}
/**
 * Die Bereiche, deren Chip-Zeilen gemessen werden. Aufgabenliste und
 * Vorschlagsbaender teilen sich die Logik UND die CSS-Regeln — eine Zeile, die in
 * beiden Listen gleich aussehen soll, darf nicht zwei Messungen haben.
 */
const META_BEREICHE = [
  { area: 'todoListArea', card: '.todo-card', content: '.todo-content', side: '.todo-side', meta: '.todo-meta' },
  { area: 'mailAiArea',   card: '.mail-item', content: '.mail-row',     side: '.mail-side', meta: '.mail-chips' },
  { area: 'calAiArea',    card: '.mail-item', content: '.mail-row',     side: '.mail-side', meta: '.mail-chips' },
  { area: 'calArea',      card: '.cal-card',  content: '.cal-event',    side: '.cal-side',  meta: '.cal-chips'  },
];

function layoutTodoMeta() {
  META_BEREICHE.forEach(layoutRowMeta);
}

function layoutRowMeta(cfg) {
  const area = document.getElementById(cfg.area);
  if (!area) return;
  if (cfg.area === 'todoListArea') todoMetaLastW = area.clientWidth;
  const cards = area.querySelectorAll(cfg.card);
  // Erst überall zurücksetzen, damit die natürliche (nicht verdichtete)
  // Chip-Breite gemessen wird, dann pro Zeile stufenweise entscheiden.
  cards.forEach(card => {
    const c = card.querySelector(cfg.content);
    if (c) c.classList.remove('stacked', 'meta-tight', 'meta-tighter');
  });
  cards.forEach(card => {
    const c = card.querySelector(cfg.content);
    const m = card.querySelector(cfg.side) || card.querySelector(cfg.meta);
    if (!c || !m) return;
    // Unveränderte Grenze: belegt die Chip-Zeile mehr als die halbe Kartenbreite,
    // rutscht sie als eigene Zeile unter den Inhalt.
    if (m.offsetWidth <= c.clientWidth / 2) return;
    c.classList.add('stacked');

    // Verdichtet wird ausschließlich HIER, in der eigenen Zeile — und nur, wenn
    // selbst deren volle Breite nicht reicht. Ohne diese Prüfung ragt die Zeile
    // heraus und schneidet den Drag-Griff rechts ab.
    // Referenz ist die KARTE, nicht .todo-side: dessen `flex: none` (also
    // flex-shrink: 0) lässt die Box trotz flex-basis:100% auf Inhaltsbreite
    // stehen und aus der Karte herausragen — gemessen 307 px in 289 px. Die
    // Kinder gegen die eigene Box zu prüfen wäre blind, denn die wächst mit ihnen.
    // Kriterium ist der UMBRUCH, nicht eine gerechnete Breite: die Chips dürfen
    // in der eigenen Zeile umbrechen (siehe CSS), also überschreiten sie nie eine
    // Breite — sie werden höher. „Platz reicht nicht" heißt damit genau: die
    // Chips bräuchten eine zweite Zeile. Das misst den tatsächlichen Zustand und
    // hängt nicht an Innenabständen, Schriftmetrik oder Flex-Feinheiten.
    const meta = c.querySelector(cfg.meta);
    const wraps = () => {
      if (!meta || !meta.firstElementChild) return false;
      let tallest = 0;
      for (const el of meta.children) {
        tallest = Math.max(tallest, el.getBoundingClientRect().height);
      }
      return meta.getBoundingClientRect().height > tallest + 2;
    };
    if (!wraps()) return;
    // Stufe 1: Wiederholung + Erinnerung + Anzahl in einen Chip
    c.classList.add('meta-tight');
    if (!wraps()) return;
    // Stufe 2: zwei Avatare weichen einem Zähler (nur ab drei Avataren — sonst
    // fehlt die Vorlage im Markup und die Klasse bleibt wirkungslos)
    c.classList.add('meta-tighter');
  });
}
function ensureTodoMetaObserver() {
  ensureTodoMetaLateObserver();
  if (todoMetaRO || typeof ResizeObserver === 'undefined') return;
  // Alle Meta-Bereiche beobachten, nicht nur die Aufgabenliste: das Vorschlagsband
  // im Kalender-Tab aendert seine Breite unabhaengig davon (anderer Tab, anderes
  // Kachelmass) und muesste sonst auf den naechsten Render warten.
  const bereiche = META_BEREICHE
    .map(cfg => document.getElementById(cfg.area))
    .filter(Boolean);
  if (bereiche.length === 0) return;
  todoMetaRO = new ResizeObserver(() => {
    // Nur bei Breitenaenderung neu rechnen. Hoehenaenderungen entstehen durch das
    // Stapeln selbst — darauf zu reagieren waere eine Schleife.
    let breiter = false;
    for (const a of bereiche) {
      if (a.clientWidth !== a._metaLastW) { a._metaLastW = a.clientWidth; breiter = true; }
    }
    if (breiter) layoutTodoMeta();
  });
  bereiche.forEach(a => { a._metaLastW = a.clientWidth; todoMetaRO.observe(a); });
}

/**
 * Eine Aufgabenzeile. Dieselbe Funktion fuer den Aufgaben-Bereich UND die Uebersicht,
 * damit dieselbe Aufgabe nicht an zwei Stellen unterschiedlich aussieht.
 *
 * `instanzID` haengt die Listenkennung an die Zeile — im Bereich gibt es genau eine
 * Liste, auf der Uebersicht mehrere. `zusatz` ist eine zusaetzliche Zeile unter dem
 * Titel; dort steht auf der Uebersicht der Listenname, wenn es mehrere Listen gibt.
 */
function todoRowHtml(it, draggable, badges, showEdit, showDelete, instanzID = 0, zusatz = '', wischbar = true) {
  // Jede Sorte hat ihren eigenen Schalter — auch die Prioritaet.
  const zeige = (sorte) => badges[sorte] !== false;
  const chip = zeige('due') ? formatDueChip(it) : '';
  const qty = zeige('quantity') ? (parseInt(it.quantity) || 0) : 0;
  const recurs = zeige('recurrence') && it.recurrence && it.recurrence !== 'none';
  // Fälligkeits-Zustand wie in der ToDoList-Kachel: überfällig rot, heute orange,
  // sonst neutral. Erledigte Aufgaben bleiben neutral (nicht rot/orange).
  const dueState = it.done ? '' : classifyDue(it);
  const dueBadgeClass = dueState === 'overdue' ? 'due-overdue' : (dueState === 'today' ? 'due-today' : '');
  const notifies = zeige('notification') && it.notification === true;
  // Stufe 1 der Meta-Verdichtung: Wiederholung, Erinnerung und Anzahl in EINEM
  // Chip. Erst ab zwei dieser Angaben lohnt es sich — ein Chip durch einen Chip
  // zu ersetzen spart nichts. Beide Varianten stehen im Markup, layoutTodoMeta
  // schaltet per Klasse um (kein Neu-Rendern beim Messen).
  const metaCount = (recurs ? 1 : 0) + (notifies ? 1 : 0) + (qty > 1 ? 1 : 0);
  const combined = metaCount >= 2
    ? `<span class="badge attr meta-combined" title="${escapeHtml([
        recurs ? recurrenceLabel(it.recurrence, it.recurrenceCustomUnit, it.recurrenceCustomValue) : '',
        notifies ? translate('Notification') : '',
        qty > 1 ? qty + '×' : '',
      ].filter(Boolean).join(' · '))}">` +
      (recurs ? '<i class="fa-light fa-repeat"></i>' : '') +
      (notifies ? '<i class="fa-light fa-bell"></i>' : '') +
      (qty > 1 ? `<span>${qty}×</span>` : '') +
      '</span>'
    : '';
  const unten = [it.info, zusatz].filter(Boolean).join(' · ');
  return `<div class="todo-card${it.done ? ' done-row' : ''}" data-id="${it.id}"` +
    (instanzID ? ` data-inst="${instanzID}" data-item="${it.id}"` : '') + `>` +
    // Die Wisch-Untergruende nur dort, wo auch gewischt wird. Auf der Uebersicht
    // gibt es die Geste nicht — dann waeren es zwei Knoten, die nie etwas tun.
    (wischbar
      ? `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
        `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>`
      : '') +
    `<div class="todo-content">` +
    `<input type="checkbox" class="chk"${it.done ? ' checked' : ''} aria-label="${translate('Done')}" />` +
    `<span class="todo-main"><span class="todo-title">${escapeHtml(it.title)}</span>` +
    (unten ? `<span class="todo-info">${escapeHtml(unten)}</span>` : '') +
    `</span><span class="todo-side"><span class="todo-meta">` +
    renderAvatarStack(it.assignedTo) +
    (qty > 1 ? `<span class="badge quantity${combined ? ' meta-split' : ''}">${qty}×</span>` : '') +
    (recurs ? `<span class="badge attr${combined ? ' meta-split' : ''}" title="${escapeHtml(recurrenceLabel(it.recurrence, it.recurrenceCustomUnit, it.recurrenceCustomValue))}"><i class="fa-light fa-repeat"></i></span>` : '') +
    (notifies ? `<span class="badge attr${combined ? ' meta-split' : ''}" title="${escapeHtml(translate('Notification'))}"><i class="fa-light fa-bell"></i></span>` : '') +
    combined +
    (chip ? `<span class="badge due-badge ${dueBadgeClass}" title="${escapeHtml(chip)}"><i class="fa-light fa-calendar due-icon"></i><span class="due-text">${escapeHtml(chip)}</span></span>` : '') +
    (zeige('priority') ? `<span class="badge ${priorityKey(it.priority)}">${escapeHtml(priorityLabel(it.priority))}</span>` : '') +
    `</span>` +
    (showEdit ? `<button class="row-btn" data-edit="1" aria-label="${translate('Edit')}" title="${translate('Edit')}"><i class="fa-light fa-pencil"></i></button>` : '') +
    (showDelete ? `<button class="row-btn destructive" data-del="1" aria-label="${translate('Delete')}" title="${translate('Delete')}"><i class="fa-light fa-trash"></i></button>` : '') +
    (draggable ? `<span class="todo-handle" aria-label="${translate('Reorder')}" title="${translate('Reorder')}"><i class="fa-light fa-grip-dots-vertical"></i></span>` : '') +
    `</span></div></div>`;
}

// Drag-Reorder nur im manuellen Modus: offene zuerst (neue Reihenfolge),
// erledigte hinten angehängt — wie in App und ToDoList-Kachel
let dndDragId = null;
function bindTodoDnd(area, instanceID, open, done, enabled) {
  if (!enabled) return;
  area.querySelectorAll('.todo-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      dndDragId = parseInt(card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const targetId = parseInt(card.dataset.id);
      if (dndDragId === null || dndDragId === targetId) return;
      const ids = open.map(i => i.id);
      const from = ids.indexOf(dndDragId);
      const to = ids.indexOf(targetId);
      if (from === -1 || to === -1) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      sdCall(instanceID, 'Reorder', { order: ids.concat(done.map(i => i.id)) });
      dndDragId = null;
    });
  });
}

// ── Favoriten ──────────────────────────────────────────────────────────────
// Detailansicht von „Schon gekauft". Eigener Schalter statt favDetailListId, weil
// die Liste keine ID im Favoritenbestand hat.
let favBoughtOpen = false;
// Favoriten. Uebersicht und Detail rendern in ZWEI Container (#favMaster,
// #favDetail): schmal ist immer nur einer sichtbar (Verhalten wie bisher), ab
// 1100px stehen sie nebeneinander. Deshalb sind die drei fruehreren Zweige
// eigene Funktionen mit dem Ziel-Element als Parameter — renderRows() erkennt
// Knoten pro Container wieder, jeder Zweig MUSS also in seinen eigenen schreiben.
function renderFavorites() {
  const elMaster = document.getElementById('favMaster');
  const elDetail = document.getElementById('favDetail');
  const id = selectedShoppingID();
  const st = id ? instState(id) : null;
  if (!st) {
    renderInto(elMaster, `<div class="empty-state"><i class="fa-light fa-heart"></i>${translate('No shopping list found')}${noInstanceHint('shopping')}</div>`);
    renderInto(elDetail, '');
    document.getElementById('screen-favorites').classList.remove('detail-open');
    return;
  }
  const lists = (Array.isArray(st.favoriteLists) ? st.favoriteLists.slice() : []).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base', numeric: true }));
  // Schon einmal abgehakte Artikel. Eigener State-Schlüssel, KEIN Eintrag in
  // favoriteLists — sonst bekäme jeder je gekaufte Artikel in der Einkaufsliste ein
  // gefülltes Herz (favNames speist sich aus allen Favoritenlisten).
  const bought = Array.isArray(st.purchased) ? st.purchased : [];
  if (favBoughtOpen && bought.length === 0) favBoughtOpen = false;
  const detail = favDetailListId ? lists.find(l => l.id === favDetailListId) : null;
  if (favDetailListId && !detail) favDetailListId = null;
  // Typ der Rezeptdatei früh besorgen, damit „Rezept öffnen" beim Klick sofort
  // weiß, ob es ein PDF an den System-Viewer übergeben muss.
  if (detail && detail.mediaId) prefetchMediaType(detail.mediaId);

  renderFavMaster(elMaster, st, lists, bought, detail);
  renderFavPane(elDetail, st, lists, bought, detail);
  // Eine Stelle entscheidet, ob ein Detail offen ist — die CSS-Regeln haengen
  // daran (schmal: genau eine Spalte sichtbar).
  document.getElementById('screen-favorites')
    .classList.toggle('detail-open', !!detail || favBoughtOpen);
}

// Uebersicht der Favoritenlisten. Wird jetzt IMMER gerendert, auch wenn rechts
// ein Detail steht — nebeneinander ist sie die Auswahlspalte.
function renderFavMaster(el, st, lists, bought, detail) {
  let html = `<div class="screen-head" data-key="head"><h2>${translate('Favorites')}</h2>` +
    `<button class="icon-btn" id="btnFavCreate" aria-label="${translate('New favorite list')}"><i class="fa-light fa-plus"></i></button></div>`;
  // „Schon gekauft" steht VOR der Schleife, sonst würde sie alphabetisch
  // einsortiert. Bewusst ohne .swipe-under, ohne Warenkorb-Knopf: das Markup muss
  // sich von einer normalen Karte unterscheiden, sonst könnte renderRows einen
  // Knoten samt seiner alten Wisch- und Lösch-Handler wiederverwenden.
  if (bought.length > 0) {
    html += `<div class="fav-card bought-card${favBoughtOpen ? ' is-open' : ''}" data-key="boughtcard">` +
      `<div class="fav-row" data-bought="1">` +
      `<span class="fav-badge bought-badge"><i class="fa-light fa-basket-shopping"></i></span>` +
      `<span class="fav-main"><span class="fav-name">${translate('Already bought')}</span>` +
      `<span class="fav-count">${bought.length === 1 ? translate('1 item') : translate('%1 items').replace('%1', String(bought.length))}</span></span>` +
      `<i class="fa-light fa-chevron-right fav-chevron"></i>` +
      '</div></div>';
  }
  if (lists.length === 0 && bought.length === 0) {
    html += `<div class="empty-state" data-key="empty"><i class="fa-light fa-heart"></i>${translate('No favorite lists')}</div>`;
  }
  for (const list of lists) {
    const count = (list.items || []).length;
    html += `<div class="fav-card${detail && detail.id === list.id ? ' is-open' : ''}" data-key="fav:${escapeHtml(list.id)}">` +
      `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
      `<div class="swipe-under-edit"><i class="fa-light fa-cart-plus"></i></div>` +
      `<div class="fav-row" data-list="${escapeHtml(list.id)}">` +
      `<span class="fav-badge">${HEART_SOLID_SVG}</span>` +
      `<span class="fav-main"><span class="fav-name">${escapeHtml(list.name)}</span>` +
      `<span class="fav-count">${count === 1 ? translate('1 item') : translate('%1 items').replace('%1', String(count))}</span></span>` +
      `<button class="fav-cart-btn" data-addall="${escapeHtml(list.id)}" aria-label="${translate('Add all to shopping list')}"><i class="fa-light fa-cart-plus"></i></button>` +
      '</div></div>';
  }
  const freshFav = renderRows(el, html);
  if (freshFav === false) return;
  const curLists = () => {
    const s = instState(selectedShoppingID()) || {};
    return Array.isArray(s.favoriteLists) ? s.favoriteLists : [];
  };
  const boughtNode = freshFav.find(n => n.querySelector && n.querySelector('[data-bought]'));
  if (boughtNode) boughtNode.querySelector('[data-bought]').addEventListener('click', () => {
    favBoughtOpen = true;
    favDetailListId = null;   // die beiden Auswahlen schliessen sich aus
    renderFavorites();
  });
  const headNode = freshFav.find(n => n.querySelector && n.querySelector('#btnFavCreate'));
  if (headNode) headNode.querySelector('#btnFavCreate').addEventListener('click', () => {
    showPrompt(translate('New favorite list'), '', translate('Create'), (name) => {
      if (name.trim()) sdCall(selectedShoppingID(), 'CreateFavoriteList', { name: name.trim() });
    });
  });
  freshFav.forEach(node => (node.querySelectorAll ? node.querySelectorAll('[data-addall]') : []).forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    addFavListToCart(selectedShoppingID(), curLists().find(l => l.id === btn.dataset.addall));
  })));
  // Die Kaufliste ist zwar eine .fav-card, aber KEINE Favoritenliste: sie hat keine
  // data-list-ID. Ohne den Ausschluss bekam sie zusaetzlich zu ihrem eigenen Handler
  // die Auswahl- und Wisch-Handler der Listen. Der Auswahl-Handler lief als zweiter
  // und setzte favDetailListId auf undefined — dass „Schon gekauft" trotzdem aufging,
  // lag nur daran, dass undefined falsy ist. Wischen nach links haette ausserdem
  // DeleteFavoriteList mit undefined aufgerufen.
  freshFav.filter(n => n.classList && n.classList.contains('fav-card')
                       && !n.classList.contains('bought-card')).forEach(card => {
    const row = card.querySelector('.fav-row');
    const listId = row.dataset.list;
    const list = () => curLists().find(l => l.id === listId);
    // Swipe links = Liste löschen (mit Bestätigung wie im Menü), rechts = alles auf die Einkaufsliste.
    bindCardSwipe(card, '.fav-row',
      () => {
        // Slide-out zurücknehmen (bei Abbruch bleibt die Zeile erhalten), dann bestätigen.
        card.classList.remove('is-deleting'); delete card.dataset.animating;
        row.style.transform = ''; restoreCard(card);
        showConfirm(translate('Delete this favorite list?'), translate('Delete'), () => {
          if (favDetailListId === listId) favDetailListId = null;
          sdCall(selectedShoppingID(), 'DeleteFavoriteList', listId);
        });
      },
      () => { addFavListToCart(selectedShoppingID(), list()); },
      { dissolve: false }
    );
    row.addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button')) return;
      favDetailListId = listId;
      favBoughtOpen = false;   // sonst blieb nebeneinander die Kaufliste stehen
      renderFavorites();
    });
  });
  return;
}

// Rechte Spalte: Kaufliste, Listendetail oder — ohne Auswahl — ein Hinweis,
// damit die Spalte auf breiten Schirmen nicht leer klafft.
function renderFavPane(el, st, lists, bought, detail) {
  if (favBoughtOpen) { renderFavBought(el, st, bought); return; }
  if (detail) { renderFavList(el, st, detail); return; }
  renderRows(el, `<div class="empty-state" data-key="pick"><i class="fa-light fa-hand-pointer"></i>${translate('Select a list')}</div>`);
}

  // Detailansicht von „Schon gekauft": nur lesen, kein Bearbeiten, kein Löschen der
  // Liste, kein „Alles in den Einkauf" (das wären je nach Bestand hunderte Artikel).
  // Antippen setzt den Artikel auf die Einkaufsliste, Wischen nach links vergisst ihn.
function renderFavBought(el, st, bought) {
  let bhtml = `<div class="screen-head" data-key="boughthead">` +
    `<button class="icon-btn" id="btnBoughtBack" aria-label="${translate('Back')}"><i class="fa-light fa-chevron-left"></i></button>` +
    `<h2>${translate('Already bought')}</h2></div>`;
  const openNames = new Set((st.items || []).filter(i => !i.inCart).map(i => String(i.name || '').trim().toLowerCase()));
  for (const b of bought) {
    const img = getProductImageUrl(b.name);
    const tint = categoryStyle(b.category).tint;
    // Steht der Artikel schon offen auf der Liste, wird das mit einem Haken
    // angezeigt — die Zeile bleibt aber bedienbar: AddItemInternal legt KEINE
    // Dublette an, sondern erhöht die Menge (IncrementAmount). Ein zweiter Tipp
    // bedeutet also „noch eins davon" und ist eine sinnvolle Aktion.
    const onList = openNames.has(String(b.name || '').trim().toLowerCase());
    // Mengenregler wie in den Favoritenlisten: numerische Mengen bekommen den
    // Stepper, alles andere („500 g") bleibt ein reines Abzeichen.
    const amountRaw = String(b.amount || '').trim();
    const numeric = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
    const amount = amountRaw === '' ? '1' : amountRaw;
    let side = '';
    if (numeric) {
      const canDec = parseInt(amount) > 1;
      side += `<span class="stepper"><button data-bstep="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>` +
        `<span class="amount-badge">${escapeHtml(amount)}</span>` +
        `<button data-bstep="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button>` +
        '</span>';
    } else {
      side += `<span class="amount-badge" data-amount-edit="1" role="button" tabindex="0" title="${translate('Change quantity')}">${escapeHtml(amount)}</span>`;
    }
    side += `<button class="heart-btn cart-btn" data-boughtadd="1" aria-label="${translate('Add to shopping list')}"><i class="fa-light fa-cart-plus"></i></button>`;
    bhtml += `<div class="item-card bought-row${onList ? ' on-list' : ''}" data-key="bought:${escapeHtml(b.name)}" data-name="${escapeHtml(b.name)}" data-cat="${escapeHtml(b.category || '')}">` +
      `<div class="swipe-under bought-forget"><i class="fa-light fa-clock-rotate-left"></i></div>` +
      `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` +
      `<div class="item-card-content">` +
      // Ohne Farbe (Payload ohne categoryStyles) bleibt das Attribut weg — dann gilt
      // background: var(--surface2) aus dem CSS statt eines leeren background:.
      `<span class="item-thumb"${(img || tint) ? ` style="background:${img ? 'transparent' : tint}"` : ''}>` +
      (img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" />`
           : escapeHtml(String(b.name || '?').charAt(0).toUpperCase())) +
      `</span><span class="item-main"><span class="item-name">${escapeHtml(b.name)}</span></span>` +
      // Derselbe Warenkorb-Knopf wie in den Favoritenlisten, auch wenn der Artikel
      // schon auf der Liste steht — dann erhöht er die Menge. Dass er dort liegt,
      // zeigt die zurückgenommene Namensfarbe.
      `<span class="item-side">${side}</span></div></div>`;
  }
  const freshBought = renderRows(el, bhtml);
  if (freshBought === false) return;
  const backNode = freshBought.find(n => n.querySelector && n.querySelector('#btnBoughtBack'));
  if (backNode) backNode.querySelector('#btnBoughtBack').addEventListener('click', () => {
    favBoughtOpen = false;
    renderFavorites();
  });
  freshBought.filter(n => n.classList && n.classList.contains('bought-row')).forEach(card => {
    const name = card.dataset.name;
    const cat  = card.dataset.cat || '';
    // Zwei Rückmeldungen, weil zwei Dinge passieren können: neu aufnehmen oder die
    // Menge des schon gelisteten Artikels erhöhen.
    // Zustand IMMER frisch auflösen: zwischen Rendern und Klick kann sich die
    // Historie geändert haben (Stepper, Vergessen, ein neuer Kauf).
    const curBought = () => (Array.isArray((instState(selectedShoppingID()) || {}).purchased)
      ? instState(selectedShoppingID()).purchased : []).find(x => String(x.name) === name);
    const addOne = () => {
      const it = curBought();
      sdCall(selectedShoppingID(), 'AddItem', { name: name, category: cat, amount: String((it && it.amount) || '1') });
      flyToShoppingTab(card.querySelector('.item-thumb'));
      // Mit Artikelnamen wie in der iOS-App: bei einer langen Liste ist sonst nicht
      // erkennbar, welche Zeile die Meldung ausgelöst hat.
      showToast((card.classList.contains('on-list')
        ? translate('„%1“: quantity increased')
        : translate('„%1“ added to the shopping list')).replace('%1', name));
    };
    card.querySelector('[data-boughtadd]').addEventListener('click', (e) => {
      e.stopPropagation();
      addOne();
    });
    card.querySelector('.item-card-content').addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      // Klicks auf den Knopf laufen über dessen eigenen Handler — ohne diesen
      // Riegel zählte ein Knopfdruck doppelt (Knopf plus Zeile).
      if (e.target.closest('button')) return;
      addOne();
    });
    // Nur Wischen nach links (vergessen) — kein onEdit, damit der Rechtsweg
    // gesperrt bleibt (bindCardSwipe setzt maxRight dann auf 0).
    const bAmount = card.querySelector('[data-amount-edit]');
    if (bAmount) bAmount.addEventListener('click', (e) => {
      e.stopPropagation();
      const it = curBought();
      if (!it) return;
      showPrompt(translate('Change quantity'), String(it.amount || ''), translate('Save'), (val) => {
        sdCall(selectedShoppingID(), 'UpdatePurchase', {
          oldName: it.name, name: it.name, category: it.category || '',
          amount: val.trim(), notes: it.notes || ''
        });
      });
    });
    card.querySelectorAll('[data-bstep]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const it = curBought();
      if (!it) return;
      const next = Math.max(1, (parseInt(it.amount) || 1) + parseInt(btn.dataset.bstep));
      // Optimistisch anzeigen wie beim Favoriten-Stepper; die Serverantwort
      // korrigiert es, falls sie abweicht.
      it.amount = String(next);
      renderFavorites();
      sdCall(selectedShoppingID(), 'UpdatePurchase', {
        oldName: it.name, name: it.name, category: it.category || '',
        amount: String(next), notes: it.notes || ''
      });
    }));
    // Links vergessen, rechts bearbeiten — wie in den Favoritenlisten.
    bindCardSwipe(card, '.item-card-content',
      () => sdCall(selectedShoppingID(), 'ForgetPurchase', { name: name }),
      () => { const it = curBought(); if (it) openPurchaseEditor(selectedShoppingID(), it); });
  });
  return;
}

// Inhalt einer Favoritenliste.
function renderFavList(el, st, detail) {
  // Detailansicht
  let html = `<div class="screen-head" data-key="detailhead">` +
    `<button class="icon-btn" id="btnFavBack" aria-label="${translate('Back')}"><i class="fa-light fa-chevron-left"></i></button>` +
    `<h2>${escapeHtml(detail.name)}</h2></div>`;
  const items = detail.items || [];
  if (items.length === 0) {
    html += `<div class="empty-state" data-key="empty"><i class="fa-light fa-heart"></i>${translate('No items yet')}</div>`;
  }
  for (const it of items) {
    const img = getProductImageUrl(it.name) || getProductImageUrl(it.notes || '');
    const tint = categoryStyle(it.category).tint;
    // Mengen-Stepper wie in der Einkaufsliste (nur bei numerischer Menge); der
    // Runter-Pfeil bei Menge=1 bleibt unsichtbar, damit das Badge nicht springt.
    const amountRaw = String(it.amount || '').trim();
    const numeric = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
    const amount = amountRaw === '' ? '1' : amountRaw;
    let side = '';
    if (numeric) {
      const canDec = parseInt(amount) > 1;
      side += `<span class="stepper"><button data-step="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>` +
        `<span class="amount-badge">${escapeHtml(amount)}</span>` +
        `<button data-step="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button>` +
        '</span>';
    } else {
      side += `<span class="amount-badge" data-amount-edit="1" role="button" tabindex="0" title="${translate('Change quantity')}">${escapeHtml(amount)}</span>`;
    }
    // Warenkorb statt Stift: einen EINZELNEN Artikel auf die Einkaufsliste zu setzen
    // war bisher gar nicht möglich — es gab nur „alles in den Einkauf" für die ganze
    // Liste. Bearbeiten bleibt über Wischen nach rechts erreichbar.
    side += `<button class="heart-btn cart-btn" data-addone="1" aria-label="${translate('Add to shopping list')}"><i class="fa-light fa-cart-plus"></i></button>`;
    html += `<div class="item-card" data-key="favitem:${escapeHtml(it.name)}" data-name="${escapeHtml(it.name)}">` +
      `<div class="swipe-under"><i class="fa-light fa-heart-crack"></i></div>` +
      // Rechtswischen = bearbeiten, wie in der Einkaufsliste. Die Optik kommt
      // aus .item-card .swipe-under-edit, gilt also hier ohne neues CSS.
      `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` +
      `<div class="item-card-content">` +
      // Ohne Farbe (Payload ohne categoryStyles) bleibt das Attribut weg — dann gilt
      // background: var(--surface2) aus dem CSS statt eines leeren background:.
      `<span class="item-thumb"${(img || tint) ? ` style="background:${img ? 'transparent' : tint}"` : ''}>` +
      (img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" />` : escapeHtml(String(it.name || '?').charAt(0).toUpperCase())) +
      `</span><span class="item-main"><span class="item-name">${escapeHtml(it.name)}</span>` +
      (it.notes ? `<span class="item-notes">${escapeHtml(it.notes)}</span>` : '') +
      `</span><span class="item-side">${side}</span></div></div>`;
  }
  html += `<div class="fav-actions" data-key="favactions">` +
    ((detail.url || detail.mediaId) ? `<button id="btnFavOpenRecipe"><i class="fa-light fa-arrow-up-right-from-square"></i> ${translate('Open recipe')}</button>` : '') +
    `<button id="btnFavAddAll"><i class="fa-light fa-cart-plus"></i> ${translate('Everything to the shopping list')}</button>` +
    `<button id="btnFavAddItem"><i class="fa-light fa-plus"></i> ${translate('Add item')}</button>` +
    `<button id="btnFavRename"><i class="fa-light fa-pencil"></i> ${translate('Rename list')}</button>` +
    `<button id="btnFavDelete" class="destructive"><i class="fa-light fa-trash"></i> ${translate('Delete list')}</button>` +
    `</div>`;
  const freshDetail = renderRows(el, html);
  if (freshDetail === false) return;

  // Aktuelle Detail-Liste beim Ereignis auflösen, nicht beim Rendern festhalten.
  const curDetail = () => {
    const s = instState(selectedShoppingID()) || {};
    return (Array.isArray(s.favoriteLists) ? s.favoriteLists : []).find(l => l.id === favDetailListId) || detail;
  };
  const pick = (sel) => {
    for (const n of freshDetail) {
      if (n.id === sel.slice(1)) return n;
      if (n.querySelector) { const hit = n.querySelector(sel); if (hit) return hit; }
    }
    return null;
  };

  const btnBack = pick('#btnFavBack');
  if (btnBack) btnBack.addEventListener('click', () => { favDetailListId = null; renderFavorites(); });
  const btnDelete = pick('#btnFavDelete');
  if (btnDelete) btnDelete.addEventListener('click', () => {
    showConfirm(translate('Delete this favorite list?'), translate('Delete'), () => {
      const listId = favDetailListId;
      favDetailListId = null;
      sdCall(selectedShoppingID(), 'DeleteFavoriteList', listId);
    });
  });
  const btnFavOpenRecipe = pick('#btnFavOpenRecipe');
  if (btnFavOpenRecipe) btnFavOpenRecipe.addEventListener('click', () => {
    // Nur http(s): detail.url stammt aus KI-Extraktion bzw. gespeicherten Listen —
    // javascript:/data:-URLs dürfen hier nicht ausgeführt werden.
    if (detail.url && /^https?:\/\//i.test(String(detail.url))) {
      try { window.open(String(detail.url), '_blank', 'noopener'); } catch (e) {}
      return;
    }
    if (!detail.mediaId) return;
    // PDF an den System-Viewer geben, der alle Seiten blättert. Der Typ kommt aus dem
    // Prefetch beim Öffnen der Liste, damit dieser Aufruf synchron im Klick bleibt.
    const meta = mediaTypeCache[String(detail.mediaId)];
    const knownPdf = !!(meta && meta.state === 'ok' && meta.isPdf);
    if (knownPdf && openMediaExternally(detail.mediaId)) return;
    openRecipePhoto(detail.mediaId, knownPdf);
  });
  const btnFavRename = pick('#btnFavRename');
  if (btnFavRename) btnFavRename.addEventListener('click', () => {
    // Der Name kommt beim Klick frisch aus dem Bestand, nicht aus dem Render-Moment.
    const liste = curDetail();
    showPrompt(translate('Rename list'), liste.name || '', translate('Save'), (name) => {
      const neu = name.trim();
      if (neu && neu !== liste.name) {
        sdCall(selectedShoppingID(), 'RenameFavoriteList', { listId: liste.id, newName: neu });
      }
    });
  });
  const btnAddAll = pick('#btnFavAddAll');
  if (btnAddAll) btnAddAll.addEventListener('click', () => addFavListToCart(selectedShoppingID(), curDetail()));
  const btnAddItem = pick('#btnFavAddItem');
  if (btnAddItem) btnAddItem.addEventListener('click', () => openFavItemEditor(selectedShoppingID(), curDetail().id, null));

  freshDetail.filter(n => n.classList && n.classList.contains('item-card')).forEach(card => {
    const name = card.dataset.name;
    const curFavItem = () => (curDetail().items || []).find(i => i.name === name);
    bindCardSwipe(card, '.item-card-content',
      () => sdCall(selectedShoppingID(), 'RemoveItemFromFavoriteList', { listId: curDetail().id, name }),
      // Rechtswischen öffnet denselben Editor wie der Stift-Knopf.
      () => { const it = curFavItem(); if (it) openFavItemEditor(selectedShoppingID(), curDetail().id, it); });
    const favAmount = card.querySelector('[data-amount-edit]');
    if (favAmount) favAmount.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = curFavItem();
      if (!item) return;
      showPrompt(translate('Change quantity'), String(item.amount || ''), translate('Save'), (val) => {
        sdCall(selectedShoppingID(), 'UpdateFavoriteItem', {
          listId: curDetail().id, oldName: item.name, newName: item.name,
          category: item.category || '', amount: val.trim(), notes: item.notes || ''
        });
      });
    });
    // Auf die Einkaufsliste setzen — an ZWEI Wegen: der Warenkorb-Knopf und die Zeile
    // selbst. Bisher hing es nur am Knopf, in der Kaufliste war die ganze Zeile
    // anklickbar; dieselbe Zeile verhielt sich also je nach Liste anders.
    const addOne = () => {
      const item = curFavItem();
      if (!item) return;
      // Menge des Favoriteneintrags mitnehmen. Steht der Artikel schon offen auf der
      // Liste, erhöht der Server die Menge, statt eine Dublette anzulegen.
      sdCall(selectedShoppingID(), 'AddItem', {
        name: item.name,
        category: item.category || '',
        amount: String(item.amount || '1')
      });
      flyToShoppingTab(card.querySelector('.item-thumb'));
      // Steht der Artikel schon offen auf der Liste, erhöht der Server nur die Menge
      // — die Meldung muss das sagen, sonst wirkt sie wie ein zweiter Eintrag.
      const open = new Set(((instState(selectedShoppingID()) || {}).items || [])
        .filter(i => !i.inCart).map(i => String(i.name || '').trim().toLowerCase()));
      showToast((open.has(String(item.name || '').trim().toLowerCase())
        ? translate('„%1“: quantity increased')
        : translate('„%1“ added to the shopping list')).replace('%1', item.name));
    };
    const addBtn = card.querySelector('[data-addone]');
    if (addBtn) addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      addOne();
    });
    card.querySelector('.item-card-content').addEventListener('click', (e) => {
      // Nach einem Wischen kommt noch ein Klick — der darf nicht zaehlen.
      if (card.dataset.swiped === '1') return;
      // Klicks auf Knoepfe (Warenkorb, Mengen-Abzeichen, Stepper) laufen ueber deren
      // eigene Handler; ohne diesen Riegel zaehlte ein Knopfdruck doppelt.
      if (e.target.closest('button')) return;
      if (e.target.closest('[data-amount-edit]')) return;
      addOne();
    });
    card.querySelectorAll('[data-step]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = curFavItem();
      if (!item) return;
      const next = Math.max(1, (parseInt(item.amount) || 1) + parseInt(btn.dataset.step));
      // Sofort lokal übernehmen wie in der Einkaufsliste — renderRows() fasst
      // dabei nur diese eine Zeile an.
      item.amount = String(next);
      renderFavorites();
      sdCall(selectedShoppingID(), 'UpdateFavoriteItem', { listId: curDetail().id, oldName: item.name, newName: item.name, category: item.category || '', amount: String(next), notes: item.notes || '' });
    }));
  });
}

function addFavListToCart(instanceID, list) {
  if (!list) return;
  const n = (list.items || []).length;
  if (n === 0) {
    // Wie addAll() in der App: leere Liste bekommt eine eigene Meldung
    showToast(translate('"%1" contains no items').replace('%1', list.name));
    return;
  }
  sdCall(instanceID, 'AddFavoriteListToCart', list.id);
  showToast(translate('"%1": %2 items added').replace('%1', list.name).replace('%2', String(n)));
}

// ── Artikel-Editor (Einkaufsliste + Favoriten) ─────────────────────────────
let editorCtx = null; // {type:'shopping'|'fav-edit'|'fav-add', instanceID, listId?, item?}
function fillCategorySelect(select, current) {
  const st = instState(selectedShoppingID()) || {};
  const cats = Array.isArray(st.categoryOrder) ? st.categoryOrder : [];
  const cur = current || translate('Miscellaneous');
  select.innerHTML = '';
  if (cur && !cats.includes(cur)) {
    const opt = document.createElement('option');
    opt.value = cur; opt.textContent = cur; opt.selected = true;
    select.appendChild(opt);
  }
  for (const cat of cats) {
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    if (cat === cur) opt.selected = true;
    select.appendChild(opt);
  }
}
function openItemEditor(instanceID, item) {
  editorCtx = { type: 'shopping', instanceID, item };
  document.getElementById('editOverlayTitle').textContent = translate('Edit item');
  document.getElementById('editName').value = item.name || '';
  document.getElementById('editAmount').value = item.amount || '';
  document.getElementById('editNotes').value = item.notes || '';
  fillCategorySelect(document.getElementById('editCategory'), item.category);
  openOverlay('editOverlay');
}
/** Editor für einen Eintrag der Kaufhistorie — gleiche Maske, anderer Empfänger. */
function openPurchaseEditor(instanceID, item) {
  editorCtx = { type: 'purchase', instanceID, item };
  document.getElementById('editOverlayTitle').textContent = translate('Edit item');
  document.getElementById('editName').value = item.name || '';
  document.getElementById('editAmount').value = item.amount || '';
  document.getElementById('editNotes').value = item.notes || '';
  fillCategorySelect(document.getElementById('editCategory'), item.category || '');
  openOverlay('editOverlay');
}

function openFavItemEditor(instanceID, listId, item) {
  editorCtx = { type: item ? 'fav-edit' : 'fav-add', instanceID, listId, item };
  document.getElementById('editOverlayTitle').textContent = item ? translate('Edit item') : translate('New item');
  document.getElementById('editName').value = item ? (item.name || '') : '';
  document.getElementById('editAmount').value = item ? (item.amount || '') : '';
  document.getElementById('editNotes').value = item ? (item.notes || '') : '';
  fillCategorySelect(document.getElementById('editCategory'), item ? item.category : '');
  openOverlay('editOverlay');
}
function saveItemEditor() {
  if (!editorCtx) return;
  const name = document.getElementById('editName').value.trim();
  const amount = document.getElementById('editAmount').value.trim();
  const notes = document.getElementById('editNotes').value.trim();
  const category = document.getElementById('editCategory').value;
  if (!name) return;
  const ctx = editorCtx;
  if (ctx.type === 'shopping') {
    sdCall(ctx.instanceID, 'UpdateItem', { id: ctx.item.id, name, amount, notes, category });
  } else if (ctx.type === 'fav-edit') {
    sdCall(ctx.instanceID, 'UpdateFavoriteItem', { listId: ctx.listId, oldName: ctx.item.name, newName: name, category, amount, notes });
  } else if (ctx.type === 'fav-add') {
    sdCall(ctx.instanceID, 'AddItemToFavoriteList', { listId: ctx.listId, name, category, amount, notes });
  } else if (ctx.type === 'purchase') {
    // Kaufhistorie: oldName ist der Schlüssel. Ein geänderter Name zieht ihn mit,
    // das erledigt der Server.
    sdCall(ctx.instanceID, 'UpdatePurchase', { oldName: ctx.item.name, name, category, amount, notes });
  }
  closeOverlay('editOverlay');
  editorCtx = null;
}

// Herz: Zugehörigkeit zu Favoritenlisten (Multi-Select wie in der App)
let favPickCtx = null; // {instanceID, itemName, category, amount, notes}
function openFavPicker(instanceID, item) {
  favPickCtx = { instanceID, itemName: item.name, category: item.category || '', amount: item.amount || '', notes: item.notes || '' };
  document.getElementById('favPickTitle').textContent = translate('Favorite lists');
  renderFavPicker();
  openOverlay('favPickOverlay');
}
function renderFavPicker() {
  if (!favPickCtx) return;
  const st = instState(favPickCtx.instanceID) || {};
  const lists = (Array.isArray(st.favoriteLists) ? st.favoriteLists.slice() : []).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base', numeric: true }));
  const body = document.getElementById('favPickBody');
  const norm = String(favPickCtx.itemName || '').trim().toLowerCase();
  if (lists.length === 0) {
    body.innerHTML = `<div class="empty-row">${translate('No favorite lists')}</div>`;
    return;
  }
  body.innerHTML = lists.map(l => {
    const inList = (l.items || []).some(i => String(i.name || '').trim().toLowerCase() === norm);
    const count = (l.items || []).length;
    const cnt = count === 1 ? translate('1 item') : translate('%1 items').replace('%1', String(count));
    return `<div class="fav-row${inList ? ' selected' : ''}" data-list="${escapeHtml(l.id)}">` +
      `<span class="fav-badge">${HEART_SOLID_SVG}</span>` +
      `<span class="fav-main"><span class="fav-name">${escapeHtml(l.name)}</span>` +
      `<span class="fav-count">${cnt}</span></span>` +
      `<i class="fa-light fa-check check"></i></div>`;
  }).join('');
  body.querySelectorAll('.fav-row').forEach(row => row.addEventListener('click', () => {
    const listId = row.dataset.list;
    const selected = row.classList.contains('selected');
    if (selected) {
      sdCall(favPickCtx.instanceID, 'RemoveItemFromFavoriteList', { listId, name: favPickCtx.itemName });
    } else {
      sdCall(favPickCtx.instanceID, 'AddItemToFavoriteList', {
        listId, name: favPickCtx.itemName,
        category: favPickCtx.category, amount: favPickCtx.amount, notes: favPickCtx.notes
      });
    }
    row.classList.toggle('selected');
  }));
}

// ── ToDo-Editor ────────────────────────────────────────────────────────────
const LEAD_TIMES = [0, 300, 600, 1800, 3600, 18000, 43200];
// Nur in der Kachel: Vorlauf, mit dem eine erledigte Serie wieder geoeffnet wird.
const REOPEN_TIMES = [0, 1800, 3600, 21600, 43200, 86400, 172800, 259200, 604800, 1209600, 2592000];
function reopenLabel(sec) {
  if (sec === 0) return translate('Do not reopen');
  if (sec < 3600) return String(sec / 60) + ' ' + translate('minutes before');
  if (sec < 86400) return String(sec / 3600) + ' ' + translate('hours before');
  return String(sec / 86400) + ' ' + translate('days before');
}
let todoCtx = null; // {instanceID, itemId|null}
let tdAssigned = [];
let tdPriority = 'normal';
let tdQuantity = 0;

function leadTimeLabel(sec) {
  switch (sec) {
    case 0: return translate('At due time');
    case 300: return translate('5 minutes before');
    case 600: return translate('10 minutes before');
    case 1800: return translate('30 minutes before');
    case 3600: return translate('1 hour before');
    case 18000: return translate('5 hours before');
    case 43200: return translate('12 hours before');
    default: return String(sec) + 's';
  }
}
function toLocalInputValue(d, dateOnly) {
  const pad = (n) => String(n).padStart(2, '0');
  const date = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  return dateOnly ? date : `${date}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function openTodoEditor(instanceID, item) {
  todoCtx = { instanceID, itemId: item ? item.id : null };
  document.getElementById('todoOverlayTitle').textContent = item ? translate('Edit') : translate('New task');
  document.getElementById('tdTitle').value = item ? (item.title || '') : '';
  document.getElementById('tdInfo').value = item ? (item.info || '') : '';

  const hasDue = !!(item && (parseInt(item.due) || 0) > 0);
  document.getElementById('tdHasDue').checked = hasDue;
  const allDay = !!(item && item.dueAllDay === true);
  document.getElementById('tdAllDay').checked = allDay;
  const dueDate = item ? dueDateOf(item) : null;
  const base = dueDate || new Date(Date.now() + 3600000);
  if (!allDay && item && (parseInt(item.due) || 0) > 0) {
    base.setTime((parseInt(item.due) || 0) * 1000);
  }
  updateTodoDueInput(allDay, base);

  const rec = document.getElementById('tdRecurrence');
  rec.innerHTML = ['none', 'w1', 'w2', 'w3', 'm1', 'q1', 'y1', 'custom'].map(r =>
    `<option value="${r}">${escapeHtml(recurrenceLabel(r === 'custom' ? 'custom-label' : r).replace('custom-label', ''))}</option>`
  ).join('');
  // Eigene Beschriftung für custom (recurrenceLabel braucht unit/value)
  rec.querySelector('option[value="custom"]').textContent = translate('Custom interval');
  rec.querySelector('option[value="none"]').textContent = translate('No repeat');
  rec.value = item && item.recurrence ? String(item.recurrence) : 'none';

  const unitSel = document.getElementById('tdCustomUnit');
  unitSel.innerHTML = [['h', translate('Hours')], ['d', translate('Days')], ['w', translate('Weeks')], ['m', translate('Months')], ['y', translate('Years')]]
    .map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  unitSel.value = item && item.recurrenceCustomUnit ? String(item.recurrenceCustomUnit) : 'w';
  document.getElementById('tdCustomValue').value = item && item.recurrenceCustomValue ? String(item.recurrenceCustomValue) : '1';

  const reopenSel = document.getElementById('tdReopen');
  reopenSel.innerHTML = REOPEN_TIMES.map(s => `<option value="${s}">${reopenLabel(s)}</option>`).join('');
  const reopen = item && item.recurrenceResetLeadTime !== undefined
    ? parseInt(item.recurrenceResetLeadTime) : 604800;
  reopenSel.value = String(REOPEN_TIMES.includes(reopen) ? reopen : 604800);

  document.getElementById('tdNotification').checked = !!(item && item.notification === true);
  const leadSel = document.getElementById('tdLeadTime');
  leadSel.innerHTML = LEAD_TIMES.map(s => `<option value="${s}">${leadTimeLabel(s)}</option>`).join('');
  const lead = item && item.notificationLeadTime !== undefined ? parseInt(item.notificationLeadTime) : 0;
  leadSel.value = String(LEAD_TIMES.includes(lead) ? lead : 0);

  tdAssigned = item && Array.isArray(item.assignedTo) ? item.assignedTo.slice() : (currentUserID() ? [currentUserID()] : []);
  renderAssignList('tdAssignList', tdAssigned);
  tdPriority = item && item.priority ? String(item.priority) : 'normal';
  renderPrioritySeg();
  tdQuantity = item ? (parseInt(item.quantity) || 0) : 0;
  document.getElementById('tdQtyValue').textContent = tdQuantity > 0 ? String(tdQuantity) : '–';

  syncTodoEditorVisibility();
  openOverlay('todoOverlay');

  // Notizfeld an die Textmenge anpassen (einmalig binden, dann initial messen)
  const info = document.getElementById('tdInfo');
  if (!info.__autogrow) {
    info.__autogrow = () => { info.style.height = 'auto'; info.style.height = info.scrollHeight + 'px'; };
    info.addEventListener('input', info.__autogrow);
  }
  // Nach Layout/Öffnungsanimation messen (rAF greift zu früh, solange das
  // Overlay noch einblendet), damit die Höhe schon beim Öffnen zum Text passt.
  window.setTimeout(info.__autogrow, 80);
}
function updateTodoDueInput(allDay, date) {
  const input = document.getElementById('tdDueDate');
  input.type = allDay ? 'date' : 'datetime-local';
  input.value = toLocalInputValue(date, allDay);
}
function syncTodoEditorVisibility() {
  const hasDue = document.getElementById('tdHasDue').checked;
  document.getElementById('tdDueSection').style.display = hasDue ? 'flex' : 'none';
  document.getElementById('tdCustomSection').style.display =
    (hasDue && document.getElementById('tdRecurrence').value === 'custom') ? 'flex' : 'none';
  document.getElementById('tdLeadSection').style.display =
    (hasDue && document.getElementById('tdNotification').checked) ? 'flex' : 'none';
  // Wieder-Oeffnen ergibt nur bei einer Wiederholung Sinn.
  document.getElementById('tdReopenSection').style.display =
    (hasDue && document.getElementById('tdRecurrence').value !== 'none') ? 'flex' : 'none';
}
/**
