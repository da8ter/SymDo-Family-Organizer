  el.querySelectorAll('[data-member]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const mid = b.dataset.member;
    if (memberFilterIds.has(mid)) memberFilterIds.delete(mid);
    else memberFilterIds.add(mid);
    renderCalendar();
  }));
}

// ── Aufgaben aus weitergeleiteten E-Mails ────────────────────────────────────
// Das Gateway analysiert eingehende Post und legt Vorschlaege ab; hier stehen sie
// ueber der Aufgabenliste und warten auf eine Entscheidung. Angelegt wird die
// Aufgabe auf dem normalen Weg (AddItem der Zielliste) — die Vorschlagsliste
// erfaehrt danach nur, dass der Eintrag erledigt ist.
let mailProposals = [];
let mailLoading = false;
// Aufgeklappt oder nicht, je Sorte. Nur im Speicher, wie cartExpanded.
// Aufgeklappt als Vorgabe: Die Baender lagen frueher UEBER einer Liste und durften
// sie nicht verdecken — im KI-Bereich sind sie der Inhalt, und drei zugeklappte
// Zeilen waeren eine leere Seite mit drei Knoepfen.

/**
 * Sorte eines Fundstuecks.
 *
 * WICHTIG: Aeltere Vorschlaege tragen KEIN kind — die sind Aufgaben. Ein direkter
 * Vergleich `it.kind === sorte` liesse sie lautlos verschwinden, weil sie in keinen
 * der drei Toepfe fielen. Vorher war das kein Thema, weil der Vergleich
 * `(it.kind === 'event') === istTermin` alles Unbekannte zur Aufgabe machte.
 */
function mailArt(it) {
  if (it && it.kind === 'event') return 'event';
  if (it && it.kind === 'note') return 'note';
  return 'task';
}
/** Die Reihenfolge unter einer Mail: erst zu tun, dann Termine, dann zum Behalten. */
const MAIL_SORTEN = ['task', 'event', 'note'];

function renderMailAlle() {
  renderMailAi();
  const leer = document.getElementById('kiEmpty');
  if (!leer) return;
  const el = document.getElementById('kiFinds');
  leer.style.display = (el && el.style.display !== 'none') ? 'none' : '';
}

/** Nur mit Gateway: die Vorschlaege entstehen und liegen dort. */
function mailAiAvailable() {
  if (window.__SYMDO__) return true;
  return !!store.gatewayAvailable;
}

function loadMailProposals() {
  if (mailLoading) return;
  // Kein Gateway mehr: was noch auf dem Schirm steht, MUSS weg. Ein Vorschlag,
  // den niemand mehr uebernehmen oder verwerfen kann, ist eine Sackgasse.
  if (!mailAiAvailable()) {
    if (mailProposals.length > 0) { mailProposals = []; renderMailAlle(); }
    return;
  }
  mailLoading = true;
  aiPost('/mail/proposals', {}).then(r => {
    mailLoading = false;
    const j = r && r.json;
    // Kein Gateway, alte Version, KI-Route unbekannt: still nichts anzeigen.
    if (!j || j.ok !== true || !Array.isArray(j.proposals)) return;
    mailProposals = j.proposals;
    // Alle drei Baender: Termine haengen am Kalenderbereich, Notizen am
    // Notizbereich — ohne das erschienen sie dort erst beim naechsten Tab-Wechsel.
    renderMailAlle();
  }).catch(() => { mailLoading = false; });
}

/** Faelligkeit fuer AddItem. Mit Uhrzeit wird der Termin punktgenau, ohne ganztaegig. */
function mailDueFields(due, time) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(due || ''));
  if (!m) return { due: 0, dueAllDay: false };
  const t = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(time || ''));
  const d = t
    ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(t[1]), Number(t[2]))
    : new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return { due: Math.floor(d.getTime() / 1000), dueAllDay: !t, dueDay: m[0] };
}

// ── Uebernahme-Kette des KI-Scans ────────────────────────────────────────
// Nach „Hinzufuegen" oeffnet sich je Fund der passende, vorausgefuellte
// Dialog NACHEINANDER (Wunsch vom 23.08.2026: „damit man z.B. noch den
// Ordner anpassen kann"). Speichern legt den Fund an, Abbrechen ueberspringt
// ihn — beides schliesst den Dialog, und das Schliessen (Haken in
// closeOverlay) ruft den naechsten auf. Es gibt also keinen zweiten
// Speicherweg: es gelten die Pruefungen und Ansagen der Dialoge selbst.
let aiUebernahmeKette = [];
let aiUebernahmeWartet = '';
function aiUebernahmeWeiter() {
  if (!aiUebernahmeKette.length) { aiUebernahmeWartet = ''; return; }
  const e = aiUebernahmeKette.shift();
  const me = currentUserID();
  if (e.art === 'note') {
    if (!notizen.folders || notizen.folders.length === 0) {
      showToast(translate('Create a folder first'));
      aiUebernahmeWeiter();
      return;
    }
    const fid = (me && notizen.memberFolders && notizen.memberFolders[me]) || notesOrdnerId || notesErsterOrdner();
    aiUebernahmeWartet = 'noteOverlay';
    noteEditorOeffnen({ folderId: fid || '', title: String(e.t.title || ''),
      text: e.t.info ? String(e.t.info) : '', att: [] });
    // Die gescannte Datei zum Mitspeichern anbieten — vorgehakt, wie die
    // Anhaenge eines Mail-Vorschlags: wer eine Notiz aus einem fotografierten
    // Zettel macht, will den Zettel fast immer dabei haben. Abwaehlbar bleibt
    // sie trotzdem.
    if (e.quelle && noteCtx) {
      noteCtx.scanQuelle = { nutzlast: e.quelle.nutzlast, name: e.quelle.name || '', an: true };
      noteDateienZeichnen();
    }
    return;
  }
  if (e.art === 'event') {
    // openCalEditor sagt ohne beschreibbaren Kalender selbst ab — dann darf
    // die Kette nicht auf ein Schliessen warten, das nie kommt.
    if (calWritable().length === 0) {
      showToast(translate('No writable calendar available.'));
      aiUebernahmeWeiter();
      return;
    }
    aiUebernahmeWartet = 'calEditOverlay';
    openCalEditor(Object.assign({}, e.t, { userId: me || '' }));
    return;
  }
  const ziel = selectedTodoID();
  if (!ziel) {
    aiUebernahmeKette = [];
    showToast(translate('No ToDo list found'));
    return;
  }
  const entwurf = Object.assign({
    id: null, title: String(e.t.title || ''), info: e.t.info ? String(e.t.info) : '',
    priority: e.t.priority || 'normal', quantity: 0,
    assignedTo: me ? [me] : [], recurrence: 'none', notification: false
  }, mailDueFields(e.t.due, e.t.time));
  aiUebernahmeWartet = 'todoOverlay';
  openTodoEditor(ziel, entwurf);
  // openTodoEditor haelt jedes uebergebene Objekt fuer eine Bearbeitung,
  // hier ist es ein Entwurf — dieselbe Richtigstellung wie beim Mail-Vorschlag.
  document.getElementById('todoOverlayTitle').textContent = translate('New task');
}

function mailWhenText(due, time, end) {
  const tag = (v) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
    return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
  };
  const von = tag(due);
  if (!von) return '';
  // Mehrtaegiger Termin (Ferien, Schliesszeit): Zeitraum statt eines Datums, sonst
  // sieht eine zweiwoechige Schliessung wie ein einzelner Tag aus. Die Uhrzeit bleibt
  // dabei stehen — ein Kurs „ab 07.09. um 19:15, bis 30.11." verliert sie sonst,
  // und genau daran erkennt man eine Reihe statt eines Dauertermins.
  const bis = tag(end);
  const uhr = /^([01]\d|2[0-3]):([0-5]\d)$/.test(String(time || '')) ? ' ' + time : '';
  if (bis && bis !== von) {
    // Gleiches Jahr: nur EINMAL nennen — „15.01.–30.06.2026" statt
    // „15.01.2026–30.06.2026". Das sind fuenf Zeichen weniger und genau die Form,
    // in der man einen Zeitraum schreibt. Bei Jahreswechsel bleiben beide stehen.
    const kurz = von.slice(0, 6);   // „15.01." ohne Jahr
    return (von.slice(6) === bis.slice(6) ? kurz : von) + '–' + bis + uhr;
  }
  return von + uhr;
}

/**
 * Zaehler an den Tabs: offene Aufgaben-Vorschlaege am ToDo-Tab, offene
 * Termin-Vorschlaege am Kalender-Tab. Beide werden bei jedem Lauf gesetzt,
 * egal welche Sorte gerade gezeichnet wird — sonst bliebe der Zaehler der
 * anderen Sorte stehen, wenn nur ihre Liste leer wird.
 */
function setMailBadges() {
  const zahl = { task: 0, event: 0, note: 0 };
  mailProposals.forEach(p => (Array.isArray(p.items) ? p.items : []).forEach(it => {
    zahl[mailArt(it)]++;
  }));
  const setzen = (id, n) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = String(n);
    el.style.display = n > 0 ? '' : 'none';
  };
  // EIN Abzeichen fuer alles, was im KI-Bereich auf eine Entscheidung wartet.
  // Vorher zaehlte jede Sorte an ihrem eigenen Tab — das verteilte eine Nachricht
  // auf drei Stellen, von denen keine die ganze Zahl nannte.
  const offen = zahl.task + zahl.event + zahl.note;
  setzen('tabKiBadge', offen);
  appBadgeSetzen(offen);
}

/**
 * Dieselbe Zahl aufs App-Symbol.
 *
 * Gezaehlt werden AUSSCHLIESSLICH die KI-Vorschlaege, und sie stehen so lange,
 * bis jeder uebernommen oder verworfen ist — genau das leistet `mailProposals`
 * von selbst, denn mailForget() nimmt den Eintrag bei beidem heraus.
 *
 * Die Badging-API gibt es nur in einer Web-App auf dem Home-Screen (iOS ab 16.4)
 * und in einer installierten PWA unter Windows und macOS; in einem Safari-Tab,
 * in der Symcon-Kachel und unter Android-Chrome fehlt sie ganz. Deshalb
 * Merkmalspruefung statt Versionsraten. Auf iOS zeigt das Symbol die Zahl erst,
 * wenn Mitteilungen erlaubt sind — gezaehlt wird auch vorher, das kostet nichts.
 */
let appBadgeZahl = -1;   // zuletzt gesetzte Zahl, -1 = noch nie

function appBadgeSetzen(n) {
  if (!('setAppBadge' in navigator)) return;
  // setMailBadges() laeuft bei JEDEM Zeichnen. Ohne diesen Waechter setzte ein
  // einzelner Zustand die gleiche Zahl ein halbes Dutzend Mal — jeder Aufruf ist
  // auf iOS eine Zusage, die beantwortet werden muss.
  if (n === appBadgeZahl) return;
  appBadgeZahl = n;
  try {
    // clearAppBadge statt setAppBadge(0): letzteres zeigt auf manchen Systemen
    // einen leeren Punkt statt gar nichts.
    const p = n > 0 ? navigator.setAppBadge(n) : navigator.clearAppBadge();
    // Ohne Mitteilungsrecht lehnt Safari die Zusage ab — das ist kein Fehler,
    // den der Nutzer sehen muesste, aber eine unbehandelte Ablehnung waere es.
    // Und der Merker muss dann ZURUECK: sonst gilt die Zahl als gesetzt, und
    // erlaubt der Nutzer die Mitteilungen im selben Lauf, bliebe das Symbol leer,
    // bis sich die Zahl von selbst aendert.
    if (p && typeof p.catch === 'function') p.catch(() => { appBadgeZahl = -1; });
  } catch (e) {}
}

/**
 * Das Vorschlagsband: EINE Liste, nach Mails gegliedert.
 *
 * Frueher standen drei Baender nach Sorte untereinander (Aufgaben, Termine,
 * Notizen), jedes mit den Koepfen aller betroffenen Mails. Eine Mail mit allen
 * drei Sorten tauchte damit dreimal auf, und was zusammengehoert — alles, was
 * in EINEM Schreiben steht — lag an drei Stellen. Jetzt gibt es je Mail einen
 * Kopf und darunter ihre Funde in der Reihenfolge Aufgabe, Termin, Notiz.
 */
function renderMailAi() {
  // Vor dem Ausstieg unten: die Zaehler haengen an der Tab-Leiste, nicht am
  // Vorschlagsband, und muessen auch stimmen, wenn dessen Behaelter fehlt.
  setMailBadges();

  const area = document.getElementById('kiFinds');
  if (!area) return;

  // Je Mail die Funde in fester Sortenfolge; die Reihenfolge INNERHALB einer
  // Sorte bleibt, wie die KI sie geliefert hat.
  const gefiltert = mailProposals.map(p => {
    const roh = Array.isArray(p.items) ? p.items : [];
    const sortiert = [];
    for (const sorte of MAIL_SORTEN) {
      for (const it of roh) {
        if (mailArt(it) === sorte) sortiert.push(it);
      }
    }
    return Object.assign({}, p, { items: sortiert });
  }).filter(p => p.items.length > 0);

  if (gefiltert.length === 0) {
    area.style.display = 'none';
    area.innerHTML = '';
    area.classList.remove('open');
    // renderInto vergleicht gegen _lastHtml. Ohne das Zuruecksetzen bliebe der
    // Bereich leer, wenn spaeter genau dasselbe Markup wieder ansteht.
    area._lastHtml = null;
    return;
  }
  area.style.display = '';

  // Keine Ueberschrift und kein Aufklappen mehr: die Zahl steht am Tab, und was
  // wartet, soll man sehen, ohne es erst aufzuklappen. Stattdessen bekommt JEDE
  // MAIL ihren eigenen Kasten.
  const karten = gefiltert.map(p => {
    // Immer das Briefsymbol, auch wenn die Mail einem Mitglied gehoert. Der Kopf
    // benennt die MAIL, nicht die Person: wem sie gehoert, steht schon in der
    // Absenderzeile darunter, und ein Portraitfoto neben einem Betreff las sich
    // wie ein Chat-Beitrag statt wie ein Posteingang.
    const kopf = '<i class="fa-light fa-envelope mail-icon"></i>';
    // Eine weitergeleitete Mail nennt im aeusseren Kopf immer nur den Haushalt, der
    // sie weitergeleitet hat, und traegt ein „Fwd:" im Betreff. Wer sie geschrieben
    // hat und wie sie hiess, liest das Gateway aus dem zitierten Kopf (MailDetectOrigin)
    // und liefert es als `origin` mit. Fehlt es (aeltere Vorschlaege, Mail ohne
    // zitierten Kopf), bleibt der aeussere Kopf stehen — nur ohne „Fwd:".
    const quelleObj = (p.origin && typeof p.origin === 'object') ? p.origin : {};
    const weiter = String(p.fromName || p.from || '');
    const quelle = String(quelleObj.name || quelleObj.address || '');
    const titelText = String(quelleObj.subject || mailPlainSubject(p.subject) || translate('E-mail'));
    // Nur die Quelle, ohne Hinweis auf die Weiterleitung: weitergeleitet hat immer
    // jemand aus dem Haushalt, das ist keine Auskunft. Ohne erkannte Quelle bleibt
    // der aeussere Absender stehen, damit die Zeile nicht leer ist.
    // „Von: " gehoert MIT in den Uebersetzungsschluessel — im Englischen steht dort
    // „From: ", und ein festes Praefix im Code waere nicht uebersetzbar.
    const absender = quelle || weiter;
    const von = absender ? translate('From: %1').replace('%1', absender) : '';
    const zeilen = (Array.isArray(p.items) ? p.items : []).map(it => {
      const wann = mailWhenText(it.due, it.time, it.end);
      // Die Art MUSS jetzt an der Zeile stehen. Solange es drei Baender gab, sagte
      // die Klappzeile darueber, um welche Sorte es geht; unter einer Mail liegen
      // jetzt alle drei gemischt, und ohne Zeichen waere „Elternabend" von
      // „Elternbrief unterschreiben" nicht zu unterscheiden.
      const sorte = mailArt(it);
      const artZeichen = {
        task:  ['fa-list-check',  translate('Task')],
        event: ['fa-calendar',    translate('Appointment')],
        note:  ['fa-note-sticky', translate('Note')]
      }[sorte];
      // Die Art steht als eigene Zeile UEBER dem Titel (Symbol plus Wort), nicht
      // als Chip: ein weiterer Chip haette den knappen Platz in .mail-chips mit
      // den Angaben geteilt, die man wirklich lesen muss (Datum, Frist, Reihe).
      // Verdichtung wie bei den Aufgaben: Wiederholung und „ganztaegig" stecken
      // zusaetzlich in EINEM kombinierten Chip (.meta-combined). Stufe 1 blendet die
      // Einzel-Chips (.meta-split) aus und den kombinierten ein — dieselben Klassen,
      // dieselben Regeln, gemessen von layoutRowMeta().
      const reiheKurz = calSeriesText(it.recurrence);
      const kombiniert = (reiheKurz && it.allDay === true)
        ? `<span class="badge attr meta-combined" title="${escapeHtml([reiheKurz, translate('all day')].join(' · '))}">` +
            `<i class="fa-light fa-repeat"></i><i class="fa-light fa-sun"></i>` +
          `</span>`
        : '';
      const chips =
        (wann ? `<span class="badge due-badge"><i class="fa-light fa-calendar due-icon"></i><span class="due-text">${escapeHtml(wann)}</span></span>` : '') +
        // Reihe: der Vorschlag wird zu mehreren Terminen. Kurz im Chip (Takt bzw.
        // Anzahl), ausfuehrlich im Titel — sonst sprengt „zweiwoechentlich · bis
        // 03.12.2026" die Zeile.
        (reiheKurz
          ? `<span class="badge attr${kombiniert ? ' meta-split' : ''}" title="${escapeHtml(reiheKurz)}">` +
            `<i class="fa-light fa-repeat"></i>` +
            `<span>${escapeHtml(String(parseInt(it.recurrence.count) || '') || translate('Series'))}</span>` +
            `</span>`
          : '') +
        (it.allDay === true ? `<span class="badge${kombiniert ? ' meta-split' : ''}">${escapeHtml(translate('all day'))}</span>` : '') +
        kombiniert +
        (it.priority && it.priority !== 'normal' ? `<span class="badge ${priorityKey(it.priority)}">${escapeHtml(priorityLabel(it.priority))}</span>` : '');
      // Wisch-Behaelter um die Zeile: links verwerfen, rechts uebernehmen. Die
      // Erkennungsfelder bleiben an der ZEILE — der Klick-Verteiler des Bereichs
      // sucht sie ueber closest('.mail-row').
      // data-id am BEHAELTER ist der Schluessel fuer renderRows: „<Mail>:<Nummer>"
      // ist je Vorschlag eindeutig. Die Erkennungsfelder bleiben zusaetzlich an der
      // Zeile, weil der Klick-Verteiler sie ueber closest('.mail-row') sucht.
      return `<div class="mail-item" data-id="${escapeHtml(String(p.id) + ':' + String(it.i))}">` +
        `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
        `<div class="swipe-under-edit"><i class="fa-light fa-plus"></i></div>` +
        `<div class="mail-row" data-id="${escapeHtml(String(p.id))}" data-i="${escapeHtml(String(it.i))}">` +
        `<div class="mail-row-body">` +
          // Art ueber dem Titel, mit Wort dahinter: das Symbol allein war zu
          // knapp — ein Kalender neben einer Haken-Liste sagt nichts, wenn man
          // die Zuordnung nicht kennt.
          `<div class="mail-row-kind">` +
            `<i class="fa-light ${artZeichen[0]}"></i>` +
            `<span>${escapeHtml(artZeichen[1])}</span>` +
          `</div>` +
          `<div class="mail-row-title">${escapeHtml(String(it.title || ''))}</div>` +
          // Bei einer Notiz steht die Zusammenfassung in `text`, nicht in `info` —
          // ohne diesen Vorzug zeigte die Zeile nur den Titel, und genau die
          // Zusammenfassung ist der Grund, warum es eine Notiz wird.
          ((it.text || it.info) ? `<div class="mail-row-info">${escapeHtml(String(it.text || it.info))}</div>` : '') +
        `</div>` +
        // Aufbau wie in der Aufgabenzeile: erst die Merkmale, dann wer zustaendig
        // waere, dann die Knoepfe — alles in EINER Spalte, die layoutRowMeta() bei
        // Platznot als eigene Zeile unter den Inhalt schiebt.
        `<span class="mail-side"><span class="mail-chips">` +
          chips +
          renderAvatarStack(p.userId ? [String(p.userId)] : []) +
        `</span>` +
        `<button class="row-btn" data-mail="drop" aria-label="${translate('Discard')}" title="${translate('Discard')}"><i class="fa-light fa-xmark"></i></button>` +
        `<button class="row-btn accent" data-mail="add" aria-label="${translate('Add')}" title="${translate('Add')}"><i class="fa-light fa-plus"></i></button>` +
        `</span>` +
        `</div>` +
      `</div>`;
    }).join('');
    // Ein ECHTER Kasten um Kopf und Zeilen. Moeglich geworden durch
    // data-nest="1": renderRows vergleicht darin eine Ebene tiefer weiter, statt
    // den ganzen Kasten zu ersetzen — sonst verloeren die Zeilen bei jeder
    // Aenderung ihre Knoten und eine Wischgeste unter dem Finger wuerde ruckeln.
    return `<div class="card mail-box" data-nest="1" data-key="mailbox:${escapeHtml(String(p.id))}">` +
      `<div class="mail-head" data-key="mailkopf:${escapeHtml(String(p.id))}">${kopf}` +
        `<div class="mail-who">` +
          `<div class="mail-subject">${escapeHtml(titelText)}</div>` +
          `<div class="mail-meta">${escapeHtml(von)}</div>` +
        `</div>` +
        `<button class="row-btn destructive" data-mail="dismiss" data-id="${escapeHtml(String(p.id))}" aria-label="${translate('Discard mail')}" title="${translate('Discard mail')}"><i class="fa-light fa-trash-can"></i></button>` +
      `</div>` +
      zeilen +
    `</div>`;
  }).join('');

  // renderRows liefert NUR die neu erzeugten Knoten: die behalten ihre Gesten nicht,
  // alle uebrigen schon — samt laufender Wischgeste. Bei unveraendertem Markup kommt
  // false, dann wird gar nicht gebunden (ein zweiter Satz Handler wuerde jede
  // Wischgeste doppelt ausfuehren).
  const frische = renderRows(area, karten);
  if (frische !== false) bindMailRows(frische);

  // Messen wie am Ende von renderTodos: erst nach dem Zeichnen steht die Breite.
  ensureTodoMetaObserver();
  requestAnimationFrame(layoutTodoMeta);
}

function mailForget(id, index) {
  mailProposals = mailProposals.map(p => {
    if (String(p.id) !== String(id)) return p;
    return Object.assign({}, p, { items: (p.items || []).filter(it => String(it.i) !== String(index)) });
  }).filter(p => (p.items || []).length > 0);
  renderMailAlle();
}

function initMailAi() {
  mailAiBind(document.getElementById('kiFinds'));
}

function mailAiBind(area) {
  if (!area) return;
  area.addEventListener('click', (e) => {
    const knopf = e.target.closest('[data-mail]');
    if (!knopf) return;
    const art = knopf.getAttribute('data-mail');
    if (art === 'dismiss') {
      const id = knopf.getAttribute('data-id') || '';
      aiPost('/mail/proposals', { action: 'dismiss', id: id });
      mailProposals = mailProposals.filter(p => String(p.id) !== String(id));
      renderMailAlle();
      return;
    }
    const zeile = knopf.closest('.mail-row');
    if (!zeile) return;
    const id = zeile.getAttribute('data-id') || '';
    const i = zeile.getAttribute('data-i') || '';
    if (art === 'drop') {
      mailDrop(id, i);
      return;
    }
    if (art !== 'add') return;
    mailAccept(id, i);
  });
}

/** Vorschlag verwerfen — derselbe Weg fuer den ✕-Knopf und das Wischen nach links. */
function mailDrop(id, i) {
  aiPost('/mail/proposals', { action: 'taken', id: id, i: Number(i) });
  mailForget(id, i);
}

/**
 * Vorschlag uebernehmen — fuer den +-Knopf und das Wischen nach rechts.
 *
 * Angelegt wird NICHT sofort: der Vorschlag kommt von einem Sprachmodell und ist
 * ein Entwurf. Der uebliche Dialog oeffnet vorbelegt, damit vor dem Speichern noch
 * etwas geaendert werden kann. Erst nach dem Speichern gilt er als erledigt.
 */
function mailAccept(id, i) {
  const vorschlag = mailProposals.find(p => String(p.id) === String(id));
  const eintrag = vorschlag && (vorschlag.items || []).find(it => String(it.i) === String(i));
  if (!eintrag) return;
  entwurfOeffnen(eintrag, String(vorschlag.userId || ''), { id: id, i: i });
}

/**
 * Ein Fundstueck als Entwurf im passenden Editor oeffnen.
 *
 * NICHT direkt anlegen: der Vorschlag kommt von einem Sprachmodell. Der uebliche
 * Dialog oeffnet vorbelegt, damit vor dem Speichern noch etwas geaendert werden
 * kann. Erst nach dem Speichern gilt er als erledigt.
 *
 * `quelle` ist {id,i} eines Mail-Vorschlags oder null — letzteres bei einem KI-Fund
 * in einer Notiz, denn dort gibt es nichts abzumelden.
 */
function entwurfOeffnen(eintrag, userId, quelle) {
  if (eintrag.kind === 'note') {
    // Die Ordner stehen erst, wenn der Notizen-Bereich einmal gezeichnet wurde —
    // ladeNotizen() haengt dort am Zeichnen. Aus dem KI-Bereich heraus ist die
    // Liste also leer, und ohne dieses Nachladen kam „Noch keine Ordner", bis der
    // Nutzer einmal auf den Notizen-Tab gewechselt hatte. Der Aufruf holt
    // ausserdem die Mitglieder-Ordner nach: die entstehen serverseitig in
    // 'list' (NotesEnsureMemberFolders), nicht beim Uebernehmen.
    if (!notizenGeladen) {
      ladeNotizen(() => {
        // Genau EIN zweiter Versuch. Bei einem gescheiterten Laden bleibt
        // notizenGeladen false — ein blindes Wiederholen liefe endlos.
        if (notizenGeladen) { entwurfOeffnen(eintrag, userId, quelle); return; }
        showToast(translate('Could not load notes.'));
      });
      return;
    }
    // Ordner des Mitglieds vorwaehlen, dem die Mail gehoert.
    const fid = (userId && notizen.memberFolders[userId]) || notesOrdnerId || notesErsterOrdner();
    if (!fid) { showToast(translate('No folders yet')); return; }
    noteEditorOeffnen({
      folderId: fid,
      title: String(eintrag.title || ''),
      text: String(eintrag.text || eintrag.info || ''),
      att: []
    });
    if (noteCtx) {
      noteCtx.proposal = quelle || null;
      // Die Anhaenge der Mail zum Ankreuzen anbieten, vorgehakt: wer eine Notiz
      // aus einem Elternbrief macht, will das PDF fast immer dabei haben.
      // „atts" ist die Liste, „mediaId" der Einzelne aus Vorschlaegen, die vor
      // der Umstellung entstanden sind.
      const roh = Array.isArray(eintrag.atts) ? eintrag.atts : [];
      if (roh.length === 0 && eintrag.mediaId) {
        roh.push({ id: eintrag.mediaId, name: translate('Attachment'), kind: '' });
      }
      noteCtx.wahl = roh.map(a => ({
        id: a.id, name: a.name || translate('Attachment'),
        kind: a.kind || '', bytes: a.bytes || 0, an: true
      }));
      noteDateienZeichnen();
    }
    return;
  }
  if (eintrag.kind === 'event') {
    // Mitglied der Empfaengeradresse mitgeben — dieselbe Zuordnung wie bei Aufgaben.
    openCalEditor(Object.assign({}, eintrag, { userId: String(userId || '') }), quelle);
    return;
  }
  const ziel = selectedTodoID();
  if (!ziel) { showToast(translate('No ToDo list found')); return; }
  // Zuordnung aus der Empfaengeradresse; ohne Treffer der Standardnutzer der Kachel.
  const wem = String(userId || '') || currentUserID();
  const entwurf = Object.assign({
    id: null,
    title: String(eintrag.title || ''),
    info: eintrag.info ? String(eintrag.info) : '',
    priority: eintrag.priority || 'normal',
    quantity: 0,
    assignedTo: wem ? [wem] : [],
    recurrence: 'none',
    notification: false
  }, mailDueFields(eintrag.due, eintrag.allDay === true ? null : eintrag.time));
  openTodoEditor(ziel, entwurf);
  // Titel richtigstellen: openTodoEditor haelt jedes uebergebene Objekt fuer
  // eine Bearbeitung, hier ist es ein Entwurf.
  document.getElementById('todoOverlayTitle').textContent = translate('New task');
  todoCtx.proposal = quelle || null;
}

/**
 * Wischgesten der Vorschlagszeilen — dieselbe Geste wie in den Listen: links
 * verwerfen, rechts uebernehmen. Der Vorschlag ist dabei nur ein Zettel: Wischen
 * nach links loescht keinen Termin und keine Aufgabe, es raeumt den Zettel weg.
 * Deshalb ohne Rueckfrage, anders als beim Loeschen eines echten Termins.
 */
function bindMailRows(knoten) {
  // Ein frischer Knoten kann der KASTEN einer Mail sein (erste Zeichnung) oder
  // eine einzelne Zeile darin (spaetere Aenderung, siehe data-nest in
  // renderRows). Beide Faelle muessen zu Zeilen fuehren — sonst bekaeme eine
  // ganz neue Mail keine Wischgesten.
  const zeilen = [];
  knoten.forEach(n => {
    if (!n || !n.classList) return;
    if (n.classList.contains('mail-item')) { zeilen.push(n); return; }
    if (n.querySelectorAll) zeilen.push(...n.querySelectorAll('.mail-item'));
  });
  zeilen.forEach(behaelter => {
    if (!behaelter.classList || !behaelter.classList.contains('mail-item')) return;  // Kopf
    const zeile = behaelter.querySelector('.mail-row');
    if (!zeile) return;
    const id = zeile.getAttribute('data-id') || '';
    const i  = zeile.getAttribute('data-i') || '';
    bindCardSwipe(
      behaelter,
      '.mail-row',
      () => mailDrop(id, i),
      () => {
        // Nach rechts oeffnet den Dialog: die Zeile bleibt stehen, bis wirklich
        // gespeichert ist — sonst waere sie weg und der Entwurf noch offen.
        zeile.style.transform = '';
        behaelter.classList.remove('dragging-right');
        mailAccept(id, i);
      }
    );
  });
}

// ── Kalenderbereich (OpenCalendar) ───────────────────────────────────────────
// Gelesen wird ausschliesslich; die gesamte Anbieter-Synchronisation bleibt im
// Store-Modul OpenCalendar. Ist es nicht installiert oder kein Kalender
// eingerichtet, liefert das Gateway eine leere Liste und der Tab verschwindet.
let calCalendars = [];
let calEvents = [];
let calLoading = false;
let calError = '';
const CAL_RANGES = [7, 30, 90];

/* Jahresereignisse, wie OpenCalendar sie kennt. Die Symbole stehen im Kit von
   Symcon (/icons.js) — geprueft, bevor sie hier stehen: ein fehlender Name bliebe
   ein leeres <i>, das niemandem auffaellt. Die Kerze fuer den Todestag ist
   bewusst kein Kreuz und keine betenden Haende: sie passt zu jedem Glauben. */
const CAL_ANNUAL_TYPES = [
  { value: 'birthday',    label: 'Birthday',           icon: 'fa-gift' },
  { value: 'anniversary', label: 'Anniversary',        icon: 'fa-trophy' },
  { value: 'wedding',     label: 'Wedding anniversary', icon: 'fa-rings-wedding' },
  { value: 'death',       label: 'Remembrance day',    icon: 'fa-candle-holder' }
];

/** Die Art eines Jahresereignisses, oder '' wenn es keines ist. */
function calAnnualType(e) {
  const art = String((e && e.anniversaryType) || '');
  return CAL_ANNUAL_TYPES.some(t => t.value === art) ? art : '';
}

function calAvailable() {
  if (window.__SYMDO__) return true;
  return !!store.gatewayAvailable;
}

function calSelectedRange() {
  const v = parseInt(ls.get('symdo.calRange') || '30', 10);
  return CAL_RANGES.includes(v) ? v : 30;
}

function calSelectedID() {
  const gespeichert = String(ls.get('symdo.calID') || '');
  if (calCalendars.some(c => String(c.id) === gespeichert)) return gespeichert;
  return calCalendars.length ? String(calCalendars[0].id) : '';
}

/** Kalenderliste holen. Erst danach steht fest, ob der Tab ueberhaupt erscheint. */
function loadCalendars() {
  if (!calAvailable()) {
    if (calCalendars.length) { calCalendars = []; calEvents = []; renderCalendar(); applyTabVisibility(); }
    return;
  }
  return aiPost('/calendar', { action: 'calendars' }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true || !Array.isArray(j.calendars)) return;
    const vorher = calCalendars.length;
    calCalendars = j.calendars;
    // Keine Kalender mehr: alte Termine MUESSEN weg. Ein Bereich, der Termine einer
    // verschwundenen Quelle zeigt, behauptet etwas Falsches.
    if (calCalendars.length === 0) calEvents = [];
    // Sichtbarkeit haengt an der Anzahl — nur neu anwenden, wenn sie sich aendert.
    if ((vorher > 0) !== (calCalendars.length > 0)) applyTabVisibility();
    // Die Uebersichts-Kachel braucht die heutige Zahl unabhaengig davon, ob der
    // Kalender-Bereich offen ist.
    // Die Zahl der heutigen Termine kostet einen ZWEITEN Umlauf. Das Versprechen
    // wird durchgereicht, sonst waere der Kalender fuer den Ladeschirm schon
    // fertig, waehrend die Kachel auf der Uebersicht noch leer ist.
    const heutige = loadDashEvents();
    if (activeTab === 'calendar') loadCalendarEvents();
    else renderCalendar();
    return heutige;
  }).catch(() => {});
}

/**
 * Anzahl der heutigen Termine fuer die Uebersichts-Kachel — eigener, kleiner Abruf
 * ueber ALLE Kalender und nur den heutigen Tag. Der Kalender-Bereich laedt seine
 * Termine erst beim Oeffnen, fuer den gewaehlten Kalender und ueber Wochen; beides
 * passt hier nicht.
 *
 * `null` heisst „noch nicht bekannt" — die Kachel erscheint erst mit einer Zahl,
 * eine vorschnelle 0 waere eine Falschaussage.
 */
let dashEventsToday = null;
let dashEvents = [];          // heute und morgen, nach Beginn sortiert

function loadDashEvents() {
  if (!calAvailable() || calCalendars.length === 0) {
    if (dashEventsToday !== null || dashEvents.length) {
      dashEventsToday = null;
      dashEvents = [];
      renderDashboard();
    }
    return;
  }
  const von = Math.floor(new Date(new Date().setHours(0, 0, 0, 0)).getTime() / 1000);
  const grenze = von + 86400;                 // Beginn von morgen
  const bis = von + 2 * 86400;                // Ende von morgen
  return aiPost('/calendar', { action: 'events', from: von, to: bis, ids: [] }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true || !Array.isArray(j.events)) return;
    // Dieselbe Regel wie im Briefing: Ganztaegige Termine gelten fuer jeden Tag, den
    // sie ECHT schneiden (das Ende ist ausschliesslich, ein Eintrag der um 00:00 endet
    // gehoert zum Vortag); Termine mit Uhrzeit gehoeren zu dem Tag, an dem sie
    // beginnen. Sonst zaehlte ein mehrtaegiger Block jeden Tag mit.
    const tagVon = (e) => {
      const start = Number(e.start) || 0;
      const ende = Number(e.end) || 0;
      if (e.allDay === true) {
        if (ende > von && start < grenze) return 'today';
        if (ende > grenze && start < bis) return 'tomorrow';
        return '';
      }
      if (start >= von && start < grenze) return 'today';
      if (start >= grenze && start < bis) return 'tomorrow';
      return '';
    };
    dashEvents = j.events
      .map(e => ({
        tag: tagVon(e),
        start: Number(e.start) || 0,
        allDay: e.allDay === true,
        title: String(e.title || ''),
        // Jahresereignis: Art und Jahre muessen mit, sonst kann die Zeile das
        // Abzeichen nicht bauen. Sie standen im Datensatz, fielen hier aber weg.
        anniversaryType: String(e.anniversaryType || ''),
        years: Number(e.years) || 0,
        // Die Zuordnung kommt aus der eigenen Ablage des Gateways und ist das, was
        // die Avatare in der Zeile zeigen.
        members: Array.isArray(e.members) ? e.members : []
      }))
      .filter(e => e.tag !== '')
      .sort((a, b) => a.start - b.start);
    dashEventsToday = dashEvents.filter(e => e.tag === 'today').length;
    renderDashboard();
  }).catch(() => {});
}

function loadCalendarEvents() {
  if (calLoading || !calAvailable() || calCalendars.length === 0) return;
  const id = calSelectedID();
  const von = Math.floor(new Date(new Date().setHours(0, 0, 0, 0)).getTime() / 1000);
  calLoading = true;
  aiPost('/calendar', {
    action: 'events', from: von, to: von + calSelectedRange() * 86400,
    ids: id ? [Number(id)] : []
  }).then(r => {
    calLoading = false;
    const j = r && r.json;
    if (!j || j.ok !== true || !Array.isArray(j.events)) { calError = translate('Could not load appointments.'); renderCalendar(); return; }
    calError = '';
    calEvents = j.events;
    calTruncated = j.truncated === true;
    renderCalendar();
  }).catch(() => {
    // Auch der Netzwerkfehler braucht den Hinweis — sonst steht still ein alter
    // Stand da, als waere alles gut.
    calLoading = false;
    calError = translate('Could not load appointments.');
    renderCalendar();
  });
}
let calTruncated = false;

/** Tagesschlüssel in der Zeitzone des Geraets — nicht UTC, sonst rutschen Termine. */
function calDayKey(ts) {
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function calDayLabel(ts) {
  const d = new Date(ts * 1000);
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const morgen = new Date(heute.getTime() + 86400000);
  const tag = new Date(d); tag.setHours(0, 0, 0, 0);
  if (tag.getTime() === heute.getTime()) return translate('Today');
  if (tag.getTime() === morgen.getTime()) return translate('Tomorrow');
  const wochentage = [translate('Sun'), translate('Mon'), translate('Tue'), translate('Wed'), translate('Thu'), translate('Fri'), translate('Sat')];
  return wochentage[d.getDay()];
}

function calDateLabel(ts) {
  const d = new Date(ts * 1000);
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
}

function renderCalendar() {
  const bereich = document.getElementById('calArea');
  if (!bereich) return;
  const titel = document.getElementById('calTitle');
  const schalter = document.getElementById('calSwitcher');
  const spanne = document.getElementById('calRange');
  const status = document.getElementById('calStatus');

  const gewaehlt = calSelectedID();
  const aktuell = calCalendars.find(c => String(c.id) === gewaehlt) || null;
  if (titel) titel.textContent = aktuell ? aktuell.name : translate('Calendar');

  // Umschalter nur bei mehreren Kalendern — sonst ein Feld ohne Wahl.
  if (schalter) {
    if (calCalendars.length > 1) {
      schalter.style.display = '';
      schalter.innerHTML = calCalendars.map(c =>
        `<option value="${escapeHtml(String(c.id))}"${String(c.id) === gewaehlt ? ' selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
      if (titel) titel.style.display = 'none';
    } else {
      schalter.style.display = 'none';
      if (titel) titel.style.display = '';
    }
  }
  if (spanne && spanne.options.length !== CAL_RANGES.length) {
    spanne.innerHTML = CAL_RANGES.map(t =>
      `<option value="${t}"${t === calSelectedRange() ? ' selected' : ''}>${translate('%1 days').replace('%1', String(t))}</option>`).join('');
  }

  // Synchronisationsfehler des Kalenders sichtbar machen: eine Quelle, die still
  // nicht mehr aktualisiert, ist gefaehrlicher als eine sichtbare Meldung.
  const meldungen = [];
  if (calError !== '') meldungen.push(calError);
  if (aktuell && aktuell.lastError) meldungen.push(aktuell.lastError);
  if (aktuell && !aktuell.lastSync) meldungen.push(translate('This calendar has not been synchronised yet.'));
  if (calTruncated) meldungen.push(translate('Only the first appointments are shown.'));
  if (status) {
    status.style.display = meldungen.length ? '' : 'none';
    status.textContent = meldungen.join(' · ');
  }

  // Erkannte Termine stehen NICHT in der Agenda, sondern im KI-Bereich. Erst nach
  // dem Uebernehmen sind sie echte Kalendereintraege und erscheinen hier unten.

  // Avatar-Pille zeichnen, bevor gefiltert wird: der Filter kommt aus ihr.
  // Gefiltert wird nur mit sichtbarer Leiste — die (bereichsuebergreifende)
  // Auswahl darf ohne Bedienelement nicht unsichtbar weiterwirken.
  renderCalMembers();
  let alle = calEvents.slice();
  const gefiltert = rowButtonFlags().showMemberBar !== false
    && store.users.length > 0 && memberFilterIds.size > 0;
  if (gefiltert) {
    alle = alle.filter(e => Array.isArray(e.members) && e.members.some(mid => memberFilterIds.has(mid)));
  }

  if (alle.length === 0) {
    const meldung = gefiltert
      ? translate('No matches for this filter.')
      : translate('No appointments in this period');
    // Auch der Leerzustand ueber renderRows, damit derselbe Knotenabgleich gilt und
    // nicht zwei Renderwege denselben Behaelter mit unterschiedlichen Annahmen fuellen.
    renderRows(bereich, `<div class="empty-state" data-key="leer"><i class="fa-light fa-calendar-days"></i>${meldung}</div>`);
    return;
  }

  const farben = {};
  calCalendars.forEach(c => { farben[String(c.id)] = c.color || ''; });
  const tage = [];
  const nachTag = {};
  alle.forEach(e => {
    const k = calDayKey(e.start);
    if (!nachTag[k]) { nachTag[k] = []; tage.push(k); }
    nachTag[k].push(e);
  });
  const heuteKey = calDayKey(Math.floor(Date.now() / 1000));

  // Bedienbar ist nur, was der Anbieter auch schreiben laesst: in einem
  // abonnierten Fremdkalender waere jede Wischgeste ein Versprechen, das der
  // Anbieter danach bricht. Bei Serien-Vorkommen entscheiden die Flags AM
  // TERMIN (canUpdateOccurrence/canDeleteOccurrence aus dem Gateway) — nicht
  // der Kalenderstatus, der dazu nichts Belastbares sagt.
  const schreibbar = {};
  calCalendars.forEach(c => { schreibbar[String(c.id)] = c.canWrite === true; });
  const knopfSchalter = rowButtonFlags();
  const zeigeBearbeiten = knopfSchalter.showEditButton === true;
  const zeigeLoeschen   = knopfSchalter.showDeleteButton === true;
  // Die Info-Abzeichen folgen denselben appweiten Schaltern wie bei den Aufgaben —
  // wer die Glocke dort nicht sehen will, will sie hier auch nicht.
  const zeigeWiederholung = knopfSchalter.showRecurrenceBadge !== false;
  const zeigeGlocke       = knopfSchalter.showNotificationBadge !== false;

  const frische = renderRows(bereich, tage.map(k => {
    const liste = nachTag[k];
    const ts = liste[0].start;
    const zeilen = liste.map(e => {
      const farbe = farben[String(e.calendarID)] || '';
      const wann = e.allDay
        ? translate('all day')
        : new Date(e.start * 1000).toTimeString().slice(0, 5);
      const unten = [e.location, e.info].filter(Boolean).join(' · ');
      // Zugewiesene Mitglieder als Avatare, wie in der Aufgabenzeile.
      const wer = Array.isArray(e.members) && e.members.length ? renderAvatarStack(e.members) : '';
      // Wiederholung und Erinnerung als Abzeichen wie in der Aufgabenzeile
      // (.badge.attr, dieselben Symbole). Beim Termin sagt das Wiederholungs-
      // Abzeichen bewusst „Teil einer Serie" und nicht den Takt: den kennt nur der
      // Serienkopf, das einzelne Vorkommen traegt die Regel nicht.
      const vorlauf = Number(e.reminder);
      /* Jahresereignis: eigenes Abzeichen mit der Zahl der Jahre. Es ersetzt das
         Wiederholungs-Abzeichen — dass ein Geburtstag jaehrlich wiederkehrt, sagt
         schon das Symbol, zwei Zeichen nebeneinander waeren dieselbe Auskunft
         zweimal. */
      const jahrestag = calAnnualBadge(e);
      const abzeichen = jahrestag +
        (zeigeWiederholung && e.recurring === true && !jahrestag
          ? `<span class="badge attr" title="${escapeHtml(translate('Part of a series'))}"><i class="fa-light fa-repeat"></i></span>` : '') +
        (zeigeGlocke && Number.isFinite(vorlauf) && vorlauf >= 0
          ? `<span class="badge attr" title="${escapeHtml(calReminderTitle(vorlauf))}"><i class="fa-light fa-bell"></i></span>` : '');
      const serie = e.recurring === true;
      /* Auch hier zaehlt JEDE Reichweite, nicht nur das einzelne Vorkommen:
         ein Kalender, der bloss die ganze Serie schreiben laesst, zeigte sonst
         gar keine Knoepfe — obwohl das Aendern erlaubt ist. */
      const kannBearbeiten = schreibbar[String(e.calendarID)] === true && (!serie
        || e.canUpdateOccurrence === true || e.canUpdateFollowing === true || e.canUpdateSeries === true);
      const kannLoeschen   = schreibbar[String(e.calendarID)] === true && (!serie
        || e.canDeleteOccurrence === true || e.canDeleteSeries === true);
      const darf = kannBearbeiten || kannLoeschen;
      // Die Wisch-Untergruende nur dort, wo auch gewischt werden kann — sonst
      // blitzte beim Ziehen ein rotes Feld auf, das nichts tut.
      const unter = darf
        ? (kannLoeschen ? `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` : '') +
          (kannBearbeiten ? `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` : '')
        : '';
      const knoepfe = !darf ? '' :
        (zeigeBearbeiten && kannBearbeiten ? `<button class="row-btn" data-cal-edit="1" aria-label="${translate('Edit')}" title="${translate('Edit')}"><i class="fa-light fa-pencil"></i></button>` : '') +
        (zeigeLoeschen && kannLoeschen ? `<button class="row-btn destructive" data-cal-del="1" aria-label="${translate('Delete')}" title="${translate('Delete')}"><i class="fa-light fa-trash"></i></button>` : '');
      return `<div class="cal-card${darf ? '' : ' cal-readonly'}" data-cal="${escapeHtml(String(e.calendarID))}" data-id="${escapeHtml(String(e.id || ''))}">` +
        unter +
        `<div class="cal-event">` +
          `<span class="cal-bar"${farbe ? ` style="background:${escapeHtml(farbe)}"` : ''}></span>` +
          // Uhrzeit ueber dem Titel, nicht in einer eigenen Spalte davor: „ganztaegig"
          // sprengte die 44px-Spalte, und die Zeile liest sich von oben nach unten
          // wie eine Aufgabe — wann, was, wo.
          `<span class="cal-body">` +
            `<div class="cal-when">${escapeHtml(wann)}</div>` +
            `<div class="cal-title">${escapeHtml(e.title || translate('Appointment'))}</div>` +
            (unten ? `<div class="cal-sub">${escapeHtml(unten)}</div>` : '') +
          `</span>` +
          // Merkmale, Zustaendigkeit und Knoepfe in EINER Spalte — wie in der
          // Aufgaben- und der Vorschlagszeile. layoutRowMeta() schiebt sie bei
          // Platznot als eigene Zeile unter den Inhalt.
          `<span class="cal-side"><span class="cal-chips">${abzeichen}${wer}</span>${knoepfe}</span>` +
        `</div>` +
      `</div>`;
    }).join('');
    // Ueberschrift und Zeilen als GESCHWISTER, mit Schluessel je Tag — so behaelt
    // renderRows() die unveraenderten Knoten (siehe CSS-Kommentar bei .cal-day-head).
    return `<div class="cal-day-head${k === heuteKey ? ' is-today' : ''}" data-key="tag:${escapeHtml(k)}">` +
      `<span class="cal-weekday">${escapeHtml(calDayLabel(ts))}</span>` +
      `<span>${escapeHtml(calDateLabel(ts))}</span></div>` +
      zeilen;
  }).join(''));

  // renderRows liefert NUR die neu erzeugten Knoten. Genau die brauchen eine
  // Bindung — die uebrigen behalten ihre, samt laufender Wischgeste.
  if (frische !== false) bindCalRows(frische);

  // Messen wie am Ende von renderTodos und renderMailAi.
  ensureTodoMetaObserver();
  requestAnimationFrame(layoutTodoMeta);
}

/**
 * Wischgesten, Zeilenknoepfe und Tipp der Agenda — dieselben wie bei den Aufgaben:
 * links loeschen, rechts bearbeiten (bindCardSwipe), Tipp auf die Zeile oeffnet den
 * Editor. Der Stift-Knopf ist damit ein zusaetzlicher Weg, kein Ersatz.
 *
 * Ein Unterschied bleibt: geloescht wird erst nach Rueckfrage. Ein Termin liegt
 * beim Anbieter und ist fuer alle sichtbar, die den Kalender teilen — ein
 * Fehlwischer ist dort nicht zurueckzuholen. Deshalb `dissolve: false` und der
 * Weg ueber showConfirm, wie beim Loeschen einer Favoritenliste.
 */
function bindCalRows(knoten) {
  knoten.forEach(card => {
    if (!card.classList || !card.classList.contains('cal-card')) return;   // Tagesueberschrift
    if (card.classList.contains('cal-readonly')) return;
    const zeile = card.querySelector('.cal-event');
    const finde = () => calEvents.find(e => String(e.id) === String(card.dataset.id));

    // Serien-Vorkommen nur, wenn DIESES Vorkommen es erlaubt (Flags am Termin,
    // canUpdateOccurrence/canDeleteOccurrence) — sonst mit demselben Hinweis
    // ablehnen, den auch das Gateway gaebe. Die Wache steht an der AKTION und
    // nicht nur am Markup, weil eine Zeile mit nur einer erlaubten Richtung
    // trotzdem beide Wischwege hat.
    /* Erlaubt ist es, wenn IRGENDEINE Reichweite geht — nicht nur das einzelne
       Vorkommen. Frueher stand hier allein canUpdateOccurrence, und ein Kalender,
       der nur die ganze Serie schreiben laesst, galt als gesperrt. */
    const serieErlaubt = (e, art) => {
      if (e.recurring !== true) return true;
      // Jahresereignis: nur das Serienrecht zaehlt (siehe calFrageReichweite).
      const geht = calAnnualType(e)
        ? (art === 'del' ? e.canDeleteSeries === true : e.canUpdateSeries === true)
        : (art === 'del'
        ? (e.canDeleteOccurrence === true || e.canDeleteSeries === true)
        : (e.canUpdateOccurrence === true || e.canUpdateFollowing === true || e.canUpdateSeries === true));
      if (geht) return true;
      showToast(translate(art === 'del'
        ? 'This appointment is part of a series. This calendar does not allow deleting it that way — please delete it in your calendar app.'
        : 'This appointment is part of a series. This calendar does not allow editing it that way — please edit it in your calendar app.'));
      return false;
    };

    const loeschen = () => {
      // Slide-out zuruecknehmen, damit die Zeile bei Abbruch stehen bleibt.
      card.classList.remove('is-deleting'); delete card.dataset.animating;
      if (zeile) zeile.style.transform = '';
      restoreCard(card);
      const e = finde();
      if (!e || !serieErlaubt(e, 'del')) return;
      // Erst die Reichweite, dann die Rueckfrage: „Loeschen?" ohne zu wissen, WAS
      // geloescht wird, waere bei einer Serie eine gefaehrliche Zustimmung.
      calFrageReichweite(e, 'del').then(scope => {
        if (!scope) return;
        // Beim Jahresereignis waere „ganze Serie" die technisch richtige, aber
        // unverstaendliche Frage — geloescht wird ein Geburtstag, keine Serie.
        showConfirm(translate(calAnnualType(e) ? 'Delete this annual event?'
          : (scope === 'series' ? 'Delete the whole series?' : 'Delete this appointment?')),
          translate('Delete'), () => calDelete(e, scope));
      });
    };
    const bearbeiten = () => { const e = finde(); if (e && serieErlaubt(e, 'edit')) openCalEditor(e, null, e); };

    bindCardSwipe(card, '.cal-event', loeschen, bearbeiten, { dissolve: false });

    // Tipp auf die Zeile — wie bei einer Aufgabe. Nach einer Wischgeste NICHT:
    // bindCardSwipe setzt dafuer 60 ms lang dataset.swiped, sonst oeffnete jedes
    // Wischen zum Bearbeiten den Dialog zweimal.
    if (zeile) zeile.addEventListener('click', (ev) => {
      if (card.dataset.swiped === '1') return;
      if (ev.target.closest('button')) return;
      bearbeiten();
    });

    const bBtn = card.querySelector('[data-cal-edit]');
    if (bBtn) bBtn.addEventListener('click', (ev) => { ev.stopPropagation(); bearbeiten(); });
    const lBtn = card.querySelector('[data-cal-del]');
    if (lBtn) lBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const e = finde();
      if (!e || !serieErlaubt(e, 'del')) return;
      calFrageReichweite(e, 'del').then(scope => {
        if (!scope) return;
        // Beim Jahresereignis waere „ganze Serie" die technisch richtige, aber
        // unverstaendliche Frage — geloescht wird ein Geburtstag, keine Serie.
        showConfirm(translate(calAnnualType(e) ? 'Delete this annual event?'
          : (scope === 'series' ? 'Delete the whole series?' : 'Delete this appointment?')),
          translate('Delete'), () => calDelete(e, scope));
      });
    });
  });
}

/**
 * Beschriftung des Jahrestags-Abzeichens: „wird 80", „12. Hochzeitstag". Beim
 * Todestag wird bewusst nicht gezaehlt wie bei einem Geburtstag — dort steht die
 * Jahreszahl fuer sich.
 */
function calAnnualTitle(e) {
  const art = calAnnualType(e);
  const zeile = CAL_ANNUAL_TYPES.find(t => t.value === art);
  if (!zeile) return '';
  const jahre = Number(e.years);
  if (!Number.isFinite(jahre) || jahre <= 0) return translate(zeile.label);
  if (art === 'birthday') return translate('Turns %1').replace('%1', String(jahre));
  return translate('%1. %2').replace('%1', String(jahre)).replace('%2', translate(zeile.label));
}

/**
 * Das Abzeichen eines Jahresereignisses — Symbol und Zahl der Jahre, leer bei
 * einem gewoehnlichen Termin. Steht hier und nicht zweimal in den Zeilen: die
 * Uebersicht zeigt dieselben Termine wie der Kalender, und ein Geburtstag, der
 * nur an einer der beiden Stellen als solcher zu erkennen waere, ist keiner.
 */
function calAnnualBadge(e) {
  const art = calAnnualType(e);
  const zeile = art ? CAL_ANNUAL_TYPES.find(t => t.value === art) : null;
  if (!zeile) return '';
  const jahre = Number(e.years);
  return `<span class="badge attr" title="${escapeHtml(calAnnualTitle(e))}">` +
    `<i class="fa-light ${zeile.icon}"></i>` +
    (Number.isFinite(jahre) && jahre > 0 ? escapeHtml(String(jahre)) : '') + '</span>';
}

/**
 * Fragt, worauf eine Aenderung an einem Serien-Vorkommen wirken soll.
 *
 * Angeboten wird nur, was der Anbieter AM TERMIN erlaubt — die Flags kommen mit
 * dem Datensatz (canUpdateOccurrence/Following/Series bzw. canDelete…). Gibt es
 * nur eine Moeglichkeit, wird nicht gefragt; gibt es keine, null.
 *
 * Loeschen kennt nur zwei Reichweiten: „dieser" und „ganze Serie". Ein „und alle
 * folgenden" meldet der Anbieter dafuer nicht.
 *
 * @returns {Promise<string|null>} 'occurrence' | 'following' | 'series' | null
 */
function calFrageReichweite(e, art) {
  return new Promise(fertig => {
    if (!e || e.recurring !== true) { fertig('occurrence'); return; }
    /* Ein Jahresereignis kennt nur eine Reichweite: das Ganze. Ein einzelnes
       Vorkommen zu aendern lehnt der Kalender ohnehin ab, und ein Geburtstag, dem
       genau ein Jahr fehlt, waere ein Zustand ohne Sinn. Also nicht fragen. */
    if (calAnnualType(e)) {
      const darf = art === 'del' ? e.canDeleteSeries : e.canUpdateSeries;
      fertig(darf === true ? 'series' : null);
      return;
    }
    const moeglich = (art === 'del'
      ? [['occurrence', e.canDeleteOccurrence, translate('Only this appointment')],
         ['series', e.canDeleteSeries, translate('The whole series')]]
      : [['occurrence', e.canUpdateOccurrence, translate('Only this appointment')],
         ['following', e.canUpdateFollowing, translate('This and all following')],
         ['series', e.canUpdateSeries, translate('The whole series')]]
    ).filter(x => x[1] === true);
    if (moeglich.length === 0) { fertig(null); return; }
    if (moeglich.length === 1) { fertig(moeglich[0][0]); return; }
    document.getElementById('calScopeTitle').textContent = translate(
      art === 'del' ? 'Delete which appointments?' : 'Change which appointments?');
    const body = document.getElementById('calScopeBody');
    body.innerHTML = moeglich.map(x =>
      `<button class="scope-btn${x[0] === 'series' && art === 'del' ? ' destructive' : ''}" ` +
      `data-scope="${x[0]}">${escapeHtml(x[2])}</button>`).join('');
    let beantwortet = false;
    body.querySelectorAll('[data-scope]').forEach(b => b.addEventListener('click', () => {
      beantwortet = true;
      closeOverlay('calScopeOverlay');
      fertig(b.dataset.scope);
    }));
    // Wegtippen heisst abbrechen — nicht stillschweigend das Vorkommen nehmen.
    const blatt = document.getElementById('calScopeOverlay');
    const zu = () => {
      blatt.removeEventListener('transitionend', zu);
      if (!beantwortet) { fertig(null); }
    };
    blatt.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => {
      if (!beantwortet) { beantwortet = true; fertig(null); }
    }, { once: true }));
    openOverlay('calScopeOverlay');
  });
}

/** Termin beim Anbieter loeschen. Die Rueckfrage ist an dieser Stelle bereits gefallen. */
function calDelete(e, scope) {
  aiPost('/calendar', {
    action: 'delete',
    calendarID: e.calendarID,
    // Die Reichweite MUSS mit: ohne sie loescht das Gateway nur das Vorkommen.
    event: { id: e.id, uid: e.uid, startTimestamp: e.start, scope: scope || 'occurrence' }
  }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true) {
      showToast((j && j.error && j.error.message) || translate('The calendar rejected the deletion.'));
      return;
    }
    showToast(translate('Appointment deleted'));
    // Der Anbieter ist die Wahrheit: neu holen statt lokal zu raten.
    calEvents = [];
    loadCalendarEvents();
  }).catch(() => showToast(translate('The calendar rejected the deletion.')));
}

// ── Termin anlegen ───────────────────────────────────────────────────────────
// Geschrieben wird ueber OpenCalendar, also beim Anbieter (Google, iCloud, CalDAV).
// Der Eintrag ist danach fuer alle sichtbar, die den Kalender teilen — deshalb
// nichts automatisch, und der Dialog zeigt vorher genau, was gespeichert wird.
let calCtx = null;      // {proposal:{id,i}|null}
let ceAssigned = [];    // Mitglieder des Termins, wie tdAssigned bei Aufgaben

/** Nur Kalender, in die geschrieben werden darf. */
function calWritable() {
  return calCalendars.filter(c => c.canWrite === true);
}

function calLocalInput(datum, zeit, ganztags) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(datum || ''));
  if (!m) return '';
  if (ganztags) return m[0];
  const t = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(zeit || ''));
  return m[0] + 'T' + (t ? t[0] : '09:00');
}

/**
 * „Fwd: WG: Halbjahresplaner" → „Halbjahresplaner".
 *
 * Gegenstueck zu MailStripReplyPrefix im Gateway, hier fuer den AEUSSEREN Betreff:
 * er wird gebraucht, wenn der zitierte Kopf keinen Betreff hergab oder der Vorschlag
 * noch aus der Zeit vor `origin` stammt.
 */
function mailPlainSubject(betreff) {
  let text = String(betreff || '').trim();
  let vorher = '';
  while (vorher !== text) {
    vorher = text;
    text = text.replace(/^\s*(?:fwd?|wg|aw|re|antw)\s*:\s*/i, '').trim();
  }
  return text;
}

/**
 * Wiederholung eines Vorschlags in Worte fassen: „wöchentlich · 15 Termine" bzw.
 * „wöchentlich · bis 03.12.2026". Gibt '' zurueck, wenn keine gueltige Reihe
 * vorliegt — dieselben drei Takte, die das Gateway kennt (CalSeriesRule).
 */
function calSeriesText(r) {
  if (!r || typeof r !== 'object') return '';
  const takt = { weekly: 'weekly', biweekly: 'biweekly', monthly: 'monthly' }[String(r.freq || '')];
  if (!takt) return '';
  const teile = [translate(takt)];
  const anzahl = parseInt(r.count) || 0;
  if (anzahl > 1) {
    teile.push(translate('%1 appointments').replace('%1', String(anzahl)));
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(String(r.until || ''))) {
    const m = String(r.until).split('-');
    teile.push(translate('until %1').replace('%1', `${m[2]}.${m[1]}.${m[0]}`));
  }
  return teile.join(' · ');
}

/**
 * Titel des Glocken-Abzeichens. Die Vorlaufzeit steht in der Ablage des Gateways,
 * also kann hier stehen WANN erinnert wird und nicht bloss DASS erinnert wird.
 */
function calReminderTitle(sekunden) {
  const n = Number(sekunden);
  if (!LEAD_TIMES.includes(n)) return translate('Reminder');
  // Vorlauf 0 heisst bei einer Aufgabe „zur Faelligkeit" — ein Termin hat keine
  // Frist, sondern findet statt. Deshalb hier eigene Worte statt leadTimeLabel().
  const wann = n === 0 ? translate('At the appointment') : leadTimeLabel(n);
  return translate('Reminder') + ': ' + wann;
}

/** Unix-Zeit in den Wert eines date- bzw. datetime-local-Feldes (Ortszeit). */
function calInputFromTs(ts, ganztags) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  const tag = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  return ganztags ? tag : `${tag}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

/**
 * @param entwurf {title,info,due,time,end,allDay} — auch von Hand aufrufbar (entwurf=null)
 * @param vorschlag {id,i}|null — Mail-Vorschlag, der nach dem Speichern erledigt ist
 * @param bestand   Termin aus calEvents; gesetzt heisst AENDERN statt Anlegen
 */
function openCalEditor(entwurf, vorschlag, bestand) {
  const schreibbar = calWritable();
  if (schreibbar.length === 0) {
    showToast(translate('No writable calendar available.'));
    return;
  }
  calCtx = {
    proposal: vorschlag || null,
    /* Beides festhalten, damit der Dialog nach einem gescheiterten Speichern
       genau so wieder aufgebaut werden kann, wie er war (siehe
       calSpeichernSenden). Sonst waere die Eingabe weg — der Dialog schliesst
       jetzt sofort, ohne die Antwort abzuwarten. */
    draft: entwurf || null,
    original: bestand || null,
    // Reihe nur beim Anlegen aus einem Vorschlag: ein bestehender Termin ist immer
    // ein einzelnes Vorkommen (gemessen — Aendern trifft nie die ganze Serie).
    recurrence: (!bestand && entwurf && entwurf.recurrence) ? entwurf.recurrence : null,
    // Erkennungsfelder festhalten: die Liste kann sich waehrend des Dialogs neu
    // laden, der Termin unter der Zeile bleibt aber derselbe.
    /* Auch die Serien-Merkmale festhalten. Ohne sie fragt calFrageReichweite beim
       Speichern nichts und antwortet sofort mit „nur dieses Vorkommen" — die
       Reichweitenfrage gab es damit nur beim Loeschen, wo der volle Datensatz aus
       der Liste kommt. Dasselbe gilt fuer die Art des Jahresereignisses. */
    edit: bestand ? {
      calendarID: bestand.calendarID,
      id: String(bestand.id || ''),
      uid: String(bestand.uid || ''),
      startTimestamp: bestand.start || 0,
      recurring: bestand.recurring === true,
      canUpdateOccurrence: bestand.canUpdateOccurrence === true,
      canUpdateFollowing: bestand.canUpdateFollowing === true,
      canUpdateSeries: bestand.canUpdateSeries === true,
      anniversaryType: String(bestand.anniversaryType || '')
    } : null
  };
  const e = bestand || entwurf || {};
  const ganztags = e.allDay === true;

  document.getElementById('calEditTitle').textContent =
    translate(bestand ? 'Edit appointment' : 'New appointment');
  document.getElementById('ceTitle').value = String(e.title || '');
  document.getElementById('ceInfo').value = String(e.info || '');
  document.getElementById('ceLocation').value = String(e.location || '');
  document.getElementById('ceAllDay').checked = ganztags;

  // Jahresereignis: Art und Ursprungsdatum kommen mit dem Termin (das Gateway
  // reicht sie aus OpenCalendar durch). Beim Anlegen ist der Schalter aus.
  const artFeld = document.getElementById('ceAnnualType');
  artFeld.innerHTML = CAL_ANNUAL_TYPES.map(t =>
    `<option value="${t.value}">${escapeHtml(translate(t.label))}</option>`).join('');
  const artAlt = calAnnualType(e);
  document.getElementById('ceAnnual').checked = artAlt !== '';
  artFeld.value = artAlt || 'birthday';
  document.getElementById('ceAnnualDate').value = String(e.anniversaryDate || '');

  const auswahl = document.getElementById('ceCalendar');
  auswahl.innerHTML = schreibbar.map(c =>
    `<option value="${escapeHtml(String(c.id))}">${escapeHtml(c.name)}</option>`).join('');
  if (bestand) {
    // Beim Aendern steht der Kalender fest: OpenCalendar aendert innerhalb SEINER
    // Instanz, ein Umhaengen waere loeschen und neu anlegen — das ist ein anderer
    // Vorgang und soll nicht als Nebenwirkung eines Speichern passieren.
    auswahl.value = String(bestand.calendarID);
    auswahl.disabled = true;
  } else {
    auswahl.disabled = false;
    // Zuletzt benutzter Kalender, falls er noch beschreibbar ist.
    const gemerkt = String(ls.get('symdo.calWrite') || '');
    if (schreibbar.some(c => String(c.id) === gemerkt)) auswahl.value = gemerkt;
  }

  // Mitglieder: aus dem Vorschlag das Mitglied der Empfaengeradresse, sonst der
  // Standardnutzer — genau wie bei einer Aufgabe. Beim Aendern gilt, was am Termin
  // steht, auch wenn das niemand ist.
  ceAssigned = Array.isArray(e.members) && e.members.length ? e.members.slice()
    : (bestand ? [] : (e.userId ? [e.userId] : (currentUserID() ? [currentUserID()] : [])));
  renderAssignList('ceAssignList', ceAssigned);

  // Erinnerung: bei einem Termin mit Uhrzeit sinnvoll voreingestellt, ganztaegig
  // ausgeschaltet — eine Erinnerung „30 Minuten vor 00:00" hilft niemandem. Beim
  // Aendern kommt die eingestellte Vorlaufzeit aus der Ablage des Gateways mit.
  const lead = document.getElementById('ceLeadTime');
  lead.innerHTML = LEAD_TIMES.map(x => `<option value="${x}">${leadTimeLabel(x)}</option>`).join('');
  const vorlauf = bestand ? Number(bestand.reminder) : -1;
  const hatVorlauf = Number.isFinite(vorlauf) && vorlauf >= 0;
  lead.value = String(hatVorlauf && LEAD_TIMES.includes(vorlauf) ? vorlauf : 1800);
  document.getElementById('ceNotify').checked = hatVorlauf;
  calSyncNotify();

  calSyncEditor(ganztags);
  if (bestand) {
    document.getElementById('ceStart').value = calInputFromTs(bestand.start, ganztags);
    // Ganztaegig ist das Ende beim Anbieter EXKLUSIV (siehe CalCreateEvent) — im
    // Feld muss der letzte Tag stehen, sonst waechst der Termin bei jedem
    // Speichern um einen Tag.
    const ende = ganztags ? bestand.end - 86400 : bestand.end;
    document.getElementById('ceEnd').value =
      ende > bestand.start ? calInputFromTs(ende, ganztags) : calInputFromTs(bestand.start, ganztags);
  } else {
    document.getElementById('ceStart').value = calLocalInput(e.due, e.time, ganztags);
    // Ende nur, wenn der Vorschlag eines nennt — sonst leer lassen und OpenCalendar
    // die Vorgabe waehlen (eine Stunde bzw. ein Tag).
    document.getElementById('ceEnd').value = e.end ? calLocalInput(e.end, null, ganztags) : '';
  }

  // Reihe sichtbar machen, damit vor dem Speichern klar ist, dass daraus mehrere
  // Termine werden — und wie viele.
  const reiheText = calSeriesText(calCtx.recurrence);
  const reiheZeile = document.getElementById('ceSeriesRow');
  if (reiheZeile) {
    reiheZeile.style.display = reiheText ? '' : 'none';
    const feld = document.getElementById('ceSeries');
    if (feld) feld.textContent = reiheText;
  }
  // Bei einer Reihe ist das Ende-Feld ohne Bedeutung: jeder Termin der Reihe
  // bekommt die Dauer des Anbieters, ein Ende in drei Monaten waere der alte Klotz.
  const endeZeile = document.getElementById('ceEnd');
  if (endeZeile && endeZeile.parentElement) {
    endeZeile.parentElement.style.display = reiheText ? 'none' : '';
    if (reiheText) endeZeile.value = '';
  }
  // Zuletzt, damit die Zeitfelder eines Jahresereignisses verschwunden BLEIBEN:
  // die Reihen-Zeile oben blendet das Ende-Feld sonst wieder ein.
  calSyncAnnual();
  openOverlay('calEditOverlay');
}

/**
 * Jahresereignis an: Beginn, Ende und „ganztaegig" verschwinden. Sie stehen dann
 * nicht zur Wahl — der Kalender baut aus dem Ursprungsdatum selbst einen
 * ganztaegigen, jaehrlich wiederkehrenden Termin. Ein sichtbares Beginn-Feld waere
 * ein Versprechen, das beim Speichern gebrochen wuerde.
 */
function calSyncAnnual() {
  const an = document.getElementById('ceAnnual').checked;
  calSyncAnnualLabel();
  ['ceAnnualTypeRow', 'ceAnnualDateRow'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = an ? '' : 'none';
  });
  ['ceAllDayRow', 'ceStartRow', 'ceEndRow'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = an ? 'none' : '';
  });
}

/**
 * Das Ursprungsdatum beim Namen nennen.
 *
 * „Seit" allein beantwortet die Frage nicht, die jeder beim ersten Mal hat: welches
 * Datum denn — das des naechsten Geburtstags oder das der Geburt? Gemeint ist immer
 * das ERSTE Vorkommen samt Jahr; daraus zaehlt der Kalender die Jahre.
 */
function calSyncAnnualLabel() {
  const feld = document.getElementById('calEditAnnualDateLabel');
  if (!feld) return;
  const art = document.getElementById('ceAnnualType').value;
  feld.textContent = translate({
    birthday:    'Date of birth',
    wedding:     'Date of the wedding',
    death:       'Date of death',
    anniversary: 'First time on'
  }[art] || 'Since');
}

/** Vorlaufzeit nur zeigen, wenn eine Erinnerung gewuenscht ist. */
function calSyncNotify() {
  const an = document.getElementById('ceNotify').checked;
  document.getElementById('ceLeadSection').style.display = an ? '' : 'none';
}

/** Ganztaegig schaltet die Eingaben zwischen Datum und Datum-mit-Zeit um. */
function calSyncEditor(ganztags) {
  ['ceStart', 'ceEnd'].forEach(id => {
    const el = document.getElementById(id);
    const alt = el.value;
    el.type = ganztags ? 'date' : 'datetime-local';
    // Beim Wechsel den Tagesanteil retten, damit die Eingabe nicht leer wird.
    const m = /^(\d{4}-\d{2}-\d{2})/.exec(String(alt || ''));
    if (m) el.value = ganztags ? m[1] : m[1] + 'T09:00';
  });
}

/**
 * Der eingegebene Stand des Termin-Dialogs. Gebraucht, weil der Dialog beim
 * Speichern SOFORT schliesst: scheitert der Kalender hinterher, muss die
 * Eingabe zurueckkommen koennen statt verloren zu sein.
 */
function calFormularStand() {
  const wert = (id) => (document.getElementById(id) || {}).value;
  const an   = (id) => ((document.getElementById(id) || {}).checked === true);
  return {
    title: wert('ceTitle'), info: wert('ceInfo'), location: wert('ceLocation'),
    allDay: an('ceAllDay'), start: wert('ceStart'), end: wert('ceEnd'),
    annual: an('ceAnnual'), annualType: wert('ceAnnualType'), annualDate: wert('ceAnnualDate'),
    calendar: wert('ceCalendar'), notify: an('ceNotify'), lead: wert('ceLeadTime'),
    members: Array.isArray(ceAssigned) ? ceAssigned.slice() : []
  };
}

/** Gegenstueck zu calFormularStand — der Dialog muss dafuer schon offen sein. */
function calFormularSetzen(s) {
  if (!s) return;
  const setz = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  const hak  = (id, v) => { const el = document.getElementById(id); if (el) el.checked = v === true; };
  hak('ceAllDay', s.allDay);
  calSyncEditor(s.allDay);          // schaltet die Zeitfelder um, LEERT sie dabei
  setz('ceTitle', s.title); setz('ceInfo', s.info); setz('ceLocation', s.location);
  setz('ceStart', s.start); setz('ceEnd', s.end);
  hak('ceAnnual', s.annual); setz('ceAnnualType', s.annualType); setz('ceAnnualDate', s.annualDate);
  setz('ceCalendar', s.calendar);
  hak('ceNotify', s.notify); setz('ceLeadTime', s.lead);
  ceAssigned = Array.isArray(s.members) ? s.members.slice() : [];
  renderAssignList('ceAssignList', ceAssigned);
  calSyncNotify();
  calSyncAnnual();
}

function saveCalEditor() {
  if (!calCtx) return;
  const titel = document.getElementById('ceTitle').value.trim();
  if (!titel) { showToast(translate('The appointment needs a title.')); return; }
  const kalenderID = parseInt(document.getElementById('ceCalendar').value) || 0;
  const ganztags = document.getElementById('ceAllDay').checked;
  const start = document.getElementById('ceStart').value;
  const ende = document.getElementById('ceEnd').value;
  // Jahresereignis: statt Beginn und Ende zaehlt das Ursprungsdatum. Es MUSS in
  // der Vergangenheit liegen — gezaehlt werden die Jahre seither.
  const jahrestag = document.getElementById('ceAnnual').checked;
  const jahresDatum = document.getElementById('ceAnnualDate').value;
  if (jahrestag) {
    const heute = new Date(); heute.setHours(0, 0, 0, 0);
    if (!jahresDatum || new Date(jahresDatum + 'T00:00') > heute) {
      showToast(translate('The date of the annual event must be in the past.'));
      return;
    }
  } else if (!start) { showToast(translate('The appointment start is invalid.')); return; }

  // Aendern oder anlegen: derselbe Dialog, dieselben Pruefungen, nur die Aktion und
  // die Erkennungsfelder unterscheiden sich.
  const bestand = calCtx.edit;
  const ereignis = {
    title: titel, allDay: ganztags, start: start, end: ende,
    location: document.getElementById('ceLocation').value.trim(),
    info: document.getElementById('ceInfo').value.trim(),
    members: ceAssigned.slice(),
    /* Immer mitschicken, auch leer: der leere Wert nimmt einem Termin die
       Einordnung als Jahresereignis wieder ab. Fehlte das Feld, bliebe ein
       abgewaehlter Geburtstag im Kalender ein Geburtstag. */
    anniversaryType: jahrestag ? document.getElementById('ceAnnualType').value : '',
    anniversaryDate: jahrestag ? jahresDatum : '',
    // -1 = keine Erinnerung. 0 ist eine gueltige Vorlaufzeit („zum Termin").
    reminder: document.getElementById('ceNotify').checked
      ? (parseInt(document.getElementById('ceLeadTime').value) || 0) : -1
  };
  if (bestand) {
    ereignis.id = bestand.id;
    ereignis.uid = bestand.uid;
    ereignis.startTimestamp = bestand.startTimestamp;
  } else if (calCtx.recurrence) {
    // Das Gateway rechnet daraus die Einzeltermine (CalExpandSeries) und legt sie
    // der Reihe nach an. Ein Ende geht bei einer Reihe NICHT mit.
    ereignis.recurrence = calCtx.recurrence;
    delete ereignis.end;
  }

  const knopf = document.getElementById('btnCalEditSave');
  /* Reichweite VOR dem Absenden klaeren. Bei allem ausser einem Serien-Vorkommen
     antwortet die Frage sofort mit 'occurrence' und es geht ohne Blatt weiter. */
  calFrageReichweite(bestand, 'edit').then(scope => {
    if (!scope) { return; }   // weggetippt = abgebrochen
    if (bestand && bestand.recurring === true) { ereignis.scope = scope; }
    calSpeichernSenden(bestand, kalenderID, ereignis, knopf);
  });
}

/**
 * Der eigentliche Aufruf — herausgeloest, damit die Reichweitenfrage davor passt.
 *
 * Der Dialog schliesst SOFORT, ohne auf den Kalender zu warten. Der Grund ist
 * gemessen: OpenCalendar braucht fuer einen gewoehnlichen Termin 0,6 s, fuer eine
 * endlose Serie 17 s und fuer ein Jahresereignis 26 bis 28 s — die Zeit vergeht
 * vollstaendig im fremden Modul, hinter einem einzigen synchronen Aufruf. Ein
 * Dialog, der eine halbe Minute stillsteht, sieht aus wie ein Haenger.
 *
 * Der Preis: ein Fehlschlag faellt erst verspaetet auf. Deshalb wird der
 * eingegebene Stand vorher gesichert und der Dialog im Fehlerfall genau so wieder
 * aufgebaut — die Eingabe ist nie verloren, sie kommt nur spaeter zurueck.
 */
function calSpeichernSenden(bestand, kalenderID, ereignis, knopf) {
  const stand = calFormularStand();
  const ctx   = calCtx;
  const jahrestag = String(ereignis.anniversaryType || '') !== '';
  const langsam = jahrestag || !!(ereignis.recurrence) || (bestand && bestand.recurring === true);

  closeOverlay('calEditOverlay');
  calCtx = null;
  knopf.disabled = false;
  /* Beim Anlegen einer Serie oder eines Jahresereignisses ausdruecklich sagen,
     dass es dauert. „Wird gespeichert" allein liesse jemanden nach zehn Sekunden
     ein zweites Mal anlegen. */
  showToast(translate(langsam
    ? 'Saving — annual events and series take a moment in the calendar.'
    : 'Saving…'));

  const zurueck = (meldung) => {
    showToast(meldung);
    // Denselben Dialog neu aufbauen und den Stand zurueckschreiben.
    openCalEditor(ctx && ctx.draft, ctx && ctx.proposal, ctx && ctx.original);
    calFormularSetzen(stand);
  };

  aiPost('/calendar', {
    action: bestand ? 'update' : 'create',
    calendarID: bestand ? bestand.calendarID : kalenderID,
    event: ereignis
  }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true) {
      // Der Anbieter kann ablehnen (Rechte, ungueltiger Zeitraum).
      zurueck((j && j.error && j.error.message) || translate('The calendar rejected the appointment.'));
      return;
    }
    if (!bestand) {
      ls.set('symdo.calWrite', String(kalenderID));
      if (calCtx && calCtx.proposal) {
        aiPost('/mail/proposals', { action: 'taken', id: calCtx.proposal.id, i: Number(calCtx.proposal.i) });
        mailForget(calCtx.proposal.id, calCtx.proposal.i);
      }
    }
    // Bei einer Reihe zaehlt die Rueckmeldung: 15 Termine sind ein anderes Ergebnis
    // als einer. Blieb es bei einem Teil, sagt der Hinweis das ausdruecklich — sonst
    // haette niemand Anlass, im Kalender nachzuzaehlen.
    const angelegt = parseInt(j.created) || 0;
    if (j.partial) {
      showToast(translate('Only %1 of %2 appointments were created.')
        .replace('%1', String(angelegt)).replace('%2', String(parseInt(j.planned) || angelegt)));
    } else if (j.capped) {
      // Nur-bis-Reihe am 60er-Deckel gekappt: alles Geplante ist da, aber das
      // Bis-Datum haette mehr ergeben — das gehoert gesagt.
      showToast(translate('The series was capped at %1 appointments.').replace('%1', String(parseInt(j.capped) || 0)));
    } else if (j.series === true) {
      // Eine echte Serie ist EIN Eintrag im Kalender, kein Stapel Einzeltermine —
      // „1 Termin hinzugefuegt" waere die falsche Auskunft.
      showToast(translate('Series created'));
    } else if (angelegt > 1) {
      showToast(translate('%1 appointments added').replace('%1', String(angelegt)));
    } else {
      showToast(translate(bestand ? 'Appointment updated' : 'Appointment added'));
    }
    // Der neue Stand kommt erst nach dem naechsten Abruf aus OpenCalendar.
    calEvents = [];
    loadCalendarEvents();
    // Die Uebersicht zeigt dieselben Termine — ohne das stuende dort bis zum
    // naechsten Kalenderabruf der alte Stand.
    loadDashEvents();
  }).catch(() => {
    /* Netzfehler: derselbe Weg wie eine Ablehnung. Der Kalender KANN den Termin
       trotzdem angelegt haben — deshalb sagt der Text nicht, dass nichts
       passiert ist. */
    zurueck(translate('Could not reach the calendar. Please check whether the appointment was created.'));
  });
}

function renderTodos() {
  const vis = visibleInstances('todo');
  const id = selectedTodoID();
  const st = id ? instState(id) : null;
  updateSwitcher('todoSwitcher', 'todoTitle', vis, id, 'symdo.selectedTodoID');

  const area = document.getElementById('todoListArea');
  if (!st) {
    renderInto(area, `<div class="empty-state"><i class="fa-light fa-list-check"></i>${translate('No ToDo list found')}${noInstanceHint('todo')}</div>`);
    return;
  }
  const sortMode = String(st.sortMode || 'created');
  const sortDir = String(st.sortDir || 'asc');
  // Abzeichen der Aufgabenzeile: fuenf gleichrangige Schalter, kein Hauptschalter
  // mehr. Opt-out — fehlt ein Schluessel, ist das Abzeichen an.
  const badges = {
    quantity:     st.showQuantityBadge !== false,
    recurrence:   st.showRecurrenceBadge !== false,
    due:          st.showDueBadge !== false,
    notification: st.showNotificationBadge !== false,
    priority:     st.showPriorityBadge !== false,
  };
  // Anlegen und Sortieren sind je Liste abschaltbar (opt-out). Die Eingabezeile ist
  // der eine Weg zum Anlegen, der Menueeintrag "mit Details" der andere — beide
  // haengen am selben Schalter, sonst waere "Erstellen aus" nur halb wirksam.
  const showCreate = st.showCreateButton !== false;
  const showSorting = st.showSorting !== false;
  const inputbar = document.getElementById('todoInputbar');
  if (inputbar) {
    inputbar.style.display = showCreate ? '' : 'none';
    // Die Zeile ist fixiert, ihr Platz wird per Scroll-Polster freigehalten (Regel
    // `html .screen:has(.inputbar)`). Ist sie aus, muss das Polster mit weg — sonst
    // bliebe unten eine leere Flaeche in Zeilenhoehe stehen.
    const bereich = document.getElementById('screen-todos');
    if (bereich) { bereich.classList.toggle('bar-hidden', !showCreate); }
  }
  // Der "..."-Knopf ist der Sortier-Knopf: ohne Sortierung verschwindet er, auch
  // wenn Anlegen an ist. Angelegt wird dann ueber die Eingabezeile; der Weg
  // "Neue Aufgabe mit Details" ueber das Menue entfaellt damit bewusst.
  const menuBtn = document.getElementById('btnTodoMenu');
  if (menuBtn) menuBtn.style.display = showSorting ? '' : 'none';
  // Member-Filter (Vereinigung): nur Aufgaben mit mindestens einem gewählten Mitglied.
  // Ist die Leiste dieser Liste aus, filtert der Tab nicht — die Auswahl waere
  // unsichtbar. Geloescht wird sie aber nicht mehr: sie ist bereichsuebergreifend
  // und gehoert auch der Uebersicht und dem Kalender.
  let items = st.items || [];
  const todoFilter = st.showMemberBar === false ? new Set() : memberFilterIds;
  if (todoFilter.size > 0) {
    items = items.filter(it => Array.isArray(it.assignedTo) && it.assignedTo.some(mid => todoFilter.has(mid)));
  }
  // Uebersicht: Zahlen aus denselben Aufgaben, die die Liste zeigt. classifyDue
  // ist dieselbe Einstufung wie bei den Faelligkeits-Marken der Zeilen.
  const stats = document.getElementById('todoStats');
  if (stats) {
    if (st.showOverview !== false) {
      const offen = items.filter(i => !i.done);
      document.getElementById('statOpenLabel').textContent = translate('Open Tasks');
      document.getElementById('statOverdueLabel').textContent = translate('Overdue');
      document.getElementById('statTodayLabel').textContent = translate('Due today');
      document.getElementById('statOpenValue').textContent = String(offen.length);
      document.getElementById('statOverdueValue').textContent =
        String(offen.filter(i => classifyDue(i) === 'overdue').length);
      document.getElementById('statTodayValue').textContent =
        String(offen.filter(i => classifyDue(i) === 'today').length);
      stats.style.display = '';
    } else {
      stats.style.display = 'none';
    }
  }
  const sorted = sortTodoItems(items, sortMode, sortDir);
  const open = sorted.filter(i => !i.done);
  const done = sorted.filter(i => i.done);
  // Bei aktivem Filter kein Drag-Reorder — sonst würde ein Reorder der
  // gefilterten Teilmenge die Gesamtreihenfolge verfälschen.
  // Der Griff ist zudem je Liste abschaltbar; mit ihm faellt auch das Ziehen weg,
  // denn er IST die Anfassstelle der Geste.
  const canReorder = sortMode === 'manual' && todoFilter.size === 0
    && st.showReorderHandle !== false;
  const showEdit = st.showEditButton === true;
  const showDelete = st.showDeleteButton === true;

  // Member-Menü: eigenständige sticky Pille ganz oben (vor dem Header), wie im
  // Dashboard. Wird in den statischen #todoMembers-Container gerendert, damit
  // sein sticky-Bezug .content (die volle Höhe) ist und es dauerhaft pinnt.
  renderTodoMembers();
