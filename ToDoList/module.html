<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <script src="/icons.js"></script>
  <style>
:root {
  --bg:      var(--card-color);
  --card:    var(--card-color);
  --text:    var(--content-color);
  --muted:   color-mix(in srgb, var(--content-color) 45%, transparent);
  --faint:   color-mix(in srgb, var(--content-color) 30%, transparent);
  --surface: color-mix(in srgb, var(--content-color) 7%, transparent);
  --surface2:color-mix(in srgb, var(--content-color) 12%, transparent);
  /* Deckende Zeilenfläche: liegt über dem roten Wisch-Hintergrund, darf NICHT
     durchscheinen (color-mix zweier deckender Farben bleibt deckend) */
  --row:     color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  /* Aufgabenzeilen etwas heller als die uebrigen Zeilen (Wunsch vom 20.08.2026):
     Auf der Uebersicht liegen sie IN einer Karte, und mit --row (8 % Inhaltston)
     standen Karte und Zeile fast auf demselben Ton. Deckend wie --row, denn hinter
     der Zeile liegt der rote Wisch-Untergrund. */
  --row-task: color-mix(in srgb, var(--card-color) 88%, var(--content-color) 12%);
  --border:  color-mix(in srgb, var(--content-color) 14%, transparent);
  --accent:  var(--accent-color);
  --red:     #ff4d4d;
  --orange:  #ff9500;
  --green:   #34c759;
  --radius:  14px;
  --gap:     12px;
  --nav-h:   68px;
  /* Inhaltsbreite. Die beiden Haltepunkte weiter unten heben sie an; alles andere
     rechnet gegen diese Variable, damit der Deckel nur an EINER Stelle steht.
     --bar-max wächst absichtlich NICHT mit: Tableiste und Eingabezeile sollen auf
     breiten Schirmen schmal und mittig bleiben (0,9 × 720 = die heutige Breite). */
  --content-max: 720px;
  --bar-max:     calc(720px * 0.9);
  /* Vom System vorgegebene Kachel-Ränder (aus den URL-Parametern margintop/
     marginside/marginbottom, per JS gesetzt). Default 0, damit Vollbild ohne
     Ränder korrekt bleibt. */
  --sym-mt:  0px;
  --sym-ms:  0px;
  --sym-mb:  0px;
  --sbw:     6px;   /* Scrollbalken-Breite (muss ::-webkit-scrollbar width entsprechen) */
  /* Rechter Innenabstand, der den Scrollbalken mittig ins rechte Body-Padding
     legt: Scrollbereich endet um (marginside - Balken)/2 vor der Kante, der
     Balken (Breite --sbw) sitzt dann zentriert im marginside-Streifen. */
  --sb-pad:  max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
/* Kein Antipp-Schleier von WebKit. Der Standardwert rgba(0,0,0,0.18) legt beim
   Beruehren ein halbtransparentes schwarzes RECHTECK ueber das Element — bei den
   runden Knoepfen und dem Vorschlags-Chip schauen dabei an den Ecken graue
   Flaechen heraus (gemessen am Klapp-Chip: sah wie ein Hover-Effekt aus, war
   aber die Beruehrung). Die Oberflaeche gibt ihre Rueckmeldung selbst — ueber
   :active-Regeln und die Animationen. Vererbt sich auf alle Elemente. */
html { -webkit-tap-highlight-color: transparent; }

body {
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  background: transparent;
  overflow: hidden;
  /* Eventuelles vom System gesetztes Body-Padding neutralisieren — die Ränder
     werden deterministisch selbst über --sym-* angewandt (kein doppelter Rand) */
  padding: 0 !important;
  margin: 0 !important;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea {
  font: inherit; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 12px;
  outline: none;
  width: 100%;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
select option { color: #111; background: #fff; }
/* Notizen im Todo-Editor wachsen automatisch mit dem Text (kein Scrollbalken/Griff) */
#tdInfo { resize: none; overflow: hidden; min-height: 54px; }

/* height:100% + eigenes System-Rand-Padding oben/seitlich, damit der Inhalt
   nicht unter die vom System überlagerten Kachel-Steuerelemente rutscht.
   Unten kein Rand: die Tab-Leiste sitzt an der Kachel-Unterkante. */
.app {
  height: 100%;
  display: flex;
  flex-direction: column;
  /* Rechts nur --sb-pad statt marginside, damit der Scrollbereich in den
     rechten Rand hineinreicht und der Scrollbalken mittig darin liegt. Der
     fehlende Rest des Inhaltsabstands sitzt als padding-right auf .screen. */
  padding: var(--sym-mt) var(--sb-pad) 0 var(--sym-ms);
}

/* Sprechblase mit rotem Ausrufezeichen, sobald ein Hinweis hinterlegt ist */
.hint-btn { position: relative; }
.hint-badge {
  position: absolute; top: -2px; right: -2px;
  min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 999px; background: #ff3b30; color: #fff;
  font-size: 11px; font-weight: 700; line-height: 16px; text-align: center;
  pointer-events: none;
}
.hint-badge[hidden] { display: none; }
#hintInput {
  width: 100%; min-height: 96px; resize: vertical;
  font: inherit; line-height: 1.4;
}
.hint-note { margin-top: 8px; font-size: 12px; opacity: .6; }
#btnHintDelete.destructive { color: #ff453a; }

/* Laufleiste der Einkaufs-Ansage: sitzt zwischen Kopfzeile und Liste und
   bleibt beim Scrollen oben stehen — man soll jederzeit sehen, wo man ist. */
.ansage-leiste {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 10px; padding: 10px 12px; border-radius: 12px;
  background: var(--glass-bg); backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
.ansage-leiste[hidden] { display: none; }
.ansage-symbol {
  color: var(--accent-color); font-size: 17px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center; width: 22px;
}
/* Ohne Tag-Namen und mit !important: icons.js macht aus den <i> echte <svg>,
   und Font Awesomes eigene Regel svg.svg-inline--fa { display: inline-block }
   schlaegt sonst das hidden-Attribut — dann standen alle Varianten uebereinander. */
.ansage-symbol [hidden], .ansage-btn [hidden] { display: none !important; }
.ansage-symbol.pausiert { opacity: .45; }
.ansage-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
#ansageArtikel {
  font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#ansageFortschritt { font-size: 12px; opacity: .6; }
/* Die Wiedergabe-Knoepfe ruecken eng zusammen; der Abstand der Leiste (gap: 10px)
   gilt weiter zwischen Symbol, Text und dieser Gruppe. Die Knopfflaeche bleibt
   unveraendert — enger heisst hier weniger Luft dazwischen, nicht kleinere Ziele. */
.ansage-aktionen { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.ansage-btn {
  flex: 0 0 auto; width: 34px; height: 34px; border: 0; border-radius: 999px;
  background: color-mix(in srgb, var(--content-color) 12%, transparent);
  color: var(--content-color); font-size: 14px; cursor: pointer;
}
.ansage-btn:disabled { opacity: .3; }
/* Der gerade angesagte Artikel in der Liste */
.item-card.ansage-aktiv, .todo-card.ansage-aktiv {
  outline: 2px solid var(--accent-color); outline-offset: -2px;
}

.screen {
  flex: 1;
  min-height: 0;
  /* overflow-y: scroll (statt auto): der 6px-Scrollstreifen ist IMMER
     reserviert — so ist der rechte Abstand mit und ohne sichtbaren Balken
     gleich (leerer Track ist transparent, der Thumb erscheint nur bei Bedarf).
     KEIN scrollbar-gutter zusätzlich — das würde doppelt reservieren. */
  overflow-y: scroll;
  overscroll-behavior: contain;
  display: none;
  /* Vertikaler Gutter; rechts --sb-pad, damit der Inhalt trotz des nach rechts
     verschobenen Scrollbereichs bündig bei marginside endet (linker Abstand
     kommt aus .app padding-left = marginside). */
  padding: 12px var(--sb-pad) 12px 0;
}
.screen::-webkit-scrollbar { width: 6px; height: 6px; }
.screen::-webkit-scrollbar-track { background: transparent; }
.screen::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}
/* scrollbar-color/-width und ::-webkit-scrollbar schliessen sich gegenseitig aus:
   ist der Standard gesetzt, ignoriert WebKit die Pseudoelemente (gemessen: 11px
   statt der vorgesehenen 6px, und die transparente Spur greift nicht — in Safari
   wird sie dann hell gemalt und ist wegen overflow-y: scroll immer zu sehen).
   Deshalb bekommt WebKit die Pseudoelemente und der Standard gilt nur dort, wo es
   sie nicht gibt. */
@supports not selector(::-webkit-scrollbar) {
  .screen {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
  }
}
.screen.active { display: block; }
.content { max-width: var(--content-max); margin: 0 auto; }

/* ── Bottom-Tab-Bar (im Flex-Fluss, damit scrollbarer Inhalt nicht dahinter
      verschwindet — sie ist immer die unterste Zeile unter dem Scrollbereich).
      Full-Bleed: 100% der KACHELBREITE. margin-left hebt exakt das linke
      .app-Padding (marginside) auf → linke Kante bei 0; width:100vw erreicht die
      rechte Kante. (Kein 50%-50vw-Trick, weil .app-Padding asymmetrisch ist –
      links marginside, rechts nur der schmale Scrollbalken-Rand.) ── */
.tabbar {
  flex: none;
  height: var(--nav-h);
  width: 100vw;
  margin-left: calc(-1 * var(--sym-ms));
  display: flex;
  padding: 8px 16px;
  background: color-mix(in srgb, var(--card-color) 88%, var(--content-color) 4%);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(10px);
  z-index: 40;
}
.tabbar button {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 10px;
  color: var(--muted);
  padding-top: 4px;
}
/* /icons.js (Font Awesome SVG+JS) ersetzt <i> durch <svg class="svg-inline--fa">
   mit height:1em → deshalb MUSS die Icon-Größe auch das <svg> treffen, sonst
   erbt es nur die Button-Schriftgröße (Label) und wächst nicht mit. */
.tabbar button i,
.tabbar button svg { font-size: 25px; }
.tabbar button.active { color: var(--accent); }
/* Zaehler offener Mail-Vorschlaege. Der Knopf braucht dafuer position:relative —
   ohne das saesse das Abzeichen an der Leiste, nicht am Symbol. */
.tabbar button { position: relative; }
.tab-badge {
  position: absolute;
  top: 2px;
  left: 50%;
  margin-left: 4px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: #d92d20;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}

/* ── Schwebende, runde Tab-Leiste (Web-App UND Visu-Kachel) ─────────────────
   Nachbau der iOS-26-Optik: die App selbst hat dafür keinen Code, das ist dort
   das native Liquid-Glass-TabView.

   Die Leiste verlässt damit den Flex-Fluss, der sie bisher davor bewahrt hat,
   Inhalt zu überdecken (siehe Kommentar oben). Der Platz wird deshalb explizit
   freigehalten: --tab-clear ist die Höhe plus beide Abstände und wird vom
   Scroll-Polster der .screen, vom Hintergrund der Eingabezeile und von .toast
   genutzt. In der Kachel kostet der Schwebe-Abstand entsprechend Inhaltshöhe —
   bei flach eingestellten Kacheln ist das spürbar.

   Der html-Präfix ist kein Zufall: die Basisregeln für .inputbar, .composer und
   .toast stehen WEITER UNTEN in dieser Datei. Ohne den Präfix wären die
   Spezifitäten gleich und die späteren Basisregeln würden gewinnen. */
html {
  --tab-gap:   10px;
  /* --sym-mb MUSS mit hinein: die Leiste sitzt bei bottom: --tab-gap + --sym-mb,
     rückt mit einem Kachel-Randmaß also nach oben. Ohne diesen Summanden blieb das
     Polster gleich und die Leiste wanderte in die Eingabezeile — bei
     marginbottom=24 gemessen: Eingabefeld 12px HINTER der Leiste. Mit dem
     Summanden bleibt der Abstand zwischen Zeile und Leiste konstant --tab-gap,
     unabhängig vom eingestellten Rand. */
  --tab-clear: calc(var(--nav-h) + var(--tab-gap) * 2 + var(--sym-mb));
  /* Luft zwischen Eingabezeile und Leiste, zusätzlich zu --tab-gap. Ohne das lag
     das Eingabefeld nur 12px über der Kapsel und wirkte angeklebt — die Leiste
     selbst hat 10px zum Fensterrand. */
  --input-gap: 12px;
  /* Vorschlagsfenster (aus der Einkaufslisten-Kachel uebernommen): Unterkante fest
     50px ueber der Eingabezeile, Hoehe nach Inhalt, oben mindestens 80px frei.
     --sug-bottom rechnet vom Fensterboden hoch: Tab-Leiste, deren Abstand, die Luft
     zur Eingabezeile und die Zeile selbst. */
  --sug-gap:    50px;
  --sug-top:    80px;
  --input-h:    42px;
  /* Der letzte Summand vor --sug-gap ist das UNTERE Innenmass der Eingabezeile, und
     das ist calc(2px + --input-gap) und nicht --input-gap allein (Regel html .inputbar).
     Mit dem falschen Term lag das Fenster 48px statt 50px ueber dem Feld — gemessen. */
  --sug-bottom: calc(var(--nav-h) + var(--tab-gap) * 2 + var(--sym-mb) + 2px + var(--input-gap) + var(--input-h) + var(--sug-gap));
  /* Leiste und Eingabezeile 10 % schmaler als der Inhalt. Beide Werte sind die HALBE
     Ersparnis, weil sie links und rechts gleichzeitig anliegen und die Elemente
     mittig bleiben sollen.
     Zwei verschiedene Größen, weil die Bezugsgrößen verschieden sind: die Leiste ist
     fixiert, dort zählen nur Fensterkoordinaten — die Inhaltsbreite muss aus 100vw
     minus der Einrückungen gerechnet werden. Die Eingabezeile steht im Inhaltsblock,
     dort ist ein Prozentwert bereits auf dessen Breite bezogen. */
  --tab-narrow:   calc((100vw - var(--sym-ms) - var(--sb-pad) * 2 - var(--sbw)) * 0.05);
  --input-narrow: 5%;
  /* Glas-Optik an EINER Stelle: Leiste und Eingabezeile müssen denselben Wert
     benutzen, sonst driften Transparenz und Weichzeichnung beim nächsten
     Nachjustieren auseinander. */
  --glass-bg:   color-mix(in srgb, var(--card-color) 35%, transparent);
  /* 14.4px = 18px minus 20 %. Der Wert steht an EINER Stelle, deshalb gilt die
     Absenkung für alle Glasflächen zugleich: Leiste, Eingabefeld, Vorschläge. */
  --glass-blur: blur(14.4px) saturate(180%);
}
html .tabbar {
  position: fixed;
  /* Genau so breit wie der übrige Inhalt (Karten, Eingabefeld samt Knöpfen). Weil
     die Leiste fixiert ist, zählen die Einrückungen der Vorfahren nicht mehr — die
     Inhaltskanten müssen in Fensterkoordinaten nachgebaut werden:
       links  --sym-ms                 (padding-left der .app, .screen hat links 0)
       rechts --sb-pad * 2 + --sbw     (--sb-pad liegt ZWEIMAL an: einmal .app,
                                        einmal .screen — plus der dauerhaft
                                        reservierte Scrollstreifen)
     Der doppelte --sb-pad ist der Kern: die Variable ist als (--sym-ms - --sbw) / 2
     definiert, damit die Summe genau --sym-ms ergibt und der Inhalt trotz des nach
     rechts verschobenen Scrollbereichs mittig sitzt. Mit nur einem --sb-pad saß die
     Leiste 3,3px zu weit rechts (gemessen bei 1000px Fensterbreite, marginside 24)
     — richtige Breite, falsche Mitte.
     max-width plus beidseitiges margin: auto zentriert die Leiste in diesem Kasten
     und deckelt sie bei denselben 720px wie .content. Über left/right allein ginge
     das nicht: die Kanten stimmten, auf breiten Fenstern liefe die Leiste aber
     weiter als der Inhalt.

     Davon dann 10 % ab: --tab-narrow ist die halbe Ersparnis und wandert auf BEIDE
     Einrückungen, damit die Leiste mittig bleibt. Der Deckel muss mit (0.9 * 720px),
     sonst bliebe sie auf breiten Fenstern bei voller Inhaltsbreite stehen — dort
     begrenzt max-width, nicht left/right. --input-narrow hält die Eingabezeile auf
     demselben Maß (Prozent des Inhaltsblocks, siehe html .inputbar). */
  left: calc(var(--sym-ms) + var(--tab-narrow));
  right: calc(var(--sb-pad) * 2 + var(--sbw) + var(--tab-narrow));
  bottom: calc(var(--tab-gap) + var(--sym-mb));
  width: auto;
  /* --bar-max, NICHT --content-max: die Leiste bleibt auf breiten Schirmen schmal
     (siehe :root). Sonst stünde sie dort in voller Inhaltsbreite. */
  max-width: var(--bar-max);
  margin-left: auto;
  margin-right: auto;
  border: 1px solid var(--border);
  border-radius: 999px;
  /* Eigene Glasschicht. Sie stammte vorher aus einem Band am unteren Fensterrand,
     das gleichzeitig die Eingabezeile hinterlegte — deshalb musste der Blur hier
     abgeschaltet sein, sonst lag er doppelt (gemessen: ~80 % Deckkraft statt 55 %).
     Seit die Eingabezeile keinen Flächenhintergrund mehr hat, ist das Band weg und
     die Leiste bringt ihr Glas wieder selbst mit: eine Schicht, in jedem Tab. */
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  box-shadow: 0 6px 24px rgba(0, 0, 0, .18), 0 1px 2px rgba(0, 0, 0, .10);
}
/* Scrollbereich: Polster in Höhe der Leiste, damit die letzte Zeile erreichbar
   bleibt und nicht dauerhaft darunter liegt. */
/* Bleibt nur ein Bereich übrig, wäre die Leiste ein Knopf ohne Wahl. Dann fällt sie
   weg — und mit ihr das Bodenpolster, sonst bliebe unten eine leere Fläche in
   Leistenhöhe stehen. --tab-clear steuert auch Eingabezeile und Meldungen mit. */
html.no-tabs { --tab-clear: 0px; }
html.no-tabs .tabbar { display: none; }
html .screen {
  padding-bottom: var(--tab-clear);
  /* Waagerechtes Scrollen unterbinden. Der konkrete Auslöser (width: 100% plus
     Seitenränder am .section-toggle) ist behoben, aber overflow-x stand auf auto:
     schon ein einzelnes zu breites Element genügte, um die ganze Liste seitlich
     verschiebbar zu machen. Als Riegel, damit das nicht wiederkommt. Wischgesten
     verschieben Karten per transform — die werden dadurch am Rand beschnitten,
     was gewollt ist, statt eine Scrollbewegung auszulösen. */
  overflow-x: hidden;
}
/* Die Eingabezeile braucht KEINEN eigenen Versatz: ein sticky-bottom misst vom
   unteren Rand des Content-Bereichs, das Polster liegt also schon darunter. Ein
   zusätzliches bottom: var(--tab-clear) zählte den Abstand doppelt und riss eine
   Lücke von einer Leistenhöhe zwischen Eingabe und Leiste (gemessen). */

/* Die Eingabezeile ist eine reine Trägerfläche OHNE eigenen Hintergrund: Glas hat
   nur noch das Eingabefeld selbst (Regel weiter unten) und die runden Knöpfe. Der
   Listeninhalt scrollt damit sichtbar an der Zeile vorbei und wird nur hinter dem
   Feld weichgezeichnet.
   background: none ist Pflicht, kein Aufräumen: die Basisregel .inputbar setzt einen
   Verlauf aus --card-color: ohne ausdrückliches Abschalten bliebe der wirksam. */
html .inputbar {
  background: none;
  /* 10 % schmaler, mittig — dasselbe Maß wie die Tab-Leiste. Prozent im Rand bezieht
     sich auf die Breite des Inhaltsblocks, also genau auf die Kartenbreite. */
  margin-left: var(--input-narrow);
  margin-right: var(--input-narrow);
  /* Oben 24px, damit die letzte Karte nicht am Feld klebt; unten 2px Grundmaß plus
     --input-gap. Der Kasten ist am unteren Rand des Inhaltsbereichs festgeklemmt,
     das Innenmaß hebt daher das Eingabefeld an, ohne die Leiste oder das
     Scroll-Polster zu verschieben.
     Die Seitenwerte sind 0: die randlose Geometrie (negative Ränder bis an die
     Fensterkanten, per Innenabstand wieder ausgeglichen) trug ausschließlich den
     Flächenhintergrund. Ohne den ist sie zwecklos. */
  padding: 24px 0 calc(2px + var(--input-gap));
  /* Über dem scrollenden Inhalt: die Liste läuft jetzt sichtbar hinter der Zeile
     durch, Feld und Knöpfe müssen davor liegen und bedienbar bleiben. */
  z-index: 5;
}
/* Der 12px-Streifen der Basisregel bleibt aus: er ist deckend in --card-color und
   wäre genau der Flächenhintergrund, der hier nicht mehr sein soll. */
html .inputbar::after { content: none; }

/* Das fixierte Band am unteren Fensterrand ist entfallen. Es hatte den Hintergrund
   der Eingabezeile bis zur Fensterkante verlängert UND der Tab-Leiste ihr Glas
   geliefert — beides ist mit dem Flächenhintergrund weggefallen, die Leiste bringt
   ihren Blur seither selbst mit (siehe html .tabbar). */

/* Glas jetzt auf dem Eingabefeld selbst. Es kommt aus der allgemeinen Feldregel mit
   deckendem --surface; hier dieselbe Tönung und Weichzeichnung wie bei der Leiste,
   damit Feld und Kapsel als eine Materialfamilie lesbar bleiben. Rahmen bleibt: bei
   35 % Tönung ist die Feldkante sonst kaum auszumachen. */
html .inputbar input {
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
/* Die durchlässigen Knöpfe der Eingabezeile brauchen dieselbe Weichzeichnung wie
   Feld und Leiste. Solange die Zeile eine Glasfläche hatte, fiel das nicht auf — sie
   lag darauf. Ohne Trägerfläche scheint der Listeninhalt ungefiltert durch.
   Wirksam ist derzeit nur der abgeblendete Hinzufügen-Knopf: .secondary steht zwar
   auf --surface (nur 7 % Deckkraft), kommt im Markup aber NICHT vor — die Regel ist
   Vorsorge, damit ein später ergänzter Sekundärknopf nicht ohne Filter dasteht. */
html .inputbar .round-btn.secondary,
html .inputbar .round-btn:disabled {
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
}
/* Beim abgeblendeten Knopf muss die Dämpfung von opacity auf die Farbe umziehen,
   sonst bleibt die Weichzeichnung wirkungslos: opacity dämpft das FERTIGE Element
   samt seiner gefilterten Rückseite und blendet es über den UNGEFILTERTEN Hintergrund
   — bei .4 blieben 60 % scharfer Inhalt sichtbar. Mit voller Deckkraft und
   durchlässiger Farbe wirkt der Filter vollständig, die Dämpfung bleibt gleich. */
html .inputbar .round-btn:disabled {
  opacity: 1;
  background: color-mix(in srgb, var(--accent) 40%, transparent);
  color: color-mix(in srgb, #fff 55%, transparent);
}
html .toast { bottom: calc(var(--tab-clear) + 14px); }

/* ── Screen-Header ─────────────────────────────────────────────────────────── */
.screen-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.screen-head h2 { font-size: 22px; font-weight: 800; flex: 1; min-width: 0; }
.screen-head select.list-switcher {
  width: auto;
  max-width: 70%;
  font-weight: 700;
  font-size: 16px;
  background: transparent;
  border: none;
  padding: 4px 2px;
  /* Inhaltsbreit (nicht flex:1) → der native Dropdown-Pfeil sitzt direkt
     hinter dem Namen statt weit rechts. */
  flex: 0 1 auto;
}
/* Letzter Icon-Button der Kopfzeile (z. B. das „…"-Menü) ganz nach rechts. */
.screen-head .icon-btn:last-child { margin-left: auto; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: 16px;
  flex: none;
}
.icon-btn:active { border-color: var(--accent); }

/* ── Karten ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: var(--gap);
}
.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}
.card-head h3 { font-size: 16px; font-weight: 700; }
.card-head .link { color: var(--accent); font-size: 14px; font-weight: 600; }

/* ── Dashboard ─────────────────────────────────────────────────────────────── */
/* Tagesbriefing: Ueberschrift mit Vorlese-Knopf, darunter der Fliesstext. Auf
   schmalen Anzeigen nur vier Zeilen mit Aufklapper — auf einem Telefon schiebt ein
   langes Briefing sonst alles andere unter den Rand. Ab 820px (dieselbe Schwelle
   wie das Dashboard-Raster) steht es ganz da. */
.briefing-card .card-head { margin-bottom: 6px; }
.briefing-text { font-size: 15px; line-height: 1.45; }
.briefing-text.gekappt {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* Der Aufklapper sitzt unter dem Text und rechts — dort, wo der Blick nach der
   letzten Zeile ohnehin ankommt. Weg ist er ueber [hidden]: Das setzt
   briefingKlappHinweis(), wenn der Text ohnehin ganz hineinpasst. */
.briefing-mehr {
  display: block;
  margin: 8px 0 0 auto;
  padding: 4px 2px;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.briefing-mehr[hidden] { display: none; }
.briefing-mehr i { margin-left: 6px; font-size: 12px; }
/* Vorlesen: der Knopf sitzt rechts in der Kopfzeile, auf Hoehe der Ueberschrift. */
.briefing-play {
  flex: 0 0 auto;
  align-self: center;
  width: 34px; height: 34px;
  margin: -4px -4px -4px 4px;
  border: 0; border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.briefing-play:disabled { opacity: .5; cursor: default; }
.briefing-play.laeuft { background: color-mix(in srgb, var(--accent) 26%, transparent); }
/* Kopfzeile der Uebersicht: Datum links, Glocke daneben. Eigener Kasten, weil das
   Datum selbst auf schmalen Anzeigen zwei Zeilen fuellt — die Glocke soll daneben
   stehen und nicht als dritte Zeile darunter. */
.dash-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
/* Die Glocke sitzt links neben dem Datum und nicht rechts: Rechts liegt die
   sticky Mitglieder-Leiste, die per margin-bottom: -44px auf diese Zeile gezogen
   wird. */
.dash-bell {
  flex: 0 0 auto;
  width: 34px; height: 34px;
  border: 0; border-radius: 50%;
  background: color-mix(in srgb, var(--content-color) 8%, transparent);
  color: var(--muted);
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.dash-bell.an {
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  color: var(--accent);
}
.dash-bell:disabled { opacity: .5; cursor: default; }

/* Datum: auf schmalen Anzeigen ZWEI Zeilen (Wochentag, darunter der Tag) — daneben
   liegt die sticky Avatar-Leiste, die dem Datum die Breite nimmt. Beide Zeilen
   bleiben in denselben 44 px hoch wie zuvor die eine, damit die Avatare weiter auf
   der Zeile sitzen (sie werden per margin-bottom: -44px daraufgezogen) und darunter
   nichts verrutscht. Ab 820 px steht es wieder in einer Zeile, dann mit Komma. */
.dash-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .4px;
  line-height: 1.25;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
}
/* Avatar-Menü: nur DIESES ist sticky (oben rechts), mit halbtransparentem
   Pillen-Hintergrund. Das Datum scrollt normal weiter. Rechtsbündig via
   margin-left:auto + fit-content; negatives margin-bottom zieht das folgende
   Datum auf dieselbe Zeile. */
.member-bar {
  display: flex;
  /* --mc (0..1): 0 = oben/ausgeklappt, 1 = voll eingeklappt. Wird per rAF aus
     scrollTop geschrieben und treibt gap/Überlappung/Ring/Scale STUFENLOS →
     die Avatare gleiten frame-genau mit dem Finger zusammen (siehe JS). */
  --mc: 0;
  gap: calc(6px - 6px * var(--mc));
  position: sticky;
  top: 0px;
  z-index: 20;
  width: fit-content;
  margin-left: auto;
  margin-bottom: -44px;
  padding: 4px 6px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--card-color) 50%, transparent);
}
/* Im Hellmodus ist die halbtransparente Kartenfarbe auf weißem Grund kaum
   sichtbar → dezent grau tönen (Transparenz bleibt erhalten), damit die
   Member-Pille abgesetzt ist. */
html[data-symdo-theme="light"] .member-bar {
  background: color-mix(in srgb, color-mix(in srgb, var(--content-color) 14%, var(--card-color)) 55%, transparent);
}
/* Im Dunkelmodus etwas dunkler als die reine Kartenfarbe (Transparenz bleibt). */
html[data-symdo-theme="dark"] .member-bar {
  background: color-mix(in srgb, color-mix(in srgb, #000 22%, var(--card-color)) 55%, transparent);
}
/* Im ToDo-Tab gibt es kein Datum, das hochgezogen werden muss → normaler
   Abstand nach unten statt des negativen Zugs. */
/* Eigenständige Pille über der Liste — im ToDo- wie im Kalender-Tab dasselbe Maß. */
.member-bar.todo-members,
.member-bar.cal-members { margin-bottom: 10px; }
/* Klasse .collapsed steuert nur noch Cursor + Tap-Routing; das Aussehen kommt
   stufenlos aus --mc. Kein CSS-Übergang auf den gekoppelten Props → der Scroll
   treibt sie direkt (kein Nachziehen). Das Aufklappen federt JS über --mc. */
.member-bar.collapsed { cursor: pointer; }
.member-bar .avatar-btn {
  width: 36px; height: 36px;
  border-radius: 999px;
  padding: 0;
  position: relative;
  opacity: 1;
  flex: none;
  transition: opacity .15s ease;               /* nur Selektions-Dimmen animiert */
  box-shadow: 0 0 0 max(0px, calc(2px * var(--mc))) var(--card-color);
  transform: scale(calc(1 - 0.05 * var(--mc)));
  transform-origin: center;
}
/* Eingeklappt: hintere Avatare schieben sich über die vorderen (~1/3 sichtbar). */
.member-bar .avatar-btn:not(:first-child) {
  margin-left: calc(-24px * var(--mc));
}
/* Maus: Hover fächert die eingeklappte Leiste federnd + gestaffelt auf. Der
   Übergang liegt NUR auf :hover → beim Verlassen sofortiges Zurückkoppeln an
   --mc (kein Nachziehen beim Wheel-Scroll). Rein CSS. */
@media (hover: hover) {
  .member-bar.collapsed:hover {
    gap: 6px;
    transition: gap .34s cubic-bezier(.34, 1.4, .64, 1);
  }
  .member-bar.collapsed:hover .avatar-btn {
    box-shadow: none;
    transform: none;
    transition:
      opacity .15s ease,
      box-shadow .28s ease var(--mb-d, 0ms),
      transform .34s cubic-bezier(.34, 1.4, .64, 1) var(--mb-d, 0ms),
      margin-left .34s cubic-bezier(.34, 1.4, .64, 1) var(--mb-d, 0ms);
  }
  .member-bar.collapsed:hover .avatar-btn:not(:first-child) { margin-left: 0; }
  /* Subtiler Stagger: vordere Avatare zuerst, hintere leicht verzögert;
     ab dem 6. teilen sie sich den letzten Delay (robust bei vielen Avataren). */
  .member-bar .avatar-btn:nth-child(1)   { --mb-d: 0ms;   }
  .member-bar .avatar-btn:nth-child(2)   { --mb-d: 22ms;  }
  .member-bar .avatar-btn:nth-child(3)   { --mb-d: 44ms;  }
  .member-bar .avatar-btn:nth-child(4)   { --mb-d: 66ms;  }
  .member-bar .avatar-btn:nth-child(5)   { --mb-d: 88ms;  }
  .member-bar .avatar-btn:nth-child(n+6) { --mb-d: 110ms; }
}
/* Bewegungsreduziert: keine weichen Übergänge (JS snappt --mc binär 0/1). */
@media (prefers-reduced-motion: reduce) {
  .member-bar.collapsed:hover,
  .member-bar.collapsed:hover .avatar-btn { transition: opacity .15s ease; }
}
/* Nicht gewählte Mitglieder werden NICHT abgedunkelt: die Gesichter bleiben
   erkennbar, die Auswahl markiert allein der Ring unten (.selected::after). */
.member-bar .avatar-btn.selected::after {
  content: '';
  position: absolute;
  inset: -3px;
  border: 2px solid var(--accent);
  border-radius: 999px;
}
.member-bar .avatar-btn img,
.member-bar .avatar-btn span {
  width: 100%; height: 100%;
  border-radius: 999px;
  object-fit: cover;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 15px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  /* Alle Zeilen gleich hoch, ohne festen Wert: Die Aufgaben-Kachel mit ihren drei
     Zeilen ist hoeher als das Paar darunter, und 1fr zieht beide Rasterzeilen auf
     die Hoehe der hoechsten. Eine feste min-height waere geraten und braeche, sobald
     eine Beschriftung bei grosser Schrift umbricht. */
  grid-auto-rows: 1fr;
  gap: var(--gap);
  margin-bottom: var(--gap);
}
.kpi {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  color: #fff;
  padding: 14px;
  min-height: 96px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
}
/* Aufgaben zusammengelegt: auf schmalen Anzeigen EINE Kachel ueber die ganze Breite
   mit den drei Zahlen untereinander, darunter Einkauf und Termine als Paar. Die drei
   einzelnen Kacheln sind hier ausgeblendet und uebernehmen ab 820px. */
.kpi-tasks { grid-column: 1 / -1; }
.kpi-single { display: none; }
.kpi-rows {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}
.kpi-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
/* Das Wasserzeichen der Sammelkachel etwas kleiner und tiefer als bei den
   Einzelkacheln: Die Kachel ist flacher, und die Zahlen stehen rechts — genau dort,
   wo das Symbol sitzt. So bleibt es Hintergrund und die Zahlen bleiben scharf. */
.kpi-tasks .kpi-glyph { font-size: 58px; right: -4px; bottom: -16px; opacity: .14; }
.kpi-row-label { font-size: 14px; font-weight: 600; opacity: .92; }
.kpi-row-value { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kpi .kpi-label { font-size: 13px; font-weight: 600; opacity: .92; position: relative; z-index: 1; }
.kpi .kpi-value { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; position: relative; z-index: 1; }
.kpi .kpi-glyph {
  position: absolute;
  right: -8px; bottom: -14px;
  font-size: 74px;
  opacity: .18;
  z-index: 0;
  /* Leicht gegen den Uhrzeigersinn gekippt — dasselbe Mass wie in der iOS-App. */
  transform: rotate(-10deg);
}
.kpi:active { filter: brightness(1.08); }

/* Fortschrittskarte: Titel, darunter eine Reihe Ringe. Auf dem Telefon 2 x 2,
   ab 820 px vier in einer Reihe (Media-Block am Ende). Bewusst feste Spaltenzahlen
   statt auto-fit: bei 489 px Inhaltsbreite ergaebe auto-fit drei Spalten und damit
   eine 3+1-Reihe. */
.week-card { display: block; }
.week-card > h3 { font-size: 16px; font-weight: 700; margin-bottom: 10px; }
.ring-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 8px; }
.stat-ring { text-align: center; min-width: 0; }
.stat-ring svg { display: block; margin: 0 auto; }
.ring-track { stroke: var(--surface2); }
.ring-value { stroke: var(--accent); transition: stroke-dashoffset .4s ease; }
/* Liegengebliebene ueberfaellige Aufgaben */
.ring-value.warn { stroke: var(--red); }
.stat-ring text { fill: var(--text); font-weight: 800; font-size: 20px; }
.ring-label { font-size: 13px; font-weight: 700; margin-top: 6px; }
.ring-sub { font-size: 12px; color: var(--muted); }

.segmented {
  display: flex;
  background: var(--surface);
  border-radius: 10px;
  padding: 3px;
  margin-bottom: var(--gap);
}
.segmented button {
  flex: 1;
  padding: 7px 0;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}
.segmented button.active {
  background: var(--surface2);
  color: var(--text);
}

/* Aufgaben-Checkbox: identisch zur ToDoList-Kachel (native, gestylte Checkbox).
   Klassen-gescopt auf .chk, damit die iOS-Switch-Toggles im Editor
   (.switch > input[type=checkbox]) unberührt bleiben. Unchecked-Fläche =
   Task-Hintergrund (var(--row)). */
.chk {
  appearance: none;
  -webkit-appearance: none;
  width: 18px;
  height: 18px;
  margin: 1px 0 0;
  padding: 0;
  flex: 0 0 auto;
  box-sizing: border-box;
  border: 1px solid var(--accent);
  border-radius: 5px;
  background-color: var(--row);
  background-position: center;
  background-repeat: no-repeat;
  background-size: 13px 13px;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--row) 45%, transparent);
  cursor: pointer;
  vertical-align: middle;
  accent-color: var(--accent);
  transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .04s ease;
}
.chk:checked {
  border-color: var(--accent);
  background-color: var(--accent);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.4 8.2 6.6 11.4 12.8 4.8' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 16%, transparent);
}
.chk:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset: 2px;
}
.chk:active { transform: scale(.94); }
.chk:disabled { cursor: not-allowed; opacity: .45; }
.empty-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  color: var(--muted);
  font-size: 14px;
}
.empty-row i { color: var(--green); font-size: 18px; }
.more-row {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0 2px;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
}

/* Einkaufsvorschau */
.shop-strip {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 2px 8px;  /* Horizontal wischbar, aber ohne sichtbare Scrollleiste (wie in der App) */
  scrollbar-width: none;
}
.shop-strip::-webkit-scrollbar { display: none; }
/* Ziehen mit der Maus (bindDragScroll): grab/grabbing als Hinweis, und waehrend des
   Ziehens keine Textauswahl. */
.shop-strip { cursor: grab; }
.shop-strip.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
.shop-strip .strip-item {
  flex: none;
  width: 58px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}
/* Trägt das Mengen-Abzeichen; ohne overflow: hidden, damit es über den Rand des
   Knopfs hinausragen darf. Die Breite kommt vom Knopf. */
.strip-thumb-wrap { position: relative; display: inline-flex; }
.strip-thumb {
  width: 44px; height: 44px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
}
/* Mit Produktbild keine runde Fläche: weder Tönung noch Kreisbeschneidung. Beides
   muss weg — allein den Hintergrund zu entfernen ließe das Bild weiter als Kreis
   erscheinen, weil overflow: hidden es an der Rundung abschneidet. */
.strip-thumb.has-img {
  background: none;
  border-radius: 0;
  overflow: visible;
}
.strip-thumb img { width: 100%; height: 100%; object-fit: contain; }
/* Menge am unteren Rand des Bildes. Unterlage ist die Kachelhintergrundfarbe und
   ohne Ring (so gewuenscht). Vorher war es --row (etwas heller) mit einem
   1-px-Ring in --card-color, der das Abzeichen vom Bild dahinter trennte —
   deckend ist auch --card-color, ueber einem Produktbild bleibt die Zahl also
   lesbar; sie hebt sich nur nicht mehr von der Karte ab. */
.strip-amount {
  position: absolute;
  right: -4px;
  bottom: -3px;
  /* Mindestens rund: Hoehe FEST auf 16px und dieselbe Zahl als Mindestbreite. Vorher
     ergab sich die Hoehe aus line-height 1.4 plus Polster und traf 16px nur zufaellig
     — an einer anderen Schriftgroesse oder Zeilenhoehe waere die Pille zum Oval
     geworden. line-height gleich der Inhaltshoehe (16 minus 2x1px Polster) haelt die
     Zahl senkrecht mittig, und text-overflow: ellipsis bleibt anwendbar (kein Flex). */
  min-width: 16px;
  height: 16px;
  padding: 1px 4px;
  border-radius: 999px;
  background: var(--card-color);
  color: var(--text);
  font-size: 10px;
  font-weight: 700;
  line-height: 14px;
  text-align: center;
  /* Nicht umbrechen: „2 Zehe/n" wurde sonst zweizeilig, das Abzeichen wuchs nach
     unten in den Artikelnamen hinein (gemessen). Deckel bei 54px — der Artikel im
     Streifen ist 58px breit, breitere Mengen werden lieber gekürzt als dass sie
     den Nachbarn berühren. */
  white-space: nowrap;
  max-width: 54px;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;  /* Der Knopf darunter schaltet „im Wagen" — nicht blockieren */
}
.strip-name {
  width: 100%;
  font-size: 10.5px;
  color: var(--muted);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
}
.strip-name .marquee-inner { display: inline-block; }
.strip-name.marquee .marquee-inner { animation: marquee-pingpong 6s ease-in-out infinite; }
@keyframes marquee-pingpong {
  0%, 15%  { transform: translateX(0); }
  45%, 55% { transform: translateX(var(--marquee-shift, -30px)); }
  85%, 100%{ transform: translateX(0); }
}
/* Zentriert, jeder Knopf hoechstens 300 px breit. Ohne den Deckel liefen die
   beiden auf breiten Schirmen ueber die volle Kartenbreite (bei 1800 px Inhalt je
   ~890 px) — fuer zwei kurze Beschriftungen viel zu breit.
   flex-basis 0 plus max-width statt nur max-width: so teilen sie sich den Platz
   gleichmaessig und bleiben untereinander gleich breit, auch bei
   unterschiedlich langen Texten. */
.preview-actions { display: flex; gap: 10px; margin-top: 8px; justify-content: center; }
.preview-actions button {
  flex: 1 1 0;
  max-width: 300px;
  padding: 9px 10px;
  border-radius: 10px;
  /* Gefüllt in der Akzentfarbe mit weißem Text — die beiden Aktionen sind das,
     was man auf dem Dashboard am häufigsten anstößt. Weiß ist bewusst fest und
     nicht --content-color: die Fläche ist immer die Akzentfarbe, unabhängig
     vom hellen oder dunklen Schema. Das Icon erbt die Farbe über currentColor. */
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
}

/* ── Listen-Zeilen (Einkaufen / Favoriten) ────────────────────────────────── */
.cat-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 2px 6px;
  font-size: 13px;
  font-weight: 700;
}
.item-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 6px;
}
/* Eine Kategorie mit nur einem Artikel nimmt die ganze Rasterbreite ein, statt
   eine Reihe mit zwei leeren Spalten zu bilden (zwei Artikel teilen sie sich zu je
   einer Hälfte, siehe .span-half beim Raster). Gesetzt wird die Klasse in
   renderShopping(), weil die Liste FLACH ist: die Zeilen sind Geschwister der
   Überschriften, ein :only-child gibt es hier also nicht (in der Kachel schon,
   dort liegt jede Kategorie in ihrem eigenen .item-grid).
   Außerhalb jeder Media Query: einspaltig ist grid-column: 1 / -1 wirkungslos. */
.item-card.span-all { grid-column: 1 / -1; }
.item-card .swipe-under {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 18px;
  background: var(--red);
  color: #fff;
  font-size: 17px;
  opacity: 0;
  transition: opacity .12s ease;
}
.item-card .swipe-under-edit {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding-left: 18px;
  background: #2f6fd4;
  color: #fff;
  font-size: 17px;
  opacity: 0;
  transition: opacity .12s ease;
}
.item-card.dragging-left .swipe-under,
.item-card.is-deleting .swipe-under { opacity: 1; }
.item-card.dragging-right .swipe-under-edit { opacity: 1; }
.item-card-content {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--row);
  transition: transform .18s ease;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: pointer;
}
.item-card-content.is-dragging { transition: none; }
.item-card.is-deleting .item-card-content { transition: transform .22s ease; }
.item-thumb {
  width: 38px; height: 38px;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface2);
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  font-size: 15px;
}
.item-thumb img { width: 100%; height: 100%; object-fit: contain; }
.item-main { flex: 1; min-width: 0; }
.item-name {
  display: block;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-notes {
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-side { display: flex; align-items: center; gap: 8px; flex: none; }
.item-price { font-size: 12.5px; color: var(--muted); }
/* Vorschlaege aus weitergeleiteten E-Mails. Steht ueber der Aufgabenliste, weil es
   Post ist, die auf eine Entscheidung wartet — und verschwindet restlos, sobald
   nichts mehr offen ist.

   Optik wie der Rest der Liste: jeder Vorschlag ist eine Zeile auf --row mit 12px
   Radius und 6px Abstand (wie .todo-content und .item-card), die Mail darueber nur
   eine Ueberschrift wie .cat-header oder .cal-day-head. Bewusst KEIN Rahmen und
   keine getoente Kopfzeile — ein umrandeter Kasten mitten in einer rahmenlosen
   Liste liest sich als Fremdkoerper und nicht als deren oberster Eintrag.

   Eingeklappt ist der Normalzustand: ein Halbjahresplaner liefert zwei Dutzend
   Termine, und die schoben die eigentliche Liste sonst aus dem Bild. Sichtbar
   bleibt nur die Zeile „N neue Termine gefunden". */
.mail-ai { --chip-r: 18px; display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--gap); }
/* Aufgeklappt fasst eine leicht graue FLAECHE Meldung und Fundstuecke zu einem
   Block zusammen: der Chip ist ihr Kopf, die Zeilen ihr Inhalt — vorher schwebten
   sie unverbunden auf dem Seitenhintergrund. Bewusst eine Flaeche und keine
   Kontur: 5 % Inhaltston bleibt in beiden Themes ein leises Grau, und die Zeilen
   (--row, ~8 %) heben sich als Karten davon ab. Die Klasse setzt renderMailAi,
   weil der offene Zustand am Knopf haengt und CSS den Elternknoten nicht sieht. */
.mail-ai.open {
  background: color-mix(in srgb, var(--content-color) 9%, transparent);
  border-radius: var(--chip-r);
  padding: 0 8px 8px;
}
/* Die HOEHE gleitet per Skript (mailToggleAnimieren), weil „auto" nicht
   animierbar ist und der Inhalt beim Zuklappen erst NACH dem Schrumpfen
   verschwinden darf. Das Grau wechselt bewusst OHNE Uebergang: es gehoert zum
   aufgeklappten Zustand, und ein Nachblenden beim Schliessen zeigte sich als
   eckiges Grau hinter der wieder runden Pille (Rundung und Polster sind da
   schon weg).

   flex: 0 0 auto ist hier keine Kosmetik: .mail-ai ist ein Flex-Container, und
   waehrend die Hoehe animiert wird, ist sie KLEINER als der Inhalt. Ohne diese
   Zeile stauchen die Flex-Kinder auf fast null, statt unten beschnitten zu
   werden — sichtbar als grauer Streifen unter dem Chip, aus dem die Zeilen erst
   hervorwachsen. Mit ihr behalten sie ihre Hoehe und werden aufgedeckt. */
.mail-ai > * { flex: 0 0 auto; }
/* Auf der Flaeche traegt die Zeile den Seitengrundton statt --row: --row (~8 %
   Inhaltston) laege fast auf dem Grau der Flaeche (9 %) und die Karten
   verschwaenden darin. Deckend bleibt sie (var(--bg) = card-color), sonst
   schienen die Wisch-Untergruende durch. */
.mail-ai.open .mail-row { background: var(--bg); }
/* Der Chip bleibt buendig: die Seitenpolster der Flaeche hebt er mit negativem
   Rand wieder auf, seine oberen Ecken sind ihre unteren Grenzen der Rundung. */
.mail-ai.open .section-toggle { margin: 0 -8px; }
/* Derselbe Umschalter wie bei „Erledigt" und „Zuletzt benutzt" (.section-toggle),
   hier aber als Chip in der Akzentfarbe ueber die volle Inhaltsbreite: der Fund
   ist eine MELDUNG und kein Listenabschnitt — er soll auffallen, solange er
   ungelesen ist. Die Zahl steht im Titel statt rechts in .count, den Pfeil nach
   rechts schiebt deshalb der Pfeil selbst.

   Bewusst KEIN width: 100% (siehe Grundregel .section-toggle): als Flex-Container
   auf Blockebene fuellt der Chip die Breite ohnehin.

   Und bewusst KEIN Seitenrand: der Chip muss geschlossen exakt so breit sein wie
   aufgeklappt (dort heben -8px Rand die 8px Seitenpolster der Flaeche auf) —
   schon 2px Unterschied liessen ihn beim Umschalten sichtbar springen. */
.mail-ai .section-toggle {
  margin: 0;
  padding: 10px 14px;
  /* Fester Radius statt 999px, und die Mindesthoehe ist sein Doppeltes.
     Grund: bei 999px begrenzt der Browser jede Ecke auf die halbe Hoehe, weil die
     Radien einer Kante zusammen nicht groesser sein duerfen als das Element. Fallen
     die unteren Radien aufgeklappt auf 0, verschwindet diese Konkurrenz und die
     OBEREN Ecken wachsen auf die volle Hoehe — der Chip wurde beim Aufklappen
     sichtbar runder. Mit festem Wert ist die Rundung in beiden Zustaenden dieselbe,
     und geschlossen bleibt es dank der Mindesthoehe eine echte Pille. */
  /* --chip-r steht am Behaelter (.mail-ai): die aufgeklappte Flaeche teilt sich
     die Rundung mit dem Chip, sonst staenden zwei verschiedene Radien uebereinander. */
  min-height: calc(var(--chip-r) * 2);
  border-radius: var(--chip-r);
  background: var(--accent);
  color: #fff;
}
.mail-ai .section-toggle i.chev, .mail-ai .section-toggle svg.chev { margin-left: auto; }
/* Aufgeklappt verliert der Chip seine unteren Rundungen: er gehoert dann zu dem,
   was darunter aufgeht, und soll nicht als abgeschlossene Pille darueber schweben. */
.mail-ai .section-toggle.open {
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}
/* FLACHE Liste, aus demselben Grund wie in der Agenda: renderRows() erkennt
   unveraenderte Knoten nur unter den DIREKTEN Kindern. In .mail-card/.mail-rows
   verpackt wurde bei jedem Neuzeichnen die ganze Mail ersetzt — also auch die Zeile
   unter dem Finger, und die Wischgeste ruckelte. Mailkopf und Zeilen sind deshalb
   Geschwister mit Schluessel, wie Kategorie-Ueberschrift und Artikelzeile. */
.mail-head {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 2px 6px;
}
.mail-ai > .mail-head:first-of-type { margin-top: 2px; }
/* Rund, nicht eckig: es gibt KEINE allgemeine .avatar-Regel in dieser Datei —
   jede Umgebung bringt ihre eigene mit (.avatar-stack .avatar, .assign-chip .avatar,
   .member-bar .avatar-btn img). Hier fehlte sie, deshalb blieb ein Foto ein Quadrat.
   object-fit: cover, damit ein nicht quadratisches Foto beschnitten wird statt
   gestaucht; die Zentrierung gilt dem Buchstaben-Ersatz ohne Foto. */
.mail-head .avatar {
  width: 22px; height: 22px;
  border-radius: 999px;
  object-fit: cover;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  flex: 0 0 auto;
}
.mail-who { flex: 1 1 auto; min-width: 0; }
.mail-subject {
  font-size: 13px; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mail-meta { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Wischen wie in den Listen: links verwerfen (rot, Papierkorb), rechts uebernehmen
   (gruen, Plus — dieselbe Farbwahl wie „auf die Einkaufsliste" bei den Favoriten).
   Der Behaelter traegt Rundung und overflow, die Zeile darin wird verschoben; ihre
   Flaeche ist mit --row deckend, sonst schienen beide Untergruende durch. */
.mail-item { position: relative; border-radius: 12px; overflow: hidden; margin-bottom: 6px; }
.mail-item .swipe-under {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 18px;
  background: var(--red); color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.mail-item .swipe-under-edit {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-start;
  padding-left: 18px;
  background: #34c759; color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.mail-item.dragging-left .swipe-under,
.mail-item.is-deleting .swipe-under { opacity: 1; }
.mail-item.dragging-right .swipe-under-edit { opacity: 1; }
.mail-row {
  position: relative;
  transition: transform .18s ease;
  /* pan-y: senkrecht bleibt natives Scrollen, waagerecht uebernimmt bindCardSwipe */
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--row);
}
/* WAEHREND des Ziehens keine Uebergangszeit. Ohne diese Zeile lief die 180-ms-
   Animation bei JEDER Fingerbewegung neu an: die Zeile lief dem Finger nach statt
   mit ihm — das war das Ruckeln. bindCardSwipe setzt dafuer .is-dragging, jede
   andere Wischflaeche hat dieselbe Regel (.item-card-content, .todo-content,
   .cal-event, .fav-row). Der Uebergang bleibt fuer das Zurueckfedern nach dem
   Loslassen erhalten, denn dann ist die Klasse wieder weg. */
.mail-row.is-dragging { transition: none; }
.mail-row-body { flex: 1 1 auto; min-width: 0; }
/* Chips und Avatare der Vorschlagszeile: dieselbe Aufteilung wie in der
   Aufgabenzeile (.todo-side/.todo-meta) — Werte absichtlich gleich, damit beide
   Listen im selben Raster stehen. Gestapelt wird von layoutRowMeta() gemessen,
   die Regeln dafuer stehen bei .todo-content.stacked. */
.mail-side {
  display: flex; flex-direction: row; align-items: center; align-self: center;
  gap: 6px; flex: none;
}
.mail-chips {
  display: flex; flex-direction: row; align-items: center; align-self: center;
  gap: 6px; flex: none;
}
/* Titel und Zusatz genau wie in einer Aufgabenzeile (.todo-title/.todo-info) —
   ein Vorschlag soll lesbar sein wie das, was aus ihm wird. */
.mail-row-title { font-size: 15px; font-weight: 600; }
.mail-row-info { font-size: 12.5px; color: var(--muted); }
.mail-row .row-btn { font-size: 17px; padding: 4px 5px; }
/* Kalender: Agenda nach Tagen. Bewusst keine Wochen-Gitter — auf einem Telefon ist
   eine Liste lesbar, ein Raster nicht. Die Farbe kommt je Termin aus OpenCalendar. */
/* FLACHE Liste: Tagesueberschriften und Terminzeilen sind Geschwister, keine
   verschachtelten Tagesgruppen. Grund ist nicht die Optik, sondern das Wischen —
   renderRows() erkennt unveraenderte Knoten nur unter den DIREKTEN Kindern und
   behaelt sie dann. In Gruppen verpackt wurde bei jedem Neuzeichnen die ganze
   Gruppe ersetzt, also auch die Zeile unter dem Finger: das Ruckeln beim Schieben.
   Artikel- und Aufgabenliste sind aus demselben Grund flach. */
.cal-day-head {
  display: flex; align-items: baseline; gap: 6px;
  margin: 14px 2px 6px;
  font-size: 12.5px; color: var(--muted);
}
#calArea > .cal-day-head:first-child { margin-top: 0; }
.cal-day-head .cal-weekday { font-weight: 700; color: var(--content); }
.cal-day-head.is-today .cal-weekday { color: var(--accent); }
/* Ohne Rahmen, wie die Aufgabenzeilen und die Vorschlaege: die Flaeche allein
   trennt die Zeile vom Hintergrund. Ein Rahmen zusaetzlich zur Flaeche zeichnet
   dieselbe Kante zweimal. */
/* Terminvorschau auf der Uebersicht: dieselben Zeilen wie im Kalender, nur ohne
   Wischen und Knoepfe. Der Abstand steckt dort am .cal-card-Behaelter, den es hier
   nicht gibt — deshalb hier direkt an der Zeile. */
.cal-preview .cal-event { margin-bottom: 6px; }
.cal-preview .cal-event:last-child { margin-bottom: 0; }
.cal-preview .cal-day-head { margin: 10px 2px 6px; }
.cal-preview .card-head + .cal-day-head { margin-top: 0; }
.cal-event {
  display: flex; align-items: stretch; gap: 9px;
  padding: 9px 10px;
  border-radius: var(--radius);
  background: var(--surface);
}
/* Wischen wie in den Listen: die Zeile liegt ueber zwei Untergruenden (links
   loeschen, rechts bearbeiten) und wird darueber verschoben. Der Behaelter traegt
   deshalb position und overflow, die Zeile eine DECKENDE Flaeche — mit dem
   durchscheinenden --surface waeren beide Untergruende von Anfang an sichtbar
   (derselbe Grund wie bei .todo-content, siehe --row). */
.cal-card { position: relative; border-radius: var(--radius); overflow: hidden; margin-bottom: 6px; }
.cal-card .swipe-under {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 18px;
  background: var(--red); color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.cal-card .swipe-under-edit {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-start;
  padding-left: 18px;
  background: #2f6fd4; color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.cal-card.dragging-left .swipe-under,
.cal-card.is-deleting .swipe-under { opacity: 1; }
.cal-card.dragging-right .swipe-under-edit { opacity: 1; }
.cal-card .cal-event {
  position: relative;
  background: var(--row);
  transition: transform .18s ease;
  /* pan-y: das senkrechte Scrollen bleibt nativ, waagerecht uebernimmt die Geste
     (bindCardSwipe) — wie bei .todo-content. */
  touch-action: pan-y;
}
/* Nur wo die Geste greift: antippbar, und ohne Textauswahl — mit der Maus haette
   das Ziehen sonst den Titel markiert statt die Zeile verschoben. */
.cal-card:not(.cal-readonly) .cal-event {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.cal-card .cal-event.is-dragging { transition: none; }
.cal-card .row-btn { font-size: 16px; padding: 4px 5px; flex: 0 0 auto; align-self: center; }
.cal-bar { width: 4px; border-radius: 2px; flex: 0 0 auto; background: var(--accent); }
/* Uhrzeit als eigene Zeile UEBER dem Titel (siehe Markup in renderCalendar).
   Vorher stand sie in einer 44px-Spalte links — dort passte „ganztaegig" nicht
   hinein. Tabellenziffern, damit die Zeiten untereinander auf gleicher Breite
   stehen. */
.cal-when { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cal-body { flex: 1 1 auto; min-width: 0; }
/* Schriftgrade wie in einer Aufgabenzeile (.todo-title/.todo-info): 15px/600 fuer
   den Titel, 12,5px in --muted fuer die Zusatzzeile. Termine und Aufgaben stehen
   in derselben App untereinander — zwei Groessenstaffeln waeren als Unterschied
   ohne Bedeutung lesbar. Einzeilig bleibt die Zusatzzeile trotzdem: hier stehen Ort
   und Notiz mit „ · " verbunden, das darf keine halbe Karte fuellen. */
/* Eine Zeile mit Auslassungspunkten, genau wie .todo-title: ein langer
   Terminname („Psychomotorik fuer Kinder ab 4 Jahren") brach sonst um und die
   Zeile wurde hoeher als ihre Nachbarn. */
.cal-title {
  display: block;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Info-Abzeichen (Serie, Erinnerung) zwischen Inhalt und Avataren — gleiche
   Reihenfolge wie in der Aufgabenzeile: erst die Merkmale, dann wer zustaendig
   ist, dann die Knoepfe. */
/* Chips, Avatare und Knoepfe der Terminzeile in EINER Spalte — dieselben Werte wie
   .todo-side/.todo-meta und .mail-side/.mail-chips. Gestapelt und verdichtet wird von
   layoutRowMeta(), die Regeln dazu stehen bei .todo-content.stacked. */
.cal-side {
  display: flex; flex-direction: row; align-items: center; align-self: center;
  gap: 6px; flex: none;
}
.cal-chips {
  display: flex; flex-direction: row; align-items: center; align-self: center;
  gap: 6px; flex: none;
}
/* Reihen-Hinweis im Termin-Editor: Text wie ein Feldwert, nicht wie ein Eingabefeld
   — er ist Auskunft und nichts zum Ausfuellen. */
.cal-series-note { font-size: 14.5px; padding: 2px 0; }
.cal-status {
  padding: 9px 10px; margin-bottom: var(--gap);
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid #d92d20;
  font-size: 12.5px;
}
/* Uebersicht ueber der Aufgabenliste — drei Zahlen, wie in der fruheren
   ToDoList-Kachel. Je Liste abschaltbar ueber showOverview. */
.todo-stats { display: flex; gap: var(--gap); margin-bottom: var(--gap); }
.stat-box {
  flex: 1;
  padding: 12px 8px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  text-align: center;
  min-width: 0;
}
.stat-box .stat-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-box .stat-value { font-size: 22px; font-weight: 800; line-height: 1.2; }
.stat-open .stat-label, .stat-open .stat-value { color: var(--accent); }
.stat-overdue .stat-label, .stat-overdue .stat-value { color: #ff5a5a; }
.stat-today .stat-label, .stat-today .stat-value { color: #ffa500; }

.heart-btn { font-size: 16px; color: var(--muted); padding: 4px; }
.heart-btn.faved { color: var(--accent); }
/* Zuschaltbare Zeilenknoepfe (Stift, Papierkorb) — gleiche Anmutung wie das Herz,
   damit die Zeile nicht auseinanderfaellt, wenn beide eingeblendet sind. */
.row-btn {
  font-size: 16px;
  color: var(--muted);
  padding: 4px;
  background: none;
  border: 0;
  flex: none;
  cursor: pointer;
}
.row-btn.destructive { color: var(--red); }
/* Bejahender Zeilenknopf (Vorschlag uebernehmen) — dieselbe Rolle wie die Pfeile
   des Steppers, deshalb dieselbe Akzentfarbe. */
.row-btn.accent { color: var(--accent); }
.amount-badge {
  min-width: 30px;
  text-align: center;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--surface2);
  font-size: 12.5px;
  font-weight: 700;
}
.stepper { display: flex; flex-direction: column; }
.stepper button { padding: 0 6px; font-size: 12px; color: var(--accent); line-height: 1.2; }
.stepper .amount-badge { padding: 1px 8px; }
/* Abzeichen ohne Pfeile: antippbar, nimmt die Menge per Dialog entgegen. Der
   Akzentrand ist der einzige Hinweis darauf — ohne ihn wirkt es wie reine Anzeige. */
.amount-badge[data-amount-edit] {
  cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
}
.amount-badge[data-amount-edit]:active { opacity: .6; }
.item-card.in-cart .item-name { text-decoration: line-through; color: var(--muted); }
.item-card.in-cart .item-card-content { opacity: .75; }

.section-toggle {
  /* KEIN width: 100% — zusammen mit den 2px Seitenrändern unten ergäbe das
     100% + 4px und ließe den Scrollbereich um 2px waagerecht scrollen (gemessen:
     scrollWidth 491 gegen clientWidth 489, der Toggle lief von 2 bis 491). Als
     Flex-Container auf Blockebene füllt er die Breite ohnehin. */
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 2px 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
}
.section-toggle .count { margin-left: auto; font-weight: 600; }
/* /icons.js (Font Awesome SVG+JS) ersetzt jedes <i> NACHTRAEGLICH durch ein <svg>
   und uebernimmt dabei die Klassen. Mit „i.chev" allein traf die Drehung deshalb
   nur die ersten Millisekunden nach dem Zeichnen — im laufenden Betrieb zeigte der
   Pfeil IMMER nach rechts, auch aufgeklappt. Beide Elementarten nennen (wie bei
   .tabbar button i, .tabbar button svg weiter oben). */
.section-toggle i.chev, .section-toggle svg.chev { transition: transform .18s ease; }
/* Aufgeklappt zeigt der Pfeil nach UNTEN: 90 Grad im Uhrzeigersinn aus „rechts". */
.section-toggle.open i.chev, .section-toggle.open svg.chev { transform: rotate(90deg); }

/* ── Eingabeleisten ────────────────────────────────────────────────────────── */
.inputbar {
  position: sticky;
  bottom: 0;
  display: flex;
  gap: 8px;
  padding: 24px 0 2px;
  background: linear-gradient(to top, var(--card-color) 72%, transparent);
}
/* Der Inputbar-Hintergrund soll bis an die Oberkante der Tab-Leiste reichen:
   dieses ::after füllt das 12px-Bottom-Padding der .screen unter dem Inputbar,
   damit scrollender Inhalt dort nicht durchblitzt. */
.inputbar::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  height: 12px;
  background: var(--card-color);
}
.inputbar input { flex: 1; border-radius: 999px; }
.inputbar .round-btn {
  width: 42px; height: 42px;
  flex: none;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-size: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.inputbar .round-btn.secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}
.inputbar .round-btn:disabled { opacity: .4; }

/* Vorschlagsfenster, Darstellung aus der Einkaufslisten-Kachel uebernommen: eigenes
   schwebendes Fenster statt eines Blocks im Komponisten.
     fixiert und an der Tab-Leiste ausgerichtet — dieselbe Rechnung fuer links/rechts
       und derselbe Deckel --bar-max, damit Fenster, Eingabezeile und Leiste eine
       Kante haben
     Unterkante fest --sug-gap ueber der Eingabezeile, Hoehe nach INHALT (kein top),
       gedeckelt so dass oben mindestens --sug-top frei bleibt
     Glas wie Leiste und Feld, runde Ecken, 1px in der vollen Akzentfarbe
     Scrollbalken ausgeblendet, Scrollen bleibt */
.suggestions {
  position: fixed;
  left: calc(var(--sym-ms) + var(--tab-narrow));
  right: calc(var(--sb-pad) * 2 + var(--sbw) + var(--tab-narrow));
  max-width: var(--bar-max);
  margin-left: auto;
  margin-right: auto;
  bottom: var(--sug-bottom);
  height: auto;
  max-height: calc(100dvh - var(--sug-bottom) - var(--sug-top));
  padding: 12px;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  background: var(--glass-bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  -ms-overflow-style: none;
  display: none;
  z-index: 45;
}
.suggestions::-webkit-scrollbar { display: none; }
.suggestions.open { display: block; }
.suggestions .chip-flow { display: flex; flex-wrap: wrap; gap: 8px; }
/* Vorschläge + Eingabe als EIN sticky Block: so klebt das Vorschlags-Fenster
   beim Tippen direkt über der Eingabe, statt in der langen Liste zu verschwinden.
   (Die Eingabe selbst wird dann vom Composer sticky gehalten, nicht mehr selbst.) */
.composer { position: sticky; bottom: 0; z-index: 5; }
.composer .inputbar { position: static; }
/* Keine Unterlage mehr: das Vorschlagsfenster ist ein eigenes schwebendes Fenster
   mit eigener Glasschicht (Regel bei .suggestions). */
.chip {
  /* inline-flex, damit das Produktbild neben dem Namen sitzt und mittig ausgerichtet
     ist. Vorher reichte der Standard des <button>, es gab kein Bild. */
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface2);
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
}
/* Produktbild im Vorschlagschip, Maße aus der Einkaufslisten-Kachel. pointer-events
   aus, damit ein Tipp auf das Bild als Tipp auf den Chip gilt — die Handler haengen
   am Chip, und das Bild soll kein eigenes Ziel sein. */
.chip-img {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  object-fit: cover;
  flex: none;
  pointer-events: none;
}

/* ── ToDo-Zeilen ───────────────────────────────────────────────────────────── */
.todo-card {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 6px;
}
.todo-card .swipe-under {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 18px;
  background: var(--red); color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.todo-card .swipe-under-edit {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: flex-start;
  padding-left: 18px;
  background: #2f6fd4; color: #fff; font-size: 17px;
  opacity: 0; transition: opacity .12s ease;
}
.todo-card.dragging-left .swipe-under,
.todo-card.is-deleting .swipe-under { opacity: 1; }
.todo-card.dragging-right .swipe-under-edit { opacity: 1; }
/* Angehobene Karte während des Long-Press-Reorderns: in Accent-Farbe getönt */
.todo-card.todo-dragging .todo-content {
  box-shadow: 0 6px 16px rgba(0,0,0,.32);
  background: color-mix(in srgb, var(--accent) 22%, var(--row-task));
  outline: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
}
.todo-content {
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 12px;
  background: var(--row-task);
  transition: transform .18s ease;
  /* pan-y → natives vertikales Scrollen (mit Schwung) bleibt erhalten; der
     horizontale Swipe wird per JS behandelt. Reorder läuft über den Griff
     (touch-action:none nur dort). */
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  cursor: pointer;
}
.todo-content.is-dragging { transition: none; }
.todo-handle {
  flex: none;
  align-self: stretch;
  display: flex;
  align-items: center;
  padding: 0 2px 0 6px;
  margin-left: 2px;
  color: var(--muted);
  cursor: grab;
  touch-action: none;              /* dragging the handle never scrolls */
  -webkit-touch-callout: none;
}
.todo-handle:active { cursor: grabbing; }
.todo-main { flex: 1; min-width: 0; }
.todo-title {
  display: block;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.todo-card.done-row .todo-title { text-decoration: line-through; color: var(--muted); }
.todo-info {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 1px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* Alle Chips (und künftige Buttons) einer Aufgabe in EINER Zeile nebeneinander,
   wie in der ToDoList: Avatare, Menge, Fälligkeit, Priorität, dann Buttons.
   Inline (nicht gestapelt) vertikal zentriert; im gestapelten Zustand siehe unten. */
.todo-meta {
  display: flex;
  flex-direction: row;
  align-items: center;
  align-self: center;
  gap: 6px;
  flex: none;
}
/* Belegt die Chip-/Button-Zeile mehr als die Hälfte der Task-Breite (per JS
   gemessen, Klasse .stacked), rutscht sie als eigene Zeile unter den restlichen
   Inhalt und richtet sich rechtsbündig aus. */
/* Chips + Drag-Griff bilden eine gemeinsame Zeile (.todo-side) — der Griff darf
   nie aus Platzmangel umbrechen, er steht immer neben den Chips. */
.todo-side {
  display: flex;
  flex-direction: row;
  align-items: center;
  align-self: center;
  gap: 6px;
  flex: none;
}
.todo-content.stacked,
.mail-row.stacked,
.cal-event.stacked { flex-wrap: wrap; }
.todo-content.stacked .todo-side,
.mail-row.stacked .mail-side,
.cal-event.stacked .cal-side {
  flex-basis: 100%;
  justify-content: flex-end;
  align-self: flex-start;
  margin-top: 6px;
}
/* Prioritäts-Chip — identisch zur ToDoList-Kachel (.badge.high/normal/low) */
.badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 999px;
  background-color: var(--surface2);
  color: var(--muted);
  white-space: nowrap;
}
/* Inhaltsbreit statt min-width:60px (ToDoList) — in der Kachel-Zeile teilen sich
   Avatare, Menge, Fälligkeit und Priorität den Platz, breite Chips würden die
   Zeile sprengen. */
.badge.high, .badge.normal, .badge.low {
  display: inline-flex;
  justify-content: center;
}
.badge.high   { color: var(--text); background-color: rgba(255, 0, 0, 0.2); }
.badge.low    { color: var(--text); background-color: rgba(200, 200, 200, 0.2); }
.badge.normal { color: var(--text); background-color: color-mix(in srgb, var(--accent) 30%, transparent); }
/* Menge sowie Wiederholung/Benachrichtigung: gleicher Chip-Stil (neutraler
   Hintergrund, Akzentfarbe). */
/* Chips für Anzahl/Wiederholung/Erinnerung wie den Prioritäts-Chip "Normal"
   darstellen (accent-getönter Pill + Textfarbe) — in beiden Themes identisch. */
.badge.quantity, .badge.attr {
  font-weight: 700;
  color: var(--text);
  background-color: color-mix(in srgb, var(--accent) 30%, transparent);
}
/* gap wie beim Faelligkeits-Chip (.badge.due-badge): die Abzeichen mit Symbol UND
   Text — etwa die Wiederholung eines Vorschlags („15") — klebten sonst zusammen.
   Bei den Abzeichen aus nur einem Symbol bleibt der Wert wirkungslos. */
.badge.attr { display: inline-flex; align-items: center; gap: 6px; }
/* ── Meta-Zeile verdichten, wenn der Platz nicht reicht (Stufen in layoutTodoMeta) ──
   Stufe 1 (.meta-tight): Wiederholung, Erinnerung und Anzahl wandern aus ihren
   Einzel-Chips in einen gemeinsamen — das sparen vor allem die doppelten
   Innenabstände und Lücken.
   Stufe 2 (.meta-tighter): zwei Avatare weichen einem Zähler; die Vorlagen dafür
   stecken schon im Markup (renderAvatarStack), damit hier nichts neu gebaut
   werden muss und das Zurückschalten verlustfrei bleibt. */
.badge.meta-combined { display: none; gap: 5px; }
.todo-content.meta-tight .badge.meta-split,
.mail-row.meta-tight .badge.meta-split,
.cal-event.meta-tight .badge.meta-split { display: none; }
.todo-content.meta-tight .badge.meta-combined,
.mail-row.meta-tight .badge.meta-combined,
.cal-event.meta-tight .badge.meta-combined { display: inline-flex; align-items: center; }
/* Mit `.avatar` im Selektor, sonst gewinnt das später notierte
   `.avatar-stack .avatar { display: inline-flex }` bei gleicher Spezifität und
   der Zähler wäre auch im vollen Zustand sichtbar. */
/* In der eigenen Zeile dürfen die Chips grundsätzlich umbrechen. Das ist eine
   STRUKTURELLE Garantie gegen den abgeschnittenen Drag-Griff: sie hängt an
   keiner JS-Messung, greift also auch bei anderer Schriftmetrik oder wenn mein
   Überlauf-Kriterium daneben liegt. Ohne `flex: 1 1 auto; min-width: 0` bliebe
   .todo-meta auf max-content stehen und `flex-wrap` wirkungslos. Die Zeile wird
   dann höher statt beschnitten; die Verdichtungsstufen sparen genau diese
   zusätzlichen Zeilen ein. */
.todo-content.stacked .todo-meta,
.mail-row.stacked .mail-chips,
.cal-event.stacked .cal-chips {
  flex: 1 1 auto;
  min-width: 0;
  flex-wrap: wrap;
  justify-content: flex-end;
  row-gap: 4px;
}
.avatar-stack .avatar.tight-more { display: none; }
.todo-content.meta-tighter .avatar-stack .tight-hide,
.mail-row.meta-tighter .avatar-stack .tight-hide,
.cal-event.meta-tighter .avatar-stack .tight-hide { display: none; }
.todo-content.meta-tighter .avatar-stack .avatar-more:not(.tight-more),
.mail-row.meta-tighter .avatar-stack .avatar-more:not(.tight-more),
.cal-event.meta-tighter .avatar-stack .avatar-more:not(.tight-more) { display: none; }
.todo-content.meta-tighter .avatar-stack .tight-more,
.mail-row.meta-tighter .avatar-stack .tight-more,
.cal-event.meta-tighter .avatar-stack .tight-more { display: inline-flex; }
/* Fälligkeits-Badge — Optik identisch zur ToDoList-Kachel (neutral umrandet,
   überfällig rot, heute orange). Immer mit Text — nie nur das Kalender-Icon. */
.badge.due-badge { display: inline-flex; align-items: center; gap: 6px; }
.badge.due-badge .due-icon { display: none; }
.badge.due-badge.due-overdue { color: var(--text); background-color: rgba(255, 0, 0, 0.2); }
.badge.due-badge.due-today   { color: var(--text); background-color: rgba(255, 165, 0, 0.2); }
.todo-card.drag-over { outline: 2px dashed var(--accent); }

/* Avatare */
.avatar-stack { display: flex; }
.avatar-stack .avatar {
  width: 24px; height: 24px;
  border-radius: 999px;
  object-fit: cover;
  border: 1.5px solid var(--card-color);
  margin-left: -7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}
.avatar-stack .avatar:first-child { margin-left: 0; }
.avatar-stack .avatar-more { background: var(--surface2); color: var(--text); }

/* ── Favoriten ─────────────────────────────────────────────────────────────── */
.fav-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border-radius: 12px;
  background: var(--surface);
  margin-bottom: 6px;
  cursor: pointer;
}
.fav-badge {
  flex: none;
  color: #ff2d55;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
.fav-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fav-name { font-size: 15px; font-weight: 600; }
.fav-count { font-size: 12.5px; color: var(--muted); }
.fav-cart-btn { font-size: 17px; color: var(--accent); padding: 6px; }
/* Swipebare Favoritenlisten-Zeile: links = löschen (rot), rechts = alles auf die Einkaufsliste (grün). */
.fav-card { position: relative; border-radius: 12px; overflow: hidden; margin-bottom: 6px; }
/* „Schon gekauft": Korb statt Herz, damit sie sich auf den ersten Blick von einer
   selbst angelegten Favoritenliste unterscheidet. */
.bought-badge { color: var(--accent); }
.fav-chevron { color: var(--faint); margin-left: auto; padding-left: 8px; }
/* Zeile der Kaufhistorie. Nur lesen: kein Stepper, kein Stift, nur ein Plus als
   Hinweis, dass ein Tipp den Artikel auf die Einkaufsliste setzt. */
/* Warenkorb-Knopf in Favoriten- UND Kaufliste. Eigene Klasse statt .heart-btn zu
   ändern: die Basis steht bewusst auf --muted (Herz und Stift sind Nebensachen),
   der Warenkorb ist hier aber die Hauptaktion der Zeile. */
.cart-btn { color: var(--accent); }
/* Schon gelistete Zeilen sind nur zurückgenommen, NICHT abgeblendet: sie bleiben
   bedienbar, ein weiterer Tipp erhöht die Menge. Ein Wert wie .55 hätte sie wie
   deaktiviert aussehen lassen — genau dieser Eindruck war der Fehler. */
.bought-row.on-list .item-name { color: var(--muted); }
/* Wisch-Hintergrund fürs Vergessen: neutral statt rot — es wird nichts gelöscht,
   was der Nutzer besitzt, nur eine Beobachtung verworfen. */
.bought-forget { background: var(--surface2); color: var(--text); }
/* Flieger der Hinzufuegen-Animation: Klon des Produktbildes, ueber allem (Tab-Leiste
   liegt auf 40) und ohne Klickflaeche, damit er nichts abfaengt. */
.fly-ghost {
  position: fixed;
  z-index: 90;
  pointer-events: none;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform, opacity;
}
.fly-ghost img { width: 100%; height: 100%; object-fit: contain; }
.fav-card .fav-row { margin-bottom: 0; position: relative; background: var(--row); transition: transform .18s ease; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.fav-card .fav-row.is-dragging { transition: none; }
.fav-card.is-deleting .fav-row { transition: transform .22s ease; }
.fav-card .swipe-under, .fav-card .swipe-under-edit {
  position: absolute; inset: 0; display: flex; align-items: center; color: #fff; font-size: 17px; opacity: 0; transition: opacity .12s ease;
}
.fav-card .swipe-under { justify-content: flex-end; padding-right: 18px; background: var(--red); }
.fav-card .swipe-under-edit { justify-content: flex-start; padding-left: 18px; background: #34c759; }
.fav-card.dragging-left .swipe-under, .fav-card.is-deleting .swipe-under { opacity: 1; }
.fav-card.dragging-right .swipe-under-edit { opacity: 1; }
.fav-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.fav-actions button {
  padding: 11px;
  border-radius: 12px;
  background: var(--accent);
  font-weight: 600;
  color: #fff;
}
.fav-actions button.destructive { background: var(--red); color: #fff; }

/* Beide Favoriten-Spalten beginnen auf derselben Hoehe. Die linke Kopfzeile enthaelt
   den Plus-Knopf (.icon-btn, 38 px), die rechte ab 1100 px keinen — der Zurueck-Pfeil
   ist dort ausgeblendet, weil die Auswahl daneben steht. Gemessen: Kopf 38 gegen
   26 px, dadurch standen die Ueberschriften 6 px und der erste Inhalt 12 px versetzt.
   min-height in Hoehe von .icon-btn macht beide Koepfe gleich hoch, unabhaengig
   davon, ob ein Knopf drinsteht. */
#favMaster .screen-head, #favDetail .screen-head { min-height: 38px; }

/* ── Overlays / Sheets ─────────────────────────────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: none;
  flex-direction: column;
  justify-content: flex-end;
  background: rgba(0, 0, 0, .45);
}
.overlay.open { display: flex; }
.overlay-card {
  background: var(--card-color);
  border-radius: 18px 18px 0 0;
  max-height: 88%;
  display: flex;
  flex-direction: column;
  width: 100%;
  /* Bei 900px gedeckelt: ein Formular über die volle Inhaltsbreite (bis 1400px)
     wäre auf breiten Schirmen unlesbar weit. */
  max-width: min(var(--content-max), 900px);
  margin: 0 auto;
}
.overlay-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
}
.overlay-title { font-size: 17px; font-weight: 700; }
.btn-close-overlay { font-size: 18px; color: var(--muted); padding: 4px 8px; }
.overlay-body {
  padding: 8px 16px 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.overlay-body::-webkit-scrollbar { width: 6px; height: 6px; }
.overlay-body::-webkit-scrollbar-track { background: transparent; }
.overlay-body::-webkit-scrollbar-thumb {
