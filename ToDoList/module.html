 * Mitglieder-Auswahl. Aufgaben und Termine benutzen dieselbe Liste — gleiche
 * Bedienung, gleiche Darstellung; nur Zielfeld und Behaelter unterscheiden sich.
 *
 * @param {string} elId Behaelter
 * @param {string[]} auswahl wird an Ort und Stelle geaendert
 */
function renderAssignList(elId, auswahl) {
  const el = document.getElementById(elId || 'tdAssignList');
  const ziel = auswahl || tdAssigned;
  if (!el) return;
  if (store.users.length === 0) {
    el.innerHTML = '';
    el.parentElement.style.display = 'none';
    return;
  }
  el.parentElement.style.display = '';
  el.innerHTML = store.users.map(u =>
    `<div class="assign-chip${ziel.includes(u.id) ? ' selected' : ''}" data-user="${escapeHtml(u.id)}">` +
    avatarHtml(u, 'avatar') + `<span>${escapeHtml(u.name)}</span></div>`
  ).join('');
  el.querySelectorAll('.assign-chip').forEach(row => row.addEventListener('click', () => {
    const uid = row.dataset.user;
    const idx = ziel.indexOf(uid);
    if (idx === -1) ziel.push(uid); else ziel.splice(idx, 1);
    row.classList.toggle('selected');
  }));
}
function renderPrioritySeg() {
  const seg = document.getElementById('tdPrioritySeg');
  seg.innerHTML = [['low', translate('Low')], ['normal', translate('Normal')], ['high', translate('High')]]
    .map(([v, l]) => `<button data-prio="${v}" class="${v === tdPriority ? 'active' : ''}">${l}</button>`).join('');
  seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    tdPriority = b.dataset.prio;
    renderPrioritySeg();
  }));
}
// Payload exakt wie TodoDraft.fields() in der App (+ actorUserId)
function saveTodoEditor() {
  if (!todoCtx) return;
  const title = document.getElementById('tdTitle').value.trim();
  if (!title) return;
  const fields = {
    title,
    info: document.getElementById('tdInfo').value.trim(),
    priority: tdPriority,
    quantity: tdQuantity,
    assignedTo: tdAssigned.slice()
  };
  if (document.getElementById('tdHasDue').checked) {
    const allDay = document.getElementById('tdAllDay').checked;
    const raw = document.getElementById('tdDueDate').value;
    let due = 0;
    let dueDay = '';
    if (allDay) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(raw);
      if (m) {
        dueDay = `${m[1]}-${m[2]}-${m[3]}`;
        due = Math.floor(new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])).getTime() / 1000);
      }
    } else {
      const d = new Date(raw);
      if (!isNaN(d.getTime())) due = Math.floor(d.getTime() / 1000);
    }
    fields.due = due;
    fields.dueAllDay = allDay;
    if (allDay && dueDay) fields.dueDay = dueDay;
    fields.recurrence = document.getElementById('tdRecurrence').value;
    if (fields.recurrence === 'custom') {
      fields.recurrenceCustomUnit = document.getElementById('tdCustomUnit').value;
      fields.recurrenceCustomValue = Math.max(1, Math.min(99, parseInt(document.getElementById('tdCustomValue').value) || 1));
    }
    fields.notification = document.getElementById('tdNotification').checked;
    fields.notificationLeadTime = parseInt(document.getElementById('tdLeadTime').value) || 0;
    fields.recurrenceResetLeadTime = (fields.recurrence && fields.recurrence !== 'none')
      ? (parseInt(document.getElementById('tdReopen').value) || 0) : 0;
  } else {
    fields.due = 0;
    fields.dueAllDay = false;
    fields.recurrence = 'none';
    fields.notification = false;
  }
  if (currentUserID()) fields.actorUserId = currentUserID();
  if (todoCtx.itemId !== null) {
    sdCall(todoCtx.instanceID, 'UpdateItem', Object.assign({ id: todoCtx.itemId }, fields));
  } else {
    sdCall(todoCtx.instanceID, 'AddItem', fields);
  }
  // Kam die Aufgabe aus einem Mail-Vorschlag, ist der jetzt erledigt — erst JETZT,
  // nach dem Speichern. Beim Abbrechen bleibt er stehen.
  if (todoCtx.proposal) {
    aiPost('/mail/proposals', { action: 'taken', id: todoCtx.proposal.id, i: Number(todoCtx.proposal.i) });
    mailForget(todoCtx.proposal.id, todoCtx.proposal.i);
  }
  closeOverlay('todoOverlay');
  todoCtx = null;
}

// ── Barcode-Scanner (aus dem ShoppingList-Modul uebernommen; angepasst:
//    AddScannedItem laeuft ueber sdCall auf die gewaehlte Einkaufsliste,
//    __extApiHookUrl/state kommen aus der Kompat-Schicht in syncCompat) ─────
let scannerStream = null;
let scannerDetector = null;
let scannerAnimationFrame = 0;
let scannerQuaggaTimer = 0;
let scannerResumeTimer = 0;
let scannerResultHideTimer = 0;
let scannerQuaggaActive = false;
let scannerSessionId = 0;
let scannerWarmupUntil = 0;
let lastCode = '';
const scannerAddedNames = new Set();

function playBeep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  } catch (e) {}
}

function validateBarcode(code) {
  return /^\d{8,14}$/.test(String(code || '').trim());
}

function syncScannerAddedNames() {
  if (!scannerAddedNames.size) return;
  const activeNames = new Set(
    (state.items || [])
      .filter(i => !i.inCart && i.name)
      .map(i => String(i.name).toLowerCase())
  );
  for (const name of Array.from(scannerAddedNames)) {
    if (!activeNames.has(name)) {
      scannerAddedNames.delete(name);
    }
  }
}

function showScannerResult(title, type, meta) {
  const el = document.getElementById('scannerResult');
  if (!el) return;
  if (scannerResultHideTimer) {
    clearTimeout(scannerResultHideTimer);
    scannerResultHideTimer = 0;
  }
  const parts = [title || ''];
  if (meta) parts.push(meta);
  const text = parts.filter(Boolean).join(' · ');
  el.textContent = text;
  el.className = 'scanner-result';
  if (!text) {
    return;
  }
  if (type === 'error') {
    el.classList.add('error');
  }
  el.classList.add('show');
  scannerResultHideTimer = setTimeout(() => {
    const current = document.getElementById('scannerResult');
    if (!current) return;
    current.textContent = '';
    current.className = 'scanner-result';
    scannerResultHideTimer = 0;
  }, 3000);
}

function pauseScanning() {
  if (scannerAnimationFrame) {
    cancelAnimationFrame(scannerAnimationFrame);
    scannerAnimationFrame = 0;
  }
  if (scannerQuaggaTimer) {
    clearTimeout(scannerQuaggaTimer);
    scannerQuaggaTimer = 0;
  }
  scannerQuaggaActive = false;
}

function stopScanner() {
  if (scannerAnimationFrame) {
    cancelAnimationFrame(scannerAnimationFrame);
    scannerAnimationFrame = 0;
  }
  if (scannerQuaggaTimer) {
    clearTimeout(scannerQuaggaTimer);
    scannerQuaggaTimer = 0;
  }
  if (scannerResumeTimer) {
    clearTimeout(scannerResumeTimer);
    scannerResumeTimer = 0;
  }
  if (scannerResultHideTimer) {
    clearTimeout(scannerResultHideTimer);
    scannerResultHideTimer = 0;
  }
  scannerWarmupUntil = 0;
  scannerQuaggaActive = false;
  if (scannerStream) {
    scannerStream.getTracks().forEach(t => t.stop());
    scannerStream = null;
  }
  const video = document.getElementById('scannerVideo');
  if (video) video.srcObject = null;
}

function closeScannerOverlay() {
  scannerSessionId += 1;
  stopScanner();
  scannerAddedNames.clear();
  showScannerResult('', '', '');
  closeOverlay('scannerOverlay');
}

function resumeScanning(delayMs) {
  const sessionId = scannerSessionId;
  if (scannerResumeTimer) {
    clearTimeout(scannerResumeTimer);
  }
  scannerResumeTimer = setTimeout(() => {
    if (sessionId !== scannerSessionId) return;
    scannerResumeTimer = 0;
    lastCode = '';
    pauseScanning();
    const status = document.getElementById('scannerStatus');
    const video = document.getElementById('scannerVideo');
    if (!scannerStream || !video) return;
    showScannerResult('', '', '');
    status.textContent = translate('Scanning…');
    status.className = 'scanner-status';
    if (scannerDetector) {
      startNativeScanning(video, status, sessionId);
    } else if (window.Quagga) {
      startQuaggaFrameScanning(video, status, sessionId);
    }
  }, delayMs);
}

function onBarcodeDetected(code, sessionId) {
  if (sessionId !== scannerSessionId) return;
  if (Date.now() < scannerWarmupUntil) return;
  if (!validateBarcode(code) || code === lastCode) return;
  lastCode = code;
  pauseScanning();
  playBeep();
  const status = document.getElementById('scannerStatus');
  status.textContent = translate('Found') + ': ' + code;
  status.className = 'scanner-status success';
  showScannerResult(code, '', '');
  lookupBarcode(code, sessionId);
}

function startNativeScanning(video, status, sessionId) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  let detectErrorCount = 0;
  const loop = () => {
    if (sessionId !== scannerSessionId) return;
    if (!scannerStream || !scannerDetector) return;
    if (video.videoWidth > 0 && video.videoHeight > 0) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      scannerDetector.detect(canvas)
        .then(codes => {
          if (sessionId !== scannerSessionId) return;
          if (!scannerStream) return;
          detectErrorCount = 0;
          if (codes && codes.length) {
            const raw = String(codes[0].rawValue || '').trim();
            onBarcodeDetected(raw, sessionId);
          }
        })
        .catch((err) => {
          detectErrorCount += 1;
          console.warn('[scanner] BarcodeDetector.detect failed:', err);
          // Auf Android schlägt detect() teils permanent fehl → Fallback auf Quagga
          if (detectErrorCount >= 3 && sessionId === scannerSessionId) {
            scannerDetector = null;
            if (scannerAnimationFrame) {
              cancelAnimationFrame(scannerAnimationFrame);
              scannerAnimationFrame = 0;
            }
            status.textContent = translate('Loading decoder…');
            ensureQuaggaLoaded()
              .then(() => {
                if (sessionId !== scannerSessionId || !scannerStream) return;
                status.textContent = translate('Scanning…');
                status.className = 'scanner-status';
                startQuaggaFrameScanning(video, status, sessionId);
              })
              .catch(() => {
                status.textContent = translate('Decoder could not be loaded');
                status.className = 'scanner-status error';
              });
          }
        });
    }
    scannerAnimationFrame = requestAnimationFrame(loop);
  };
  loop();
}

function ensureQuaggaLoaded() {
  if (window.Quagga) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-quagga="1"]');
    if (existing) {
      existing.addEventListener('load', () => resolve());
      existing.addEventListener('error', () => reject(new Error('load failed')));
      return;
    }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js';
    script.async = true;
    script.setAttribute('data-quagga', '1');
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(script);
  });
}

function startQuaggaFrameScanning(video, status, sessionId) {
  if (sessionId !== scannerSessionId) return;
  if (!window.Quagga || !scannerStream) return;
  scannerQuaggaActive = true;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const scanOnce = () => {
    if (sessionId !== scannerSessionId) return;
    if (!scannerQuaggaActive || !scannerStream) return;
    if (video.readyState < 2) {
      scannerQuaggaTimer = setTimeout(scanOnce, 200);
      return;
    }
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    const SCAN_W = 800;
    const scale = SCAN_W / vw;
    canvas.width = SCAN_W;
    canvas.height = Math.round(vh * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    try {
      Quagga.decodeSingle({
        src: canvas.toDataURL('image/jpeg', 0.8),
        numOfWorkers: 0,
        locate: true,
        locator: { patchSize: 'medium', halfSample: true },
        decoder: {
          readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'code_128_reader'],
          multiple: false
        }
      }, (result) => {
        if (sessionId !== scannerSessionId) return;
        if (result && result.codeResult && result.codeResult.code) {
          onBarcodeDetected(result.codeResult.code, sessionId);
        }
        if (scannerQuaggaActive) {
          scannerQuaggaTimer = setTimeout(scanOnce, 400);
        }
      });
    } catch (err) {
      console.warn('[scanner] Quagga.decodeSingle threw:', err);
      if (scannerQuaggaActive) {
        scannerQuaggaTimer = setTimeout(scanOnce, 500);
      }
    }
  };

  status.textContent = translate('Scanning…');
  status.className = 'scanner-status';
  scanOnce();
}

function openScannerOverlay() {
  document.getElementById('suggestions').classList.remove('open');
  scannerSessionId += 1;
  const sessionId = scannerSessionId;
  const overlay = document.getElementById('scannerOverlay');
  const status = document.getElementById('scannerStatus');
  const result = document.getElementById('scannerResult');
  const videoWrap = document.getElementById('scannerVideoWrap');
  const video = document.getElementById('scannerVideo');
  openOverlay('scannerOverlay');
  lastCode = '';
  scannerWarmupUntil = 0;
  scannerAddedNames.clear();
  result.textContent = '';
  result.className = 'scanner-result';
  videoWrap.style.display = '';

  status.textContent = translate('Scanning…');
  status.className = 'scanner-status';

  const canUseCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const canUseNative = !!window.BarcodeDetector;
  const isSecure = !!window.isSecureContext;
  const inIframe = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  if (!canUseCamera) {
    videoWrap.style.display = 'none';
    if (!isSecure) {
      status.textContent = translate('Camera requires HTTPS');
    } else {
      status.textContent = translate('Camera not available');
    }
    status.className = 'scanner-status error';
    return;
  }

  const waitForVideoReady = (videoEl) => new Promise((resolve) => {
    if (videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
      resolve();
      return;
    }
    const onReady = () => {
      videoEl.removeEventListener('loadedmetadata', onReady);
      videoEl.removeEventListener('canplay', onReady);
      resolve();
    };
    videoEl.addEventListener('loadedmetadata', onReady);
    videoEl.addEventListener('canplay', onReady);
  });

  navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: 'environment' },
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  })
    .then((stream) => {
      scannerStream = stream;
      video.srcObject = stream;
      const playPromise = video.play();
      return (playPromise && playPromise.catch) ? playPromise.catch(() => {}) : playPromise;
    })
    .then(() => waitForVideoReady(video))
    .then(async () => {
      scannerWarmupUntil = Date.now() + 900;
      scannerDetector = null;
      if (canUseNative) {
        try {
          let supported = [];
          if (typeof BarcodeDetector.getSupportedFormats === 'function') {
            supported = await BarcodeDetector.getSupportedFormats();
          }
          const wanted = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
          const formats = supported.length ? wanted.filter(f => supported.includes(f)) : wanted;
          if (formats.length) {
            scannerDetector = new BarcodeDetector({ formats });
          } else {
            console.warn('[scanner] BarcodeDetector reports no supported formats – falling back to Quagga');
          }
        } catch (e) {
          console.warn('[scanner] BarcodeDetector init failed:', e);
          scannerDetector = null;
        }
      }

      if (scannerDetector) {
        startNativeScanning(video, status, sessionId);
      } else {
        status.textContent = translate('Loading decoder…');
        ensureQuaggaLoaded()
          .then(() => {
            if (sessionId !== scannerSessionId) return;
            if (!scannerStream) return;
            status.textContent = translate('Scanning…');
            status.className = 'scanner-status';
            startQuaggaFrameScanning(video, status, sessionId);
          })
          .catch((err) => {
            console.warn('[scanner] Quagga load failed:', err);
            if (sessionId !== scannerSessionId) return;
            status.textContent = translate('Decoder could not be loaded');
            status.className = 'scanner-status error';
          });
      }
    })
    .catch((err) => {
      console.warn('[scanner] camera init failed:', err);
      videoWrap.style.display = 'none';
      const name = (err && err.name) ? err.name : '';
      let msg;
      if (name === 'NotAllowedError' || name === 'SecurityError') {
        msg = inIframe
          ? translate('Camera blocked by iframe policy')
          : translate('Camera permission denied');
      } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
        msg = translate('No camera found');
      } else if (name === 'NotReadableError') {
        msg = translate('Camera is used by another app');
      } else {
        msg = translate('Camera not available') + (name ? ' (' + name + ')' : '');
      }
      status.textContent = msg;
      status.className = 'scanner-status error';
    });
}

function applyBarcodeLookupResult(code, name, bestCat, sessionId, price, listingId, imageUrl) {
  if (sessionId !== scannerSessionId) return;
  const status = document.getElementById('scannerStatus');
  const trimName = (name || code).trim();
  const nameKey = trimName.toLowerCase();
  const existing = (state.items || []).find(i => !i.inCart && i.name.toLowerCase() === nameKey);
  const alreadyScanned = scannerAddedNames.has(nameKey);
  // Still treat as duplicate unless we can enrich the existing item (backfill category/price/listingId/imageUrl)
  const canEnrich = existing && ((!existing.category && bestCat) || (!existing.price && price) || (!existing.listingId && listingId) || (!existing.imageUrl && imageUrl));
  if ((existing || alreadyScanned) && !canEnrich) {
    status.textContent = '\u2713 ' + trimName + ' (' + translate('already in list') + ')';
    status.className = 'scanner-status success';
    showScannerResult('\u2713 ' + trimName, 'duplicate', translate('already in list'));
    resumeScanning(1500);
    return;
  }
  const label = price ? (price + '  ' + trimName) : trimName;
  status.textContent = '\u2713 ' + label;
  status.className = 'scanner-status success';
  showScannerResult('\u2713 ' + label, '', bestCat);
  addScannedProduct(trimName, bestCat, price || '', listingId || '', imageUrl || '');
}

function matchLocalCategory(offCats) {
  const local = new Set();
  for (const cat of (state.categoryOrder || [])) local.add(cat);
  for (const item of (state.items || [])) {
    if (item.category) local.add(item.category);
  }
  if (!local.size || !offCats.length) return offCats[0] || '';
  for (const oc of offCats) {
    const ocL = oc.toLowerCase();
    for (const lc of local) {
      if (lc.toLowerCase() === ocL) return lc;
    }
  }
  for (const oc of offCats) {
    const ocL = oc.toLowerCase();
    for (const lc of local) {
      const lcL = lc.toLowerCase();
      if (ocL.includes(lcL) || lcL.includes(ocL)) return lc;
    }
  }
  return '';
}

function lookupBarcodeOpenFoodFacts(code) {
  return fetch('https://de.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?lc=de')
    .then(r => r.json())
    .then(data => {
      if (!data || data.status !== 1 || !data.product) return null;
      const p = data.product;
      const name = p.product_name_de || p.product_name || p.brands || code;
      const offCats = (p.categories || '').split(',').map(c => c.trim()).filter(Boolean);
      return { name, bestCat: matchLocalCategory(offCats) };
    });
}

function parseOpenGtinDbResponse(text) {
  if (!text) return null;
  const flat = text.replace(/\r?\n/g, ' ').replace(/---/g, ' ').trim();
  const data = {};
  const re = /([a-z_]+)=([\s\S]*?)(?=\s+[a-z_]+=|$)/gi;
  let m;
  while ((m = re.exec(flat)) !== null) {
    data[m[1].toLowerCase()] = m[2].trim();
  }
  if (!Object.keys(data).length || data.error !== '0') return null;
  return data;
}

function lookupBarcodeOpenGtinDb(code) {
  const url = 'https://opengtindb.org/api.php?ean=' + encodeURIComponent(code) + '&cmd=query&queryid=400000000';
  return fetch(url)
    .then(r => r.text())
    .then(text => {
      const data = parseOpenGtinDbResponse(text);
      if (!data) return null;
      const name = data.detailname || data.name || code;
      const cats = [data.maincat || '', data.subcat || ''].map(c => c.trim()).filter(Boolean);
      return { name, bestCat: matchLocalCategory(cats) };
    });
}

function lookupBarcodeExtApi(code) {
  if (!state.extApiEnabled || !window.__extApiHookUrl) return Promise.resolve(null);
  return fetch(window.__extApiHookUrl + encodeURIComponent(code))
    .then(r => r.json())
    .then(data => {
      if (!data || data.error) return null;
      const name = data.name || '';
      if (!name) return null;
      const cats = (data.category || '').split('/').map(c => c.trim()).filter(Boolean);
      return {
        name,
        bestCat: matchLocalCategory(cats),
        price: data.price || '',
        listingId: data.listingId || '',
        imageUrl: data.imageUrl || ''
      };
    })
    .catch(() => null);
}

function lookupBarcode(code, sessionId) {
  if (sessionId !== scannerSessionId) return;
  const status = document.getElementById('scannerStatus');
  status.textContent = translate('Looking up product…');
  status.className = 'scanner-status';

  lookupBarcodeExtApi(code)
    .then(product => product || lookupBarcodeOpenFoodFacts(code).catch(() => null))
    .then(product => product || lookupBarcodeOpenGtinDb(code).catch(() => null))
    .then(product => {
      if (sessionId !== scannerSessionId) return;
      if (product) {
        applyBarcodeLookupResult(code, product.name, product.bestCat, sessionId, product.price || '', product.listingId || '', product.imageUrl || '');
      } else {
        status.textContent = translate('Product not found') + ' (' + code + ')';
        status.className = 'scanner-status error';
        showScannerResult(translate('Product not found'), 'error', code);
        resumeScanning(2000);
      }
    })
    .catch(() => {
      if (sessionId !== scannerSessionId) return;
      status.textContent = translate('Lookup failed') + ' (' + code + ')';
      status.className = 'scanner-status error';
      showScannerResult(translate('Lookup failed'), 'error', code);
      resumeScanning(2000);
    });
}

function addScannedProduct(name, category, price, listingId, imageUrl) {
  if (!name) return;
  scannerAddedNames.add(name.toLowerCase());
  sdCall(selectedShoppingID(), 'AddScannedItem', ({
    name,
    category,
    amount: '1',
    price: price || '',
    listingId: listingId || '',
    imageUrl: imageUrl || ''
  }));
  resumeScanning(1500);
}

// ── Scroll-Containment (wie im ToDoList-Modul) ─────────────────────────────
// Verhindert, dass beim Scrollen die ganze Kachel/Visu mitscrollt: pro
// Scrollbereich werden wheel/touch-Gesten an den Rändern abgefangen und die
// Weiterleitung (stopPropagation) unterbunden; zusätzlich blockt ein
// dokument-weiter Handler jede Scroll-Geste außerhalb erlaubter Bereiche.
const SCROLL_AREA_SELECTOR = '.screen, .suggestions, .overlay-body, .scanner-body, .shop-strip, .menu-pop';

function bindScrollContainment(scrollEl) {
  if (!scrollEl) return;
  let lastTouchY = null;
  let startX = 0, startY = 0;
  let axis = null; // 'x' = horizontale Geste (z. B. Einkaufsvorschau) → durchlassen

  scrollEl.addEventListener('wheel', (e) => {
    // Horizontales Wheel/Trackpad (z. B. auf der Artikelleiste) NICHT abfangen —
    // die Weitergabe aber trotzdem stoppen. In der Symcon-Kachel haengt an window
    // ein von html-sdk.js gesetztes onwheel, das jedes deltaY an die Visualisierung
    // meldet; die scrollt daraufhin. Eine Magic Mouse liefert nie reines deltaY,
    // deshalb landete hier ein Teil jeder Wischgeste — gemessen 6 von 22 Ereignissen —
    // und die ganze Visu scrollte mit. Das default-Verhalten bleibt unberuehrt,
    // waagerechtes Scrollen funktioniert also weiter.
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { e.stopPropagation(); return; }
    const maxScrollTop = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    if (maxScrollTop <= 0) { e.preventDefault(); e.stopPropagation(); return; }
    const deltaY = e.deltaY || 0;
    if (deltaY === 0) { e.stopPropagation(); return; }
    const atTop = scrollEl.scrollTop <= 0;
    const atBottom = scrollEl.scrollTop >= maxScrollTop - 1;
    if ((deltaY < 0 && atTop) || (deltaY > 0 && atBottom)) e.preventDefault();
    e.stopPropagation();
  }, { passive: false });

  scrollEl.addEventListener('touchstart', (e) => {
    if (!e.touches || e.touches.length !== 1) { lastTouchY = null; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    lastTouchY = startY;
    axis = null;
    e.stopPropagation();
  }, { passive: true });

  scrollEl.addEventListener('touchmove', (e) => {
    if (!e.touches || e.touches.length !== 1) return;
    const currentX = e.touches[0].clientX;
    const currentY = e.touches[0].clientY;
    // Achse einmalig festlegen, sobald die Bewegung eindeutig ist
    if (axis === null) {
      const dx = Math.abs(currentX - startX);
      const dy = Math.abs(currentY - startY);
      if (dx > 8 || dy > 8) axis = dx > dy ? 'x' : 'y';
    }
    // Horizontale Geste (Einkaufsvorschau u. Ä.) unangetastet lassen — sonst
    // würde die vertikale Eindämmung das horizontale Scrollen blockieren.
    // Die Weitergabe wird dennoch gestoppt: html-sdk.js meldet touchmove an die
    // Visualisierung (postPosition), was dieselbe Mitscroll-Wirkung hat wie beim Rad.
    if (axis === 'x') { lastTouchY = currentY; e.stopPropagation(); return; }

    const maxScrollTop = Math.max(0, scrollEl.scrollHeight - scrollEl.clientHeight);
    if (maxScrollTop <= 0) { e.preventDefault(); e.stopPropagation(); return; }
    if (lastTouchY === null) { lastTouchY = currentY; e.stopPropagation(); return; }
    const deltaY = lastTouchY - currentY;
    const atTop = scrollEl.scrollTop <= 0;
    const atBottom = scrollEl.scrollTop >= maxScrollTop - 1;
    if ((deltaY < 0 && atTop) || (deltaY > 0 && atBottom)) e.preventDefault();
    e.stopPropagation();
    lastTouchY = currentY;
  }, { passive: false });

  scrollEl.addEventListener('touchend', () => { lastTouchY = null; axis = null; }, { passive: true });
  scrollEl.addEventListener('touchcancel', () => { lastTouchY = null; axis = null; }, { passive: true });
}

function setupScrollContainment() {
  // Vertikale Scrollbereiche einzeln absichern (die Container sind statisch;
  // ihr Inhalt wird per innerHTML erneuert, die Elemente bleiben bestehen)
  document.querySelectorAll('.screen, .suggestions, .overlay-body, .scanner-body')
    .forEach(bindScrollContainment);

  // Dokument-weit: jede Scroll-Geste außerhalb eines erlaubten Bereichs
  // unterbinden, damit die Kachel als Ganzes nicht mitscrollt. Über closest()
  // funktioniert das auch für später neu gerenderte Bereiche (z. B. .shop-strip).
  const outside = (target) =>
    !(target instanceof Element) || target.closest(SCROLL_AREA_SELECTOR) === null;
  // stopPropagation MUSS mit: preventDefault allein unterbindet nur das Scrollen
  // des Browsers, nicht die Meldung an die Visualisierung. html-sdk.js hoert dafuer
  // an window (onwheel / touchmove) — erst das Anhalten der Weitergabe verhindert,
  // dass die Symcon-Visu mitscrollt. Beide Handler greifen nur AUSSERHALB der
  // Scrollbereiche, die Wischgesten auf den Zeilen bleiben also unberuehrt (die
  // haengen ohnehin in der Capture-Phase an document und laufen vorher).
  document.addEventListener('wheel', (e) => {
    if (outside(e.target)) { e.preventDefault(); e.stopPropagation(); }
  }, { passive: false, capture: true });
  document.addEventListener('touchmove', (e) => {
    if (outside(e.target)) { e.preventDefault(); e.stopPropagation(); }
  }, { passive: false, capture: true });
}

// ── Hinweis für den Einkauf ────────────────────────────────────────────────
/* Ein freier Text, der zur Liste gehoert (nicht zum Geraet) und den die Ansage als
   Erstes vorliest. Gespeichert wird er im ShoppingList-Modul, App und Web-App
   teilen ihn sich also. */

function aktuellerHinweis() {

}

/** Rotes Ausrufezeichen an der Sprechblase, sobald ein Hinweis hinterlegt ist. */

}

function hinweisOeffnen() {

// ── Einkaufs-Ansage: Liste vorlesen, per Kopfhörer bedienen ────────────────
/* Am Geraet gemessen (iPhone, iOS 18.7 / Safari 26.6, AirPods):
   1. Eine STILLE ENDLOSSPUR haelt die Fernbedienung bei uns — Tastendruecke kamen
      noch 154 s nach der Ansage an. Ohne sie war nur der Bereich weniger Sekunden
      belegt; im Laden liegt zwischen Ansage und Bestaetigung deutlich mehr.
   2. Mit laufender stiller Spur kommt JEDER Tastendruck als 'pause' an. Ein von
      uns gesetztes playbackState='paused' ueberschreibt iOS wieder auf 'playing'
      — darauf ist also kein Verlass.
   Deshalb haengt die Bedienung NICHT daran, welche Aktion ankommt: 'play' und
   'pause' laufen beide in ansageTaste(), entschieden wird nach unserem eigenen
   Zustand. Ein Tipp tut damit immer das Naheliegende:
      spricht   → anhalten
      pausiert  → fortsetzen
      beendet   → abhaken und naechster Artikel                                */

const ansage = {
  aktiv: false,
  instanz: null,
  schritte: [],        // [{ art:'kategorie'|'artikel', text, itemId, name }]
  index: -1,
  zustand: 'beendet',  // 'spricht' | 'pausiert' | 'beendet'
  clips: [],           // je Schritt-Position eine Blob-URL (NICHT nach Text:
                       // das Gateway normalisiert die Texte und schickt eine
                       // andere Fassung zurueck als die hingeschickte)
  zuletzt: null,       // { itemId } fuer Rueckgaengig
};
let ansageAudio = null;
let ansageStille = null;

/** Kurzer, fast lautloser Ton als Endlosspur — echte digitale Null halten
 *  manche Systeme nicht fuer Wiedergabe und geben die Fernbedienung frei. */
function ansageStilleUrl() {
  const rate = 22050, sek = 2, n = rate * sek;
  const buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
  const s = (p, t) => { for (let i = 0; i < t.length; i++) dv.setUint8(p + i, t.charCodeAt(i)); };
  s(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  s(36, 'data'); dv.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    dv.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 30 * i / rate) * 12), true);
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

/** Steht die Sprachausgabe zur Verfuegung? Nur in der ausgelieferten Web-App —
 *  die Visu-Kachel erreicht die Gateway-API nicht. */
function ansageMoeglich() {
  return !!window.__SYMDO__ && 'mediaSession' in navigator;
}

function apiBasis() {
  return (window.__SYMDO__ && window.__SYMDO__.apiBase) || '/hook/lists/app/v1';
}
function apiToken() {
  try { return ls.get('symdo.token') || ''; } catch (e) { return ''; }
}

/** Holt einen erzeugten Schnipsel als Blob-URL — in der Visu-Kachel als data:-URL. */
function ansageClipHolen(hash) {
  // Die Kachel hat keinen Token, GET /v1/tts/{hash} würde mit 401 abgewiesen.
  // Ihr einziger Weg nach draußen ist das Relay; das liefert denselben Schnipsel
  // als data:-URL, die <audio>.src genauso frisst wie eine Blob-URL.
  if (!window.__SYMDO__) {
    return aiPost('/ttsclip', { hash: hash })
      .then(a => (a && a.json && a.json.ok && a.json.dataUrl) ? a.json.dataUrl : null)
      .catch(() => null);
  }
  const headers = {};
  const token = apiToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(apiBasis() + '/tts/' + hash, { headers: headers, credentials: 'omit' })
    .then(r => (r.ok ? r.blob() : null))
    .then(b => (b ? URL.createObjectURL(b) : null))
    .catch(() => null);
}

/** Warteschlange aus der Einkaufsansicht — exakt die sichtbare Reihenfolge,
 *  also der Laufweg aus der Kategorie-Reihenfolge. Beim Wechsel der Abteilung
 *  geht eine eigene Ansage voran. */
function ansageSchritteBauen(st) {
  const schritte = [];
  // Der Hinweis kommt vor allem anderen — er gilt fuer den ganzen Einkauf.
  const hinweis = String(st.hint || '').trim();
  if (hinweis) {
    schritte.push({ art: 'hinweis', text: hinweis });
  }
  for (const sec of openSections(st)) {
    schritte.push({ art: 'kategorie', text: translate('Section') + ' ' + sec.category, name: sec.category });
    for (const it of sec.items) {
      const menge = String(it.amount || '').trim();
      const name  = String(it.name || '').trim();
      // Notiz als Nachsatz, durch Komma abgesetzt — „500 Gramm Butter, salzig."
      // Deckt sie nur den Artikelnamen noch einmal ab, bleibt sie weg.
      const notiz = String(it.notes || '').trim();
      const doppelt = notiz !== '' &&
        (notiz.toLowerCase() === name.toLowerCase() || name.toLowerCase().includes(notiz.toLowerCase()));
      schritte.push({
        art: 'artikel',
        text: (menge ? menge + ' ' : '') + name + (notiz && !doppelt ? ', ' + notiz : ''),
        itemId: it.id,
        name: name,
        kategorie: sec.category,
      });
    }
  }
  // Abschluss-Ansage, sobald mindestens ein Artikel dabei ist. Sie haakt nichts ab
  // und wartet nicht auf einen weiteren Tipp — nach ihr endet der Einkauf von selbst.
  if (schritte.some(s => s.art === 'artikel')) {
    schritte.push({ art: 'abschluss', text: translate('Shopping complete. All items are in your cart.') });
  }
  return schritte;
}

/** Anzeigename der laufenden Liste — steht im Store, nicht im Zustand. */
function ansageListenName() {
  const inst = (store.instances || []).find(i => String(i.id) === String(ansage.instanz));
  return inst ? String(inst.name || '') : '';
}

function ansageMediaSession(schritt) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: schritt ? schritt.text : translate('Shopping'),
      artist: ansageListenName() || translate('Shopping list'),
      album: translate('Shopping'),
    });
  } catch (e) { /* Metadaten sind Beiwerk */ }
}

/** Alle Tastendruecke landen hier — siehe Messung im Kopf dieses Blocks. */
function ansageTaste() {
  if (!ansage.aktiv) return;
  if (ansage.zustand === 'spricht') {
    ansageAudio.pause();
    ansage.zustand = 'pausiert';
    ansageLeisteZeichnen();
    return;
  }
  if (ansage.zustand === 'pausiert') {
    ansage.zustand = 'spricht';
    ansageAudio.play().catch(() => { ansage.zustand = 'beendet'; ansageLeisteZeichnen(); });
    ansageLeisteZeichnen();
    return;
  }
  ansageBestaetigen();
}

/** Weiter zum naechsten Schritt, OHNE den Artikel abzuhaken. Auf einem Knopf und
 *  nicht auf einer Kopfhoerer-Geste: ein Doppeltipp schickt play und nextTrack mit
 *  unvorhersagbarem Abstand, das war nicht verlaesslich zu bekommen. */
function ansageUeberspringen() {
  if (!ansage.aktiv) return;
  ansageSpielen(ansage.index + 1);
}

/** Aktuellen Artikel abhaken und weitergehen. Kategorie-Ansagen haben nichts
 *  zum Abhaken — dort wird nur weitergeschaltet. */
function ansageBestaetigen() {
  const jetzt = ansage.schritte[ansage.index];
  if (jetzt && jetzt.art === 'artikel') {
    sdCall(ansage.instanz, 'ToggleCart', { id: jetzt.itemId, inCart: true });
    ansage.zuletzt = { itemId: jetzt.itemId, index: ansage.index };
  }
  ansageSpielen(ansage.index + 1);
}

/** Letzte Buchung zuruecknehmen und den Artikel erneut ansagen. */
function ansageRueckgaengig() {
  if (!ansage.zuletzt) return;
  sdCall(ansage.instanz, 'ToggleCart', { id: ansage.zuletzt.itemId, inCart: false });
  const ziel = ansage.zuletzt.index;
  ansage.zuletzt = null;
  ansageSpielen(ziel);
}

function ansageSpielen(index) {
  if (index >= ansage.schritte.length) {
    ansageFertig();
    return;
  }
  ansage.index = index;
  const schritt = ansage.schritte[index];
  const url = ansage.clips[index];
  ansageMediaSession(schritt);
  ansageLeisteZeichnen();
  if (!url) {
    // Kein Ton fuer diesen Schritt (Erzeugung fehlgeschlagen): nicht haengen
    // bleiben, sondern als bereits gesprochen behandeln. Beim Abschluss gibt es
    // nichts mehr zu tippen — also gleich sauber beenden.
    if (schritt.art === 'abschluss') { ansageFertig(); return; }
    ansage.zustand = 'beendet';
    ansageLeisteZeichnen();
    return;
  }
  ansage.zustand = 'spricht';
  // NACH dem Setzen erneut zeichnen: die Leiste oben wurde noch mit dem alten
  // Zustand gemalt, sonst blieb waehrend der Ansage das Warte-Symbol stehen.
  ansageLeisteZeichnen();
  ansageAudio.src = url;
  ansageAudio.play().catch(() => { ansage.zustand = 'beendet'; ansageLeisteZeichnen(); });
}

function ansageFertig() {
  // Kann aus mehreren Wegen kommen (ended-Handler, fehlender Ton, Weiterschalten
  // ueber das Ende): nur einmal aufraeumen.
  if (!ansage.aktiv) return;
  ansage.zustand = 'beendet';
  ansage.index = ansage.schritte.length;
  ansageLeisteZeichnen();
  showToast(translate('Shopping finished'));
  ansageBeenden();
}

function ansageBeenden() {
  ansage.aktiv = false;
  ansage.zustand = 'beendet';
  ansage.schritte = [];
  ansage.index = -1;
  ansage.zuletzt = null;
  for (const url of ansage.clips) { if (url) { try { URL.revokeObjectURL(url); } catch (e) {} } }
  ansage.clips = [];
  if (ansageAudio) { ansageAudio.pause(); ansageAudio.removeAttribute('src'); }
  if (ansageStille) { ansageStille.pause(); }
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.metadata = null; } catch (e) {}
  }
  ansageLeisteZeichnen();
  renderShopping();
}

/** Laufleiste auffrischen. Ohne Argument steht der laufende Schritt drin,
 *  mit Text (z. B. beim Vorbereiten) dieser stattdessen. */
function ansageLeisteZeichnen(text) {
  const leiste = document.getElementById('ansageLeiste');
  if (!leiste) return;
  if (!ansage.aktiv) { leiste.hidden = true; ansageHervorheben(null); return; }
  leiste.hidden = false;

  const schritt = ansage.schritte[ansage.index] || null;
  // Umschalten statt Neu-Erzeugen: icons.js hat die <i> beim Laden ersetzt, ein
  // frisch eingefuegtes bliebe leer. Alle Varianten stehen im Markup.
  const zustandFuerSymbol = ansage.zustand === 'spricht' ? 'spricht'
                          : ansage.zustand === 'pausiert' ? 'pausiert' : 'wartet';
  // setAttribute statt el.hidden: icons.js hat aus den <i> echte <svg> gemacht,
  // und `hidden` ist eine Eigenschaft von HTMLElement — auf einem SVGElement legt
  // die Zuweisung nur eine wirkungslose JS-Eigenschaft an (gemessen: Attribut
  // bleibt aus, display bleibt block). Dann blieb immer das Start-Symbol stehen.
  const zeige = (el, sichtbar) => {
    if (sichtbar) { el.removeAttribute('hidden'); } else { el.setAttribute('hidden', ''); }
  };
  leiste.querySelectorAll('.ansage-symbol [data-sym]').forEach((el) => {
    zeige(el, el.dataset.sym === zustandFuerSymbol);
  });
  // Waehrend des Sprechens haelt ein Tipp an, sonst geht er weiter.
  const aktion = ansage.zustand === 'spricht' ? 'pause' : 'weiter';
  leiste.querySelectorAll('#ansageWeiter [data-akt]').forEach((el) => {
    zeige(el, el.dataset.akt === aktion);
  });
  document.getElementById('ansageWeiter').setAttribute(
    'aria-label', aktion === 'pause' ? translate('Pause') : translate('Next'));

  document.getElementById('ansageArtikel').textContent =
    text || (schritt ? schritt.text : translate('Shopping'));

  // Fortschritt zaehlt nur Artikel — Abteilungs-Ansagen sind kein Einkauf.
  const artikel = ansage.schritte.filter(x => x.art === 'artikel');
  const erledigt = ansage.schritte
    .slice(0, Math.max(0, ansage.index))
    .filter(x => x.art === 'artikel').length;
  document.getElementById('ansageFortschritt').textContent = text
    ? ''
    : (erledigt + ' / ' + artikel.length + ' · ' + (
        ansage.zustand === 'spricht'  ? translate('Speaking')
      : ansage.zustand === 'pausiert' ? translate('Paused')
      : translate('Tap to continue')));

  // Ausblenden statt abblenden: ein dauerhaft blasser Knopf sieht aus wie ein
  // Gestaltungsfehler, und am Anfang gibt es nie etwas zurueckzunehmen.
  zeige(document.getElementById('ansageZurueck'), !!ansage.zuletzt);
  ansageHervorheben(schritt && schritt.art === 'artikel' ? schritt.itemId : null);
}

/** Den gerade angesagten Artikel in der Liste markieren. */
function ansageHervorheben(itemId) {
  const bereich = document.getElementById('shoppingListArea');
  if (!bereich) return;
  bereich.querySelectorAll('.ansage-aktiv').forEach(n => n.classList.remove('ansage-aktiv'));
  if (itemId === null || itemId === undefined) return;
  const karte = bereich.querySelector('[data-id="' + CSS.escape(String(itemId)) + '"]');
  if (karte) karte.classList.add('ansage-aktiv');
}

async function ansageStarten() {
  const id = selectedShoppingID();
  const st = id ? instState(id) : null;
  if (!st) return;

  const schritte = ansageSchritteBauen(st);
  if (schritte.length === 0) { showToast(translate('The list is empty.')); return; }

  // Tonspuren SYNCHRON in der Nutzergeste anstossen: danach darf das Element
  // auch ohne weitere Geste abspielen. Ohne diesen Schritt verweigert iOS die
  // erste Ansage, weil bis dahin Netzwerkaufrufe dazwischenliegen.
  if (!ansageAudio) {
    ansageAudio = new Audio();
    ansageAudio.preload = 'auto';
    ansageAudio.addEventListener('ended', () => {
      ansage.zustand = 'beendet';
      ansageLeisteZeichnen();
      // Die Abschluss-Ansage laeuft ohne weiteren Tipp aus: sobald sie fertig ist,
      // ist der Einkauf vorbei.
      const jetzt = ansage.schritte[ansage.index];
      if (jetzt && jetzt.art === 'abschluss') ansageFertig();
    });
    ansageStille = new Audio(ansageStilleUrl());
    ansageStille.loop = true;
    ansageStille.preload = 'auto';
    for (const name of ['play', 'pause', 'stop', 'nexttrack', 'previoustrack']) {
      try {
        navigator.mediaSession.setActionHandler(name,
          name === 'previoustrack' ? () => ansageRueckgaengig()
          : name === 'stop' ? () => ansageBeenden()
          : () => ansageTaste());
      } catch (e) { /* nicht jede Aktion gibt es ueberall */ }
    }
  }
  const stilleUrl = ansageStille.src;
  ansageAudio.src = stilleUrl;
  ansageAudio.play().catch(() => {});
  ansageStille.play().catch(() => {});

  ansage.aktiv = true;
  ansage.instanz = id;
  ansage.schritte = schritte;
  ansage.index = -1;
  ansage.zustand = 'beendet';
  ansage.zuletzt = null;
  ansageLeisteZeichnen(translate('Preparing announcements…'));

  const texte = schritte.map(s => s.text);
  const antwort = await aiPost('/tts', { texts: texte });
  if (!antwort || antwort.status !== 200 || !antwort.json || !Array.isArray(antwort.json.clips)) {
    const code = antwort && antwort.json ? String(antwort.json.error || antwort.json.code || '') : '';
    showToast(code === 'tts_restart_required'
      ? translate('Speech output was just installed — restart IP-Symcon once.')
      : translate('Speech output is not available.'));
    ansageBeenden();
    return;
  }

  // Alle Schnipsel vor dem Losgehen holen: im Laden ist der Empfang oft schlecht.
  // Zugeordnet wird ueber c.i — die Position im hingeschickten Feld.
  ansage.clips = new Array(schritte.length).fill(null);
  const offen = antwort.json.clips.filter(c => c && c.ok && c.hash);
  for (let i = 0; i < offen.length; i += 4) {
    const teil = offen.slice(i, i + 4);
    const urls = await Promise.all(teil.map(c => ansageClipHolen(c.hash)));
    teil.forEach((c, k) => {
      const pos = Number.isInteger(c.i) ? c.i : -1;
      if (urls[k] && pos >= 0 && pos < ansage.clips.length) ansage.clips[pos] = urls[k];
    });
    if (!ansage.aktiv) return;   // zwischendurch beendet
    ansageLeisteZeichnen(translate('Preparing announcements…') +
      ' ' + Math.min(i + teil.length, offen.length) + '/' + offen.length);
  }
  ansageSpielen(0);
}

  function aiDownscale(file, maxEdge, quality) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const w = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }

  // Liest eine Datei (z.B. PDF) als data:-URL (base64). Der Backend-Endpoint strippt den Prefix.
  function aiReadFileB64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ''));
      r.onerror = () => reject(new Error('read'));
      r.readAsDataURL(file);
    });
  }

  function aiStatus(html) { aiBody.innerHTML = '<div class="ai-status">' + html + '</div>'; }

  function runAiExtract(payload) {
    aiAdd.disabled = true;
    const statusMsg = (payload && payload.pdf) ? translate('Analyzing file…') : translate('Analyzing photo…');
    aiStatus('<div class="ai-spinner"></div>' + statusMsg);
    openOverlay('aiReviewOverlay');
    const done = (res) => {
      const j = res && res.json;
      if (!res || res.status !== 200 || !j || j.ok !== true) {
        const msg = (j && j.error && j.error.message) || translate('AI request failed.');
        aiStatus(escapeHtml(msg));
        return;
      }
      renderAiReview(Array.isArray(j.todos) ? j.todos : []);
    };
    const fail = () => aiStatus(translate('Could not reach the AI service.'));
    // aiPost wählt den Transport: Standalone REST/Adapter, Visu-Kachel requestAction-Relay.
    aiPost('/ai/extract', payload).then(done).catch(fail);
  }

  function runAiIngredients(payload) {
    aiAdd.disabled = true;
    if (aiFav) { aiFav.style.display = 'none'; aiFav.disabled = true; }
    const statusMsg = (payload && payload.url) ? translate('Reading recipe…')
      : (payload && payload.pdf) ? translate('Analyzing file…') : translate('Analyzing photo…');

    openOverlay('aiReviewOverlay');
    const srcUrl = (payload && payload.url) ? String(payload.url) : '';
    const srcImage = (payload && payload.image) ? String(payload.image) : '';
    const srcPdf = (payload && payload.pdf) ? String(payload.pdf) : '';
    const srcPdfName = (payload && payload.pdfName) ? String(payload.pdfName) : '';
    const done = (res) => {
      const j = res && res.json;
      if (!res || res.status !== 200 || !j || j.ok !== true) {
        const msg = (j && j.error && j.error.message) || translate('AI request failed.');
        aiStatus(escapeHtml(msg));
        return;
      }
      renderAiShopping({ title: j.title, servings: j.servings, items: Array.isArray(j.items) ? j.items : [], url: srcUrl, image: srcImage, pdf: srcPdf, pdfName: srcPdfName });
    };
    const fail = () => aiStatus(translate('Could not reach the AI service.'));
    // Die Kategorien der GEWAEHLTEN Liste mitschicken: nur hier ist bekannt, wohin
    // die Artikel danach wandern. Das Gateway haelt das Modell darauf fest, sonst
    // erfindet es Kategorien, die es in der Liste nicht gibt (siehe
    // AiAllowedCategories). Ohne diesen Schluessel nimmt sie die Vereinigung aller
    // Einkaufslisten — richtig, aber unschaerfer.
    const kategorien = (instState(selectedShoppingID()) || {}).categoryOrder;
    const anfrage = Array.isArray(kategorien) && kategorien.length
      ? Object.assign({}, payload, { categories: kategorien })
      : payload;
    aiPost('/ai/ingredients', anfrage).then(done).catch(fail);
  }

  // Review-Overlay wird für ToDos und Einkaufs-/Rezept-Zutaten geteilt; der Modus steuert Zeilen + Übernahme.
  let aiReviewMode = 'todos';
  let aiRecipe = null;    // { title, servings, url, factor } — für die Einkaufs-/Rezeptansicht
  let aiFavItems = null;  // zwischengespeicherte Auswahl fürs Favoriten-Speichern
  let aiFavSelectedList = ''; // gewählte bestehende Favoritenliste ('' = neue Liste)

  // ── ToDo-Review ──
  function renderAiReview(rows) {
    aiReviewMode = 'todos';
    if (aiFav) aiFav.style.display = 'none';
    document.getElementById('aiReviewTitle').textContent = translate('Detected tasks');
    if (!rows.length) { aiStatus(translate('No tasks detected.')); aiAdd.disabled = true; return; }

        '<div class="ai-meta">' + dueChip + prioChip + '</div></div>';
      row.__todo = it;

      aiBody.appendChild(row);
    });
    updateAiAdd();
  }

  // ── Einkaufs-/Rezept-Review ──
  function fmtNum(n) {
    const r = Math.round(n * 100) / 100;
    const s = Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
    return s.replace('.', ',');
  }
  // Skaliert eine Mengenangabe (z.B. „500 g", „1,5 EL", „½ TL", „2-3", „1/2 Bund") um den Faktor.
  function scaleAmount(str, factor) {
    const s = String(str == null ? '' : str).trim();
    if (!s || factor === 1) return s;
    const FR = { '½': 0.5, '⅓': 1 / 3, '⅔': 2 / 3, '¼': 0.25, '¾': 0.75, '⅕': 0.2, '⅛': 0.125 };
    let m = s.match(/^([½⅓⅔¼¾⅕⅛])\s*(.*)$/);
    if (m) return fmtNum(FR[m[1]] * factor) + (m[2] ? ' ' + m[2] : '');
    m = s.match(/^(\d+)\s*\/\s*(\d+)\s*(.*)$/);
    if (m) return fmtNum((parseInt(m[1], 10) / parseInt(m[2], 10)) * factor) + (m[3] ? ' ' + m[3] : '');
    m = s.match(/^(\d+(?:[.,]\d+)?)(?:\s*[-–]\s*(\d+(?:[.,]\d+)?))?\s*(.*)$/);
    if (m) {
      const toN = x => parseFloat(x.replace(',', '.'));
      let out = fmtNum(toN(m[1]) * factor);
      if (m[2] != null) out += '–' + fmtNum(toN(m[2]) * factor);
      return out + (m[3] ? ' ' + m[3] : '');
    }
    return s;
  }
  function aiShopRowInner(it, factor) {
    const amt = scaleAmount(String(it.amount || ''), factor);
    const amtChip = amt ? '<span class="badge ai-amt">' + escapeHtml(amt) + '</span>' : '';
    const catChip = it.category ? '<span class="badge">' + escapeHtml(String(it.category)) + '</span>' : '';
    const meta = (amtChip || catChip) ? '<div class="ai-meta">' + amtChip + catChip + '</div>' : '';
    return '<span class="ai-box"><i class="fa-light fa-check"></i></span>' +
      '<div class="ai-main"><div class="ai-title">' + escapeHtml(String(it.name || '')) + '</div>' + meta + '</div>';
  }
  function renderAiShopping(data) {
    aiReviewMode = 'shopping';
    const items = Array.isArray(data.items) ? data.items : [];
    const servings = (typeof data.servings === 'number' && data.servings >= 1) ? Math.round(data.servings) : null;
    const title = data.title ? String(data.title) : '';
    // servings bekannt → freie Portionszahl (Start = servings, min 1); sonst ganzzahliger Mengen-Faktor.
    aiRecipe = { title: title, servings: servings, url: data.url || '', image: data.image || '', pdf: data.pdf || '', pdfName: data.pdfName || '', portions: servings, factor: 1 };
    document.getElementById('aiReviewTitle').textContent = translate('Detected items');
    if (aiFav) { aiFav.style.display = ''; aiFav.disabled = items.length === 0; }
    if (!items.length) { aiStatus(translate('No items detected.')); aiAdd.disabled = true; return; }
    aiBody.innerHTML = '';
    // Rezeptkopf: Titel + Portionen mit Mengen-Stepper (nur wenn es ein Rezept ist)
    if (title || servings) {
      const head = document.createElement('div');
      head.className = 'ai-recipe-head';
      let hh = '';
      if (title) hh += '<div class="ai-recipe-title">' + escapeHtml(title) + '</div>';
      hh += '<div class="ai-portions">' +
        '<button type="button" class="ai-step" id="aiStepMinus" aria-label="minus">–</button>' +
        '<span class="ai-portions-label" id="aiPortionsLabel"></span>' +
        '<button type="button" class="ai-step" id="aiStepPlus" aria-label="plus">+</button></div>';
      head.innerHTML = hh;
      aiBody.appendChild(head);
      document.getElementById('aiStepMinus').addEventListener('click', () => stepAi(-1));
      document.getElementById('aiStepPlus').addEventListener('click', () => stepAi(1));
    }
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'ai-row selected';
      row.__item = it;
      row.innerHTML = aiShopRowInner(it, 1);
      row.addEventListener('click', () => { row.classList.toggle('selected'); updateAiAdd(); });
      aiBody.appendChild(row);
    });
    updateAiPortions();
    updateAiAdd();
  }
  // Skalierungsfaktor: bei bekannter Portionszahl portions/servings (frei), sonst ganzzahliger Faktor.
  function aiCurrentFactor() {
    if (!aiRecipe) return 1;
    if (aiRecipe.servings) return aiRecipe.portions / aiRecipe.servings;
    return aiRecipe.factor;
  }
  function stepAi(delta) {
    if (!aiRecipe) return;
    if (aiRecipe.servings) {
      aiRecipe.portions = Math.max(1, aiRecipe.portions + delta);   // freie Portionszahl, min 1
    } else {
      aiRecipe.factor = Math.max(1, Math.round(aiRecipe.factor + delta));
    }
    const f = aiCurrentFactor();
    aiBody.querySelectorAll('.ai-row').forEach(row => {
      const it = row.__item || {};
      const chip = row.querySelector('.ai-amt');
      if (chip) chip.textContent = scaleAmount(String(it.amount || ''), f);
    });
    updateAiPortions();
  }
  function updateAiPortions() {
    const lbl = document.getElementById('aiPortionsLabel');
    if (!lbl || !aiRecipe) return;
    lbl.textContent = aiRecipe.servings
      ? translate('%1 servings').replace('%1', String(aiRecipe.portions))
      : translate('Quantity ×%1').replace('%1', String(aiRecipe.factor));
    const minus = document.getElementById('aiStepMinus');
    if (minus) minus.disabled = aiRecipe.servings ? (aiRecipe.portions <= 1) : (aiRecipe.factor <= 1);
  }
  // Ausgewählte Zutaten mit skalierten Mengen (für Warenkorb + Favoriten).
  function selectedAiItems() {
    const factor = aiCurrentFactor();
    return Array.prototype.map.call(aiBody.querySelectorAll('.ai-row.selected'), row => {
      const it = row.__item || {};
      return {
        name: String(it.name || ''),
        category: String(it.category || ''),
        amount: (scaleAmount(String(it.amount || ''), factor).trim() || '1'),
        notes: ''
      };
    });
  }

  function updateAiAdd() {
    const n = aiBody.querySelectorAll('.ai-row.selected').length;
    aiAdd.disabled = n === 0;
    if (aiReviewMode === 'shopping') {
      aiAdd.innerHTML = '<i class="fa-light fa-cart-plus"></i>';
      if (aiFav) aiFav.disabled = n === 0;
    } else {
      aiAdd.textContent = n > 0 ? translate('Add') + ' (' + n + ')' : translate('Add');
    }
  }

  function aiDueFields(due) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(due || ''));
    if (!m) return { due: 0, dueAllDay: false };
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return { due: Math.floor(d.getTime() / 1000), dueAllDay: true, dueDay: m[0] };
  }

  // Übernehmen: Einkauf → Warenkorb (skalierte Mengen); ToDo → Aufgaben.
  aiAdd.addEventListener('click', () => {
    if (aiReviewMode === 'shopping') {
      const items = selectedAiItems();
      if (!items.length) return;
      const target = selectedShoppingID();
      items.forEach(it => sdCall(target, 'AddItem', { name: it.name, category: it.category, amount: it.amount }));
      closeOverlay('aiReviewOverlay');
      showToast(translate('%1 items added').replace('%1', String(items.length)));
      return;
    }
    const rows = aiBody.querySelectorAll('.ai-row.selected');
    if (!rows.length) return;
    const me = currentUserID();
    const target = selectedTodoID();
    rows.forEach(row => {
      const t = row.__todo || {};
      const fields = Object.assign({
        title: String(t.title || ''), info: t.info ? String(t.info) : '',
        priority: t.priority || 'normal', quantity: 0,
        assignedTo: me ? [me] : [], recurrence: 'none', notification: false
      }, aiDueFields(t.due));
      if (me) fields.actorUserId = me;
      sdCall(target, 'AddItem', fields);
    });
    closeOverlay('aiReviewOverlay');
    showToast(translate('%1 tasks added').replace('%1', String(rows.length)));
  });

  // ── Favoriten-Speichern (Rezept → Favoritenliste) ──
  if (aiFav) aiFav.addEventListener('click', () => { if (!aiFav.disabled) openAiFav(); });
  document.getElementById('btnAiFavSave').addEventListener('click', doSaveAiFav);
  function openAiFav() {
    const items = selectedAiItems();
    if (!items.length) return;
    aiFavItems = items;
    aiFavSelectedList = '';
    document.getElementById('aiFavTitle').textContent = translate('Save to favorites');
    document.getElementById('btnAiFavCancel').textContent = translate('Cancel');
    document.getElementById('btnAiFavSave').textContent = translate('Save');
    renderAiFav();
    openOverlay('aiFavOverlay');
  }
  function renderAiFav() {
    const st = instState(selectedShoppingID()) || {};
    const lists = (Array.isArray(st.favoriteLists) ? st.favoriteLists.slice() : []).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base', numeric: true }));
    const prefill = (aiRecipe && aiRecipe.title) ? aiRecipe.title : '';
    const body = document.getElementById('aiFavBody');
    let h = '';
    // Zuerst „Neue Liste" (Name + Rezeptquelle), darunter die bestehenden Listen.
    h += '<div class="ai-fav-section" id="aiFavNewHead">' + escapeHtml(translate('New favorite list')) + '</div>';
    // Rezeptquelle (Foto/Datei → Medienobjekt, URL → Link) ist nur bei einer NEUEN Liste speicherbar.
    if (aiRecipe && (aiRecipe.image || aiRecipe.pdf || aiRecipe.url)) {
      const lbl = aiRecipe.image ? translate('Save recipe photo')
        : aiRecipe.pdf ? translate('Save recipe file') : translate('Save recipe link');
      h += '<label class="ai-fav-toggle" id="aiFavToggleWrap"><input type="checkbox" id="aiFavSaveSource" checked /> ' + escapeHtml(lbl) + '</label>';
    }
    h += '<div class="ai-fav-new" id="aiFavNewWrap"><input id="aiFavNewName" type="text" value="' + escapeHtml(prefill) + '" placeholder="' + escapeHtml(translate('New list name')) + '" /></div>';
    if (lists.length) {
      h += '<div class="ai-fav-section">' + escapeHtml(translate('Add to existing list')) + '</div>';
      h += lists.map(l => {
        const count = (l.items || []).length;
        const cnt = count === 1 ? translate('1 item') : translate('%1 items').replace('%1', String(count));
        return '<div class="fav-row" data-list="' + escapeHtml(String(l.id)) + '">' +
          '<span class="fav-badge">' + HEART_SOLID_SVG + '</span>' +
          '<span class="fav-main"><span class="fav-name">' + escapeHtml(String(l.name || '')) + '</span>' +
          '<span class="fav-count">' + escapeHtml(cnt) + '</span></span>' +
          '<i class="fa-light fa-check check"></i></div>';
      }).join('');
    }
    body.innerHTML = h;
    body.querySelectorAll('.fav-row[data-list]').forEach(row => row.addEventListener('click', () => {
      // Einzelauswahl mit Haken; erneuter Klick hebt die Auswahl wieder auf.
      aiFavSelectedList = (aiFavSelectedList === row.dataset.list) ? '' : row.dataset.list;
      updateAiFavControls();
    }));
    updateAiFavControls();
  }
  // Auswahl markieren; bei gewählter Bestandsliste die „Neue Liste"-Bedienelemente + Quelle-Schalter ausgrauen/deaktivieren.
  function updateAiFavControls() {
    const hasSel = !!aiFavSelectedList;
    document.querySelectorAll('#aiFavBody .fav-row[data-list]').forEach(row => {
      row.classList.toggle('selected', row.dataset.list === aiFavSelectedList);
    });
    const nameEl = document.getElementById('aiFavNewName');
    const srcEl = document.getElementById('aiFavSaveSource');
    if (nameEl) nameEl.disabled = hasSel;
    if (srcEl) srcEl.disabled = hasSel;
    ['aiFavNewHead', 'aiFavToggleWrap', 'aiFavNewWrap'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.toggle('disabled', hasSel); });
  }
  // „Speichern": gewählte Bestandsliste ODER (keine Auswahl + Name) neue Liste.
  function doSaveAiFav() {
    if (aiFavSelectedList) { saveAiFav({ listId: aiFavSelectedList }); return; }
    const nameEl = document.getElementById('aiFavNewName');
    const name = nameEl ? nameEl.value.trim() : '';
    if (!name) { showToast(translate('Select a list or enter a name.')); return; }
    saveAiFav({ name: name });
  }
  function saveAiFav(target) {
    const items = aiFavItems || selectedAiItems();
    if (!items.length) return;
    const id = selectedShoppingID();
    const isNew = !target.listId;   // Quelle (URL/Bild) nur bei neuer Liste
    const srcEl = document.getElementById('aiFavSaveSource');
    const saveSrc = isNew && (!srcEl || srcEl.checked);
    const base = { items: items };
    if (target.listId) base.listId = target.listId;
    if (target.name) base.name = target.name;
    const finish = (extra) => {
      sdCall(id, 'AddItemsToFavoriteList', Object.assign({}, base, extra || {}));
      closeOverlay('aiFavOverlay');
      closeOverlay('aiReviewOverlay');
      showToast(translate('%1 items saved to favorites').replace('%1', String(items.length)));
    };
    const saveMedia = (payload) => {
      aiPost('/ai/savephoto', payload).then(res => {
        const j = res && res.json;
        const mediaId = (j && j.ok && j.mediaId) ? j.mediaId : 0;
        finish(mediaId ? { mediaId: String(mediaId) } : {});
      }).catch(() => finish({}));
    };
    if (saveSrc && aiRecipe && aiRecipe.image) {
      // Foto als Medienobjekt speichern → Medien-ID auf der Liste hinterlegen
      saveMedia({ image: aiRecipe.image, name: (aiRecipe.title || translate('Recipe photo')) });
    } else if (saveSrc && aiRecipe && aiRecipe.pdf) {
      // PDF als Medienobjekt speichern → Medien-ID auf der Liste hinterlegen
      saveMedia({ pdf: aiRecipe.pdf, name: (aiRecipe.title || aiRecipe.pdfName || translate('Recipe file')) });
    } else if (saveSrc && aiRecipe && aiRecipe.url) {
      finish({ url: String(aiRecipe.url) });
    } else {
      finish({});
    }
  }

  // ToDo-Editor: Sichtbarkeits-Logik
  document.getElementById('tdHasDue').addEventListener('change', syncTodoEditorVisibility);
  document.getElementById('tdRecurrence').addEventListener('change', syncTodoEditorVisibility);
  document.getElementById('tdNotification').addEventListener('change', syncTodoEditorVisibility);
  document.getElementById('tdAllDay').addEventListener('change', () => {
    const input = document.getElementById('tdDueDate');
    const allDay = document.getElementById('tdAllDay').checked;
    // input.type ist hier noch der ALTE Typ: ein 'date'-Wert (YYYY-MM-DD) würde
    // von new Date() als UTC interpretiert (Tagesversatz) — lokal parsen
    const raw = input.value;
    let current = new Date();
    const dOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
    if (dOnly) {
      current = new Date(parseInt(dOnly[1]), parseInt(dOnly[2]) - 1, parseInt(dOnly[3]));
    } else if (raw) {
      const parsed = new Date(raw);
      if (!isNaN(parsed.getTime())) current = parsed;
    }
    updateTodoDueInput(allDay, current);
  });
  document.getElementById('tdQtyMinus').addEventListener('click', () => {
    tdQuantity = Math.max(0, tdQuantity - 1);
    document.getElementById('tdQtyValue').textContent = tdQuantity > 0 ? String(tdQuantity) : '–';
  });
  document.getElementById('tdQtyPlus').addEventListener('click', () => {
    tdQuantity = Math.min(99, tdQuantity + 1);
    document.getElementById('tdQtyValue').textContent = tdQuantity > 0 ? String(tdQuantity) : '–';
  });

  // Scanner
  document.getElementById('btnOpenScanner').addEventListener('click', () => {
    if (typeof openScannerOverlay === 'function') openScannerOverlay();
  });
  document.getElementById('btnScannerClose').addEventListener('click', () => {
    if (typeof closeScannerOverlay === 'function') closeScannerOverlay();
  });

  setTab(activeTab);
  if (store.instances.length === 0) requestState();

  // ── Visu-Theme-Reporter (NUR als Kachel in der Visu, nicht als Web-App) ──
  // Die Visu injiziert --accent-color/--content-color/--card-color; serverseitig
  // gibt es dafür keine API. Als Kachel liest die UI sie aus und meldet sie still
  // (ReportVisuTheme) — das Gateway liefert sie App/Web-App via Discovery aus.
  // window.__SYMDO__ existiert nur im Web-App-Kontext (Adapter) → dann NICHT melden.
  if (!window.__SYMDO__) {
    const themeToHex = (value) => {
      const v = String(value || '').trim();
      if (!v) return null;
      if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase();
      if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + v.slice(1).split('').map(c => c + c).join('').toLowerCase();
      let probe = v;
      if (!/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.test(probe)) {
        const el = document.createElement('span');
        el.style.color = v; document.body.appendChild(el);
        probe = getComputedStyle(el).color; el.remove();
      }
      const m = /^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(probe);
      if (!m) return null;
      return '#' + [m[1], m[2], m[3]].map(n => Math.max(0, Math.min(255, parseInt(n, 10))).toString(16).padStart(2, '0')).join('');
    };
    const reportVisuTheme = (force) => {
      try {
        const style = getComputedStyle(document.documentElement);
        const accent = themeToHex(style.getPropertyValue('--accent-color'));
        const content = themeToHex(style.getPropertyValue('--content-color'));
        const card = themeToHex(style.getPropertyValue('--card-color'));
        if (!accent || !content || !card) return;
        const r = parseInt(card.slice(1, 3), 16), g = parseInt(card.slice(3, 5), 16), b = parseInt(card.slice(5, 7), 16);
        const scheme = (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128 ? 'dark' : 'light';
        const payload = JSON.stringify({ scheme, accent, content, card });
        const guard = 'symdoVisuTheme:' + scheme;
        try { if (!force && ls.get(guard) === payload) return; ls.set(guard, payload); } catch (e) {}
        requestAction('ReportVisuTheme', payload);
      } catch (e) {}
    };
    window.setTimeout(() => reportVisuTheme(true), 2000);
    window.setInterval(() => reportVisuTheme(false), 30000);
  }

  // Revision-Poll (15 s, nur bei sichtbarem Dokument) + Minuten-Tick für
  // zeitabhängige Anzeigen (Fälligkeits-Chips, Dashboard)
  setInterval(() => {
    if (document.visibilityState === 'visible') checkRevisions();
  }, 15000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') checkRevisions();
  });
  setInterval(() => {
    if (document.visibilityState === 'visible') renderAll();
  }, 60000);
});
})();
</script>
