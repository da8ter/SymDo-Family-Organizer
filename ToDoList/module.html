  background: color-mix(in srgb, var(--accent) 70%, transparent);
  border-radius: 999px;
}
@supports not selector(::-webkit-scrollbar) {
  .overlay-body {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--accent) 70%, transparent) transparent;
  }
}
.form-row label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 4px;
}
.form-row.inline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.form-row.inline label { margin: 0; font-size: 14.5px; font-weight: 600; color: var(--text); }
.form-row.inline input[type="date"],
.form-row.inline input[type="datetime-local"],
.form-row.inline select { width: auto; max-width: 60%; }
/* Beginn und Ende im Termin-Editor stehen untereinander, also je in einer eigenen
   .form-row — die volle Breite (Grundregel fuer input) waere fuer „05.03.2027,
   16:30" aber sinnlos weit. Inhaltsbreit wie in der inline-Zeile darueber, mit
   max-width als Wache fuer schmale Geraete. */
#ceStart, #ceEnd { width: auto; max-width: 100%; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch .knob {
  position: absolute; inset: 0;
  border-radius: 999px;
  background: var(--surface2);
  transition: background .15s ease;
  pointer-events: none;
}
.switch .knob::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 999px;
  background: #fff;
  transition: transform .15s ease;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + .knob { background: var(--accent); }
.switch input:checked + .knob::after { transform: translateX(18px); }
.assign-list { display: flex; flex-wrap: wrap; gap: 8px; }
.assign-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 6px 6px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid transparent;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.assign-chip.selected {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  border-color: var(--accent);
}
.assign-chip .avatar {
  width: 24px; height: 24px;
  border-radius: 999px;
  object-fit: cover;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  flex: none;
}
/* KI-Review: erkannte Aufgaben mit Häkchen */
.ai-status { padding: 24px 4px; text-align: center; color: var(--muted); font-size: 14px; }
.ai-spinner {
  width: 28px; height: 28px; margin: 0 auto 12px; border-radius: 999px;
  border: 3px solid color-mix(in srgb, var(--content-color) 18%, transparent);
  border-top-color: var(--accent); animation: ai-spin .8s linear infinite;
}
@keyframes ai-spin { to { transform: rotate(360deg); } }
.ai-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 0; cursor: pointer;
  border-bottom: 1px solid color-mix(in srgb, var(--content-color) 8%, transparent);
}
.ai-row .ai-box {
  flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 6px;
  border: 2px solid color-mix(in srgb, var(--content-color) 30%, transparent);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px;
}
.ai-row.selected .ai-box { background: var(--accent); border-color: var(--accent); }
.ai-row .ai-box i { opacity: 0; }
.ai-row.selected .ai-box i { opacity: 1; }
.ai-main { flex: 1; min-width: 0; }
.ai-title { font-size: 15px; font-weight: 600; }
.ai-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
/* KI-Rezeptkopf: Titel + Portionen mit Mengen-Stepper */
.ai-recipe-head { padding: 2px 0 12px; margin-bottom: 6px; border-bottom: 1px solid color-mix(in srgb, var(--content-color) 12%, transparent); }
.ai-recipe-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.ai-portions { display: flex; align-items: center; gap: 12px; }
.ai-portions-label { font-size: 14px; color: var(--muted); }
.ai-step { flex: none; width: 30px; height: 30px; border-radius: 999px; font-size: 18px; line-height: 1; cursor: pointer; color: var(--content-color); border: 1px solid color-mix(in srgb, var(--content-color) 22%, transparent); background: color-mix(in srgb, var(--content-color) 6%, transparent); }
.ai-step:disabled { opacity: .35; cursor: default; }
/* KI: in Favoritenliste speichern */
.ai-fav-section { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.ai-fav-section:first-child { margin-top: 2px; }
.ai-fav-new { display: flex; gap: 8px; align-items: center; }
.ai-fav-new input { flex: 1; }
.ai-fav-toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 6px 0 2px; cursor: pointer; }
.ai-fav-toggle input { width: 18px; height: 18px; }
/* Bei gewählter Bestandsliste: „Neue Liste"-Bedienelemente ausgegraut + deaktiviert */
.ai-fav-section.disabled, .ai-fav-toggle.disabled, .ai-fav-new.disabled { opacity: .4; }
.ai-fav-toggle.disabled { cursor: default; }
.ai-fav-new input:disabled, .ai-fav-toggle input:disabled { cursor: not-allowed; }
/* „In Favoritenliste speichern"-Dialog: bestehende Listen wie in der Favoriten-Tab-Ansicht (.fav-row). */
#aiFavBody .fav-row .check, #favPickBody .fav-row .check { margin-left: auto; color: var(--accent); opacity: 0; font-size: 16px; flex: none; }
#aiFavBody .fav-row.selected .check, #favPickBody .fav-row.selected .check { opacity: 1; }
#aiFavBody .fav-row.selected, #favPickBody .fav-row.selected { box-shadow: inset 0 0 0 2px var(--accent); }
/* KI-Quelle wählen (Foto / URL) */
.ai-source-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 12px 14px; border-radius: 12px; cursor: pointer;
  font-size: 15px; font-weight: 600;
  border: 1px solid color-mix(in srgb, var(--content-color) 16%, transparent);
  background: color-mix(in srgb, var(--content-color) 6%, transparent);
  color: var(--content-color);
}
.ai-source-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.ai-or { display: flex; align-items: center; gap: 10px; margin: 12px 0; color: var(--muted); font-size: 13px; }
.ai-or::before, .ai-or::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--content-color) 12%, transparent); }
#aiUrlInput { width: 100%; margin-bottom: 10px; }
.overlay-footer {
  display: flex;
  gap: 10px;
  padding: 0 16px 16px;
}
.overlay-footer button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  font-weight: 700;
  background: var(--surface);
}
.overlay-footer button.primary { background: var(--accent); color: #fff; }
.overlay-footer button.destructive { color: var(--red); }
.overlay-footer button:disabled { opacity: .4; }

/* Menü-Popover */
.menu-pop {
  position: fixed;
  z-index: 70;
  min-width: 230px;
  background: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 5%);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.35);
  overflow: hidden;
  display: none;
}
.menu-pop.open { display: block; }
.menu-pop button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  font-size: 14.5px;
  white-space: normal;
  word-break: break-word;
}
.menu-pop button:active { background: var(--surface); }
.menu-pop button.destructive { color: var(--red); }
.menu-pop .menu-sep { height: 1px; background: var(--border); }
.menu-pop .menu-label { padding: 8px 14px 2px; font-size: 12px; color: var(--muted); font-weight: 700; }
.menu-pop button .check { margin-left: auto; color: var(--accent); }

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + 14px);
  transform: translateX(-50%) translateY(8px);
  background: rgba(0,0,0,.78);
  color: #fff;
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  opacity: 0;
  transition: opacity .2s ease, transform .2s ease;
  pointer-events: none;
  z-index: 80;
  max-width: 90%;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty-state {
  text-align: center;
  color: var(--muted);
  padding: 44px 16px;
}
/* /icons.js ersetzt <i> durch <svg class="svg-inline--fa"> (siehe Kommentar bei
   .tabbar) — ohne den svg-Selektor verschwindet Größe UND Abstand, sobald das
   Icon nachgeladen ist: display fällt auf inline-block zurück, margin-bottom
   greift gar nicht mehr, Icon und Text rücken zusammen. */
/* Als Block-Box braucht das Icon margin:auto, um zu zentrieren — text-align auf
   dem Elternelement wirkt nur auf INLINE-Inhalt, nicht auf Block-Boxen. Bisher
   klebte es links am Padding-Rand: gemessen 0px seitlicher Margin bei 38px
   Breite, Icon-Mitte bei 35px gegen eine Container-Mitte bei 245px. */
.empty-state i,
.empty-state svg { font-size: 34px; margin: 0 auto 10px; display: block; }
.empty-state .empty-hint {
  display: block;
  font-size: 13px;
  line-height: 1.4;
  margin: 8px auto 0;
  max-width: 260px;
  opacity: .75;
}

/* ── Scanner (aus dem ShoppingList-Modul übernommen) ──────────────────────── */
.scanner-body {
  flex: 1;
  min-height: 0;
  padding: var(--gap);
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: auto;
}
.scanner-video-wrap {
  position: relative;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #000;
  overflow: hidden;
  aspect-ratio: 4 / 3;
}
.scanner-video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scanner-scanline {
  position: absolute;
  left: 8%; right: 8%; top: 24%;
  height: 2px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(0,255,195,0) 0%, rgba(0,255,195,1) 50%, rgba(0,255,195,0) 100%);
  box-shadow: 0 0 10px rgba(0,255,195,.65);
  animation: scanner-line-move 2.1s ease-in-out infinite;
  pointer-events: none;
}
.scanner-result {
  position: absolute;
  left: 50%; top: 50%;
  z-index: 2;
  width: min(92%, 560px);
  padding: 14px 16px;
  border-radius: 14px;
  background: rgba(0,0,0,.68);
  color: #fff;
  font-size: clamp(16px, 4.2vw, 21px);
  font-weight: 600;
  line-height: 1.35;
  text-align: center;
  min-height: 0;
  opacity: 0;
  transform: translate(-50%, -46%);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}
.scanner-result.show { opacity: 1; transform: translate(-50%, -50%); }
.scanner-result.error { background: rgba(192,57,43,.78); }
@keyframes scanner-line-move {
  0% { top: 24%; opacity: .95; }
  50% { top: 76%; opacity: 1; }
  100% { top: 24%; opacity: .95; }
}
.scanner-status {
  display: block;
  font-size: 13px;
  color: var(--muted);
  min-height: 20px;
  text-align: center;
  padding: 6px 8px 0;
  word-break: break-word;
}
.scanner-status:empty { display: none; }
.scanner-status.success { color: #2e7d32; }
.scanner-status.error { color: #c0392b; }

/* ── Breite Bildschirme ─────────────────────────────────────────────────────
   Bis hierher ist die Oberfläche mobil-first und einspaltig. Ab hier nutzt sie
   die Fläche. ALLES steht in Media Queries, damit sich auf dem Telefon nichts
   verschiebt — die einzige Änderung an einer Basisregel ist der Deckel als
   Variable (--content-max, Default 720px = unverändert).

   Media Query, nicht Container Query: die Kachel ist ein eigenes Dokument mit
   eigenem Viewport (siehe .tabbar, die mit 100vw die Kachelbreite trifft). Eine
   SCHMALE Kachel in einem breiten Fenster bleibt damit korrekt einspaltig. */
@media (min-width: 820px)  { :root { --content-max: 1000px; } }
@media (min-width: 1250px) { :root { --content-max: 1400px; } }

/* Favoriten schmal: genau eine der beiden Spalten ist sichtbar — dasselbe
   Verhalten wie vor der Aufteilung in #favMaster/#favDetail. */
#screen-favorites:not(.detail-open) #favDetail { display: none; }
#screen-favorites.detail-open #favMaster { display: none; }

@media (min-width: 820px) {
  /* Zeilen und Karten fließen in Spalten. Die Spaltenzahl regelt auto-fill nach
     der verfügbaren Breite (2 bei 1000px, 3–4 bei 1400px) — deshalb genügt EIN
     Haltepunkt für das Raster.
     row-gap MUSS 0 bleiben: die Abstände kommen weiter aus margin-bottom der
     Zeilen. Mit einem row-gap bliebe beim Löschen eine Lücke stehen, weil
     dissolveCard() Höhe und margin-bottom zusammenfährt, den gap aber nicht. */
  #shoppingListArea, #todoListArea, #favMaster, #favDetail {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    column-gap: var(--gap);
    row-gap: 0;
    align-items: start;
  }

  /* Die Einkaufsliste rechnet in HALBEN Spalten, damit eine Kategorie mit zwei
     Artikeln die Reihe zu je einer Hälfte füllen kann (bei drei Spalten wären das
     1,5 Spalten — als Spur-Spanne nicht ausdrückbar). Also doppelt so viele Spuren
     wie Spalten; eine normale Karte nimmt zwei.
     Die Abstände gehen dabei exakt auf: bei 2N Spuren ist eine Karte über zwei
     Spuren 2t+g = (W-2g)/N, also genau die alte Spaltenbreite, und ein Paarling
     über N Spuren (W-g)/2 — zwei davon plus ein Abstand ergeben W.
     Feste Spaltenzahl statt auto-fill: gemessen liefert auto-fill 2 Spalten ab
     820px, 3 ab 1250px und 4 ab 1700px — genau die Stufen von --content-max, weil
     die Inhaltsbreite dazwischen nie über die nächste 360px-Schwelle kommt. Die
     Zahlen unten geben das eins zu eins wieder. Aufgaben und Favoriten bleiben auf
     auto-fill, sie brauchen die halben Spalten nicht. */
  #shoppingListArea { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #shoppingListArea > .item-card { grid-column: span 2; }
  /* Zwei Artikel in der Kategorie: bei zwei Spalten ist die halbe Reihe schon eine
     normale Karte — die Spanne bleibt hier also gleich. */
  #shoppingListArea > .item-card.span-half { grid-column: span 2; }
  #shoppingListArea > .item-card.span-all { grid-column: 1 / -1; }
  #dashboardContent {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    column-gap: var(--gap);
    row-gap: 0;
    align-items: start;
  }
  /* Überschriften, Filter, Aktionen und die Eingabezeile spannen über alle Spalten */
  .cat-header, .section-toggle, .empty-state, .screen-head,
  .dash-head, .member-bar, .kpi-grid, .segmented, .fav-actions,
  .suggestions, .composer { grid-column: 1 / -1; }

  /* Wochenring und Einkaufsvorschau bekommen im Raster jeweils eine eigene
     Zeile in voller Breite: der Ring ist eine breite, flache Karte, und die
     Einkaufsvorschau traegt einen waagerechten Artikelstreifen — beide wirken
     in einer schmalen Rasterspalte gequetscht. */
  .week-card, .shop-card, .dash-tasks, .briefing-card, .cal-preview { grid-column: 1 / -1; }

  /* Breite Anzeige: das Briefing steht ganz da, der Aufklapper entfaellt. Die
     JS-Messung blendet ihn zusaetzlich aus, sobald der Text nicht mehr ueberlaeuft
     — diese Regel ist die Zusicherung, jene der Feinschliff bei kurzen Texten. */
  .briefing-text.gekappt {
    display: block;
    -webkit-line-clamp: none;
    overflow: visible;
  }
  .briefing-mehr { display: none; }

  /* Breite Anzeige: Datum wieder in einer Zeile, Komma zwischen Wochentag und Tag. */
  .dash-date {
    flex-direction: row;
    align-items: center;
    gap: .35em;
  }
  .dash-date .dash-weekday::after { content: ','; }

  /* „Heute" und „Meine Aufgaben" nebeneinander, aber HOECHSTENS zwei Spalten,
     unabhaengig davon, wie viele das aeussere Raster hat. align-items: stretch
     (der Standard, hier gegen das start des aeusseren Rasters gesetzt) gibt
     beiden Karten dieselbe Hoehe. */
  .dash-tasks {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: var(--gap);
    align-items: stretch;
  }
  /* Fehlt „Meine Aufgaben" (keine anstehenden Aufgaben), nimmt „Heute" die
     ganze Breite statt eine halb leere Reihe zu bilden. */
  .dash-tasks > .card:only-child { grid-column: 1 / -1; }

  /* KPI-Kacheln in EINE Reihe, gleich breit, genau so viele Spalten wie Kacheln.
     Mit repeat(auto-fit, …) entstanden bei 1400px acht Spuren fuer vier Kacheln —
     die Kacheln waren dann nur 150 px breit und die Reihe rechts halb leer. */
  .kpi-grid {
    grid-template-columns: none;
    grid-auto-flow: column;
    grid-auto-columns: minmax(0, 1fr);
  }
  /* Breite Anzeige: die drei Aufgaben-Kacheln einzeln, die zusammengelegte weg. */
  .kpi-tasks { display: none; }
  .kpi-single { display: flex; }

  /* Vier Ringe in einer Reihe (Telefon: 2 x 2, siehe .ring-row) */
  .ring-row { grid-template-columns: repeat(4, 1fr); }

  /* Aufgaben nebeneinander: alle Karten EINER Reihe gleich hoch. align-items:
     stretch hebt fuer diesen Container das start des Rasters auf, jede Karte waechst
     also auf die Hoehe der hoechsten ihrer Reihe.
     Der Inhalt MUSS mitwachsen: .swipe-under/.swipe-under-edit liegen mit inset: 0
     in der Karte, .todo-content ist die deckende Schicht darueber. Bliebe sie auf
     Texthoehe, schaute der rote Loesch-Hintergrund unten hervor. Deshalb wird die
     Karte eine Flex-Spalte und der Inhalt nimmt den Rest. */
  /* Aktionen im Favoriten-Detail nebeneinander statt jeweils ueber die volle Breite:
     zwei pro Reihe. Umbrechendes Flex statt Raster, weil die Zahl der Knoepfe schwankt
     (ohne Rezept sind es drei) — flex-grow teilt eine unvollstaendige Reihe dann
     gleichmaessig auf. Im Raster waere der letzte Knopf entweder doppelt so breit
     oder es blieb eine Luecke; die Zahl der Knoepfe laesst sich in CSS nur mit :has()
     abfragen, und darauf will ich mich in der Symcon-Webview nicht stuetzen.
     45 % Basis: zwei passen in eine Reihe (90 % + gap), der dritte bricht um. */
  .fav-actions { flex-direction: row; flex-wrap: wrap; }
  .fav-actions button { flex: 1 1 45%; }

  #todoListArea { align-items: stretch; }
  #todoListArea .todo-card { display: flex; flex-direction: column; }
  #todoListArea .todo-content { flex: 1; }

  /* Eingabezeile auf dasselbe Maß wie die Tableiste. Die 5%-Ränder der Basisregel
     entsprechen ihr nur bei genau 720px Inhaltsbreite — darüber liefen die
     beiden auseinander. */
  html .inputbar {
    max-width: var(--bar-max);
    margin-left: auto;
    margin-right: auto;
  }
}

/* Ab hier stehen Auswahl und Inhalt der Favoriten NEBENEINANDER. 1100px, weil
   340px Auswahl + ~740px Inhalt bequem passen — bei 1000px wäre der Inhalt für
   die Artikelzeilen zu schmal. */
/* Drei Spalten (sechs Spuren): ein Paarling nimmt drei Spuren = die halbe Reihe.
   MUSS hinter dem 820er-Block stehen — der setzt #shoppingListArea auf vier Spuren,
   und bei gleicher Spezifität gewinnt die spätere Regel. Davor gemessen: 1250px und
   1500px fielen auf zwei Spalten zurück. */
@media (min-width: 1250px) {
  #shoppingListArea { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  #shoppingListArea > .item-card.span-half { grid-column: span 3; }
}

@media (min-width: 1100px) {
  #favoritesContent {
    display: grid;
    grid-template-columns: minmax(300px, 360px) 1fr;
    /* Doppelter Abstand: die beiden Spalten sind zwei getrennte Ansichten, kein
       zusammengehoeriges Kartenraster — der uebliche --gap las sich zu eng. */
    column-gap: calc(var(--gap) * 2);
    align-items: start;
  }
  /* Beide Spalten immer sichtbar. Dieselben Selektoren wie die schmalen Regeln
     weiter oben, nur spaeter im Stylesheet — mit schwaecheren Selektoren
     (#screen-favorites #favDetail) gewann dort das display:none, weil das :not()
     eine Klasse mitbringt. Gemessen: rechte Spalte blieb 0 px breit. */
  #screen-favorites:not(.detail-open) #favDetail,
  #screen-favorites.detail-open #favMaster { display: block; }
  /* Zurück-Pfeile haben nebeneinander keinen Sinn: die Auswahl steht ja links */
  #btnFavBack, #btnBoughtBack { display: none; }
  /* Zeigt, welche Liste rechts steht. Als innerer Schatten auf der ZEILE, NICHT als
     outline auf der Karte: die Zeile ist positioniert und wird ueber dem Umriss der
     Karte gezeichnet, deckte ihn auf den Geraden also ab. Sichtbar blieben nur vier
     Akzent-Boegen in den Ecken — dort liegt die 12-px-Rundung der Zeile weiter innen
     als der um 2 px eingerueckte Umriss (dessen Radius auf 10 px sinkt), er schaute
     also hervor. Der innere Schatten folgt der Rundung der Zeile exakt. */
  .fav-card.is-open .fav-row { box-shadow: inset 0 0 0 2px var(--accent); }
}

/* Grosse Schirme (1920 x 1080 und breiter): vier Spalten bei Artikeln und
   Aufgaben. Der Haltepunkt liegt bei 1700 px, damit ein 1600er Fenster bei drei
   Spalten bleibt. Mit dem 1400er Deckel waeren vier gar nicht moeglich:
   4 x 360 + 3 x 12 = 1476 px Mindestbreite.

   Die Spaltenzahl steht hier AUSDRUECKLICH auf 4 statt auf auto-fill. Mit
   auto-fill haengt sie am Rundungsverhalten (1800 px ergaeben 4, ein etwas
   breiterer Inhalt schon 5) — gewuenscht sind genau vier. Favoriten und
   Dashboard bleiben bei auto-fill/auto-fit. */
@media (min-width: 1700px) {
  :root { --content-max: 1800px; }
  /* Vier Aktionen in EINER Reihe. Erst hier, nicht schon ab 1100 px: die
     Detailspalte ist Inhalt minus Auswahlspalte (360 px) minus gap, bei 1600 px
     also nur 1028 px — vier Knoepfe waeren dort je 250 px breit und „Alles auf die
     Einkaufsliste" wuerde umbrechen. Bei 1920 px sind es 1428 px, also je ~350 px.
     22 % Basis: vier passen in eine Reihe, drei teilen sie sich zu je einem Drittel. */
  .fav-actions button { flex-basis: 22%; }
  #todoListArea {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  /* Vier Spalten (acht Spuren): ein Paarling nimmt vier Spuren = die halbe Reihe */
  #shoppingListArea { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  #shoppingListArea > .item-card.span-half { grid-column: span 4; }
}
  </style>
</head>
<body>
<div class="app">
  <main style="display:flex; flex-direction:column; flex:1; min-height:0;">

    <section id="screen-dashboard" class="screen active">
      <div class="content" id="dashboardContent"></div>
    </section>

    <section id="screen-shopping" class="screen">
      <div class="content">
        <div class="screen-head">
          <select id="shoppingSwitcher" class="list-switcher" style="display:none;"></select>
          <h2 id="shoppingTitle"></h2>
          <button id="btnShoppingHint" class="icon-btn hint-btn" aria-label="Hinweis für den Einkauf"><i class="fa-light fa-comment"></i><span class="hint-badge" hidden>!</span></button>
          <button id="btnShoppingMenu" class="icon-btn" aria-label="Menü"><i class="fa-light fa-ellipsis"></i></button>
        </div>
        <div id="ansageLeiste" class="ansage-leiste" hidden>
          <span class="ansage-symbol">
            <i data-sym="spricht" class="fa-light fa-volume-high"></i>
            <i data-sym="pausiert" class="fa-light fa-circle-pause" hidden></i>
            <i data-sym="wartet" class="fa-light fa-headphones" hidden></i>
          </span>
          <div class="ansage-text">
            <span id="ansageArtikel"></span>
            <span id="ansageFortschritt"></span>
          </div>
          <span class="ansage-aktionen">
          <button id="ansageZurueck" class="ansage-btn" aria-label="Rückgängig"><i class="fa-light fa-rotate-left"></i></button>
          <button id="ansageWeiter" class="ansage-btn" aria-label="Weiter">
            <i data-akt="pause" class="fa-light fa-pause"></i>
            <i data-akt="weiter" class="fa-light fa-play" hidden></i>
          </button>
          <button id="ansageUeberspringen" class="ansage-btn" aria-label="Artikel überspringen"><i class="fa-light fa-forward-step"></i></button>
          <button id="ansageEnde" class="ansage-btn" aria-label="Beenden"><i class="fa-light fa-xmark"></i></button>
          </span>
        </div>
        <div id="shoppingListArea"></div>
        <div class="composer">
          <div id="suggestions" class="suggestions"><div class="chip-flow" id="suggestionChips"></div></div>
          <div class="inputbar">
            <input id="shoppingInput" type="text" autocomplete="off" />
            <button id="btnShopScan" class="round-btn" aria-label="Foto/URL analysieren"><i class="fa-light fa-wand-magic-sparkles"></i></button>
            <button id="btnOpenScanner" class="round-btn" aria-label="Barcode scannen"><i class="fa-light fa-barcode"></i></button>
            <button id="btnShoppingAdd" class="round-btn" aria-label="Hinzufügen" disabled><i class="fa-light fa-plus"></i></button>
          </div>
          <input id="shopScanInput" type="file" accept="image/*" capture="environment" style="display:none" />
          <input id="shopFileInput" type="file" accept="image/jpeg,image/png,application/pdf,.jpg,.jpeg,.png,.pdf" style="display:none" />
        </div>
      </div>
    </section>

    <section id="screen-calendar" class="screen">
      <div class="content">
        <!-- Avatar-Pille wie im ToDo-Tab: an derselben Stelle (erstes Kind des

<script>
// In einer IIFE gekapselt: die Symcon-Tile-Visu injiziert selbst globale
// Bindungen (const translate, const requestAction …). Ohne Kapselung würden
// unsere gleichnamigen Top-Level-Deklarationen mit „Identifier already
// declared“ kollidieren und das gesamte Script abbrechen (handleMessage
// wäre nie definiert). Genau wie das ShoppingList-Modul.
(function () {
'use strict';

// Hell-Theme: Kachelfläche aufhellen wie in der Web-App. Hell/Dunkel aus der
// Luminanz der Kartenfarbe (in der Visu injiziert; im Browser vom Web-Adapter
// gesetzt). Der Web-Adapter setzt --row zusätzlich inline — konsistenter Wert.
(function symdoLightTiles(){
  try { var st = document.createElement('style');
    st.textContent = 'html[data-symdo-theme="light"]{'
      + '--row:color-mix(in srgb, var(--card-color) 95%, var(--content-color) 5%);'
      // Im Hellmodus wuerde ein hoeherer Inhaltsanteil die Zeile DUNKLER machen,
      // nicht heller — dort bleibt sie deshalb, wie sie war.
      + '--row-task:color-mix(in srgb, var(--card-color) 95%, var(--content-color) 5%)}';
    (document.head || document.documentElement).appendChild(st); } catch (e) {}
  function apply(){ try {
    var p = document.createElement('span');
    p.style.cssText = 'position:absolute;left:-9999px;top:-9999px;color:var(--card-color)';
    (document.body || document.documentElement).appendChild(p);
    var c = getComputedStyle(p).color; p.remove();
    var m = /(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(c); if (!m) return;
    var l = 0.2126 * +m[1] + 0.7152 * +m[2] + 0.0722 * +m[3];
    document.documentElement.setAttribute('data-symdo-theme', l < 128 ? 'dark' : 'light');
  } catch (e) {} }
  apply();
  try { if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply); } catch (e) {}
})();

// ── System-Kachelränder aus den URL-Parametern übernehmen ──────────────────
// Die Tile-Visu übergibt margintop/marginside/marginbottom in der Query. Wir
// wenden sie selbst als Padding an (siehe .app), damit der Inhalt nicht unter
// die vom System überlagerten Steuerelemente oben rutscht. So früh wie möglich
// setzen, damit die Variablen vor dem ersten Paint greifen.
(function applySystemMargins() {
  try {
    const p = new URLSearchParams(window.location.search);
    const px = (name) => {
      const v = parseInt(p.get(name), 10);
      return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    const root = document.documentElement.style;
    const mt = px('margintop');   if (mt !== null) root.setProperty('--sym-mt', mt);
    const ms = px('marginside');  if (ms !== null) root.setProperty('--sym-ms', ms);
    const mb = px('marginbottom'); if (mb !== null) root.setProperty('--sym-mb', mb);
  } catch (e) { /* ohne Query: Defaults (0) greifen */ }
})();

// ── Echte Scrollbalken-Breite messen und --sbw setzen ──────────────────────
// Die reservierte Breite variiert je Plattform (Desktop-Webkit ~6–15px). Wir
// messen sie an einem .screen-Probe (bekommt dieselbe ::-webkit-scrollbar-
// Regel), damit Inhaltsabstand und Balken-Zentrierung exakt stimmen.
(function measureScrollbar() {
  try {
    const probe = document.createElement('div');
    probe.className = 'screen';
    probe.style.cssText = 'position:absolute;top:-9999px;left:-9999px;display:block;width:100px;height:100px;padding:0;';
    probe.innerHTML = '<div style="height:200px"></div>';
    document.body.appendChild(probe);
    const w = probe.offsetWidth - probe.clientWidth;
    probe.remove();
    if (Number.isFinite(w) && w >= 0) {
      document.documentElement.style.setProperty('--sbw', w + 'px');
    }
  } catch (e) { /* Default --sbw (6px) greift */ }
})();

// ── Shims (Symcon injiziert translate/requestAction; Fallback postMessage) ──
const translate = (typeof window.translate === 'function')
  ? window.translate
  : (key) => String(key ?? '');

const requestAction = (typeof window.requestAction === 'function')
  ? window.requestAction
  : (ident, value) => {
      try { window.parent.postMessage(JSON.stringify({ type: 'requestAction', ident: String(ident), value }), '*'); } catch (e) {}
      try { window.parent.postMessage({ type: 'requestAction', ident: String(ident), value }, '*'); } catch (e) {}
    };

function escapeHtml(s) {
  return String(s)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

/* ── Kachel-Adapter ────────────────────────────────────────────────────────────
   Diese Datei IST die Web-App, wortgleich uebernommen — damit die ToDo-Liste in der
   Kachel genauso aussieht und sich genauso verhaelt. Sie laeuft hier aber in der
   Kachel EINER ToDoList-Instanz statt am Gateway:

   - kein Payload mit mehreren Instanzen, sondern der Zustand dieser einen Liste,
   - kein Call-Relay mit instanceID, sondern requestAction direkt an diese Instanz,
   - keine Dashboard- und Einkaufs-Bereiche.

   Der Adapter setzt genau diese Beruehrungspunkte um; alles darueber bleibt
   unangetastet, damit die naechste Uebernahme aus der Web-App wieder wortgleich
   moeglich ist (siehe ToDoList/tools/uebernahme-webapp.py). Dashboard und Einkauf
   werden NICHT herausgeschnitten, sondern ueber tabs abgeschaltet:
   applyTabVisibility() blendet Knopf und Bereich aus und laesst bei nur einem
   Bereich die Leiste ganz weg. Herausschneiden haette in 6800 Zeilen mit hoher
   Wahrscheinlichkeit Behaltenes mitgerissen.

   AppCall des Moduls delegiert intern an RequestAction — dieselben Aktionsnamen und
   dieselben Nutzlasten. Deshalb genuegt in sdCall ein direkter requestAction. */
const SELF_ID = 'self';

/** Zustand dieser Liste in die Form bringen, die die Web-App erwartet. */
function kachelZustand(daten) {
  return {
    type: 'state',
    // Die Nutzer liefert die Kachel im Zustand mit (GetTileUsers); einen
    // "aktuellen Nutzer" wie in der App gibt es in der Visu nicht.
    users: daten.users || [],
    defaultUserID: '',
    gatewayAvailable: false,
    // Keine KI in der Kachel: sie lief in der Web-App ueber das Gateway.

  const b = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  return Math.round((b - a) / 86400000);
}
// Farbige Untertitel-Segmente wie auf dem App-Dashboard: nur der Zeit-Teil
// ist rot/orange, der Listenname bleibt sekundär
function formatDueChip(item) {
  const due = parseInt(item.due) || 0;
  if (due <= 0) return null;
  if (item.dueAllDay) {
    const d = dueDateOf(item);
    if (!d) return null;
    if (localDayStr(d) === todayStr()) return translate('Today');
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  }
  const diffSec = due - Math.floor(Date.now() / 1000);
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto', style: 'short' });
  const abs = Math.abs(diffSec);
  if (abs < 3600) return rtf.format(Math.round(diffSec / 60), 'minute');
  if (abs < 86400) return rtf.format(Math.round(diffSec / 3600), 'hour');
  return rtf.format(Math.round(diffSec / 86400), 'day');
}

// ── Prioritäten / Wiederholungen (Codes wie im ToDoList-Modul) ─────────────
function priorityKey(p) {
  const s = String(p || 'normal');
  return s === 'high' ? 'high' : (s === 'low' ? 'low' : 'normal');
}
function priorityLabel(p) {
  const k = priorityKey(p);
  return translate(k === 'high' ? 'High' : (k === 'low' ? 'Low' : 'Normal'));
}
function recurrenceLabel(r, unit, val) {
  if (String(r) === 'custom') {
    const v = parseInt(val) || 1;
    const unitLabel = { h: translate('Hours'), d: translate('Days'), m: translate('Months'), y: translate('Years') }[String(unit || 'w')] || translate('Weeks');
    return `${translate('Custom')}: ${v} ${unitLabel}`;
  }
  switch (String(r)) {
    case 'w1': return translate('Every week');
    case 'w2': return translate('Every 2 weeks');
    case 'w3': return translate('Every 3 weeks');
    case 'm1': return translate('Monthly');
    case 'q1': return translate('Quarterly');
    case 'y1': return translate('Yearly');
    default: return translate('No repeat');
  }
}

// ── Nachrichten vom Modul ──────────────────────────────────────────────────
// Verwirft die Markup-Caches von renderInto() und setzt hängende Swipe-/Lösch-
// Animationen zurück, damit ein Re-Render nach einer abgelehnten Aktion wirklich
// neu zeichnet.
function invalidateRenderCache() {
  ['dashboardContent', 'shoppingListArea', 'todoListArea', 'favoritesContent', 'todoMembers', 'calMembers', 'calArea', 'mailAiArea', 'calAiArea'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el._lastHtml = null;
  });
  document.querySelectorAll('.item-card, .todo-card, .fav-card, .cal-card, .mail-item').forEach(card => {
    card.classList.remove('is-deleting', 'dragging-left', 'dragging-right');
    delete card.dataset.animating;
    const content = card.querySelector('.item-card-content, .todo-content, .fav-row, .cal-event, .mail-row');
    if (content) content.style.transform = '';
  });
}

function handleMessage(data) {
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { return; }
  }
  if (!data || typeof data !== 'object') return;
  // Die Kachel bekommt den Zustand ihrer Liste flach (items, sortMode, …), die
  // Web-App erwartet ihn in store-Form. Erkennungsmerkmal ist items: das Gateway
  // schickt an dieser Stelle instances/states.
  if (data.type === 'state' && Array.isArray(data.items)) {
    data = kachelZustand(data);
  }
  if (data.type === 'briefingPlay') {
    briefingFernstart();
    return;
  }
  if (data.type === 'aiResult') {
    const cb = __aiPending[data.txn];
    if (cb) { delete __aiPending[data.txn]; cb({ status: data.status || 200, json: data.json || null }); }
    return;
  }
  if (data.type === 'state') {
    store.users = data.users || [];
    store.defaultUserID = data.defaultUserID || '';
    store.gatewayAvailable = !!data.gatewayAvailable;
    store.aiEnabled = !!data.aiEnabled;
    store.tabs = normalizeTabs(data.tabs);
    store.hiddenIDs = data.hiddenIDs || [];
    store.instances = data.instances || [];
    store.states = data.states || {};
    store.images = data.images || {};
    store.brands = data.brands || {};
    store.shoppingExtras = data.shoppingExtras || {};
    productImages = {}; // Kennung: Maps im nächsten syncCompat neu übernehmen
    syncCompat();
    applyTabVisibility();
    renderAll();
    applyAiEnabled();
    // Erst hier, nicht beim Start: vorher sind weder gatewayAvailable noch die
    // Nutzer bekannt — die Mitglieder-Zuordnung haette kein Gesicht.
    loadMailProposals();
    loadCalendars();
    loadBriefing();
    // Erst hier: Vorher steht nicht fest, ob es ein Gateway gibt, und die
    // Mitgliederliste fuer die Zuordnung ist noch leer.
    pushInit();
  } else if (data.type === 'instanceState') {
    if (data.ok === false) {
      showToast(translate('Action failed'));
      // Abgelehnte Aktion: die optimistische Darstellung MUSS zurückgenommen
      // werden. renderInto() bricht bei unverändertem Markup ab, deshalb erst die
      // Markup-Caches verwerfen — sonst bliebe z.B. eine weggewischte Zeile
      // dauerhaft bei translateX(-110%) unsichtbar und tot stehen.
      invalidateRenderCache();
    }
    if (data.state && data.instanceID) {
      store.states[String(data.instanceID)] = {
        kind: data.kind,
        revision: data.revision,
        state: data.state
      };
      syncCompat();
      renderAll();
      // Offene Overlays, die nicht Teil eines Tab-Containers sind, aus dem
      // frischen State neu zeichnen (korrigiert auch verworfene Aktionen)
      if (document.getElementById('favPickOverlay').classList.contains('open')) renderFavPicker();
    }
  } else if (data.type === 'meta') {
    store.instances = data.instances || [];
    store.hiddenIDs = data.hiddenIDs || [];
    store.gatewayAvailable = !!data.gatewayAvailable;
    store.tabs = normalizeTabs(data.tabs);
    applyTabVisibility();
    for (const key of Object.keys(store.states)) {
      const inst = store.instances.find(i => String(i.id) === key);
      if (!inst || inst.hidden) delete store.states[key];
    }
    syncCompat();
    renderAll();
    checkRevisions(); // fehlende States neu eingeblendeter Listen nachladen
  }
}
window.handleMessage = handleMessage;
window.updateState = handleMessage;
// Nur Nachrichten vom eigenen Fenster oder dem einbettenden Parent annehmen:
// ohne Prüfung könnte ein fremder Frame einen kompletten State injizieren.
window.addEventListener('message', (event) => {
  if (!event) return;
  if (event.source !== window && event.source !== window.parent) return;
  handleMessage(event.data);
});

const TABS = ['dashboard', 'shopping', 'favorites', 'todos', 'calendar'];
function setTab(tab) {

}

// ── UI-Helfer: Toast, Bestätigung, Eingabe, Menü, Overlays ────────────────
let toastTimer = 0;
/**
 * Laesst das Produktbild einer Zeile kurz aufhuepfen und dann zum Einkaufen-Tab
 * fliegen. Rein visuell — der Server-Aufruf ist zu diesem Zeitpunkt schon raus, die
 * Animation darf also jederzeit ausfallen, ohne dass etwas verloren geht.
 *
 * Der Flieger ist ein Klon des Bildes an fixer Position ueber allem (die Tab-Leiste
 * liegt auf 40). Er haengt an <body>, nicht an der Zeile: die Liste wird beim
 * naechsten State-Push neu aufgebaut, ein Kind der Zeile waere dann mittendrin weg.
 */
function flyToShoppingTab(thumbEl) {
  if (!thumbEl || typeof thumbEl.animate !== 'function') return;
  // Bewegungsreduziert: keine Flugbahn. Dieselbe Ruecksicht wie bei der Mitgliederleiste.
  if (mbReduceMotion()) return;
  const target = document.getElementById('tab-shopping');
  // Ohne sichtbaren Einkaufen-Tab gibt es kein Ziel (der Bereich laesst sich
  // abschalten) — dann unterbleibt die Animation ganz.
  if (!target || getComputedStyle(target).display === 'none') return;

  const from = thumbEl.getBoundingClientRect();
  if (from.width === 0 || from.height === 0) return;
  const icon = target.querySelector('svg, i') || target;
  const to = icon.getBoundingClientRect();

  const ghost = thumbEl.cloneNode(true);
  ghost.classList.add('fly-ghost');
  ghost.style.left = from.left + 'px';
  ghost.style.top = from.top + 'px';
  ghost.style.width = from.width + 'px';
  ghost.style.height = from.height + 'px';
  document.body.appendChild(ghost);

  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);

  const anim = ghost.animate([
    { transform: 'translate(0px, 0px) scale(1)', opacity: 1, offset: 0 },
    // Huepfer: kurz gross und nach oben, bevor es losgeht
    { transform: 'translate(0px, -14px) scale(1.28)', opacity: 1, offset: 0.22 },
    { transform: 'translate(0px, 0px) scale(1.06)', opacity: 1, offset: 0.34 },
    // Flug in einem Bogen: erst seitlich, dann nach unten ins Ziel
    { transform: 'translate(' + (dx * 0.55) + 'px, ' + (dy * 0.28) + 'px) scale(0.8)', opacity: 0.95, offset: 0.7 },
    { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(0.22)', opacity: 0.15, offset: 1 }
  ], { duration: 720, easing: 'cubic-bezier(.4,.05,.3,1)' });

  // Netz gegen Karteileichen: loest anim.finished nicht aus (abgebrochene Animation,
  // Umgebung ohne laufende Animationsuhr), bliebe der Klon sonst dauerhaft im DOM.
  const cleanup = setTimeout(function () { ghost.remove(); }, 1400);
  anim.finished.then(function () {
    clearTimeout(cleanup);
    ghost.remove();
    // Kurzer Stups am Ziel, damit die Ankunft sichtbar wird
    if (typeof icon.animate === 'function') {
      icon.animate([
        { transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }
      ], { duration: 260, easing: 'ease-out' });
    }
  }).catch(function () { clearTimeout(cleanup); ghost.remove(); });
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
// Overlays sind Blaetter am unteren Rand (.overlay: justify-content: flex-end). Sie
// gleiten jetzt von unten herein und wieder hinaus, statt zu erscheinen.
//
// Beim Schliessen darf die Klasse ERST nach der Animation weg: .overlay ohne .open
// steht auf display: none, das Blatt waere sonst sofort verschwunden. Deshalb haelt
// der Knoten seine laufende Schliess-Animation in _closeAnim — ein erneutes Oeffnen
// bricht sie ab, sonst raeumte ihr onfinish das gerade geoeffnete Blatt wieder weg.
//
// Verdunkelung ueber background-color statt opacity: opacity auf .overlay wuerde das
// Blatt mit verblassen lassen, es soll aber deckend hereinfahren.
const OVERLAY_MS = 260;
const OVERLAY_DIM = 'rgba(0, 0, 0, .45)';
function openOverlay(id) {
  const ov = document.getElementById(id);
  if (!ov) return;
  if (ov._closeAnim) {
    ov._closeAnim.onfinish = null;
    ov._closeAnim.oncancel = null;
    ov._closeAnim.cancel();
    ov._closeAnim = null;
  }
  ov.classList.add('open');
  if (mbReduceMotion()) return;
  const card = ov.querySelector('.overlay-card');
  ov.animate([{ backgroundColor: 'rgba(0, 0, 0, 0)' }, { backgroundColor: OVERLAY_DIM }],
             { duration: OVERLAY_MS, easing: 'ease-out' });
  if (card) {
    card.animate([{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }],
                 { duration: OVERLAY_MS, easing: 'cubic-bezier(.2,.8,.2,1)' });
  }
}
function closeOverlay(id) {
  const ov = document.getElementById(id);
  if (!ov) return;
  if (mbReduceMotion() || !ov.classList.contains('open')) {
    ov.classList.remove('open');
    return;
  }
  const card = ov.querySelector('.overlay-card');
  ov.animate([{ backgroundColor: OVERLAY_DIM }, { backgroundColor: 'rgba(0, 0, 0, 0)' }],
             { duration: OVERLAY_MS, easing: 'ease-in' });
  const fertig = () => { ov.classList.remove('open'); ov._closeAnim = null; };
  if (!card) { window.setTimeout(fertig, OVERLAY_MS); return; }
  ov._closeAnim = card.animate(
    [{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }],
    { duration: OVERLAY_MS, easing: 'cubic-bezier(.4, 0, 1, 1)' }
  );
  ov._closeAnim.onfinish = fertig;
  ov._closeAnim.oncancel = fertig;
}

let menuCloser = null;
let menuAnchor = null;
function closeMenu() {
  const pop = document.getElementById('menuPop');
  if (pop) pop.remove();
  menuAnchor = null;
  if (menuCloser) {
    document.removeEventListener('mousedown', menuCloser, true);
    document.removeEventListener('touchstart', menuCloser, true);
    menuCloser = null;
  }
}
function openMenu(anchor, entries) {
  // Zweiter Klick auf denselben Knopf schließt das Menü wieder. Damit das geht,
  // behandelt der Außenklick-Wächter weiter unten den Knopf selbst NICHT als
  // „außerhalb": sonst hätte mousedown das Menü längst entfernt, bevor click
  // hier ankommt — und es ginge sofort wieder auf, sähe also aus, als reagiere
  // der Knopf nicht.
  if (menuAnchor === anchor && document.getElementById('menuPop')) {
    closeMenu();
    return;
  }
  closeMenu();
  const pop = document.createElement('div');
  pop.id = 'menuPop';
  pop.className = 'menu-pop open';
  for (const entry of entries) {
    if (entry.sep) {
      const sep = document.createElement('div');
      sep.className = 'menu-sep';
      pop.appendChild(sep);
      continue;
    }
    if (entry.header) {
      const label = document.createElement('div');
      label.className = 'menu-label';
      label.textContent = entry.label;
      pop.appendChild(label);
      continue;
    }
    const btn = document.createElement('button');
    if (entry.destructive) btn.classList.add('destructive');
    btn.innerHTML = (entry.icon ? `<i class="fa-light ${entry.icon}"></i>` : '') +
      escapeHtml(entry.label) +
      (entry.checked ? '<i class="fa-light fa-check check"></i>' : '');
    btn.addEventListener('click', () => { closeMenu(); entry.onClick(); });
    pop.appendChild(btn);
  }
  document.body.appendChild(pop);
  const rect = anchor.getBoundingClientRect();
  // Breite auf den Viewport begrenzen, sonst schieben lange Einträge
  // (z. B. „<langer Favoritenname> hinzufügen“) das Popover aus dem Bild
  pop.style.maxWidth = Math.min(280, window.innerWidth - 16) + 'px';
  pop.style.top = Math.min(rect.bottom + 6, window.innerHeight - pop.offsetHeight - 10) + 'px';
  pop.style.left = Math.max(8, Math.min(rect.right - pop.offsetWidth, window.innerWidth - pop.offsetWidth - 8)) + 'px';
  menuAnchor = anchor;
  menuCloser = (e) => {
    if (pop.contains(e.target)) return;
    if (anchor && anchor.contains(e.target)) return;  // Umschalten macht der Klick
    closeMenu();
  };
  setTimeout(() => {
    document.addEventListener('mousedown', menuCloser, true);
    document.addEventListener('touchstart', menuCloser, true);
  }, 0);
}

// Marquee für abgeschnittene Namen (Ping-Pong wie in der App)
function applyMarquees(container) {
  container.querySelectorAll('.strip-name').forEach(el => {
    const inner = el.querySelector('.marquee-inner');
    if (!inner) return;
    const overflow = inner.scrollWidth - el.clientWidth;
    if (overflow > 4) {
      el.style.setProperty('--marquee-shift', `-${overflow}px`);
      el.classList.add('marquee');
    } else {
      el.classList.remove('marquee');
    }
  });
}

// Aufloesen beim Loeschen: die Karte verblasst, wird weichgezeichnet und ihre
// Hoehe faehrt auf null, damit die Zeilen darunter weich nachruecken statt zu
// springen. Der Loesch-Aufruf geht erst danach raus — der naechste Render
// entfernt den Knoten dann unsichtbar. Bleibt der Knoten stehen (Aufruf schlug
// fehl), heilt renderRows ihn beim naechsten Push, weil die Inline-Stile das
// outerHTML veraendern und der Knoten dadurch ersetzt wird.
const DISSOLVE_MS = 300;
/**
 * Zeile verschwinden lassen und die Luecke schliessen. Zwei Ausdruecke derselben
 * Mechanik, damit sich Loeschen und Abhaken nicht verwechseln lassen:
 *   dissolveCard  — loest sich auf (weichzeichnen, leicht schrumpfen)
 *   checkOffCard  — schiebt zur Seite (rechts = abgehakt, links = zurueck)
 * Beides faehrt Hoehe und unteren Rand auf null, damit die Nachbarn weich nachruecken.
 */
function collapseCard(card, done, opts) {
  const finish = () => { if (done) done(); };
  if (!card) { finish(); return; }
  if (mbReduceMotion()) { card.style.display = 'none'; finish(); return; }
  const o = opts || {};
  const ms = o.ms || DISSOLVE_MS;
  const h = card.offsetHeight;
  card.style.height = h + 'px';
  card.style.marginBottom = window.getComputedStyle(card).marginBottom;
  card.style.overflow = 'hidden';
  void card.offsetHeight; // Reflow erzwingen, sonst springt die Hoehe ohne Uebergang
  card.style.transition = `height ${ms}ms cubic-bezier(.4,0,.2,1),`
    + ` margin-bottom ${ms}ms cubic-bezier(.4,0,.2,1),`
    + ` opacity ${Math.round(ms * 0.8)}ms ease,`
    + ` filter ${Math.round(ms * 0.8)}ms ease,`
    + ` transform ${Math.round(ms * 0.8)}ms ease`;
  card.style.opacity = '0';
  if (o.blur) card.style.filter = 'blur(' + o.blur + 'px)';
  card.style.transform = 'translateX(' + (o.dx || 0) + 'px) scale(' + (o.scale || 1) + ')';
  card.style.height = '0px';
  card.style.marginBottom = '0px';
  window.setTimeout(finish, ms);
}
function dissolveCard(card, done) {
  collapseCard(card, done, { blur: 7, scale: 0.96 });
}
/**
 * Abhaken: die Zeile schiebt sich zur Seite und verblasst, dann folgt der Aufruf.
 * Richtung als Bedeutung — nach rechts heisst „erledigt/in den Wagen", nach links
 * „zurueck in die Liste". Genauso macht es die ShoppingList-Kachel
 * (@keyframes moveToRecentlyUsed / moveBackToList), 22px bei 340ms.
 */
const CHECKOFF_MS = 340;
// Streifen-Kachel abhaken: derselbe Ausdruck, aber die Breite faellt zusammen —
// der Streifen ist waagerecht, eine schrumpfende Hoehe wuerde dort nichts schliessen.
function stripCheckOff(el, done) {
  const finish = () => { if (done) done(); };
  if (!el) { finish(); return; }
  if (mbReduceMotion()) { el.style.display = 'none'; finish(); return; }
  const w = el.offsetWidth;
  el.style.flex = '0 0 auto';
  el.style.width = w + 'px';
  el.style.overflow = 'hidden';
  void el.offsetWidth;
  el.style.transition = `width ${CHECKOFF_MS}ms cubic-bezier(.4,0,.2,1),`
    + ` margin-right ${CHECKOFF_MS}ms cubic-bezier(.4,0,.2,1),`
    + ` opacity ${Math.round(CHECKOFF_MS * 0.8)}ms ease,`
    + ` transform ${Math.round(CHECKOFF_MS * 0.8)}ms ease`;
  el.style.opacity = '0';
  el.style.transform = 'translateY(-10px) scale(.94)';
  el.style.width = '0px';
  el.style.marginRight = '-14px';   // gap des Streifens schlucken
  window.setTimeout(finish, CHECKOFF_MS);
}
function checkOffCard(card, zurueck, done) {
  collapseCard(card, done, { dx: zurueck ? -22 : 22, scale: 0.97, ms: CHECKOFF_MS });
}
// Umsortieren sichtbar machen (FLIP): Positionen VOR dem Umhaengen merken, danach
// die Differenz als transform setzen und weganimieren. Die Nachbarn gleiten damit an
// ihren neuen Platz statt zu springen — in einer Spalte wie im mehrspaltigen Raster,
// weil x UND y animiert werden.
//
// WAAPI statt CSS-Transition: eine Animation hinterlaesst keine Inline-Stile, die
// spaeter mit dissolveCard() kollidieren koennten (das setzt height/transform selbst).
// 340 ms, nicht 180: bei 180 war die Bewegung kaum zu sehen — auf einer Strecke von
// wenigen Zeilenhoehen ist sie nach drei Bildern vorbei. Laenger darf es nicht werden,
// sonst haengt sie beim schnellen Ziehen hinter dem Finger her (mehrere Zuege in Folge
// brechen einander ab, siehe cancel() unten).
const REORDER_MS = 340;
function flipReorder(area, dragged, mutate) {
  if (mbReduceMotion()) { mutate(); return; }
  const nodes = Array.from(area.querySelectorAll('.todo-card'));
  // Laufende Animationen zuerst abbrechen: getBoundingClientRect() liefert sonst die
  // MOMENTANE, noch verschobene Position, und die Differenz waere um den offenen Rest
  // daneben. cancel() setzt den Knoten sofort auf seinen Layout-Platz.
  for (const n of nodes) { if (n._flip) { n._flip.cancel(); n._flip = null; } }
  const vorher = new Map();
  for (const n of nodes) { const r = n.getBoundingClientRect(); vorher.set(n, { x: r.left, y: r.top }); }

  mutate();

  for (const n of nodes) {
    // Die gezogene Karte springt bewusst sofort: sie sitzt unter dem Finger.
    if (n === dragged) continue;
    const v = vorher.get(n);
    if (!v) continue;
    const r = n.getBoundingClientRect();
    const dx = v.x - r.left, dy = v.y - r.top;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) continue;
    n._flip = n.animate(
      [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
      // Symmetrische Kurve, KEIN starkes ease-out: mit cubic-bezier(.2,.8,.2,1) lagen
      // nach 80 ms schon 70 % der Strecke hinter uns und der Rest kroch — die Dauer
      // stand auf 340 ms, sichtbar war die Bewegung trotzdem kaum. So liegt die halbe
      // Strecke in der halben Zeit, das Gleiten ist erkennbar.
      { duration: REORDER_MS, easing: 'cubic-bezier(.45,.05,.55,.95)' }

  }
}

// Gegenstueck fuer Wege, die nach dem Wischen noch nachfragen und abbrechen koennen.

// ── Aggregationen (Port der Dashboard-Logik aus DashboardScreen.swift) ─────
function allTodoTasks() {
  const tasks = [];
  for (const inst of visibleInstances('todo')) {
    const st = instState(inst.id);
    if (!st) continue;
    for (const item of (Array.isArray(st.items) ? st.items : [])) {
      tasks.push({ item, instanceID: inst.id, listName: inst.name, key: inst.id + '-' + item.id });
    }
  }
  return tasks;
}
function memberFiltered(tasks) {
  // Ohne sichtbare Leiste filtert die Uebersicht nicht — die Auswahl bleibt aber
  // bestehen, denn sie ist bereichsuebergreifend und gehoert auch den anderen Tabs.
  if (!mitgliederLeisteSichtbar() || memberFilterIds.size === 0) return tasks;
  // Aufgaben, die einem der gewählten Mitglieder zugewiesen sind (Vereinigung)
  return tasks.filter(t => Array.isArray(t.item.assignedTo) && t.item.assignedTo.some(id => memberFilterIds.has(id)));
}
function mondayOf(d) {
  const y = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  y.setDate(y.getDate() - ((y.getDay() + 6) % 7));
  return y.getTime();
}
function isThisWeek(ts) {
  if (!ts) return false;
  return mondayOf(new Date(ts * 1000)) === mondayOf(new Date());
}
function openShoppingCount() {
  let n = 0;
  for (const inst of visibleInstances('shopping')) {
    const st = instState(inst.id);
    if (st && Array.isArray(st.items)) n += st.items.filter(i => !i.inCart).length;
  }
  return n;
}
// Offene Artikel der Liste in Kategorie-Reihenfolge, alphabetisch je Kategorie
function openSections(st) {
  const items = (Array.isArray(st.items) ? st.items : []).filter(i => !i.inCart);
  const misc = translate('Miscellaneous');
  const byCat = new Map();
  for (const it of items) {
    const cat = it.category || misc;
    if (!byCat.has(cat)) byCat.set(cat, []);
    byCat.get(cat).push(it);
  }
  const order = Array.isArray(st.categoryOrder) ? st.categoryOrder.slice() : [];
  for (const cat of byCat.keys()) {
    if (!order.includes(cat)) order.push(cat);
  }
  const sections = [];
  for (const cat of order) {
    const list = byCat.get(cat);
    if (!list) continue;
    list.sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base' }));
    sections.push({ category: cat, items: list });
  }
  return sections;
}

// Schreibt Markup nur, wenn es sich wirklich geändert hat, und meldet das
// zurück. So überspringt der periodische Refresh / Revisions-Poll das teure
// innerHTML-Neuzeichnen bei unverändertem Inhalt → kein Flackern, kein
// Scroll-Abbruch. Die aufrufende Render-Funktion kehrt bei false früh zurück,
// damit auch keine doppelten Event-Handler gebunden werden.
// Bis zu diesem Zeitpunkt (performance.now) ausgelöste Scroll-Events stammen von
// einem Re-Render (Layout-Clamp/Reflow) und dürfen die per Tipp ausgeklappte
// Member-Leiste NICHT einklappen — nur echtes Nutzer-Scrollen klappt wieder ein.
let mbRenderScrollGuard = 0;

  if (!el) return false;
  if (el._lastHtml === html) return false;
  el._lastHtml = html;
  el.innerHTML = html;

  // markieren, damit dieses NICHT die ausgeklappte Member-Leiste einklappt.
  mbRenderScrollGuard = performance.now() + 200;
  return true;
}

/**
 * Wie renderInto, aber zeilenweise: ersetzt nur die Kinder, deren Markup sich
 * geändert hat, und lässt alle übrigen DOM-Knoten unangetastet stehen.
 *
 * Warum das nötig ist: `innerHTML = html` verwirft die GESAMTE Liste. Bei einer
 * Mengenänderung an einem einzigen Artikel werden dadurch auch alle anderen
 * Karten samt ihrer <img>-Elemente neu erzeugt. Die Bilddaten kommen zwar aus
 * dem Cache, jedes Bild muss aber erneut dekodiert und gemalt werden — sichtbar
 * als Flackern der ganzen Liste.
 *
 * Zuordnung alt→neu über einen Schlüssel: `data-id` (Artikel-/Aufgabenkarten),
 * sonst `data-key` (Überschriften, Umschalter), sonst das Markup selbst. Knoten
 * ohne Schlüssel und mit geändertem Markup werden schlicht ersetzt — der
 * Abgleich ist damit nie „falscher" als das bisherige Komplett-Ersetzen.
 *
 * Rückgabe: `false`, wenn sich nichts geändert hat (wie renderInto), sonst die
 * Liste der NEU eingefügten Elemente. Ereignisse dürfen nur an diese gebunden
 * werden — wiederverwendete Knoten tragen ihre Handler ja noch.
 */
function renderRows(el, html) {
  if (!el) return false;
  if (el._lastHtml === html) return false;
  el._lastHtml = html;

  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const incoming = Array.from(tpl.content.children);

  // Bestand nach Schlüssel indizieren. Mehrfach vorkommende Schlüssel (gleiches
  // Markup, z.B. zwei identische Überschriften) landen in einer Queue.
  const keyOf = (node) => node.dataset && node.dataset.id !== undefined
    ? 'id:' + node.dataset.id
    : (node.dataset && node.dataset.key !== undefined ? 'key:' + node.dataset.key : 'html:' + node.outerHTML);
  const pool = new Map();
  for (const node of Array.from(el.children)) {
    const k = keyOf(node);
    if (!pool.has(k)) pool.set(k, []);
    pool.get(k).push(node);
  }

  const fresh = [];
  const result = [];
  for (const next of incoming) {
    const bucket = pool.get(keyOf(next));
    const old = bucket && bucket.length ? bucket.shift() : null;
    if (old && old.outerHTML === next.outerHTML) {
      result.push(old);            // unverändert → DOM-Knoten behalten
    } else {
      if (old && old.parentNode === el) el.removeChild(old);
      result.push(next);
      fresh.push(next);
    }
  }

  // Übrig gebliebene Altknoten entfernen, dann die Zielreihenfolge herstellen.
  for (const bucket of pool.values()) {
    for (const node of bucket) { if (node.parentNode === el) el.removeChild(node); }
  }
  let ref = el.firstChild;
  for (const node of result) {
    if (ref === node) { ref = node.nextSibling; continue; }
    el.insertBefore(node, ref);
  }
  while (ref) { const nx = ref.nextSibling; el.removeChild(ref); ref = nx; }

  mbRenderScrollGuard = performance.now() + 200;
  return fresh;
}

// ── Render-Einstieg ────────────────────────────────────────────────────────

// Member-Leiste: scroll-gekoppelter, stufenloser Kollaps via --mc (0..1).
// Oben immer ausgeklappt (--mc 0). Beim Scrollen gleiten die Avatare über die
// ersten ~72px stufenlos zusammen (--mc → 1, smoothstep, frame-genau am Finger).
// SOBALD --mc einen Endpunkt ERREICHT (voll eingeklappt 1 ODER voll ausgeklappt
// 0), federt EINE gedämpfte Sinuswelle dezent über den Endpunkt hinaus und setzt
// sich exakt zurück (Bounce) — direkt beim Erreichen, NICHT erst wenn das
// Scrollen stoppt. Scharfgestellt durchs Überqueren der Mitte (0.5): echte
// Bewegung löst aus, Endpunkt-Jitter nicht. Wird weiter über den Endpunkt
// gescrollt, läuft der Bounce ungestört zu Ende.
let memberUserExpanded = false;

const MC_SNAP  = 4;    // ab hier gilt die Leiste als eingeklappt (Klasse/Tap/Cursor)

// Bounce-Parameter.
const MC_BOUNCE_A   = 0.18; // Overshoot-Amplitude (Peak ~0.11 → --mc ~1.11 / ~-0.11)

}

// Bei prefers-reduced-motion binär (0/1) statt stufenlos.
function mbProgress(scrollEl) {
  if (memberUserExpanded) return 0;
  const top = scrollEl.scrollTop;
  if (top <= MC_SNAP) return 0;
  if (mbReduceMotion()) return 1;
  const raw = mbClamp01(top / MC_RANGE);
  return raw * raw * (3 - 2 * raw); // smoothstep
}

// (0<--mc<1) folgt --mc 1:1 dem Finger (kein Tween). ERREICHT --mc einen Endpunkt
// (0/1) nach echter Bewegung (Mitte 0.5 überquert → _mcArmed), startet EINMALIG
// der Bounce; solange weiter über denselben Endpunkt gescrollt wird, läuft er
// ungestört (kein Cancel/Überschreiben). Scrollen zurück in die Zwischenzone
// bricht den Bounce ab und koppelt wieder an den Finger. Wird auch von
// renderAll() aufgerufen → frische Leisten (--mc 0, _mcLast/_mcArmed undefined)
// halten 0 und bouncen NICHT.
function applyMemberCollapse(scrollEl) {
  if (!scrollEl) return;
  const atTop = scrollEl.scrollTop <= MC_SNAP;

  const target = mbClamp01(mbProgress(scrollEl));
  const endpoint = target <= 0.0001 ? 0 : target >= 0.9999 ? 1 : null;
  const reduce = mbReduceMotion();
  scrollEl.querySelectorAll('.member-bar').forEach(bar => {
    bar.classList.toggle('collapsed', collapsed);

    // beide Richtungen). Robust bei schnellem Flick (ein 0→1-Frame überquert 0.5
    // ebenfalls) und immun gegen Endpunkt-Jitter, der 0.5 nie erreicht.
    const prev = (bar._mcLast === undefined) ? target : bar._mcLast;
    if ((prev - 0.5) * (target - 0.5) < 0) bar._mcArmed = true;
    bar._mcLast = target;

    if (endpoint === null) {
      // Zwischenzone: an den Finger koppeln, laufenden Bounce abbrechen.
      if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
      mbSetVar(bar, target);
    } else if (bar._mcArmed) {
      // Endpunkt gerade nach echter Bewegung erreicht → Bounce auslösen.
      bar._mcArmed = false;
      if (reduce) {
        if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
        mbSetVar(bar, endpoint);
      } else {
        mbBounce(bar, endpoint);
      }
    } else if (!bar._mcTween) {
      // schon am Endpunkt (oder frisch gerendert) → exakt halten.
      mbSetVar(bar, endpoint);
    }
    // sonst: Bounce läuft am Endpunkt, während weiter gescrollt wird → zu Ende laufen lassen.
  });
}

// Touch: federndes Aufklappen (--mc → 0). easeOutBack schwingt kurz über 1,
// dadurch geht --mc minimal unter 0 → gap/Abstand federn leicht auseinander
// und setzen sich (Pop). box-shadow ist per max(0px, ...) gegen negativen
// Spread abgesichert, daher flackert der Ring beim Overshoot nicht.
function mbExpandBar(bar) {
  bar.classList.remove('collapsed');
  if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
  const from = parseFloat(bar.style.getPropertyValue('--mc')) || 0;
  if (mbReduceMotion() || from <= 0.001) { mbSetVar(bar, 0); return; }
  const t0 = performance.now();
  const dur = 320;
  const c1 = 1.70158, c3 = c1 + 1;
  const ease = p => 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); // easeOutBack
  const run = now => {
    const p = (now - t0) / dur;
    if (p >= 1) { mbSetVar(bar, 0); bar._mcTween = 0; return; }
    mbSetVar(bar, from * (1 - ease(p)));
    bar._mcTween = requestAnimationFrame(run);
  };
  bar._mcTween = requestAnimationFrame(run);
}

// Gedämpfte Sinus-Feder am Endpunkt. offset = A*sin(p*PI*k)*(1-p)^2 ist bei p=0
// UND p=1 exakt 0 → startet und landet EXAKT auf dem Endpunkt (kein Drift, kein
// Clamp nötig). Richtungsabhängig: eingeklappt (1) schwingt ÜBER 1 (Squeeze),
// ausgeklappt (0) UNTER 0 (Fan-out). Nutzt bar._mcTween → ein erneutes
// Scroll-Frame (applyMemberCollapse) bricht den Bounce ab und koppelt zurück.
// --mc darf hier [0,1] verlassen (das IST der Overshoot); CSS ist abgesichert:
// box-shadow max(0px,..) → kein negativer Spread; gap clamped auf >=0.
function mbBounce(bar, endpoint) {
  if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
  const sign = endpoint === 1 ? 1 : -1;
  const t0 = performance.now();
  const run = now => {
    const p = (now - t0) / MC_BOUNCE_DUR;
    if (p >= 1) { mbSetVar(bar, endpoint); bar._mcTween = 0; return; } // exakt landen
    const decay  = (1 - p) * (1 - p);
    const offset = MC_BOUNCE_A * Math.sin(p * Math.PI * MC_BOUNCE_K) * decay;
    mbSetVar(bar, endpoint + sign * offset); // 1 Write pro Frame
    bar._mcTween = requestAnimationFrame(run);
  };
  bar._mcTween = requestAnimationFrame(run);
}

function setupMemberCollapse() {
  document.querySelectorAll('.screen').forEach(sc => {
    let ticking = false;
    sc.addEventListener('scroll', () => {
      // Nur echtes Nutzer-Scrollen hebt den Tipp-Ausklapp-Zustand auf; von einem
      // Re-Render ausgelöste Scroll-Events (Layout-Clamp) werden übersprungen.
      if (performance.now() >= mbRenderScrollGuard) memberUserExpanded = false;
      if (ticking) return;                 // rAF-gedrosselt: max. 1 --mc-Write pro Frame
      ticking = true;
      requestAnimationFrame(() => { ticking = false; applyMemberCollapse(sc); });
    }, { passive: true });
  });
  // Erster Tipp auf die eingeklappte Leiste klappt sie aus (statt Member zu wählen).
  // Auf Maus-Geräten ist sie beim Klick schon per :hover offen → Klick wählt direkt.
  const canHover = !!(window.matchMedia && window.matchMedia('(hover: hover)').matches);
  document.addEventListener('click', (e) => {
    const bar = (e.target && e.target.closest) ? e.target.closest('.member-bar.collapsed') : null;
    if (!bar) return;
    memberUserExpanded = true;
    if (canHover && bar.matches(':hover')) {
      // Maus: bereits per :hover offen → --mc nahtlos auf 0 übernehmen (kein
      // Flackern) und Klick DURCHLASSEN → data-member-Handler wählt Member.
      if (bar._mcTween) { cancelAnimationFrame(bar._mcTween); bar._mcTween = 0; }
      bar.classList.remove('collapsed');
      mbSetVar(bar, 0);
      return;
    }
    mbExpandBar(bar);                    // Touch: federndes Aufklappen, KEINE Auswahl
    e.stopPropagation();
    e.preventDefault();
  }, true);
}

// Ring-Grafik der Fortschrittskarte. Geometrie unveraendert aus dem frueheren
// Wochenring: r=30 in einem 76er Feld, Anteil ueber stroke-dashoffset, um -90 Grad
// gedreht, damit der Bogen oben beginnt. Farben kommen aus .ring-track/.ring-value;
// warn faerbt den Bogen rot (liegengebliebene ueberfaellige Aufgaben).
function ringSvg(text, frac, warn) {
  const C = 2 * Math.PI * 30;
  const f = Math.max(0, Math.min(1, Number(frac) || 0));
  return `<svg width="76" height="76" viewBox="0 0 76 76">` +
    `<circle class="ring-track" cx="38" cy="38" r="30" fill="none" stroke-width="7"/>` +
    `<circle class="ring-value${warn ? ' warn' : ''}" cx="38" cy="38" r="30" fill="none" stroke-width="7" stroke-linecap="round" ` +
    `stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - f)).toFixed(1)}" transform="rotate(-90 38 38)"/>` +
    `<text x="38" y="45" text-anchor="middle">${escapeHtml(String(text))}</text></svg>`;
}

// Eine Ring-Kachel: Grafik, Beschriftung, Unterzeile.
function ringTile(text, frac, label, sub, warn) {
  return `<div class="stat-ring">${ringSvg(text, frac, warn)}` +
    `<div class="ring-label">${escapeHtml(label)}</div>` +
    `<div class="ring-sub">${escapeHtml(sub)}</div></div>`;
}

// Artikelstreifen mit der Maus ziehen. Mit dem Finger scrollt der Streifen schon
// nativ (overflow-x), am Zeigergeraet gab es nur Rad und Scrollbalken — und die ist
// hier ausgeblendet. Maus-Events, keine Pointer-Events: die Symcon-Desktop-Webview
// liefert keine (dieselbe Begruendung wie bei bindCardSwipe).
function bindDragScroll(el) {
  if (!el || el._dragScroll) return;
  el._dragScroll = true;
  const SLOP = 6;                        // erst ab hier ist es ein Ziehen, kein Klick
  let startX = 0, startLeft = 0, active = false, decided = false;
  const cleanup = () => {
    active = false; decided = false;
    el.classList.remove('is-dragging');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  const onMove = (e) => {
    if (!active) return;
    const dx = e.clientX - startX;
    if (!decided) {
      if (Math.abs(dx) < SLOP) return;
      decided = true;
      el.classList.add('is-dragging');
    }
    el.scrollLeft = startLeft - dx;
    e.preventDefault();                  // sonst startet die Textauswahl
  };
  const onUp = () => {
    const gezogen = decided;
    cleanup();
    if (!gezogen) return;
    // Nach dem Ziehen folgt ein Klick auf die getroffene Kachel — der darf den
    // Artikel nicht abhaken (gleiche Sperre wie dataset.swiped bei den Wischgesten).
    el.dataset.dragged = '1';
    window.setTimeout(() => { delete el.dataset.dragged; }, 60);
  };
  el.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    active = true; decided = false;
    startX = e.clientX; startLeft = el.scrollLeft;
    document.addEventListener('mousemove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
  });
}

// ── Tagesbriefing ──────────────────────────────────────────────────────────
// Der Text entsteht einmal taeglich im Gateway und wird dort abgelegt; hier wird
// er nur geholt. Deshalb wartet das Dashboard nie auf die KI.
let briefingText = '';
let briefingClips = [];        // vom Gateway vorab erzeugte Tonschnipsel
let briefingVorschau = false;  // true = der Text gilt für MORGEN
let briefingTon = false;       // darf es einen Vorlese-Knopf geben?
let briefingLoading = false;

/** Nur mit Gateway: dort liegt der Text. In der Visu-Kachel scheitert aiPost
    still — die Karte bleibt dort also von selbst aus. */
function briefingAvailable() {
  if (window.__SYMDO__) return true;
  return !!store.gatewayAvailable;
}

function loadBriefing() {
  if (briefingLoading) return;
  if (!briefingAvailable()) {
    if (briefingText) { briefingText = ''; renderAll(); }
    return;
  }
  briefingLoading = true;
  aiPost('/briefing', {}).then(r => {
    briefingLoading = false;
    const j = r && r.json;
    // Kein Gateway, alte Version, Route unbekannt, abgeschaltet: still nichts.
    const frisch = (j && j.ok === true && j.briefing && typeof j.briefing.text === 'string')
      ? j.briefing.text : '';
    const clips = (j && j.briefing && Array.isArray(j.briefing.clips)) ? j.briefing.clips : [];
    const vorschau = !!(j && j.briefing && j.briefing.preview);
    // Ältere Bridge ohne das Feld: Ton war dort immer erlaubt.
    const ton = (j && j.briefing && j.briefing.audio !== undefined)
      ? !!j.briefing.audio
      : !!(j && j.briefing);
    if (frisch === briefingText && clips.join() === briefingClips.join()
        && vorschau === briefingVorschau && ton === briefingTon) return;
    briefingText = frisch;
    briefingClips = clips;
    briefingVorschau = vorschau;
    briefingTon = ton;
    if (!ton) { briefingTonBeenden(); return; }   // rendert selbst
    renderAll();
  }).catch(() => { briefingLoading = false; });
}

// Vorlesen des Briefings. Bewusst eine eigene, einfache Wiedergabe und nicht die
// Einkaufs-Ansage: die fuehrt eine Schrittkette mit Abteilungen, Abhaken und
// Fernbedienung — hier gibt es genau einen Text.
let briefingAudio = null;
let briefingLaeuft = false;
let briefingLaedt = false;
let briefingFern = false;     // Wiedergabe aus Symcon angestossen, nicht per Knopf
let briefingOffen = false;    // Aufklapper: nur auf schmalen Anzeigen von Belang

/** Vorlesen möglich? Immer dann, wenn das Gateway die Sprachausgabe erlaubt —
    auch in der Visu-Kachel: Die holt die Tondatei nicht über den Hook (dafür
    fehlt ihr der Token), sondern als data:-URL über das Relay, siehe
    ansageClipHolen. Sonst wäre der Knopf einer, der nichts kann. */
// ── Benachrichtigungen (Web Push) ─────────────────────────────────────────
// Nur in der ausgelieferten Web-App: In der Visu-Kachel fehlt window.__SYMDO__,
// dort bleibt der ganze Abschnitt aus. Der oeffentliche Schluessel steht im Kopf
// (window.__SYMDO__.pushKey) und nicht hinter einem Abruf — Safari erlaubt die
// Erlaubnisfrage nur mit gueltiger Nutzeraktivierung, und jedes await davor
// verbraucht sie.
let pushMoeglichkeit = null;   // null = noch nicht geprueft
let pushAn = false;
let pushLaeuft = false;
let pushGestartet = false;

function pushMoeglich() {
  if (pushMoeglichkeit !== null) return pushMoeglichkeit;
  pushMoeglichkeit = !!(window.__SYMDO__ && window.__SYMDO__.pushKey
    && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window
    // Ohne sicheren Kontext gibt es keine Service Worker. isSecureContext deckt das
    // vollstaendig ab: HTTPS ueber Connect ja, http im Heimnetz nein, localhost ja.
    // Dort bleibt der Knopf dann weg, statt einen Fehler zu ernten.
    && window.isSecureContext === true);
  return pushMoeglichkeit;
}

/** base64url aus dem Kopf in die Bytes, die subscribe() verlangt. */
function pushSchluesselBytes(b64) {
  const rein = String(b64).replace(/-/g, '+').replace(/_/g, '/');
  const roh = atob(rein + '='.repeat((4 - rein.length % 4) % 4));
  const bytes = new Uint8Array(roh.length);
  for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
  return bytes;
}

function pushSchluesselAlsB64(puffer) {
  if (!puffer) return '';
  let s = '';
  const bytes = new Uint8Array(puffer);
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function pushRegistrieren() {
  // Ohne scope-Angabe: Das Verzeichnis der Skript-Adresse (/hook/lists/) IST schon
  // der gebrauchte Bereich — siehe PWA_HOOK_PATH im Gateway.
  return navigator.serviceWorker.register('/hook/lists/pwa', { updateViaCache: 'none' });
}

/** Abo an das Gateway melden. Es haengt am Token, also am gekoppelten Geraet. */
async function pushMelden(abo) {
  const roh = abo.toJSON();
  const antwort = await aiPost('/push/subscribe', {
    endpoint: roh.endpoint,
    keys: roh.keys || {},
    userId: ls.get('symdo.pushUser') || ''
  });
  return !!(antwort && antwort.json && antwort.json.ok === true);
}

/**
 * Beim Start: Erlaubnis und Abo pruefen, und ein vorhandenes Abo NEU melden.
 *
 * Das erneute Melden ist Absicht: Push-Dienste tauschen Endpunkte ohne Vorwarnung,
 * und der Service Worker kann das nicht selbst berichten — er hat keinen Token.
 * Das Gateway dedupliziert ueber den Endpunkt, der Aufruf kostet also nichts.
 */
async function pushInit() {
  if (pushGestartet || !pushMoeglich()) return;
  pushGestartet = true;
  try {
    const reg = await pushRegistrieren();
    if (Notification.permission !== 'granted') return;
    let abo = await reg.pushManager.getSubscription();
    // Wechselt der VAPID-Schluessel am Gateway, ist ein altes Abo wertlos: Jeder
    // Versand endete in einem 403. Erkennbar am mitgespeicherten Schluessel.
    if (abo && pushSchluesselAlsB64(abo.options && abo.options.applicationServerKey) !== window.__SYMDO__.pushKey) {
      try { await abo.unsubscribe(); } catch (e) {}
      abo = null;
    }
    if (!abo) {
      abo = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: pushSchluesselBytes(window.__SYMDO__.pushKey)
      });
    }
    pushAn = await pushMelden(abo);
  } catch (e) {
    pushAn = false;
  }
  renderDashboard();
}

function pushEinschalten() {
  // Die Erlaubnisfrage MUSS die erste Anweisung sein: Safari verlangt eine gueltige
  // Nutzeraktivierung, und schon ein await davor verbraucht sie (NotAllowedError).
  const frage = Notification.requestPermission();
  pushLaeuft = true;
  renderDashboard();
  (async () => {
    try {
      const erlaubnis = await frage;
      if (erlaubnis !== 'granted') {
        showToast(translate('Notifications were not allowed.'));
        return;
      }
      const reg = await pushRegistrieren();
      let abo = await reg.pushManager.getSubscription();
      if (!abo) {
        abo = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: pushSchluesselBytes(window.__SYMDO__.pushKey)
        });
      }
      pushAn = await pushMelden(abo);
      showToast(pushAn ? translate('Notifications are on') : translate('Notifications could not be turned on.'));
    } catch (e) {
      showToast(translate('Notifications could not be turned on.'));
    } finally {
      pushLaeuft = false;
      renderDashboard();
    }
  })();
}

async function pushAusschalten() {
  pushLaeuft = true;
  renderDashboard();
  try {
    const reg = await navigator.serviceWorker.getRegistration('/hook/lists/');
    const abo = reg ? await reg.pushManager.getSubscription() : null;
    if (abo) { try { await abo.unsubscribe(); } catch (e) {} }
    await aiPost('/push/unsubscribe', {});
    pushAn = false;
  } catch (e) {}
  pushLaeuft = false;
  renderDashboard();
}

async function pushTest() {
  const antwort = await aiPost('/push/test', {});
  const j = antwort && antwort.json;
  if (!j || j.ok !== true) {
    showToast(translate('The test notification could not be sent.'));
  }
}

/** Zuordnung wechseln: Das Gateway merkt sie am Geraet, hier nur der Merkzettel. */
async function pushMitglied(id) {
  ls.set('symdo.pushUser', id || '');
  try {
    const reg = await navigator.serviceWorker.getRegistration('/hook/lists/');
    const abo = reg ? await reg.pushManager.getSubscription() : null;
    if (abo) { pushAn = await pushMelden(abo); }
  } catch (e) {}
  renderDashboard();
}

/** Das Glocken-Menue. Zeigt nur, was im jeweiligen Zustand moeglich ist. */
function pushMenu(anchor) {
  const eintraege = [];
  if (Notification.permission === 'denied') {
    // Auf iOS ist das nicht zuruecknehmbar, solange die App auf dem Home-Bildschirm
    // liegt — ein „nochmal versuchen" waere eine Luege.
    eintraege.push({ header: true, label: translate('Notifications are blocked in the browser settings.') });
  } else if (!pushAn) {
    eintraege.push({ label: translate('Turn on notifications'), icon: 'fa-bell', onClick: pushEinschalten });
  } else {
    eintraege.push({ label: translate('Send test notification'), icon: 'fa-paper-plane', onClick: pushTest });
    eintraege.push({ sep: true });
    eintraege.push({ header: true, label: translate('Notify on this device for') });
    const jetzt = ls.get('symdo.pushUser') || '';
    eintraege.push({ label: translate('Whole household'), checked: jetzt === '', onClick: () => pushMitglied('') });
    for (const u of (store.users || [])) {
      eintraege.push({ label: u.name, checked: jetzt === u.id, onClick: () => pushMitglied(u.id) });
    }
    eintraege.push({ sep: true });
    eintraege.push({ label: translate('Turn off notifications'), icon: 'fa-bell-slash', onClick: pushAusschalten });
  }
  openMenu(anchor, eintraege);
}

// Der Service Worker meldet den Zielbereich einer angetippten Nachricht.
if ('serviceWorker' in navigator) {
  try {
    navigator.serviceWorker.addEventListener('message', (event) => {
      const d = event.data || {};
      if (d.type === 'symdoTab' && typeof d.tab === 'string' && d.tab !== '') setTab(d.tab);
    });
  } catch (e) {}
}

/**
 * Den Aufklapper nur zeigen, wenn wirklich mehr da ist als die vier Zeilen.
 *
 * Gemessen statt geraten: Die Zeichenzahl sagt nichts ueber die Zeilenzahl —
 * Schriftgroesse, Kartenbreite und Umbrueche entscheiden. Auf breiten Anzeigen hebt
 * die Media-Query das Kappen auf, dann laeuft nichts ueber und der Knopf geht von
 * selbst. Im aufgeklappten Zustand bleibt er stehen, sonst gaebe es keinen Weg
 * zurueck.
 */
function briefingKlappHinweis(wurzel) {
  const text = wurzel.querySelector('.briefing-text');
  const knopf = wurzel.querySelector('.briefing-mehr');
  if (!text || !knopf) return;
  knopf.hidden = !briefingOffen && text.scrollHeight <= text.clientHeight + 1;
}

function briefingTonMoeglich() {
  return briefingTon;
}

/**
 * Der Text in Haeppchen fuer die Sprachausgabe. Das Gateway kappt jeden Text bei
 * 200 Zeichen (TTS_MAX_CHARS) — ungeteilt bliebe also der halbe Satz stumm.
 * Geteilt wird an Satzenden, und ein ueberlanger Satz notfalls am Komma.
 */
function briefingHaeppchen(text) {
  const grenze = 190;
  const raus = [];
  const saetze = String(text).replace(/\s+/g, ' ').trim().match(/[^.!?]+[.!?]*/g) || [];
  let puffer = '';
  const schieben = () => { const t = puffer.trim(); if (t) raus.push(t); puffer = ''; };
  for (const satz of saetze) {
    if ((puffer + ' ' + satz).trim().length <= grenze) { puffer = (puffer + ' ' + satz).trim(); continue; }
    schieben();
    if (satz.trim().length <= grenze) { puffer = satz.trim(); continue; }
    // Notfall: ein einzelner Satz ist zu lang — am Komma trennen, sonst hart.
    let rest = satz.trim();
    while (rest.length > grenze) {
