  // data-key auf allen Knoten ohne data-id (siehe renderRows)
  let html = '';
  if (open.length === 0 && done.length === 0) {
    const msg = todoFilter.size > 0 ? translate('No matches for this filter.') : translate('No tasks');
    html += `<div class="empty-state" data-key="empty"><i class="fa-light fa-list-check"></i>${msg}</div>`;
  }
  for (const it of open) html += todoRowHtml(it, canReorder, badges, showEdit, showDelete);
  if (done.length > 0 && st.hideCompletedTasks !== true) {
    html += `<button class="section-toggle${completedExpanded ? ' open' : ''}" data-key="doneToggle" id="doneToggle">` +
      `<i class="fa-light fa-circle-check"></i>${translate('Completed')}` +
      `<span class="count">${done.length}</span><i class="fa-light fa-chevron-right chev"></i></button>`;
    if (completedExpanded) {
      for (const it of done) html += todoRowHtml(it, false, badges, showEdit, showDelete);
    }
  }
  const freshNodes = renderRows(area, html);
  if (freshNodes === false) return;

  const doneToggle = freshNodes.find(n => n.id === 'doneToggle');
  if (doneToggle) doneToggle.addEventListener('click', () => {
    completedExpanded = !completedExpanded;
    ls.set('symdo.completedExpanded', completedExpanded ? '1' : '0');
    renderTodos();
  });

  // Wie bei der Einkaufsliste: nur neue Karten binden, und die Handler holen
  // ihre Daten beim Ereignis statt sie beim Rendern festzuhalten.
  const curId = () => selectedTodoID();
  const curItem = (iid) => ((instState(curId()) || {}).items || []).find(i => i.id === iid);
  const openNow = () => {
    const s = instState(curId()) || {};
    let list = s.items || [];
    if (todoFilter.size > 0) {
      list = list.filter(it => Array.isArray(it.assignedTo) && it.assignedTo.some(mid => todoFilter.has(mid)));
    }
    return sortTodoItems(list, String(s.sortMode || 'created'), String(s.sortDir || 'asc')).filter(i => !i.done);
  };
  const doneNow = () => {
    const s = instState(curId()) || {};
    let list = s.items || [];
    if (todoFilter.size > 0) {
      list = list.filter(it => Array.isArray(it.assignedTo) && it.assignedTo.some(mid => todoFilter.has(mid)));
    }
    return sortTodoItems(list, String(s.sortMode || 'created'), String(s.sortDir || 'asc')).filter(i => i.done);
  };
  freshNodes.filter(n => n.classList && n.classList.contains('todo-card')).forEach(card => {
    const itemId = parseInt(card.dataset.id);
    if (!curItem(itemId)) return;
    bindTodoGesture(card, id, area, openNow, doneNow, canReorder,
      () => sdCall(curId(), 'DeleteItem', { id: itemId }),
      () => { const it = curItem(itemId); if (it) openTodoEditor(curId(), it); });
    const chk = card.querySelector('.chk');
    chk.addEventListener('click', (e) => e.stopPropagation());
    chk.addEventListener('change', () => {
      if (card.dataset.animating === '1') return;
      card.dataset.animating = '1';
      const done = chk.checked;
      // Abgehakt schiebt nach rechts, wieder geoeffnet nach links — wie bei den Artikeln.
      checkOffCard(card, !done, () => sdCall(curId(), 'ToggleDone', { id: itemId, done: done }));
    });
    // Tipp auf die Karte öffnet den Editor — unabhaengig davon, ob der Stift-Knopf
    // eingeblendet ist. Der Knopf ist ein zusaetzlicher Weg, kein Ersatz.
    card.querySelector('.todo-content').addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button, .chk')) return;
      const it = curItem(itemId);
      if (it) openTodoEditor(curId(), it);
    });
    const editBtn = card.querySelector('[data-edit]');
    if (editBtn) editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const it = curItem(itemId);
      if (it) openTodoEditor(curId(), it);
    });
    const delBtn = card.querySelector('[data-del]');
    if (delBtn) delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sdCall(curId(), 'DeleteItem', { id: itemId });
    });
  });

  ensureTodoMetaObserver();
  requestAnimationFrame(layoutTodoMeta);
}

// Chip-/Button-Zeile einer Aufgabe: belegt sie mehr als die Hälfte der
// Task-Breite, rutscht sie als eigene Zeile unter den restlichen Inhalt.
let todoMetaRO = null;
let todoMetaLastW = -1;
let todoMetaMO = null;
let todoMetaLateTimer = 0;

/**
 * Nachmessen, wenn die Chips erst später ihre endgültige Breite bekommen.
 * Zwei Quellen dafür:
 *  - /icons.js (Font Awesome SVG+JS) ersetzt jedes <i> NACHTRÄGLICH durch ein
 *    <svg>. Vorher sind die Icon-Chips fast leer; die Messung im
 *    requestAnimationFrame direkt nach dem Rendern sieht also eine zu schmale
 *    Zeile — die Verdichtung greift dann nie, und die Zeile bricht später um.
 *  - Webfont-Metrik (document.fonts.ready).
 * Klassenwechsel aus layoutTodoMeta lösen das NICHT erneut aus: das sind
 * Attribut-, keine childList-Änderungen — also keine Rückkopplung.
 */
function ensureTodoMetaLateObserver() {
  const bereiche = META_BEREICHE
    .map(cfg => document.getElementById(cfg.area))
    .filter(Boolean);
  if (bereiche.length === 0) return;
  if (!todoMetaMO && typeof MutationObserver !== 'undefined') {
    // /icons.js liefert die <svg> NACHTRAEGLICH — vorher sind die Icon-Chips fast
    // leer und die Messung sieht eine zu schmale Zeile. Das gilt in der
    // Vorschlagsliste genauso wie in der Aufgabenliste.
    todoMetaMO = new MutationObserver(() => {
      clearTimeout(todoMetaLateTimer);
      todoMetaLateTimer = setTimeout(layoutTodoMeta, 60);
    });
    bereiche.forEach(a => todoMetaMO.observe(a, { childList: true, subtree: true }));
  }
  if (document.fonts && document.fonts.ready && !ensureTodoMetaLateObserver.fontsHooked) {
    ensureTodoMetaLateObserver.fontsHooked = true;
    document.fonts.ready.then(() => layoutTodoMeta()).catch(() => {});
  }
}
/**
 * Die Bereiche, deren Chip-Zeilen gemessen werden. Aufgabenliste und
 * Vorschlagsbaender teilen sich die Logik UND die CSS-Regeln — eine Zeile, die in
 * beiden Listen gleich aussehen soll, darf nicht zwei Messungen haben.
 */
const META_BEREICHE = [
  { area: 'todoListArea', card: '.todo-card', content: '.todo-content', side: '.todo-side', meta: '.todo-meta' },
  { area: 'kiFinds',      card: '.mail-item', content: '.mail-row',     side: '.mail-side', meta: '.mail-chips' },
  { area: 'calArea',      card: '.cal-card',  content: '.cal-event',    side: '.cal-side',  meta: '.cal-chips'  },
  /* Die Uebersicht fehlte hier. Ihre Aufgaben- und Terminzeilen sind dieselben
     Zeilen wie in den Bereichen darueber, wurden aber NIE gemessen — sie
     stapelten deshalb nie, egal wie breit die Chips wurden. Auf dem Telefon
     nahmen Gesicht, Faelligkeit und Priorität gut die halbe Zeile, und vom Titel
     blieb „Müll rausb…". Zwei Eintraege, weil dort beide Zeilenarten stehen. */
  { area: 'dashboardContent', card: '.todo-card', content: '.todo-content', side: '.todo-side', meta: '.todo-meta' },
  /* In der Uebersicht steht die Terminzeile OHNE .cal-card-Rahmen — die Zeile
     ist dort selbst die Karte. Deshalb zweimal derselbe Waehler; inhalt() unten
     nimmt in dem Fall das Element selbst. */
  { area: 'dashboardContent', card: '.cal-event', content: '.cal-event',    side: '.cal-side',  meta: '.cal-chips'  },
];

/** Anteil der Zeilenbreite, ab dem die Chips eine eigene Zeile bekommen. */
const META_ANTEIL = 0.4;

function layoutTodoMeta() {
  META_BEREICHE.forEach(layoutRowMeta);
}

function layoutRowMeta(cfg) {
  const area = document.getElementById(cfg.area);
  if (!area) return;
  if (cfg.area === 'todoListArea') todoMetaLastW = area.clientWidth;
  const cards = area.querySelectorAll(cfg.card);
  // Erst überall zurücksetzen, damit die natürliche (nicht verdichtete)
  // Chip-Breite gemessen wird, dann pro Zeile stufenweise entscheiden.
  // Die Zeile kann die Karte SELBST sein (Terminzeile der Uebersicht) — dann
  // findet querySelector sie nicht, weil der nur nach unten sucht.
  const inhalt = (card) => card.matches(cfg.content) ? card : card.querySelector(cfg.content);
  cards.forEach(card => {
    const c = inhalt(card);
    if (c) c.classList.remove('stacked', 'meta-tight', 'meta-tighter', 'meta-clip');
  });
  cards.forEach(card => {
    const c = inhalt(card);
    const m = card.querySelector(cfg.side) || card.querySelector(cfg.meta);
    if (!c || !m) return;
    /* Belegt die Chip-Zeile mehr als META_ANTEIL der Kartenbreite, rutscht sie
       als eigene Zeile unter den Inhalt.

       Die Grenze lag bei der HAELFTE. Das war zu spaet: bei knapp der Haelfte
       bleibt dem Titel die andere Haelfte minus Kontrollkaestchen und Abstaenden,
       und lange Titel enden dann schon bei zehn Zeichen mit Puenktchen. Bei 0,4
       wandern die Chips frueher hinunter und der Titel bekommt echte Breite. */
    if (m.offsetWidth <= c.clientWidth * META_ANTEIL) return;
    c.classList.add('stacked');

    // Verdichtet wird ausschließlich HIER, in der eigenen Zeile — und nur, wenn
    // selbst deren volle Breite nicht reicht. Ohne diese Prüfung ragt die Zeile
    // heraus und schneidet den Drag-Griff rechts ab.
    // Referenz ist die KARTE, nicht .todo-side: dessen `flex: none` (also
    // flex-shrink: 0) lässt die Box trotz flex-basis:100% auf Inhaltsbreite
    // stehen und aus der Karte herausragen — gemessen 307 px in 289 px. Die
    // Kinder gegen die eigene Box zu prüfen wäre blind, denn die wächst mit ihnen.
    // Kriterium ist der UMBRUCH, nicht eine gerechnete Breite: die Chips dürfen
    // in der eigenen Zeile umbrechen (siehe CSS), also überschreiten sie nie eine
    // Breite — sie werden höher. „Platz reicht nicht" heißt damit genau: die
    // Chips bräuchten eine zweite Zeile. Das misst den tatsächlichen Zustand und
    // hängt nicht an Innenabständen, Schriftmetrik oder Flex-Feinheiten.
    const meta = c.querySelector(cfg.meta);
    // „Zu eng" heisst je nach Zeile etwas anderes, deshalb BEIDE Proben:
    //  - Umbrechende Box (Aufgabe, Termin): sie wird hoeher als ihr hoechstes Kind.
    //  - Nicht umbrechende Box (Vorschlagszeile): sie laeuft waagerecht ueber.
    // Nur die Hoehe zu messen liess die Verdichtung bei nowrap nie anlaufen, nur
    // die Breite zu messen bei wrap nie — eine umbrechende Box laeuft nicht ueber.
    const zuEng = () => {
      if (!meta || !meta.firstElementChild) return false;
      let tallest = 0;
      for (const el of meta.children) {
        tallest = Math.max(tallest, el.getBoundingClientRect().height);
      }
      if (meta.getBoundingClientRect().height > tallest + 2) return true;
      // Waagerechter Ueberlauf NICHT ueber scrollWidth: auf einer Box mit
      // `overflow: visible` gibt Chrome dort clientWidth zurueck und verschweigt
      // herausragende Kinder (gemessen — Stufe 3 lief damit nie an). Stattdessen
      // die tatsaechliche Ausdehnung der Kinder gegen die Box.
      const box = meta.getBoundingClientRect();
      let links = Infinity, rechts = -Infinity;
      for (const el of meta.children) {
        const r = el.getBoundingClientRect();
        if (r.width === 0 && r.height === 0) continue;   // ausgeblendete Chips zaehlen nicht
        links = Math.min(links, r.left);
        rechts = Math.max(rechts, r.right);
      }
      if (rechts === -Infinity) return false;
      return (rechts - links) > box.width + 1;
    };
    if (!zuEng()) return;
    // Stufe 1: Wiederholung + Erinnerung + Anzahl in einen Chip
    c.classList.add('meta-tight');
    if (!zuEng()) return;
    // Stufe 2: zwei Avatare weichen einem Zähler (nur ab drei Avataren — sonst
    // fehlt die Vorlage im Markup und die Klasse bleibt wirkungslos)
    c.classList.add('meta-tighter');
    if (!zuEng()) return;
    // Stufe 3: der Datums-Chip gibt nach. Bewusst ZULETZT — ein gekuerztes Datum
    // ist der teuerste Verlust in der Zeile, ein Symbol-Chip der billigste.
    c.classList.add('meta-clip');
  });
}
function ensureTodoMetaObserver() {
  ensureTodoMetaLateObserver();
  if (todoMetaRO || typeof ResizeObserver === 'undefined') return;
  // Alle Meta-Bereiche beobachten, nicht nur die Aufgabenliste: das Vorschlagsband
  // im Kalender-Tab aendert seine Breite unabhaengig davon (anderer Tab, anderes
  // Kachelmass) und muesste sonst auf den naechsten Render warten.
  const bereiche = META_BEREICHE
    .map(cfg => document.getElementById(cfg.area))
    .filter(Boolean);
  if (bereiche.length === 0) return;
  todoMetaRO = new ResizeObserver(() => {
    // Nur bei Breitenaenderung neu rechnen. Hoehenaenderungen entstehen durch das
    // Stapeln selbst — darauf zu reagieren waere eine Schleife.
    let breiter = false;
    for (const a of bereiche) {
      if (a.clientWidth !== a._metaLastW) { a._metaLastW = a.clientWidth; breiter = true; }
    }
    if (breiter) layoutTodoMeta();
  });
  bereiche.forEach(a => { a._metaLastW = a.clientWidth; todoMetaRO.observe(a); });
}

/**
 * Eine Aufgabenzeile. Dieselbe Funktion fuer den Aufgaben-Bereich UND die Uebersicht,
 * damit dieselbe Aufgabe nicht an zwei Stellen unterschiedlich aussieht.
 *
 * `instanzID` haengt die Listenkennung an die Zeile — im Bereich gibt es genau eine
 * Liste, auf der Uebersicht mehrere. `zusatz` ist eine zusaetzliche Zeile unter dem
 * Titel; dort steht auf der Uebersicht der Listenname, wenn es mehrere Listen gibt.
 */
function todoRowHtml(it, draggable, badges, showEdit, showDelete, instanzID = 0, zusatz = '', wischbar = true) {
  // Jede Sorte hat ihren eigenen Schalter — auch die Prioritaet.
  const zeige = (sorte) => badges[sorte] !== false;
  const chip = zeige('due') ? formatDueChip(it) : '';
  const qty = zeige('quantity') ? (parseInt(it.quantity) || 0) : 0;
  const recurs = zeige('recurrence') && it.recurrence && it.recurrence !== 'none';
  // Fälligkeits-Zustand wie in der ToDoList-Kachel: überfällig rot, heute orange,
  // sonst neutral. Erledigte Aufgaben bleiben neutral (nicht rot/orange).
  const dueState = it.done ? '' : classifyDue(it);
  const dueBadgeClass = dueState === 'overdue' ? 'due-overdue' : (dueState === 'today' ? 'due-today' : '');
  const notifies = zeige('notification') && it.notification === true;
  // Stufe 1 der Meta-Verdichtung: Wiederholung, Erinnerung und Anzahl in EINEM
  // Chip. Erst ab zwei dieser Angaben lohnt es sich — ein Chip durch einen Chip
  // zu ersetzen spart nichts. Beide Varianten stehen im Markup, layoutTodoMeta
  // schaltet per Klasse um (kein Neu-Rendern beim Messen).
  const metaCount = (recurs ? 1 : 0) + (notifies ? 1 : 0) + (qty > 1 ? 1 : 0);
  const combined = metaCount >= 2
    ? `<span class="badge attr meta-combined" title="${escapeHtml([
        recurs ? recurrenceLabel(it.recurrence, it.recurrenceCustomUnit, it.recurrenceCustomValue) : '',
        notifies ? translate('Notification') : '',
        qty > 1 ? qty + '×' : '',
      ].filter(Boolean).join(' · '))}">` +
      (recurs ? '<i class="fa-light fa-repeat"></i>' : '') +
      (notifies ? '<i class="fa-light fa-bell"></i>' : '') +
      (qty > 1 ? `<span>${qty}×</span>` : '') +
      '</span>'
    : '';
  const unten = [it.info, zusatz].filter(Boolean).join(' · ');
  return `<div class="todo-card${it.done ? ' done-row' : ''}" data-id="${it.id}"` +
    (instanzID ? ` data-inst="${instanzID}" data-item="${it.id}"` : '') + `>` +
    // Die Wisch-Untergruende nur dort, wo auch gewischt wird. Auf der Uebersicht
    // gibt es die Geste nicht — dann waeren es zwei Knoten, die nie etwas tun.
    (wischbar
      ? `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
        `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>`
      : '') +
    `<div class="todo-content">` +
    `<input type="checkbox" class="chk"${it.done ? ' checked' : ''} aria-label="${translate('Done')}" />` +
    `<span class="todo-main"><span class="todo-title">${escapeHtml(it.title)}</span>` +
    (unten ? `<span class="todo-info">${escapeHtml(unten)}</span>` : '') +
    `</span><span class="todo-side"><span class="todo-meta">` +
    renderAvatarStack(it.assignedTo) +
    (qty > 1 ? `<span class="badge quantity${combined ? ' meta-split' : ''}">${qty}×</span>` : '') +
    (recurs ? `<span class="badge attr${combined ? ' meta-split' : ''}" title="${escapeHtml(recurrenceLabel(it.recurrence, it.recurrenceCustomUnit, it.recurrenceCustomValue))}"><i class="fa-light fa-repeat"></i></span>` : '') +
    (notifies ? `<span class="badge attr${combined ? ' meta-split' : ''}" title="${escapeHtml(translate('Notification'))}"><i class="fa-light fa-bell"></i></span>` : '') +
    combined +
    (chip ? `<span class="badge due-badge ${dueBadgeClass}" title="${escapeHtml(chip)}"><i class="fa-light fa-calendar due-icon"></i><span class="due-text">${escapeHtml(chip)}</span></span>` : '') +
    (zeige('priority') ? `<span class="badge ${priorityKey(it.priority)}">${escapeHtml(priorityLabel(it.priority))}</span>` : '') +
    `</span>` +
    (showEdit ? `<button class="row-btn" data-edit="1" aria-label="${translate('Edit')}" title="${translate('Edit')}"><i class="fa-light fa-pencil"></i></button>` : '') +
    (showDelete ? `<button class="row-btn destructive" data-del="1" aria-label="${translate('Delete')}" title="${translate('Delete')}"><i class="fa-light fa-trash"></i></button>` : '') +
    (draggable ? `<span class="todo-handle" aria-label="${translate('Reorder')}" title="${translate('Reorder')}"><i class="fa-light fa-grip-dots-vertical"></i></span>` : '') +
    `</span></div></div>`;
}

// Drag-Reorder nur im manuellen Modus: offene zuerst (neue Reihenfolge),
// erledigte hinten angehängt — wie in App und ToDoList-Kachel
let dndDragId = null;
function bindTodoDnd(area, instanceID, open, done, enabled) {
  if (!enabled) return;
  area.querySelectorAll('.todo-card[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      dndDragId = parseInt(card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const targetId = parseInt(card.dataset.id);
      if (dndDragId === null || dndDragId === targetId) return;
      const ids = open.map(i => i.id);
      const from = ids.indexOf(dndDragId);
      const to = ids.indexOf(targetId);
      if (from === -1 || to === -1) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      sdCall(instanceID, 'Reorder', { order: ids.concat(done.map(i => i.id)) });
      dndDragId = null;
    });
  });
}

// ── Favoriten ──────────────────────────────────────────────────────────────
// Detailansicht von „Schon gekauft". Eigener Schalter statt favDetailListId, weil
// die Liste keine ID im Favoritenbestand hat.
let favBoughtOpen = false;
// Favoriten. Uebersicht und Detail rendern in ZWEI Container (#favMaster,
// #favDetail): schmal ist immer nur einer sichtbar (Verhalten wie bisher), ab
// 1100px stehen sie nebeneinander. Deshalb sind die drei fruehreren Zweige
// eigene Funktionen mit dem Ziel-Element als Parameter — renderRows() erkennt
// Knoten pro Container wieder, jeder Zweig MUSS also in seinen eigenen schreiben.
function renderFavorites() {
  const elMaster = document.getElementById('favMaster');
  const elDetail = document.getElementById('favDetail');
  const id = selectedShoppingID();
  const st = id ? instState(id) : null;
  if (!st) {
    renderInto(elMaster, `<div class="empty-state"><i class="fa-light fa-heart"></i>${translate('No shopping list found')}${noInstanceHint('shopping')}</div>`);
    renderInto(elDetail, '');
    document.getElementById('favoritesContent').classList.remove('detail-open');
    return;
  }
  const lists = (Array.isArray(st.favoriteLists) ? st.favoriteLists.slice() : []).sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base', numeric: true }));
  // Schon einmal abgehakte Artikel. Eigener State-Schlüssel, KEIN Eintrag in
  // favoriteLists — sonst bekäme jeder je gekaufte Artikel in der Einkaufsliste ein
  // gefülltes Herz (favNames speist sich aus allen Favoritenlisten).
  const bought = Array.isArray(st.purchased) ? st.purchased : [];
  if (favBoughtOpen && bought.length === 0) favBoughtOpen = false;
  const detail = favDetailListId ? lists.find(l => l.id === favDetailListId) : null;
  if (favDetailListId && !detail) favDetailListId = null;
  // Typ der Rezeptdatei früh besorgen, damit „Rezept öffnen" beim Klick sofort
  // weiß, ob es ein PDF an den System-Viewer übergeben muss.
  if (detail && detail.mediaId) prefetchMediaType(detail.mediaId);

  renderFavMaster(elMaster, st, lists, bought, detail);
  renderFavPane(elDetail, st, lists, bought, detail);
  // Eine Stelle entscheidet, ob ein Detail offen ist — die CSS-Regeln haengen
  // daran (schmal: genau eine Spalte sichtbar).
  document.getElementById('favoritesContent')
    .classList.toggle('detail-open', !!detail || favBoughtOpen);
}

// Uebersicht der Favoritenlisten. Wird jetzt IMMER gerendert, auch wenn rechts
// ein Detail steht — nebeneinander ist sie die Auswahlspalte.
function renderFavMaster(el, st, lists, bought, detail) {
  let html = `<div class="screen-head" data-key="head"><h2>${translate('Favorites')}</h2>` +
    `<button class="icon-btn" id="btnFavCreate" aria-label="${translate('New favorite list')}"><i class="fa-light fa-plus"></i></button></div>`;
  // „Schon gekauft" steht VOR der Schleife, sonst würde sie alphabetisch
  // einsortiert. Bewusst ohne .swipe-under, ohne Warenkorb-Knopf: das Markup muss
  // sich von einer normalen Karte unterscheiden, sonst könnte renderRows einen
  // Knoten samt seiner alten Wisch- und Lösch-Handler wiederverwenden.
  if (bought.length > 0) {
    html += `<div class="fav-card bought-card${favBoughtOpen ? ' is-open' : ''}" data-key="boughtcard">` +
      `<div class="fav-row" data-bought="1">` +
      `<span class="fav-badge bought-badge"><i class="fa-light fa-basket-shopping"></i></span>` +
      `<span class="fav-main"><span class="fav-name">${translate('Already bought')}</span>` +
      `<span class="fav-count">${bought.length === 1 ? translate('1 item') : translate('%1 items').replace('%1', String(bought.length))}</span></span>` +
      `<i class="fa-light fa-chevron-right fav-chevron"></i>` +
      '</div></div>';
  }
  if (lists.length === 0 && bought.length === 0) {
    html += `<div class="empty-state" data-key="empty"><i class="fa-light fa-heart"></i>${translate('No favorite lists')}</div>`;
  }
  for (const list of lists) {
    const count = (list.items || []).length;
    html += `<div class="fav-card${detail && detail.id === list.id ? ' is-open' : ''}" data-key="fav:${escapeHtml(list.id)}">` +
      `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
      `<div class="swipe-under-edit"><i class="fa-light fa-cart-plus"></i></div>` +
      `<div class="fav-row" data-list="${escapeHtml(list.id)}">` +
      favBadgeHtml(list) +
      `<span class="fav-main"><span class="fav-name">${escapeHtml(list.name)}</span>` +
      `<span class="fav-count">${count === 1 ? translate('1 item') : translate('%1 items').replace('%1', String(count))}</span></span>` +
      `<button class="fav-cart-btn" data-addall="${escapeHtml(list.id)}" aria-label="${translate('Add all to shopping list')}"><i class="fa-light fa-cart-plus"></i></button>` +
      '</div></div>';
  }
  const freshFav = renderRows(el, html);
  if (freshFav === false) return;
  const curLists = () => {
    const s = instState(selectedShoppingID()) || {};
    return Array.isArray(s.favoriteLists) ? s.favoriteLists : [];
  };
  const boughtNode = freshFav.find(n => n.querySelector && n.querySelector('[data-bought]'));
  if (boughtNode) boughtNode.querySelector('[data-bought]').addEventListener('click', () => {
    favBoughtOpen = true;
    favDetailListId = null;   // die beiden Auswahlen schliessen sich aus
    renderFavorites();
  });
  const headNode = freshFav.find(n => n.querySelector && n.querySelector('#btnFavCreate'));
  if (headNode) headNode.querySelector('#btnFavCreate').addEventListener('click', () => {
    showPrompt(translate('New favorite list'), '', translate('Create'), (name, istRezept) => {
      if (name.trim()) {
        sdCall(selectedShoppingID(), 'CreateFavoriteList', { name: name.trim(), isRecipe: !!istRezept });
      }
    }, { text: translate('This list is a recipe'), hint: translate('Recipes get a generated dish image instead of the heart.') });
  });
  freshFav.forEach(node => (node.querySelectorAll ? node.querySelectorAll('[data-addall]') : []).forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    addFavListToCart(selectedShoppingID(), curLists().find(l => l.id === btn.dataset.addall));
  })));
  // Die Kaufliste ist zwar eine .fav-card, aber KEINE Favoritenliste: sie hat keine
  // data-list-ID. Ohne den Ausschluss bekam sie zusaetzlich zu ihrem eigenen Handler
  // die Auswahl- und Wisch-Handler der Listen. Der Auswahl-Handler lief als zweiter
  // und setzte favDetailListId auf undefined — dass „Schon gekauft" trotzdem aufging,
  // lag nur daran, dass undefined falsy ist. Wischen nach links haette ausserdem
  // DeleteFavoriteList mit undefined aufgerufen.
  freshFav.filter(n => n.classList && n.classList.contains('fav-card')
                       && !n.classList.contains('bought-card')).forEach(card => {
    const row = card.querySelector('.fav-row');
    const listId = row.dataset.list;
    const list = () => curLists().find(l => l.id === listId);
    // Swipe links = Liste löschen (mit Bestätigung wie im Menü), rechts = alles auf die Einkaufsliste.
    bindCardSwipe(card, '.fav-row',
      () => {
        // Slide-out zurücknehmen (bei Abbruch bleibt die Zeile erhalten), dann bestätigen.
        card.classList.remove('is-deleting'); delete card.dataset.animating;
        row.style.transform = ''; restoreCard(card);
        showConfirm(translate('Delete this favorite list?'), translate('Delete'), () => {
          if (favDetailListId === listId) favDetailListId = null;
          sdCall(selectedShoppingID(), 'DeleteFavoriteList', listId);
        });
      },
      () => { addFavListToCart(selectedShoppingID(), list()); },
      { dissolve: false }
    );
    row.addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button')) return;
      favDetailListId = listId;
      favBoughtOpen = false;   // sonst blieb nebeneinander die Kaufliste stehen
      renderFavorites();
    });
  });
  return;
}

// Rechte Spalte: Kaufliste, Listendetail oder — ohne Auswahl — ein Hinweis,
// damit die Spalte auf breiten Schirmen nicht leer klafft.
function renderFavPane(el, st, lists, bought, detail) {
  if (favBoughtOpen) { renderFavBought(el, st, bought); return; }
  if (detail) { renderFavList(el, st, detail); return; }
  renderRows(el, `<div class="empty-state" data-key="pick"><i class="fa-light fa-hand-pointer"></i>${translate('Select a list')}</div>`);
}

  // Detailansicht von „Schon gekauft": nur lesen, kein Bearbeiten, kein Löschen der
  // Liste, kein „Alles in den Einkauf" (das wären je nach Bestand hunderte Artikel).
  // Antippen setzt den Artikel auf die Einkaufsliste, Wischen nach links vergisst ihn.
function renderFavBought(el, st, bought) {
  let bhtml = `<div class="screen-head" data-key="boughthead">` +
    `<button class="icon-btn" id="btnBoughtBack" aria-label="${translate('Back')}"><i class="fa-light fa-chevron-left"></i></button>` +
    `<h2>${translate('Already bought')}</h2></div>`;
  const openNames = new Set((st.items || []).filter(i => !i.inCart).map(i => String(i.name || '').trim().toLowerCase()));
  for (const b of bought) {
    const img = getProductImageUrl(b.name);
    const tint = categoryStyle(b.category).tint;
    // Steht der Artikel schon offen auf der Liste, wird das mit einem Haken
    // angezeigt — die Zeile bleibt aber bedienbar: AddItemInternal legt KEINE
    // Dublette an, sondern erhöht die Menge (IncrementAmount). Ein zweiter Tipp
    // bedeutet also „noch eins davon" und ist eine sinnvolle Aktion.
    const onList = openNames.has(String(b.name || '').trim().toLowerCase());
    // Mengenregler wie in den Favoritenlisten: numerische Mengen bekommen den
    // Stepper, alles andere („500 g") bleibt ein reines Abzeichen.
    const amountRaw = String(b.amount || '').trim();
    const numeric = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
    const amount = amountRaw === '' ? '1' : amountRaw;
    let side = '';
    if (numeric) {
      const canDec = parseInt(amount) > 1;
      side += `<span class="stepper"><button data-bstep="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>` +
        `<span class="amount-badge">${escapeHtml(amount)}</span>` +
        `<button data-bstep="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button>` +
        '</span>';
    } else {
      side += `<span class="amount-badge" data-amount-edit="1" role="button" tabindex="0" title="${translate('Change quantity')}">${escapeHtml(amount)}</span>`;
    }
    side += `<button class="heart-btn cart-btn" data-boughtadd="1" aria-label="${translate('Add to shopping list')}"><i class="fa-light fa-cart-plus"></i></button>`;
    bhtml += `<div class="item-card bought-row${onList ? ' on-list' : ''}" data-key="bought:${escapeHtml(b.name)}" data-name="${escapeHtml(b.name)}" data-cat="${escapeHtml(b.category || '')}">` +
      `<div class="swipe-under bought-forget"><i class="fa-light fa-clock-rotate-left"></i></div>` +
      `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` +
      `<div class="item-card-content">` +
      // Ohne Farbe (Payload ohne categoryStyles) bleibt das Attribut weg — dann gilt
      // background: var(--surface2) aus dem CSS statt eines leeren background:.
      `<span class="item-thumb"${(img || tint) ? ` style="background:${img ? 'transparent' : tint}"` : ''}>` +
      (img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" />`
           : escapeHtml(String(b.name || '?').charAt(0).toUpperCase())) +
      `</span><span class="item-main"><span class="item-name">${escapeHtml(b.name)}</span></span>` +
      // Derselbe Warenkorb-Knopf wie in den Favoritenlisten, auch wenn der Artikel
      // schon auf der Liste steht — dann erhöht er die Menge. Dass er dort liegt,
      // zeigt die zurückgenommene Namensfarbe.
      `<span class="item-side">${side}</span></div></div>`;
  }
  const freshBought = renderRows(el, bhtml);
  if (freshBought === false) return;
  const backNode = freshBought.find(n => n.querySelector && n.querySelector('#btnBoughtBack'));
  if (backNode) backNode.querySelector('#btnBoughtBack').addEventListener('click', () => {
    favBoughtOpen = false;
    renderFavorites();
  });
  freshBought.filter(n => n.classList && n.classList.contains('bought-row')).forEach(card => {
    const name = card.dataset.name;
    const cat  = card.dataset.cat || '';
    // Zwei Rückmeldungen, weil zwei Dinge passieren können: neu aufnehmen oder die
    // Menge des schon gelisteten Artikels erhöhen.
    // Zustand IMMER frisch auflösen: zwischen Rendern und Klick kann sich die
    // Historie geändert haben (Stepper, Vergessen, ein neuer Kauf).
    const curBought = () => (Array.isArray((instState(selectedShoppingID()) || {}).purchased)
      ? instState(selectedShoppingID()).purchased : []).find(x => String(x.name) === name);
    const addOne = () => {
      const it = curBought();
      sdCall(selectedShoppingID(), 'AddItem', { name: name, category: cat, amount: String((it && it.amount) || '1') });
      flyToShoppingTab(card.querySelector('.item-thumb'));
      // Mit Artikelnamen wie in der iOS-App: bei einer langen Liste ist sonst nicht
      // erkennbar, welche Zeile die Meldung ausgelöst hat.
      showToast((card.classList.contains('on-list')
        ? translate('„%1“: quantity increased')
        : translate('„%1“ added to the shopping list')).replace('%1', name));
    };
    card.querySelector('[data-boughtadd]').addEventListener('click', (e) => {
      e.stopPropagation();
      addOne();
    });
    card.querySelector('.item-card-content').addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      // Klicks auf den Knopf laufen über dessen eigenen Handler — ohne diesen
      // Riegel zählte ein Knopfdruck doppelt (Knopf plus Zeile).
      if (e.target.closest('button')) return;
      addOne();
    });
    // Nur Wischen nach links (vergessen) — kein onEdit, damit der Rechtsweg
    // gesperrt bleibt (bindCardSwipe setzt maxRight dann auf 0).
    const bAmount = card.querySelector('[data-amount-edit]');
    if (bAmount) bAmount.addEventListener('click', (e) => {
      e.stopPropagation();
      const it = curBought();
      if (!it) return;
      showPrompt(translate('Change quantity'), String(it.amount || ''), translate('Save'), (val) => {
        sdCall(selectedShoppingID(), 'UpdatePurchase', {
          oldName: it.name, name: it.name, category: it.category || '',
          amount: val.trim(), notes: it.notes || ''
        });
      });
    });
    card.querySelectorAll('[data-bstep]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const it = curBought();
      if (!it) return;
      const next = Math.max(1, (parseInt(it.amount) || 1) + parseInt(btn.dataset.bstep));
      // Optimistisch anzeigen wie beim Favoriten-Stepper; die Serverantwort
      // korrigiert es, falls sie abweicht.
      it.amount = String(next);
      renderFavorites();
      sdCall(selectedShoppingID(), 'UpdatePurchase', {
        oldName: it.name, name: it.name, category: it.category || '',
        amount: String(next), notes: it.notes || ''
      });
    }));
    // Links vergessen, rechts bearbeiten — wie in den Favoritenlisten.
    bindCardSwipe(card, '.item-card-content',
      () => sdCall(selectedShoppingID(), 'ForgetPurchase', { name: name }),
      () => { const it = curBought(); if (it) openPurchaseEditor(selectedShoppingID(), it); });
  });
  return;
}

// Inhalt einer Favoritenliste.
function renderFavList(el, st, detail) {
  // Detailansicht
  let html = `<div class="screen-head" data-key="detailhead">` +
    `<button class="icon-btn" id="btnFavBack" aria-label="${translate('Back')}"><i class="fa-light fa-chevron-left"></i></button>` +
    `<h2>${escapeHtml(detail.name)}</h2></div>`;
  // Nur bei Rezepten: das Gerichtsbild gross und mittig ueber die Zutaten.
  // Groesser angefordert als das Badge (s=320), sonst waere es hier unscharf.
  const kopfBild = dishImageUrl(detail);
  if (kopfBild) {
    html += `<div class="fav-hero" data-key="favhero"><img src="${escapeHtml(kopfBild.replace('&s=96', '&s=320'))}" alt="" /></div>`;
  }
  const items = detail.items || [];
  if (items.length === 0) {
    html += `<div class="empty-state" data-key="empty"><i class="fa-light fa-heart"></i>${translate('No items yet')}</div>`;
  }
  for (const it of items) {
    const img = getProductImageUrl(it.name) || getProductImageUrl(it.notes || '');
    const tint = categoryStyle(it.category).tint;
    // Mengen-Stepper wie in der Einkaufsliste (nur bei numerischer Menge); der
    // Runter-Pfeil bei Menge=1 bleibt unsichtbar, damit das Badge nicht springt.
    const amountRaw = String(it.amount || '').trim();
    const numeric = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
    const amount = amountRaw === '' ? '1' : amountRaw;
    let side = '';
    if (numeric) {
      const canDec = parseInt(amount) > 1;
      side += `<span class="stepper"><button data-step="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>` +
        `<span class="amount-badge">${escapeHtml(amount)}</span>` +
        `<button data-step="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button>` +
        '</span>';
    } else {
      side += `<span class="amount-badge" data-amount-edit="1" role="button" tabindex="0" title="${translate('Change quantity')}">${escapeHtml(amount)}</span>`;
    }
    // Warenkorb statt Stift: einen EINZELNEN Artikel auf die Einkaufsliste zu setzen
    // war bisher gar nicht möglich — es gab nur „alles in den Einkauf" für die ganze
    // Liste. Bearbeiten bleibt über Wischen nach rechts erreichbar.
    side += `<button class="heart-btn cart-btn" data-addone="1" aria-label="${translate('Add to shopping list')}"><i class="fa-light fa-cart-plus"></i></button>`;
    html += `<div class="item-card" data-key="favitem:${escapeHtml(it.name)}" data-name="${escapeHtml(it.name)}">` +
      `<div class="swipe-under"><i class="fa-light fa-heart-crack"></i></div>` +
      // Rechtswischen = bearbeiten, wie in der Einkaufsliste. Die Optik kommt
      // aus .item-card .swipe-under-edit, gilt also hier ohne neues CSS.
      `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` +
      `<div class="item-card-content">` +
      // Ohne Farbe (Payload ohne categoryStyles) bleibt das Attribut weg — dann gilt
      // background: var(--surface2) aus dem CSS statt eines leeren background:.
      `<span class="item-thumb"${(img || tint) ? ` style="background:${img ? 'transparent' : tint}"` : ''}>` +
      (img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" />` : escapeHtml(String(it.name || '?').charAt(0).toUpperCase())) +
      `</span><span class="item-main"><span class="item-name">${escapeHtml(it.name)}</span>` +
      (it.notes ? `<span class="item-notes">${escapeHtml(it.notes)}</span>` : '') +
      `</span><span class="item-side">${side}</span></div></div>`;
  }
  html += `<div class="fav-actions" data-key="favactions">` +
    ((detail.url || detail.mediaId) ? `<button id="btnFavOpenRecipe"><i class="fa-light fa-arrow-up-right-from-square"></i> ${translate('Open recipe')}</button>` : '') +
    `<button id="btnFavAddAll"><i class="fa-light fa-cart-plus"></i> ${translate('Everything to the shopping list')}</button>` +
    `<button id="btnFavAddItem"><i class="fa-light fa-plus"></i> ${translate('Add item')}</button>` +
    `<button id="btnFavRename"><i class="fa-light fa-pencil"></i> ${translate('Rename list')}</button>` +
    `<button id="btnFavDelete" class="destructive"><i class="fa-light fa-trash"></i> ${translate('Delete list')}</button>` +
    `</div>`;
  const freshDetail = renderRows(el, html);
  if (freshDetail === false) return;

  // Aktuelle Detail-Liste beim Ereignis auflösen, nicht beim Rendern festhalten.
  const curDetail = () => {
    const s = instState(selectedShoppingID()) || {};
    return (Array.isArray(s.favoriteLists) ? s.favoriteLists : []).find(l => l.id === favDetailListId) || detail;
  };
  const pick = (sel) => {
    for (const n of freshDetail) {
      if (n.id === sel.slice(1)) return n;
      if (n.querySelector) { const hit = n.querySelector(sel); if (hit) return hit; }
    }
    return null;
  };

  const btnBack = pick('#btnFavBack');
  if (btnBack) btnBack.addEventListener('click', () => { favDetailListId = null; renderFavorites(); });
  const btnDelete = pick('#btnFavDelete');
  if (btnDelete) btnDelete.addEventListener('click', () => {
    showConfirm(translate('Delete this favorite list?'), translate('Delete'), () => {
      const listId = favDetailListId;
      favDetailListId = null;
      sdCall(selectedShoppingID(), 'DeleteFavoriteList', listId);
    });
  });
  const btnFavOpenRecipe = pick('#btnFavOpenRecipe');
  if (btnFavOpenRecipe) btnFavOpenRecipe.addEventListener('click', () => {
    // Nur http(s): detail.url stammt aus KI-Extraktion bzw. gespeicherten Listen —
    // javascript:/data:-URLs dürfen hier nicht ausgeführt werden.
    if (detail.url && /^https?:\/\//i.test(String(detail.url))) {
      try { window.open(String(detail.url), '_blank', 'noopener'); } catch (e) {}
      return;
    }
    if (!detail.mediaId) return;
    // PDF an den System-Viewer geben, der alle Seiten blättert. Der Typ kommt aus dem
    // Prefetch beim Öffnen der Liste, damit dieser Aufruf synchron im Klick bleibt.
    const meta = mediaTypeCache[String(detail.mediaId)];
    const knownPdf = !!(meta && meta.state === 'ok' && meta.isPdf);
    if (knownPdf && openMediaExternally(detail.mediaId)) return;
    openRecipePhoto(detail.mediaId, knownPdf);
  });
  const btnFavRename = pick('#btnFavRename');
  if (btnFavRename) btnFavRename.addEventListener('click', () => {
    // Der Name kommt beim Klick frisch aus dem Bestand, nicht aus dem Render-Moment.
    const liste = curDetail();
    showPrompt(translate('Rename list'), liste.name || '', translate('Save'), (name) => {
      const neu = name.trim();
      if (neu && neu !== liste.name) {
        sdCall(selectedShoppingID(), 'RenameFavoriteList', { listId: liste.id, newName: neu });
      }
    });
  });
  const btnAddAll = pick('#btnFavAddAll');
  if (btnAddAll) btnAddAll.addEventListener('click', () => addFavListToCart(selectedShoppingID(), curDetail()));
  const btnAddItem = pick('#btnFavAddItem');
  if (btnAddItem) btnAddItem.addEventListener('click', () => openFavItemEditor(selectedShoppingID(), curDetail().id, null));

  freshDetail.filter(n => n.classList && n.classList.contains('item-card')).forEach(card => {
    const name = card.dataset.name;
    const curFavItem = () => (curDetail().items || []).find(i => i.name === name);
    bindCardSwipe(card, '.item-card-content',
      () => sdCall(selectedShoppingID(), 'RemoveItemFromFavoriteList', { listId: curDetail().id, name }),
      // Rechtswischen öffnet denselben Editor wie der Stift-Knopf.
      () => { const it = curFavItem(); if (it) openFavItemEditor(selectedShoppingID(), curDetail().id, it); });
    const favAmount = card.querySelector('[data-amount-edit]');
    if (favAmount) favAmount.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = curFavItem();
      if (!item) return;
      showPrompt(translate('Change quantity'), String(item.amount || ''), translate('Save'), (val) => {
        sdCall(selectedShoppingID(), 'UpdateFavoriteItem', {
          listId: curDetail().id, oldName: item.name, newName: item.name,
          category: item.category || '', amount: val.trim(), notes: item.notes || ''
        });
      });
    });
    // Auf die Einkaufsliste setzen — an ZWEI Wegen: der Warenkorb-Knopf und die Zeile
    // selbst. Bisher hing es nur am Knopf, in der Kaufliste war die ganze Zeile
    // anklickbar; dieselbe Zeile verhielt sich also je nach Liste anders.
    const addOne = () => {
      const item = curFavItem();
      if (!item) return;
      // Menge des Favoriteneintrags mitnehmen. Steht der Artikel schon offen auf der
      // Liste, erhöht der Server die Menge, statt eine Dublette anzulegen.
      sdCall(selectedShoppingID(), 'AddItem', {
        name: item.name,
        category: item.category || '',
        amount: String(item.amount || '1')
      });
      flyToShoppingTab(card.querySelector('.item-thumb'));
      // Steht der Artikel schon offen auf der Liste, erhöht der Server nur die Menge
      // — die Meldung muss das sagen, sonst wirkt sie wie ein zweiter Eintrag.
      const open = new Set(((instState(selectedShoppingID()) || {}).items || [])
        .filter(i => !i.inCart).map(i => String(i.name || '').trim().toLowerCase()));
      showToast((open.has(String(item.name || '').trim().toLowerCase())
        ? translate('„%1“: quantity increased')
        : translate('„%1“ added to the shopping list')).replace('%1', item.name));
    };
    const addBtn = card.querySelector('[data-addone]');
    if (addBtn) addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      addOne();
    });
    card.querySelector('.item-card-content').addEventListener('click', (e) => {
      // Nach einem Wischen kommt noch ein Klick — der darf nicht zaehlen.
      if (card.dataset.swiped === '1') return;
      // Klicks auf Knoepfe (Warenkorb, Mengen-Abzeichen, Stepper) laufen ueber deren
      // eigene Handler; ohne diesen Riegel zaehlte ein Knopfdruck doppelt.
      if (e.target.closest('button')) return;
      if (e.target.closest('[data-amount-edit]')) return;
      addOne();
    });
    card.querySelectorAll('[data-step]').forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = curFavItem();
      if (!item) return;
      const next = Math.max(1, (parseInt(item.amount) || 1) + parseInt(btn.dataset.step));
      // Sofort lokal übernehmen wie in der Einkaufsliste — renderRows() fasst
      // dabei nur diese eine Zeile an.
      item.amount = String(next);
      renderFavorites();
      sdCall(selectedShoppingID(), 'UpdateFavoriteItem', { listId: curDetail().id, oldName: item.name, newName: item.name, category: item.category || '', amount: String(next), notes: item.notes || '' });
    }));
  });
}

function addFavListToCart(instanceID, list) {
  if (!list) return;
  const n = (list.items || []).length;
  if (n === 0) {
    // Wie addAll() in der App: leere Liste bekommt eine eigene Meldung
    showToast(translate('"%1" contains no items').replace('%1', list.name));
    return;
  }
  sdCall(instanceID, 'AddFavoriteListToCart', list.id);
  showToast(translate('"%1": %2 items added').replace('%1', list.name).replace('%2', String(n)));
}

// ── Notizen ────────────────────────────────────────────────────────────────
// Kein sdCall: Notizen liegen im Gateway, nicht in einer Listeninstanz. Alles
// laeuft ueber aiPost('/notes', {action}) — denselben Weg nehmen Kalender und
// Mail-Vorschlaege, und er funktioniert in der Web-App wie in der Visu-Kachel.
let notizen = { rev: 0, folders: [], notes: [], memberFolders: {}, limits: {} };
let notizenGeladen = false;
let notizenLaden = false;
let notizenWartende = [];   // Rueckmeldungen, die auf ein laufendes Laden warten
let notesOrdnerId = null;   // geoeffneter Ordner (null = Uebersicht)
let noteCtx = null;         // {folderId, noteId|null, files:[…], warten:[…], proposal:{id,i}|null}
let noteFunde = [];         // von der KI erkannte Aufgaben/Termine, fluechtig
// Der zuletzt angebotene Titel/Text-Vorschlag. Gemerkt, weil der Hinweiskasten
// neu geschrieben wird, sobald ausserdem Funde angeboten werden — der
// Uebernehmen-Knopf braucht dann seine Werte ein zweites Mal.
let noteAiVorschlag = null;

/** Ohne Gateway gibt es keine Notizen — dann bleibt der Bereich ganz weg. */
function notizenMoeglich() {
  if (window.__SYMDO__) return true;
  return !!store.gatewayAvailable;
}

/**
 * Notizen holen. Die Rueckmeldung kommt IMMER, auch wenn nichts geladen wurde.
 *
 * Vorher gab es drei Wege, auf denen `danach` verschwand: ein bereits laufendes
 * Laden verwarf sie, eine Fehlerantwort sprang davor heraus, und der
 * Netzfehler-Zweig rief sie nie. Wer sich darauf verlaesst — etwa das
 * Uebernehmen einer vorgeschlagenen Notiz, das die Ordner erst braucht — bekam
 * dann gar keine Antwort, und der Knopf tat scheinbar nichts. Ob es geklappt
 * hat, sagt `notizenGeladen`.
 */
function ladeNotizen(danach) {
  if (typeof danach === 'function') notizenWartende.push(danach);
  if (notizenLaden) return;   // die Rueckmeldung haengt jetzt in der Warteschlange
  notizenLaden = true;
  const fertig = () => {
    notizenLaden = false;
    const warten = notizenWartende;
    notizenWartende = [];
    warten.forEach(f => { try { f(); } catch (e) {} });
  };
  aiPost('/notes', { action: 'list' }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true) { fertig(); return; }
    /* Unveraendert? Dann NICHTS anfassen. Der Abruf laeuft jetzt im Minutentakt
       (fremde Geraete), und ein blindes Neusetzen wuerde bei jedem Takt den
       Bestand ersetzen und neu zeichnen — auch wenn sich nichts getan hat. Die
       Revision zaehlt serverseitig bei jeder Aenderung hoch (Notes.php). */
    if (notizenGeladen && (j.rev || 0) === (notizen.rev || 0)) { fertig(); return; }
    notizen = {
      rev: j.rev || 0,
      folders: Array.isArray(j.folders) ? j.folders : [],
      notes: Array.isArray(j.notes) ? j.notes : [],
      memberFolders: j.memberFolders || {},
      limits: j.limits || {}
    };
    notizenGeladen = true;
    // Ein inzwischen geloeschter Ordner darf nicht offen bleiben.
    if (notesOrdnerId && !notizen.folders.some(f => f.id === notesOrdnerId)) notesOrdnerId = null;
    if (activeTab === 'notes') renderNotizen();
    fertig();
  }).catch(() => { fertig(); });
}

/** Nach jeder Aenderung: der Server ist die Wahrheit, es wird nicht lokal geraten. */
function notizenAktion(nutzlast, danach) {
  return aiPost('/notes', nutzlast).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true) {
      showToast(notizenFehlertext(j));
      return null;
    }
    notizenGeladen = false;
    ladeNotizen();
    if (typeof danach === 'function') danach(j);
    return j;
  }).catch(() => { showToast(translate('Action failed')); return null; });
}

function notizenFehlertext(j) {
  const code = (j && j.error && j.error.code) ? String(j.error.code) : '';
  // store_unwritable bekommt eine eigene Meldung: die Abhilfe ist ein
  // Kernel-Neustart, und „Aktion fehlgeschlagen" schickt auf die falsche Faehrte.
  if (code === 'store_unwritable') return translate('Restart the Symcon kernel once, then notes can be stored.');
  if (code === 'quota_exceeded') return translate('No more room — please delete something first.');
  if (code === 'file_too_large') return translate('File too large.');
  if (code === 'unsupported_file') return translate('Only JPEG, PNG and PDF are supported.');
  if (code === 'no_consent') return translate('AI analysis is disabled.');
  if (code === 'ai_busy') return translate('Another AI request is already running.');
  if (code === 'too_large_for_tile') return translate('Too large to show here — open the note in the web app.');
  // Praktisch immer ein zu langer Titel oder Text. Ohne eigene Meldung stand nur
  // „Aktion fehlgeschlagen" da, und zwar bei jedem weiteren Versuch genauso.
  if (code === 'invalid_payload') return translate('Title (max. 120) or text (max. 3000 characters) is too long.');
  return translate('Action failed');
}

function notesOrdner(id) {
  return notizen.folders.find(f => f.id === id) || null;
}
function notesImOrdner(id) {
  return notizen.notes.filter(n => n.folderId === id);
}

function renderNotizen() {
  const elMaster = document.getElementById('notesMaster');
  const elDetail = document.getElementById('notesDetail');
  if (!notizenGeladen && !notizenLaden) ladeNotizen();
  const offen = notesOrdnerId ? notesOrdner(notesOrdnerId) : null;
  if (notesOrdnerId && !offen) notesOrdnerId = null;
  renderNotizenMaster(elMaster);
  renderNotizenDetail(elDetail, offen);
  document.getElementById('notesContent').classList.toggle('detail-open', !!offen);
  notizenEingabePruefen();
}

/**
 * Schnellerfassung: Titel eintippen, Plus druecken.
 *
 * Der Knopf haengt NUR am Text, nicht am Ordner (geaendert 22.08.2026). Vorher war
 * er ohne offenen Ordner gesperrt — man musste also erst einen oeffnen, um
 * ueberhaupt tippen zu duerfen, und die Zeile stand nutzlos da. Jetzt oeffnet das
 * Plus den Dialog, und der Ordner ist dort waehlbar.
 */
function notizenEingabePruefen() {
  const feld = document.getElementById('notesInput');
  const knopf = document.getElementById('btnNotesAdd');
  if (!feld || !knopf) return;
  knopf.disabled = feld.value.trim() === '';
}

/**
 * Das Plus oeffnet den Notiz-Dialog mit dem eingetippten Titel.
 *
 * Nicht mehr direkt anlegen: eine Notiz aus einem Titel allein ist selten fertig,
 * und der Dialog traegt Text, Ordnerwahl und Anhaenge. Der offene Ordner steht
 * vorgewaehlt; ohne einen nimmt der Dialog seine eigene Vorgabe (erster Ordner)
 * und laesst sie aendern — noteEditorOeffnen faellt dafuer schon auf
 * notesErsterOrdner() zurueck.
 */
function notizenSchnellAnlegen() {
  const feld = document.getElementById('notesInput');
  const titel = feld.value.trim();
  if (titel === '') return;
  // Gibt es ueberhaupt keinen Ordner, kann auch der Dialog nicht speichern (der
  // Server antwortet `not_found`). Dann lieber gleich sagen, was fehlt.
  if (!notizen.folders || notizen.folders.length === 0) {
    showToast(translate('Create a folder first'));
    return;
  }
  noteEditorOeffnen({ folderId: notesOrdnerId || '', title: titel, text: '', att: [] });
  feld.value = '';
  notizenEingabePruefen();
}

function renderNotizenMaster(el) {
  let html = '<div class="screen-head" data-key="head"><h2>' + translate('Notes') + '</h2>' +
    '<button class="icon-btn" id="btnNotesFolderCreate" aria-label="' + translate('New folder') + '">' +
    '<i class="fa-light fa-plus"></i></button></div>';
  if (!notizenGeladen) {
    html += '<div class="empty-state" data-key="laden"><i class="fa-light fa-note-sticky"></i>' +
      translate('Loading …') + '</div>';
    bindeNotizenMaster(renderRows(el, html));
    return;
  }
  if (notizen.folders.length === 0) {
    html += '<div class="empty-state" data-key="leer"><i class="fa-light fa-folder-open"></i>' +
      translate('No folders yet') + '</div>';
  }
  const users = usersById();
  for (const f of notizen.folders) {
    const anzahl = f.count === 1 ? translate('1 note') : translate('%1 notes').replace('%1', String(f.count));
    const u = f.memberId ? users[f.memberId] : null;
    const auf = notesOrdnerId === f.id ? ' is-open' : '';
    if (u) {
      // Mitglieder-Ordner: bewusst OHNE .swipe-under und mit eigenem data-key.
      // renderRows() ordnet ueber den Schluessel zu; ein Knoten mit gleichem Aufbau
      // koennte sonst samt seiner Wisch-Handler wiederverwendet werden, und dann
      // riefe ein Wischen das Loeschen mit einer fremden Kennung auf.
      html += '<div class="fav-card note-folder note-folder-user' + auf + '" data-key="nfu:' + escapeHtml(f.id) + '">' +
        '<div class="fav-row" data-folder="' + escapeHtml(f.id) + '">' +
        '<span class="fav-badge">' + avatarHtml(u, '') + '</span>' +
        '<span class="fav-main"><span class="fav-name">' + escapeHtml(f.name) + '</span>' +
        '<span class="fav-count">' + anzahl + '</span></span>' +
        '<i class="fa-light fa-chevron-right fav-chevron"></i>' +
        '</div></div>';
    } else {
      const verwaist = !!f.memberId;   // stand mal an einem Mitglied, das es nicht mehr gibt
      html += '<div class="fav-card note-folder' + (verwaist ? ' note-folder-gone' : '') + auf +
        '" data-key="nf:' + escapeHtml(f.id) + '">' +
        '<div class="swipe-under"><i class="fa-light fa-trash"></i></div>' +
        '<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>' +
        '<div class="fav-row" data-folder="' + escapeHtml(f.id) + '">' +
        '<span class="fav-badge"><i class="fa-light fa-folder"></i></span>' +
        '<span class="fav-main"><span class="fav-name">' + escapeHtml(f.name) + '</span>' +
        '<span class="fav-count">' + anzahl + '</span></span>' +
        '<i class="fa-light fa-chevron-right fav-chevron"></i>' +
        '</div></div>';
    }
  }
  bindeNotizenMaster(renderRows(el, html));
}

/**
 * Handler NUR an die neu erzeugten Knoten haengen.
 *
 * renderRows() behaelt unveraenderte Knoten im DOM und gibt die frischen zurueck.
 * Wer stattdessen den ganzen Container abfragt, haengt bei JEDEM Zeichnen einen
 * weiteren Handler an dieselbe Zeile — gemessen: ein zweiter Zustand liess einen
 * Klick zwei Abrufe ausloesen. Dasselbe Muster benutzt renderFavList mit pick().
 */
function bindeNotizenMaster(frisch) {
  if (!Array.isArray(frisch)) return;   // unveraendert: renderRows gab false zurueck
  const suche = (sel) => {
    const raus = [];
    for (const n of frisch) {
      if (n.matches && n.matches(sel)) raus.push(n);
      if (n.querySelectorAll) raus.push(...n.querySelectorAll(sel));
    }
    return raus;
  };
  const kopf = suche('#btnNotesFolderCreate')[0];
  if (kopf) kopf.addEventListener('click', () => {
    showPrompt(translate('New folder'), '', translate('Create'), (name) => {
      if (name.trim()) notizenAktion({ action: 'folderCreate', name: name.trim() });
    });
  });
  suche('.note-folder').forEach(card => {
    const zeile = card.querySelector('.fav-row');
    if (!zeile) return;
    const fid = zeile.dataset.folder;
    zeile.addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button')) return;
      notesOrdnerId = fid;
      renderNotizen();
    });
    // Nur selbst angelegte Ordner: links loeschen, rechts umbenennen.
    if (!card.classList.contains('note-folder-user')) {
      bindCardSwipe(card, '.fav-row',
        () => { restoreCard(card); notesOrdnerLoeschen(fid); },
        () => { restoreCard(card); notesOrdnerUmbenennen(fid); },
        { dissolve: false });
    }
  });
}

function notesOrdnerUmbenennen(fid) {
  const f = notesOrdner(fid);
  if (!f) return;
  showPrompt(translate('Rename folder'), f.name, translate('Save'), (name) => {
    if (name.trim()) notizenAktion({ action: 'folderRename', id: fid, name: name.trim() });
  });
}

/**
 * Ordner loeschen. `mode` ist serverseitig Pflicht — eine Vorgabe, die Notizen
 * mitnimmt, waere ein Datenverlust-Automat. Deshalb wird hier gefragt, sobald
 * welche drin liegen.
 */
function notesOrdnerLoeschen(fid) {
  const f = notesOrdner(fid);
  if (!f) return;
  const drin = notesImOrdner(fid).length;
  if (drin === 0) {
    showConfirm(translate('Delete this folder?'), translate('Delete'), () => {
      notizenAktion({ action: 'folderDelete', id: fid, mode: 'notes' }, () => { notesOrdnerId = null; });
    });
    return;
  }
  const frage = drin === 1
    ? translate('Delete the folder including 1 note?')
    : translate('Delete the folder including %1 notes?').replace('%1', String(drin));
  showConfirm(frage, translate('Delete'), () => {
    notizenAktion({ action: 'folderDelete', id: fid, mode: 'notes' }, () => { notesOrdnerId = null; });
  });
}

function renderNotizenDetail(el, ordner) {
  if (!ordner) {
    renderRows(el, '<div class="empty-state" data-key="waehlen"><i class="fa-light fa-folder-open"></i>' +
      translate('Select a folder') + '</div>');
    return;
  }
  let html = '<div class="screen-head" data-key="detailhead">' +
    '<button class="icon-btn" id="btnNotesBack" aria-label="' + translate('Back') + '">' +
    '<i class="fa-light fa-chevron-left"></i></button>' +
    '<h2>' + escapeHtml(ordner.name) + '</h2>' +
    '<button class="icon-btn" id="btnNoteCreate" aria-label="' + translate('New note') + '">' +
    '<i class="fa-light fa-plus"></i></button></div>';
  const liste = notesImOrdner(ordner.id);
  if (liste.length === 0) {
    html += '<div class="empty-state" data-key="leer"><i class="fa-light fa-note-sticky"></i>' +
      translate('No notes yet') + '</div>';
  }
  for (const n of liste) {
    const anz = (n.att || []).length;
    html += '<div class="item-card note-card" data-key="n:' + escapeHtml(n.id) + '" data-note="' + escapeHtml(n.id) + '">' +
      '<div class="swipe-under"><i class="fa-light fa-trash"></i></div>' +
      '<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>' +
      '<div class="item-card-content">' +
      '<span class="item-main"><span class="item-name">' + escapeHtml(n.title || translate('New note')) + '</span>' +
      (n.preview ? '<span class="note-preview">' + escapeHtml(n.preview) + '</span>' : '') +
      '</span>' +
      '<span class="item-side">' +
      (anz > 0 ? '<span class="badge attr"><i class="fa-light fa-paperclip"></i><span>' + anz + '</span></span>' : '') +
      '<span class="note-date">' + notesDatum(n.updatedAt) + '</span>' +
      '</span></div></div>';
  }
  const frisch = renderRows(el, html);
  const suche = (sel) => {
    const raus = [];
    for (const n of (Array.isArray(frisch) ? frisch : [])) {
      if (n.matches && n.matches(sel)) raus.push(n);
      if (n.querySelectorAll) raus.push(...n.querySelectorAll(sel));
    }
    return raus;
  };
  // Auch hier nur die frischen Knoten — siehe bindeNotizenMaster.
  const zurueck = suche('#btnNotesBack')[0];
  if (zurueck) zurueck.addEventListener('click', () => { notesOrdnerId = null; renderNotizen(); });
  const neu = suche('#btnNoteCreate')[0];
  if (neu) neu.addEventListener('click', () => noteEditorOeffnen({ folderId: ordner.id }));
  suche('.note-card').forEach(card => {
    const nid = card.dataset.note;
    const inhalt = card.querySelector('.item-card-content');
    if (inhalt) inhalt.addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button')) return;
      noteOeffnen(nid);
    });
    bindCardSwipe(card, '.item-card-content',
      () => {
        restoreCard(card);
        showConfirm(translate('Delete this note?'), translate('Delete'), () => {
          notizenAktion({ action: 'noteDelete', id: nid });
        });
      },
      // Der Wisch nach rechts zeigt einen STIFT und muss deshalb den Editor
      // oeffnen. Seit „Notiz ansehen statt bearbeiten" rief er noteOeffnen — also
      // dasselbe wie ein einfacher Tipp, und die Geste war ohne Wirkung.
      () => { restoreCard(card); noteBearbeitenOeffnen(nid); },
      { dissolve: false });
  });
}

/** Tag und Monat, wie in den Terminen — das Jahr nur, wenn es nicht das laufende ist. */
function notesDatum(sek) {
  if (!sek) return '';
  const d = new Date(sek * 1000);
  const heute = new Date();
  const tag = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
  return d.getFullYear() === heute.getFullYear() ? tag : tag + String(d.getFullYear());
}

// ── Notiz-Editor ───────────────────────────────────────────────────────────

/** Volltext holen und dann oeffnen: die Liste traegt nur eine Vorschau. */
function noteOeffnen(nid) {
  noteHolen(nid, (notiz) => noteAnsichtOeffnen(notiz));
}

/** Derselbe Weg, aber direkt in den Editor — fuer den Wisch mit dem Stift. */
function noteBearbeitenOeffnen(nid) {
  noteHolen(nid, (notiz) => noteEditorOeffnen(notiz));
}

/**
 * Volltext einer Notiz holen. Noetig, weil die Liste nur eine Vorschau traegt
 * (NOTE_PREVIEW_MAX) — der Editor und die Ansicht brauchen beide den ganzen Text.
 */
function noteHolen(nid, weiter) {
  aiPost('/notes', { action: 'get', id: nid }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true || !j.note) { showToast(notizenFehlertext(j)); return; }
    weiter(j.note);
  }).catch(() => showToast(translate('Action failed')));
}

/** Die Notiz, die gerade angesehen wird — der Stift braucht sie unveraendert. */
let noteAnsicht = null;

function noteAnsichtOeffnen(notiz) {
  noteAnsicht = notiz;
  document.getElementById('noteViewTitle').textContent = notiz.title || translate('Note');
  const ordner = notesOrdner(notiz.folderId);
  const teile = [];
  if (ordner) teile.push(ordner.name);
  if (notiz.updatedAt) teile.push(notesDatum(notiz.updatedAt));
  document.getElementById('noteViewMeta').textContent = teile.join(' · ');
  document.getElementById('noteViewBody').innerHTML = notizTextHtml(String(notiz.text || ''));

  // Anhaenge wie im Editor, nur ohne Loeschknopf: Symbol, Name, antippbar.
  const el = document.getElementById('noteViewFiles');
  const dateien = Array.isArray(notiz.att) ? notiz.att : [];
  el.innerHTML = dateien.map(a =>
    '<div class="note-file" data-media="' + escapeHtml(String(a.id)) + '">' +
    '<i class="fa-light ' + (a.kind === 'pdf' ? 'fa-file-pdf' : 'fa-file-image') + '"></i>' +
    '<span>' + escapeHtml(a.name || translate('Attachment')) + '</span>' +
    '<i class="fa-light fa-chevron-right nv-chev"></i>' +
    '</div>').join('');
  el.querySelectorAll('.note-file').forEach(zeile => {
    zeile.addEventListener('click', () => {
      // noteAnhangOeffnen liest die Notiz-Kennung aus noteCtx; in der Ansicht gibt
      // es keinen Editor-Zustand, also einen schmalen aufsetzen.
      noteCtx = { noteId: notiz.id, files: dateien, warten: [], wahl: [], proposal: null };
      noteAnhangOeffnen(parseInt(zeile.dataset.media, 10));
    });
  });
  openOverlay('noteViewOverlay');
}

/**
 * Notiztext als HTML.
 *
 * Der Text kommt in der Form, die AiNoteTextRule vorgibt: ein einleitender Satz,
 * danach je Angabe eine Zeile „Bezeichnung: Wert". Genau das wird hier sichtbar
 * gemacht — Bezeichnung halbfett und in eigener Spalte, Wert daneben. Adressen
 * und Nummern werden antippbar.
 *
 * Reihenfolge ist wichtig: ZUERST maskieren, dann verlinken. Umgekehrt wuerde die
 * Maskierung die eben erzeugten Tags zerlegen.
 */
function notizTextHtml(text) {
  // EIN Durchlauf mit Alternativen, nicht drei hintereinander. Drei Laeufe
  // greifen naemlich in die href-Werte, die der vorige gerade erzeugt hat:
  // aus „https://schule.de/id/123456789" wurde
  // `<a href="https://schule.de/id/<a href="tel:123456789">…` — der Verweis
  // zerbrach, und die Bruchstuecke standen als Text auf dem Schirm. (Gefaehrlich
  // war das nie: maskiert wird vorher, es kann also nichts ausbrechen — es sah
  // nur kaputt aus, und zwar bei genau den Zeilen, die aus einem Elternbrief
  // kommen: Adressen mit langen Kennungen, „1234567@schule.de", „?q=1234567&r=2".)
  //
  // Reihenfolge der Alternativen ist die Rangfolge: Adresse, dann Mail, dann
  // Rufnummer. Was die erste Alternative frisst, sieht keine spaetere mehr.
  const MUSTER = new RegExp(
    '(https?:\\/\\/[^\\s<]+[^\\s<.,;:!?)\\]])'          // 1 Adresse
    + '|([\\w.+-]+@[\\w-]+\\.[\\w.-]+)'                   // 2 Mail
    // 3 Rufnummer: mindestens sechs Ziffern, damit „13:00" oder „2026" keine
    // wird. Die Grenzen schliessen Ziffern UND Punkte aus, sonst greift das
    // Muster mitten in „15.01.2026-30.06.2026" oder in eine IBAN.
    + '|((?<![\\w.>\\d])\\+?\\d[\\d\\s/()-]{5,}\\d(?![\\w<.\\d]))',
    'g'
  );
  const verlinken = (roh) => String(roh).replace(MUSTER, (treffer, adresse, mail, tel) => {
    if (adresse) { return '<a href="' + adresse + '" target="_blank" rel="noopener noreferrer">' + adresse + '</a>'; }
    if (mail)    { return '<a href="mailto:' + mail + '">' + mail + '</a>'; }
    const ziffern = tel.replace(/[^\d+]/g, '');
    // Obergrenze nach E.164: eine Rufnummer hat hoechstens 15 Ziffern. Damit
    // fallen die Ziffernblöcke heraus, die in einem Elternbrief sonst noch
    // stehen — eine IBAN (20 Ziffern) sieht Zeichen fuer Zeichen wie eine
    // Rufnummer aus, und ein Waehl-Verweis darauf ist Unsinn.
    if (ziffern.replace(/\+/g, '').length > 15) { return treffer; }
    return '<a href="tel:' + ziffern + '">' + tel + '</a>';
  });

  const bloecke = String(text).split(/\n\s*\n/);
  return bloecke.map(block => {
    const zeilen = block.split('\n').map(z => z.trim()).filter(z => z !== '');
    if (zeilen.length === 0) return '';
    const teile = zeilen.map(zeile => {
      // „Bezeichnung: Wert" nur, wenn die Bezeichnung kurz ist und keinen Punkt
      // traegt — sonst wird aus „Wir starten am 07.09.2026: alles neu" ein Paar,
      // und aus einer Adresse mit „https://" erst recht.
      const m = zeile.match(/^([^:]{2,32}):\s+(.+)$/);
      if (m && !/[.!?]$/.test(m[1]) && !/^https?$/i.test(m[1])) {
        return '<div class="nv-row"><span class="nv-k">' + escapeHtml(m[1]) + '</span>' +
               '<span class="nv-v">' + verlinken(escapeHtml(m[2])) + '</span></div>';
      }
      return '<p class="nv-p">' + verlinken(escapeHtml(zeile)) + '</p>';
    });
    return teile.join('');
  }).join('');
}

function noteEditorOeffnen(notiz) {
  noteCtx = {
    folderId: notiz.folderId || notesOrdnerId || notesErsterOrdner(),
    noteId: notiz.id || null,
    files: Array.isArray(notiz.att) ? notiz.att.slice() : [],
    // Dateien, die vor dem ersten Speichern angehaengt wurden. Eine Notiz ohne
    // Kennung kann keinen Anhang tragen, also warten sie hier auf den noteCreate.
    warten: [],
    // Anhaenge, die ein Mail-Vorschlag mitbringt: zum Ankreuzen, nicht schon
    // angehaengt. Erst beim Speichern entscheidet der Haken, welche mitkommen.
    wahl: [],
    // Die gescannte Datei aus der KI-Uebernahme: ebenfalls zum Ankreuzen, aber
    // als ROHDATEN statt einer Medien-Kennung — sie liegt noch nirgends.
    scanQuelle: null,
    proposal: null
  };
  noteFunde = [];
  document.getElementById('noteOverlayTitle').textContent =
    noteCtx.noteId ? translate('Edit note') : translate('New note');
  const wahl = document.getElementById('ntFolder');
  wahl.innerHTML = notizen.folders
    .map(f => '<option value="' + escapeHtml(f.id) + '">' + escapeHtml(f.name) + '</option>').join('');
  wahl.value = noteCtx.folderId || '';
  document.getElementById('ntTitle').value = notiz.title || '';
  document.getElementById('ntText').value = notiz.text || '';
  document.getElementById('btnNoteDelete').style.display = noteCtx.noteId ? '' : 'none';
  noteHinweisAus();
  noteDateienZeichnen();
  openOverlay('noteOverlay');
}

function notesErsterOrdner() {
  return notizen.folders.length ? notizen.folders[0].id : null;
}

function noteDateienZeichnen() {
  const el = document.getElementById('ntFiles');
  // Kommt der Entwurf aus einem Mail-Vorschlag, waehlt man hier AUS, was die Mail
  // mitgebracht hat — eine eigene Datei dazuzulegen ist eine andere Handlung und
  // gehoert an die gespeicherte Notiz. Deshalb bleibt der Anhängen-Knopf dort weg.
  const anhaengen = document.getElementById('btnNoteAttach');
  if (anhaengen) {
    anhaengen.style.display = (noteCtx && noteCtx.proposal) ? 'none' : '';
  }
  const dateien = (noteCtx && noteCtx.files) ? noteCtx.files : [];
  const warten = (noteCtx && noteCtx.warten) ? noteCtx.warten : [];
  const wahl = (noteCtx && noteCtx.wahl) ? noteCtx.wahl : [];
  el.innerHTML = dateien.map(a =>
    '<span class="note-file" data-media="' + escapeHtml(String(a.id)) + '">' +
    '<i class="fa-light ' + (a.kind === 'pdf' ? 'fa-file-pdf' : 'fa-file-image') + '"></i>' +
    '<span>' + escapeHtml(a.name || translate('Attachment')) + '</span>' +
    '<button class="rm" data-rm="' + escapeHtml(String(a.id)) + '" aria-label="' + translate('Remove') + '">' +
    '<i class="fa-light fa-xmark"></i></button>' +
    '</span>').join('') +
    // Wartende: noch ohne Kennung, deshalb nicht antippbar und nicht einzeln
    // entfernbar — sie verschwinden mit dem Verwerfen des Editors.
    warten.map((w, i) =>
      '<span class="note-file is-waiting" data-warten="' + i + '">' +
      '<i class="fa-light ' + (w.nutzlast.pdf ? 'fa-file-pdf' : 'fa-file-image') + '"></i>' +
      '<span>' + escapeHtml(w.name || translate('Attachment')) + '</span>' +
      '<i class="fa-light fa-clock"></i></span>').join('') +
    // Aus einem Mail-Vorschlag: noch nicht angehaengt, sondern zur Wahl. Ein
    // <label> statt eines Chips mit Knopf — so trifft jeder Tipper auf den Text
    // ODER das Kaestchen und schaltet um, ohne Zielen.
    // Aufbau wie bei den schon angehaengten Dateien: Symbol, Dateiname, EIN
    // Bedienelement rechts — dort der Loeschknopf, hier der Haken. Bewusst kein
    // <label> mehr: sonst schaltete jeder Tipper auf die Zeile den Haken um, und
    // die Zeile soll die Datei oeffnen, genau wie im Edit-Dialog. Weder
    // Groessenangabe noch Auge-Knopf, die gibt es dort auch nicht.
    wahl.map(a =>
      '<div class="note-file is-choice" data-media="' + escapeHtml(String(a.id)) + '">' +
      '<i class="fa-light ' + (a.kind === 'pdf' ? 'fa-file-pdf' : 'fa-file-image') + '"></i>' +
      '<span>' + escapeHtml(a.name) + '</span>' +
      '<input type="checkbox" data-wahl="' + escapeHtml(String(a.id)) + '"' + (a.an ? ' checked' : '') + '>' +
      '</div>').join('') +
    // Die gescannte Datei aus der KI-Uebernahme: derselbe Ankreuz-Chip wie bei
    // den Mail-Anhaengen, nur liegen hier Rohdaten vor — die Zeile zeigt sie
    // deshalb direkt an, ohne den Server zu fragen.
    (noteCtx && noteCtx.scanQuelle
      ? '<div class="note-file is-scan">' +
        '<i class="fa-light ' + (noteCtx.scanQuelle.nutzlast.pdf ? 'fa-file-pdf' : 'fa-file-image') + '"></i>' +
        '<span>' + escapeHtml(noteCtx.scanQuelle.name || translate('Scanned photo')) + '</span>' +
        '<input type="checkbox" data-scan="1"' + (noteCtx.scanQuelle.an ? ' checked' : '') + '>' +
        '</div>'
      : '');
  el.querySelectorAll('[data-wahl]').forEach(kasten => {
    kasten.addEventListener('change', () => {
      const eintrag = wahl.find(a => String(a.id) === String(kasten.dataset.wahl));
      if (eintrag) eintrag.an = kasten.checked;
    });
    // Der Klick darf nicht zur Zeile durchlaufen — die oeffnet die Datei.
    kasten.addEventListener('click', (e) => e.stopPropagation());
  });
  el.querySelectorAll('.note-file.is-choice').forEach(zeile => {
    zeile.addEventListener('click', () => {
      noteAnhangOeffnen(parseInt(zeile.dataset.media, 10), true);
    });
  });
  const scanKasten = el.querySelector('[data-scan]');
  if (scanKasten) {
    scanKasten.addEventListener('change', () => { noteCtx.scanQuelle.an = scanKasten.checked; });
    scanKasten.addEventListener('click', (e) => e.stopPropagation());
    el.querySelector('.note-file.is-scan').addEventListener('click', () => {
      const q = noteCtx.scanQuelle;
      const istPdf = !!q.nutzlast.pdf;
      // aiReadFileB64 liefert bereits eine vollstaendige data:-URL; nur nackte
      // Base64 (der Foto-Weg normalisiert anders) bekommt den Vorspann dazu.
      const roh = istPdf ? String(q.nutzlast.pdf) : String(q.nutzlast.image);
      const url = roh.startsWith('data:') ? roh
        : 'data:' + (istPdf ? 'application/pdf' : 'image/jpeg') + ';base64,' + roh;
      zeigeMedium(url, istPdf, q.name || translate('Scanned photo'), '');
    });
  }
  el.querySelectorAll('.note-file:not(.is-waiting):not(.is-choice):not(.is-scan)').forEach(chip => {
    chip.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-rm]');
      if (rm) {
        e.stopPropagation();
        noteAnhangEntfernen(parseInt(rm.dataset.rm, 10));
        return;
      }
      noteAnhangOeffnen(parseInt(chip.dataset.media, 10));
    });
  });
}

/**
 * Anhang ansehen.
 *
 * Zwei Wege, genau wie beim Rezeptfoto: In der Web-App fuehrt die Datei-Route zum
 * System-Viewer, der ein PDF vollstaendig blaettert. Die Visu-Kachel hat keinen
 * Token, dort kommt der Inhalt als data:-URL ueber den Relay — ein mehrseitiges PDF
 * zeigt im iframe dann nur seine erste Seite. Dieselbe bekannte Grenze wie dort.
 */
/**
 * Eine Anhang-Datei anzeigen.
 *
 * `ausVorschlag` = true: die Datei haengt noch an einem Mail-Vorschlag, es gibt
 * also keine Notiz-Kennung. Die Gegenseite laesst das zu (die Datei steht in
 * einem offenen Vorschlag) — nur so kann man vor dem Uebernehmen hineinsehen,
 * statt blind anzukreuzen.
 */
function noteAnhangOeffnen(mediaId, ausVorschlag) {
  if (!mediaId || !noteCtx) return;
  const direkt = notesMediaUrl(mediaId);
  // Gibt es eine Datei-Adresse, uebernimmt der Browser — fuer Bilder genauso wie
  // fuer PDFs. Sein Betrachter kann blaettern, zoomen, drehen und speichern; das
  // <iframe> im Blatt kann das nicht, auf iOS zeigt es sogar nur die erste Seite.
  // Der Aufruf steht synchron im Klick, sonst wertet Safari ihn als Popup.
  if (direkt) {
    let fenster = null;
    try { fenster = window.open(direkt, '_blank'); } catch (e) {}
    if (fenster) return;
    // Popup-Sperre: dann eben das Blatt, aber mit der Adresse am Knopf.
  }
  aiPost('/notes', { action: 'attachData', attachmentId: mediaId,
                     noteId: ausVorschlag ? '' : (noteCtx.noteId || '') }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true || !j.dataUrl) { showToast(notizenFehlertext(j)); return; }
    zeigeMedium(j.dataUrl, j.isPdf === true, translate('Attachment'), direkt);
  }).catch(() => showToast(translate('Action failed')));
}

/**
 * Direkte Datei-Adresse — nur in der Web-App, die Kachel hat keinen Token.
 *
 * Das eingebettete Objekt heisst `apiBase` (AppCore.php setzt genau diesen
 * Schluessel). Hier stand `api`, und den gibt es nicht: die Funktion lieferte
 * IMMER eine leere Adresse, jeder Anhang landete im Blatt, und ein PDF blieb
 * damit auf iOS bei Seite 1. Der Rezept-Weg (mediaFileUrl) las von Anfang an
 * `apiBase` und war deshalb nie betroffen — genau daran fiel es auf.
 */
function notesMediaUrl(mediaId) {
  const basis = (window.__SYMDO__ && window.__SYMDO__.apiBase) ? String(window.__SYMDO__.apiBase) : '';
  if (!basis) return '';
  let token = '';
  try { token = ls.get('symdo.token') || ''; } catch (e) {}
  if (!token) return '';
  return basis.replace(/\/+$/, '') +
    '/notes/media/' + encodeURIComponent(String(mediaId)) + '?t=' + encodeURIComponent(token);
}

function noteAnhangEntfernen(mediaId) {
