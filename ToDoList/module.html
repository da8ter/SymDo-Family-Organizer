      let schnitt = rest.lastIndexOf(',', grenze);
      if (schnitt < grenze * 0.4) schnitt = rest.lastIndexOf(' ', grenze);
      if (schnitt < 1) schnitt = grenze;
      raus.push(rest.slice(0, schnitt + 1).trim());
      rest = rest.slice(schnitt + 1).trim();
    }
    puffer = rest;
  }
  schieben();
  return raus;
}

/**
 * Aus Symcon angestossen (SDWA_PlayBriefing bzw. RequestAction 'PlayBriefing').
 *
 * Absichtlich KEIN Umschalter wie der Knopf: Ein Skript, das „abspielen" sagt,
 * soll nicht abbrechen, wenn gerade schon gespielt wird.
 */
function briefingFernstart() {
  if (briefingLaeuft || briefingLaedt) return;
  if (!String(briefingText || '').trim()) {
    showToast(translate('There is no briefing to read out yet.'));
    return;
  }
  if (!briefingTonMoeglich()) {
    showToast(translate('Speech output is not available.'));
    return;
  }
  // Merker, damit ein vom Browser abgewiesener Start nicht still bleibt: Ohne
  // Nutzergeste darf jeder Browser Ton verweigern, und dann sucht man den Fehler
  // sonst in Symcon.
  briefingFern = true;
  briefingVorlesen();
}

function briefingTonBeenden() {
  briefingFern = false;
  if (briefingAudio) {
    briefingAudio.pause();
    briefingAudio.src = '';
    briefingAudio = null;
  }
  briefingLaeuft = false;
  briefingLaedt = false;
  renderDashboard();
}

/** Holt die Schnipsel und spielt sie der Reihe nach. */
async function briefingVorlesen() {
  if (briefingLaeuft || briefingLaedt) { briefingTonBeenden(); return; }
  const text = String(briefingText || '').trim();
  if (!text) return;

  briefingLaedt = true;
  renderDashboard();

  // Der Regelfall: Das Gateway hat den Ton schon beim Schreiben des Briefings
  // erzeugt, hier sind nur noch die Dateien zu holen. Fehlen die Kennungen
  // (Sprachausgabe war damals nicht bereit), wird jetzt erzeugt.
  let hashes = briefingClips.slice();
  if (hashes.length === 0) {
    const antwort = await aiPost('/tts', { texts: briefingHaeppchen(text) });
    const clips = antwort && antwort.json && Array.isArray(antwort.json.clips) ? antwort.json.clips : null;
    if (!clips) {
      briefingLaedt = false;
      const code = antwort && antwort.json ? String(antwort.json.error || antwort.json.code || '') : '';
      showToast(code === 'tts_restart_required'
        ? translate('Speech output was just installed — restart IP-Symcon once.')
        : translate('Speech output is not available.'));
      renderDashboard();
      return;
    }
    hashes = clips.filter(c => c && c.ok && c.hash).map(c => c.hash);
  }
  const urls = [];
  for (const h of hashes) {
    const url = await ansageClipHolen(h);
    if (url) urls.push(url);
  }
  briefingLaedt = false;
  if (urls.length === 0) { showToast(translate('Speech output is not available.')); renderDashboard(); return; }

  briefingLaeuft = true;
  briefingAudio = new Audio();
  let i = 0;
  const weiter = () => {
    if (!briefingLaeuft || !briefingAudio) return;
    if (i >= urls.length) { briefingTonBeenden(); return; }
    briefingAudio.src = urls[i++];
    briefingAudio.play().catch(() => {
      // Ton ohne Nutzergeste: Der Browser darf das abweisen. Beim Knopf kommt das
      // nicht vor (der Klick IST die Geste), bei einem Start aus Symcon schon.
      if (briefingFern) {
        showToast(translate('The browser blocked the playback. Tap the tile once, then it works.'));
      }
      briefingTonBeenden();
    });
  };
  briefingAudio.addEventListener('ended', weiter);
  briefingAudio.addEventListener('error', () => briefingTonBeenden());
  weiter();
  renderDashboard();
}

// ── Übersicht (Dashboard) ──────────────────────────────────────────────────
function renderDashboard() {
  const el = document.getElementById('dashboardContent');
  // Ist die Mitglieder-Leiste abgeschaltet, filtert die Uebersicht nicht (die
  // Wache sitzt in memberFiltered). Die Auswahl selbst bleibt bestehen — sie ist
  // bereichsuebergreifend und darf hier nicht fuer alle Tabs geloescht werden.
  const zeigeMitglieder = mitgliederLeisteSichtbar();
  const open = allTodoTasks().filter(t => !t.item.done);
  const memberTasks = memberFiltered(open);
  const prio = dashPriority;
  const filteredOpen = prio
    ? memberTasks.filter(t => String(t.item.priority || 'normal') === prio)
    : memberTasks;
  const overdue = [];
  const today = [];
  for (const t of filteredOpen) {
    const cls = classifyDue(t.item);
    if (cls === 'overdue') overdue.push(t);
    else if (cls === 'today') today.push(t);
  }
  const dueSort = (a, b) => ((parseInt(a.item.due) || Infinity) - (parseInt(b.item.due) || Infinity));
  overdue.sort(dueSort);
  today.sort(dueSort);
  const dueNow = overdue.concat(today);
  const todayRows = dueNow.slice(0, 6);
  const todayKeys = new Set(todayRows.map(t => t.key));
  const myUpcoming = filteredOpen.filter(t => !todayKeys.has(t.key)).sort(dueSort);
  const overdueCount = memberFiltered(open).filter(t => classifyDue(t.item) === 'overdue').length;
  const todayCount = memberFiltered(open).filter(t => classifyDue(t.item) === 'today').length;

  // doneAt, NICHT updatedAt: updatedAt aendert sich bei jeder Bearbeitung, eine
  // letzte Woche erledigte und diese Woche bearbeitete Aufgabe zaehlte deshalb
  // falsch mit (gemessen: 8 von 92 erledigten Aufgaben weichen um mehr als eine
  // Stunde ab). doneAt ist bei allen erledigten Aufgaben gesetzt.
  const doneTasks = allTodoTasks().filter(t => t.item.done && isThisWeek(parseInt(t.item.doneAt) || 0));
  const completedThisWeek = memberFiltered(doneTasks).length;

  const multiTodo = visibleInstances('todo').length > 1;
  const byId = usersById();
  // Zwei Teile, getrennt formatiert: Ein Trennen der fertigen Zeichenkette haengt
  // an der Sprache („Donnerstag, 20. August" gegen „Thursday, August 20").
  const jetztDatum = new Date();
  const dateWeekday = jetztDatum.toLocaleDateString(undefined, { weekday: 'long' });
  const dateDay = jetztDatum.toLocaleDateString(undefined, { day: 'numeric', month: 'long' });

  // Abgeschaltete Bereiche verschwinden auch aus der Übersicht — sonst zeigte sie
  // Zahlen und Sprungziele, die es nicht mehr gibt.
  const vis = visibleTabs();
  const withTodos = vis.includes('todos');
  const withShop  = vis.includes('shopping');

  let html = '';
  // Avatar-Menü zuerst: nur dieses ist sticky (oben rechts). Das Datum folgt
  // und scrollt normal (wird per CSS auf dieselbe Zeile gezogen).
  // Die Mitglieder-Leiste filtert ausschließlich Aufgaben.
  // Ist sie abgeschaltet, MUSS auch die Auswahl weg: sonst filterte eine zuvor
  // gewaehlte Person unsichtbar weiter, und niemand kaeme mehr an den Filter.
  if (withTodos && store.users.length > 0 && zeigeMitglieder) {
    html += '<div class="member-bar">';
    for (const u of store.users) {
      html += `<button class="avatar-btn${memberFilterIds.has(u.id) ? ' selected' : ''}" data-member="${escapeHtml(u.id)}">` +
        avatarHtml(u, '') + '</button>';
    }
    html += '</div>';
  }
  // Glocke nur in der ausgelieferten Web-App und nur mit sicherem Kontext — in der
  // Visu-Kachel fehlt beides, dort bleibt die Kopfzeile wie bisher.
  const glocke = pushMoeglich()
    ? `<button class="dash-bell${pushAn ? ' an' : ''}" data-push="menu"${pushLaeuft ? ' disabled' : ''} ` +
      `title="${escapeHtml(translate('Notifications'))}">` +
      `<i class="fa-light ${pushLaeuft ? 'fa-circle-notch fa-spin' : (pushAn ? 'fa-bell' : 'fa-bell-slash')}"></i></button>`
    : '';
  html += `<div class="dash-head"><div class="dash-date">` +
    `<span class="dash-weekday">${escapeHtml(dateWeekday)}</span>` +
    `<span class="dash-day">${escapeHtml(dateDay)}</span></div>${glocke}</div>`;

  // KPI-Kacheln
  const kpiTint = (c) => `background: linear-gradient(135deg, ${c}, color-mix(in srgb, ${c} 72%, #000));`;
  const zeroOverdue = overdueCount === 0;
  html += '<div class="kpi-grid">';
  if (withTodos) {
    // Auf schmalen Anzeigen tragen DREI Aufgaben-Kacheln nebeneinander kaum noch eine
    // Zahl. Deshalb steht dort eine Kachel mit den drei Zahlen untereinander, ab 820px
    // wieder die drei einzelnen. Beide Fassungen stehen im Markup, umgeschaltet wird per
    // CSS — eine Breiten-Abfrage in JS muesste bei jeder Groessenaenderung neu zeichnen.
    const zeile = (bez, wert) =>
      `<span class="kpi-row"><span class="kpi-row-label">${bez}</span>` +
      `<span class="kpi-row-value">${wert}</span></span>`;
    html += `<button class="kpi kpi-tasks" data-goto="todos" style="${kpiTint('var(--accent)')}">` +
      `<span class="kpi-rows">` +
      zeile(translate('Open tasks'), memberTasks.length) +
      zeile(translate('Due today'), todayCount) +
      zeile(translate('Overdue'), overdueCount) +
      // Dasselbe Wasserzeichen wie die Einzelkacheln: Einkauf und Termine tragen
      // ihres, ohne dieses saehe die Reihe wie zwei Gestaltungen aus. Die Zahlen
      // liegen darueber (.kpi-rows hat z-index 1).
      `</span><i class="fa-light fa-list-check kpi-glyph"></i></button>`;
    html += `<button class="kpi kpi-single" data-goto="todos" style="${kpiTint('var(--accent)')}">` +
      `<span class="kpi-label">${translate('Open tasks')}</span><span class="kpi-value">${memberTasks.length}</span>` +
      `<i class="fa-light fa-list-check kpi-glyph"></i></button>`;
    html += `<button class="kpi kpi-single" data-goto="todos" style="${kpiTint('#ff9500')}">` +
      `<span class="kpi-label">${translate('Due today')}</span><span class="kpi-value">${todayCount}</span>` +
      `<i class="fa-light fa-calendar kpi-glyph"></i></button>`;
    html += `<button class="kpi kpi-single" data-goto="todos" style="${kpiTint(zeroOverdue ? '#8e8e93' : '#ff4d4d')}">` +
      `<span class="kpi-label">${translate('Overdue')}</span><span class="kpi-value">${overdueCount}</span>` +
      `<i class="fa-light ${zeroOverdue ? 'fa-check' : 'fa-triangle-exclamation'} kpi-glyph"></i></button>`;
  }
  if (withShop) {
    html += `<button class="kpi" data-goto="shopping" style="${kpiTint('#34c759')}">` +
      `<span class="kpi-label">${translate('Items on the list')}</span><span class="kpi-value">${openShoppingCount()}</span>` +
      `<i class="fa-light fa-basket-shopping kpi-glyph"></i></button>`;
  }
  // Termine heute: nur mit eingerichtetem Kalender UND sichtbarem Kalender-Bereich —
  // eine Kachel, die auf einen abgeschalteten Bereich zeigt, waere eine Sackgasse.
  // Vor dem ersten Abruf (null) bleibt sie weg, eine vorschnelle 0 wuerde luegen.
  if (vis.includes('calendar') && dashEventsToday !== null) {
    html += `<button class="kpi" data-goto="calendar" style="${kpiTint('#5e5ce6')}">` +
      `<span class="kpi-label">${translate('Appointments today')}</span>` +
      `<span class="kpi-value">${dashEventsToday}</span>` +
      `<i class="fa-light fa-calendar-day kpi-glyph"></i></button>`;
  }
  html += '</div>';

  // Das Briefing direkt unter den Kacheln: Es erzaehlt genau das, was die Zahlen
  // darueber nur zaehlen. Ohne Text keine Karte — eine leere waere Ballast.
  if (briefingText) {
    const symbol = briefingLaedt ? 'fa-circle-notch fa-spin' : (briefingLaeuft ? 'fa-pause' : 'fa-play');
    const knopf = briefingTonMoeglich()
      ? `<button class="briefing-play${briefingLaeuft ? ' laeuft' : ''}" data-briefing="play" ` +
        `title="${escapeHtml(translate('Read aloud'))}"><i class="fa-light ${symbol}"></i></button>`
      : '';
    // Die Ueberschrift traegt beides: die Anrede und den Tag. „Euer" im
    // Mehrpersonen-Haushalt, weil das Briefing dort auch von den anderen erzaehlt;
    // am Abend die Kennzeichnung als Vorschau, damit niemand den morgigen Text fuer
    // den heutigen haelt (dafuer stand vorher eine MORGEN-Marke im Text).
    const viele = (store.users || []).length > 1;
    const ueberschrift = briefingVorschau
      ? translate(viele ? 'Your preview of tomorrow (plural)' : 'Your preview of tomorrow')
      : translate(viele ? 'Your day (plural)' : 'Your day');
    // Der Aufklapper steht immer im Markup; briefingKlappHinweis() nimmt ihn nach
    // dem Zeichnen weg, wenn der Text ohnehin ganz zu sehen ist.
    const klapp = `<button class="briefing-mehr" data-briefing="mehr">` +
      `${escapeHtml(briefingOffen ? translate('Show less') : translate('Show more'))}` +
      `<i class="fa-light ${briefingOffen ? 'fa-chevron-up' : 'fa-chevron-down'}"></i></button>`;
    html += `<div class="card briefing-card">` +
      `<div class="card-head"><h3>${escapeHtml(ueberschrift)}</h3>${knopf}</div>` +
      `<div class="briefing-text${briefingOffen ? '' : ' gekappt'}">` +
      `${escapeHtml(briefingText).replace(/\n+/g, '<br><br>')}</div>${klapp}</div>`;
  }

  // Wochenring, Prioritaetsfilter, Heute-Karte und Aufgabenliste zeigen
  // ausschliesslich Aufgaben - ohne den ToDo-Bereich bliebe leere Statistik.
  if (withTodos) {
    // Fortschrittskarte ausgeblendet (Wunsch vom 2026-08-10: „vorerst komplett
    // ausblenden"). Der Schalter statt geloeschtem Code, damit das Zurueckholen eine
    // Zeile ist; ringSvg()/ringTile() und die Uebersetzungen bleiben ebenfalls liegen.
    if (SHOW_PROGRESS_CARD) {
      // Vier Ringe mit ABSICHTLICH gemischtem Bezug: die Woche, der Gesamtstand und
      // zwei tagesaktuelle Werte. Jeder Ring beantwortet genau eine Frage; deshalb
      // heisst die Karte neutral „Fortschritt" und nicht mehr „Diese Woche erledigt".
      // Alle vier laufen ueber denselben Mitglieder-Filter wie der fruehere Ring.
      const tasksAll    = memberFiltered(allTodoTasks());
      const allDone     = tasksAll.filter(t => t.item.done).length;
      // classifyDue() schaut NICHT auf done — genau richtig: die Menge ist „war heute
      // faellig" bzw. „war vor heute faellig", unabhaengig vom Erledigungsstand.
      const dueToday    = tasksAll.filter(t => classifyDue(t.item) === 'today');
      const dueTodayOk  = dueToday.filter(t => t.item.done).length;
      const overdueAll  = tasksAll.filter(t => classifyDue(t.item) === 'overdue');
      const overdueOpen = overdueAll.filter(t => !t.item.done).length;
      const total = completedThisWeek + memberTasks.length;
      const vonBis = (a, b) => translate('%1 of %2').replace('%1', String(a)).replace('%2', String(b));
      // Ohne Nenner steht ein Gedankenstrich statt „0 %": bei den heute faelligen
      // Aufgaben ist das der Normalfall, und 0 % laese sich wie ein Versaeumnis.
      const anteilText = (a, b) => b > 0 ? Math.round(100 * a / b) + '%' : '—';

      html += '<div class="card week-card">' +
        `<h3>${translate('Progress')}</h3><div class="ring-row">` +
        ringTile(completedThisWeek, total > 0 ? completedThisWeek / total : 0,
                 translate('This week'), vonBis(completedThisWeek, total), false) +
        ringTile(anteilText(allDone, tasksAll.length), tasksAll.length > 0 ? allDone / tasksAll.length : 0,
                 translate('All tasks'), vonBis(allDone, tasksAll.length), false) +
        ringTile(anteilText(dueTodayOk, dueToday.length), dueToday.length > 0 ? dueTodayOk / dueToday.length : 0,
                 translate('Due today'),
                 dueToday.length > 0 ? vonBis(dueTodayOk, dueToday.length) : translate('Nothing due'), false) +
        // Warnring: er fuellt sich, wenn ueberfaellige Aufgaben liegen bleiben, und
        // ist leer, wenn alles abgearbeitet ist. In der Mitte steht die Anzahl der
        // offenen — bei 1 von 26 ist der Bogen nur ein Strich, die Zahl traegt die
        // Aussage, deshalb zusaetzlich rot.
        ringTile(overdueOpen, overdueAll.length > 0 ? overdueOpen / overdueAll.length : 0,
                 translate('Overdue'),
                 overdueAll.length > 0
                   ? translate('%1 of %2 open').replace('%1', String(overdueOpen)).replace('%2', String(overdueAll.length))
                   : translate('Nothing overdue'),
                 overdueOpen > 0) +
        '</div></div>';
    }

    // Prioritäts-Filter
    const prios = [['', translate('All')], ['high', translate('High')], ['normal', translate('Normal')], ['low', translate('Low')]];
    html += '<div class="segmented" id="dashPrio">';
    for (const [val, label] of prios) {
      html += `<button data-prio="${val}" class="${val === prio ? 'active' : ''}">${label}</button>`;
    }
    html += '</div>';

    // Heute-Karte und „Meine Aufgaben" stecken in einem eigenen Behaelter: er
    // spannt im breiten Raster ueber alle Spalten und teilt sich INTERN in
    // hoechstens zwei. Ohne ihn folgten die beiden dem aeusseren Raster und
    // standen dort zu dritt bzw. zu viert nebeneinander. Der Behaelter ist unter
    // 820 px ein gewoehnliches div, die Karten stapeln also wie bisher.
    html += '<div class="dash-tasks">';

    // Heute-Karte
    html += `<div class="card"><div class="card-head"><h3>${translate('Today')}</h3>` +
      `<button class="link" data-goto="todos">${translate('Show all')}</button></div>`;
    if (todayRows.length === 0) {
      const msg = (overdueCount + todayCount === 0)
        ? translate('Nothing due — all under control.')
        : translate('No matches for this filter.');
      html += `<div class="empty-row"><i class="fa-light fa-badge-check"></i>${escapeHtml(msg)}</div>`;
    } else {
      for (const t of todayRows) html += taskRowHtml(t, multiTodo);
    }
    html += '</div>';

    // Meine Aufgaben / Aufgaben von X
    if (SHOW_MY_TASKS_CARD && myUpcoming.length > 0) {
      let title = translate('Tasks');
      // Wie mySectionTitle in der App: nur bei GENAU EINEM gewählten Mitglied ein
      // personalisierter Titel; bei 0 oder mehreren das generische „Aufgaben".
      // Nur mit sichtbarer Leiste: ohne sie ist die Liste ungefiltert, und ein
      // Titel „Aufgaben von X" waere eine falsche Behauptung.
      if (zeigeMitglieder && memberFilterIds.size === 1) {
        const only = [...memberFilterIds][0];
        if (only === currentUserID()) title = translate('My tasks');
        else title = translate('Tasks of %1').replace('%1', byId[only] ? byId[only].name : '…');
      }
      html += `<div class="card"><div class="card-head"><h3>${escapeHtml(title)}</h3></div>`;
      for (const t of myUpcoming.slice(0, 5)) html += taskRowHtml(t, multiTodo);
      const remaining = myUpcoming.length - 5;
      if (remaining > 0) {
        const moreLabel = remaining === 1
          ? translate('1 more task')
          : translate('%1 more tasks').replace('%1', String(remaining));
        html += `<button class="more-row" data-goto="todos"><span>${escapeHtml(moreLabel)}</span><i class="fa-light fa-chevron-right"></i></button>`;
      }
      html += '</div>';
    }
    html += '</div>';   // .dash-tasks
  }

  // Termine heute und morgen, direkt unter den Aufgaben. Die Kachel oben sagt nur,
  // WIE VIELE heute anstehen; hier steht, WAS ansteht. Zeilen und Tagesueberschrift
  // sind dieselben wie im Kalender-Bereich (.cal-event, .cal-day-head) — eine eigene
  // Gestaltung fuer dieselbe Sache waere nur Ballast.
  if (vis.includes('calendar') && dashEvents.length > 0) {
    html += `<div class="card cal-preview"><div class="card-head"><h3>${translate('Appointments')}</h3>` +
      `<button class="link" data-goto="calendar">${translate('Open')}</button></div>`;
    let letzterTag = '';
    for (const e of dashEvents.slice(0, DASH_EVENTS_MAX)) {
      if (e.tag !== letzterTag) {
        letzterTag = e.tag;
        html += `<div class="cal-day-head${e.tag === 'today' ? ' is-today' : ''}">` +
          `<span class="cal-weekday">${escapeHtml(translate(e.tag === 'today' ? 'Today' : 'Tomorrow'))}</span></div>`;
      }
      const wann = e.allDay
        ? translate('all day')
        : new Date(e.start * 1000).toTimeString().slice(0, 5);
      // Avatare rechts, wie im Kalender-Bereich und in der Aufgabenzeile: dieselbe
      // Spalte (.cal-side/.cal-chips), damit die Zeilen untereinander stehen.
      const wer = e.members.length ? renderAvatarStack(e.members) : '';
      html += `<div class="cal-event"><span class="cal-body">` +
        `<div class="cal-when">${escapeHtml(wann)}</div>` +
        `<div class="cal-title">${escapeHtml(e.title || translate('Appointment'))}</div>` +
        `</span>` +
        (wer ? `<span class="cal-side"><span class="cal-chips">${wer}</span></span>` : '') +
        `</div>`;
    }
    const restTermine = dashEvents.length - DASH_EVENTS_MAX;
    if (restTermine > 0) {
      const label = restTermine === 1
        ? translate('1 more appointment')
        : translate('%1 more appointments').replace('%1', String(restTermine));
      html += `<button class="more-row" data-goto="calendar"><span>${escapeHtml(label)}</span>` +
        `<i class="fa-light fa-chevron-right"></i></button>`;
    }
    html += '</div>';
  }

  // Einkaufsvorschau — wie in der App nur, wenn es eine sichtbare Einkaufsliste
  // gibt (kein Platzhalter-Card, wenn keine existiert/alle ausgeblendet sind)
  const shopId = selectedShoppingID();
  const shopState = shopId ? instState(shopId) : null;
  if (withShop && shopState) {
    html += `<div class="card shop-card"><div class="card-head"><h3>${translate('Shopping list')}</h3>` +
      `<button class="link" data-goto="shopping">${translate('Open')}</button></div>`;
    const openItems = openSections(shopState).flatMap(s => s.items);
    if (openItems.length === 0) {
      html += `<div class="empty-row"><i class="fa-light fa-basket-shopping"></i>${translate('The list is empty.')}</div>`;
    } else {
      html += '<div class="shop-strip">';
      for (const it of openItems) {
        const img = resolveItemImage(it);
        const tint = categoryStyle(it.category).tint;
        // Menge wie in der Artikelzeile ableiten: leer bedeutet 1 (siehe
        // shoppingRowHtml). Nicht-numerische Angaben wie „500 g" bleiben unverändert
        // — hier gibt es keinen Stepper, das Abzeichen zeigt beides gleich an.
        const amount = String(it.amount || '').trim() || '1';
        html += `<div class="strip-item">` +
          // Der Wrapper trägt die Positionierung des Abzeichens. Er darf die
          // Beschneidung des Knopfs NICHT erben, sonst wäre das Abzeichen an der
          // Ecke abgeschnitten.
          `<div class="strip-thumb-wrap">` +
          // Klasse statt Inline-Hintergrund: bei vorhandenem Bild entfällt die runde
          // Fläche vollständig — Hintergrund UND kreisförmige Beschneidung, sonst
          // bliebe das Produkt weiter in Kreisform. Ohne Bild bleibt der getönte
          // Kreis mit dem Anfangsbuchstaben.
          `<button class="strip-thumb${img ? ' has-img' : ''}" data-check="${escapeHtml(String(it.id))}"` +
          ((img || !tint) ? '' : ` style="background:${tint}"`) + `>` +
          (img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" />`
               : escapeHtml(String(it.name || '?').charAt(0).toUpperCase())) +
          `</button><span class="strip-amount">${escapeHtml(amount)}</span></div>` +
          `<div class="strip-name"><span class="marquee-inner">${escapeHtml(it.name)}</span></div></div>`;
      }
      html += '</div>';
    }
    let actions = `<button data-preview-add="1"><i class="fa-light fa-plus"></i> ${translate('Add item')}</button>`;
    if (shopState.scannerEnabled !== false) {
      actions += `<button data-preview-scan="1"><i class="fa-light fa-barcode"></i> ${translate('Scan barcode')}</button>`;
    }
    html += `<div class="preview-actions">${actions}</div>`;
    html += '</div>';
  }

  if (!renderInto(el, html)) return;

  // Interaktionen
  el.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.goto)));
  el.querySelectorAll('[data-briefing="play"]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    briefingVorlesen();
  }));
  el.querySelectorAll('[data-push="menu"]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    pushMenu(b);
  }));
  el.querySelectorAll('[data-briefing="mehr"]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    briefingOffen = !briefingOffen;
    renderDashboard();
  }));
  briefingKlappHinweis(el);
  el.querySelectorAll('[data-member]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = b.dataset.member;
    if (memberFilterIds.has(id)) memberFilterIds.delete(id);
    else memberFilterIds.add(id);
    renderDashboard();
  }));
  el.querySelectorAll('#dashPrio [data-prio]').forEach(b => b.addEventListener('click', () => {
    dashPriority = b.dataset.prio;
    ls.set('symdo.dashboardPriority', dashPriority);
    renderDashboard();
  }));
  const strip = el.querySelector('.shop-strip');
  bindDragScroll(strip);
  el.querySelectorAll('[data-check]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    // Nach einem Ziehen des Streifens kommt noch ein Klick — der darf nicht abhaken.
    if (strip && strip.dataset.dragged === '1') return;
    // Im Streifen liegen die Artikel NEBENeinander: hier faellt die Kachel in der
    // Breite zusammen, sonst blieb eine Luecke im Streifen stehen.
    const kachel = b.closest('.strip-item') || b;
    if (kachel.dataset.animating === '1') return;
    kachel.dataset.animating = '1';
    stripCheckOff(kachel, () => sdCall(shopId, 'ToggleCart', { id: b.dataset.check, inCart: true }));
  }));
  const previewAdd = el.querySelector('[data-preview-add]');
  if (previewAdd) previewAdd.addEventListener('click', () => {
    setTab('shopping');
    setTimeout(() => document.getElementById('shoppingInput').focus(), 50);
  });
  const previewScan = el.querySelector('[data-preview-scan]');
  if (previewScan) previewScan.addEventListener('click', () => {
    setTab('shopping');
    setTimeout(() => { if (typeof openScannerOverlay === 'function') openScannerOverlay(); }, 60);
  });
  el.querySelectorAll('.todo-card[data-inst]').forEach(row => {
    const instanceID = parseInt(row.dataset.inst);
    const itemID = parseInt(row.dataset.item);
    const chk = row.querySelector('.chk');
    chk.addEventListener('click', (e) => e.stopPropagation());
    chk.addEventListener('change', () => {
      if (row.dataset.animating === '1') return;
      row.dataset.animating = '1';
      const done = chk.checked;
      checkOffCard(row, !done, () => sdCall(instanceID, 'ToggleDone', { id: itemID, done: done }));
    });
    row.addEventListener('click', () => {
      const st = instState(instanceID);
      const item = st && st.items.find(i => i.id === itemID);
      if (item) openTodoEditor(instanceID, item);
    });
  });
  applyMarquees(el);
}

/**
 * Eine Aufgabenzeile auf der Uebersicht — dargestellt wie im Aufgaben-Bereich
 * (Wunsch vom 20.08.2026). Vorher war es eine eigene, schlichtere Zeile; dieselbe
 * Aufgabe sah damit an zwei Stellen anders aus, und die Frist stand als Text statt
 * als farbiges Abzeichen.
 *
 * OHNE die Bedienteile des Bereichs: kein Wischen, kein Bearbeiten- oder
 * Loeschen-Knopf, kein Verschieben-Griff. Die Uebersicht ist eine Uebersicht; abgehakt
 * wird ueber das Kaestchen, alles andere oeffnet die Aufgabe.
 */
function taskRowHtml(t, showListName) {
  const st = instState(t.instanceID) || {};
  // Dieselben fuenf Schalter wie im Bereich. Opt-out: fehlt einer, ist das
  // Abzeichen an.
  const badges = {
    quantity:     st.showQuantityBadge !== false,
    recurrence:   st.showRecurrenceBadge !== false,
    due:          st.showDueBadge !== false,
    notification: st.showNotificationBadge !== false,
    priority:     st.showPriorityBadge !== false,
  };
  // Der Listenname nur bei mehreren Listen — sonst sagt er nichts.
  const zusatz = showListName ? String(t.listName || '') : '';
  return todoRowHtml(t.item, false, badges, false, false, t.instanceID, zusatz, false);
}

// ── Einkaufen ──────────────────────────────────────────────────────────────
function renderShopping() {
  syncCompat();
  hinweisAbzeichenAuffrischen();
  const vis = visibleInstances('shopping');
  const id = selectedShoppingID();
  const st = id ? instState(id) : null;
  updateSwitcher('shoppingSwitcher', 'shoppingTitle', vis, id, 'symdo.selectedShoppingID');

  const area = document.getElementById('shoppingListArea');
  const scannerBtn = document.getElementById('btnOpenScanner');
  scannerBtn.style.display = (st && st.scannerEnabled !== false) ? '' : 'none';

  if (!st) {
    renderInto(area, `<div class="empty-state"><i class="fa-light fa-basket-shopping"></i>${translate('No shopping list found')}${noInstanceHint('shopping')}</div>`);
    return;
  }
  const sections = openSections(st);
  const cart = (Array.isArray(st.items) ? st.items : []).filter(i => i.inCart);
  const favLists = Array.isArray(st.favoriteLists) ? st.favoriteLists : [];
  const favNames = new Set();
  for (const fl of favLists) {
    for (const fi of (fl.items || [])) favNames.add(String(fi.name || '').trim().toLowerCase());
  }

  // data-key auf allen Knoten ohne data-id: damit kann renderRows() sie über
  // einen Re-Render hinweg wiedererkennen und stehen lassen.
  let html = '';
  if (sections.length === 0 && cart.length === 0) {
    html += `<div class="empty-state" data-key="empty"><i class="fa-light fa-basket-shopping"></i>${translate('The list is empty.')}</div>`;
  }
  for (const sec of sections) {
    const style = categoryStyle(sec.category);
    // Symbol und Farbe nur setzen, wenn der Payload sie liefert: ein <i> ohne Klasse
    // wäre ein leerer Kasten, style="color:" ohne Wert ungültiger CSS.
    html += `<div class="cat-header" data-key="cat:${escapeHtml(sec.category)}"`
      + (style.tint ? ` style="color:${style.tint}"` : '') + `>`
      + (style.icon ? `<i class="fa-light ${style.icon}"></i>` : '')
      + `${escapeHtml(sec.category)}</div>`;
    // Kleine Kategorien füllen die Reihe statt sie halb leer zu lassen:
    // einer über die ganze Breite, zwei zu je einer Hälfte (siehe CSS).
    const spanne = sec.items.length === 1 ? 'span-all'
                 : sec.items.length === 2 ? 'span-half' : '';
    for (const it of sec.items) html += shoppingRowHtml(it, favNames, st, false, spanne);
  }
  // Wie cartExpanded (@State) in der App: nur In-Memory, startet eingeklappt
  const collapsed = !cartExpanded;
  if (cart.length > 0) {
    html += `<button class="section-toggle${collapsed ? '' : ' open'}" data-key="cartToggle" id="cartToggle">` +
      `<i class="fa-light fa-cart-shopping"></i>${translate('Recently used')}` +
      `<span class="count">${cart.length}</span><i class="fa-light fa-chevron-right chev"></i></button>`;
    if (!collapsed) {
      // Gleiche Regel wie für die Kategorien: in der Kachel ist der Wagen ein
      // .item-grid wie jede Kategorie, also gilt sie dort ohnehin schon.
      const spanneWagen = cart.length === 1 ? 'span-all'
                        : cart.length === 2 ? 'span-half' : '';
      for (const it of cart) html += shoppingRowHtml(it, favNames, st, true, spanneWagen);
    }
  }
  const freshNodes = renderRows(area, html);
  if (freshNodes === false) return;

  // Nur an NEUE Knoten binden — wiederverwendete tragen ihre Handler noch.
  const cartToggle = freshNodes.find(n => n.id === 'cartToggle');
  if (cartToggle) cartToggle.addEventListener('click', () => {
    cartExpanded = !cartExpanded;
    renderShopping();
  });

  // Wiederverwendete Karten überleben jetzt mehrere Zustände. Ihre Handler dürfen
  // deshalb NICHTS aus dem Render-Zeitpunkt festhalten (st, inCart, id) — sonst
  // arbeiten sie später mit veralteten Daten. Alles wird beim Klick frisch geholt.
  const curId = () => selectedShoppingID();
  const curState = () => instState(curId()) || {};
  freshNodes.filter(n => n.classList && n.classList.contains('item-card')).forEach(card => {
    const itemId = card.dataset.id;
    const curItem = () => (curState().items || []).find(i => String(i.id) === itemId);
    // Wischen nach rechts ist der einzige Weg zum Artikel-Editor, seit die Karte
    // keinen Stift-Knopf mehr hat.
    bindCardSwipe(card, '.item-card-content', () => sdCall(curId(), 'DeleteItem', itemId), () => {
      const item = curItem();
      if (item) openItemEditor(curId(), item);
    });
    card.querySelector('.item-card-content').addEventListener('click', (e) => {
      if (card.dataset.swiped === '1') return;
      if (e.target.closest('button')) return;
      if (card.dataset.animating === '1') return;   // zweiter Klick waehrend der Bewegung
      const item = curItem();
      const inCart = !!(item && item.inCart);
      card.dataset.animating = '1';
      // Erst die Bewegung, dann der Aufruf — der Zustand kommt ohnehin erst mit dem
      // naechsten Push zurueck und entfernt den Knoten dann unsichtbar.
      checkOffCard(card, inCart, () => sdCall(curId(), 'ToggleCart', { id: itemId, inCart: !inCart }));
    });
    const amountBtn = card.querySelector('[data-amount-edit]');
    if (amountBtn) amountBtn.addEventListener('click', (e) => {
      // Ohne stopPropagation legte der Klick den Artikel zugleich in den Wagen.
      e.stopPropagation();
      const item = curItem();
      if (!item) return;
      showPrompt(translate('Change quantity'), String(item.amount || ''), translate('Save'), (val) => {
        sdCall(curId(), 'UpdateItem', {
          id: item.id, name: item.name, amount: val.trim(),
          notes: item.notes || '', category: item.category || ''
        });
      });
    });
    const heartBtn = card.querySelector('[data-heart]');
    if (heartBtn) heartBtn.addEventListener('click', () => {
      const item = curItem();
      if (item) openFavPicker(curId(), item);
    });
    // Stift und Papierkorb rufen dieselben Wege wie die Wischgesten.
    const editBtn = card.querySelector('[data-edit]');
    if (editBtn) editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = curItem();
      if (item) openItemEditor(curId(), item);
    });
    const delBtn = card.querySelector('[data-del]');
    if (delBtn) delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sdCall(curId(), 'DeleteItem', itemId);
    });
    card.querySelectorAll('[data-step]').forEach(btn => btn.addEventListener('click', () => {
      const item = curItem();
      if (!item) return;
      const next = Math.max(1, (parseInt(item.amount) || 1) + parseInt(btn.dataset.step));
      // Sofort lokal übernehmen und neu zeichnen: der Stepper reagiert damit
      // ohne Wartezeit auf den Server. Dank renderRows() betrifft das exakt
      // diese eine Karte. Die Antwort der Aktion bringt den maßgeblichen Zustand
      // nach und korrigiert die Anzeige, falls der Server sie ablehnt.
      item.amount = String(next);
      renderShopping();
      sdCall(curId(), 'UpdateItem', { id: item.id, name: item.name, amount: String(next), notes: item.notes || '', category: item.category || '' });
    }));
  });

  renderSuggestions();
}

// Ausgefülltes Herz als Inline-SVG (das fa-solid-Icon ist im Icon-Kit nicht
// enthalten und rendert sonst als leerer Kasten). Füllt sich über currentColor.
const HEART_SOLID_SVG = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true" style="display:block"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
function shoppingRowHtml(it, favNames, st, inCart, spanne) {
  const img = resolveItemImage(it);
  const tint = categoryStyle(it.category).tint;
  // Wie ItemRow.numericAmount in der App: leer = 1 (Stepper), führende Nullen
  // sind KEINE Zahl (Badge). '' → Stepper mit '1'
  const amountRaw = String(it.amount || '').trim();
  const numeric = amountRaw === '' || /^[1-9]\d*$/.test(amountRaw);
  const amount = amountRaw === '' ? '1' : amountRaw;
  const faved = favNames.has(String(it.name || '').trim().toLowerCase());
  let side = '';
  // Reihenfolge: Menge, Preis, Herz — das Herz sitzt ganz rechts. Gleich
  // gehalten in der ShoppingList-Kachel (item-side) und in der iOS-Zeile
  // (ItemRow.content), damit die Zeile überall gleich aussieht.
  if (!inCart && numeric) {
    // Runter-Pfeil bei Menge=1 nur unsichtbar (Platz bleibt reserviert), damit
    // das Badge seine vertikale Position behält und nicht springt.
    const canDec = parseInt(amount) > 1;
    side += `<span class="stepper"><button data-step="1" aria-label="+"><i class="fa-light fa-chevron-up"></i></button>` +
      `<span class="amount-badge">${escapeHtml(amount)}</span>` +
      `<button data-step="-1" aria-label="−"${canDec ? '' : ' style="visibility:hidden" tabindex="-1" aria-hidden="true"'}><i class="fa-light fa-chevron-down"></i></button>` +
      '</span>';
  } else {
    // Ohne Pfeile (nicht-numerische Menge wie „500 g", oder Artikel im Wagen)
    // ist das Abzeichen antippbar und nimmt die Menge per Dialog entgegen.
    side += `<span class="amount-badge" data-amount-edit="1" role="button" tabindex="0" title="${translate('Change quantity')}">${escapeHtml(amount || '1')}</span>`;
  }
  if (it.price && st.extApiShowPrice !== false) {
    side += `<span class="item-price">${escapeHtml(it.price)}</span>`;
  }
  // Die drei Knöpfe sind je Liste abschaltbar. Herz ist von jeher sichtbar, also
  // opt-out; Stift und Papierkorb sind neu und deshalb opt-in. Die Wischgesten
  // bleiben in jedem Fall aktiv — sie sind der Weg, wenn kein Knopf da ist.
  if (st.showFavoriteHeart !== false) {
    side += `<button class="heart-btn${faved ? ' faved' : ''}" data-heart="1" aria-label="Favorit">${faved ? HEART_SOLID_SVG : '<i class="fa-light fa-heart"></i>'}</button>`;
  }
  if (st.showEditButton === true) {
    side += `<button class="row-btn" data-edit="1" aria-label="${translate('Edit')}" title="${translate('Edit')}"><i class="fa-light fa-pencil"></i></button>`;
  }
  if (st.showDeleteButton === true) {
    side += `<button class="row-btn destructive" data-del="1" aria-label="${translate('Delete')}" title="${translate('Delete')}"><i class="fa-light fa-trash"></i></button>`;
  }
  return `<div class="item-card${inCart ? ' in-cart' : ''}${spanne ? ' ' + spanne : ''}" data-id="${escapeHtml(String(it.id))}">` +
    `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
    `<div class="swipe-under-edit"><i class="fa-light fa-pencil"></i></div>` +
    `<div class="item-card-content">` +
    // Ohne Farbe (Payload ohne categoryStyles) bleibt das Attribut weg — dann gilt
      // background: var(--surface2) aus dem CSS statt eines leeren background:.
      `<span class="item-thumb"${(img || tint) ? ` style="background:${img ? 'transparent' : tint}"` : ''}>` +
    (img ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" />` : escapeHtml(String(it.name || '?').charAt(0).toUpperCase())) +
    `</span><span class="item-main"><span class="item-name">${escapeHtml(it.name)}</span>` +
    (it.notes ? `<span class="item-notes">${escapeHtml(it.notes)}</span>` : '') +
    `</span><span class="item-side">${side}</span></div></div>`;
}

function renderSuggestions() {
  const id = selectedShoppingID();
  const st = id ? instState(id) : null;
  const input = document.getElementById('shoppingInput');
  const panel = document.getElementById('suggestions');
  const chips = document.getElementById('suggestionChips');
  if (!st || document.activeElement !== input) {
    panel.classList.remove('open');
    return;
  }
  const query = input.value.trim().toLowerCase();
  // Erst ab dem ERSTEN Zeichen. Vorher zeigte der Fokus allein die 30 haeufigsten und
  // verdeckte die Liste, bevor jemand etwas gesucht hat.
  if (!query) {
    panel.classList.remove('open');
    return;
  }
  const openNames = new Set((st.items || []).filter(i => !i.inCart).map(i => String(i.name).toLowerCase()));
  // Gefiltert wird nach Teilzeichenfolge — sonst fielen sinnvolle Treffer weg
  // („Babymilch" bei „mi") —, aber die REIHENFOLGE stellt das Passende nach vorn:
  //   0  der Name BEGINNT mit der Eingabe        „mi"   -> Milch
  //   1  ein WORT im Namen beginnt damit         „kaese" -> geriebener Kaese
  //   2  die Eingabe steckt irgendwo drin        „app"  -> Putzlappen
  // Gemessen an 540 Vorschlaegen: „a" trifft 257 per Teilzeichenfolge, aber nur 17
  // beginnen damit; „app" trifft ausschliesslich „Putzlappen".
  const rang = (name) => {
    const n = String(name).toLowerCase();
    if (n.startsWith(query)) return 0;
    if (n.replace(/[-/(),.]/g, ' ').split(' ').some(w => w.startsWith(query))) return 1;
    return 2;
  };
  const list = (Array.isArray(st.suggestions) ? st.suggestions : [])
    .filter(s => !openNames.has(String(s.name).toLowerCase()))
    .filter(s => String(s.name).toLowerCase().includes(query))
    .sort((a, b) => rang(a.name) - rang(b.name)
      || (b.frequency || 0) - (a.frequency || 0)
      || String(a.name).localeCompare(String(b.name)))
    .slice(0, 30);
  if (list.length === 0) {
    panel.classList.remove('open');
    return;
  }
  chips.innerHTML = list.map(s => {
    // Bild nur wenn eines aufloest — getProductImageUrl liefert null, wenn die
    // Bilder abgeschaltet sind oder der Name auf keine Datei passt.
    const bild = getProductImageUrl(s.name, s.imageUrl);
    const img = bild ? `<img class="chip-img" src="${escapeHtml(bild)}" alt="" loading="lazy" />` : '';
    return `<button class="chip" data-name="${escapeHtml(s.name)}" data-cat="${escapeHtml(s.category || '')}">`
         + img + escapeHtml(s.name) + `</button>`;
  }).join('');
  chips.querySelectorAll('.chip').forEach(chip => {
    // mousedown/touchstart statt pointerdown: die Symcon-Desktop-Visu liefert
    // KEINE Pointer Events (siehe bindCardSwipe) — dort wären die Chips sonst
    // gar nicht klickbar. Beide feuern wie pointerdown vor dem blur des Inputs,
    // sonst schließt das Panel vor dem Klick. lastTouch verhindert, dass das vom
    // Browser nachgeschobene mousedown den Artikel doppelt hinzufügt.
    let lastTouch = 0;
    const activate = (e) => {
      e.preventDefault();
      sdCall(id, 'AddItem', { name: chip.dataset.name, category: chip.dataset.cat, amount: '1' });
      input.value = '';
    };
    chip.addEventListener('touchstart', (e) => { lastTouch = Date.now(); activate(e); }, { passive: false });
    chip.addEventListener('mousedown', (e) => { if (Date.now() - lastTouch < 600) return; activate(e); });
  });
  panel.classList.add('open');
}

// Listen-Umschalter (gemeinsam für Einkaufen/ToDos)
function updateSwitcher(selectId, titleId, vis, currentId, storageKey) {
  const select = document.getElementById(selectId);
  const title = document.getElementById(titleId);
  if (vis.length > 1) {
    select.style.display = '';
    title.style.display = 'none';
    select.innerHTML = vis.map(i =>
      `<option value="${i.id}"${i.id === currentId ? ' selected' : ''}>${escapeHtml(i.name)}</option>`
    ).join('');
    select.onchange = () => {
      ls.set(storageKey, select.value);
      syncCompat();
      renderAll();
    };
  } else {
    select.style.display = 'none';
    title.style.display = '';
    title.textContent = vis.length ? vis[0].name : '';
  }
}

// ── ToDos ──────────────────────────────────────────────────────────────────
// Sortierung 1:1 aus dem ToDoList-Modul übernommen (inkl. title/desc-Quirk)
function sortTodoItems(items, sortMode, sortDir) {
  const list = Array.isArray(items) ? items.slice() : [];
  if (sortMode === 'manual') return list;
  const compareDue = (a, b) => {
    const da = parseInt(a.due) || 0;
    const db = parseInt(b.due) || 0;
    if (da <= 0 && db <= 0) return 0;
    if (da <= 0) return 1;
    if (db <= 0) return -1;
    return sortDir === 'asc' ? (da - db) : (db - da);
  };
  const prioRankLowFirst = (p) => {
    const v = String(p ?? 'normal');
    if (v === 'low') return 0;
    if (v === 'normal') return 1;
    return 2;
  };
  list.sort((a, b) => {
    if (sortMode === 'due') {
      const c = compareDue(a, b);
      if (c !== 0) return c;
      return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
    }
    if (sortMode === 'priority') {
      const pa = prioRankLowFirst(a.priority);
      const pb = prioRankLowFirst(b.priority);
      if (pa !== pb) return sortDir === 'asc' ? (pa - pb) : (pb - pa);
      const c = compareDue(a, b);
      if (c !== 0) return c;
      return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
    }
    if (sortMode === 'title') {
      const c = String(a.title ?? '').localeCompare(String(b.title ?? ''), undefined, { sensitivity: 'base' });
      if (c !== 0) return c;
      return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
    }
    const ca = parseInt(a.createdAt) || 0;
    const cb = parseInt(b.createdAt) || 0;
    if (ca !== cb) return sortDir === 'asc' ? (ca - cb) : (cb - ca);
    return (parseInt(a.id) || 0) - (parseInt(b.id) || 0);
  });
  if (sortMode === 'title' && sortDir === 'desc') list.reverse();
  return list;
}

/** Gilt die Mitglieder-Leiste als sichtbar? Das Dashboard fasst ALLE Aufgaben-
 *  listen zusammen und hat deshalb keinen eigenen Zustand. In der Web-App ist der
 *  Schalter appweit, alle Listen antworten also gleich; sind sie sich doch einmal
 *  uneins, genuegt eine, die sie zeigt. */
function mitgliederLeisteSichtbar() {
  const listen = visibleInstances('todo');
  if (listen.length === 0) return false;
  return listen.some(i => (instState(i.id) || {}).showMemberBar !== false);
}

// Füllt die eigenständige sticky Avatar-Pille des ToDo-Tabs (#todoMembers).
function renderTodoMembers() {
  const el = document.getElementById('todoMembers');
  if (!el) return;
  const st = instState(selectedTodoID());
  // Je Liste abschaltbar. Ohne Nutzer gibt es ohnehin nichts zu zeigen.
  if (!st || st.showMemberBar === false || store.users.length === 0) {
    el.style.display = 'none'; renderInto(el, ''); return;
  }
  el.style.display = '';
  const membersHtml = store.users.map(u =>
    `<button class="avatar-btn${memberFilterIds.has(u.id) ? ' selected' : ''}" data-member="${escapeHtml(u.id)}">` +
    avatarHtml(u, '') + '</button>'
  ).join('');
  if (!renderInto(el, membersHtml)) return;
  el.querySelectorAll('[data-member]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const mid = b.dataset.member;
    if (memberFilterIds.has(mid)) memberFilterIds.delete(mid);
    else memberFilterIds.add(mid);
    renderTodos();
  }));
}

/**
 * Dieselbe Avatar-Pille im Kalender-Tab (#calMembers).
 *
 * Zweck wie bei den Aufgaben: nach Mitglied filtern. Die Zuordnung eines Termins
 * kommt aus der Ablage des Gateways (CalMembers) und nicht aus dem Kalender — ein
 * Termin, der nicht über diese App angelegt wurde, hat deshalb kein Mitglied und
 * verschwindet, sobald gefiltert wird. Das ist beim Filtern richtig so, erklärt
 * aber, warum die Liste dann kürzer ausfällt als man erwartet.
 */
function renderCalMembers() {
  const el = document.getElementById('calMembers');
  if (!el) return;
  // Derselbe appweite Schalter wie im ToDo-Tab; ohne Nutzer gibt es nichts zu zeigen.
  // Die Auswahl bleibt dabei stehen (bereichsuebergreifend) — gefiltert wird ohne
  // Leiste ohnehin nicht, siehe renderCalendar.
  if (rowButtonFlags().showMemberBar === false || store.users.length === 0) {
    el.style.display = 'none';
    renderInto(el, '');
    return;
  }
  el.style.display = '';
  const html = store.users.map(u =>
    `<button class="avatar-btn${memberFilterIds.has(u.id) ? ' selected' : ''}" data-member="${escapeHtml(u.id)}">` +
    avatarHtml(u, '') + '</button>'
  ).join('');
  if (!renderInto(el, html)) return;
  el.querySelectorAll('[data-member]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const mid = b.dataset.member;
    if (memberFilterIds.has(mid)) memberFilterIds.delete(mid);
    else memberFilterIds.add(mid);
    renderCalendar();
  }));
}

// ── Aufgaben aus weitergeleiteten E-Mails ────────────────────────────────────
// Das Gateway analysiert eingehende Post und legt Vorschlaege ab; hier stehen sie
// ueber der Aufgabenliste und warten auf eine Entscheidung. Angelegt wird die
// Aufgabe auf dem normalen Weg (AddItem der Zielliste) — die Vorschlagsliste
// erfaehrt danach nur, dass der Eintrag erledigt ist.
let mailProposals = [];
let mailLoading = false;
// Aufgeklappt oder nicht, je Sorte. Wie cartExpanded nur im Speicher: jeder
// Neustart beginnt eingeklappt, damit die Vorschlaege die Liste nicht ueberdecken.
const mailOpen = { task: false, event: false };

/** Nur mit Gateway: die Vorschlaege entstehen und liegen dort. */
function mailAiAvailable() {
  if (window.__SYMDO__) return true;
  return !!store.gatewayAvailable;
}

function loadMailProposals() {
  if (mailLoading) return;
  // Kein Gateway mehr: was noch auf dem Schirm steht, MUSS weg. Ein Vorschlag,
  // den niemand mehr uebernehmen oder verwerfen kann, ist eine Sackgasse.
  if (!mailAiAvailable()) {
    if (mailProposals.length > 0) { mailProposals = []; renderMailAi('task'); renderMailAi('event'); }
    return;
  }
  mailLoading = true;
  aiPost('/mail/proposals', {}).then(r => {
    mailLoading = false;
    const j = r && r.json;
    // Kein Gateway, alte Version, KI-Route unbekannt: still nichts anzeigen.
    if (!j || j.ok !== true || !Array.isArray(j.proposals)) return;
    mailProposals = j.proposals;
    renderMailAi('task');
    // Termine haengen am Kalenderbereich; ohne das erschienen sie dort erst beim
    // naechsten Tab-Wechsel.
    renderMailAi('event');
  }).catch(() => { mailLoading = false; });
}

/** Faelligkeit fuer AddItem. Mit Uhrzeit wird der Termin punktgenau, ohne ganztaegig. */
function mailDueFields(due, time) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(due || ''));
  if (!m) return { due: 0, dueAllDay: false };
  const t = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(time || ''));
  const d = t
    ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(t[1]), Number(t[2]))
    : new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return { due: Math.floor(d.getTime() / 1000), dueAllDay: !t, dueDay: m[0] };
}

function mailWhenText(due, time, end) {
  const tag = (v) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
    return m ? m[3] + '.' + m[2] + '.' + m[1] : '';
  };
  const von = tag(due);
  if (!von) return '';
  // Mehrtaegiger Termin (Ferien, Schliesszeit): Zeitraum statt eines Datums, sonst
  // sieht eine zweiwoechige Schliessung wie ein einzelner Tag aus. Die Uhrzeit bleibt
  // dabei stehen — ein Kurs „ab 07.09. um 19:15, bis 30.11." verliert sie sonst,
  // und genau daran erkennt man eine Reihe statt eines Dauertermins.
  const bis = tag(end);
  const uhr = /^([01]\d|2[0-3]):([0-5]\d)$/.test(String(time || '')) ? ' ' + time : '';
  if (bis && bis !== von) return von + '–' + bis + uhr;
  return von + uhr;
}

/**
 * Zaehler an den Tabs: offene Aufgaben-Vorschlaege am ToDo-Tab, offene
 * Termin-Vorschlaege am Kalender-Tab. Beide werden bei jedem Lauf gesetzt,
 * egal welche Sorte gerade gezeichnet wird — sonst bliebe der Zaehler der
 * anderen Sorte stehen, wenn nur ihre Liste leer wird.
 */
function setMailBadges() {
  let aufgaben = 0;
  let termine = 0;
  mailProposals.forEach(p => (Array.isArray(p.items) ? p.items : []).forEach(it => {
    if (it.kind === 'event') termine++; else aufgaben++;
  }));
  const setzen = (id, n) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = String(n);
    el.style.display = n > 0 ? '' : 'none';
  };
  setzen('tabTodoBadge', aufgaben);
  setzen('tabCalendarBadge', termine);
}

/**
 * Vorschlagsband einer Sorte.
 *
 * Getrennte Bereiche, getrennte Sorten: Aufgaben stehen ueber der Aufgabenliste,
 * Termine ueber der Agenda. Eine Aufgabe im Kalender waere so falsch wie ein
 * Elternabend in der Aufgabenliste.
 *
 * @param {'task'|'event'} sorte
 */
function renderMailAi(sorte) {
  const istTermin = sorte === 'event';
  // Jede Sorte zaehlt an ihrem eigenen Tab: Aufgaben am ToDo-Tab, Termine am
  // Kalender-Tab. Eine Summe ueber beide log — ein Halbjahresplaner mit 19
  // Terminen liess das ToDo-Tab „20" melden, obwohl dort ein Vorschlag stand.
  // Vor dem Ausstieg unten: die Zaehler haengen an der Tab-Leiste, nicht am
  // Vorschlagsband, und muessen auch stimmen, wenn dessen Behaelter fehlt.
  setMailBadges();

  const area = document.getElementById(istTermin ? 'calAiArea' : 'mailAiArea');
  if (!area) return;

  // Nur die Vorschlaege dieser Sorte, leere Mails fallen weg.
  const gefiltert = mailProposals.map(p => Object.assign({}, p, {
    items: (Array.isArray(p.items) ? p.items : []).filter(it => (it.kind === 'event') === istTermin)
  })).filter(p => p.items.length > 0);

  if (gefiltert.length === 0) {
    area.style.display = 'none';
    area.innerHTML = '';
    area.classList.remove('open');
    // renderInto vergleicht gegen _lastHtml. Ohne das Zuruecksetzen bliebe der
    // Bereich leer, wenn spaeter genau dasselbe Markup wieder ansteht.
    area._lastHtml = null;
    return;
  }
  const byId = usersById();
  area.style.display = '';

  // Eingeklappt sichtbar ist nur diese Zeile — mit der Zahl IM Titel, weil sie
  // dort die Aussage ist und nicht eine Beschriftung dazu.
  const anzahl = gefiltert.reduce((n, p) => n + p.items.length, 0);
  const auf = mailOpen[sorte] === true;
  // Die graue Sammel-Flaeche (.mail-ai.open) haengt am Behaelter, der offene
  // Zustand am Knopf darin — CSS sieht den Elternknoten nicht, also hier.
  area.classList.toggle('open', auf);
  const titel = anzahl === 1
    ? translate(istTermin ? '1 new appointment found' : '1 new task found')
    : translate(istTermin ? '%1 new appointments found' : '%1 new tasks found').replace('%1', String(anzahl));
  const umschalter =
    `<button class="section-toggle${auf ? ' open' : ''}" data-mail="toggle" data-key="mailToggle" aria-expanded="${auf ? 'true' : 'false'}">` +
      `<i class="fa-light fa-envelope"></i>${escapeHtml(titel)}` +
      `<i class="fa-light fa-chevron-right chev"></i>` +
    `</button>`;

  const karten = !auf ? '' : gefiltert.map(p => {
    const u = byId[String(p.userId || '')];
    const kopf = u ? avatarHtml(u, 'avatar') : '<i class="fa-light fa-envelope"></i>';
    // Eine weitergeleitete Mail nennt im aeusseren Kopf immer nur den Haushalt, der
    // sie weitergeleitet hat, und traegt ein „Fwd:" im Betreff. Wer sie geschrieben
    // hat und wie sie hiess, liest das Gateway aus dem zitierten Kopf (MailDetectOrigin)
    // und liefert es als `origin` mit. Fehlt es (aeltere Vorschlaege, Mail ohne
    // zitierten Kopf), bleibt der aeussere Kopf stehen — nur ohne „Fwd:".
    const quelleObj = (p.origin && typeof p.origin === 'object') ? p.origin : {};
    const weiter = String(p.fromName || p.from || '');
    const quelle = String(quelleObj.name || quelleObj.address || '');
    const titelText = String(quelleObj.subject || mailPlainSubject(p.subject) || translate('E-mail'));
    // Nur die Quelle, ohne Hinweis auf die Weiterleitung: weitergeleitet hat immer
    // jemand aus dem Haushalt, das ist keine Auskunft. Ohne erkannte Quelle bleibt
    // der aeussere Absender stehen, damit die Zeile nicht leer ist.
    // „Von: " gehoert MIT in den Uebersetzungsschluessel — im Englischen steht dort
    // „From: ", und ein festes Praefix im Code waere nicht uebersetzbar.
    const absender = quelle || weiter;
    const von = absender ? translate('From: %1').replace('%1', absender) : '';
    const zeilen = (Array.isArray(p.items) ? p.items : []).map(it => {
      const wann = mailWhenText(it.due, it.time, it.end);
      // Kein Abzeichen fuer die Art: Aufgaben und Termine stehen in getrennten
      // Bereichen, und die Klappzeile darueber nennt sie beim Namen. „Termin" an
      // einer Zeile in der Agenda sagt nichts, was nicht schon dasteht.
      // Verdichtung wie bei den Aufgaben: Wiederholung und „ganztaegig" stecken
      // zusaetzlich in EINEM kombinierten Chip (.meta-combined). Stufe 1 blendet die
      // Einzel-Chips (.meta-split) aus und den kombinierten ein — dieselben Klassen,
      // dieselben Regeln, gemessen von layoutRowMeta().
      const reiheKurz = calSeriesText(it.recurrence);
      const kombiniert = (reiheKurz && it.allDay === true)
        ? `<span class="badge attr meta-combined" title="${escapeHtml([reiheKurz, translate('all day')].join(' · '))}">` +
            `<i class="fa-light fa-repeat"></i><i class="fa-light fa-sun"></i>` +
          `</span>`
        : '';
      const chips =
        (wann ? `<span class="badge due-badge"><i class="fa-light fa-calendar due-icon"></i><span class="due-text">${escapeHtml(wann)}</span></span>` : '') +
        // Reihe: der Vorschlag wird zu mehreren Terminen. Kurz im Chip (Takt bzw.
        // Anzahl), ausfuehrlich im Titel — sonst sprengt „zweiwoechentlich · bis
        // 03.12.2026" die Zeile.
        (reiheKurz
          ? `<span class="badge attr${kombiniert ? ' meta-split' : ''}" title="${escapeHtml(reiheKurz)}">` +
            `<i class="fa-light fa-repeat"></i>` +
            `<span>${escapeHtml(String(parseInt(it.recurrence.count) || '') || translate('Series'))}</span>` +
            `</span>`
          : '') +
        (it.allDay === true ? `<span class="badge${kombiniert ? ' meta-split' : ''}">${escapeHtml(translate('all day'))}</span>` : '') +
        kombiniert +
        (it.priority && it.priority !== 'normal' ? `<span class="badge ${priorityKey(it.priority)}">${escapeHtml(priorityLabel(it.priority))}</span>` : '');
      // Wisch-Behaelter um die Zeile: links verwerfen, rechts uebernehmen. Die
      // Erkennungsfelder bleiben an der ZEILE — der Klick-Verteiler des Bereichs
      // sucht sie ueber closest('.mail-row').
      // data-id am BEHAELTER ist der Schluessel fuer renderRows: „<Mail>:<Nummer>"
      // ist je Vorschlag eindeutig. Die Erkennungsfelder bleiben zusaetzlich an der
      // Zeile, weil der Klick-Verteiler sie ueber closest('.mail-row') sucht.
      return `<div class="mail-item" data-id="${escapeHtml(String(p.id) + ':' + String(it.i))}">` +
        `<div class="swipe-under"><i class="fa-light fa-trash"></i></div>` +
        `<div class="swipe-under-edit"><i class="fa-light fa-plus"></i></div>` +
        `<div class="mail-row" data-id="${escapeHtml(String(p.id))}" data-i="${escapeHtml(String(it.i))}">` +
        `<div class="mail-row-body">` +
          `<div class="mail-row-title">${escapeHtml(String(it.title || ''))}</div>` +
          (it.info ? `<div class="mail-row-info">${escapeHtml(String(it.info))}</div>` : '') +
        `</div>` +
        // Aufbau wie in der Aufgabenzeile: erst die Merkmale, dann wer zustaendig
        // waere, dann die Knoepfe — alles in EINER Spalte, die layoutRowMeta() bei
        // Platznot als eigene Zeile unter den Inhalt schiebt.
        `<span class="mail-side"><span class="mail-chips">` +
          chips +
          renderAvatarStack(p.userId ? [String(p.userId)] : []) +
        `</span>` +
        `<button class="row-btn" data-mail="drop" aria-label="${translate('Discard')}" title="${translate('Discard')}"><i class="fa-light fa-xmark"></i></button>` +
        `<button class="row-btn accent" data-mail="add" aria-label="${translate('Add')}" title="${translate('Add')}"><i class="fa-light fa-plus"></i></button>` +
        `</span>` +
        `</div>` +
      `</div>`;
    }).join('');
    return `<div class="mail-head" data-key="mailkopf:${escapeHtml(String(p.id))}">${kopf}` +
        `<div class="mail-who">` +
          `<div class="mail-subject">${escapeHtml(titelText)}</div>` +
          `<div class="mail-meta">${escapeHtml(von)}</div>` +
        `</div>` +
        `<button class="row-btn destructive" data-mail="dismiss" data-id="${escapeHtml(String(p.id))}" aria-label="${translate('Discard mail')}" title="${translate('Discard mail')}"><i class="fa-light fa-trash-can"></i></button>` +
      `</div>` +
      zeilen;
  }).join('');

  // renderRows liefert NUR die neu erzeugten Knoten: die behalten ihre Gesten nicht,
  // alle uebrigen schon — samt laufender Wischgeste. Bei unveraendertem Markup kommt
  // false, dann wird gar nicht gebunden (ein zweiter Satz Handler wuerde jede
  // Wischgeste doppelt ausfuehren).
  const frische = renderRows(area, umschalter + karten);
  if (frische !== false) bindMailRows(frische);

  // Messen wie am Ende von renderTodos: erst nach dem Zeichnen steht die Breite.
  ensureTodoMetaObserver();
  requestAnimationFrame(layoutTodoMeta);
}

/**
 * Auf- und Zuklappen des Vorschlagsbands gleiten lassen.
 *
 * „height: auto" ist nicht animierbar, deshalb misst das Skript: Aufklappen
 * zeichnet ERST neu und gleitet dann von der alten zur neuen Hoehe (der Inhalt
 * wird aufgedeckt). Zuklappen schrumpft ERST auf die Chip-Hoehe und zeichnet
 * dann — sonst verschwaenden die Zeilen schlagartig, bevor sich die Flaeche
 * schliesst. Bei reduzierter Bewegung schaltet es ohne Uebergang um.
 */
function mailToggleAnimieren(area, umschalten, schliesst) {
  // Waehrend einer laufenden Animation hart umschalten: zwei ueberlappende
  // Hoehen-Uebergaenge wuerden sich die Inline-Stile zerschreiben.
  if (!area || area._mailAnim === true || mbReduceMotion()) { umschalten(); return; }
  const von = area.offsetHeight;
  let getan = false;
  let notAus = 0;
  const gleiten = (nach, danach) => {
    if (nach === von) { if (danach) danach(); return; }
    area._mailAnim = true;
    area.style.height = von + 'px';
    area.style.overflow = 'hidden';
    void area.offsetHeight; // Reflow — erst dadurch wird die Starthoehe wirksam
    area.style.transition = 'height .28s ease';
    area.style.height = nach + 'px';
    const fertig = (e) => {
      // transitionend blubbert (Chip, Chevron) und feuert je Eigenschaft — nur
      // die eigene Hoehe zaehlt. Ohne e kommt der Aufruf vom Sicherheitsnetz.
      if (e && (e.target !== area || e.propertyName !== 'height')) return;
      if (getan) return;
      getan = true;
      clearTimeout(notAus);
      area.removeEventListener('transitionend', fertig);
      area._mailAnim = false;
      if (danach) danach();
      area.style.height = '';
      area.style.overflow = '';
      area.style.transition = '';
    };
    area.addEventListener('transitionend', fertig);
    // Sicherheitsnetz: transitionend kann ausbleiben (Tab im Hintergrund).
    notAus = setTimeout(fertig, 400);
  };
  if (schliesst) {
    const chip = area.querySelector('.section-toggle');
    gleiten(chip ? chip.offsetHeight : 0, umschalten);
  } else {
    umschalten();
    gleiten(area.offsetHeight, null);
  }
}

/** Eintrag lokal entfernen und neu zeichnen — die Liste kommt sonst erst beim naechsten Laden. */
function mailForget(id, index) {
  mailProposals = mailProposals.map(p => {
    if (String(p.id) !== String(id)) return p;
    return Object.assign({}, p, { items: (p.items || []).filter(it => String(it.i) !== String(index)) });
  }).filter(p => (p.items || []).length > 0);
  renderMailAi('task');
  renderMailAi('event');
}

function initMailAi() {
  ['mailAiArea', 'calAiArea'].forEach(id => mailAiBind(document.getElementById(id)));
}

function mailAiBind(area) {
  if (!area) return;
  area.addEventListener('click', (e) => {
    const knopf = e.target.closest('[data-mail]');
    if (!knopf) return;
    const art = knopf.getAttribute('data-mail');
    // Der Umschalter gehoert dem Bereich, in dem er sitzt — die Aufgaben duerfen
    // offen stehen, waehrend die Termine eingeklappt bleiben.
    if (art === 'toggle') {
      const sorte = area.id === 'calAiArea' ? 'event' : 'task';
      const schliesst = mailOpen[sorte] === true;
      mailToggleAnimieren(area, () => {
        mailOpen[sorte] = !mailOpen[sorte];
        renderMailAi(sorte);
      }, schliesst);
      return;
    }
    if (art === 'dismiss') {
      const id = knopf.getAttribute('data-id') || '';
      aiPost('/mail/proposals', { action: 'dismiss', id: id });
      mailProposals = mailProposals.filter(p => String(p.id) !== String(id));
      renderMailAi('task');
      renderMailAi('event');
      return;
    }
    const zeile = knopf.closest('.mail-row');
    if (!zeile) return;
    const id = zeile.getAttribute('data-id') || '';
    const i = zeile.getAttribute('data-i') || '';
    if (art === 'drop') {
      mailDrop(id, i);
      return;
    }
    if (art !== 'add') return;
    mailAccept(id, i);
  });
}

/** Vorschlag verwerfen — derselbe Weg fuer den ✕-Knopf und das Wischen nach links. */
function mailDrop(id, i) {
  aiPost('/mail/proposals', { action: 'taken', id: id, i: Number(i) });
  mailForget(id, i);
}

/**
 * Vorschlag uebernehmen — fuer den +-Knopf und das Wischen nach rechts.
 *
 * Angelegt wird NICHT sofort: der Vorschlag kommt von einem Sprachmodell und ist
 * ein Entwurf. Der uebliche Dialog oeffnet vorbelegt, damit vor dem Speichern noch
 * etwas geaendert werden kann. Erst nach dem Speichern gilt er als erledigt.
 */
function mailAccept(id, i) {
    const vorschlag = mailProposals.find(p => String(p.id) === String(id));
    const eintrag = vorschlag && (vorschlag.items || []).find(it => String(it.i) === String(i));
    if (!eintrag) return;

    // NICHT direkt anlegen: der Vorschlag kommt von einem Sprachmodell und ist ein
    // Entwurf. Der uebliche Dialog oeffnet vorbelegt, damit vor dem Speichern noch
    // etwas geaendert werden kann. Erst nach dem Speichern gilt er als erledigt.
    if (eintrag.kind === 'event') {
      // Mitglied der Empfaengeradresse mitgeben — dieselbe Zuordnung wie bei Aufgaben.
      openCalEditor(Object.assign({}, eintrag, { userId: String(vorschlag.userId || '') }), { id: id, i: i });
      return;
    }
    const ziel = selectedTodoID();
    if (!ziel) { showToast(translate('No ToDo list found')); return; }
    // Zuordnung aus der Empfaengeradresse; ohne Treffer der Standardnutzer der Kachel.
    const wem = String(vorschlag.userId || '') || currentUserID();
    const entwurf = Object.assign({
      id: null,
      title: String(eintrag.title || ''),
      info: eintrag.info ? String(eintrag.info) : '',
      priority: eintrag.priority || 'normal',
      quantity: 0,
      assignedTo: wem ? [wem] : [],
      recurrence: 'none',
      notification: false
    }, mailDueFields(eintrag.due, eintrag.allDay === true ? null : eintrag.time));
    openTodoEditor(ziel, entwurf);
    // Titel richtigstellen: openTodoEditor haelt jedes uebergebene Objekt fuer
    // eine Bearbeitung, hier ist es ein Entwurf.
    document.getElementById('todoOverlayTitle').textContent = translate('New task');
    todoCtx.proposal = { id: id, i: i };
}

/**
 * Wischgesten der Vorschlagszeilen — dieselbe Geste wie in den Listen: links
 * verwerfen, rechts uebernehmen. Der Vorschlag ist dabei nur ein Zettel: Wischen
 * nach links loescht keinen Termin und keine Aufgabe, es raeumt den Zettel weg.
 * Deshalb ohne Rueckfrage, anders als beim Loeschen eines echten Termins.
 */
function bindMailRows(knoten) {
  knoten.forEach(behaelter => {
    if (!behaelter.classList || !behaelter.classList.contains('mail-item')) return;  // Kopf/Umschalter
    const zeile = behaelter.querySelector('.mail-row');
    if (!zeile) return;
    const id = zeile.getAttribute('data-id') || '';
    const i  = zeile.getAttribute('data-i') || '';
    bindCardSwipe(
      behaelter,
      '.mail-row',
      () => mailDrop(id, i),
      () => {
        // Nach rechts oeffnet den Dialog: die Zeile bleibt stehen, bis wirklich
        // gespeichert ist — sonst waere sie weg und der Entwurf noch offen.
        zeile.style.transform = '';
        behaelter.classList.remove('dragging-right');
        mailAccept(id, i);
      }
    );
  });
}

// ── Kalenderbereich (OpenCalendar) ───────────────────────────────────────────
// Gelesen wird ausschliesslich; die gesamte Anbieter-Synchronisation bleibt im
// Store-Modul OpenCalendar. Ist es nicht installiert oder kein Kalender
// eingerichtet, liefert das Gateway eine leere Liste und der Tab verschwindet.
let calCalendars = [];
let calEvents = [];
let calLoading = false;
let calError = '';
const CAL_RANGES = [7, 30, 90];

function calAvailable() {
  if (window.__SYMDO__) return true;
  return !!store.gatewayAvailable;
}

function calSelectedRange() {
  const v = parseInt(ls.get('symdo.calRange') || '30', 10);
  return CAL_RANGES.includes(v) ? v : 30;
}

function calSelectedID() {
  const gespeichert = String(ls.get('symdo.calID') || '');
  if (calCalendars.some(c => String(c.id) === gespeichert)) return gespeichert;
  return calCalendars.length ? String(calCalendars[0].id) : '';
}

/** Kalenderliste holen. Erst danach steht fest, ob der Tab ueberhaupt erscheint. */
function loadCalendars() {
  if (!calAvailable()) {
    if (calCalendars.length) { calCalendars = []; calEvents = []; renderCalendar(); applyTabVisibility(); }
    return;
  }
  aiPost('/calendar', { action: 'calendars' }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true || !Array.isArray(j.calendars)) return;
    const vorher = calCalendars.length;
    calCalendars = j.calendars;
    // Keine Kalender mehr: alte Termine MUESSEN weg. Ein Bereich, der Termine einer
    // verschwundenen Quelle zeigt, behauptet etwas Falsches.
    if (calCalendars.length === 0) calEvents = [];
    // Sichtbarkeit haengt an der Anzahl — nur neu anwenden, wenn sie sich aendert.
    if ((vorher > 0) !== (calCalendars.length > 0)) applyTabVisibility();
    // Die Uebersichts-Kachel braucht die heutige Zahl unabhaengig davon, ob der
    // Kalender-Bereich offen ist.
    loadDashEvents();
    if (activeTab === 'calendar') loadCalendarEvents();
    else renderCalendar();
  }).catch(() => {});
}

/**
 * Anzahl der heutigen Termine fuer die Uebersichts-Kachel — eigener, kleiner Abruf
 * ueber ALLE Kalender und nur den heutigen Tag. Der Kalender-Bereich laedt seine
 * Termine erst beim Oeffnen, fuer den gewaehlten Kalender und ueber Wochen; beides
 * passt hier nicht.
 *
 * `null` heisst „noch nicht bekannt" — die Kachel erscheint erst mit einer Zahl,
 * eine vorschnelle 0 waere eine Falschaussage.
 */
let dashEventsToday = null;
let dashEvents = [];          // heute und morgen, nach Beginn sortiert

function loadDashEvents() {
  if (!calAvailable() || calCalendars.length === 0) {
    if (dashEventsToday !== null || dashEvents.length) {
      dashEventsToday = null;
      dashEvents = [];
      renderDashboard();
    }
    return;
  }
  const von = Math.floor(new Date(new Date().setHours(0, 0, 0, 0)).getTime() / 1000);
  const grenze = von + 86400;                 // Beginn von morgen
  const bis = von + 2 * 86400;                // Ende von morgen
  aiPost('/calendar', { action: 'events', from: von, to: bis, ids: [] }).then(r => {
    const j = r && r.json;
    if (!j || j.ok !== true || !Array.isArray(j.events)) return;
    // Dieselbe Regel wie im Briefing: Ganztaegige Termine gelten fuer jeden Tag, den
    // sie ECHT schneiden (das Ende ist ausschliesslich, ein Eintrag der um 00:00 endet
    // gehoert zum Vortag); Termine mit Uhrzeit gehoeren zu dem Tag, an dem sie
    // beginnen. Sonst zaehlte ein mehrtaegiger Block jeden Tag mit.
    const tagVon = (e) => {
      const start = Number(e.start) || 0;
      const ende = Number(e.end) || 0;
      if (e.allDay === true) {
        if (ende > von && start < grenze) return 'today';
        if (ende > grenze && start < bis) return 'tomorrow';
        return '';
      }
      if (start >= von && start < grenze) return 'today';
      if (start >= grenze && start < bis) return 'tomorrow';
      return '';
    };
    dashEvents = j.events
      .map(e => ({
        tag: tagVon(e),
        start: Number(e.start) || 0,
        allDay: e.allDay === true,
        title: String(e.title || ''),
        // Die Zuordnung kommt aus der eigenen Ablage des Gateways und ist das, was
        // die Avatare in der Zeile zeigen.
        members: Array.isArray(e.members) ? e.members : []
      }))
      .filter(e => e.tag !== '')
      .sort((a, b) => a.start - b.start);
    dashEventsToday = dashEvents.filter(e => e.tag === 'today').length;
    renderDashboard();
  }).catch(() => {});
}

function loadCalendarEvents() {
  if (calLoading || !calAvailable() || calCalendars.length === 0) return;
  const id = calSelectedID();
  const von = Math.floor(new Date(new Date().setHours(0, 0, 0, 0)).getTime() / 1000);
  calLoading = true;
  aiPost('/calendar', {
    action: 'events', from: von, to: von + calSelectedRange() * 86400,
    ids: id ? [Number(id)] : []
  }).then(r => {
    calLoading = false;
    const j = r && r.json;
    if (!j || j.ok !== true || !Array.isArray(j.events)) { calError = translate('Could not load appointments.'); renderCalendar(); return; }
    calError = '';
    calEvents = j.events;
    calTruncated = j.truncated === true;
    renderCalendar();
  }).catch(() => {
    // Auch der Netzwerkfehler braucht den Hinweis — sonst steht still ein alter
    // Stand da, als waere alles gut.
    calLoading = false;
    calError = translate('Could not load appointments.');
    renderCalendar();
  });
}
let calTruncated = false;

/** Tagesschlüssel in der Zeitzone des Geraets — nicht UTC, sonst rutschen Termine. */
function calDayKey(ts) {
  const d = new Date(ts * 1000);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function calDayLabel(ts) {
  const d = new Date(ts * 1000);
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const morgen = new Date(heute.getTime() + 86400000);
  const tag = new Date(d); tag.setHours(0, 0, 0, 0);
  if (tag.getTime() === heute.getTime()) return translate('Today');
  if (tag.getTime() === morgen.getTime()) return translate('Tomorrow');
  const wochentage = [translate('Sun'), translate('Mon'), translate('Tue'), translate('Wed'), translate('Thu'), translate('Fri'), translate('Sat')];
  return wochentage[d.getDay()];
}

function calDateLabel(ts) {
  const d = new Date(ts * 1000);
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
}

function renderCalendar() {
  const bereich = document.getElementById('calArea');
  if (!bereich) return;
  const titel = document.getElementById('calTitle');
  const schalter = document.getElementById('calSwitcher');
  const spanne = document.getElementById('calRange');
  const status = document.getElementById('calStatus');

  const gewaehlt = calSelectedID();
  const aktuell = calCalendars.find(c => String(c.id) === gewaehlt) || null;
  if (titel) titel.textContent = aktuell ? aktuell.name : translate('Calendar');

  // Umschalter nur bei mehreren Kalendern — sonst ein Feld ohne Wahl.
  if (schalter) {
    if (calCalendars.length > 1) {
      schalter.style.display = '';
      schalter.innerHTML = calCalendars.map(c =>
        `<option value="${escapeHtml(String(c.id))}"${String(c.id) === gewaehlt ? ' selected' : ''}>${escapeHtml(c.name)}</option>`).join('');
      if (titel) titel.style.display = 'none';
    } else {
      schalter.style.display = 'none';
      if (titel) titel.style.display = '';
    }
  }
  if (spanne && spanne.options.length !== CAL_RANGES.length) {
    spanne.innerHTML = CAL_RANGES.map(t =>
      `<option value="${t}"${t === calSelectedRange() ? ' selected' : ''}>${translate('%1 days').replace('%1', String(t))}</option>`).join('');
  }

  // Synchronisationsfehler des Kalenders sichtbar machen: eine Quelle, die still
  // nicht mehr aktualisiert, ist gefaehrlicher als eine sichtbare Meldung.
  const meldungen = [];
  if (calError !== '') meldungen.push(calError);
  if (aktuell && aktuell.lastError) meldungen.push(aktuell.lastError);
  if (aktuell && !aktuell.lastSync) meldungen.push(translate('This calendar has not been synchronised yet.'));
  if (calTruncated) meldungen.push(translate('Only the first appointments are shown.'));
  if (status) {
    status.style.display = meldungen.length ? '' : 'none';
    status.textContent = meldungen.join(' · ');
  }

  // Erkannte Termine stehen NICHT in der Agenda, sondern als Vorschlagsband
  // darueber — wie die erkannten Aufgaben ueber der Aufgabenliste. Erst nach dem
  // Uebernehmen sind sie echte Kalendereintraege und erscheinen unten.
  renderMailAi('event');

  // Avatar-Pille zeichnen, bevor gefiltert wird: der Filter kommt aus ihr.
  // Gefiltert wird nur mit sichtbarer Leiste — die (bereichsuebergreifende)
  // Auswahl darf ohne Bedienelement nicht unsichtbar weiterwirken.
  renderCalMembers();
  let alle = calEvents.slice();
  const gefiltert = rowButtonFlags().showMemberBar !== false
    && store.users.length > 0 && memberFilterIds.size > 0;
  if (gefiltert) {
    alle = alle.filter(e => Array.isArray(e.members) && e.members.some(mid => memberFilterIds.has(mid)));
  }

  if (alle.length === 0) {
    const meldung = gefiltert
      ? translate('No matches for this filter.')
      : translate('No appointments in this period');
    // Auch der Leerzustand ueber renderRows, damit derselbe Knotenabgleich gilt und
    // nicht zwei Renderwege denselben Behaelter mit unterschiedlichen Annahmen fuellen.
    renderRows(bereich, `<div class="empty-state" data-key="leer"><i class="fa-light fa-calendar-days"></i>${meldung}</div>`);
    return;
  }

  const farben = {};
  calCalendars.forEach(c => { farben[String(c.id)] = c.color || ''; });
  const tage = [];
  const nachTag = {};
  alle.forEach(e => {
    const k = calDayKey(e.start);
    if (!nachTag[k]) { nachTag[k] = []; tage.push(k); }
    nachTag[k].push(e);
  });
  const heuteKey = calDayKey(Math.floor(Date.now() / 1000));

  // Bedienbar ist nur, was der Anbieter auch schreiben laesst: in einem
  // abonnierten Fremdkalender waere jede Wischgeste ein Versprechen, das der
  // Anbieter danach bricht. Bei Serien-Vorkommen entscheiden die Flags AM
  // TERMIN (canUpdateOccurrence/canDeleteOccurrence aus dem Gateway) — nicht
  // der Kalenderstatus, der dazu nichts Belastbares sagt.
  const schreibbar = {};
  calCalendars.forEach(c => { schreibbar[String(c.id)] = c.canWrite === true; });
  const knopfSchalter = rowButtonFlags();
  const zeigeBearbeiten = knopfSchalter.showEditButton === true;
  const zeigeLoeschen   = knopfSchalter.showDeleteButton === true;
  // Die Info-Abzeichen folgen denselben appweiten Schaltern wie bei den Aufgaben —
  // wer die Glocke dort nicht sehen will, will sie hier auch nicht.
  const zeigeWiederholung = knopfSchalter.showRecurrenceBadge !== false;
  const zeigeGlocke       = knopfSchalter.showNotificationBadge !== false;

  const frische = renderRows(bereich, tage.map(k => {
    const liste = nachTag[k];
    const ts = liste[0].start;
    const zeilen = liste.map(e => {
      const farbe = farben[String(e.calendarID)] || '';
      const wann = e.allDay
        ? translate('all day')
        : new Date(e.start * 1000).toTimeString().slice(0, 5);
      const unten = [e.location, e.info].filter(Boolean).join(' · ');
      // Zugewiesene Mitglieder als Avatare, wie in der Aufgabenzeile.
      const wer = Array.isArray(e.members) && e.members.length ? renderAvatarStack(e.members) : '';
      // Wiederholung und Erinnerung als Abzeichen wie in der Aufgabenzeile
      // (.badge.attr, dieselben Symbole). Beim Termin sagt das Wiederholungs-
      // Abzeichen bewusst „Teil einer Serie" und nicht den Takt: den kennt nur der
      // Serienkopf, das einzelne Vorkommen traegt die Regel nicht.
      const vorlauf = Number(e.reminder);
      const abzeichen =
        (zeigeWiederholung && e.recurring === true
          ? `<span class="badge attr" title="${escapeHtml(translate('Part of a series'))}"><i class="fa-light fa-repeat"></i></span>` : '') +
        (zeigeGlocke && Number.isFinite(vorlauf) && vorlauf >= 0
          ? `<span class="badge attr" title="${escapeHtml(calReminderTitle(vorlauf))}"><i class="fa-light fa-bell"></i></span>` : '');
      const serie = e.recurring === true;
