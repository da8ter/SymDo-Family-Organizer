<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Der Icon-Satz von Symcon. OHNE ihn bleiben alle <i> leere Kästen — die
     Linien hätten kein Symbol, der Fußweg keins, das Kind keins.

     Und es MUSS ein vollständiges Dokument sein, kein Fragment: wo ein Fragment
     eingehängt wird, entscheidet der Wirt, und ein über innerHTML eingesetzter
     script-Verweis läuft gar nicht. Genau daran hing es hier — die Kachel war
     ein Fragment und blieb deshalb ohne jedes Symbol. Die übrigen Kacheln sind
     seit jeher ganze Dokumente mit dem Verweis im Kopf. -->
<script src="/icons.js"></script>
<style>
/* Symcon injiziert --card-color, --content-color und --accent-color je nach
   Visu-Design. Alles hier leitet sich daraus ab — keine Fremd-Assets.
   Gerüst und Scrollrezept sind aus den übrigen SymDo-Kacheln übernommen:
   dieselben Fallen, dieselbe Lösung. */
:root {
  --bg: var(--card-color, #2b2c30);
  --text: var(--content-color, #ffffff);
  --akzent: var(--accent-color, #00cdab);
  --zeile: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --dezent: color-mix(in srgb, var(--content-color) 55%, transparent);
  --rand: color-mix(in srgb, var(--content-color) 12%, transparent);
  --warn: #E53935;
  /* Die Ränder, die Symcon der Kachel mitgibt — siehe den Leser unten. */
  --sym-mt: 0px;
  --sym-ms: 0px;
  --sym-mb: 0px;
  /* Der Scrollbalken gehoert MITTIG IN DEN KACHELRAND, nicht innen an den
     Inhalt (Hausrezept der grossen Kacheln). Dafuer wird der rechte Rand
     geteilt: `--sb-pad` liegt zweimal an — einmal am Rahmen, einmal am
     scrollenden Bereich —, dazwischen die sechs Pixel des Balkens. Zusammen
     ergibt das wieder genau `--sym-ms`, und der Balken sitzt in dessen Mitte. */
  --sbw: 6px;
  --sb-pad: max(0px, calc((var(--sym-ms) - var(--sbw)) / 2));
}
/* Die Kachel haelt das Rad bei sich. Ohne das reicht der Browser eine
   Radbewegung, die hier nichts mehr zu scrollen findet, an die Seite darueber
   weiter — und die ganze Visualisierung rutscht weg, obwohl der Zeiger ueber
   der Kachel steht. `overscroll-behavior` ist genau dafuer da. */
html { height: 100%; margin: 0; padding: 0; display: flex; flex-direction: column;
       overscroll-behavior: none; }
body {
  margin: 0 !important; padding: 0 !important;
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  overscroll-behavior: none;
  background: transparent; color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
}
/* Die Polsterung trägt die Ränder von Symcon MIT: ohne sie schiebt sich der
   Inhalt oben unter die Leiste der Visualisierung. `env(safe-area-inset-top)`
   steht daneben für das iPhone mit Aussparung — es gilt, was größer ist. */
#wurzel {
  flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  box-sizing: border-box;
  /* Seitlich GENAU der Rand von Symcon, ohne eigenen Zuschlag: der eigene kam
     obendrauf und ließ die Kachel viel zu schmal wirken. Den Innenabstand
     tragen die Karten selbst. So halten es die übrigen Kacheln auch. */
  padding: calc(max(var(--sym-mt), env(safe-area-inset-top, 0px)) + 8px)
           var(--sb-pad)
           calc(var(--sym-mb) + 6px)
           var(--sym-ms);
}

/* Kopfzeile: Bild und Name links, Umschalter rechts — und bei zu langem Namen
   rutscht der Umschalter in die nächste Zeile, statt den Namen zu kürzen. */
/* Kopfzeile und Quellenangabe scrollen nicht — sie haengen direkt am Rahmen
   und muessten sonst um `--sb-pad` plus Balkenbreite in den Randstreifen
   hineinragen. Der Nachschlag holt den vollen Rand zurueck. */
.kopf, .quelle { margin-right: calc(var(--sb-pad) + var(--sbw)); }
.kopf { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; }
.kopf .umschalter { margin-left: auto; flex: 0 0 auto; }
/* Der zweite Schalter haengt sich an den ersten, statt sich mit `auto` von ihm
   wegzudruecken. */
.kopf .umschalter + .umschalter { margin-left: 6px; }
.kopf .wem { flex: 0 1 auto; min-width: 0; margin: 0; }
/* Wem gehört das? Bild und Name über den Karten des Kindes.
   Maße wörtlich aus der Ämtchen-Kachel übernommen — dieselbe Familie soll in
   jeder Kachel gleich groß aussehen. */
.wem { display: flex; align-items: center; gap: 8px; padding: 0 4px; margin: 2px 0 6px; }
.wem .gesicht {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto; overflow: hidden;
  background: color-mix(in srgb, var(--akzent) 18%, var(--bg));
  border: 2px solid var(--akzent);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;
}
.wem .gesicht img { width: 100%; height: 100%; object-fit: cover; }
.wem .name {
  flex: 1 1 auto; min-width: 0; font-size: clamp(13px, 4vmin, 16px); font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.umschalter { display: flex; flex: 0 0 auto; border-radius: 999px; overflow: hidden; background: var(--zeile); }
.umschalter button {
  border: 0; padding: 4px 12px; cursor: pointer; background: transparent;
  color: var(--dezent); font-size: 11px; font-weight: 700;
}
.umschalter button.an { background: var(--akzent); color: #fff; }

.liste {
  flex: 1 1 auto; min-height: 0;
  /* `scroll`, nicht `auto`: der Streifen ist immer reserviert, der rechte
     Abstand springt also nicht, sobald der Inhalt lang genug wird. Die leere
     Spur ist durchsichtig, der Griff erscheint nur bei Bedarf. */
  overflow-y: scroll;
  display: flex; flex-direction: column; gap: 8px;
  /* Am Ende der Liste hoert es auf — die Bewegung wandert nicht weiter nach
     draussen in die Visualisierung. */
  overscroll-behavior: contain;
  /* Die zweite Haelfte des rechten Randes. Erst damit sitzt der Balken mittig
     im Kachelrand und der Inhalt endet buendig wie links. */
  padding-right: var(--sb-pad);
}
/* Und die Karten duerfen NICHT schrumpfen. Als Flex-Kinder tun sie das von
   Haus aus: sie pressen sich in die Liste hinein, statt sie ueberlaufen zu
   lassen — und weil jede Karte `overflow: hidden` traegt, wurde der Rest
   einfach abgeschnitten. Gemessen: scrollHeight der Liste war GLEICH ihrer
   Hoehe (467 Pixel), obwohl die Karte sichtbar laenger war. Es gab also nichts
   zu scrollen, nur etwas zu sehen, das fehlte. */
.liste > * { flex: 0 0 auto; }
/* Hausrezept für Scrollleisten: schmal, Griff in der Akzentfarbe. */
.liste::-webkit-scrollbar { width: var(--sbw); height: var(--sbw); }
.liste::-webkit-scrollbar-track { background: transparent; }
.liste::-webkit-scrollbar-thumb {
  background: color-mix(in srgb, var(--akzent) 70%, transparent);
  border-radius: 999px;
}
/* Standard und Pseudoelemente schliessen sich aus: ist `scrollbar-width`
   gesetzt, uebergeht WebKit die Pseudoelemente und malt elf Pixel statt sechs.
   Deshalb der Riegel — nur wo es die Pseudoelemente NICHT gibt. */
@supports not selector(::-webkit-scrollbar) {
  .liste {
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--akzent) 70%, transparent) transparent;
  }
}

.karte { background: var(--zeile); border-radius: 12px; padding: 8px 10px; overflow: hidden; }
.karte .titel {
  display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px;
  font-size: 12px; font-weight: 700;
}
.karte .titel .neben { font-weight: 500; font-size: 11px; color: var(--dezent); }
.veraltet { color: var(--warn); font-size: 10px; font-weight: 700; }

/* ── Abfahrtstafel ─────────────────────────────────────────────────────── */
/* Die Spalten gehoeren der KARTE, nicht der einzelnen Zeile.
   Nur so stehen Abfahrtszeit, Verspaetung und Steig untereinander: eine
   `auto`-Spalte richtet sich nach dem breitesten Inhalt IHRES Rasters, und
   solange jede Zeile ihr eigenes Raster war, war das jedes Mal ein anderes.
   Die Zeilen uebernehmen die Spalten als Untergitter (`subgrid`) und bleiben
   trotzdem eigene Kaesten — mit Trennlinie, Durchstreichung und Titel-Hinweis.

   minmax(0,1fr) beim Ziel, nicht 1fr: eine Grid-Spalte ist von Haus aus
   mindestens so breit wie ihr laengstes Wort — sonst waechst die Karte ueber
   die Kachel hinaus, statt den Zielnamen zu kuerzen. */
.abfahrten {
  display: grid;
  grid-template-columns: 20px 54px minmax(0, 1fr) auto auto auto;
  align-items: center; column-gap: 8px;
}
.abfahrt {
  display: grid; grid-template-columns: subgrid; grid-column: 1 / -1;
  align-items: center; padding: 4px 0; border-top: 1px solid var(--rand);
}
/* Kennt der Browser kein Untergitter, bleibt es beim alten Nebeneinander:
   dann steht es nicht in Spalten, aber es steht. */
@supports not (grid-template-columns: subgrid) {
  .abfahrten { display: block; }
  .abfahrt {
    grid-template-columns: 20px 54px minmax(0, 1fr) auto auto auto;
    gap: 8px;
  }
}
.abfahrt:first-of-type { border-top: 0; }
/* Das Fahrzeug traegt die Akzentfarbe: es ist das einzige Zeichen in der Zeile,
   das die Art der Fahrt nennt — Bus, Bahn, S-Bahn —, und in Grau ging es neben
   der fetten Liniennummer unter. */
/* Die Farbe setzt das Markup je Zeile (Verkehrsmittel); hier steht nur der
   Rueckfall und die Ausrichtung. */
.abfahrt .sym { color: var(--akzent); text-align: center; }
.abfahrt .linie { font-weight: 800; font-size: 12px; }
.abfahrt .ziel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Der Pfeil sagt „dorthin" und gehoert zum Ziel — aber nicht zu seinem Text:
   als inline-block laeuft der Streichstrich einer entfallenen Fahrt nicht durch
   ihn hindurch. Kleiner und zurueckhaltend, damit er die Zeile fuehrt statt sie
   zu beherrschen. */
.abfahrt .ziel .pfeil { display: inline-block; color: var(--dezent); font-size: 10px; margin-right: 5px; }
.abfahrt .wann { text-align: right; font-weight: 700; white-space: nowrap; }
.abfahrt .spaet {
  text-align: right; white-space: nowrap;
  color: var(--warn); font-size: 11px; font-weight: 700;
}
.abfahrt .steig {
  text-align: right; white-space: nowrap;
  color: var(--dezent); font-weight: 500; font-size: 10px;
}
/* Was mit dem eigenen Fußweg nicht mehr zu schaffen ist, tritt zurück —
   weggelassen wird es nicht: „der wäre gegangen" ist auch eine Auskunft. */
.abfahrt.weg { opacity: .45; }
.abfahrt.entfaellt .linie, .abfahrt.entfaellt .ziel { text-decoration: line-through; }

/* ── Streckenachse ─────────────────────────────────────────────────────── */
/* Die Schiene: eine Verbindung je Bildbreite, mit Einrasten. */
.fahrten { overscroll-behavior: contain; }
.fahrten {
  display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none;
}
.fahrten::-webkit-scrollbar { display: none; }
.fahrt { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; }
/* Die Punkte: mittig, der aktuelle in der Akzentfarbe. */
.punkte { display: flex; justify-content: center; gap: 12px; margin-top: 6px; }
/* Die Punkte sind auch der Mausweg zur naechsten Verbindung — dafuer brauchen
   sie eine groessere Trefferflaeche als ihre fuenf Pixel: der Punkt ist das,
   was man sieht, das Kaestchen drumherum das, was man trifft. */
.punkte span {
  width: 5px; height: 5px; border-radius: 50%;
  background: color-mix(in srgb, var(--content-color) 25%, transparent);
  cursor: pointer; box-sizing: content-box; padding: 5px; margin: -5px;
  background-clip: content-box;
}
/* background-COLOR, nicht die Kurzform: `background:` setzt `background-clip`
   auf seinen Anfangswert zurueck, und aus dem Punkt wuerde die ganze
   Trefferflaeche — ein Klecks von fuenfzehn Pixeln. Genau so gesehen. */
.punkte span.an { background-color: var(--akzent); }
.fahrt .zeilen { display: flex; align-items: baseline; gap: 6px; font-size: 11px; margin-bottom: 3px; }
.fahrt .zeilen .stark { font-weight: 800; font-size: 12px; }
.fahrt .zeilen .grund { color: var(--dezent); }
/* Der Balken bildet die Tour SCHEMATISCH ab, nicht nach Dauer.
   Vorher waren die Stücke breit nach Minuten — dabei blieben dem Fußweg 54
   Pixel, von denen Symbol und Polsterung 39 fraßen, und „4 min" wurde
   abgeschnitten. Jetzt bekommen Fußweg und Wartezeit genau die Breite, die ihr
   Inhalt braucht; die Fahrten teilen sich den Rest zu gleichen Teilen. Damit
   ist jede Angabe lesbar, und die Reihenfolge der Tour bleibt erhalten — nur
   die Länge sagt nichts mehr über die Dauer. Die steht in den Stücken. */
.balken { position: relative; display: flex; height: 26px; border-radius: 13px; overflow: hidden; background: var(--rand); }
.stueck {
  box-sizing: border-box;
  display: flex; align-items: center; gap: 4px; overflow: hidden;
  padding: 0 8px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap;
  flex: 0 0 auto;               /* Fußweg und Warten: so breit wie ihr Inhalt */
}
/* Die Fahrten teilen sich den Rest — im Verhältnis ihrer Fahrzeit. Das
   flex-grow je Stück setzt das Markup (die Sekunden). */
.stueck.ride { flex: 1 1 0; min-width: 0; }
/* Wird es eng, fällt zuerst das Symbol, dann die Fahrzeit. Die Liniennummer
   bleibt: sie ist die Auskunft, alles andere ist Beiwerk.
   WER zu eng ist, entscheidet eine Messung je Stück (engePruefen) und keine
   feste Schwelle: „S1 · 13 min" braucht 103 Pixel, „RE12 · 40 min" aber 121 —
   eine Schwelle für beide nähme einem von ihnen das Symbol grundlos weg. */
.stueck.ohne-symbol > svg, .stueck.ohne-symbol > i { display: none; }
.stueck.ohne-zeit .zeit { display: none; }
.stueck.ride { background: var(--akzent); }
/* Die Wartezeit ist weder Fahren noch Laufen: neutral gefüllt, ohne Farbe. Sie
   hat erst seit dem Warte-Abschnitt ein Stück — vorher endete der Balken zu
   früh und niemand sah, dass am Umstieg gewartet wird. */
.stueck.wait {
  background: color-mix(in srgb, var(--content-color) 14%, transparent);
  color: var(--dezent);
}
/* Der Fußweg ist kein Fahren: blass statt kräftig, damit die Zeitachse auf
   einen Blick sagt, wo man selbst läuft. */
.stueck.walk {
  background: color-mix(in srgb, var(--akzent) 22%, transparent);
  color: var(--text);
}
/* Die Minutenzeile spiegelt den Balken: gleiche Anteile, gleiche Polsterung —
   so sitzt jede Zahl unter ihrem Stück. Abgeschnitten statt umgebrochen, sonst
   verschiebt ein zu langes Wort die ganze Reihe. */
.fahrt .fuss { display: flex; justify-content: space-between; font-size: 10px; color: var(--dezent); margin-top: 2px; }
/* ── Ausfuehrliche Streckenansicht (Zeitachse) ──────────────────────────
   Umschaltbar im Formular: „Kompakt (Balken)" oder „Ausfuehrliche Zeitachse".

   Der Aufbau ist ein GITTER mit drei Zeilen — oben Linie und Umstieg, in der
   Mitte die Schiene, unten Dauer, Haltestellen und Namen. Jeder Teil der Fahrt
   liefert genau drei Kinder, und `grid-auto-flow: column` legt sie
   untereinander in EINE Spalte. Deshalb sitzt jede Beschriftung ueber ihrem
   Stueck, ohne dass irgendetwas gemessen oder nachgerechnet werden muesste —
   drei getrennte Zeilen waeren bei jedem Umbruch verrutscht.
   Die Spaltenbreiten setzt das Markup (`grid-template-columns`): Halte und
   Umstiege so breit wie ihr Inhalt, die Fahrten im Verhaeltnis ihrer Dauer. */
.tl { display: flex; flex-direction: column; gap: 6px; container-type: inline-size; }

.tl-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tl-kopf .seite { min-width: 0; }
.tl-kopf .seite.rechts { text-align: right; }
.tl-kopf .was { font-size: 13px; color: var(--dezent); line-height: 1.2; }
.tl-kopf .uhr { font-size: 34px; font-weight: 800; line-height: 1.15; letter-spacing: -0.5px; }
.tl-kopf .gleich { font-size: 14px; font-weight: 700; color: var(--akzent); }
.tl-kopf .gesamt { font-size: 14px; color: var(--dezent); }

.tl-spur {
  display: grid; grid-auto-flow: column;
  grid-template-rows: auto 20px auto;
  align-items: center; column-gap: 0;
}
.tl-spur > * { min-width: 0; }
/* Jede Zelle richtet ihren Inhalt selbst aus — auf das Schrumpfen eines
   inline-flex zu bauen ist eine Wette, ein flex-Behaelter ist eine Ansage.
   Im ersten Prueflauf lief die Liniennummer ueber die ganze Spaltenbreite. */
.tl-spur .m { display: flex; align-items: center; }
.tl-spur .o.tl-fahrt { display: flex; justify-content: center; }
.tl-spur .bahn { flex: 1 1 auto; }
/* Die Liniennummer darf schrumpfen, aber nicht verschwinden: mit `min-width:0`
   schrumpfte sie in der schmalen Kachel auf NULL Pixel (gemessen) — genau die
   Angabe, auf die es ankommt, war weg. Untergrenze und Auslassungszeichen. */
.tl-spur .marke { flex: 0 1 auto; min-width: 2.8em; text-overflow: ellipsis; }
/* Zeile 1 und 3 duerfen leer sein — dann traegt die Spalte dort nichts bei. */
.tl-spur .o, .tl-spur .u { font-size: 11px; line-height: 1.25; text-align: center; }
.tl-spur .u b { display: block; font-size: 13px; font-weight: 700; color: var(--text); }
.tl-spur .u span, .tl-spur .o span { display: block; color: var(--dezent); }
.tl-spur .o em { display: block; font-style: normal; font-weight: 700; color: var(--text); }

/* Der Halt: ein weisser Punkt AUF der Schiene.
   Die Schiene laeuft durch die Haltespalte hindurch — und das muss sie, denn
   die Spalte ist so breit wie der Haltestellenname (rund 92 Pixel), nicht so
   breit wie der Punkt. Vorher hoerte die Schiene an der Spaltengrenze auf und
   der Punkt schwebte vierzig Pixel daneben in der Luft.
   Womit die beiden Haelften gemalt werden, sagt das Markup je Halt
   (`--l` und `--r`): auf der Seite einer Fahrt deren Farbe, auf der Seite eines
   Fusswegs die blasse, nach draussen nichts. */
.tl-halt.m { position: relative; padding: 0; }
.tl-halt.m::before, .tl-halt.m::after {
  content: ''; position: absolute; top: 50%; transform: translateY(-50%);
  width: 50%; height: 9px; background: var(--l, transparent);
}
.tl-halt.m::before { left: 0; }
.tl-halt.m::after  { right: 0; background: var(--r, transparent); }
/* Luft zwischen den Beschriftungen. Ohne sie stossen „6 min zu Fuss" und der
   Haltestellenname aneinander und lesen sich als EIN Text — in der laufenden
   Kachel stand da „6 min D-Rosmarinstrasse". Die Polsterung sitzt nur an den
   Beschriftungszellen; die mittlere Reihe bleibt ohne, sonst risse die Schiene
   wieder auf. */
.tl-halt.o, .tl-halt.u { padding: 0 8px; }
.tl-fahrt.o, .tl-fahrt.u, .tl-um.o, .tl-um.u, .tl-weg.o, .tl-weg.u { padding: 0 6px; }
.tl-halt .pkt {
  position: relative; z-index: 1;
  width: 13px; height: 13px; border-radius: 50%; margin: 0 auto;
  background: var(--text); box-sizing: border-box; flex: 0 0 auto;
}
/* Die Spalte eines Halts ist `max-content` — ihre Breite haengt also an diesem
   Deckel. Ohne ihn nahm „D-Unterbacher See / Strandbad Sued" 200 Pixel, und
   fuer die Schiene blieb ein Stummel (im Prueflauf gemessen). Zwei Zeilen,
   danach abgeschnitten; den Deckel zieht die Behaelterabfrage weiter unten
   enger, wenn die Kachel schmal wird. */
.tl-halt.u, .tl-halt.o { max-width: 108px; }
/* Zwei Klassen im Selektor, nicht eine: `.tl-spur .u b` setzt weiter oben
   `display:block` und gewinnt sonst — die Klammer blieb wirkungslos, und
   „D-Unterbacher See / Strandbad Sued" stand ueber drei Zeilen (gemessen). */
.tl-spur .tl-halt b, .tl-spur .tl-halt span, .tl-spur .tl-halt em {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: normal; overflow-wrap: anywhere;
}

/* Das Fahrstueck. Es waechst im Verhaeltnis seiner Dauer; die Farbe wechselt
   je Fahrt, damit zwei Linien nebeneinander auseinanderzuhalten sind. */
/* KEINE Rundung an den Stossstellen: wo ein Fahrstueck auf die Schiene der
   Haltespalte trifft, macht eine abgerundete Ecke aus dem Uebergang eine
   sichtbare Kerbe. Rund wird deshalb nur das aeussere Ende der ganzen Schiene —
   die erste und die letzte Zelle der mittleren Reihe. Die Zellen kommen in
   Dreiergruppen (oben, Mitte, unten), die mittlere ist also das zweite Kind von
   vorn und das zweite von hinten. */
.tl-fahrt .bahn { height: 9px; border-radius: 0; background: var(--akzent); }
.tl-spur .m:nth-child(2) .bahn { border-radius: 4px 0 0 4px; }
.tl-spur .m:nth-last-child(2) .bahn { border-radius: 0 4px 4px 0; }
/* Die Farbe kommt je Abschnitt aus dem Markup (Gattung des Verkehrsmittels);
   hier steht nur noch der Rueckfall fuer den Fall, dass keine mitkommt. */
.tl-fahrt .marke, .vt-fahrt .marke {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 4px 11px; border-radius: 10px; background: var(--akzent);
  color: #fff; font-size: 15px; font-weight: 800; white-space: nowrap;
  max-width: 100%; overflow: hidden;
}
/* Zeichen und Zahl in vollem Weiss. Font Awesome setzt die Farbe des Zeichens
   aus `currentColor` — aber die duennen Striche der Light-Schnitte wirken auf
   der Akzentflaeche grau. Deshalb ausdruecklich, und die Deckung dazu. */
.tl-fahrt .marke, .tl-fahrt .marke i, .tl-fahrt .marke svg,
.vt-fahrt .marke, .vt-fahrt .marke i, .vt-fahrt .marke svg {
  color: #fff; fill: #fff; opacity: 1;
}
/* Symcon liefert NUR den Light-Schnitt — gemessen: ein `fa-solid` wird gar
   nicht erst ersetzt, das Zeichen waere schlicht weg. Es bleibt also bei den
   duennen Linien. Ein Kontur-Strich, der sie dicker macht, stand hier und ist
   auf Ansage wieder raus. */
/* Hoehe vorgeben, Breite mitlaufen lassen: die Zeichen sind NICHT quadratisch
   (der Bus misst 576 zu 512), und eine feste Breite quetscht sie. */
.tl-fahrt .marke svg, .vt-fahrt .marke svg { height: 1em; width: auto; }
.tl-fahrt .marke b, .vt-fahrt .marke b { font-weight: 800; color: #fff; }
/* Der Abstand haengt NICHT am `gap` des Schilds: gemessen stand die Nummer
   trotz `column-gap: 9px` genau an der Kante des Zeichens (Abstand 0). Was
   Font Awesome beim Austausch von <i> gegen <svg> im Einzelnen anstellt, muss
   man dafuer gar nicht wissen — ein eigener Rand am Zeichen wirkt in jedem
   Fall. */
.tl-fahrt .marke svg, .tl-fahrt .marke i,
.vt-fahrt .marke svg, .vt-fahrt .marke i { margin-right: 9px; }

/* Der Umstieg: gepunktet statt durchgezogen, weil man dort selbst laeuft.
   Aussteigen und einsteigen sind zwei Punkte — und beide sitzen in DERSELBEN
   Zelle wie die Strichelung. Aus drei Stuecken zusammengesetzt setzte das
   Punktmuster an jeder Naht neu an; das war als Versatz zu sehen. */
.tl-um b, .tl-weg b { white-space: nowrap; }
.tl-um.m { display: flex; align-items: center; padding: 0; }
.tl-um .pkt {
  flex: 0 0 auto; width: 11px; height: 11px; border-radius: 50%;
  background: var(--text);
}
.tl-um .bahn {
  flex: 1 1 auto; height: 9px; min-width: 26px;
  background-image: radial-gradient(circle, var(--dezent) 1.8px, transparent 1.9px);
  background-size: 9px 9px; background-position: left center;
}
/* Der Name des Umstiegs darf nicht die ganze Kachel fuellen. */
.tl-um.o { max-width: 132px; }
.tl-um.o em, .tl-um.o span {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; white-space: normal; overflow-wrap: anywhere;
}

/* Anlauf und Auslauf: der Fussweg vor der ersten und nach der letzten Fahrt. */
.tl-weg .bahn {
  height: 9px; min-width: 24px; border-radius: 0;
  background: color-mix(in srgb, var(--akzent) 22%, transparent);
}

/* Die Kennzahlen unter der Achse. Auslastung nur, wenn das Verkehrsunternehmen
   sie meldet — „unbekannt" anzuzeigen waere eine Auskunft, die keine ist. */
.tl-werte { display: flex; gap: 6px; }
.tl-wert {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; gap: 7px;
  background: color-mix(in srgb, var(--content-color) 6%, transparent);
  border-radius: 10px; padding: 7px 9px;
}
/* Das Sinnbild im runden Feld — dieselbe Machart wie die Knoepfe der Web-App:
   Flaeche in der Akzentfarbe mit wenig Deckung, Zeichen in voller. */
.tl-wert .sinn {
  flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--akzent) 18%, transparent);
  color: var(--akzent); font-size: 13px;
}
.tl-wert .text { min-width: 0; }
.tl-wert .was { font-size: 10px; color: var(--dezent); white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
.tl-wert .zahl { font-size: 14px; font-weight: 800; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
.tl-wert.voll .zahl { color: var(--warn); }
.tl-wert.voll .sinn {
  background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn);
}

/* Wird die Kachel schmal, faellt zuerst die Zahl der Haltestellen, dann der
   Steig und zuletzt die Kennzahlenzeile. Die Uhrzeiten und die Linien bleiben:
   das ist die Auskunft, alles andere ist Beiwerk. */
/* Ist Platz da, darf der Haltestellenname mehr davon haben — 92 Pixel sind der
   Kompromiss fuer die schmale Kachel, nicht das Ziel. */
@container (min-width: 520px) {
  .tl-halt.u, .tl-halt.o { max-width: 150px; }
  .tl-um.o { max-width: 168px; }
}
@container (max-width: 380px) {
  .tl-halt.u, .tl-halt.o { max-width: 86px; }
  .tl-um.o { max-width: 96px; }
  /* Das Symbol im Linienschild faellt zuerst — die Nummer traegt die Auskunft. */
  .tl-spur .marke { font-size: 12px; padding: 3px 6px; gap: 4px; min-width: 0; }
  .tl-spur .marke i, .tl-spur .marke svg { display: none; }
  /* `:not(.marke)` ist kein Zierrat: die Liniennummer steckt ebenfalls in einem
     span in der oberen Zeile, und ohne die Ausnahme verschwand sie hier mit —
     gemessen 0 Pixel breit, die Kachel zeigte Schienen ohne Linien. */
  .tl-spur .u span:not(.marke), .tl-spur .o span:not(.marke) { display: none; }
  .tl-kopf .uhr { font-size: 26px; }
}
@container (max-width: 330px) {
  .tl-wert .sinn { display: none; }
}
@container (max-width: 250px) {
  .tl-werte { display: none; }
}

/* ── Senkrechte Streckenansicht ────────────────────────────────────────────
   Die dritte Wahl im Formular. Sie liest sich wie ein Fahrschein von oben nach
   unten: Halt, Fahrt, Halt — und je Fahrt laesst sich die Haltestellenfolge
   aufklappen. Aufgebaut ist jede Zeile als Raster aus Schiene und Inhalt; die
   Schiene malt jede Zeile SELBST, damit die Linie ohne Naht durchlaeuft. */
/* Die Verbindungen stehen untereinander — keine Wisch-Schiene, kein
   Seitwaerts. JEDE bekommt ihren eigenen Kasten; ein Trennstrich waere dann
   doppelt gemoppelt.
   Dafuer tritt die Streckenkarte selbst zurueck: sie traegt nur noch die
   Ueberschrift, das Kastenaussehen wandert nach innen. Sonst saesse Kasten in
   Kasten. */
.karte:has(.vt-stapel) { background: transparent; padding: 0; overflow: visible; }
.karte:has(.vt-stapel) > .titel { padding: 0 2px; }
.vt-stapel { display: flex; flex-direction: column; gap: 10px; }
.vt-stapel > .fahrt {
  background: var(--zeile); border-radius: 12px; padding: 10px 12px;
}
/* `.fahrt` ist fuer die Wisch-Schiene gemacht: `flex: 0 0 100%` heisst dort
   „eine Kachelbreite". Im senkrechten Stapel heisst dasselbe „eine Kachel-
   HOEHE" — vier Verbindungen passten dann nicht mehr in die Karte, und drei
   davon waren abgeschnitten (gemessen: nur die erste war zu sehen). */
.vt-stapel > .fahrt { flex: 0 0 auto; }
.vt { display: flex; flex-direction: column; margin-bottom: 10px; }
/* Fussweg und Umstieg tragen nur EINE Zeile Text. Ihre Polsterung nach unten
   war so gross wie die einer Haltestelle — damit lag die Untergrenze ihrer
   Hoehe bei 25 Pixeln, und alles unter gut sechs Minuten sah gleich lang aus.
   Mit weniger Polsterung greift der Massstab (vier Pixel je Minute) frueher. */
.vt-zeile.weg .vt-inhalt, .vt-zeile.um .vt-inhalt { padding-bottom: 3px; }
.vt-zeile { display: grid; grid-template-columns: 26px 1fr; align-items: start; }
.vt-schiene { position: relative; align-self: stretch; min-height: 14px; }
/* Ober- und Unterkante getrennt: an einem Halt wechselt die Farbe genau am
   Punkt, nicht in der Mitte der Zeile. */
.vt-schiene::before, .vt-schiene::after {
  content: ''; position: absolute; left: 50%; transform: translateX(-50%); width: 4px;
}
.vt-schiene::before { top: 0; height: var(--knick, 50%); background: var(--o, transparent); }
.vt-schiene::after  { top: var(--knick, 50%); bottom: 0; background: var(--u, transparent); }
/* Der Fussweg endet im Freien, nicht an der Kante: runde Enden sagen „hier
   hoert es auf", eine glatte Kante sieht abgeschnitten aus. */
.vt-zeile.weg .vt-schiene::before { border-radius: 2px 2px 0 0; }
.vt-zeile.weg .vt-schiene::after  { border-radius: 0 0 2px 2px; }
.vt-schiene .pkt {
  position: absolute; left: 50%; top: var(--knick, 50%);
  transform: translate(-50%, -50%); z-index: 1;
  width: 13px; height: 13px; border-radius: 50%; background: var(--text);
}
/* Der Umstieg: gepunktet, wie in der waagerechten Ansicht — und zwar DURCH,
   vom Aussteige-Punkt bis zum Einsteige-Punkt. Dazwischen liegen drei Zeilen
   (aussteigen, umsteigen, einsteigen); jede malt ihr Stueck.
   `background-position: center top` an allen dreien: so faengt das Muster in
   jedem Stueck an derselben Stelle an und die Naht faellt kaum auf. Ganz ohne
   Naht ginge es nur mit einem einzigen Element — dafuer muessten die drei
   Beschriftungen aus dem Fluss, und das waere teurer erkauft als der Gewinn. */
.vt-zeile.um .vt-schiene::before, .vt-zeile.um .vt-schiene::after,
.vt-zeile.o-punkte .vt-schiene::before,
.vt-zeile.u-punkte .vt-schiene::after {
  background: none;
  background-image: radial-gradient(circle, var(--dezent) 1.8px, transparent 1.9px);
  background-size: 9px 9px; background-position: center top;
}

/* Der Halt steht in EINER Zeile — Uhrzeit, Name, Steig nebeneinander.
   Das ist keine Geschmacksfrage, sondern der Massstab: uebereinander war die
   Zeile 59 Pixel hoch, und davon liegen 50 UNTER ihrem Punkt. Ein Fussweg von
   sechs Minuten darf aber nur 48 Pixel lang sein — er konnte also gar nicht
   kurz genug werden, und 14 Minuten sahen nicht doppelt so lang aus wie 6.
   Einzeilig sind es 22 Pixel, und der Massstab greift ab gut vier Minuten. */
.vt-halt .vt-inhalt {
  padding: 0 0 4px 10px;
  display: flex; align-items: baseline; gap: 8px; min-width: 0;
}
.vt-halt .zeit { font-size: 16px; font-weight: 800; flex: 0 0 auto; }
.vt-halt .name {
  font-size: 13px; font-weight: 700; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.vt-halt .steig { font-size: 11px; color: var(--dezent); flex: 0 0 auto; }

.vt-fahrt .vt-inhalt, .vt-zeile.um .vt-inhalt, .vt-zeile.weg .vt-inhalt {
  padding: 0 0 10px 10px;
}
.vt-fahrt .kopf { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vt-fahrt .richtung { font-size: 12px; color: var(--dezent); min-width: 0; }
/* Der Knopf zum Aufklappen. Randlos und flaechig wie in der Web-App. */
.vt-knopf {
  display: inline-flex; align-items: center; gap: 7px; margin-top: 6px;
  padding: 5px 9px; border: 0; border-radius: 9px; cursor: pointer;
  background: color-mix(in srgb, var(--content-color) 7%, transparent);
  color: var(--text); font: inherit; font-size: 11px;
}
.vt-knopf .zahl { font-weight: 800; font-size: 12px; }
.vt-knopf .pfeil { color: var(--akzent); transition: transform .15s ease; }
.vt-knopf[aria-expanded="true"] .pfeil { transform: rotate(180deg); }

.vt-halte { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.vt-halte .h { display: flex; align-items: baseline; gap: 8px; font-size: 11px; }
.vt-halte .h .t { color: var(--dezent); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.vt-halte .h .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Ein- und Ausstieg kraeftiger als die Halte dazwischen. */
.vt-halte .h.rand .t, .vt-halte .h.rand .n { color: var(--text); font-weight: 700; }

.vt-zeile.um .vt-inhalt, .vt-zeile.weg .vt-inhalt { font-size: 11px; color: var(--dezent); }
.vt-zeile.um b, .vt-zeile.weg b { color: var(--text); font-size: 12px; }

.leer { color: var(--dezent); font-size: 12px; text-align: center; padding: 14px 0; }

/* Die Quellenangabe. Die Fahrplandaten des VRR stehen unter CC BY 4.0 — der
   Verbund gehört genannt, wo seine Daten zu sehen sind. Klein und dezent, aber
   fest unter der Liste: sie scrollt nicht mit weg. */
.quelle {
  flex: 0 0 auto; font-size: 10px; color: var(--dezent);
  text-align: right; padding-top: 4px;
}
</style>
</head>
<body>

<div id="wurzel"><div class="leer">…</div></div>

<script>
/* In der Visu stehen `translate` und `requestAction` als Top-Level-Bindungen
   bereit; hier nicht neu deklarieren, sonst kollidiert es. */
let zustand = { v: 1, now: 0, view: 'departures', stops: [], routes: [], blocked: false };
let ansicht = null;      // 'departures' | 'routes' — Wahl des Betrachters
/* Nur umsteigefreie zeigen? Wahl des BETRACHTERS, im localStorage gemerkt —
   geholt werden ohnehin immer beide Listen, hier wird nur gewaehlt. Zwei Leute
   vor zwei Kacheln sehen also Verschiedenes, und niemand verstellt dem anderen
   die Anzeige. */
let nurDirekt = null;    // true | false

/* Symcon reicht die Ränder der Kachel als Adresszusatz herein
   (margintop/marginside/marginbottom). Ohne sie stünde der Inhalt oben unter
   der Leiste der Visualisierung. Fehlen sie, bleibt es bei 0 — dasselbe
   Vorgehen wie in den übrigen SymDo-Kacheln. */
(function () {
  try {
    const p = new URLSearchParams(window.location.search);
    const px = function (name) {
      const v = parseInt(p.get(name), 10);
      return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    const wurzel = document.documentElement.style;
    const mt = px('margintop');    if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
    const ms = px('marginside');   if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
    const mb = px('marginbottom'); if (mb !== null) { wurzel.setProperty('--sym-mb', mb); }
  } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
})();

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function symbol(klasse) { return klasse ? '<i class="fa-light ' + esc(klasse) + '"></i>' : ''; }

/**
 * Die Farbe eines Fahrabschnitts.
 *
 * Sie kommt FERTIG aus dem Modul: dort steht die Tabelle, die der Nutzer im
 * Formular bearbeitet (Symbol und Farbe je Verkehrsmittel). Die Kachel schlaegt
 * also nichts mehr nach — sie nimmt, was dasteht, und faellt auf die
 * Akzentfarbe der Visu zurueck, wenn nichts dasteht (alte Nutzlast).
 */
function verkehrsmittelFarbe(leg) {
  const f = leg && leg.color;
  return (typeof f === 'string' && f !== '') ? f : 'var(--akzent)';
}

function merker(name, wert) {
  try {
    if (wert === undefined) return window.localStorage.getItem('symdo.vrr.' + name);
    window.localStorage.setItem('symdo.vrr.' + name, wert);
  } catch (e) { /* Privates Fenster: dann eben ohne Gedächtnis */ }
  return null;
}

/**
 * Die Kopfzeile: nur der Umschalter.
 *
 * Hier standen einmal Filterknöpfe — ein Haus für „alle" und je ein Knopf pro
 * Mitglied. Das war zweimal falsch: es sah aus wie eine Auswahl, ohne eine zu
 * brauchen (die Kachel zeigt ohnehin nur, was eingerichtet ist), und niemand
 * konnte ihm ansehen, wozu es gut sein sollte. Wem eine Verbindung gehört,
 * sagt jetzt die Überschrift über seinen Karten — mit Bild und Namen.
 */
function kopfHtml(jetzt) {
  const hatBeides = (zustand.stops || []).length > 0 && (zustand.routes || []).length > 0;
  /* Gehört alles EINEM Kind, stehen Bild und Name hier oben neben dem
     Umschalter statt über jeder Gruppe — eine Zeile statt zweier. Wird der Name
     zu lang, rutscht der Umschalter darunter (flex-wrap), statt den Namen
     abzuschneiden: der Name ist die Auskunft. */
  const einer = alleinigesMitglied();
  const wer = einer ? wemHtml(einer) : '';
  const um = hatBeides
    ? '<div class="umschalter">'
      + '<button data-ansicht="departures" class="' + (ansicht === 'routes' ? '' : 'an') + '">'
      + esc(translate('Departures')) + '</button>'
      + '<button data-ansicht="routes" class="' + (ansicht === 'routes' ? 'an' : '') + '">'
      + esc(translate('Routes')) + '</button></div>'
    : '';
  /* Nur bei den Strecken, und nur wenn es welche gibt: bei den Abfahrten
     gaebe es nichts umzuschalten. */
  const direkt = (jetzt === 'routes' && (zustand.routes || []).length > 0)
    ? '<div class="umschalter">'
      + '<button data-direkt="0" class="' + (nurDirekt ? '' : 'an') + '">'
      + esc(translate('All')) + '</button>'
      + '<button data-direkt="1" class="' + (nurDirekt ? 'an' : '') + '">'
      + esc(translate('Direct')) + '</button></div>'
    : '';
  return (wer || um || direkt) ? '<div class="kopf">' + wer + um + direkt + '</div>' : '';
}

/** Der eine Eintrag, dem ALLES gehört — sonst null. */
function alleinigesMitglied() {
  const alle = (zustand.stops || []).concat(zustand.routes || []);
  const ids = {};
  alle.forEach(function (e) { ids[e.member || ''] = e; });
  const schluessel = Object.keys(ids);
  return (schluessel.length === 1 && schluessel[0] !== '') ? ids[schluessel[0]] : null;
}

/** Bild und Name des Kindes — die Überschrift über seinen Karten. */
function wemHtml(e) {
  if (!e.member) { return ''; }
  const name = e.memberName || '';
  // Das Bild steckt IM Kreis, nicht als Kreis — wie in der Ämtchen-Kachel:
  // so trägt der Rand auch den Anfangsbuchstaben, wenn kein Foto hinterlegt ist.
  const inhalt = e.memberAvatar
    ? '<img src="' + esc(e.memberAvatar) + '" alt="">'
    : esc((name || '?').slice(0, 1).toUpperCase());
  return '<div class="wem"><div class="gesicht">' + inhalt + '</div>'
    + '<span class="name">' + esc(name) + '</span></div>';
}

/**
 * Die Karten nach Mitglied gruppiert, jede Gruppe mit Bild und Namen darüber.
 * Was niemandem zugeordnet ist, steht ohne Überschrift oben — es gehört allen.
 */
function gruppiert(eintraege, karteBauen) {
  const reihenfolge = [];
  const gruppen = {};
  eintraege.forEach(function (e) {
    const id = e.member || '';
    if (!gruppen[id]) { gruppen[id] = []; reihenfolge.push(id); }
    gruppen[id].push(e);
  });
  reihenfolge.sort(function (a, b) { return (a === '' ? -1 : 0) - (b === '' ? -1 : 0); });
  // Steht der Name schon in der Kopfzeile, wäre die Überschrift eine Dopplung.
  const oben = alleinigesMitglied() !== null;
  return reihenfolge.map(function (id) {
    return (id && !oben ? wemHtml(gruppen[id][0]) : '') + gruppen[id].map(karteBauen).join('');
  }).join('');
}

function abfahrtenHtml() {
  const stops = zustand.stops || [];
  if (stops.length === 0) { return '<div class="leer">' + esc(translate('No stop set up')) + '</div>'; }
  return gruppiert(stops, function (s) {
    const zeilen = (s.departures || []).map(function (d) {
      const klassen = 'abfahrt' + (d.reachable ? '' : ' weg') + (d.cancelled ? ' entfaellt' : '');
      /* Mit gepflegtem Fußweg zählt „wann muss ich los", sonst „wann fährt es".
         Das ist die Zahl, auf die man wirklich schaut. */
      const min = s.walk > 0 ? d.leaveIn : d.countdown;
      const wann = d.cancelled ? esc(translate('cancelled'))
        : (min <= 0 ? esc(translate('now')) : min + '&nbsp;' + esc(translate('min')));
      return '<div class="' + klassen + '" title="' + esc(d.product + ' ' + d.line + ' → ' + d.destination
             + ', ' + translate('scheduled') + ' ' + d.planned) + '">'
        /* Das Zeichen traegt die Farbe seines Verkehrsmittels — dieselbe, die
           auch das Linienschild in den Streckenansichten hat. Sie kommt fertig
           aus dem Modul; fehlt sie (alte Nutzlast), bleibt es beim Akzent. */
        + '<span class="sym" style="color:' + verkehrsmittelFarbe(d) + '">'
        + symbol(d.icon) + '</span>'
        + '<span class="linie">' + esc(d.line) + '</span>'
        + '<span class="ziel"><span class="pfeil">' + symbol('fa-arrow-right') + '</span>'
        + esc(d.destination) + '</span>'
        /* Drei EIGENE Zellen statt einer. Und sie stehen auch dann da, wenn
           nichts drin ist — sonst ruecken in einer Zeile ohne Verspaetung die
           folgenden Spalten nach und nichts steht mehr untereinander. */
        + '<span class="wann">' + wann + '</span>'
        + '<span class="spaet">' + (d.delay > 0 ? '+' + d.delay : '') + '</span>'
        + '<span class="steig">'
        + (d.platform ? esc(translate('Pl.')) + ' ' + esc(d.platform) : '')
        + '</span></div>';
    }).join('');
    return '<div class="karte">'
      + '<div class="titel"><span>' + esc(s.name) + '</span>'
      + (s.walk > 0 ? '<span class="neben">' + esc(translate('incl. %s min walk').replace('%s', s.walk)) + '</span>' : '')
      + (s.stale ? '<span class="veraltet">' + esc(translate('outdated')) + '</span>' : '')
      + '</div>'
      + (zeilen
          ? '<div class="abfahrten">' + zeilen + '</div>'
          : '<div class="leer">' + esc(translate('no departures')) + '</div>')
      + '</div>';
  });
}

/**
 * Die Zeitachse einer Verbindung: ein Stück je Abschnitt, breit nach Dauer.
 *
 * IM Balken steht nur die Liniennummer — und auch die nur beim Fahren. Die
 * Minuten der Fuß- und Wartewege standen dort früher mit drin und wurden
 * abgeschnitten, sobald das Stück schmal war: bei einer Verbindung von 33
 * Minuten blieben dem Fußweg 54 Pixel, von denen Symbol und Polsterung 39
 * fraßen. Wie viel Zeit wohin geht, sagt jetzt die Zeile darunter — die ist
 * immer lesbar, egal wie schmal das Stück ist.
 */
function balkenHtml(v) {
  return '<div class="balken">' + (v.legs || []).map(function (l) {
    const min = Math.round(l.seconds / 60) + ' ' + translate('min');
    /* Bei der Fahrt stehen Linie und Fahrzeit in EIGENEN Kästchen: wird das
       Stück eng, verschwindet erst das Symbol und dann die Fahrzeit — die
       Liniennummer bleibt bis zuletzt, denn sie ist die eigentliche Auskunft.
       Das entscheidet eine Container-Abfrage am Stück selbst, ohne Messung im
       Skript und ohne dass beim Ändern der Fenstergröße etwas nachlaufen muss. */
    const text = l.kind === 'ride'
      ? '<span class="linie">' + esc(l.line || l.product) + '</span>'
        + '<span class="zeit">· ' + esc(min) + '</span>'
      : '<span>' + esc(min) + '</span>';
    const was = l.kind === 'walk' ? translate('walking')
              : (l.kind === 'wait' ? translate('waiting') : (l.line || l.product));
    /* Nur die FAHRTEN wachsen, und zwar im Verhältnis ihrer Fahrzeit
       zueinander: flex-grow bekommt die Sekunden. Der Rest des Balkens — was
       Fußweg und Warten übrig lassen — verteilt sich damit so, wie die Fahrten
       zueinander stehen. Eine Untergrenze gibt es bewusst nicht; sie würde
       genau das Verhältnis verfälschen, um das es hier geht. */
    const wachsen = l.kind === 'ride' ? ' style="flex-grow:' + Math.max(1, l.seconds) + '"' : '';
    const farbe = l.kind === 'ride' ? ' style="background:' + verkehrsmittelFarbe(l) + '"' : '';
    return '<div class="stueck ' + esc(l.kind) + '"' + wachsen + farbe + ' title="'
      + esc(was + ' ' + min + ', ' + l.from + ' ' + l.depText + ' → ' + l.to + ' ' + l.arrText) + '">'
      + symbol(l.icon) + text + '</div>';
  }).join('') + '</div>';
}


/**
 * Die ausfuehrliche Zeitachse einer Verbindung — Bild 1:1 wie im Formular
 * gewaehlt („Ausfuehrliche Zeitachse").
 *
 * Gezeigt wird die Fahrt so, wie man sie erlebt: links wann es losgeht, rechts
 * wann man da ist, dazwischen je Fahrt ein Stueck mit Linie, Dauer und der Zahl
 * der Haltestellen, und an jedem Umstieg der Name mit der Uhrzeit.
 *
 * Gebaut wird ein GITTER, kein Nebeneinander von drei Zeilen: jeder Teil der
 * Fahrt liefert genau drei Zellen (oben, Schiene, unten), und
 * `grid-auto-flow: column` stapelt sie in EINE Spalte. So kann keine
 * Beschriftung von ihrem Stueck wegrutschen. Die Breiten stehen im
 * `grid-template-columns`, das hier mitgerechnet wird.
 */
function zeitachseHtml(v, jetzt) {
  const legs = v.legs || [];
  const fahrten = [];
  legs.forEach(function (l, i) { if (l.kind === 'ride') { fahrten.push(i); } });
  /* Ohne eine einzige Fahrt gibt es nichts aufzureihen — reine Fusswege
     (kommt bei sehr kurzen Strecken vor) zeigt der Balken besser. */
  if (fahrten.length === 0) { return balkenHtml(v); }

  const sek = function (von, bis) {
    let n = 0;
    for (let i = von; i < bis; i++) { n += legs[i].seconds || 0; }
    return n;
  };
  const min = function (s) { return Math.round(s / 60) + ' ' + translate('min'); };

  const erste = legs[fahrten[0]];
  const letzte = legs[fahrten[fahrten.length - 1]];
  const teile = [];

  const anlauf = sek(0, fahrten[0]);
  if (anlauf > 0) { teile.push({ typ: 'weg', s: anlauf }); }
  teile.push({ typ: 'halt', rolle: 'start', name: erste.from, steig: erste.platform });
  fahrten.forEach(function (idx, k) {
    teile.push({ typ: 'fahrt', leg: legs[idx], k: k });
    if (k < fahrten.length - 1) {
      const naechste = fahrten[k + 1];
      /* Der Umstieg ist EIN Teil mit zwei Punkten: aussteigen und einsteigen.
         Vorher stand nur ein Punkt da und die zweite Fahrt begann im Nichts —
         und die Strichelung war aus drei Stuecken zusammengesetzt, deren Muster
         an jeder Naht neu ansetzte (in der Kachel als Versatz zu sehen). In
         einer Zelle laeuft sie in einem Stueck durch, und die Beschriftung
         steht mittig darunter.
         Der zweite Name steht nur da, wenn man die Haltestelle wirklich
         wechselt — sonst stuende er zweimal nebeneinander. */
      teile.push({
        typ: 'um', s: sek(idx + 1, naechste),
        name: legs[idx].to, zeit: legs[idx].arrText,
        name2: legs[naechste].from === legs[idx].to ? '' : legs[naechste].from,
      });
    }
  });
  teile.push({ typ: 'halt', rolle: 'ziel', name: letzte.to, steig: letzte.platformTo });
  const auslauf = sek(fahrten[fahrten.length - 1] + 1, legs.length);
  if (auslauf > 0) { teile.push({ typ: 'weg', s: auslauf }); }

  /* Womit ein Teil die Schiene malt. Der Halt braucht das von seinen beiden
     Nachbarn, damit die Schiene durch ihn HINDURCH laeuft statt an der
     Spaltengrenze aufzuhoeren. `null` heisst „gepunktet" (Umstieg) und wird
     ueber eine Klasse geloest, weil ein Punktmuster keine Farbe ist. */
  const farbeVon = function (t) {
    if (!t) { return 'transparent'; }
    if (t.typ === 'weg') { return 'color-mix(in srgb, var(--akzent) 22%, transparent)'; }
    return verkehrsmittelFarbe(t.leg);
  };

  const spalten = [];
  let zellen = '';
  teile.forEach(function (t, i) {
    let klasse = '', oben = '', mitte = '', unten = '', stilM = '';
    if (t.typ === 'halt') {
      klasse = 'tl-halt' + (t.rolle === 'um' ? ' um' : '');
      stilM = ' style="--l:' + farbeVon(teile[i - 1])
            + ';--r:' + farbeVon(teile[i + 1]) + '"';
      /* max-content, nicht min-content: min-content bricht jeden Namen auf das
         laengste Wort herunter („D- / Eller / S" ueber drei Zeilen). Wie breit
         es hoechstens wird, deckelt das Stilblatt. */
      spalten.push('max-content');
      mitte = '<div class="pkt"></div>';
      if (t.rolle === 'um') {
        /* Am Umstieg stehen Uhrzeit und Name OBEN — unten waere zwischen zwei
           Dauerangaben kein Platz, und die beiden Endpunkte brauchen die
           untere Zeile fuer Name und Steig. */
        oben = t.name
          ? '<em>' + esc(t.zeit || '') + '</em><span>' + esc(t.name) + '</span>'
          : '';
      } else {
        unten = '<b>' + esc(t.name || '') + '</b>'
              + (t.steig ? '<span>' + esc(translate('Pl.')) + ' ' + esc(t.steig) + '</span>' : '');
      }
    } else if (t.typ === 'fahrt') {
      const l = t.leg;
      klasse = 'tl-fahrt';
      stilM = ' style="--f:' + verkehrsmittelFarbe(l) + '"';
      /* Im Verhaeltnis der Fahrzeit, wie schon beim Balken — nur dass hier
         Halte und Umstiege ihre eigene Breite behalten.
         `minmax(min-content, Nfr)` und nicht `Nfr`: ein blosses `fr` heisst
         `minmax(auto, Nfr)`, und `auto` zieht die GANZE Zelle heran — mit der
         Haltestellenzahl darunter waere das Stueck breiter als noetig. Die
         untere Grenze bleibt aber min-content und nicht 0: mit 0 schrumpfte das
         kurze Stueck auf 27 Pixel und die Liniennummer stand als „…" da
         (gemessen bei 320 Pixeln Kachelbreite). Lieber eine Zeitachse, die
         nicht ganz massstaeblich ist, als eine ohne Liniennummer. */
      spalten.push('minmax(min-content, ' + Math.max(1, l.seconds || 1) + 'fr)');
      /* Die Nummer bekommt ein eigenes Element. Als blosser Text waere sie ein
         anonymes Kind des Flex-Behaelters, und darauf ist beim Abstand kein
         Verlass — im Prueflauf klebte sie am Zeichen, obwohl `gap` gesetzt war. */
      const f = verkehrsmittelFarbe(l);
      oben = '<span class="marke" style="background:' + f + '">' + symbol(l.icon)
           + '<b>' + esc(l.line || l.product) + '</b></span>';
      mitte = '<div class="bahn" style="background:' + f + '"></div>';
      unten = '<b>' + esc(min(l.seconds || 0)) + '</b>'
            + (l.stops > 0
                ? '<span>' + esc(l.stops + ' ' + translate(l.stops === 1 ? 'stop' : 'stops')) + '</span>'
                : '');
    } else if (t.typ === 'um') {
      klasse = 'tl-um';
      spalten.push('max-content');
      oben = '<em>' + esc(t.zeit || '') + '</em><span>' + esc(t.name || '')
           + (t.name2 ? ' → ' + esc(t.name2) : '') + '</span>';
      mitte = '<div class="pkt"></div><div class="bahn"></div><div class="pkt"></div>';
      unten = '<b>' + symbol('fa-person-walking') + ' ' + esc(min(t.s))
            + '</b><span>' + esc(translate('change')) + '</span>';
    } else {
      klasse = 'tl-weg';
      spalten.push('min-content');
      mitte = '<div class="bahn"></div>';
      unten = '<b>' + symbol('fa-person-walking') + ' ' + esc(min(t.s))
            + '</b><span>' + esc(translate('on foot')) + '</span>';
    }
    zellen += '<div class="o ' + klasse + '">' + oben + '</div>'
            + '<div class="m ' + klasse + '"' + stilM + '>' + mitte + '</div>'
            + '<div class="u ' + klasse + '">' + unten + '</div>';
  });

  /* „in 9 min" zaehlt gegen die Uhr des MODULS, nicht gegen die des Browsers —
     dieselbe Zeitbasis, aus der auch die Abfahrtstafel ihre Minuten nimmt. */
  const bisAb = erste.depAt > 0 && jetzt > 0 ? Math.round((erste.depAt - jetzt) / 60) : null;
  const gleich = bisAb === null ? ''
    : (bisAb <= 0 ? translate('now') : translate('in %s').replace('%s', bisAb + ' ' + translate('min')));


  return '<div class="tl">'
    + '<div class="tl-kopf">'
    +   '<div class="seite"><div class="was">' + esc(translate('Departure')) + '</div>'
    +     '<div class="uhr">' + esc(v.departureText) + '</div>'
    +     (gleich ? '<div class="gleich">' + esc(gleich) + '</div>' : '') + '</div>'
    +   '<div class="seite rechts"><div class="was">' + esc(translate('Arrival')) + '</div>'
    +     '<div class="uhr">' + esc(v.arrivalText) + '</div>'
    +     '<div class="gesamt">' + esc(min(v.seconds) + ' ' + translate('in total')) + '</div></div>'
    + '</div>'
    + '<div class="tl-spur" style="grid-template-columns:' + spalten.join(' ') + '">' + zellen + '</div>'
    + werteHtml(v)
    + '</div>';
}

/**
 * Die Kennzahlen unter einer Verbindung — Gesamtdauer, Umstiege, Auslastung.
 * Beide ausfuehrlichen Ansichten zeigen dieselbe Zeile, deshalb steht sie hier
 * und nicht zweimal.
 */
function werteHtml(v) {
  const min = Math.round((v.seconds || 0) / 60) + ' ' + translate('min');
  /* Die Auslastung gilt der Fahrt, in der man am laengsten sitzt — die
     kuerzeste Anschlussfahrt saegt sonst die Aussage der Hauptfahrt ab. */
  let voll = '', laengste = 0;
  (v.legs || []).forEach(function (l) {
    if (l.kind === 'ride' && l.occupancy && (l.seconds || 0) > laengste) {
      laengste = l.seconds || 0; voll = l.occupancy;
    }
  });
  const auslastung = {
    many: translate('plenty of room'), few: translate('filling up'),
    standing: translate('standing only'), full: translate('very full'),
  }[voll] || '';

  const wert = function (was, zahl, zeichen, klasse) {
    return '<div class="tl-wert' + (klasse ? ' ' + klasse : '') + '">'
      + '<div class="sinn">' + symbol(zeichen) + '</div>'
      + '<div class="text"><div class="was">' + esc(was) + '</div>'
      + '<div class="zahl">' + esc(zahl) + '</div></div></div>';
  };

  return '<div class="tl-werte">'
    + wert(translate('Total time'), min, 'fa-stopwatch')
    + wert(translate('Changes'), v.interchanges > 0
        ? v.interchanges + ' ' + translate(v.interchanges === 1 ? 'change' : 'changes')
        : translate('direct'), 'fa-arrow-right-arrow-left')
    + (auslastung ? wert(translate('Occupancy'), auslastung, 'fa-users',
        (voll === 'full' || voll === 'standing') ? 'voll' : '') : '')
    + '</div>';
}


/* Welche Verbindung steht gerade vorn? Das ist die Wahl des BETRACHTERS und
   ueberlebt deshalb das Neuzeichnen.
   Gezeichnet wird bei jedem Abruf neu — also jede Minute —, und dabei entsteht
   die Schiene als neues Element mit scrollLeft 0. Wer sich gerade die dritte
   Fahrt ansah, stand danach wieder bei der ersten. Gemerkt wird je Strecke,
   nicht je Stelle in der Liste: eine Strecke, die dazukommt oder wegfaellt,
   soll den anderen ihre Stelle nicht verschieben. */
let schienenStand = {};

function streckenSchluessel(r) {
  return (r.member || '') + '|' + (r.name || r.memberName || '');
}

function schienenMerken() {
  document.querySelectorAll('[data-schiene]').forEach(function (schiene) {
    const breite = schiene.clientWidth || 1;
    schienenStand[schiene.getAttribute('data-schiene')] =
      Math.round(schiene.scrollLeft / breite);
  });
}

function schienenHerstellen() {
  document.querySelectorAll('[data-schiene]').forEach(function (schiene) {
    const n = schienenStand[schiene.getAttribute('data-schiene')] || 0;
    const karten = schiene.children;
    if (n <= 0 || karten.length === 0) { return; }
    /* Ist die gemerkte Fahrt inzwischen abgefahren, gibt es sie nicht mehr —
       dann so weit wie moeglich, statt ins Leere zu springen. */
    const i = Math.min(karten.length - 1, n);
    schiene.scrollLeft = karten[i].offsetLeft;
    const punkte = schiene.nextElementSibling;
    if (punkte && punkte.classList.contains('punkte')) {
      punkte.querySelectorAll('span').forEach(function (p, k) {
        p.classList.toggle('an', k === i);
      });
    }
  });
}

/**
 * Die senkrechte Ansicht: die Fahrt von oben nach unten, mit ausklappbaren
 * Haltestellenlisten.
 *
 * Aufgebaut aus denselben Teilen wie die waagerechte Zeitachse — nur dass hier
 * jeder Teil eine ZEILE ist und die Schiene senkrecht laeuft. Welche Liste
 * offen steht, merkt sich die Kachel ueber das Neuzeichnen hinweg (`halteOffen`),
 * sonst klappte sie bei jedem Abruf wieder zu.
 */
let halteOffen = {};

function senkrechtHtml(v, schluessel) {
  const legs = v.legs || [];
  const fahrten = [];
  legs.forEach(function (l, i) { if (l.kind === 'ride') { fahrten.push(i); } });
  if (fahrten.length === 0) { return zeitachseHtml(v, zustand.now || 0); }

  const sek = function (von, bis) {
    let n = 0;
    for (let i = von; i < bis; i++) { n += legs[i].seconds || 0; }
    return n;
  };
  const min = function (s) { return Math.round(s / 60) + ' ' + translate('min'); };
  const farbe = function (k) { return verkehrsmittelFarbe(legs[fahrten[k]]); };
  const blass = 'color-mix(in srgb, var(--akzent) 22%, transparent)';

  /* Wie lang ist ein Abschnitt?
     Acht Pixel je Minute, hoechstens 280 — gemessen wird dabei der Abstand von
     PUNKT zu PUNKT, nicht die Hoehe der Zeile. Das ist der Unterschied, an dem
     der erste Versuch gescheitert ist: zwischen zwei Abschnitten liegt immer
     eine Haltestellenzeile, und die ist 22 Pixel hoch — 9 davon oberhalb
     ihres Punktes, 13 unterhalb. Diese Pixel gehoeren zu den benachbarten
     Abschnitten, und zwar ungleich verteilt. Gemessen an einer echten
     Verbindung: 14 Minuten zu Fuss ergaben 65 sichtbare Pixel, 6 Minuten
     ergaben 75 — der kuerzere Weg sah laenger aus.
     Deshalb zieht jede Zeile ab, was ihre Nachbarn beisteuern. Was bleibt, ist
     eine UNTERGRENZE: eine Fahrtzeile braucht fuer Linienschild und Knopf rund
     67 Pixel, eine Fusswegzeile 15. Unterhalb davon bestimmt weiter der Inhalt
     — bei acht Pixeln je Minute betrifft das Fusswege unter gut fuenf Minuten
     und Fahrten unter einer Viertelstunde.
     Die Halte selbst bekommen nichts: sie sind Zeitpunkte, keine Dauer. */
  /* Beide an der gerenderten Kachel gemessen: die einzeilige Haltestellenzeile
     ist 22 Pixel hoch, ihr Punkt sitzt 9 Pixel unter der Oberkante. */
  const HALT_OBEN = 9;      // vom Zeilenanfang bis zum Punkt
  const HALT_UNTEN = 13;    // vom Punkt bis zum Zeilenende
  const laenge = function (sekunden, abzug) {
    return Math.max(0, Math.min(280, Math.round((sekunden || 0) / 60 * 8)) - (abzug || 0));
  };

  /* Eine Zeile des Rasters. `knick` sagt, auf welcher Hoehe die Schiene die
     Farbe wechselt — an einem Halt genau am Punkt, sonst gar nicht. */
  const zeile = function (klasse, oben, unten, inhalt, knick, punkt, dauer) {
    const hoch = dauer ? ' style="min-height:' + dauer + 'px"' : '';
    /* „punkte" ist keine Farbe, sondern ein Muster — es haengt an einer Klasse.
       Nur so laesst sich die Strichelung des Umstiegs ueber die Zeilengrenzen
       hinweg fortsetzen: sie beginnt unter dem Aussteige-Punkt und endet am
       Einsteige-Punkt, mit der Umstiegszeile dazwischen. */
    const muster = (oben === 'punkte' ? ' o-punkte' : '')
                 + (unten === 'punkte' ? ' u-punkte' : '');
    return '<div class="vt-zeile ' + klasse + muster + '"' + hoch + '>'
      + '<div class="vt-schiene" style="--o:' + (oben === 'punkte' ? 'transparent' : oben)
      +   ';--u:' + (unten === 'punkte' ? 'transparent' : unten)
      +   (knick ? ';--knick:' + knick : '') + '">'
      +   (punkt ? '<div class="pkt"></div>' : '') + '</div>'
      + '<div class="vt-inhalt">' + inhalt + '</div></div>';
  };

  let html = '';
  const anlauf = sek(0, fahrten[0]);
  if (anlauf > 0) {
    /* Die Schiene des Fusswegs laeuft ueber die GANZE Zeile: sie soll neben dem
       Text anfangen, nicht erst darunter — sonst steht die erste Angabe der
       Verbindung ueber dem Strich statt an ihm. */
    html += zeile('weg', blass, blass,
      '<b>' + symbol('fa-person-walking') + ' ' + esc(min(anlauf)) + '</b> '
      + esc(translate('on foot')), '0px', false, laenge(anlauf, HALT_OBEN));
  }

  fahrten.forEach(function (idx, k) {
    const l = legs[idx];
    const vorher = k === 0 ? (anlauf > 0 ? blass : 'transparent') : 'punkte';

    /* Einsteigen */
    html += zeile('vt-halt', vorher, farbe(k),
      '<div class="zeit">' + esc(l.depText) + '</div>'
      + '<div class="name">' + esc(l.from) + '</div>'
      + (l.platform ? '<div class="steig">' + esc(translate('Pl.')) + ' ' + esc(l.platform) + '</div>' : ''),
      '9px', true);

    /* Die Fahrt selbst */
    const id = schluessel + '#' + idx;
    const offen = halteOffen[id] === true;
    const halte = l.halte || [];
    let inhalt = '<div class="kopf"><span class="marke" style="background:'
      + verkehrsmittelFarbe(l) + '">' + symbol(l.icon)
      + '<b>' + esc(l.line || l.product) + '</b></span>'
      + (l.destination
          ? '<span class="richtung">' + esc(translate('towards %s').replace('%s', l.destination)) + '</span>'
          : '') + '</div>';
    /* Ohne Haltestellenfolge waere der Knopf ein Versprechen ohne Deckung —
       dann steht die Angabe nur da. */
    const text = '<span class="zahl">' + esc(min(l.seconds || 0)) + '</span>'
      + (l.stops > 0
          ? '<span>· ' + esc(l.stops + ' ' + translate(l.stops === 1 ? 'stop' : 'stops')) + '</span>'
          : '');
    inhalt += halte.length > 1
      ? '<button type="button" class="vt-knopf" data-halte="' + esc(id) + '"'
        + ' aria-expanded="' + (offen ? 'true' : 'false') + '">'
        + text + '<span class="pfeil">' + symbol('fa-chevron-down') + '</span></button>'
        + (offen
            ? '<div class="vt-halte">' + halte.map(function (h, i) {
                const rand = i === 0 || i === halte.length - 1;
                return '<div class="h' + (rand ? ' rand' : '') + '">'
                  + '<span class="t">' + esc(h.t || '') + '</span>'
                  + '<span class="n">' + esc(h.n || '') + '</span></div>';
              }).join('') + '</div>'
            : '')
      : '<div class="vt-knopf" style="cursor:default">' + text + '</div>';
    html += zeile('vt-fahrt', farbe(k), farbe(k), inhalt, '0px', false,
                  laenge(l.seconds, HALT_OBEN + HALT_UNTEN));

    /* Aussteigen und, wenn noch eine Fahrt folgt, der Umstieg */
    const letzteFahrt = k === fahrten.length - 1;
    const danach = letzteFahrt
      ? (sek(idx + 1, legs.length) > 0 ? blass : 'transparent')
      : 'transparent';
    html += zeile('vt-halt', farbe(k), letzteFahrt ? danach : 'punkte',
      '<div class="zeit">' + esc(l.arrText) + '</div>'
      + '<div class="name">' + esc(l.to) + '</div>'
      + (l.platformTo ? '<div class="steig">' + esc(translate('Pl.')) + ' ' + esc(l.platformTo) + '</div>' : ''),
      '9px', true);

    if (!letzteFahrt) {
      const pause = sek(idx + 1, fahrten[k + 1]);
      html += zeile('um', 'transparent', 'transparent',
        '<b>' + symbol('fa-person-walking') + ' ' + esc(min(pause)) + '</b> '
        + esc(translate('change')), '0px', false,
        laenge(pause, HALT_OBEN + HALT_UNTEN));
    }
  });

  const auslauf = sek(fahrten[fahrten.length - 1] + 1, legs.length);
  if (auslauf > 0) {
    /* Genau wie der Fussweg am Anfang: Schiene ueber die ganze Zeile. Vorher
       hoerte sie hier nach zwei Dritteln auf — zwei Fusswege von sechs Minuten
       waren damit verschieden lang gezeichnet, obwohl sie gleich lang dauern.
       Dass die Schiene nicht mehr an die Kennzahlenzeile stoesst, macht jetzt
       der Abstand unter der Achse. */
    html += zeile('weg', blass, blass,
      '<b>' + symbol('fa-person-walking') + ' ' + esc(min(auslauf)) + '</b> '
      + esc(translate('on foot')), '0px', false, laenge(auslauf, HALT_UNTEN));
  }

  return '<div class="vt">' + html + '</div>' + werteHtml(v);
}


function streckenHtml() {
  const routen = zustand.routes || [];
  if (routen.length === 0) { return '<div class="leer">' + esc(translate('No route set up')) + '</div>'; }
  return gruppiert(routen, function (r) {
    const s = r.school;
    /* Beim Schulweg sagt die Kopfzeile die Richtung — sie wechselt im Lauf des
       Tages von selbst, und ohne das Wort wüsste niemand, welche man sieht. */
    let hinweis = '';
    if (s) {
      hinweis = s.direction === 'to'
        ? translate('to school, be there by %s').replace('%s', s.targetTime)
        : (s.fromNow
            ? translate('home, from now')
            : translate('home, lessons end at %s').replace('%s', s.schoolEnd));
    }
    /* Zwei fertige Listen, eine je Schalterstellung: das Modul fragt die
       Auskunft ohnehin zweimal — einmal normal, einmal mit `maxChanges=0`.
       Hier wird deshalb nur noch GEWAEHLT und nicht gesiebt; gesiebt saehe man
       die umsteigefreien Verbindungen nicht, die erst die zweite Anfrage
       zutage foerdert. */
    const alle = (nurDirekt ? (r.journeysDirect || []) : (r.journeys || []));
    const senkrecht = (zustand.routeStyle || 'bars') === 'vertical';
    const fahrten = alle.map(function (v, vi) {
      /* Drei Ansichten, eine Wahl im Formular: der Balken fasst die Fahrt in
         einer Zeile zusammen, die Zeitachse legt sie auseinander. Gemeinsam ist
         ihnen nur die Karte drumherum — deshalb hier die Weiche und nicht im
         Balken selbst. */
      const stil = zustand.routeStyle || 'bars';
      if (stil === 'timeline') {
        return '<div class="fahrt">' + zeitachseHtml(v, zustand.now || 0) + '</div>';
      }
      if (stil === 'vertical') {
        return '<div class="fahrt">'
          + senkrechtHtml(v, streckenSchluessel(r) + '#' + vi) + '</div>';
      }
      return '<div class="fahrt">'
        + '<div class="zeilen"><span class="stark">' + esc(v.departureText) + '</span>'
        + '<span class="grund">→</span><span class="stark">' + esc(v.arrivalText) + '</span>'
        + '<span class="grund">' + Math.round(v.seconds / 60) + ' ' + esc(translate('min'))
        + (v.interchanges > 0
            ? ' · ' + v.interchanges + ' ' + esc(translate('changes'))
            : ' · ' + esc(translate('direct'))) + '</span></div>'
        + balkenHtml(v)
        + '<div class="fuss"><span>' + esc((v.legs[0] || {}).from || '') + '</span>'
        + '<span>' + esc((v.legs[v.legs.length - 1] || {}).to || '') + '</span></div>'
        + '</div>';
    }).join('');
    /* Die Verbindungen liegen NEBENEINANDER und werden gewischt — untereinander
       füllten fünf Stück die ganze Kachel, und die nächste Haltestelle wäre
       niemals ins Bild gekommen. Die Punkte darunter sagen, wo man ist. */
    const punkte = (alle.length > 1 && !senkrecht)
      ? '<div class="punkte">' + alle.map(function (_, i) {
          return '<span class="' + (i === 0 ? 'an' : '') + '"></span>';
        }).join('') + '</div>'
      : '';
    return '<div class="karte">'
      + '<div class="titel"><span>' + esc(r.name || r.memberName) + '</span>'
      + (hinweis ? '<span class="neben">' + esc(hinweis) + '</span>' : '')
      + (r.stale ? '<span class="veraltet">' + esc(translate('outdated')) + '</span>' : '')
      + '</div>'
      /* Die senkrechte Ansicht steht UNTEREINANDER, nicht in der Wisch-Schiene:
         dort wischt man seitwaerts von Fahrt zu Fahrt, und genau das will man
         hier nicht — man liest von oben nach unten und scrollt senkrecht. Die
         Punkte darunter gehoeren zur Schiene und entfallen deshalb mit ihr. */
      + (fahrten
          ? (senkrecht
              ? '<div class="vt-stapel">' + fahrten + '</div>'
              : '<div class="fahrten" data-schiene="' + esc(streckenSchluessel(r)) + '">'
                + fahrten + '</div>' + punkte)
          : '<div class="leer">' + esc(translate(nurDirekt
              ? 'no journey without changes' : 'no journey found')) + '</div>')
      + '</div>';
  });
}

function zeichne() {
  if (ansicht === null) {
    ansicht = merker('ansicht') || zustand.view || 'departures';
  }
  if (nurDirekt === null) { nurDirekt = merker('nurdirekt') === '1'; }
  // Gibt es nur eine Sorte, ist der Umschalter Lärm — dann gilt sie.
  let jetzt = ansicht;
  if ((zustand.routes || []).length === 0) { jetzt = 'departures'; }
  if ((zustand.stops || []).length === 0 && (zustand.routes || []).length > 0) { jetzt = 'routes'; }

  schienenMerken();
  document.getElementById('wurzel').innerHTML =
      kopfHtml(jetzt) + '<div class="liste">'
    + (jetzt === 'routes' ? streckenHtml() : abfahrtenHtml())
    + '</div>'
    + '<div class="quelle">'
    + esc(translate('Timetable data: Verkehrsverbund Rhein-Ruhr (VRR)')) + '</div>';

  schienenHerstellen();
  engePruefen();
  messungLiveHalten();

  /* Die Punkte folgen dem Wischen. Gerechnet wird aus der Scrollposition und
     nicht über einen Beobachter: eine Schiene hat höchstens fünf Kinder, und
     ein IntersectionObserver je Karte wäre Aufwand für nichts. */
  document.querySelectorAll('[data-schiene]').forEach(function (schiene) {
    const punkte = schiene.nextElementSibling;
    if (!punkte || !punkte.classList.contains('punkte')) { return; }
    schiene.addEventListener('scroll', function () {
      const breite = schiene.clientWidth || 1;
      const n = Math.round(schiene.scrollLeft / breite);
      punkte.querySelectorAll('span').forEach(function (p, i) {
        p.classList.toggle('an', i === n);
      });
    }, { passive: true });

    /* Zur n-ten Verbindung. Gerechnet wird aus der KARTE, nicht aus der
       Kachelbreite: zwischen den Karten liegen zehn Pixel Abstand, und mit
       `n * clientWidth` haette der Sprung ab der zweiten Karte danebengelegen
       (gemessen: Rastpunkte bei 510 und 1020, nicht 500 und 1000). Das
       Einrasten zog es zwar wieder gerade — aber auf eine Rechnung, die schon
       stimmt, muss man sich nicht erst zurechtruecken lassen. */
    const zurKarte = function (n) {
      const karten = schiene.children;
      const ziel = karten[Math.max(0, Math.min(karten.length - 1, n))];
      if (!ziel) { return; }
      /* Wer Bewegung abbestellt hat, bekommt den Sprung ohne Animation. */
      const sanft = !(window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      schiene.scrollTo({ left: ziel.offsetLeft, behavior: sanft ? 'smooth' : 'auto' });
    };

    /* Mit der Maus gibt es keine Wischgeste, und ein Rad kennt nur oben und
       unten: der Browser schickt das an die SEITE weiter, die Schiene bleibt
       stehen. Also uebersetzt: eine Raststufe schiebt um EINE Verbindung
       weiter. Schrittweise am scrollLeft zu ziehen waere falsch — das
       Einrasten (scroll-snap) zoege jeden Teilschritt sofort zurueck.
       Ein Trackpad, das quer wischt, macht es selbst; dann halten wir uns
       heraus. */
    let radSperre = 0;
    schiene.addEventListener('wheel', function (e) {
      if (schiene.scrollWidth <= schiene.clientWidth + 1) { return; }
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { return; }
      e.preventDefault();
      const jetzt = Date.now();
      if (jetzt < radSperre) { return; }
      radSperre = jetzt + 220;
      const breite = schiene.clientWidth || 1;
      zurKarte(Math.round(schiene.scrollLeft / breite) + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });

    /* Und der kurze Weg: auf einen Punkt tippen springt dorthin. Er zeigte die
       Stelle schon an, ohne dass man ihn benutzen konnte. */
    punkte.querySelectorAll('span').forEach(function (p, i) {
      p.addEventListener('click', function () { zurKarte(i); });
    });
  });

  /* Aufklappen und zuklappen. Der Stand ueberlebt das Neuzeichnen — sonst
     klappte die Liste bei jedem Abruf, also jede Minute, wieder zu. */
  document.querySelectorAll('[data-halte]').forEach(function (b) {
    b.addEventListener('click', function () {
      const id = b.getAttribute('data-halte');
      halteOffen[id] = !halteOffen[id];
      zeichne();
    });
  });

  document.querySelectorAll('[data-direkt]').forEach(function (b) {
    b.addEventListener('click', function () {
      nurDirekt = b.dataset.direkt === '1';
      merker('nurdirekt', nurDirekt ? '1' : '0');
      zeichne();
    });
  });

  document.querySelectorAll('[data-ansicht]').forEach(function (b) {
    b.addEventListener('click', function () {
      ansicht = b.dataset.ansicht; merker('ansicht', ansicht); zeichne();
    });
  });
  symboleErsetzen();
}

/**
 * Symbol und Fahrzeit ausblenden — aber nur, wo es wirklich nicht passt.
 *
 * Gemessen statt geschätzt: scrollWidth > clientWidth heißt „passt nicht".
 * Erst fällt das Symbol, dann die Fahrzeit; nach jedem Schritt wird neu
 * gemessen, denn das Weglassen schafft Platz.
 */
function engePruefen() {
  document.querySelectorAll('.stueck.ride').forEach(function (st) {
    const passt = function () { return st.scrollWidth <= st.clientWidth + 1; };
    st.classList.remove('ohne-symbol', 'ohne-zeit');
    if (passt()) { return; }                       // Symbol, Linie, Fahrzeit
    st.classList.add('ohne-symbol');
    if (passt()) { return; }                       // Linie und Fahrzeit
    /* Das Symbol kommt ZURÜCK, sobald die Fahrzeit weicht: „784" allein
       braucht 40 Pixel, mit Symbol 58 — bei 71 Pixeln Platz wäre es
       Verschwendung, das Feld leer zu lassen. Gemessen in der laufenden
       Kachel, die 351 Pixel breit ist. */
    st.classList.remove('ohne-symbol');
    st.classList.add('ohne-zeit');
    if (passt()) { return; }                       // Symbol und Linie
    st.classList.add('ohne-symbol');               // nur noch die Linie
  });
}

let messBeobachter = null;
let tauschBeobachter = null;
/**
 * Die Messung LAUFEND halten, nicht nur ein paarmal nach dem Zeichnen.
 *
 * Zwei Dinge ändern die Breite eines Fahrstücks, nachdem gezeichnet wurde:
 * die Kachel bekommt ihre endgültige Größe erst von der Visu, und sobald der
 * Symbolsatz geladen ist, werden Fuß- und Wartestück breiter — was die
 * Fahrten schmaler macht. Wer nur zweimal verzögert misst, trifft dann den
 * falschen Moment: im Bild fehlte dem Stück „784" das Symbol, obwohl
 * reichlich Platz war.
 *
 * Beobachtet werden die Stücke selbst. Eine Rückkopplung gibt es dabei nicht:
 * das Aus- und Einblenden ändert die Breite einer Fahrt nicht — die bestimmt
 * allein die Aufteilung des Balkens.
 */
function messungLiveHalten() {
  if (!window.ResizeObserver) {
    return;
  }
  if (messBeobachter) {
    messBeobachter.disconnect();
  } else {
    messBeobachter = new ResizeObserver(function () { engePruefen(); });
  }
  const wurzel = document.getElementById('wurzel');
  if (wurzel) { messBeobachter.observe(wurzel); }
  document.querySelectorAll('.stueck').forEach(function (st) { messBeobachter.observe(st); });

  /* Und ein zweiter Beobachter für den Fall, den der erste NICHT sieht: Font
     Awesome TAUSCHT das <i> gegen ein <svg> aus. Das ist keine Größenänderung
     eines beobachteten Elements, sondern ein Austausch von Kindern — gemessen:
     der ResizeObserver lief dabei kein einziges Mal nach. Auf Kinderwechsel
     hört dieser hier.

     Keine Rückkopplung: wir ändern nur Klassen (Attribute), und darauf achtet
     er nicht. */
  if (window.MutationObserver && wurzel) {
    if (tauschBeobachter) { tauschBeobachter.disconnect(); }
    tauschBeobachter = new MutationObserver(function () { engePruefen(); });
    tauschBeobachter.observe(wurzel, { childList: true, subtree: true });
  }
}

function symboleErsetzen() {
  // Font Awesome ersetzt <i> erst nachträglich durch <svg>; über document.body
  // und nicht über einen engeren Knoten — mit engerem blieb es im Prüflauf aus.
  try {
    if (window.FontAwesome && window.FontAwesome.dom) {
      window.FontAwesome.dom.i2svg({ node: document.body });
    }
  } catch (e) { /* ohne Font Awesome bleiben die Kästchen leer */ }
  /* NACH dem Tausch noch einmal messen: ein <i> ohne Satz ist null Pixel breit,
     das Symbol danach dreizehn — vorher gemessen hieße, mit der falschen
     Breite zu rechnen.

     UND NOCH EINMAL VERZÖGERT: lädt der Symbolsatz noch, tut i2svg gerade
     nichts, und sein eigener Beobachter setzt die Symbole erst danach ein. Dann
     wäre alles gemessen, bevor irgendetwas Breite hatte — im Bild sah man das
     als angeschnittenes „784 · 9 r". */
  engePruefen();
  setTimeout(engePruefen, 300);
  setTimeout(engePruefen, 1200);
}

function handleMessage(daten) {
  if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
  if (!daten || typeof daten !== 'object') { return; }
  zustand = daten;
  zeichne();
}
window.handleMessage = handleMessage;

/* Melden, dass jemand hinsieht — beim Öffnen und dann weiter im Minutentakt.
   Der Stempel drüben verfällt nach drei Minuten, und ohne ihn hört das Modul
   auf, bei der Fahrplanauskunft zu fragen: gemessen am 12.09.2026 stand die
   Tafel nach einer einzigen Meldung 2:50 nach dem letzten Abruf still,
   während die Kachel offen war. Das ist der EINZIGE Zyklus hier — die Daten
   selbst kommen geschoben (UpdateVisualizationValue → handleMessage).

   Nur bei sichtbarer Kachel: eine, die hinter einer anderen Seite liegt, soll
   keine fremde Schnittstelle beschäftigen. Und die Antwort auf jede Meldung
   zeichnet mit, was ohnehin nötig ist — die Minuten laufen weiter. */
if (typeof requestAction === 'function') {
  const melden = () => { try { requestAction('GetState', ''); } catch (e) { /* außerhalb der Visu */ } };
  melden();
  setInterval(() => { if (document.visibilityState === 'visible') melden(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') melden();
  });
}
</script>
</body>
</html>
