<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Der Icon-Satz von Symcon. OHNE ihn bleiben alle <i> leere Kästen — die
     Linien hätten kein Symbol, der Fußweg keins, das Kind keins.

     Und es MUSS ein vollständiges Dokument sein, kein Fragment: wo ein Fragment
     eingehängt wird, entscheidet der Wirt, und ein über innerHTML eingesetzter
     script-Verweis läuft gar nicht. Genau daran hing es hier — die Kachel war
     ein Fragment und blieb deshalb ohne jedes Symbol. Die übrigen Kacheln sind
     seit jeher ganze Dokumente mit dem Verweis im Kopf. -->
<script src="/icons.js"></script>
<style>
/* Symcon injiziert --card-color, --content-color und --accent-color je nach
   Visu-Design. Alles hier leitet sich daraus ab — keine Fremd-Assets.
   Gerüst und Scrollrezept sind aus den übrigen SymDo-Kacheln übernommen:
   dieselben Fallen, dieselbe Lösung. */
:root {
  --bg: var(--card-color, #2b2c30);
  --text: var(--content-color, #ffffff);
  --akzent: var(--accent-color, #00cdab);
  --zeile: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --dezent: color-mix(in srgb, var(--content-color) 55%, transparent);
  --rand: color-mix(in srgb, var(--content-color) 12%, transparent);
  --warn: #E53935;
  /* Die Ränder, die Symcon der Kachel mitgibt — siehe den Leser unten. */
  --sym-mt: 0px;
  --sym-ms: 0px;
  --sym-mb: 0px;
}
html { height: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; }
body {
  margin: 0 !important; padding: 0 !important;
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: transparent; color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
}
/* Die Polsterung trägt die Ränder von Symcon MIT: ohne sie schiebt sich der
   Inhalt oben unter die Leiste der Visualisierung. `env(safe-area-inset-top)`
   steht daneben für das iPhone mit Aussparung — es gilt, was größer ist. */
#wurzel {
  flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  box-sizing: border-box;
  padding: calc(max(var(--sym-mt), env(safe-area-inset-top, 0px)) + 10px)
           calc(var(--sym-ms) + 12px)
           calc(var(--sym-mb) + 10px)
           calc(var(--sym-ms) + 12px);
}

/* Kopfzeile: nur der Umschalter, rechtsbündig. */
.kopf { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 0 0 auto; }
/* Wem gehört das? Bild und Name über den Karten des Kindes. */
.wem { display: flex; align-items: center; gap: 7px; margin: 2px 0 4px 2px; font-size: 12px; font-weight: 700; }
.wem .gesicht { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }
.wem .gesicht.ersatz {
  display: flex; align-items: center; justify-content: center;
  background: var(--akzent); color: #fff; font-size: 11px; font-weight: 800;
}
.umschalter { display: flex; flex: 0 0 auto; border-radius: 999px; overflow: hidden; background: var(--zeile); }
.umschalter button {
  border: 0; padding: 4px 12px; cursor: pointer; background: transparent;
  color: var(--dezent); font-size: 11px; font-weight: 700;
}
.umschalter button.an { background: var(--akzent); color: #fff; }

.liste { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
/* Hausrezept für Scrollleisten: schmal, Griff in der Akzentfarbe. */
.liste::-webkit-scrollbar { width: 6px; }
.liste::-webkit-scrollbar-thumb { background: var(--akzent); border-radius: 3px; }
.liste::-webkit-scrollbar-track { background: transparent; }

.karte { background: var(--zeile); border-radius: 12px; padding: 8px 10px; overflow: hidden; }
.karte .titel {
  display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px;
  font-size: 12px; font-weight: 700;
}
.karte .titel .neben { font-weight: 500; font-size: 11px; color: var(--dezent); }
.veraltet { color: var(--warn); font-size: 10px; font-weight: 700; }

/* ── Abfahrtstafel ─────────────────────────────────────────────────────── */
.abfahrt {
  /* minmax(0,1fr), nicht 1fr: eine Grid-Spalte ist von Haus aus mindestens so
     breit wie ihr längstes Wort — sonst wächst die Karte über die Kachel
     hinaus, statt den Zielnamen zu kürzen. */
  display: grid; grid-template-columns: 20px 54px minmax(0, 1fr) auto; align-items: center;
  gap: 8px; padding: 4px 0; border-top: 1px solid var(--rand);
}
.abfahrt:first-of-type { border-top: 0; }
.abfahrt .sym { color: var(--dezent); text-align: center; }
.abfahrt .linie { font-weight: 800; font-size: 12px; }
.abfahrt .ziel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.abfahrt .wann { text-align: right; font-weight: 700; white-space: nowrap; }
.abfahrt .wann .spaet { color: var(--warn); font-size: 11px; margin-left: 3px; }
.abfahrt .wann .steig { color: var(--dezent); font-weight: 500; font-size: 10px; margin-left: 4px; }
/* Was mit dem eigenen Fußweg nicht mehr zu schaffen ist, tritt zurück —
   weggelassen wird es nicht: „der wäre gegangen" ist auch eine Auskunft. */
.abfahrt.weg { opacity: .45; }
.abfahrt.entfaellt .linie, .abfahrt.entfaellt .ziel { text-decoration: line-through; }

/* ── Streckenachse ─────────────────────────────────────────────────────── */
.fahrt { margin-top: 8px; }
.fahrt:first-of-type { margin-top: 0; }
.fahrt .zeilen { display: flex; align-items: baseline; gap: 6px; font-size: 11px; margin-bottom: 3px; }
.fahrt .zeilen .stark { font-weight: 800; font-size: 12px; }
.fahrt .zeilen .grund { color: var(--dezent); }
/* Der Balken bildet die Tour SCHEMATISCH ab, nicht nach Dauer.
   Vorher waren die Stücke breit nach Minuten — dabei blieben dem Fußweg 54
   Pixel, von denen Symbol und Polsterung 39 fraßen, und „4 min" wurde
   abgeschnitten. Jetzt bekommen Fußweg und Wartezeit genau die Breite, die ihr
   Inhalt braucht; die Fahrten teilen sich den Rest zu gleichen Teilen. Damit
   ist jede Angabe lesbar, und die Reihenfolge der Tour bleibt erhalten — nur
   die Länge sagt nichts mehr über die Dauer. Die steht in den Stücken. */
.balken { position: relative; display: flex; height: 26px; border-radius: 13px; overflow: hidden; background: var(--rand); }
.stueck {
  box-sizing: border-box;
  display: flex; align-items: center; gap: 4px; overflow: hidden;
  padding: 0 8px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap;
  flex: 0 0 auto;               /* Fußweg und Warten: so breit wie ihr Inhalt */
}
/* Die Fahrten teilen sich den Rest — im Verhältnis ihrer Fahrzeit. Das
   flex-grow je Stück setzt das Markup (die Sekunden). */
.stueck.ride { flex: 1 1 0; min-width: 0; }
.stueck.ride { background: var(--akzent); }
/* Die Wartezeit ist weder Fahren noch Laufen: neutral gefüllt, ohne Farbe. Sie
   hat erst seit dem Warte-Abschnitt ein Stück — vorher endete der Balken zu
   früh und niemand sah, dass am Umstieg gewartet wird. */
.stueck.wait {
  background: color-mix(in srgb, var(--content-color) 14%, transparent);
  color: var(--dezent);
}
/* Der Fußweg ist kein Fahren: gestrichelt und blass, damit die Zeitachse auf
   einen Blick sagt, wo man selbst läuft. */
.stueck.walk {
  background: color-mix(in srgb, var(--akzent) 22%, transparent);
  color: var(--text);
  border: 1px dashed color-mix(in srgb, var(--content-color) 35%, transparent);
}
/* Die Minutenzeile spiegelt den Balken: gleiche Anteile, gleiche Polsterung —
   so sitzt jede Zahl unter ihrem Stück. Abgeschnitten statt umgebrochen, sonst
   verschiebt ein zu langes Wort die ganze Reihe. */
.fahrt .fuss { display: flex; justify-content: space-between; font-size: 10px; color: var(--dezent); margin-top: 2px; }
.leer { color: var(--dezent); font-size: 12px; text-align: center; padding: 14px 0; }
</style>
</head>
<body>

<div id="wurzel"><div class="leer">…</div></div>

<script>
/* In der Visu stehen `translate` und `requestAction` als Top-Level-Bindungen
   bereit; hier nicht neu deklarieren, sonst kollidiert es. */
let zustand = { v: 1, now: 0, view: 'departures', stops: [], routes: [], blocked: false };
let ansicht = null;      // 'departures' | 'routes' — Wahl des Betrachters

/* Symcon reicht die Ränder der Kachel als Adresszusatz herein
   (margintop/marginside/marginbottom). Ohne sie stünde der Inhalt oben unter
   der Leiste der Visualisierung. Fehlen sie, bleibt es bei 0 — dasselbe
   Vorgehen wie in den übrigen SymDo-Kacheln. */
(function () {
  try {
    const p = new URLSearchParams(window.location.search);
    const px = function (name) {
      const v = parseInt(p.get(name), 10);
      return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    const wurzel = document.documentElement.style;
    const mt = px('margintop');    if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
    const ms = px('marginside');   if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
    const mb = px('marginbottom'); if (mb !== null) { wurzel.setProperty('--sym-mb', mb); }
  } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
})();

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function symbol(klasse) { return klasse ? '<i class="fa-light ' + esc(klasse) + '"></i>' : ''; }

function merker(name, wert) {
  try {
    if (wert === undefined) return window.localStorage.getItem('symdo.vrr.' + name);
    window.localStorage.setItem('symdo.vrr.' + name, wert);
  } catch (e) { /* Privates Fenster: dann eben ohne Gedächtnis */ }
  return null;
}

/**
 * Die Kopfzeile: nur der Umschalter.
 *
 * Hier standen einmal Filterknöpfe — ein Haus für „alle" und je ein Knopf pro
 * Mitglied. Das war zweimal falsch: es sah aus wie eine Auswahl, ohne eine zu
 * brauchen (die Kachel zeigt ohnehin nur, was eingerichtet ist), und niemand
 * konnte ihm ansehen, wozu es gut sein sollte. Wem eine Verbindung gehört,
 * sagt jetzt die Überschrift über seinen Karten — mit Bild und Namen.
 */
function kopfHtml() {
  const hatBeides = (zustand.stops || []).length > 0 && (zustand.routes || []).length > 0;
  if (!hatBeides) { return ''; }
  return '<div class="kopf"><div class="umschalter">'
    + '<button data-ansicht="departures" class="' + (ansicht === 'routes' ? '' : 'an') + '">'
    + esc(translate('Departures')) + '</button>'
    + '<button data-ansicht="routes" class="' + (ansicht === 'routes' ? 'an' : '') + '">'
    + esc(translate('Routes')) + '</button></div></div>';
}

/** Bild und Name des Kindes — die Überschrift über seinen Karten. */
function wemHtml(e) {
  if (!e.member) { return ''; }
  const name = e.memberName || '';
  const bild = e.memberAvatar
    ? '<img class="gesicht" src="' + esc(e.memberAvatar) + '" alt="">'
    : '<span class="gesicht ersatz">' + esc((name || '?').slice(0, 1).toUpperCase()) + '</span>';
  return '<div class="wem">' + bild + '<span>' + esc(name) + '</span></div>';
}

/**
 * Die Karten nach Mitglied gruppiert, jede Gruppe mit Bild und Namen darüber.
 * Was niemandem zugeordnet ist, steht ohne Überschrift oben — es gehört allen.
 */
function gruppiert(eintraege, karteBauen) {
  const reihenfolge = [];
  const gruppen = {};
  eintraege.forEach(function (e) {
    const id = e.member || '';
    if (!gruppen[id]) { gruppen[id] = []; reihenfolge.push(id); }
    gruppen[id].push(e);
  });
  reihenfolge.sort(function (a, b) { return (a === '' ? -1 : 0) - (b === '' ? -1 : 0); });
  return reihenfolge.map(function (id) {
    return (id ? wemHtml(gruppen[id][0]) : '') + gruppen[id].map(karteBauen).join('');
  }).join('');
}

function abfahrtenHtml() {
  const stops = zustand.stops || [];
  if (stops.length === 0) { return '<div class="leer">' + esc(translate('No stop set up')) + '</div>'; }
  return gruppiert(stops, function (s) {
    const zeilen = (s.departures || []).map(function (d) {
      const klassen = 'abfahrt' + (d.reachable ? '' : ' weg') + (d.cancelled ? ' entfaellt' : '');
      /* Mit gepflegtem Fußweg zählt „wann muss ich los", sonst „wann fährt es".
         Das ist die Zahl, auf die man wirklich schaut. */
      const min = s.walk > 0 ? d.leaveIn : d.countdown;
      const wann = d.cancelled ? esc(translate('cancelled'))
        : (min <= 0 ? esc(translate('now')) : min + '&nbsp;' + esc(translate('min')));
      return '<div class="' + klassen + '" title="' + esc(d.product + ' ' + d.line + ' → ' + d.destination
             + ', ' + translate('scheduled') + ' ' + d.planned) + '">'
        + '<span class="sym">' + symbol(d.icon) + '</span>'
        + '<span class="linie">' + esc(d.line) + '</span>'
        + '<span class="ziel">' + esc(d.destination) + '</span>'
        + '<span class="wann">' + wann
        + (d.delay > 0 ? '<span class="spaet">+' + d.delay + '</span>' : '')
        + (d.platform ? '<span class="steig">' + esc(translate('Pl.')) + ' ' + esc(d.platform) + '</span>' : '')
        + '</span></div>';
    }).join('');
    return '<div class="karte">'
      + '<div class="titel"><span>' + esc(s.name) + '</span>'
      + (s.walk > 0 ? '<span class="neben">' + esc(translate('incl. %s min walk').replace('%s', s.walk)) + '</span>' : '')
      + (s.stale ? '<span class="veraltet">' + esc(translate('outdated')) + '</span>' : '')
      + '</div>'
      + (zeilen || '<div class="leer">' + esc(translate('no departures')) + '</div>')
      + '</div>';
  });
}

/**
 * Die Zeitachse einer Verbindung: ein Stück je Abschnitt, breit nach Dauer.
 *
 * IM Balken steht nur die Liniennummer — und auch die nur beim Fahren. Die
 * Minuten der Fuß- und Wartewege standen dort früher mit drin und wurden
 * abgeschnitten, sobald das Stück schmal war: bei einer Verbindung von 33
 * Minuten blieben dem Fußweg 54 Pixel, von denen Symbol und Polsterung 39
 * fraßen. Wie viel Zeit wohin geht, sagt jetzt die Zeile darunter — die ist
 * immer lesbar, egal wie schmal das Stück ist.
 */
function balkenHtml(v) {
  return '<div class="balken">' + (v.legs || []).map(function (l) {
    const min = Math.round(l.seconds / 60) + ' ' + translate('min');
    const text = l.kind === 'ride' ? ((l.line || l.product) + ' · ' + min) : min;
    const was = l.kind === 'walk' ? translate('walking')
              : (l.kind === 'wait' ? translate('waiting') : (l.line || l.product));
    /* Nur die FAHRTEN wachsen, und zwar im Verhältnis ihrer Fahrzeit
       zueinander: flex-grow bekommt die Sekunden. Der Rest des Balkens — was
       Fußweg und Warten übrig lassen — verteilt sich damit so, wie die Fahrten
       zueinander stehen. Eine Untergrenze gibt es bewusst nicht; sie würde
       genau das Verhältnis verfälschen, um das es hier geht. */
    const wachsen = l.kind === 'ride' ? ' style="flex-grow:' + Math.max(1, l.seconds) + '"' : '';
    return '<div class="stueck ' + esc(l.kind) + '"' + wachsen + ' title="'
      + esc(was + ' ' + min + ', ' + l.from + ' ' + l.depText + ' → ' + l.to + ' ' + l.arrText) + '">'
      + symbol(l.icon) + '<span>' + esc(text) + '</span></div>';
  }).join('') + '</div>';
}


function streckenHtml() {
  const routen = zustand.routes || [];
  if (routen.length === 0) { return '<div class="leer">' + esc(translate('No route set up')) + '</div>'; }
  return gruppiert(routen, function (r) {
    const s = r.school;
    /* Beim Schulweg sagt die Kopfzeile die Richtung — sie wechselt im Lauf des
       Tages von selbst, und ohne das Wort wüsste niemand, welche man sieht. */
    let hinweis = '';
    if (s) {
      hinweis = s.direction === 'to'
        ? translate('to school, be there by %s').replace('%s', s.targetTime)
        : (s.fromNow
            ? translate('home, from now')
            : translate('home, lessons end at %s').replace('%s', s.schoolEnd));
    }
    const fahrten = (r.journeys || []).map(function (v) {
      return '<div class="fahrt">'
        + '<div class="zeilen"><span class="stark">' + esc(v.departureText) + '</span>'
        + '<span class="grund">→</span><span class="stark">' + esc(v.arrivalText) + '</span>'
        + '<span class="grund">' + Math.round(v.seconds / 60) + ' ' + esc(translate('min'))
        + (v.interchanges > 0
            ? ' · ' + v.interchanges + ' ' + esc(translate('changes'))
            : ' · ' + esc(translate('direct'))) + '</span></div>'
        + balkenHtml(v)
        + '<div class="fuss"><span>' + esc((v.legs[0] || {}).from || '') + '</span>'
        + '<span>' + esc((v.legs[v.legs.length - 1] || {}).to || '') + '</span></div>'
        + '</div>';
    }).join('');
    return '<div class="karte">'
      + '<div class="titel"><span>' + esc(r.name || r.memberName) + '</span>'
      + (hinweis ? '<span class="neben">' + esc(hinweis) + '</span>' : '')
      + (r.stale ? '<span class="veraltet">' + esc(translate('outdated')) + '</span>' : '')
      + '</div>'
      + (fahrten || '<div class="leer">' + esc(translate('no journey found')) + '</div>')
      + '</div>';
  });
}

function zeichne() {
  if (ansicht === null) {
    ansicht = merker('ansicht') || zustand.view || 'departures';
  }
  // Gibt es nur eine Sorte, ist der Umschalter Lärm — dann gilt sie.
  let jetzt = ansicht;
  if ((zustand.routes || []).length === 0) { jetzt = 'departures'; }
  if ((zustand.stops || []).length === 0 && (zustand.routes || []).length > 0) { jetzt = 'routes'; }

  document.getElementById('wurzel').innerHTML =
      kopfHtml() + '<div class="liste">'
    + (jetzt === 'routes' ? streckenHtml() : abfahrtenHtml())
    + '</div>';

  document.querySelectorAll('[data-ansicht]').forEach(function (b) {
    b.addEventListener('click', function () {
      ansicht = b.dataset.ansicht; merker('ansicht', ansicht); zeichne();
    });
  });
  symboleErsetzen();
}

function symboleErsetzen() {
  // Font Awesome ersetzt <i> erst nachträglich durch <svg>; über document.body
  // und nicht über einen engeren Knoten — mit engerem blieb es im Prüflauf aus.
  try {
    if (window.FontAwesome && window.FontAwesome.dom) {
      window.FontAwesome.dom.i2svg({ node: document.body });
    }
  } catch (e) { /* ohne Font Awesome bleiben die Kästchen leer */ }
}

function handleMessage(daten) {
  if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
  if (!daten || typeof daten !== 'object') { return; }
  zustand = daten;
  zeichne();
}
window.handleMessage = handleMessage;

/* Beim Öffnen einmal melden: das setzt drüben den Zuschauer-Stempel und damit
   den Minutentakt in Gang. Ohne das stünde die Kachel still, bis der nächste
   Lauf zufällig vorbeikommt. */
if (typeof requestAction === 'function') {
  try { requestAction('GetState', ''); } catch (e) { /* außerhalb der Visu */ }
}
</script>
</body>
</html>
