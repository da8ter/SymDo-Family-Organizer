<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Der Icon-Satz von Symcon. OHNE ihn bleiben alle <i> leere Kästen — die
     Linien hätten kein Symbol, der Fußweg keins, das Kind keins.

     Und es MUSS ein vollständiges Dokument sein, kein Fragment: wo ein Fragment
     eingehängt wird, entscheidet der Wirt, und ein über innerHTML eingesetzter
     script-Verweis läuft gar nicht. Genau daran hing es hier — die Kachel war
     ein Fragment und blieb deshalb ohne jedes Symbol. Die übrigen Kacheln sind
     seit jeher ganze Dokumente mit dem Verweis im Kopf. -->
<script src="/icons.js"></script>
<style>
/* Symcon injiziert --card-color, --content-color und --accent-color je nach
   Visu-Design. Alles hier leitet sich daraus ab — keine Fremd-Assets.
   Gerüst und Scrollrezept sind aus den übrigen SymDo-Kacheln übernommen:
   dieselben Fallen, dieselbe Lösung. */
:root {
  --bg: var(--card-color, #2b2c30);
  --text: var(--content-color, #ffffff);
  --akzent: var(--accent-color, #00cdab);
  --zeile: color-mix(in srgb, var(--card-color) 92%, var(--content-color) 8%);
  --dezent: color-mix(in srgb, var(--content-color) 55%, transparent);
  --rand: color-mix(in srgb, var(--content-color) 12%, transparent);
  --warn: #E53935;
  /* Die Ränder, die Symcon der Kachel mitgibt — siehe den Leser unten. */
  --sym-mt: 0px;
  --sym-ms: 0px;
  --sym-mb: 0px;
}
html { height: 100%; margin: 0; padding: 0; display: flex; flex-direction: column; }
body {
  margin: 0 !important; padding: 0 !important;
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  background: transparent; color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px;
}
/* Die Polsterung trägt die Ränder von Symcon MIT: ohne sie schiebt sich der
   Inhalt oben unter die Leiste der Visualisierung. `env(safe-area-inset-top)`
   steht daneben für das iPhone mit Aussparung — es gilt, was größer ist. */
#wurzel {
  flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;
  box-sizing: border-box;
  /* Seitlich GENAU der Rand von Symcon, ohne eigenen Zuschlag: der eigene kam
     obendrauf und ließ die Kachel viel zu schmal wirken. Den Innenabstand
     tragen die Karten selbst. So halten es die übrigen Kacheln auch. */
  padding: calc(max(var(--sym-mt), env(safe-area-inset-top, 0px)) + 8px)
           var(--sym-ms)
           calc(var(--sym-mb) + 6px)
           var(--sym-ms);
}

/* Kopfzeile: Bild und Name links, Umschalter rechts — und bei zu langem Namen
   rutscht der Umschalter in die nächste Zeile, statt den Namen zu kürzen. */
.kopf { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; }
.kopf .umschalter { margin-left: auto; flex: 0 0 auto; }
.kopf .wem { flex: 0 1 auto; min-width: 0; margin: 0; }
/* Wem gehört das? Bild und Name über den Karten des Kindes.
   Maße wörtlich aus der Ämtchen-Kachel übernommen — dieselbe Familie soll in
   jeder Kachel gleich groß aussehen. */
.wem { display: flex; align-items: center; gap: 8px; padding: 0 4px; margin: 2px 0 6px; }
.wem .gesicht {
  width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto; overflow: hidden;
  background: color-mix(in srgb, var(--akzent) 18%, var(--bg));
  border: 2px solid var(--akzent);
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;
}
.wem .gesicht img { width: 100%; height: 100%; object-fit: cover; }
.wem .name {
  flex: 1 1 auto; min-width: 0; font-size: clamp(13px, 4vmin, 16px); font-weight: 800;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.umschalter { display: flex; flex: 0 0 auto; border-radius: 999px; overflow: hidden; background: var(--zeile); }
.umschalter button {
  border: 0; padding: 4px 12px; cursor: pointer; background: transparent;
  color: var(--dezent); font-size: 11px; font-weight: 700;
}
.umschalter button.an { background: var(--akzent); color: #fff; }

.liste { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
/* Hausrezept für Scrollleisten: schmal, Griff in der Akzentfarbe. */
.liste::-webkit-scrollbar { width: 6px; }
.liste::-webkit-scrollbar-thumb { background: var(--akzent); border-radius: 3px; }
.liste::-webkit-scrollbar-track { background: transparent; }

.karte { background: var(--zeile); border-radius: 12px; padding: 8px 10px; overflow: hidden; }
.karte .titel {
  display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px;
  font-size: 12px; font-weight: 700;
}
.karte .titel .neben { font-weight: 500; font-size: 11px; color: var(--dezent); }
.veraltet { color: var(--warn); font-size: 10px; font-weight: 700; }

/* ── Abfahrtstafel ─────────────────────────────────────────────────────── */
.abfahrt {
  /* minmax(0,1fr), nicht 1fr: eine Grid-Spalte ist von Haus aus mindestens so
     breit wie ihr längstes Wort — sonst wächst die Karte über die Kachel
     hinaus, statt den Zielnamen zu kürzen. */
  display: grid; grid-template-columns: 20px 54px minmax(0, 1fr) auto; align-items: center;
  gap: 8px; padding: 4px 0; border-top: 1px solid var(--rand);
}
.abfahrt:first-of-type { border-top: 0; }
/* Das Fahrzeug traegt die Akzentfarbe: es ist das einzige Zeichen in der Zeile,
   das die Art der Fahrt nennt — Bus, Bahn, S-Bahn —, und in Grau ging es neben
   der fetten Liniennummer unter. */
.abfahrt .sym { color: var(--akzent); text-align: center; }
.abfahrt .linie { font-weight: 800; font-size: 12px; }
.abfahrt .ziel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Der Pfeil sagt „dorthin" und gehoert zum Ziel — aber nicht zu seinem Text:
   als inline-block laeuft der Streichstrich einer entfallenen Fahrt nicht durch
   ihn hindurch. Kleiner und zurueckhaltend, damit er die Zeile fuehrt statt sie
   zu beherrschen. */
.abfahrt .ziel .pfeil { display: inline-block; color: var(--dezent); font-size: 10px; margin-right: 5px; }
.abfahrt .wann { text-align: right; font-weight: 700; white-space: nowrap; }
.abfahrt .wann .spaet { color: var(--warn); font-size: 11px; margin-left: 3px; }
.abfahrt .wann .steig { color: var(--dezent); font-weight: 500; font-size: 10px; margin-left: 4px; }
/* Was mit dem eigenen Fußweg nicht mehr zu schaffen ist, tritt zurück —
   weggelassen wird es nicht: „der wäre gegangen" ist auch eine Auskunft. */
.abfahrt.weg { opacity: .45; }
.abfahrt.entfaellt .linie, .abfahrt.entfaellt .ziel { text-decoration: line-through; }

/* ── Streckenachse ─────────────────────────────────────────────────────── */
/* Die Schiene: eine Verbindung je Bildbreite, mit Einrasten. */
.fahrten {
  display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none;
}
.fahrten::-webkit-scrollbar { display: none; }
.fahrt { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; }
/* Die Punkte: mittig, der aktuelle in der Akzentfarbe. */
.punkte { display: flex; justify-content: center; gap: 12px; margin-top: 6px; }
/* Die Punkte sind auch der Mausweg zur naechsten Verbindung — dafuer brauchen
   sie eine groessere Trefferflaeche als ihre fuenf Pixel: der Punkt ist das,
   was man sieht, das Kaestchen drumherum das, was man trifft. */
.punkte span {
  width: 5px; height: 5px; border-radius: 50%;
  background: color-mix(in srgb, var(--content-color) 25%, transparent);
  cursor: pointer; box-sizing: content-box; padding: 5px; margin: -5px;
  background-clip: content-box;
}
/* background-COLOR, nicht die Kurzform: `background:` setzt `background-clip`
   auf seinen Anfangswert zurueck, und aus dem Punkt wuerde die ganze
   Trefferflaeche — ein Klecks von fuenfzehn Pixeln. Genau so gesehen. */
.punkte span.an { background-color: var(--akzent); }
.fahrt .zeilen { display: flex; align-items: baseline; gap: 6px; font-size: 11px; margin-bottom: 3px; }
.fahrt .zeilen .stark { font-weight: 800; font-size: 12px; }
.fahrt .zeilen .grund { color: var(--dezent); }
/* Der Balken bildet die Tour SCHEMATISCH ab, nicht nach Dauer.
   Vorher waren die Stücke breit nach Minuten — dabei blieben dem Fußweg 54
   Pixel, von denen Symbol und Polsterung 39 fraßen, und „4 min" wurde
   abgeschnitten. Jetzt bekommen Fußweg und Wartezeit genau die Breite, die ihr
   Inhalt braucht; die Fahrten teilen sich den Rest zu gleichen Teilen. Damit
   ist jede Angabe lesbar, und die Reihenfolge der Tour bleibt erhalten — nur
   die Länge sagt nichts mehr über die Dauer. Die steht in den Stücken. */
.balken { position: relative; display: flex; height: 26px; border-radius: 13px; overflow: hidden; background: var(--rand); }
.stueck {
  box-sizing: border-box;
  display: flex; align-items: center; gap: 4px; overflow: hidden;
  padding: 0 8px; font-size: 11px; font-weight: 700; color: #fff; white-space: nowrap;
  flex: 0 0 auto;               /* Fußweg und Warten: so breit wie ihr Inhalt */
}
/* Die Fahrten teilen sich den Rest — im Verhältnis ihrer Fahrzeit. Das
   flex-grow je Stück setzt das Markup (die Sekunden). */
.stueck.ride { flex: 1 1 0; min-width: 0; }
/* Wird es eng, fällt zuerst das Symbol, dann die Fahrzeit. Die Liniennummer
   bleibt: sie ist die Auskunft, alles andere ist Beiwerk.
   WER zu eng ist, entscheidet eine Messung je Stück (engePruefen) und keine
   feste Schwelle: „S1 · 13 min" braucht 103 Pixel, „RE12 · 40 min" aber 121 —
   eine Schwelle für beide nähme einem von ihnen das Symbol grundlos weg. */
.stueck.ohne-symbol > svg, .stueck.ohne-symbol > i { display: none; }
.stueck.ohne-zeit .zeit { display: none; }
.stueck.ride { background: var(--akzent); }
/* Die Wartezeit ist weder Fahren noch Laufen: neutral gefüllt, ohne Farbe. Sie
   hat erst seit dem Warte-Abschnitt ein Stück — vorher endete der Balken zu
   früh und niemand sah, dass am Umstieg gewartet wird. */
.stueck.wait {
  background: color-mix(in srgb, var(--content-color) 14%, transparent);
  color: var(--dezent);
}
/* Der Fußweg ist kein Fahren: blass statt kräftig, damit die Zeitachse auf
   einen Blick sagt, wo man selbst läuft. */
.stueck.walk {
  background: color-mix(in srgb, var(--akzent) 22%, transparent);
  color: var(--text);
}
/* Die Minutenzeile spiegelt den Balken: gleiche Anteile, gleiche Polsterung —
   so sitzt jede Zahl unter ihrem Stück. Abgeschnitten statt umgebrochen, sonst
   verschiebt ein zu langes Wort die ganze Reihe. */
.fahrt .fuss { display: flex; justify-content: space-between; font-size: 10px; color: var(--dezent); margin-top: 2px; }
.leer { color: var(--dezent); font-size: 12px; text-align: center; padding: 14px 0; }
</style>
</head>
<body>

<div id="wurzel"><div class="leer">…</div></div>

<script>
/* In der Visu stehen `translate` und `requestAction` als Top-Level-Bindungen
   bereit; hier nicht neu deklarieren, sonst kollidiert es. */
let zustand = { v: 1, now: 0, view: 'departures', stops: [], routes: [], blocked: false };
let ansicht = null;      // 'departures' | 'routes' — Wahl des Betrachters

/* Symcon reicht die Ränder der Kachel als Adresszusatz herein
   (margintop/marginside/marginbottom). Ohne sie stünde der Inhalt oben unter
   der Leiste der Visualisierung. Fehlen sie, bleibt es bei 0 — dasselbe
   Vorgehen wie in den übrigen SymDo-Kacheln. */
(function () {
  try {
    const p = new URLSearchParams(window.location.search);
    const px = function (name) {
      const v = parseInt(p.get(name), 10);
      return (Number.isFinite(v) && v >= 0) ? v + 'px' : null;
    };
    const wurzel = document.documentElement.style;
    const mt = px('margintop');    if (mt !== null) { wurzel.setProperty('--sym-mt', mt); }
    const ms = px('marginside');   if (ms !== null) { wurzel.setProperty('--sym-ms', ms); }
    const mb = px('marginbottom'); if (mb !== null) { wurzel.setProperty('--sym-mb', mb); }
  } catch (e) { /* ohne Adresszusatz gelten die Vorgaben (0) */ }
})();

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function symbol(klasse) { return klasse ? '<i class="fa-light ' + esc(klasse) + '"></i>' : ''; }

function merker(name, wert) {
  try {
    if (wert === undefined) return window.localStorage.getItem('symdo.vrr.' + name);
    window.localStorage.setItem('symdo.vrr.' + name, wert);
  } catch (e) { /* Privates Fenster: dann eben ohne Gedächtnis */ }
  return null;
}

/**
 * Die Kopfzeile: nur der Umschalter.
 *
 * Hier standen einmal Filterknöpfe — ein Haus für „alle" und je ein Knopf pro
 * Mitglied. Das war zweimal falsch: es sah aus wie eine Auswahl, ohne eine zu
 * brauchen (die Kachel zeigt ohnehin nur, was eingerichtet ist), und niemand
 * konnte ihm ansehen, wozu es gut sein sollte. Wem eine Verbindung gehört,
 * sagt jetzt die Überschrift über seinen Karten — mit Bild und Namen.
 */
function kopfHtml() {
  const hatBeides = (zustand.stops || []).length > 0 && (zustand.routes || []).length > 0;
  /* Gehört alles EINEM Kind, stehen Bild und Name hier oben neben dem
     Umschalter statt über jeder Gruppe — eine Zeile statt zweier. Wird der Name
     zu lang, rutscht der Umschalter darunter (flex-wrap), statt den Namen
     abzuschneiden: der Name ist die Auskunft. */
  const einer = alleinigesMitglied();
  const wer = einer ? wemHtml(einer) : '';
  const um = hatBeides
    ? '<div class="umschalter">'
      + '<button data-ansicht="departures" class="' + (ansicht === 'routes' ? '' : 'an') + '">'
      + esc(translate('Departures')) + '</button>'
      + '<button data-ansicht="routes" class="' + (ansicht === 'routes' ? 'an' : '') + '">'
      + esc(translate('Routes')) + '</button></div>'
    : '';
  return (wer || um) ? '<div class="kopf">' + wer + um + '</div>' : '';
}

/** Der eine Eintrag, dem ALLES gehört — sonst null. */
function alleinigesMitglied() {
  const alle = (zustand.stops || []).concat(zustand.routes || []);
  const ids = {};
  alle.forEach(function (e) { ids[e.member || ''] = e; });
  const schluessel = Object.keys(ids);
  return (schluessel.length === 1 && schluessel[0] !== '') ? ids[schluessel[0]] : null;
}

/** Bild und Name des Kindes — die Überschrift über seinen Karten. */
function wemHtml(e) {
  if (!e.member) { return ''; }
  const name = e.memberName || '';
  // Das Bild steckt IM Kreis, nicht als Kreis — wie in der Ämtchen-Kachel:
  // so trägt der Rand auch den Anfangsbuchstaben, wenn kein Foto hinterlegt ist.
  const inhalt = e.memberAvatar
    ? '<img src="' + esc(e.memberAvatar) + '" alt="">'
    : esc((name || '?').slice(0, 1).toUpperCase());
  return '<div class="wem"><div class="gesicht">' + inhalt + '</div>'
    + '<span class="name">' + esc(name) + '</span></div>';
}

/**
 * Die Karten nach Mitglied gruppiert, jede Gruppe mit Bild und Namen darüber.
 * Was niemandem zugeordnet ist, steht ohne Überschrift oben — es gehört allen.
 */
function gruppiert(eintraege, karteBauen) {
  const reihenfolge = [];
  const gruppen = {};
  eintraege.forEach(function (e) {
    const id = e.member || '';
    if (!gruppen[id]) { gruppen[id] = []; reihenfolge.push(id); }
    gruppen[id].push(e);
  });
  reihenfolge.sort(function (a, b) { return (a === '' ? -1 : 0) - (b === '' ? -1 : 0); });
  // Steht der Name schon in der Kopfzeile, wäre die Überschrift eine Dopplung.
  const oben = alleinigesMitglied() !== null;
  return reihenfolge.map(function (id) {
    return (id && !oben ? wemHtml(gruppen[id][0]) : '') + gruppen[id].map(karteBauen).join('');
  }).join('');
}

function abfahrtenHtml() {
  const stops = zustand.stops || [];
  if (stops.length === 0) { return '<div class="leer">' + esc(translate('No stop set up')) + '</div>'; }
  return gruppiert(stops, function (s) {
    const zeilen = (s.departures || []).map(function (d) {
      const klassen = 'abfahrt' + (d.reachable ? '' : ' weg') + (d.cancelled ? ' entfaellt' : '');
      /* Mit gepflegtem Fußweg zählt „wann muss ich los", sonst „wann fährt es".
         Das ist die Zahl, auf die man wirklich schaut. */
      const min = s.walk > 0 ? d.leaveIn : d.countdown;
      const wann = d.cancelled ? esc(translate('cancelled'))
        : (min <= 0 ? esc(translate('now')) : min + '&nbsp;' + esc(translate('min')));
      return '<div class="' + klassen + '" title="' + esc(d.product + ' ' + d.line + ' → ' + d.destination
             + ', ' + translate('scheduled') + ' ' + d.planned) + '">'
        + '<span class="sym">' + symbol(d.icon) + '</span>'
        + '<span class="linie">' + esc(d.line) + '</span>'
        + '<span class="ziel"><span class="pfeil">' + symbol('fa-arrow-right') + '</span>'
        + esc(d.destination) + '</span>'
        + '<span class="wann">' + wann
        + (d.delay > 0 ? '<span class="spaet">+' + d.delay + '</span>' : '')
        + (d.platform ? '<span class="steig">' + esc(translate('Pl.')) + ' ' + esc(d.platform) + '</span>' : '')
        + '</span></div>';
    }).join('');
    return '<div class="karte">'
      + '<div class="titel"><span>' + esc(s.name) + '</span>'
      + (s.walk > 0 ? '<span class="neben">' + esc(translate('incl. %s min walk').replace('%s', s.walk)) + '</span>' : '')
      + (s.stale ? '<span class="veraltet">' + esc(translate('outdated')) + '</span>' : '')
      + '</div>'
      + (zeilen || '<div class="leer">' + esc(translate('no departures')) + '</div>')
      + '</div>';
  });
}

/**
 * Die Zeitachse einer Verbindung: ein Stück je Abschnitt, breit nach Dauer.
 *
 * IM Balken steht nur die Liniennummer — und auch die nur beim Fahren. Die
 * Minuten der Fuß- und Wartewege standen dort früher mit drin und wurden
 * abgeschnitten, sobald das Stück schmal war: bei einer Verbindung von 33
 * Minuten blieben dem Fußweg 54 Pixel, von denen Symbol und Polsterung 39
 * fraßen. Wie viel Zeit wohin geht, sagt jetzt die Zeile darunter — die ist
 * immer lesbar, egal wie schmal das Stück ist.
 */
function balkenHtml(v) {
  return '<div class="balken">' + (v.legs || []).map(function (l) {
    const min = Math.round(l.seconds / 60) + ' ' + translate('min');
    /* Bei der Fahrt stehen Linie und Fahrzeit in EIGENEN Kästchen: wird das
       Stück eng, verschwindet erst das Symbol und dann die Fahrzeit — die
       Liniennummer bleibt bis zuletzt, denn sie ist die eigentliche Auskunft.
       Das entscheidet eine Container-Abfrage am Stück selbst, ohne Messung im
       Skript und ohne dass beim Ändern der Fenstergröße etwas nachlaufen muss. */
    const text = l.kind === 'ride'
      ? '<span class="linie">' + esc(l.line || l.product) + '</span>'
        + '<span class="zeit">· ' + esc(min) + '</span>'
      : '<span>' + esc(min) + '</span>';
    const was = l.kind === 'walk' ? translate('walking')
              : (l.kind === 'wait' ? translate('waiting') : (l.line || l.product));
    /* Nur die FAHRTEN wachsen, und zwar im Verhältnis ihrer Fahrzeit
       zueinander: flex-grow bekommt die Sekunden. Der Rest des Balkens — was
       Fußweg und Warten übrig lassen — verteilt sich damit so, wie die Fahrten
       zueinander stehen. Eine Untergrenze gibt es bewusst nicht; sie würde
       genau das Verhältnis verfälschen, um das es hier geht. */
    const wachsen = l.kind === 'ride' ? ' style="flex-grow:' + Math.max(1, l.seconds) + '"' : '';
    return '<div class="stueck ' + esc(l.kind) + '"' + wachsen + ' title="'
      + esc(was + ' ' + min + ', ' + l.from + ' ' + l.depText + ' → ' + l.to + ' ' + l.arrText) + '">'
      + symbol(l.icon) + text + '</div>';
  }).join('') + '</div>';
}


function streckenHtml() {
  const routen = zustand.routes || [];
  if (routen.length === 0) { return '<div class="leer">' + esc(translate('No route set up')) + '</div>'; }
  return gruppiert(routen, function (r) {
    const s = r.school;
    /* Beim Schulweg sagt die Kopfzeile die Richtung — sie wechselt im Lauf des
       Tages von selbst, und ohne das Wort wüsste niemand, welche man sieht. */
    let hinweis = '';
    if (s) {
      hinweis = s.direction === 'to'
        ? translate('to school, be there by %s').replace('%s', s.targetTime)
        : (s.fromNow
            ? translate('home, from now')
            : translate('home, lessons end at %s').replace('%s', s.schoolEnd));
    }
    const alle = (r.journeys || []);
    const fahrten = alle.map(function (v) {
      return '<div class="fahrt">'
        + '<div class="zeilen"><span class="stark">' + esc(v.departureText) + '</span>'
        + '<span class="grund">→</span><span class="stark">' + esc(v.arrivalText) + '</span>'
        + '<span class="grund">' + Math.round(v.seconds / 60) + ' ' + esc(translate('min'))
        + (v.interchanges > 0
            ? ' · ' + v.interchanges + ' ' + esc(translate('changes'))
            : ' · ' + esc(translate('direct'))) + '</span></div>'
        + balkenHtml(v)
        + '<div class="fuss"><span>' + esc((v.legs[0] || {}).from || '') + '</span>'
        + '<span>' + esc((v.legs[v.legs.length - 1] || {}).to || '') + '</span></div>'
        + '</div>';
    }).join('');
    /* Die Verbindungen liegen NEBENEINANDER und werden gewischt — untereinander
       füllten fünf Stück die ganze Kachel, und die nächste Haltestelle wäre
       niemals ins Bild gekommen. Die Punkte darunter sagen, wo man ist. */
    const punkte = alle.length > 1
      ? '<div class="punkte">' + alle.map(function (_, i) {
          return '<span class="' + (i === 0 ? 'an' : '') + '"></span>';
        }).join('') + '</div>'
      : '';
    return '<div class="karte">'
      + '<div class="titel"><span>' + esc(r.name || r.memberName) + '</span>'
      + (hinweis ? '<span class="neben">' + esc(hinweis) + '</span>' : '')
      + (r.stale ? '<span class="veraltet">' + esc(translate('outdated')) + '</span>' : '')
      + '</div>'
      + (fahrten
          ? '<div class="fahrten" data-schiene>' + fahrten + '</div>' + punkte
          : '<div class="leer">' + esc(translate(r.directOnly
              ? 'no journey without changes' : 'no journey found')) + '</div>')
      + '</div>';
  });
}

function zeichne() {
  if (ansicht === null) {
    ansicht = merker('ansicht') || zustand.view || 'departures';
  }
  // Gibt es nur eine Sorte, ist der Umschalter Lärm — dann gilt sie.
  let jetzt = ansicht;
  if ((zustand.routes || []).length === 0) { jetzt = 'departures'; }
  if ((zustand.stops || []).length === 0 && (zustand.routes || []).length > 0) { jetzt = 'routes'; }

  document.getElementById('wurzel').innerHTML =
      kopfHtml() + '<div class="liste">'
    + (jetzt === 'routes' ? streckenHtml() : abfahrtenHtml())
    + '</div>';

  engePruefen();
  messungLiveHalten();

  /* Die Punkte folgen dem Wischen. Gerechnet wird aus der Scrollposition und
     nicht über einen Beobachter: eine Schiene hat höchstens fünf Kinder, und
     ein IntersectionObserver je Karte wäre Aufwand für nichts. */
  document.querySelectorAll('[data-schiene]').forEach(function (schiene) {
    const punkte = schiene.nextElementSibling;
    if (!punkte || !punkte.classList.contains('punkte')) { return; }
    schiene.addEventListener('scroll', function () {
      const breite = schiene.clientWidth || 1;
      const n = Math.round(schiene.scrollLeft / breite);
      punkte.querySelectorAll('span').forEach(function (p, i) {
        p.classList.toggle('an', i === n);
      });
    }, { passive: true });

    /* Zur n-ten Verbindung. Gerechnet wird aus der KARTE, nicht aus der
       Kachelbreite: zwischen den Karten liegen zehn Pixel Abstand, und mit
       `n * clientWidth` haette der Sprung ab der zweiten Karte danebengelegen
       (gemessen: Rastpunkte bei 510 und 1020, nicht 500 und 1000). Das
       Einrasten zog es zwar wieder gerade — aber auf eine Rechnung, die schon
       stimmt, muss man sich nicht erst zurechtruecken lassen. */
    const zurKarte = function (n) {
      const karten = schiene.children;
      const ziel = karten[Math.max(0, Math.min(karten.length - 1, n))];
      if (!ziel) { return; }
      /* Wer Bewegung abbestellt hat, bekommt den Sprung ohne Animation. */
      const sanft = !(window.matchMedia
        && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      schiene.scrollTo({ left: ziel.offsetLeft, behavior: sanft ? 'smooth' : 'auto' });
    };

    /* Mit der Maus gibt es keine Wischgeste, und ein Rad kennt nur oben und
       unten: der Browser schickt das an die SEITE weiter, die Schiene bleibt
       stehen. Also uebersetzt: eine Raststufe schiebt um EINE Verbindung
       weiter. Schrittweise am scrollLeft zu ziehen waere falsch — das
       Einrasten (scroll-snap) zoege jeden Teilschritt sofort zurueck.
       Ein Trackpad, das quer wischt, macht es selbst; dann halten wir uns
       heraus. */
    let radSperre = 0;
    schiene.addEventListener('wheel', function (e) {
      if (schiene.scrollWidth <= schiene.clientWidth + 1) { return; }
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { return; }
      e.preventDefault();
      const jetzt = Date.now();
      if (jetzt < radSperre) { return; }
      radSperre = jetzt + 220;
      const breite = schiene.clientWidth || 1;
      zurKarte(Math.round(schiene.scrollLeft / breite) + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });

    /* Und der kurze Weg: auf einen Punkt tippen springt dorthin. Er zeigte die
       Stelle schon an, ohne dass man ihn benutzen konnte. */
    punkte.querySelectorAll('span').forEach(function (p, i) {
      p.addEventListener('click', function () { zurKarte(i); });
    });
  });

  document.querySelectorAll('[data-ansicht]').forEach(function (b) {
    b.addEventListener('click', function () {
      ansicht = b.dataset.ansicht; merker('ansicht', ansicht); zeichne();
    });
  });
  symboleErsetzen();
}

/**
 * Symbol und Fahrzeit ausblenden — aber nur, wo es wirklich nicht passt.
 *
 * Gemessen statt geschätzt: scrollWidth > clientWidth heißt „passt nicht".
 * Erst fällt das Symbol, dann die Fahrzeit; nach jedem Schritt wird neu
 * gemessen, denn das Weglassen schafft Platz.
 */
function engePruefen() {
  document.querySelectorAll('.stueck.ride').forEach(function (st) {
    const passt = function () { return st.scrollWidth <= st.clientWidth + 1; };
    st.classList.remove('ohne-symbol', 'ohne-zeit');
    if (passt()) { return; }                       // Symbol, Linie, Fahrzeit
    st.classList.add('ohne-symbol');
    if (passt()) { return; }                       // Linie und Fahrzeit
    /* Das Symbol kommt ZURÜCK, sobald die Fahrzeit weicht: „784" allein
       braucht 40 Pixel, mit Symbol 58 — bei 71 Pixeln Platz wäre es
       Verschwendung, das Feld leer zu lassen. Gemessen in der laufenden
       Kachel, die 351 Pixel breit ist. */
    st.classList.remove('ohne-symbol');
    st.classList.add('ohne-zeit');
    if (passt()) { return; }                       // Symbol und Linie
    st.classList.add('ohne-symbol');               // nur noch die Linie
  });
}

let messBeobachter = null;
let tauschBeobachter = null;
/**
 * Die Messung LAUFEND halten, nicht nur ein paarmal nach dem Zeichnen.
 *
 * Zwei Dinge ändern die Breite eines Fahrstücks, nachdem gezeichnet wurde:
 * die Kachel bekommt ihre endgültige Größe erst von der Visu, und sobald der
 * Symbolsatz geladen ist, werden Fuß- und Wartestück breiter — was die
 * Fahrten schmaler macht. Wer nur zweimal verzögert misst, trifft dann den
 * falschen Moment: im Bild fehlte dem Stück „784" das Symbol, obwohl
 * reichlich Platz war.
 *
 * Beobachtet werden die Stücke selbst. Eine Rückkopplung gibt es dabei nicht:
 * das Aus- und Einblenden ändert die Breite einer Fahrt nicht — die bestimmt
 * allein die Aufteilung des Balkens.
 */
function messungLiveHalten() {
  if (!window.ResizeObserver) {
    return;
  }
  if (messBeobachter) {
    messBeobachter.disconnect();
  } else {
    messBeobachter = new ResizeObserver(function () { engePruefen(); });
  }
  const wurzel = document.getElementById('wurzel');
  if (wurzel) { messBeobachter.observe(wurzel); }
  document.querySelectorAll('.stueck').forEach(function (st) { messBeobachter.observe(st); });

  /* Und ein zweiter Beobachter für den Fall, den der erste NICHT sieht: Font
     Awesome TAUSCHT das <i> gegen ein <svg> aus. Das ist keine Größenänderung
     eines beobachteten Elements, sondern ein Austausch von Kindern — gemessen:
     der ResizeObserver lief dabei kein einziges Mal nach. Auf Kinderwechsel
     hört dieser hier.

     Keine Rückkopplung: wir ändern nur Klassen (Attribute), und darauf achtet
     er nicht. */
  if (window.MutationObserver && wurzel) {
    if (tauschBeobachter) { tauschBeobachter.disconnect(); }
    tauschBeobachter = new MutationObserver(function () { engePruefen(); });
    tauschBeobachter.observe(wurzel, { childList: true, subtree: true });
  }
}

function symboleErsetzen() {
  // Font Awesome ersetzt <i> erst nachträglich durch <svg>; über document.body
  // und nicht über einen engeren Knoten — mit engerem blieb es im Prüflauf aus.
  try {
    if (window.FontAwesome && window.FontAwesome.dom) {
      window.FontAwesome.dom.i2svg({ node: document.body });
    }
  } catch (e) { /* ohne Font Awesome bleiben die Kästchen leer */ }
  /* NACH dem Tausch noch einmal messen: ein <i> ohne Satz ist null Pixel breit,
     das Symbol danach dreizehn — vorher gemessen hieße, mit der falschen
     Breite zu rechnen.

     UND NOCH EINMAL VERZÖGERT: lädt der Symbolsatz noch, tut i2svg gerade
     nichts, und sein eigener Beobachter setzt die Symbole erst danach ein. Dann
     wäre alles gemessen, bevor irgendetwas Breite hatte — im Bild sah man das
     als angeschnittenes „784 · 9 r". */
  engePruefen();
  setTimeout(engePruefen, 300);
  setTimeout(engePruefen, 1200);
}

function handleMessage(daten) {
  if (typeof daten === 'string') { try { daten = JSON.parse(daten); } catch (e) { return; } }
  if (!daten || typeof daten !== 'object') { return; }
  zustand = daten;
  zeichne();
}
window.handleMessage = handleMessage;

/* Melden, dass jemand hinsieht — beim Öffnen und dann weiter im Minutentakt.
   Der Stempel drüben verfällt nach drei Minuten, und ohne ihn hört das Modul
   auf, bei der Fahrplanauskunft zu fragen: gemessen am 12.09.2026 stand die
   Tafel nach einer einzigen Meldung 2:50 nach dem letzten Abruf still,
   während die Kachel offen war. Das ist der EINZIGE Zyklus hier — die Daten
   selbst kommen geschoben (UpdateVisualizationValue → handleMessage).

   Nur bei sichtbarer Kachel: eine, die hinter einer anderen Seite liegt, soll
   keine fremde Schnittstelle beschäftigen. Und die Antwort auf jede Meldung
   zeichnet mit, was ohnehin nötig ist — die Minuten laufen weiter. */
if (typeof requestAction === 'function') {
  const melden = () => { try { requestAction('GetState', ''); } catch (e) { /* außerhalb der Visu */ } };
  melden();
  setInterval(() => { if (document.visibilityState === 'visible') melden(); }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') melden();
  });
}
</script>
</body>
</html>
